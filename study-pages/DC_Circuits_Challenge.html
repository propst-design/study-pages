<script>(function(){
'use strict';
const {fmt,pick,rnd,ri,eVal,m,M,svg:S,board:B,esc}=CC;
const K=DCK,fR=K.fR,it=K.it;

/* ---------- TeX helpers for worked solutions ---------- */
const tO=r=>fmt(r)+'\\,\\Omega', tV=x=>fmt(x)+'\\,\\text{V}', tA=x=>fmt(x)+'\\,\\text{A}', tmA=x=>fmt(x*1e3)+'\\,\\text{mA}',
  tW=x=>fmt(x)+'\\,\\text{W}', tmW=x=>fmt(x*1e3)+'\\,\\text{mW}';
const par2=(a,b)=>1/(1/a+1/b);
const q3=x=>x===0?0:+x.toPrecision(3), ident=x=>x;
/* rounding students: plain 3-digit rounding, plus versions nudged ±0.1% so borderline round-half cases go both ways */
const QS=[q3,x=>x===0?0:+(x*1.001).toPrecision(3),x=>x===0?0:+(x*0.999).toPrecision(3)];
const TOL=0.02;

/* ---------- circuit solver ----------
   One routine answers every worksheet. q() rounds each intermediate result: identity for the exact
   answers, 3 significant digits to imitate a careful student (used to reject circuits where normal
   rounding would fail the ±2% tolerance). g: {V, R:[..], PT (W), rx (index of unknown resistor or -1)} */
function solve(top,variant,g,q){
  const R=g.R.slice(),N=R.length;let V=g.V,PT=g.PT,RT,IT,Req,e1,e2;const I=[],Vr=[];
  const sum=(arr,skip)=>arr.reduce((a,b,i)=>i===skip?a:a+b,0);
  if(top==='ser'){
    if(variant==='rx'){RT=q(V*V/PT);IT=q(PT/V);R[g.rx]=q(RT-sum(R,g.rx));}
    else{RT=q(sum(R,-1));if(variant==='src'){IT=q(Math.sqrt(PT/RT));V=q(IT*RT);}else IT=q(V/RT);}
    R.forEach((r,i)=>{I[i]=IT;Vr[i]=q(IT*r);});
  } else if(top==='par'){
    if(variant==='rx'){IT=q(PT/V);RT=q(V/IT);R.forEach((r,i)=>{if(i!==g.rx)I[i]=q(V/r);});I[g.rx]=q(IT-sum(I.map(x=>x||0),g.rx));R[g.rx]=q(V/I[g.rx]);}
    else{RT=q(1/R.reduce((a,r)=>a+1/r,0));if(variant==='src'){V=q(Math.sqrt(PT*RT));}R.forEach((r,i)=>{I[i]=q(V/r);});IT=variant==='src'?q(V/RT):q(sum(I,-1));}
    R.forEach((r,i)=>{Vr[i]=V;});
  } else if(top==='sp3'){
    if(variant==='rx'){RT=q(V*V/PT);IT=q(PT/V);
      if(g.rx===0){Req=q(par2(R[1],R[2]));R[0]=q(RT-Req);}
      else{Req=q(RT-R[0]);const k=g.rx===1?2:1;R[g.rx]=q(1/(1/Req-1/R[k]));}}
    else{Req=q(par2(R[1],R[2]));RT=q(R[0]+Req);if(variant==='src'){IT=q(Math.sqrt(PT/RT));V=q(IT*RT);}else IT=q(V/RT);}
    Vr[0]=q(IT*R[0]);const vp=q(V-Vr[0]);Vr[1]=vp;Vr[2]=vp;I[0]=IT;I[1]=q(vp/R[1]);I[2]=q(vp/R[2]);
  } else if(top==='sp4'){
    e1=q(R[1]+R[3]);e2=q(par2(R[2],e1));RT=q(R[0]+e2);
    if(variant==='src'){IT=q(Math.sqrt(PT/RT));V=q(IT*RT);}else IT=q(V/RT);
    Vr[0]=q(IT*R[0]);Vr[2]=q(V-Vr[0]);I[0]=IT;I[2]=q(Vr[2]/R[2]);const i24=q(Vr[2]/e1);I[1]=i24;I[3]=i24;Vr[1]=q(i24*R[1]);Vr[3]=q(i24*R[3]);
  }
  const P=I.map((x,i)=>q(x*Vr[i]));
  if(variant==='known')PT=q(V*IT);
  return {R,V,PT,RT,IT,I,Vr,P,Req,e1,e2};
}
/** answer list (key, value in display units) */
function answers(top,variant,s,rx){
  const N=s.R.length,a=[['RT',s.RT],['IT',s.IT*1e3]];
  for(let i=0;i<N;i++)a.push(['IR'+(i+1),s.I[i]*1e3]);
  for(let i=0;i<N;i++)a.push(['VR'+(i+1),s.Vr[i]]);
  if(variant==='known'&&top!=='sp4')a.push(['PT',s.PT*1e3]);
  if(variant==='src')a.push(['VS',s.V]);
  if(variant==='rx')a.push(['RX',s.R[rx]]);
  if(top!=='sp4')for(let i=0;i<N;i++)a.push(['PR'+(i+1),s.P[i]*1e3]);
  return a;
}

/* ---------- help text (teaches the order of the calculation) ---------- */
const MA='<b>Watch the units:</b> divide volts by ohms to get amperes, then multiply by 1000 for milliamperes (mA). Power in watts × 1000 = milliwatts (mW).';
function helps(top,N,v,rx){
  const Rs=Array.from({length:N},(_,i)=>'R_'+(i+1));
  const h={};const k=rx+1;
  const pw=i=>['$P_{R'+i+'}=V_{R'+i+'}I_{R'+i+'}','$P_{R'+i+'}=I_{R'+i+'}^2 R_'+i+'\\qquad P_{R'+i+'}=\\frac{V_{R'+i+'}^2}{R_'+i+'}','Any of the three power formulas works once you know two of V, I and R for this resistor. Use the current in amperes, not milliamperes, or your answer will be 1000 times too large.',MA];
  h.PT=['$P_T=V_S I_T','$P_T=I_T^2 R_T\\qquad P_T=\\frac{V_S^2}{R_T}','Total power is the power delivered by the source. It also equals the sum of the individual resistor powers, which is a good check.',MA];
  const ptW='Change P<sub>T</sub> from milliwatts to watts before using it (divide by 1000).';
  if(top==='ser'){
    h.RT=v==='rx'?['$R_T=\\frac{V_S^2}{P_T}','One resistor is unknown, so you cannot add the resistors. Instead use the source voltage and the total power. '+ptW]:['$R_T='+Rs.join('+'),'In a series circuit the total resistance is simply the sum of all the resistors. Do this first: every other answer depends on it.'];
    h.IT=v==='src'?['$I_T=\\sqrt{\\frac{P_T}{R_T}}','The source voltage is unknown, so use '+m('P=I^2R')+' solved for I. Find R<sub>T</sub> first. '+ptW,MA]:v==='rx'?['$I_T=\\frac{P_T}{V_S}','Use '+m('P=VI')+' solved for I. '+ptW,MA]:['$I_T=\\frac{V_S}{R_T}','Ohm\'s law with the total voltage and total resistance gives the total current.',MA];
    for(let i=1;i<=N;i++){h['IR'+i]=['$I_{R'+i+'}=I_T','A series circuit has only one path, so the same current flows through every part.'];h['VR'+i]=['$V_{R'+i+'}=I_{R'+i+'}R_'+i,'Ohm\'s law for this one resistor. Use the current in amperes. Check: the drops must add up to V<sub>S</sub> (Kirchhoff\'s voltage law).'];h['PR'+i]=pw(i);}
    h.RX=['$R_T=\\frac{V_S^2}{P_T}','$R_'+k+'=R_T-(\\text{sum of the known resistors})','Find R<sub>T</sub> from the power first, then subtract the resistors you know. '+ptW];
    h.VS=['$V_S=I_T R_T','Once I<sub>T</sub> (in amperes) and R<sub>T</sub> are known, Ohm\'s law gives the source voltage. Check: it equals the sum of the drops.'];
  }
  if(top==='par'){
    h.RT=v==='rx'?['$R_T=\\frac{V_S}{I_T}','One resistor is unknown, so find I<sub>T</sub> from the total power first, then use Ohm\'s law.']:['$R_T=\\frac{1}{'+Rs.map(r=>'\\frac{1}{'+r+'}').join('+')+'}','Add the reciprocals (1/R) of the branch resistors, then take the reciprocal of the sum. <b>Common mistake:</b> forgetting the final reciprocal. R<sub>T</sub> must be smaller than the smallest branch resistor.'];
    h.IT=v==='src'?['$V_S=\\sqrt{P_T R_T}','$I_T=\\frac{V_S}{R_T}','Find R<sub>T</sub>, then the source voltage from the power, then the total current. '+ptW,MA]:v==='rx'?['$I_T=\\frac{P_T}{V_S}','Use '+m('P=VI')+' solved for I. '+ptW,MA]:['$I_T=\\frac{V_S}{R_T}','$I_T='+Rs.map((_,i)=>'I_{R'+(i+1)+'}').join('+'),'Either method works. Adding the branch currents is a good check on R<sub>T</sub>.',MA];
    for(let i=1;i<=N;i++){h['IR'+i]=(v==='rx'&&i===k)?['$I_{R'+i+'}=I_T-(\\text{sum of the known branch currents})','Kirchhoff\'s current law: the branch currents add up to the total current.',MA]:['$I_{R'+i+'}=\\frac{V_S}{R_'+i+'}','Each branch has the full source voltage across it, so use Ohm\'s law with V<sub>S</sub> and that branch\'s resistor. Smaller resistors carry larger currents.',MA];h['VR'+i]=['$V_{R'+i+'}=V_S','Every branch of a parallel circuit is connected directly across the source, so each has the full source voltage.'];h['PR'+i]=pw(i);}
    h.VS=['$V_S=\\sqrt{P_T R_T}','Find R<sub>T</sub> first, then solve '+m('P=\\frac{V^2}{R}')+' for V. '+ptW];
    h.RX=['$I_{R'+k+'}=I_T-(\\text{sum of the known branch currents})','$R_'+k+'=\\frac{V_S}{I_{R'+k+'}}','Find I<sub>T</sub> from the power, subtract the branch currents you can calculate, then use Ohm\'s law on the unknown branch.'];
  }
  if(top==='sp3'){
    h.RT=v==='rx'?['$R_T=\\frac{V_S^2}{P_T}','One resistor is unknown, so use the source voltage and the total power. '+ptW]:['$R_{eq}=\\frac{R_2 R_3}{R_2+R_3}','$R_T=R_1+R_{eq}','Work from the inside out: R2 and R3 are in parallel, so combine them first. Then add R1, which is in series with that combination.'];
    h.IT=v==='src'?['$I_T=\\sqrt{\\frac{P_T}{R_T}}',ptW,MA]:v==='rx'?['$I_T=\\frac{P_T}{V_S}',ptW,MA]:['$I_T=\\frac{V_S}{R_T}',MA];
    h.IR1=['$I_{R1}=I_T','R1 is in series with the source, so all of the circuit current flows through it.'];
    h.VR1=['$V_{R1}=I_{R1}R_1','Ohm\'s law for R1, using the current in amperes.'];
    h.VR2=['$V_{R2}=V_S-V_{R1}','Kirchhoff\'s voltage law: whatever voltage R1 does not drop appears across the parallel pair. R2 and R3 are in parallel, so they have the same voltage.'];h.VR3=['$V_{R3}=V_{R2}=V_S-V_{R1}','R2 and R3 are in parallel, so they have the same voltage.'];
    h.IR2=['$I_{R2}=\\frac{V_{R2}}{R_2}','Find V<sub>R2</sub> first, then use Ohm\'s law.',MA];h.IR3=['$I_{R3}=\\frac{V_{R3}}{R_3}','Check with Kirchhoff\'s current law: '+m('I_{R2}+I_{R3}=I_T')+'.',MA];
    for(let i=1;i<=3;i++)h['PR'+i]=pw(i);
    h.RX=k===1?['$R_T=\\frac{V_S^2}{P_T}','$R_1=R_T-R_{eq}','Find R<sub>T</sub> from the power. R<sub>eq</sub> is the parallel value of R2 and R3.']:['$R_T=\\frac{V_S^2}{P_T}','$R_{eq}=R_T-R_1','$R_'+k+'=\\frac{1}{\\frac{1}{R_{eq}}-\\frac{1}{R_'+(k===2?3:2)+'}}','Find R<sub>T</sub> from the power, subtract R1 to get the parallel equivalent, then remove the known parallel resistor. Keep 4 significant digits here: this step magnifies rounding errors.'];
    h.VS=['$V_S=I_T R_T','Ohm\'s law for the whole circuit, with I<sub>T</sub> in amperes.'];
  }
  if(top==='sp4'){
    h.RT=['$R_{eq1}=R_2+R_4','$R_{eq2}=\\frac{R_3 R_{eq1}}{R_3+R_{eq1}}','$R_T=R_1+R_{eq2}','Start at the far end of the circuit: R2 and R4 are in series. That pair is in parallel with R3. R1 is in series with everything.'];
    h.IT=v==='src'?['$I_T=\\sqrt{\\frac{P_T}{R_T}}',ptW,MA]:['$I_T=\\frac{V_S}{R_T}',MA];
    h.IR1=['$I_{R1}=I_T','R1 is in series with the source.'];h.VR1=['$V_{R1}=I_{R1}R_1','Use the current in amperes.'];
    h.VR3=['$V_{R3}=V_S-V_{R1}','R3 is in parallel with the series pair R2 + R4, so both see the voltage left over after R1.'];h.IR3=['$I_{R3}=\\frac{V_{R3}}{R_3}',MA];
    h.IR2=['$I_{R2}=I_{R4}=\\frac{V_{R3}}{R_2+R_4}','R2 and R4 are in series, so they carry the same current. The voltage across the pair is V<sub>R3</sub>. Check: '+m('I_{R2}+I_{R3}=I_T')+'.',MA];h.IR4=h.IR2;
    h.VR2=['$V_{R2}=I_{R2}R_2','Check with Kirchhoff\'s voltage law: '+m('V_{R2}+V_{R4}=V_{R3}')+'.'];h.VR4=['$V_{R4}=I_{R4}R_4','Check with Kirchhoff\'s voltage law: '+m('V_{R2}+V_{R4}=V_{R3}')+'.'];
    h.VS=['$V_S=I_T R_T','Ohm\'s law for the whole circuit, with I<sub>T</sub> in amperes.'];
  }
  return h;
}

/* ---------- worked solutions with this problem's numbers ---------- */
function works(top,variant,s,g){
  const w={},N=s.R.length,R=s.R,rx=g.rx,k=rx+1,V=s.V,PT=s.PT,tPT=fmt(PT,variant==='known'?4:5)+'\\,\\text{W}';
  const pT='>Change the total power to watts: '+m(fmt(PT*1e3,5)+'\\,\\text{mW}='+fmt(PT,5)+'\\,\\text{W}')+'.';
  const itStep=()=>variant==='src'?[pT,'I_T=\\sqrt{\\frac{P_T}{R_T}}','I_T=\\sqrt{\\frac{'+tPT+'}{'+tO(s.RT)+'}}='+tA(s.IT),'I_T='+tmA(s.IT)]
    :variant==='rx'?[pT,'I_T=\\frac{P_T}{V_S}','I_T=\\frac{'+tPT+'}{'+tV(V)+'}='+tA(s.IT),'I_T='+tmA(s.IT)]
    :['I_T=\\frac{V_S}{R_T}','I_T=\\frac{'+tV(V)+'}{'+tO(s.RT)+'}='+tA(s.IT),'I_T='+tmA(s.IT)];
  const rtPow=[pT,'R_T=\\frac{V_S^2}{P_T}','R_T=\\frac{('+tV(V)+')^2}{'+tPT+'}','R_T='+tO(s.RT)];
  const vI=i=>['V_{R'+i+'}=I_{R'+i+'}R_'+i,'V_{R'+i+'}=('+tA(s.I[i-1])+')('+tO(R[i-1])+')','V_{R'+i+'}='+tV(s.Vr[i-1])];
  const pR=i=>['P_{R'+i+'}=V_{R'+i+'}I_{R'+i+'}','P_{R'+i+'}=('+tV(s.Vr[i-1])+')('+tA(s.I[i-1])+')='+tW(s.P[i-1]),'P_{R'+i+'}='+tmW(s.P[i-1])];
  w.PT=['P_T=V_S I_T','P_T=('+tV(V)+')('+tA(s.IT)+')='+tPT,'P_T='+tmW(PT),'>Check: '+m(Array.from({length:N},(_,i)=>'P_{R'+(i+1)+'}').join('+')+'='+tmW(s.P.reduce((a,b)=>a+b,0)))+'.'];
  for(let i=1;i<=N;i++)w['PR'+i]=pR(i);
  w.IT=itStep();
  if(top==='ser'){
    w.RT=variant==='rx'?rtPow:['R_T='+R.map((_,i)=>'R_'+(i+1)).join('+'),'R_T='+R.map(tO).join('+'),'R_T='+tO(s.RT)];
    for(let i=1;i<=N;i++){w['IR'+i]=['>A series circuit has one path, so every part carries the total current.','I_{R'+i+'}=I_T='+tmA(s.IT)];w['VR'+i]=vI(i);}
    w.VR1.push('>Check: '+m(R.map((_,i)=>'V_{R'+(i+1)+'}').join('+')+'='+tV(s.Vr.reduce((a,b)=>a+b,0)))+', which equals '+m('V_S')+'.');
    if(variant==='rx'){const kn=R.map((r,i)=>i).filter(i=>i!==rx);w.RX=['R_'+k+'=R_T-('+kn.map(i=>'R_'+(i+1)).join('+')+')','R_'+k+'='+tO(s.RT)+'-('+kn.map(i=>tO(R[i])).join('+')+')','R_'+k+'='+tO(R[rx])];}
    w.VS=['V_S=I_T R_T','V_S=('+tA(s.IT)+')('+tO(s.RT)+')','V_S='+tV(V)];
  }
  if(top==='par'){
    const rec='\\frac{1}{'+R.map(r=>'\\frac{1}{'+tO(r)+'}').join('+')+'}';
    if(variant==='rx')w.RT=['>Find '+m('I_T')+' from the total power first ('+m('I_T='+tmA(s.IT))+').','R_T=\\frac{V_S}{I_T}','R_T=\\frac{'+tV(V)+'}{'+tA(s.IT)+'}','R_T='+tO(s.RT)];
    else w.RT=['R_T=\\frac{1}{'+R.map((_,i)=>'\\frac{1}{R_'+(i+1)+'}').join('+')+'}','R_T='+rec,'R_T='+tO(s.RT)];
    if(variant==='known')w.IT=['I_T=\\frac{V_S}{R_T}','I_T=\\frac{'+tV(V)+'}{'+tO(s.RT)+'}='+tA(s.IT),'I_T='+tmA(s.IT),'>Check: '+m(R.map((_,i)=>'I_{R'+(i+1)+'}').join('+')+'='+tmA(s.I.reduce((a,b)=>a+b,0)))+'.'];
    if(variant==='src')w.IT=[pT,'V_S=\\sqrt{P_T R_T}=\\sqrt{('+tPT+')('+tO(s.RT)+')}='+tV(V),'I_T=\\frac{V_S}{R_T}=\\frac{'+tV(V)+'}{'+tO(s.RT)+'}='+tA(s.IT),'I_T='+tmA(s.IT)];
    for(let i=1;i<=N;i++){
      if(variant==='rx'&&i===k){const kn=R.map((r,j)=>j).filter(j=>j!==rx);w['IR'+i]=['>Kirchhoff\'s current law: the branch currents add up to '+m('I_T')+'.','I_{R'+i+'}=I_T-('+kn.map(j=>'I_{R'+(j+1)+'}').join('+')+')','I_{R'+i+'}='+tmA(s.IT)+'-('+kn.map(j=>tmA(s.I[j])).join('+')+')','I_{R'+i+'}='+tmA(s.I[i-1])];}
      else w['IR'+i]=['I_{R'+i+'}=\\frac{V_S}{R_'+i+'}','I_{R'+i+'}=\\frac{'+tV(V)+'}{'+tO(R[i-1])+'}='+tA(s.I[i-1]),'I_{R'+i+'}='+tmA(s.I[i-1])];
      w['VR'+i]=['>Each branch is connected straight across the source.','V_{R'+i+'}=V_S='+tV(V)];}
    w.VS=[pT,'V_S=\\sqrt{P_T R_T}','V_S=\\sqrt{('+tPT+')('+tO(s.RT)+')}','V_S='+tV(V)];
    if(variant==='rx')w.RX=['>Use the branch current found for '+m('I_{R'+k+'}')+'.','R_'+k+'=\\frac{V_S}{I_{R'+k+'}}','R_'+k+'=\\frac{'+tV(V)+'}{'+tA(s.I[rx])+'}','R_'+k+'='+tO(R[rx])];
  }
  if(top==='sp3'){
    const reqStep=['R_{eq}=\\frac{R_2 R_3}{R_2+R_3}','R_{eq}=\\frac{('+tO(R[1])+')('+tO(R[2])+')}{'+tO(R[1])+'+'+tO(R[2])+'}='+tO(s.Req)];
    w.RT=variant==='rx'?rtPow:[...reqStep,'R_T=R_1+R_{eq}='+tO(R[0])+'+'+tO(s.Req),'R_T='+tO(s.RT)];

    w.IR3=['I_{R3}=\\frac{V_{R3}}{R_3}','I_{R3}=\\frac{'+tV(s.Vr[2])+'}{'+tO(R[2])+'}='+tA(s.I[2]),'I_{R3}='+tmA(s.I[2]),'>Check: '+m('I_{R2}+I_{R3}='+tmA(s.I[1]+s.I[2]))+' = '+m('I_T')+'.'];
    if(variant==='rx'){

      else{const o=rx===1?2:1;w.RX=['R_{eq}=R_T-R_1='+tO(s.RT)+'-'+tO(R[0])+'='+tO(s.Req),'R_'+k+'=\\frac{1}{\\frac{1}{R_{eq}}-\\frac{1}{R_'+(o+1)+'}}','R_'+k+'=\\frac{1}{\\frac{1}{'+tO(s.Req)+'}-\\frac{1}{'+tO(R[o])+'}}','R_'+k+'='+tO(R[rx])];}
      if(rx===0)w.VR1=['>The parallel pair carries all of '+m('I_T')+', so find its voltage first.','V_{R2}=I_T R_{eq}=('+tA(s.IT)+')('+tO(s.Req)+')='+tV(s.Vr[1]),'V_{R1}=V_S-V_{R2}='+tV(V)+'-'+tV(s.Vr[1]),'V_{R1}='+tV(s.Vr[0])];
    }

  }

    w.IR1=['>R1 is in series with the source, so it carries the whole circuit current.','I_{R1}=I_T='+tmA(s.IT)];
    w.VR1=vI(1);
    w.VR3=['V_{R3}=V_S-V_{R1}','V_{R3}='+tV(V)+'-'+tV(s.Vr[0]),'V_{R3}='+tV(s.Vr[2])];
    w.IR3=['I_{R3}=\\frac{V_{R3}}{R_3}','I_{R3}=\\frac{'+tV(s.Vr[2])+'}{'+tO(R[2])+'}='+tA(s.I[2]),'I_{R3}='+tmA(s.I[2])];
    const i24=['>R2 and R4 are in series, so they carry the same current, and the pair has '+m('V_{R3}')+' across it.','I_{R2}=I_{R4}=\\frac{V_{R3}}{R_2+R_4}','I_{R2}=I_{R4}=\\frac{'+tV(s.Vr[2])+'}{'+tO(s.e1)+'}='+tA(s.I[1]),'I_{R2}=I_{R4}='+tmA(s.I[1])];
    w.IR2=i24;w.IR4=i24;
    w.VR2=vI(2);w.VR4=vI(4).concat(['>Check: '+m('V_{R2}+V_{R4}='+tV(s.Vr[1]+s.Vr[3]))+' = '+m('V_{R3}')+'.']);
    w.VS=['V_S=I_T R_T','V_S=('+tA(s.IT)+')('+tO(s.RT)+')','V_S='+tV(V)];
  }
  return w;
}

/* ---------- generators ---------- */
const VS_LIST=[5,6,9,10,12,15,18,20,24,25,30,36,40,45,48];
const DIA={
  ser:(lab,src)=>S.series(lab.map(l=>({t:'R',label:l})),{src:'dc',srcLabel:src}),
  par:(lab,src)=>S.parallel(lab.map(l=>({t:'R',label:l})),{src:'dc',srcLabel:src,gap:80}),
  sp3:(lab,src)=>K.sp3(lab,src),sp4:(lab,src)=>K.sp4(lab,src)
};
const NAMES={RT:['R_T','Total resistance','Ω'],IT:['I_T','Total current','mA'],PT:['P_T','Total power','mW'],VS:['V_S','Source voltage','V']};
/** realistic bench values: every resistor ≤ 1 W, no drop below 0.1 V, no current below 0.05 mA,
    and a student who rounds every step to 3 significant digits still lands inside ±2 %. */
function pickCircuit(top,N,variant){
  for(let t=0;t<4000;t++){
    const R=Array.from({length:N},()=>eVal(100,10000));
    if(top==='par'&&Math.max(...R)/Math.min(...R)>15)continue;
    const V=pick(VS_LIST);let rx=-1;if(variant==='rx')rx=ri(0,N-1);
    const ex=solve(top,'known',{V,R,PT:0,rx:-1},ident);
    if(Math.max(...ex.P)>1||Math.min(...ex.Vr)<0.1||Math.min(...ex.I)<5e-5)continue;
    const PT=+(ex.PT*1e3).toPrecision(5)/1e3;
    const g={V,R:R.map((r,i)=>i===rx?null:r),PT,rx};
    const s=solve(top,variant,g,ident);
    const A=answers(top,variant,s,rx);
    if(QS.some(q=>{const B2=answers(top,variant,solve(top,variant,g,q),rx);return A.some((a,i)=>!(Math.abs(B2[i][1]-a[1])<=0.75*TOL*Math.abs(a[1])));}))continue;
    return {R,V,PT,rx,g,s};
  }
  throw new Error('no circuit');
}
function sheet(top,N,variant){
  return ()=>{
    const {R,V,PT,rx,g,s}=pickCircuit(top,N,variant);
    const h=helps(top,N,variant,rx),w=works(top,variant,s,g);
    const title={ser:'Series circuit',par:'Parallel circuit',sp3:'Series-parallel circuit',sp4:'Series-parallel circuit'}[top];
    const givens=[];
    if(variant!=='src')givens.push({k:'Source voltage, V<sub>S</sub>',v:fmt(V)+' V'});
    R.forEach((r,i)=>{givens.push({k:'R'+(i+1),v:i===rx?'unknown':fR(r)});});
    if(variant!=='known')givens.push({k:'Total power, P<sub>T</sub>',v:fmt(PT*1e3,5)+' mW'});
    const items=answers(top,variant,s,rx).map(([key,val])=>{
      let sym,name,unit;
      if(NAMES[key])[sym,name,unit]=NAMES[key];
      else if(key==='RX'){sym='R_'+(rx+1);name='Unknown resistor R'+(rx+1);unit='Ω';}
      else{const t=key[0],i=key.slice(2);sym=t+'_{R'+i+'}';name={I:'Current through R',V:'Voltage across R',P:'Power in R'}[t]+i;unit={I:'mA',V:'V',P:'mW'}[t];}
      return it(sym,name,unit,val,h[key],{work:w[key]});});
    return {title,diagram:DIA[top](R.map((_,i)=>i===rx?'R'+(i+1)+'\n= ?':'R'+(i+1)),variant==='src'?'VS = ?':'VS'),givens,items,tol:TOL,
      note:(variant==='src'?'The source voltage is not given. Use the total power to find it. ':variant==='rx'?'One resistor value is not given. Use the total power to find it. ':'')+'Enter currents in mA, voltages in V, power in mW and resistance in Ω. Answers within ±2% are correct.'};
  };
}
/* ---------- two-source network ---------- */
function netSolve(E1,E2,R1,R2,R3,q){
  const G=q(q(1/R1)+q(1/R2)+q(1/R3)),num=q(q(E1/R1)+q(E2/R2));const Va=q(num/G);
  const V1=q(E1-Va),V2=q(E2-Va);return {Va,G,num,V1,V2,I1:q(V1/R1),I2:q(V2/R2),I3:q(Va/R3)};
}
function network(){
  let V1,V2,f1,f2,R1,R2,R3,E1,E2,x;
  for(let t=0;t<4000;t++){
    V1=ri(5,30);V2=ri(5,30);f1=Math.random()<0.5;f2=Math.random()<0.5;
    R1=eVal(470,10000);R2=eVal(470,10000);R3=eVal(470,10000);
    E1=f1?-V1:V1;E2=f2?-V2:V2;
    x=netSolve(E1,E2,R1,R2,R3,ident);
    const I=[x.I1,x.I2,x.I3],Vv=[x.V1,x.V2,x.Va],Rr=[R1,R2,R3];
    if(Math.min(...I.map(Math.abs))<2e-4)continue;
    if(Math.max(...I.map((i,k)=>i*i*Rr[k]))>1)continue;
    const ok=QS.every(q=>{const st=netSolve(E1,E2,R1,R2,R3,q);return [[x.I1,st.I1],[x.I2,st.I2],[x.I3,st.I3],[x.V1,st.V1],[x.V2,st.V2],[x.Va,st.Va]].every(([a,b])=>Math.abs(Math.abs(a)-Math.abs(b))<=0.75*TOL*Math.abs(a));});
    if(ok)break;
  }
  const Rr=[R1,R2,R3];
  const help=extra=>['$V_A=\\frac{\\frac{E_1}{R_1}+\\frac{E_2}{R_2}}{\\frac{1}{R_1}+\\frac{1}{R_2}+\\frac{1}{R_3}}',
    'One good method is <b>nodal analysis</b>. Take the bottom wire as 0 V and call the junction at the top of R3 node A. Give each source a sign: '+m('E_1=+V_1')+' if the long (positive) plate of V1 is on top, '+m('E_1=-V_1')+' if it is on the bottom; the same for '+m('E_2')+'. The formula above gives the voltage of node A.',
    ...extra,'<b>Common mistakes:</b> ignoring a reversed source, and rounding '+m('V_A')+' too early. Keep 4 or 5 significant digits until the end. Superposition or mesh analysis give the same answers.'];
  const H={I1:help(['$I_{R1}=\\frac{E_1-V_A}{R_1}','Then use Ohm\'s law on R1. Enter the magnitude in mA.']),I2:help(['$I_{R2}=\\frac{E_2-V_A}{R_2}','Then use Ohm\'s law on R2. Enter the magnitude in mA.']),I3:help(['$I_{R3}=\\frac{V_A}{R_3}','R3 is connected from node A to the 0 V wire.']),
    V1:help(['$V_{R1}=E_1-V_A','The voltage across R1 is the difference between the two ends of R1.']),V2:help(['$V_{R2}=E_2-V_A','The voltage across R2 is the difference between the two ends of R2.']),V3:help(['$V_{R3}=V_A','R3 is connected from node A to the 0 V wire.'])};
  const sgn=E=>(E<0?'-':'')+fmt(Math.abs(E));const sgn5=E=>(E<0?'-':'')+fmt(Math.abs(E),5);
  const base=['>Take the bottom wire as 0 V and call the top of R3 node A. From the schematic, '+m('E_1='+sgn(E1)+'\\,\\text{V}')+' and '+m('E_2='+sgn(E2)+'\\,\\text{V}')+' (negative when the source\'s positive plate faces down).',
    'V_A=\\frac{\\frac{E_1}{R_1}+\\frac{E_2}{R_2}}{\\frac{1}{R_1}+\\frac{1}{R_2}+\\frac{1}{R_3}}',
    'V_A=\\frac{\\frac{'+sgn(E1)+'}{'+fmt(R1)+'}+\\frac{'+sgn(E2)+'}{'+fmt(R2)+'}}{\\frac{1}{'+fmt(R1)+'}+\\frac{1}{'+fmt(R2)+'}+\\frac{1}{'+fmt(R3)+'}}=\\frac{'+fmt(x.num,5)+'}{'+fmt(x.G,5)+'}',
    'V_A='+fmt(x.Va,5)+'\\,\\text{V}'];
  const dir=(i,name,from,to)=>'>'+(i>=0?`The result is positive, so current flows through ${name} from ${from} toward ${to}.`:`The result is negative, so current actually flows through ${name} from ${to} toward ${from}.`);
  const W={I1:[...base,'I_{R1}=\\frac{E_1-V_A}{R_1}=\\frac{'+sgn(E1)+'-('+sgn5(x.Va)+')}{'+tO(R1)+'}='+tmA(x.I1),dir(x.I1,'R1','the V1 side','node A')],
    I2:[...base,'I_{R2}=\\frac{E_2-V_A}{R_2}=\\frac{'+sgn(E2)+'-('+sgn5(x.Va)+')}{'+tO(R2)+'}='+tmA(x.I2),dir(x.I2,'R2','the V2 side','node A')],
    I3:[...base,'I_{R3}=\\frac{V_A}{R_3}=\\frac{'+tV(x.Va)+'}{'+tO(R3)+'}='+tmA(x.I3),dir(x.I3,'R3','node A','the bottom wire'),'>Check (Kirchhoff\'s current law): '+m('I_{R1}+I_{R2}='+tmA(x.I1+x.I2))+' = '+m('I_{R3}')+'.'],
    V1:[...base,'V_{R1}=E_1-V_A='+sgn(E1)+'-('+sgn5(x.Va)+')='+tV(x.V1),'>The magnitude is '+m(tV(Math.abs(x.V1)))+'.'],
    V2:[...base,'V_{R2}=E_2-V_A='+sgn(E2)+'-('+sgn5(x.Va)+')='+tV(x.V2),'>The magnitude is '+m(tV(Math.abs(x.V2)))+'.'],
    V3:[...base,'V_{R3}=V_A='+tV(x.Va)]};
  const opt={signFree:true};
  return {title:'Two-source network',diagram:K.net(f1,f2),
    givens:[{k:'V1',v:V1+' V'},{k:'V2',v:V2+' V'},{k:'R1',v:fR(R1)},{k:'R2',v:fR(R2)},{k:'R3',v:fR(R3)}],
    note:'Source polarity is shown on the schematic: the long plate (marked +) is the positive terminal. Enter magnitudes only (no minus signs); current direction is not graded. Currents in mA, voltages in V. Answers within ±2% are correct.',tol:TOL,
    items:[it('I_{R1}','Current through R1','mA',Math.abs(x.I1*1e3),H.I1,{...opt,absTol:0.002,work:W.I1}),it('I_{R2}','Current through R2','mA',Math.abs(x.I2*1e3),H.I2,{...opt,absTol:0.002,work:W.I2}),it('I_{R3}','Current through R3','mA',Math.abs(x.I3*1e3),H.I3,{...opt,absTol:0.002,work:W.I3}),
      it('V_{R1}','Voltage across R1','V',Math.abs(x.V1),H.V1,{...opt,absTol:0.005,work:W.V1}),it('V_{R2}','Voltage across R2','V',Math.abs(x.V2),H.V2,{...opt,absTol:0.005,work:W.V2}),it('V_{R3}','Voltage across R3','V',Math.abs(x.Va),H.V3,{...opt,absTol:0.005,work:W.V3})],
    _net:{E1,E2,R:Rr}};
}

    Trace:'An open trace disconnects every branch beyond it. Voltage appears across the open trace itself, and the resistors cut off by it read 0 V. The supply current tells you how many branches are still connected.',
    Feed:'An open in a supply trace (Trace 1 or Trace 6) cuts off every branch, so the current is 0 mA. The full supply voltage appears across that trace.',
    Shorted:'A shorted branch shorts the whole supply. The current hits the 500 mA limit and the supply voltage collapses to almost 0 V. Because all branches are in parallel, you cannot tell which resistor is shorted without removing parts.',
    None:'The supply current matches the sum of the branch currents you calculate, and every trace drops 0 V.'},
  SPB:{Series:'R1, R4 and Traces 1, 2 and 5 carry the total current. An open in any of them stops all current, and the supply voltage appears across the open part.',
    Branch:'An open in one parallel branch removes that branch\'s current. The total current falls, so R1 and R4 drop less voltage and the parallel voltage rises. If the open is a trace, the voltage shows up across that trace.',
    Shorted:'A shorted part drops about 0 V and the total current rises. A short across R2 or R3 also shorts the other one, so they look the same.',
    None:'Every drop is close to the value you calculate from the marked resistances, and the traces drop 0 V.'}
};
function clueFor(name,f){
  if(f==='No Faults')return CLUE[name].None;
  if(/Shorted/.test(f))return CLUE[name].Shorted;
  if(name==='SER')return CLUE.SER.Open;
  if(name==='PAR')return /Trace (1|6)/.test(f)?CLUE.PAR.Feed:/Trace/.test(f)?CLUE.PAR.Trace:CLUE.PAR.Open;
  return /R1|R4|Trace (1|2|5)/.test(f)?CLUE.SPB.Series:CLUE.SPB.Branch;
}
function boardFactory(def){
  return (k,forced,exact)=>{
    const R=def.marked();const Ra=exact?R.slice():R.map(r=>r*(1+rnd(-RTOL,RTOL)));
    const Vs0=pick([12,15,18,20,24,30]);const Vs=Vs0*rnd(0.995,1.005);
    const ans=forced!==undefined?forced:ri(0,def.faults.length-1);
    const good=def.elems(Ra).map(e=>Object.assign({},e));
    const elems=def.elems(Ra).map(e=>Object.assign({},e));
    const who=def.apply(def.faults[ans],elems);
    const sol=K.solveLimited(def.nodes,elems,{p:1,n:0,V:Vs,Ri:0.05},0.5);
    const nor=K.solveLimited(def.nodes,good,{p:1,n:0,V:Vs,Ri:0.05},0.5);
    const vm=CC.meterErr(),vs=CC.meterErr();const ab=rnd(-0.008,0.008),am=v=>v*(1+ab+rnd(-0.002,0.002));
    const P=def.pads;
    const measure=(a,b)=>{const v=sol.v[P[a][2]]-sol.v[P[b][2]];const r=vm(v);return {value:r,text:CC.lcd(r)+' V'};};
    const drop=(s,e)=>Math.abs(s.v[e.a]-s.v[e.b]);
    const work=()=>{
      const f=def.faults[ans];
      const rows=good.map(e=>{const nm=e.id[0]==='T'?'Trace '+e.id.slice(1):e.id;return `<tr><td>${nm}</td><td>${CC.lcd(drop(nor,e))} V</td><td><b>${CC.lcd(drop(sol,e))} V</b></td></tr>`;}).join('');
      return ['>'+(f==='No Faults'?'<b>No fault.</b> ':`<b>${esc(f)}${who&&/or/.test(f)?` (this board: ${who})`:''}.</b> `)+clueFor(def.name,f),
        '>With no fault, this board would draw about '+m(fmt(Math.abs(nor.I)*1000,3)+'\\,\\text{mA}')+'; on this board it draws '+m(fmt(Math.abs(sol.I)*1000,3)+'\\,\\text{mA}')+'.',
        `><span class="small">Voltage across each part, without meter error ("No fault" uses this board\'s actual resistor values):</span></p><div class="tablewrap"><table class="t"><thead><tr><th>Part</th><th>No fault</th><th>This board</th></tr></thead><tbody>${rows}</tbody></table></div><p class="small">`,
        '>Good strategy: start with the free supply readings, predict the normal values from the marked resistances, then measure across the parts most likely to explain any difference.'];
    };
    return {faults:def.faults,answer:ans,measure,_sol:sol,_nor:nor,_P:P,_who:who,work,
      pads:Object.keys(P).map(id=>({id,x:P[id][0],y:P[id][1],label:P[id][3]})),
      svg:()=>B.svg(540,340,B.supply(20,8,200,70,'DC POWER SUPPLY',Vs0+' VDC')+B.pcb(20,110,505,220)+def.draw(R)),
      meters:()=>[{label:'Supply DC volts',text:CC.lcd(vs(sol.v[1]),2)},{label:'Supply DC mA',text:CC.lcd(am(Math.abs(sol.I)*1000),2)}],
      info:()=>`Marked values: ${R.map((r,i)=>'R'+(i+1)+' = '+fR(r)).join(', ')}. Resistors are within ±2% of their marked values. The voltmeter can be off by up to 3%; the supply ammeter is accurate to about 1%. The red probe is the positive (+) meter lead. The supply limits its output current to 500 mA.`};
  };
}

function hero(slot){
  const VALS=[270,560,1200,0,Infinity],NAMES=['270 Ω','560 Ω','1200 Ω','short','open'];

    const r=st.map(i=>VALS[i]);const row=k=>r[2*k]+r[2*k+1];const g=[0,1,2].map(row).map(x=>x===Infinity?0:1/Math.max(x,1e-9));const G=g.reduce((a,b)=>a+b,0);
    const RT=G===0?Infinity:1/G;
    CC.$('#ohm',card).textContent=RT===Infinity?'OL':RT<0.5?'0.0 Ω':fmt(RT,4)+' Ω';
    let s=`<rect x="40" y="10" width="300" height="190" rx="8" fill="#0f7a7a" stroke="#0a4f4f" stroke-width="3"/>`;
    s+=`<polyline points="70,40 70,170" stroke="var(--trace)" stroke-width="7" fill="none"/><polyline points="310,40 310,170" stroke="var(--trace)" stroke-width="7" fill="none"/>`;
    [40,105,170].forEach((y,k)=>{s+=`<polyline points="70,${y} 110,${y}" stroke="var(--trace)" stroke-width="7"/><polyline points="170,${y} 210,${y}" stroke="var(--trace)" stroke-width="7"/><polyline points="270,${y} 310,${y}" stroke="var(--trace)" stroke-width="7"/>`;
      [0,1].forEach(j=>{const i=2*k+j,x1=110+j*100,x2=x1+60;const v=st[i];
        s+=`<g class="pad" data-r="${i}" tabindex="0" role="button" aria-label="Resistor ${i+1}: ${NAMES[v]}">`;
        if(v===3)s+=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#ddd" stroke-width="4"/>`;
        else if(v===4)s+=`<line x1="${x1}" y1="${y}" x2="${x1+18}" y2="${y}" stroke="#999" stroke-width="3"/><line x1="${x2-18}" y1="${y}" x2="${x2}" y2="${y}" stroke="#999" stroke-width="3"/>`;
        else s+=B.part('R',[x1,y],[x2,y]).replace(/<text[^>]*>[^<]*<\/text>/,'');
        s+=`<circle cx="${x1}" cy="${y}" r="4" fill="#ccc"/><circle cx="${x2}" cy="${y}" r="4" fill="#ccc"/><text x="${(x1+x2)/2}" y="${y+24}" text-anchor="middle" font-size="11" fill="#fff">${NAMES[v]}</text><rect x="${x1}" y="${y-16}" width="60" height="40" fill="transparent"/></g>`;});});
    s+=`<polyline points="70,105 18,105 18,215 120,215" stroke="#c62828" stroke-width="4" fill="none"/><polyline points="310,105 362,105 362,215 260,215" stroke="#222" stroke-width="4" fill="none"/>`;
    CC.$('#ob',card).innerHTML=`<svg viewBox="0 0 380 222" width="380" height="222" role="img" aria-label="resistor board connected to an ohmmeter">${s}</svg>`;
    CC.$$('[data-r]',card).forEach(g=>{const f=()=>{const i=+g.dataset.r;st[i]=(st[i]+1)%5;draw();};g.onclick=f;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f();}};});
  };
  draw();
}
