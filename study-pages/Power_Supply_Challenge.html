<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Power Supply Challenge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b3261e'/%3E%3Cpath d='M5 16q5.5-12 11 0t11 0' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<style>:root{
  --bg:#f4f1ea; --surface:#fffdf8; --surface2:#f0ece2; --ink:#1d2228; --ink2:#55606b; --line:#d9d2c3;
  --brand:#b3261e; --brand-ink:#fff; --accent:#1f5fa8; --ok:#1e7d43; --ok-bg:#e3f3e8; --bad:#b3261e; --bad-bg:#fbe6e4;
  --warn:#9a6400; --warn-bg:#fdf1d8; --board:#c9a66b; --board-dark:#9c7a42; --trace:#e8c48a; --copper:#b5652b;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06); --r:12px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15181c; --surface:#1e2228; --surface2:#262b33; --ink:#e9e6df; --ink2:#a3abb5; --line:#363c46;
  --brand:#ff6b5e; --brand-ink:#1a0d0b; --accent:#7fb2ff; --ok:#5fd08a; --ok-bg:#16301f; --bad:#ff7a6e; --bad-bg:#3a1c1a;
  --warn:#f0b54a; --warn-bg:#3a2e12; --board:#6b5530; --board-dark:#4e3d22; --trace:#a8854d; --copper:#d58a4d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15181c; --surface:#1e2228; --surface2:#262b33; --ink:#e9e6df; --ink2:#a3abb5; --line:#363c46;
  --brand:#ff6b5e; --brand-ink:#1a0d0b; --accent:#7fb2ff; --ok:#5fd08a; --ok-bg:#16301f; --bad:#ff7a6e; --bad-bg:#3a1c1a;
  --warn:#f0b54a; --warn-bg:#3a2e12; --board:#6b5530; --board-dark:#4e3d22; --trace:#a8854d; --copper:#d58a4d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
math{font-size:1.1em}
math[display="block"]{margin:.4em 0;overflow-x:auto;overflow-y:hidden;max-width:100%}

/* header */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);}
.topbar .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{width:34px;height:34px;flex:none}
.brand{font-weight:800;color:var(--brand);letter-spacing:-.01em;line-height:1.1;font-size:1.05rem;text-decoration:none}
.brand small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw;color:var(--ink2);font-weight:500;font-size:.72rem;letter-spacing:0}
.topbar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 10px;font-size:.85rem;cursor:pointer;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;width:38px;height:38px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}

main{max-width:1100px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:1.6rem;line-height:1.2;margin:.2em 0 .4em;letter-spacing:-.01em}
h2{font-size:1.2rem;margin:1.2em 0 .5em}
h3{font-size:1rem;margin:1em 0 .4em}
p{margin:.5em 0}
.muted{color:var(--ink2)}
.small{font-size:.875rem}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card+.card{margin-top:14px}
.grid{display:grid;gap:12px}
.cols2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.cols2{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:42px;text-decoration:none;color:var(--ink)}
.btn:hover{filter:brightness(.97)}
.btn:focus-visible,.iconbtn:focus-visible,.chip:focus-visible,input:focus-visible,.menu-item:focus-visible,.pad:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.blue{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.875rem;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}

/* home */
.hero{display:grid;gap:16px;grid-template-columns:1fr;align-items:center;margin-bottom:8px}
@media (min-width:860px){.hero{grid-template-columns:1.1fr 1fr}}
.hero h1{font-size:2rem;color:var(--brand);margin:0}
.group-title{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);margin:22px 0 8px;font-weight:700}
.menu{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.menu-item{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;box-shadow:var(--shadow);min-height:64px;width:100%;color:var(--ink)}
.menu-item:hover{border-color:var(--brand)}
.menu-item .ic{width:42px;height:42px;flex:none;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--brand)}
.menu-item .ic svg{width:30px;height:30px}
.menu-item b{display:block;line-height:1.25}
.menu-item span{font-size:.8rem;color:var(--ink2)}
.menu-item .best{margin-left:auto;font-size:.75rem;font-weight:700;color:var(--ok);white-space:nowrap}
.utils{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

/* intro */
.intro-text p{max-width:68ch}
.formulas{display:grid;gap:8px 18px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));align-items:center}
.formula{background:var(--surface2);border-radius:10px;padding:8px 12px;overflow-x:auto}
.formula .cap{font-size:.78rem;color:var(--ink2);display:block}
.diagram{display:flex;justify-content:center;align-items:center;background:var(--surface2);border-radius:10px;padding:10px;overflow:hidden}
.diagram svg{max-width:100%;height:auto}
.where{font-size:.85rem;color:var(--ink2);margin:.2em 0 0;padding-left:1em}

/* status bar */
.statusbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.pill{border-radius:999px;background:var(--surface2);border:1px solid var(--line);padding:3px 10px;font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}

/* givens */
.givens{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.given{background:var(--warn-bg);border-radius:10px;padding:6px 10px}
.given .k{font-size:.8rem;color:var(--ink2)}
.given .v{font-weight:700;font-variant-numeric:tabular-nums;font-size:1.05rem}

/* worksheet rows */
.ws{display:grid;gap:8px}
.wrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--surface)}
.wrow .lab{font-weight:600;text-align:center}
.wrow .inp{display:flex;align-items:center;gap:6px;min-width:0}
.wrow input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 10px;font-variant-numeric:tabular-nums;font-size:1rem}
.wrow .unit{color:var(--ink2);min-width:2.2em;font-size:.95rem}
.wrow .acts{display:flex;gap:6px}
.wrow .fb{grid-column:1/-1;font-size:.875rem;display:none}
.wrow.ok{border-color:var(--ok);background:var(--ok-bg)}
.wrow.bad{border-color:var(--bad);background:var(--bad-bg)}
.wrow.ok .fb,.wrow.bad .fb,.wrow.info .fb{display:block}
.wrow.ok .fb{color:var(--ok)} .wrow.bad .fb{color:var(--bad)}
input.ok{border-color:var(--ok)!important;background:var(--ok-bg)!important}
input.bad{border-color:var(--bad)!important;background:var(--bad-bg)!important}
input.known{background:#dbe8fb!important;border-color:#9dbbe6!important;font-weight:700}
:root[data-theme="dark"] input.known{background:#1d2d47!important;border-color:#35507c!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) input.known{background:#1d2d47!important;border-color:#35507c!important}}
input.ask{background:var(--warn-bg)!important}

/* problems list */
.prob{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.prob-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.field{display:grid;gap:4px;margin:8px 0}
.field label{font-size:.875rem;color:var(--ink2)}
.field input{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:9px 10px;width:100%}
.fields{display:grid;gap:4px 14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.verdict{font-weight:800;font-size:1.25rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.progress{height:6px;border-radius:999px;background:var(--surface2);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--brand);transition:width .3s}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,15,.5);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--surface);border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.35);padding:18px}
.modal h3{margin-top:0}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:120;font-weight:600;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}

/* tables */
table.t{border-collapse:collapse;width:100%;font-size:.9rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.tablewrap{overflow-x:auto}

/* board / troubleshooting */
.board-wrap{background:var(--surface2);border-radius:12px;padding:8px;overflow:hidden}
.board-wrap svg{width:100%;height:auto;display:block;touch-action:manipulation}
.pad{cursor:pointer}
.pad circle.hit{fill:transparent}
.pad:hover circle.ring{stroke:var(--accent);stroke-width:3}
.meter{display:flex;gap:10px;flex-wrap:wrap}
.lcd{font-family:var(--mono);background:#9fb59a;color:#0f1a0e;border-radius:6px;padding:4px 10px;font-size:1.35rem;min-width:7.5ch;text-align:right;box-shadow:inset 0 2px 4px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.meterbox{background:#3b3f45;color:#eee;border-radius:10px;padding:8px 10px;display:grid;gap:4px;justify-items:start}
.meterbox .ml{font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:#c9cdd2}
.faults{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.faults label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--surface)}
.faults input{accent-color:var(--brand);width:18px;height:18px}
.faults label.correct{border-color:var(--ok);background:var(--ok-bg)}
.faults label.wrong{border-color:var(--bad);background:var(--bad-bg)}

/* certificate */
.cert{background:#fffdf4;color:#222;border:10px double #8a6d1f;padding:28px;text-align:center;border-radius:6px;max-width:760px;margin:0 auto}
.cert h2{font-family:Georgia,serif;font-size:2rem;margin:.2em 0;color:#7a1610}
.cert .big{font-family:Georgia,serif;font-size:1.6rem;margin:.3em 0}
.cert dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;text-align:left;max-width:460px;margin:18px auto 0}
.cert dt{color:#666}
.cert dd{margin:0;font-weight:600}

.kbd{font-family:var(--mono);background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:.85em}
.hide{display:none!important}
.center{text-align:center}
.mt{margin-top:14px}
.anim-bulb{transition:opacity .3s}

@media print{
  .topbar,.noprint,.toast,.scrim{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0;max-width:none}
  .card{box-shadow:none;border:none}
  .cert{border-color:#8a6d1f}
}

@media (max-width:520px){.brand small{display:none}.brand{font-size:1rem}h1{font-size:1.35rem}.hero h1{font-size:1.6rem}main{padding:12px 12px 60px}.card{padding:12px}.wrow{grid-template-columns:48px minmax(0,1fr) auto;padding:6px}}

.work{margin-top:6px;color:var(--ink)}.work summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:.875rem}.work[open]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}.work math{font-size:1em}
</style>

<script>/* Circuits Challenge offline engine. No network access, no external libraries. */
(function(){
'use strict';
const CC = window.CC = {};

/* ---------- small utils ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
CC.$ = $; CC.$$ = $$;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
CC.esc = esc;
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
CC.el = el;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
Object.assign(CC,{rnd,ri,pick,shuffle});
CC.E12=[1,1.2,1.5,1.8,2.2,2.7,3.3,3.9,4.7,5.6,6.8,8.2];
CC.E6=[1,1.5,2.2,3.3,4.7,6.8];
/** random value from an E-series between lo and hi (inclusive) */
CC.eVal=function(lo,hi,series=CC.E12){const out=[];for(let d=-15;d<=9;d++){for(const m of series){const v=+(m*Math.pow(10,d)).toPrecision(3);if(v>=lo*0.999&&v<=hi*1.001)out.push(v);}}return pick(out);};
/** round to nearest E-series value */
CC.eNear=function(x,series=CC.E12){const d=Math.floor(Math.log10(x));let best=null,bd=1e99;for(const dd of [d-1,d,d+1])for(const m of series){const v=+(m*Math.pow(10,dd)).toPrecision(3);const e=Math.abs(Math.log(v/x));if(e<bd){bd=e;best=v;}}return best;};
CC.sig=(x,n=3)=>x===0?0:+x.toPrecision(n);
/** format number for display: up to `n` significant figures, no exponent, trims zeros */
CC.fmt=function(x,n=4){
  if(x===null||x===undefined||isNaN(x))return '—';
  if(!isFinite(x))return '∞';
  if(Math.abs(x)<1e-12)return '0';
  let v=+x.toPrecision(n);
  let s;
  const a=Math.abs(v);
  if(a>=1e15||a<1e-9) s=v.toExponential(n-1);
  else { const dec=Math.max(0,n-1-Math.floor(Math.log10(a))); s=v.toFixed(Math.min(dec,12)); if(s.indexOf('.')>=0)s=s.replace(/0+$/,'').replace(/\.$/,''); }
  // thousands separators for readability on integers part
  const parts=s.split('.'); if(Math.abs(v)>=10000) parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,','); return parts.join('.');
};
/** parse a typed number. Accepts "1,234.5", "1.2e3", "−5", and SI suffixes k, M, m, u/µ, n, p if allowSuffix */
CC.parse=function(str,allowSuffix=true){
  if(str===null||str===undefined)return NaN;
  let s=String(str).trim().replace(/[−–]/g,'-').replace(/\s+/g,'');
  if(!s)return NaN;
  s=s.replace(/,(?=\d{3}(\D|$))/g,'');
  s=s.replace(/,/g,'.');
  let mult=1;
  if(allowSuffix){const m=s.match(/^(.*?)([kKMmuµnp])$/);if(m&&m[1]!==''&&!isNaN(+m[1])){mult={k:1e3,K:1e3,M:1e6,m:1e-3,u:1e-6,'µ':1e-6,n:1e-9,p:1e-12}[m[2]];s=m[1];}}
  if(!/^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(s))return NaN;
  return parseFloat(s)*mult;
};
/** compare typed value with correct value */
CC.prefixed=u=>/^(m|k|µ|μ|M|n|p|G)./.test(u||'');
CC.close=function(user,correct,tol=0.02,absTol=null){
  if(isNaN(user))return false;
  if(absTol===null) absTol=Math.max(1e-9,Math.abs(correct)*1e-6);
  if(Math.abs(user-correct)<=absTol)return true;
  return Math.abs(user-correct)<=Math.abs(correct)*tol;
};
CC.fmtTime=function(ms){const s=Math.round(ms/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(ss).padStart(2,'0');};
CC.deg=r=>r*180/Math.PI;
CC.rad=d=>d*Math.PI/180;

/* complex numbers */
const Cx=CC.Cx={
  c:(re,im=0)=>({re,im}),
  add:(a,b)=>({re:a.re+b.re,im:a.im+b.im}),
  sub:(a,b)=>({re:a.re-b.re,im:a.im-b.im}),
  mul:(a,b)=>({re:a.re*b.re-a.im*b.im,im:a.re*b.im+a.im*b.re}),
  div:(a,b)=>{const d=b.re*b.re+b.im*b.im;return {re:(a.re*b.re+a.im*b.im)/d,im:(a.im*b.re-a.re*b.im)/d};},
  abs:a=>Math.hypot(a.re,a.im),
  inv:a=>Cx.div({re:1,im:0},a),
  par:(a,b)=>Cx.div(Cx.mul(a,b),Cx.add(a,b))
};

/* ---------- storage (best effort) ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}},
  del(k){try{localStorage.removeItem(k);}catch(e){}}
};
CC.store=store;

/* ---------- TeX-subset → MathML ---------- */
const GREEK={alpha:'α',beta:'β',gamma:'γ',delta:'δ',theta:'θ',pi:'π',omega:'ω',phi:'φ',lambda:'λ',tau:'τ',mu:'μ',rho:'ρ',sigma:'σ',epsilon:'ε',eta:'η',
  Omega:'Ω',Delta:'Δ',Sigma:'Σ',Phi:'Φ',Theta:'Θ',Lambda:'Λ'};
const OPS={cdot:'·',times:'×',approx:'≈',pm:'±',to:'→',ne:'≠',le:'≤',ge:'≥',angle:'∠',infty:'∞',deg:'°',div:'÷',parallel:'∥',cdots:'⋯',ldots:'…',
  overline:null,rightarrow:'→',leftarrow:'←',Rightarrow:'⇒',equiv:'≡',neg:'¬',oplus:'⊕',odot:'⊙',vee:'∨',wedge:'∧',bar:null};
function texToMathML(src,block){
  const p={s:src,i:0,up:0};
  const body=seq(p,null);
  return '<math'+(block?' display="block"':'')+'><mrow>'+body+'</mrow></math>';
}
CC.tex=texToMathML;
CC.m=s=>texToMathML(s,false);
CC.M=s=>texToMathML(s,true);
function seq(p,end){
  let out='';
  while(p.i<p.s.length){
    const c=p.s[p.i];
    if(end&&c===end){p.i++;return out;}
    if(c===' '){p.i++;continue;}
    let base=atom(p); if(base===null)continue;
    let sub=null,sup=null;
    for(;;){
      while(p.s[p.i]===' ')p.i++;
      const d=p.s[p.i];
      if(d==='_'){p.i++;p.up++;sub=arg(p);p.up--;}
      else if(d==='^'){p.i++;sup=arg(p);}
      else break;
    }

/* ---------- modal / toast ---------- */
CC.modal=function(html,buttons=[{label:'Close',primary:true}],opts={}){
  return new Promise(res=>{
    const sc=el(`<div class="scrim" role="dialog" aria-modal="true"><div class="modal">${html}<div class="row end mt modal-btns"></div></div></div>`);
    const bb=$('.modal-btns',sc);
    const close=v=>{sc.remove();document.removeEventListener('keydown',onKey);res(v);};
    buttons.forEach((b,i)=>{const x=el(`<button class="btn ${b.primary?'primary':''} ${b.cls||''}">${b.label}</button>`);x.onclick=()=>{if(b.onClick&&b.onClick(sc)===false)return;close(b.value!==undefined?b.value:i);};bb.appendChild(x);});
    const onKey=e=>{if(e.key==='Escape'&&!opts.noEscape)close(-1);};
    document.addEventListener('keydown',onKey);
    sc.addEventListener('click',e=>{if(e.target===sc&&!opts.noEscape)close(-1);});
    document.body.appendChild(sc);
    const f=$('input',sc)||$('.btn.primary',sc);if(f)setTimeout(()=>f.focus(),30);
    if(opts.onOpen)opts.onOpen(sc);
  });
};
CC.confirm=(msg,yes='Yes',no='Cancel')=>CC.modal(`<p>${msg}</p>`,[{label:no,value:false},{label:yes,primary:true,value:true}]).then(v=>v===true);
CC.toast=function(msg,ms=2200){const t=el(`<div class="toast" role="status">${msg}</div>`);document.body.appendChild(t);setTimeout(()=>t.remove(),ms);};

/* ---------- validity code ---------- */
function hashStr(s){let h1=0x811c9dc5,h2=0x1b873593;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,16777619);h2=Math.imul(h2^c,2246822507);h2^=h2>>>13;}return [h1>>>0,h2>>>0];}
CC.validity=function(prog,name,id,title,score,time,date){
  const norm=[prog,name.trim().toUpperCase(),String(id).trim(),title.trim().toUpperCase(),String(score).trim(),String(time).trim(),String(date).trim()].join('|');
  const [a,b]=hashStr(norm);const A='ABCDEFGHJKLMNPQRSTUVWXYZ';let out='';let x=a,y=b;
  for(let i=0;i<10;i++){const v=(i<5?x:y);out+=A[v%A.length];if(i<5)x=Math.floor(x/A.length);else y=Math.floor(y/A.length);}
  return out.slice(0,5)+'-'+out.slice(5);
};

App.askStudent=function(force){

      <div class="field"><label for="sid">ID code (2–9 digits)</label><input id="sid" inputmode="numeric" value="${cur?esc(cur.id):''}"></div>

      [{label:'Practice without signing in',value:'skip'},{label:'Save',primary:true,value:'ok',onClick:sc=>{

        if(!/^\d{2,9}$/.test(i)){$('#serr',sc).textContent='ID code must have between 2 and 9 digits.';return false;}

App.view=()=>$('#view');
App.route=function(){
  const h=location.hash.replace(/^#\/?/,'');const [r,a]=h.split('/');
  if(App.running&&App.running.cleanup){App.running.cleanup();}
  App.running=null;
  window.scrollTo(0,0);
  const v=App.view();v.innerHTML='';
  if(!r)return App.home(v);
  if(r==='m'&&App.mods[a])return App.intro(v,App.mods[a]);
  if(r==='run'&&App.mods[a])return App.run(v,App.mods[a]);
  if(r==='grades')return App.grades(v);
  if(r==='validity')return App.validityView(v);
  if(r==='manual')return App.manual(v);
  if(r==='options')return App.options(v);
  if(r==='cert')return App.certificate(v);
  if(r==='x'&&App.cfg.extra&&App.cfg.extra[a])return App.cfg.extra[a](v);
  App.home(v);
};

App.intro=function(v,m){
  const wrap=el(`<div><div class="row noprint" style="margin-bottom:8px"><a class="btn sm ghost" href="#/">← Main menu</a></div><h1>${esc(m.title)}</h1><div class="card" id="introBody"></div>

  v.appendChild(wrap);
  const body=$('#introBody',wrap);
  if(typeof m.intro==='function')m.intro(body);else body.innerHTML=m.intro||'';
  $('#begin',wrap).onclick=async()=>{

App.run=function(v,m){
  const s=new Session(m);
  App.running=s;
  const wrap=el(`<div><div class="row noprint" style="margin-bottom:8px;justify-content:space-between"><button class="btn sm ghost" id="quitx">← Quit</button><span class="small muted">${esc(m.title)}</span></div><div id="ex"></div></div>`);
  v.appendChild(wrap);
  $('#quitx',wrap).onclick=async()=>{if(s.done||await CC.confirm('Quit this exercise without grading?','Quit'))location.hash='#/';};
  m.run($('#ex',wrap),s);
};
class Session{
  constructor(m){this.m=m;this.t0=Date.now();this.done=false;this.timers=[];}
  elapsed(){return Date.now()-this.t0;}
  every(fn,ms){const t=setInterval(fn,ms);this.timers.push(t);return t;}
  cleanup(){this.timers.forEach(clearInterval);}
  restart(){location.hash='#/run/'+this.m.id;App.route();}
  finish(score,summary){
    if(this.done)return;this.done=true;this.cleanup();
    score=Math.max(0,Math.min(100,Math.round(score)));
    const st=App.student();
    const time=CC.fmtTime(this.elapsed());
    const d=new Date();const date=d.toLocaleString(undefined,{year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const rec={mid:this.m.id,title:this.m.title,score,time,date,name:st&&!App.guest?st.name:'(practice)',id:st&&!App.guest?st.id:''};
    if(this.m.graded!==false){const g=store.get(App.key('grades'),[]);g.push(rec);store.set(App.key('grades'),g.slice(-500));}
    App.last=rec;
    const pass=App.cfg.pass||80;
    const certOk=App.opts().certs&&rec.id;
    return CC.modal(`<h3>Exercise completed</h3><p class="verdict ${score>=pass?'ok':'bad'}">Score: ${score}%</p><p class="muted">Time on task: ${time}</p>${summary?`<div class="small">${summary}</div>`:''}${!rec.id?'<p class="small muted">Sign in with a name and ID to print a certificate.</p>':''}`,
      [{label:'Main menu',value:'menu'},{label:'Review',value:'review'},...(certOk?[{label:'Certificate',value:'cert'}]:[]),{label:'Try again',primary:true,value:'again'}],{noEscape:false}).then(v=>{
        if(v==='menu')location.hash='#/';
        else if(v==='cert')location.hash='#/cert';
        else if(v==='again')this.restart();
      });
  }
}
CC.Session=Session;

/* ---------- exercise kit: helpers for intro pages ---------- */
CC.introPage=function({text,formulas,diagram,extra,how}){
  let h='';
  if(diagram)h+=`<div class="diagram" style="margin-bottom:12px">${diagram}</div>`;
  if(text)h+=`<div class="intro-text">${text}</div>`;
  if(formulas&&formulas.length){h+=`<h3>Key relationships</h3><div class="formulas">${formulas.map(f=>`<div class="formula">${f.cap?`<span class="cap">${f.cap}</span>`:''}${CC.M(f.tex||f)}${f.where?`<div class="where">${f.where}</div>`:''}</div>`).join('')}</div>`;}
  if(extra)h+=extra;
  if(how)h+=`<h3>How this exercise works</h3><div class="small intro-text">${how}</div>`;
  return h;
};

/* worked solution renderer: steps are TeX strings (math) or strings starting with '>' (prose) */
CC.workHTML=function(steps,label='Show worked solution'){
  if(!steps||!steps.length)return '';
  const body=steps.map(t=>typeof t==='string'&&t.startsWith('>')?`<p class="small">${t.slice(1)}</p>`:CC.M(t)).join('');
  return `<details class="work"><summary>${label}</summary>${body}</details>`;
};
/* ---------- Worksheet: one circuit, many answers, Check (-2) Help (-3) Grade ---------- */
CC.worksheet=function(root,s,spec){
  CC._last=spec;
  const checkCost=spec.checkCost??2, helpCost=spec.helpCost??3, N=spec.items.length;
  let pen=0;const helped=new Set();
  const w=el(`<div>
    <div class="statusbar"><span class="pill" id="wpen">Deductions: 0</span><span class="pill" id="wtime">0:00</span><span class="pill small">Check: −${checkCost} if wrong${helpCost?` · Help: −${helpCost}`:''}</span></div>
    <div class="cols2"><div><div class="card"><h2 style="margin-top:0">${esc(spec.title||'Circuit')}</h2><div class="diagram">${spec.diagram||''}</div><div class="givens">${spec.givens.map(g=>`<div class="given"><div class="k">${g.k}</div><div class="v">${g.v}</div></div>`).join('')}</div>${spec.note?`<p class="small muted">${spec.note}</p>`:''}</div><div id="wextra"></div></div>
    <div><div class="card"><h2 style="margin-top:0">Find</h2><div class="ws" id="ws"></div>
    <div class="row end mt"><button class="btn primary" id="wgrade">Grade</button></div></div></div></div></div>`);
  root.appendChild(w);
  const wsEl=$('#ws',w);
  const upd=()=>{$('#wpen',w).textContent='Deductions: '+pen;$('#wpen',w).className='pill'+(pen?' bad':'');};
  s.every(()=>{$('#wtime',w).textContent=CC.fmtTime(s.elapsed());},1000);
  const ok=(it,val)=>{if(it.signFree)return CC.close(Math.abs(val),Math.abs(it.value),it.tol??spec.tol??0.02,it.absTol??null);return CC.close(val,it.value,it.tol??spec.tol??0.02,it.absTol??null);};
  spec.items.forEach((it,i)=>{
    const r=el(`<div class="wrow"><div class="lab">${CC.m(it.sym)}</div><div class="inp"><input type="text" inputmode="decimal" autocomplete="off" aria-label="${esc(it.name||it.sym)}"><span class="unit">${esc(it.unit||'')}</span></div>
      <div class="acts"><button class="btn sm" data-a="c" title="Check your answer. Cost: ${checkCost} points if wrong." aria-label="Check">${IC.check.replace('<svg','<svg width="18" height="18"')}</button><button class="btn sm" data-a="h" title="Formulas and hints. Cost: ${helpCost} points." aria-label="Help">?</button></div><div class="fb"></div></div>`);
    it._row=r;const inp=$('input',r);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const nx=spec.items[i+1];if(nx)$('input',nx._row).focus();else $('#wgrade',w).focus();}});
    $('[data-a=c]',r).onclick=()=>{
      const val=CC.parse(inp.value,!CC.prefixed(it.unit));
      if(isNaN(val)){CC.toast('Type a number first.');return;}
      if(ok(it,val)){r.className='wrow ok';$('.fb',r).textContent='Right!';}
      else{pen+=checkCost;r.className='wrow bad';$('.fb',r).textContent=`Not right — ${checkCost} points deducted.`;upd();}
    };
    $('[data-a=h]',r).onclick=async()=>{
      const first=!helped.has(i);
      if(first){const go=await CC.modal(`<h3>Help for ${CC.m(it.sym)}</h3><p>Help shows the formula and method for this item. It costs ${helpCost} points, charged once per item.</p><p class="small muted">Choose Exit help to go back with no penalty.</p>`,[{label:'Exit help',value:false},{label:`Show help (−${helpCost})`,primary:true,value:true}]);
        if(go!==true)return;helped.add(i);pen+=helpCost;upd();}
      CC.modal(`<h3>${CC.m(it.sym)}${it.name?` — ${esc(it.name)}`:''}</h3>${(it.help||[]).map(h=>typeof h==='string'&&h.startsWith('$')?CC.M(h.slice(1)):`<p>${h}</p>`).join('')}`);
    };
    wsEl.appendChild(r);
  });
  $('#wgrade',w).onclick=async()=>{
    const blanks=spec.items.filter(it=>!$('input',it._row).value.trim()).length;
    if(blanks&&!(await CC.confirm(`${blanks} answer${blanks>1?'s are':' is'} blank and will be graded as wrong. Grade now?`,'Grade')))return;
    let right=0;
    spec.items.forEach(it=>{const inp=$('input',it._row);const val=CC.parse(inp.value,!CC.prefixed(it.unit));const good=!isNaN(val)&&ok(it,val);if(good)right++;inp.disabled=true;
      it._row.className='wrow '+(good?'ok':'bad');$('.fb',it._row).innerHTML=(good?'Right! ':'')+`Correct answer: <b>${CC.fmt(it.value)} ${esc(it.unit||'')}</b>`+CC.workHTML(typeof it.work==='function'?it.work():it.work);$$('button',it._row).forEach(b=>b.disabled=true);});
    $('#wgrade',w).disabled=true;
    const raw=right/N*100;const score=raw-pen;
    if(spec.after)spec.after($('#wextra',w));
    s.finish(score,`${right} of ${N} answers correct (${Math.round(raw)}%), minus ${pen} points for checks and help.`);
    const again=el('<div class="row end mt noprint"><button class="btn primary">New problem</button></div>');$('button',again).onclick=()=>s.restart();$('#wgrade',w).parentNode.after(again);
  };
};

/* ---------- Problem set: N problems one at a time, each graded immediately ---------- */
CC.problemSet=function(root,s,spec){
  const N=spec.count;let i=0,right=0,total=0;const log=[];
  const probs=spec.list?spec.list():Array.from({length:N},(_,k)=>spec.gen(k));
  CC._last=probs;
  const w=el(`<div><div class="statusbar"><span class="pill" id="pn"></span><span class="pill" id="ps">Correct: 0</span><span class="pill" id="pt">0:00</span></div><div class="progress"><i id="pb" style="width:0"></i></div><div id="pbody" class="mt"></div></div>`);
  root.appendChild(w);
  s.every(()=>{$('#pt',w).textContent=CC.fmtTime(s.elapsed());},1000);
  const show=()=>{
    const p=probs[i];
    $('#pn',w).textContent=`Problem ${i+1} of ${probs.length}`;$('#pb',w).style.width=(i/probs.length*100)+'%';
    const body=$('#pbody',w);body.innerHTML='';
    const card=el(`<div class="card"><div class="cols2"><div>${p.title?`<h2 style="margin-top:0">${p.title}</h2>`:''}${p.prompt?`<div>${p.prompt}</div>`:''}${p.diagram?`<div class="diagram mt">${p.diagram}</div>`:''}</div>
      <div><div class="fields" id="pf"></div><div id="pfb"></div><div class="row end mt"><button class="btn primary" id="pg">${spec.gradeLabel||'Grade answers'}</button></div></div></div></div>`);
    body.appendChild(card);
    const pf=$('#pf',card);
    p.fields.forEach(f=>{
      let fe;
      if(f.choices){
        fe=el(`<div class="field"><label>${f.label}</label><div class="faults">${f.choices.map((c,ci)=>`<label><input type="radio" name="ch_${f.key}" value="${ci}"> <span>${c}</span></label>`).join('')}</div></div>`);
      } else {
        fe=el(`<div class="field"><label>${f.label}${f.unit?` <span class="muted">(${esc(f.unit)})</span>`:''}</label><input type="text" inputmode="${f.text?'text':'decimal'}" autocomplete="off" ${f.given?'readonly':''} class="${f.given?'known':'ask'}" value="${f.given?esc(f.show||CC.fmt(f.value)):''}"></div>`);
        const inp=$('input',fe);inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const all=$$('input:not([readonly])',pf);const k=all.indexOf(inp);if(all[k+1])all[k+1].focus();else $('#pg',card).click();}});
      }
      f._el=fe;pf.appendChild(fe);
    });
    const firstAsk=$('input:not([readonly])',pf);if(firstAsk&&window.innerWidth>700)firstAsk.focus();
    $('#pg',card).onclick=()=>{
      const btn=$('#pg',card);
      if(btn.dataset.done){i++;if(i>=probs.length)return end();return show();}
      let pr=0,pt=0;const fbs=[];
      p.fields.forEach(f=>{if(f.given)return;pt++;let good;
        if(f.choices){const c=$('input:checked',f._el);good=c&&+c.value===f.answer;$$('.faults label',f._el).forEach((lb,ci)=>{if(ci===f.answer)lb.classList.add('correct');else if(c&&+c.value===ci)lb.classList.add('wrong');});$$('input',f._el).forEach(x=>x.disabled=true);}
        else{const inp=$('input',f._el);
          if(f.check)good=f.check(inp.value);
          else if(f.text)good=inp.value.trim().toUpperCase().replace(/\s+/g,'')===String(f.value).toUpperCase().replace(/\s+/g,'');
          else{const v=CC.parse(inp.value,f.suffix!==false&&!CC.prefixed(f.unit));good=f.signFree?CC.close(Math.abs(v),Math.abs(f.value),f.tol??spec.tol??0.02,f.absTol??null):CC.close(v,f.value,f.tol??spec.tol??0.02,f.absTol??null);}
          inp.classList.add(good?'ok':'bad');inp.readOnly=true;
          if(!good)fbs.push(`${f.label}: correct answer is <b>${f.show||CC.fmt(f.value)}${f.unit?' '+esc(f.unit):''}</b>`);}
        if(good)pr++;});
      right+=pr;total+=pt;log.push({i,pr,pt});
      $('#ps',w).textContent=`Correct: ${right} of ${total}`;
      const allGood=pr===pt;
      $('#pfb',card).innerHTML=`<p class="verdict ${allGood?'ok':'bad'}">${allGood?'Correct!':(pr?`${pr} of ${pt} correct`:'Incorrect')}</p>${fbs.length?`<p class="small">${fbs.join('<br>')}</p>`:''}${p.explain?`<div class="formula mt">${p.explain}</div>`:''}${CC.workHTML(typeof p.work==='function'?p.work():p.work)}`;
      btn.dataset.done='1';btn.textContent=i+1<probs.length?'Next problem':'Finish';btn.focus();
    };
  };
  const end=()=>{$('#pb',w).style.width='100%';const score=total?right/total*100:0;s.finish(score,`${right} of ${total} answers correct.`);
    const again=el('<div class="card mt center"><p>Exercise finished.</p><div class="row" style="justify-content:center"><a class="btn" href="#/">Main menu</a><button class="btn primary">New problem set</button></div></div>');$('button',again).onclick=()=>s.restart();$('#pbody',w).appendChild(again);};
  show();
};

/* ---------- Troubleshooting: PC board, probes, meter, fault list ---------- */
/* spec: {count, points, build(k)=>{svg(state)->string, pads:[{id,x,y}], faults:[names], answer:index, measure(a,b)->{text,value}, info(): html, meters(): [{label,text}]}} */
CC.trouble=function(root,s,spec){
  const N=spec.count||10, P=spec.points||10;let k=0,earned=0;
  const w=el(`<div><div class="statusbar"><span class="pill" id="tn"></span><span class="pill" id="tp"></span><span class="pill" id="ts">Score: 0</span><span class="pill" id="tt">0:00</span></div><div id="tbody"></div></div>`);
  root.appendChild(w);
  s.every(()=>{$('#tt',w).textContent=CC.fmtTime(s.elapsed());},1000);
  const next=()=>{
    const b=spec.build(k);let pts=P;CC._last=b;
    if(!b.padName)b.padName=id=>{const p=b.pads.find(q=>q.id===id);return p&&p.label||id;};let probe={red:null,black:null,active:'red'};let lastKey=null;const readings=[];
    $('#tn',w).textContent=`Problem ${k+1} of ${N}`;
    const updP=()=>{$('#tp',w).textContent=`${pts} point${pts===1?'':'s'} remain for this item`;$('#tp',w).className='pill'+(pts<P/2?' bad':'');};
    updP();
    const body=$('#tbody',w);body.innerHTML='';
    const card=el(`<div class="cols2"><div><div class="card"><div class="board-wrap" id="bw"></div>
      <div class="row mt" style="justify-content:space-between"><div class="row"><span class="small muted">Tap a pad to move the</span><button class="btn sm" id="pr" style="border-color:#c62828">● Red probe</button><button class="btn sm" id="pk">● Black probe</button></div></div>
      <div class="meter mt" id="mt"></div><div class="small muted mt" id="info"></div></div></div>
      <div><div class="card"><h3 style="margin-top:0">${spec.selectLabel||'Select the circuit fault'}</h3><div class="faults" id="fl"></div><div class="row end mt"><button class="btn primary" id="tg">Grade item</button></div><div id="tfb"></div></div>
      <div class="card"><h3 style="margin-top:0">Readings</h3><div class="small" id="rlog"><span class="muted">No readings yet. Each new reading costs 1 point.</span></div></div></div></div>`);
    body.appendChild(card);
    $('#info',card).innerHTML=b.info?b.info():'';
    const fl=$('#fl',card);b.faults.forEach((f,i)=>fl.appendChild(el(`<label><input type="radio" name="flt" value="${i}"> <span>${esc(f)}</span></label>`)));
    const setActive=a=>{probe.active=a;$('#pr',card).classList.toggle('blue',a==='red');$('#pk',card).classList.toggle('blue',a==='black');};
    $('#pr',card).onclick=()=>setActive('red');$('#pk',card).onclick=()=>setActive('black');setActive('red');
    const meterHTML=()=>{
      const ms=(b.meters?b.meters():[]).map(m=>`<div class="meterbox"><span class="ml">${m.label}</span><span class="lcd">${m.text}</span></div>`).join('');
      let main='----';
      if(probe.red&&probe.black){main=b.measure(probe.red,probe.black).text;}
      return `<div class="meterbox"><span class="ml">${spec.meterLabel||'Voltmeter'}</span><span class="lcd">${main}</span></div>`+ms;
    };
    const draw=()=>{
      const pads=b.pads.map(p=>{const r=probe.red===p.id,bl=probe.black===p.id;
        return `<g class="pad" data-id="${p.id}" tabindex="0" role="button" aria-label="Test point ${esc(p.label||p.id)}"><circle class="ring" cx="${p.x}" cy="${p.y}" r="7" fill="#d8d8d8" stroke="#777" stroke-width="2"/><circle cx="${p.x}" cy="${p.y}" r="2.5" fill="#555"/>${r?`<circle cx="${p.x}" cy="${p.y}" r="11" fill="none" stroke="#d32f2f" stroke-width="4"/><text x="${p.x+12}" y="${p.y-10}" fill="#d32f2f" font-weight="800" font-size="14">+</text>`:''}${bl?`<circle cx="${p.x}" cy="${p.y}" r="${r?15:11}" fill="none" stroke="#111" stroke-width="4"/><text x="${p.x-20}" y="${p.y-10}" fill="#111" font-weight="800" font-size="16">−</text>`:''}<circle class="hit" cx="${p.x}" cy="${p.y}" r="16"/></g>`;}).join('');
      $('#bw',card).innerHTML=b.svg().replace('</svg>',pads+'</svg>');
      $$('.pad',card).forEach(g=>{const f=()=>tap(g.dataset.id);g.onclick=f;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f();}};});
      $('#mt',card).innerHTML=meterHTML();
    };
    const tap=id=>{
      if(card.dataset.graded)return;
      probe[probe.active]=id;
      setActive(probe.active==='red'?'black':'red');
      if(probe.red&&probe.black){const key=probe.red+'|'+probe.black;if(key!==lastKey){lastKey=key;if(pts>0)pts--;updP();
        const m=b.measure(probe.red,probe.black);readings.unshift(`<span style="color:#d32f2f">+${esc(b.padName(probe.red))}</span> / −${esc(b.padName(probe.black))}: <b>${m.text}</b>`);
        $('#rlog',card).innerHTML=readings.slice(0,12).join('<br>');}}
      draw();
    };
    draw();
    $('#tg',card).onclick=()=>{
      const btn=$('#tg',card);
      if(card.dataset.graded){k++;if(k>=N)return end();return next();}
      const c=$('input:checked',fl);
      if(!c){CC.modal('<p>You did not select a fault. Select a fault, then choose Grade item.</p>');return;}
      card.dataset.graded='1';
      const good=+c.value===b.answer;const got=good?pts:0;earned+=got;
      $$('label',fl).forEach((lb,i)=>{if(i===b.answer)lb.classList.add('correct');else if(i===+c.value)lb.classList.add('wrong');});
      $$('input',fl).forEach(x=>x.disabled=true);
      $('#ts',w).textContent=`Score: ${earned}`;
      $('#tfb',card).innerHTML=`<p class="verdict ${good?'ok':'bad'}">${good?'Correct!':'Incorrect'}</p><p class="small">${good?`You earned ${got} point${got===1?'':'s'} on this item.`:`The correct answer is highlighted: <b>${esc(b.faults[b.answer])}</b>.`} Your total score so far is ${earned} point${earned===1?'':'s'}.</p>${b.explain?`<p class="small muted">${b.explain()}</p>`:''}${CC.workHTML(typeof b.work==='function'?b.work():b.work,'Show how to find this fault')}`;
      btn.textContent=k+1<N?'Continue':'Finish';
    };
  };
  const end=()=>{const score=earned/(N*P)*100;s.finish(score,`${earned} of ${N*P} possible points.`);};
  next();
};

/* meter helpers */
CC.meterErr=()=>{const bias=rnd(-0.03,0.03);return v=>v*(1+bias+rnd(-0.008,0.008));};
CC.lcd=(v,dec=2)=>{if(!isFinite(v))return 'OL';const a=Math.abs(v);if(a<0.005)return (0).toFixed(dec);return v.toFixed(a>=100?1:dec);};

/* ---------- PC-board drawing kit ---------- */
const B=CC.board={};
B.svg=(w,h,inner)=>`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="printed circuit board" font-family="system-ui,sans-serif">${inner}</svg>`;
B.pcb=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="var(--board)" stroke="var(--board-dark)" stroke-width="3"/>`+[[x+10,y+10],[x+w-10,y+10],[x+10,y+h-10],[x+w-10,y+h-10]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--board-dark)"/>`).join('');
B.trace=(pts,label,lp)=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--trace)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>`+(label?`<text x="${lp[0]}" y="${lp[1]}" font-size="11" font-weight="700" fill="#5a3b12" ${lp[2]?`transform="rotate(${lp[2]} ${lp[0]} ${lp[1]})"`:''} text-anchor="middle">${label}</text>`:'');
B.wire=(pts,color='#c62828')=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
B.label=(x,y,t,o={})=>`<text x="${x}" y="${y}" font-size="${o.size||12}" font-weight="${o.w||700}" fill="${o.fill||'#3a2508'}" text-anchor="${o.anchor||'middle'}">${esc(t)}</text>`;
/** component between two pad points (horizontal or vertical) */
B.part=(type,a,b,label)=>{
  const [x1,y1]=a,[x2,y2]=b;const cx=(x1+x2)/2,cy=(y1+y2)/2;const L=Math.hypot(x2-x1,y2-y1);const ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
  let body='';const bl=Math.min(L-26,64);
  const lead=`<line x1="${-L/2}" y1="0" x2="${L/2}" y2="0" stroke="#9a9a9a" stroke-width="2.5"/>`;
  if(type==='R')body=`<rect x="${-bl/2}" y="-8" width="${bl}" height="16" rx="7" fill="#e6d3a8" stroke="#8b6f3a"/>`+[-.3,-.12,.06,.3].map((p,i)=>`<rect x="${p*bl-2.5}" y="-8" width="5" height="16" fill="${['#c62828','#6d4c41','#ef6c00','#c9a227'][i]}"/>`).join('');
  if(type==='PR')body=`<rect x="${-bl/2}" y="-10" width="${bl}" height="20" rx="2" fill="#f1f1f1" stroke="#888"/><text x="0" y="3.5" font-size="8" text-anchor="middle" fill="#666">POWER RESISTOR</text>`;
  if(type==='C')body=`<rect x="${-bl/2}" y="-9" width="${bl}" height="18" rx="5" fill="#f5c518" stroke="#a88600"/><line x1="${-bl/2+6}" y1="-9" x2="${-bl/2+6}" y2="9" stroke="#a88600"/>`;
  if(type==='L')body=`<rect x="${-bl/2}" y="-10" width="${bl}" height="20" rx="4" fill="#a3322a" stroke="#5e1a15"/>`+Array.from({length:7},(_,i)=>`<line x1="${-bl/2+5+i*(bl-10)/6}" y1="-10" x2="${-bl/2+5+i*(bl-10)/6}" y2="10" stroke="#7a221c" stroke-width="1.5"/>`).join('');
  if(type==='F')body=`<rect x="${-bl/2}" y="-7" width="${bl}" height="14" rx="3" fill="#e9f3f7" stroke="#8aa"/><rect x="${-bl/2}" y="-7" width="8" height="14" fill="#bbb"/><rect x="${bl/2-8}" y="-7" width="8" height="14" fill="#bbb"/><line x1="${-bl/2+8}" y1="0" x2="${bl/2-8}" y2="0" stroke="#777" stroke-width="1"/>`;
  if(type==='D')body=`<rect x="${-bl/2}" y="-6" width="${bl}" height="12" rx="3" fill="#222"/><rect x="${bl/2-9}" y="-6" width="4" height="12" fill="#ddd"/>`;
  const flip=Math.abs(ang)>90;
  const lab=label?`<text x="${cx+(Math.abs(ang)===90?14:0)}" y="${cy+(Math.abs(ang)===90?4:22)}" font-size="12" font-weight="700" fill="#2b1a05" text-anchor="${Math.abs(ang)===90?'start':'middle'}">${esc(label)}</text>`:'';
  return `<g transform="translate(${cx},${cy}) rotate(${flip?ang-180:ang})">${lead}${body}</g>${lab}`;
};
B.xfmr=(x,y,w,h,label)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="#2a8c8c" stroke="#145"/><rect x="${x+w*.25}" y="${y-6}" width="${w*.5}" height="${h+12}" rx="3" fill="#cfd8dc" stroke="#78909c"/><text x="${x+w/2}" y="${y+h/2+4}" font-size="11" font-weight="800" text-anchor="middle" fill="#455a64" transform="rotate(-90 ${x+w/2} ${y+h/2})">ACME</text>${label?B.label(x+w/2,y+h+24,label):''}`;
B.supply=(x,y,w,h,title,readout)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="#4a3b33" stroke="#2a201b" stroke-width="2"/><rect x="${x+8}" y="${y+8}" width="${w-16}" height="${h-16}" rx="5" fill="#e9e4dc"/><text x="${x+w/2}" y="${y+26}" font-size="11" font-weight="800" text-anchor="middle" fill="#b3261e">${esc(title)}</text>${readout?`<text x="${x+w/2}" y="${y+46}" font-size="13" font-weight="700" text-anchor="middle" fill="#333">${esc(readout)}</text>`:''}`;

})();

<script>/* Power Supply Challenge: simulated linear power supplies, DMM, oscilloscope, ohmmeter */
(function(){
'use strict';
const PS=window.PSK={};
const {fmt,pick,rnd,ri,esc}=CC;
try{const st=document.createElement('style');st.textContent=`
.ps-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}@media (max-width:620px){.ps-scroll svg{min-width:600px}}
.ps-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ps-scope{background:#1d2b22;border-radius:10px;padding:8px;display:grid;gap:8px}
.ps-scope svg{width:100%;height:auto;display:block}
.ps-ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ps-ctrl .lab{font-size:.75rem;color:#c9d6cc;text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
.ps-ctrl .btn{min-height:34px;padding:4px 9px;font-size:.85rem}
.ps-arrow{position:absolute}
`;document.head.appendChild(st);}catch(e){}

const W=2*Math.PI*60;
/* ---------- circuit model ---------- */
PS.TYPES={half:{name:'Half-Wave',diodes:['D1']},full:{name:'Full-Wave',diodes:['D1','D2']},bridge:{name:'Bridge',diodes:['D1','D2','D3','D4']}};
PS.parts=type=>['Switch','Fuse','Transformer primary','Transformer secondary','Capacitor C1','Resistor R1','Regulator U1',...PS.TYPES[type].diodes.map(d=>'Diode '+d)];
PS.make=function(type,fault){
  const vac=120*rnd(0.98,1.02);
  const drop=type==='bridge'?1.4:0.7;
  let vsec,vreg,il;
  for(;;){vsec=pick([12.6,18,24]);vreg=pick([5,9,12,15]);il=pick([0.2,0.25,0.3,0.4,0.5]);const vp=vsec*Math.SQRT2-drop;const rip=il/((type==='half'?60:120)*4700e-6);if(vp-rip>vreg+3&&vp<35)break;}
  const c={type,fault:fault||null,vac,vsec,vreg,il,C:4700e-6,R1:pick([1000,1500,2200]),rload:vreg/il};
  c.ok=n=>c.fault!==n;
  c.diodeOK=d=>c.fault!=='Diode '+d;
  const lineOK=c.ok('Switch')&&c.ok('Fuse');
  c.vsPk=(lineOK&&c.ok('Transformer primary')&&c.ok('Transformer secondary'))?vsec*Math.SQRT2:0;
  c.linePk=vac*Math.SQRT2;
  // simulate bus and output over 6 cycles, keep last 50 ms (3 cycles)
  const dt=5e-5,Ntot=Math.round(0.1/dt),keep=Math.round(0.05/dt);
  const bus=[],out=[],ts=[];let v=0;
  const capOK=c.ok('Capacitor C1'),regOK=c.ok('Regulator U1'),bleed=c.ok('Resistor R1')?c.R1:Infinity;
  const vs=t=>c.vsPk*Math.sin(W*t);
  c.rect=t=>{const x=vs(t);
    if(type==='half')return c.diodeOK('D1')?Math.max(0,x-0.7):0;
    if(type==='full')return Math.max(0,c.diodeOK('D1')?x-0.7:0,c.diodeOK('D2')?-x-0.7:0);
    return Math.max(0,(c.diodeOK('D1')&&c.diodeOK('D4'))?x-1.4:0,(c.diodeOK('D2')&&c.diodeOK('D3'))?-x-1.4:0);};
  const regOut=vin=>!regOK?0:Math.max(0,Math.min(vreg,vin-2));
  for(let n=0;n<Ntot;n++){const t=n*dt;const r=c.rect(t);
    if(capOK){const vo=regOut(v);const i=(regOK?vo/c.rload:0)+v/bleed+0.004;v=Math.max(r,v-i/c.C*dt);if(v<0)v=0;}
    else v=r;
    if(n>=Ntot-keep){ts.push(t-(Ntot-keep)*dt);bus.push(v);out.push(regOut(v));}}
  c.ts=ts;c.bus=bus;c.out=out;
  c.wave=id=>{const N=ts.length;const z=()=>new Array(N).fill(0);const t0=(Ntot-keep)*dt;
    const sine=pk=>ts.map(t=>pk*Math.sin(W*(t+t0)));
    const line=sine(c.linePk);
    const swR=c.ok('Switch')?line:z(), fuR=(c.ok('Switch')&&c.ok('Fuse'))?line:z();
    const s1=sine(c.vsPk);
    switch(id){
      case 'L1':case 'SWa':return line;
      case 'SWb':case 'F1a':return swR;
      case 'F1b':case 'P1':return fuR;
      case 'L2':case 'P2':case 'G':case 'U1g':case 'C1m':case 'R1b':case 'CT':return z();
      case 'S1':case 'D1a':case 'D3k':
        if(type==='bridge')return s1.map(x=>x>0?x-0.7:-0.7*(c.vsPk>0?1:0));
        return s1;
      case 'S2':case 'D2a':case 'D4k':
        if(type==='half')return z();
        if(type==='full')return s1.map(x=>-x);
        return s1.map(x=>x<0?-x-0.7:-0.7*(c.vsPk>0?1:0));
      case 'D3a':case 'D4a':return z();
      case 'BUS':case 'D1k':case 'D2k':case 'C1p':case 'R1t':case 'U1i':return bus.slice();
      case 'U1o':case 'OUT':return out.slice();
    }
    return z();};
  // ohmmeter readings for removed parts
  c.ohm=(part,rev)=>{
    if(part==='Transformer primary')return c.ok(part)?fmt(rnd(9,14),3)+' Ω':'OL';
    if(part==='Transformer secondary')return c.ok(part)?fmt(rnd(0.4,1.2),2)+' Ω':'OL';
    if(part==='Resistor R1')return c.ok(part)?fmt(c.R1*rnd(0.97,1.03)/1000,3)+' kΩ':'OL';
    const d=part.replace('Diode ','');if(!c.diodeOK(d))return 'OL';return rev?'OL':fmt(rnd(0.55,0.7),2)+' kΩ';};
  c.specs=()=>[`T1: 120 V primary, ${vsec} V secondary${type==='full'?' (center tapped, each half)':''}`,`${PS.TYPES[type].diodes.join(', ')}: 1N4001 silicon rectifier diode${type==='half'?'':'s'}`,'C1: 4700 µF, 35 V electrolytic filter capacitor',`R1: ${fmt(c.R1/1000)} kΩ, ½ W bleeder resistor`,`U1: 78${String(vreg).padStart(2,'0')} +${vreg} V regulator · load ${fmt(il*1000)} mA`,'F1: 1 A slow-blow fuse · S1: SPST power switch'];
  return c;
};
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const acrms=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)*(x-m))));};
const pp=a=>Math.max(...a)-Math.min(...a);
/* how to recognise the fault in this supply, with its own numbers */
PS.explain=function(c){
  const t=c.type,f=c.fault;const v=x=>fmt(x,3);
  const dc=id=>mean(c.wave(id)),ac=id=>acrms(c.wave(id)),rp=id=>pp(c.wave(id));
  const vp=c.vsec*Math.SQRT2,drop=t==='bridge'?1.4:0.7,fr=t==='half'?60:120;
  const norm=`>In a working supply: secondary ${c.vsec} V rms${t==='full'?' each half':''} (${v(vp)} V peak), C1 charged to about ${v(vp-drop)} V peak with ${fr} Hz ripple, and DC OUT at +${c.vreg} V.`;
  const bus=`C1 + reads ${v(dc('C1p'))} V DC with ${v(rp('C1p'))} V peak-to-peak ripple`;
  const L={
    'Switch':[`>The switch input (left lead) has the 120 V line voltage, but the right lead reads ${v(ac('SWb'))} V AC. The full line voltage appears across the switch, which a closed switch can't have, so S1 is open.`,'>Everything after the switch, including DC OUT, is dead.'],
    'Fuse':[`>The left end of the fuse has 120 V AC but the right end reads ${v(ac('F1b'))} V AC. A good fuse has no voltage across it, so F1 is open (blown).`],
    'Transformer primary':[`>Line voltage reaches P1 (about 120 V AC), but the secondary (S1) reads ${v(ac('S1'))} V AC.`,'>That points to the transformer. The ohmmeter shows OL across the primary and a fraction of an ohm across the secondary: the primary winding is open.'],
    'Transformer secondary':[`>Line voltage reaches P1 (about 120 V AC), but the secondary (S1) reads ${v(ac('S1'))} V AC.`,'>That points to the transformer. The ohmmeter shows normal resistance on the primary but OL on the secondary: the secondary winding is open.'],
    'Capacitor C1':[`>${bus}. Without the filter capacitor the voltage drops to zero every half cycle (${fr} Hz pulses); the scope shows bare rectified half sines instead of a nearly flat line.`,`>The regulator drops out in the valleys, so DC OUT averages only ${v(dc('OUT'))} V instead of ${c.vreg} V. C1 is open.`],
    'Resistor R1':['>Every voltage looks normal: the bleeder resistor carries only a few milliamps, so losing it barely changes the ripple.','>When a supply works but you still have to find a fault, check the parts voltages can’t reveal. The ohmmeter reads OL on R1: the bleeder resistor is open (C1 would then stay charged after power-off, a safety hazard).'],
    'Regulator U1':[`>${bus}: the capacitor charges almost to the full peak because no load current is drawn.`,`>The regulator input has plenty of voltage, but U1 output and DC OUT read ${v(dc('OUT'))} V. U1 is defective.`]};
  let steps=L[f];
  if(!steps&&f&&f.startsWith('Diode')){const d=f.slice(6);
    if(t==='half')steps=[`>The transformer secondary is good (${c.vsec} V rms at S1), but the D1 cathode, C1 + and DC OUT all read about 0 V.`,'>No current gets through the diode. The ohmmeter confirms it: OL in both directions (a good diode reads low one way and OL the other). D1 is open.'];
    else {const pair=t==='bridge'?(d==='D1'||d==='D4'?'D1 and D4':'D2 and D3'):d;
      steps=[`>${bus}. The ripple is now at 60 Hz instead of 120 Hz and about twice as large, because C1 is recharged only once per cycle: the supply has become a half-wave rectifier.`,
        `>${t==='bridge'?`The half cycle that ${pair} conduct together is missing, so one of those two is open.`:`One of the two diodes has stopped conducting.`} DC OUT ${dc('OUT')>c.vreg-0.05?`still reads +${c.vreg} V because the regulator has enough headroom, so check the ripple, not just the output.`:`has dropped to ${v(dc('OUT'))} V because the regulator drops out in the deeper valleys.`}`,
        `>The ohmmeter finds it: ${d} reads OL in both directions, while each good diode reads low forward and OL reversed.`];}}
  if(!steps)return [];
  return [norm,...steps];
};

const tr=(pts,w=7)=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${TR}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const lbl=(x,y,t,o={})=>`<text x="${x}" y="${y}" font-size="${o.s||11}" font-weight="700" fill="${o.f||'#0d2b10'}" text-anchor="${o.a||'middle'}" ${o.r?`transform="rotate(${o.r} ${x} ${y})"`:''}>${esc(t)}</text>`;
const diode=(a,k,l)=>{const cx=(a[0]+k[0])/2,cy=(a[1]+k[1])/2,ang=Math.atan2(k[1]-a[1],k[0]-a[0])*180/Math.PI,L=Math.hypot(k[0]-a[0],k[1]-a[1]);
  return `<g transform="translate(${cx},${cy}) rotate(${ang})"><line x1="${-L/2}" y1="0" x2="${L/2}" y2="0" stroke="#aaa" stroke-width="2.5"/><rect x="-16" y="-7" width="32" height="14" rx="3" fill="#222"/><rect x="9" y="-7" width="4" height="14" fill="#ddd"/></g>`+lbl(cx+(Math.abs(ang)>45?16:0),cy+(Math.abs(ang)>45?4:-12),l,{a:Math.abs(ang)>45?'start':'middle'});};

  g+=`<rect x="318" y="70" width="54" height="160" rx="6" fill="#2a8c8c" stroke="#145"/><rect x="330" y="62" width="30" height="176" rx="3" fill="#cfd8dc" stroke="#78909c"/>`+lbl(345,154,'ACME',{s:10,f:'#455a64',r:-90})+lbl(345,252,'T1')+lbl(298,90,'P1',{a:'end',s:10})+lbl(298,220,'P2',{a:'end',s:10})+lbl(392,88,'S1',{a:'start',s:10})+lbl(392,222,'S2',{a:'start',s:10})+(type==='full'?lbl(392,165,'CT',{a:'start',s:10}):'');
  if(type==='half')g+=diode(P.D1a,P.D1k,'D1');
  if(type==='full')g+=diode(P.D1a,P.D1k,'D1')+diode(P.D2a,P.D2k,'D2');

  g+=`<rect x="640" y="95" width="34" height="90" rx="3" fill="#333"/><rect x="664" y="95" width="16" height="90" fill="#bbb"/><circle cx="672" cy="140" r="5" fill="#888"/>`+lbl(657,90,'U1')+lbl(640,124,'IN',{s:8,f:'#ddd',a:'start'})+lbl(640,186,'OUT',{s:8,f:'#ddd',a:'start'});
  [['L1',P.L1],['L2',P.L2],['G',P.G]].forEach(([l,p])=>{g+=`<rect x="${p[0]-14}" y="${p[1]-14}" width="28" height="28" rx="4" fill="#c9c9c9" stroke="#666"/>`+lbl(p[0],p[1]-18,l);});
  g+=lbl(25,48,'AC IN',{a:'start',s:10})+`<rect x="${P.OUT[0]-14}" y="${P.OUT[1]-14}" width="28" height="28" rx="4" fill="#c9c9c9" stroke="#666"/>`+lbl(P.OUT[0],P.OUT[1]+28,'DC OUT');
  g+=lbl(110,288,'REV97-2B',{s:9,a:'start',f:'#174d1d'});
  return {svg:g,P};
};
PS.padNames={L1:'AC input L1',L2:'AC input L2',G:'Ground',SWa:'Switch left',SWb:'Switch right',F1a:'Fuse left',F1b:'Fuse right',P1:'Transformer P1',P2:'Transformer P2',S1:'Transformer S1',S2:'Transformer S2',CT:'Transformer CT',
  D1a:'D1 anode',D1k:'D1 cathode',D2a:'D2 anode',D2k:'D2 cathode',D3a:'D3 anode',D3k:'D3 cathode',D4a:'D4 anode',D4k:'D4 cathode',C1p:'C1 +',C1m:'C1 −',R1t:'R1 top',R1b:'R1 bottom',U1i:'U1 input',U1g:'U1 ground',U1o:'U1 output',OUT:'DC OUT'};

/* schematic */
PS.schematic=function(type){
  const S=CC.svg;const L=(...p)=>S.line(p);let g='';
  const tx=(x,y,t,a='middle')=>`<text x="${x}" y="${y}" font-size="11" text-anchor="${a}" stroke="none" fill="currentColor" font-weight="700">${esc(t)}</text>`;
  g+=`<circle cx="20" cy="50" r="3.5" fill="var(--surface)"/>`+tx(16,40,'AC IN','start')+L([24,50],[40,50])+S.hSym('SW',70,50,'S1')+S.hSym('F',130,50,'F1')+L([160,50],[175,50],[175,62]);
  g+=`<circle cx="20" cy="140" r="3.5" fill="var(--surface)"/>`+L([24,140],[175,140],[175,128]);
  g+=[0,1,2,3,4,5].map(i=>`<path d="M175,${62+i*11} a5.5,5.5 0 0 1 0,11"/>`).join('')+'<line x1="188" y1="58" x2="188" y2="132"/><line x1="192" y1="58" x2="192" y2="132"/>'+[0,1,2,3,4,5].map(i=>`<path d="M205,${62+i*11} a5.5,5.5 0 0 0 0,11"/>`).join('')+tx(190,50,'T1');
  const bus=48,gnd=150;
  if(type==='half'){g+=L([205,62],[205,bus],[230,bus])+S.hSym('D',260,bus,'D1')+L([290,bus],[330,bus])+L([205,128],[205,gnd],[330,gnd]);}
  if(type==='full'){g+=L([205,62],[205,bus],[230,bus])+S.hSym('D',260,bus,'D1')+L([290,bus],[330,bus])+L([205,128],[205,170],[230,170])+S.hSym('D',260,170,'D2',{below:true})+L([290,170],[300,170],[300,bus])+S.dot(300,bus)+L([205,95],[215,95],[215,gnd],[330,gnd])+tx(222,92,'CT','start');}
  if(type==='bridge'){
    const T=[265,52],Rt=[305,95],Lf=[225,95],Bt=[265,138];
    const ds=(a,b,l,lx,ly)=>{const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,ang=Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;return `<g transform="translate(${mx},${my}) rotate(${ang})"><path d="M-7,-7 L-7,7 L6,0 Z" fill="currentColor" stroke="none"/><line x1="6" y1="-8" x2="6" y2="8"/></g>`+tx(lx,ly,l);};
    g+=L(T,Rt,Bt,Lf,T)+ds(T,Rt,'D1',300,66)+ds(Lf,T,'D3',230,66)+ds(Bt,Rt,'D2',300,132)+ds(Lf,Bt,'D4',230,132);
    g+=L([205,62],[205,30],[265,30],T)+L([205,128],[205,160],[265,160],Bt)+L(Rt,[318,95],[318,bus],[330,bus])+L(Lf,[225,150])+L([225,150],[330,150]);}
  g+=S.dot(330,bus)+S.dot(330,gnd)+L([330,bus],[330,70])+S.vSym('C',330,100,'C1',{side:'right'})+L([330,130],[330,gnd]);
  g+=L([330,bus],[380,bus],[380,70])+S.vSym('R',380,100,'R1')+L([380,130],[380,gnd])+S.dot(380,bus)+S.dot(380,gnd);
  g+=L([380,bus],[420,bus])+`<rect x="420" y="35" width="44" height="28" fill="var(--surface)"/>`+tx(442,53,'U1')+L([464,bus],[500,bus])+`<circle cx="504" cy="${bus}" r="3.5" fill="var(--surface)"/>`+tx(504,bus-10,'DC OUT')+L([442,63],[442,gnd])+L([380,gnd],[500,gnd])+S.dot(442,gnd)+`<line x1="490" y1="${gnd+6}" x2="510" y2="${gnd+6}"/><line x1="494" y1="${gnd+11}" x2="506" y2="${gnd+11}"/>`+L([500,gnd],[500,gnd+6]);
  g+=tx(40,165,'Ground','start');
  return S.wrap(530,type==='full'?212:180,g);
};

/* ---------- oscilloscope screen ---------- */
PS.scope=function(wave,st){
  const Wd=400,Hd=320,div=40;
  let g=`<rect x="0" y="0" width="${Wd}" height="${Hd}" rx="6" fill="#0d1f14"/>`;
  for(let i=1;i<10;i++)g+=`<line x1="${i*div}" y1="0" x2="${i*div}" y2="${Hd}" stroke="#2e5a3c" stroke-width="${i===5?1.5:0.7}"/>`;
  for(let j=1;j<8;j++)g+=`<line x1="0" y1="${j*div}" x2="${Wd}" y2="${j*div}" stroke="#2e5a3c" stroke-width="${j===4?1.5:0.7}"/>`;
  if(wave){const m=st.ac?mean(wave):0;const vd=st.gain;const N=wave.length;
    const pts=wave.map((v,i)=>{let y=Hd/2-((v-m)/vd+st.pos)*div;y=Math.max(-2,Math.min(Hd+2,y));return (i/(N-1)*Wd).toFixed(1)+','+y.toFixed(1);}).join(' ');
    g+=`<polyline points="${pts}" fill="none" stroke="#7CFF9B" stroke-width="2.2"/>`;}
  const gl=st.gain<1?st.gain+' V':st.gain+' V';
  g+=`<text x="6" y="14" font-size="11" fill="#9fd8ad" font-family="monospace">${gl}/div ${st.ac?'AC':'DC'}</text><text x="${Wd-6}" y="14" font-size="11" fill="#9fd8ad" text-anchor="end" font-family="monospace">5 mS/div</text>`;
  g+=`<text x="4" y="${Hd/2-st.pos*div+4}" font-size="12" fill="#ffd54f">▶</text>`;
  return `<svg viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="oscilloscope screen">${g}</svg>`;
};

/* ---------- exercise engine ---------- */
PS.run=function(root,s,o){
  const practice=!!o.practice;let type=o.type,inst=o.inst;
  const N=10,PTS=13;let k=0,total=0;
  const w=CC.el(`<div>${practice?`<div class="card" style="margin-bottom:12px"><div class="row"><b class="small">Power supply:</b><button class="btn sm" data-ty="half">Half-wave</button><button class="btn sm" data-ty="full">Full-wave</button><button class="btn sm" data-ty="bridge">Bridge</button><span style="width:10px"></span><b class="small">Instrument:</b><button class="btn sm" data-in="dmm">Voltmeter</button><button class="btn sm" data-in="scope">Oscilloscope</button></div></div>`:''}
    <div class="statusbar"><span class="pill" id="pn"></span>${practice?'':'<span class="pill" id="pp"></span><span class="pill" id="pt">Total: 0</span>'}<span class="pill" id="ptm">0:00</span></div><div id="pbody"></div></div>`);
  root.appendChild(w);
  s.every(()=>{CC.$('#ptm',w).textContent=CC.fmtTime(s.elapsed());},1000);
  if(practice){
    CC.$$('[data-ty]',w).forEach(b=>b.onclick=()=>{type=b.dataset.ty;start();});
    CC.$$('[data-in]',w).forEach(b=>b.onclick=()=>{inst=b.dataset.in;start();});
  }
  const start=()=>{
    if(practice){CC.$$('[data-ty]',w).forEach(b=>b.classList.toggle('blue',b.dataset.ty===type));CC.$$('[data-in]',w).forEach(b=>b.classList.toggle('blue',b.dataset.in===inst));}
    const parts=PS.parts(type);
    const fault=practice?null:pick(parts);
    const c=PS.make(type,fault);CC._last={c,parts,answer:parts.indexOf(fault)};
    let pts=PTS,tries=0,probe=null,done=false;
    const st={gain:5,pos:0,ac:false,dmmAC:false,ohmRev:false};
    const brd=PS.board(type,{});
    const padIds=Object.keys(brd.P);
    CC.$('#pn',w).textContent=practice?`${PS.TYPES[type].name} power supply · practice, no faults`:`Power supply ${k+1} of ${N}`;
    const upd=()=>{if(practice)return;CC.$('#pp',w).textContent=`${pts} point${pts===1?'':'s'} available`;CC.$('#pp',w).className='pill'+(pts<6?' bad':'');};upd();
    const body=CC.$('#pbody',w);body.innerHTML='';
    const instHTML=inst==='scope'?`<div class="ps-scope"><div id="scr"></div>
        <div class="ps-ctrl"><span class="lab">Vertical gain</span>${[0.2,1,5,50].map(v=>`<button class="btn" data-g="${v}">${v} V/div</button>`).join('')}</div>
        <div class="ps-ctrl"><span class="lab">Coupling</span><button class="btn" data-c="dc">DC</button><button class="btn" data-c="ac">AC</button><span class="lab" style="margin-left:8px">Position</span><button class="btn" data-p="1" aria-label="Move trace up">▲</button><button class="btn" data-p="-1" aria-label="Move trace down">▼</button><button class="btn" data-p="0">Center</button></div>
        <div class="small" style="color:#c9d6cc" id="where">Tap a part lead to move the red test lead.</div></div>`
      :`<div class="row" style="align-items:stretch"><div class="meterbox"><span class="ml">Digital voltmeter</span><span class="lcd" id="lcd" style="min-width:9ch">----</span><span class="small" style="color:#c9cdd2" id="where">Tap a part lead to move the red test lead.</span></div>
        <div class="meterbox"><span class="ml">Function</span><div class="row" style="gap:6px"><button class="btn sm" data-m="dc">DC V</button><button class="btn sm" data-m="ac">AC V</button></div></div></div>`;
    const card=CC.el(`<div><div class="card"><div class="board-wrap ps-scroll" id="bw"></div></div>
      <div class="cols2 mt"><div class="card">${instHTML}</div>
      <div><div class="card"><div class="ps-tabs">${['Schematic','Specifications','Ohmmeter',practice?'':'Score','Help'].filter(Boolean).map((t,i)=>`<button class="btn sm ${i===0?'blue':''}" data-tab="${t}">${t}</button>`).join('')}</div><div id="tabc"></div></div>
      ${practice?'':`<div class="card"><h3 style="margin-top:0">Select part to replace</h3><div class="faults" id="fl">${parts.map((p,i)=>`<label><input type="radio" name="part" value="${i}"> <span>${esc(p)}</span></label>`).join('')}</div><div class="row end mt"><button class="btn primary" id="pg">Grade selection</button></div><div id="pfb"></div></div>`}
      </div></div></div>`);
    body.appendChild(card);
    const wave=()=>probe?c.wave(probe):null;
    const readInst=()=>{
      if(inst==='scope'){CC.$('#scr',card).innerHTML=PS.scope(wave(),st);
        CC.$$('[data-g]',card).forEach(b=>b.classList.toggle('blue',+b.dataset.g===st.gain));CC.$$('[data-c]',card).forEach(b=>b.classList.toggle('blue',(b.dataset.c==='ac')===st.ac));}
      else{const wv=wave();let t='----';if(wv){const v=st.dmmAC?acrms(wv):mean(wv);const r=v*(1+st.bias)+rnd(-0.004,0.004);t=(Math.abs(r)<0.005?0:r).toFixed(Math.abs(r)>=100?1:2)+(st.dmmAC?' VAC':' VDC');}
        CC.$('#lcd',card).textContent=t;CC.$$('[data-m]',card).forEach(b=>b.classList.toggle('blue',(b.dataset.m==='ac')===st.dmmAC));}
      if(probe)CC.$('#where',card).textContent='Red lead: '+PS.padNames[probe]+' · black lead: ground';
    };
    st.bias=rnd(-0.015,0.015);
    const draw=()=>{
      const pads=padIds.filter(id=>id!=='G').map(id=>{const [x,y]=brd.P[id];const on=probe===id;return `<g class="pad" data-id="${id}" tabindex="0" role="button" aria-label="${esc(PS.padNames[id])}"><circle cx="${x}" cy="${y}" r="6" fill="#e0e0e0" stroke="#555" stroke-width="2"/><circle cx="${x}" cy="${y}" r="2" fill="#555"/>${on?`<circle cx="${x}" cy="${y}" r="10" fill="none" stroke="#d32f2f" stroke-width="4"/><path d="M${x+6},${y-6} l18,-20" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>`:''}<circle cx="${x}" cy="${y}" r="13" fill="transparent"/></g>`;}).join('');
      const gp=brd.P.G;
      CC.$('#bw',card).innerHTML=`<svg viewBox="0 0 710 305" width="710" height="305" role="img" aria-label="power supply PC board" font-family="system-ui,sans-serif">${brd.svg}<path d="M${gp[0]+8},${gp[1]+6} q20,30 -30,30" stroke="#111" stroke-width="5" fill="none"/><circle cx="${gp[0]}" cy="${gp[1]}" r="7" fill="#111"/>${pads}</svg>`;
      CC.$$('.pad',card).forEach(g=>{const f=()=>{if(done&&!practice)return;const id=g.dataset.id;if(id!==probe){probe=id;if(!practice&&pts>0){pts--;upd();}}draw();readInst();};g.onclick=f;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f();}};});
    };
    draw();readInst();
    if(inst==='scope'){
      CC.$$('[data-g]',card).forEach(b=>b.onclick=()=>{st.gain=+b.dataset.g;readInst();});
      CC.$$('[data-c]',card).forEach(b=>b.onclick=()=>{st.ac=b.dataset.c==='ac';readInst();});
      CC.$$('[data-p]',card).forEach(b=>b.onclick=()=>{const d=+b.dataset.p;st.pos=d===0?0:Math.max(-4,Math.min(4,st.pos+d*0.5));readInst();});
    } else CC.$$('[data-m]',card).forEach(b=>b.onclick=()=>{st.dmmAC=b.dataset.m==='ac';readInst();});
    // tabs
    const ohmParts=['Transformer primary','Transformer secondary','Resistor R1',...PS.TYPES[type].diodes.map(d=>'Diode '+d)];
    const tabs={
      Schematic:()=>`<div class="diagram">${PS.schematic(type)}</div>`,
      Specifications:()=>`<ul class="small" style="margin:0;padding-left:1.2em">${c.specs().map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`,
      Ohmmeter:()=>`<p class="small muted" style="margin-top:0">The part is removed from the board and tested out of circuit.${practice?'':' Each ohmmeter test costs two points.'}</p><div class="field"><label for="op">Part to test</label><select id="op" style="border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:9px 10px">${ohmParts.map(p=>`<option>${esc(p)}</option>`).join('')}</select></div>
        <div class="row"><button class="btn sm" id="orev">Test leads: + / −</button><button class="btn primary sm" id="ogo">Test with ohmmeter${practice?'':' (−2)'}</button></div><div class="meterbox mt"><span class="ml">Ohmmeter</span><span class="lcd" id="olcd" style="min-width:9ch">OFF</span><span class="small" style="color:#c9cdd2" id="onote"></span></div>`,
      Score:()=>`<p class="small" style="margin-top:0">Each supply starts with 13 points. Moving the test lead costs 1, an ohmmeter test costs 2 and a wrong answer costs 5. You keep the points left when you pick the right part.</p><table class="t"><tr><td>Points available on this supply</td><td><b>${pts}</b></td></tr><tr><td>Total points earned</td><td><b>${total}</b></td></tr><tr><td>Tries used on this supply</td><td>${tries} of 3</td></tr></table>`,
      Help:()=>PS.HELP
    };
    const showTab=t=>{CC.$$('[data-tab]',card).forEach(b=>b.classList.toggle('blue',b.dataset.tab===t));CC.$('#tabc',card).innerHTML=tabs[t]();
      if(t==='Ohmmeter'){const rv=CC.$('#orev',card);const lab=()=>{rv.textContent='Test leads: '+(st.ohmRev?'reversed (− / +)':'normal (+ / −)');};lab();rv.onclick=()=>{st.ohmRev=!st.ohmRev;lab();};
        CC.$('#ogo',card).onclick=()=>{if(done&&!practice)return;const p=CC.$('#op',card).value;if(!practice){pts=Math.max(0,pts-2);upd();}CC.$('#olcd',card).textContent=c.ohm(p,st.ohmRev);CC.$('#onote',card).textContent=p+(p.startsWith('Diode')?(st.ohmRev?' · red lead on cathode':' · red lead on anode'):'');};}};
    CC.$$('[data-tab]',card).forEach(b=>b.onclick=()=>showTab(b.dataset.tab));showTab('Schematic');
    if(practice)return;
    const ans=parts.indexOf(fault);
    CC.$('#pg',card).onclick=()=>{
      const btn=CC.$('#pg',card);
      if(done){k++;if(k>=N)return end();return start();}
      const ch=CC.$('input[name=part]:checked',card);
      if(!ch){CC.modal('<p>Select one of the parts in the list, then choose Grade selection.</p>');return;}
      const i=+ch.value;const lb=CC.$$('#fl label',card)[i];
      if(i===ans){done=true;total+=pts;lb.classList.add('correct');CC.$('#pfb',card).innerHTML=`<p class="verdict ok">Correct!</p><p class="small">You earned ${pts} point${pts===1?'':'s'} on this power supply. Total score so far: ${total} of ${(k+1)*PTS} possible.</p>`;}
      else{tries++;pts=Math.max(0,pts-5);lb.classList.add('wrong');ch.disabled=true;ch.checked=false;upd();
        if(tries>=3){done=true;CC.$$('#fl label',card)[ans].classList.add('correct');CC.$('#pfb',card).innerHTML=`<p class="verdict bad">Incorrect</p><p class="small">The arrow points to the correct part to replace: <b>➜ ${esc(fault)}</b>. No points earned on this power supply. Total score so far: ${total}.</p>`;}
        else CC.$('#pfb',card).innerHTML=`<p class="verdict bad">Incorrect</p><p class="small">Five points deducted. You have ${3-tries} ${3-tries===1?'try':'tries'} left on this power supply.</p>`;}
      CC.$('#pt',w).textContent='Total: '+total;
      if(done){CC.$$('#fl input',card).forEach(x=>x.disabled=true);btn.textContent=k+1<N?'Next power supply':'Finish';CC.$('#pfb',card).insertAdjacentHTML('beforeend',CC.workHTML(PS.explain(c),'Show how to find this fault'));}
      if(CC.$('[data-tab=Score].blue',card))showTab('Score');
    };
  };
  const end=()=>s.finish(total/(N*PTS)*100,`${total} of ${N*PTS} possible points.`);
  start();
};
PS.HELP=`<div class="small"><p style="margin-top:0"><b>Moving the test lead.</b> Tap any part lead or terminal to move the red test lead there; the instrument updates immediately. The black lead stays on the circuit ground (the negative side of C1). Primary-side points (AC input, switch, fuse, P1, P2) are shown as measured from the neutral line, L2. On a real supply, never clip an ordinary scope ground lead to the line side.</p>
<p><b>Using the ohmmeter.</b> The ohmmeter tests a part removed from the board: either transformer winding, any diode or the resistor. Reverse the test leads to check a diode both ways. A good diode reads low one way and OL (open) the other.</p>
<p><b>Faults.</b> Each defective supply has one failed part. Switches, fuses, windings, diodes, the capacitor and the resistor fail open; a failed regulator gives no output.</p>
<p><b>Choosing the part.</b> Select the part to replace and choose Grade selection. You have three tries per supply; after the third wrong try the correct part is highlighted.</p>
<p><b>Scoring.</b> Each supply starts with 13 points. Moving the test lead costs 1 point, an ohmmeter test costs 2 and a wrong answer costs 5; a supply can't go below 0. The most you can score is 130, but every supply needs a few measurements, so even an expert scores well below that.</p></div>`;
})();

</script>
<script>(function(){
'use strict';
const P=PSK;const M=CC.M;
const MAN=`<h2>About this program</h2><p>Power Supply Challenge gives you realistic practice troubleshooting linear DC power supplies. Each exercise puts ten defective supplies on a simulated PC board. You measure with a digital voltmeter or an oscilloscope, test parts with an ohmmeter, and pick the part to replace. You should already know how rectifiers, filter capacitors and regulators work; the start page of each exercise has a short refresher.</p>
<p>The exercises cover half-wave, full-wave (center-tapped) and bridge rectifier supplies, each with a voltmeter or with an oscilloscope, plus an ungraded practice mode on working circuits. Every run picks new transformer, regulator and load values and new faults.</p>
<h2>Scoring</h2><p>Each supply starts with 13 points. Moving the test lead costs 1 point, an ohmmeter test costs 2 points and a wrong answer costs 5 points; a supply can't go below 0. You have three tries per supply. Ten supplies give a maximum of 130 points, but every supply needs some measurements, so good scores are well below that. Your percentage is your points out of 130. The time you take is recorded too: good troubleshooters are both accurate and efficient.</p>`;
const theory=type=>{
  const t={half:`<p>A half-wave rectifier uses a single diode, D1, to pass only the positive half cycles of the transformer secondary voltage. The capacitor C1 charges to nearly the peak secondary voltage and supplies the load between peaks, so the ripple frequency is 60 Hz (one recharge per cycle). Regulator U1 holds the output at its rated voltage as long as its input stays at least about 2 V above the output, even in the ripple valleys.</p>`,
    full:`<p>A full-wave rectifier uses a center-tapped transformer secondary and two diodes, D1 and D2. Each diode conducts on alternate half cycles, so the capacitor C1 is recharged twice each cycle and the ripple frequency is 120 Hz. The secondary rating is for each half, and C1 charges to the peak of one half less one diode drop.</p>`,
    bridge:`<p>A bridge rectifier uses four diodes, D1–D4, and the full transformer secondary. Two diodes conduct in series on each half cycle, so the capacitor C1 is recharged twice each cycle (120 Hz ripple) and the peak output is the peak secondary voltage less two diode drops.</p>`}[type];
  const drop=type==='bridge'?'1.4':'0.7';
  return t+`<p>Bleeder resistor R1 discharges C1 when the power is off. It carries only a few milliamps, so it has little effect on the readings.</p><div class="formulas"><div class="formula"><span class="cap">Peak secondary voltage</span>${M('V_P=1.414\\,V_{rms}')}</div><div class="formula"><span class="cap">Filter capacitor voltage</span>${M('V_{C1}\\approx V_P-'+drop+'\\text{ V}')}</div><div class="formula"><span class="cap">Average (DC) voltage on C1</span>${M('V_{DC}\\approx V_{C1}-\\frac{V_r}{2}')}</div><div class="formula"><span class="cap">Ripple voltage (peak to peak)</span>${M('V_{r}\\approx\\frac{I_L}{f_r\\,C_1}\\qquad f_r='+(type==='half'?'60':'120')+'\\text{ Hz}')}</div></div>`;};
const intro=(type,inst)=>CC.introPage({diagram:P.schematic(type),text:`<p>You will repair ten ${P.TYPES[type].name.toLowerCase()} power supplies, each with one failed part. Use ${inst==='scope'?'the oscilloscope':'the digital voltmeter'} and the ohmmeter to find it, then select the part to replace. Tap a part lead to move the red test lead; the black lead stays on ground.</p><p>Work from the AC input toward DC OUT, or check DC OUT and C1 first and then work back. Switches, fuses, windings, diodes, the capacitor and the resistor fail open; a failed regulator gives no output.</p>${theory(type)}`,
  how:`<p>Each of the 10 supplies starts with <b>13 points</b>. Moving the ${inst==='scope'?'scope probe':'voltmeter lead'} to a new point costs 1 point, an ohmmeter test costs 2 points and a wrong answer costs 5 points (a supply can't go below 0). You have three tries per supply and keep the points that are left when you pick the right part. Your percentage is your total out of 130. After each supply you can open an explanation of how the fault shows up.</p>${inst==='scope'?'<p>The scope sweeps at 5 ms per division (three 60 Hz cycles across the screen). Choose the vertical gain (0.2, 1, 5 or 50 V/div) and DC or AC coupling, and use the position buttons to move the trace. AC coupling removes the DC level so you can see small ripple. Changing settings is free.</p>':'<p>The voltmeter reads DC volts (the average value) or AC volts (the rms value of the AC part only, which is how you measure ripple on a DC line). Switching functions is free.</p>'}`});
const mk=(id,type,inst)=>({id,title:`${P.TYPES[type].name==='Bridge'?'Bridge':P.TYPES[type].name} Troubleshooting with ${inst==='scope'?'Oscilloscope':'Voltmeter'}`,icon:inst==='scope'?'wave':'meter',sub:`10 defective ${P.TYPES[type].name.toLowerCase()} supplies`,intro:intro(type,inst),run:(el,s)=>P.run(el,s,{type,inst})});
CC.App.init({
  id:'power',title:'Power Supply Challenge',tagline:'Linear power supply troubleshooting · offline edition',
  blurb:'Find the failed part in simulated half-wave, full-wave and bridge power supplies using a digital voltmeter, an oscilloscope and an ohmmeter. Ten supplies per exercise, with new values and faults every time.',
  footer:'Based on Power Supply Challenge 98 © ETCAI Products. Offline HTML edition.',pass:60,manual:MAN,
  hero:slot=>{slot.appendChild(CC.el(`<div class="card"><div class="diagram">${P.schematic('bridge')}</div><p class="small muted center" style="margin-bottom:0">Bridge power supply: AC in, switch, fuse, transformer, rectifier, filter, regulator.</p></div>`));},
  groups:[
    {title:'Troubleshooting with oscilloscope',items:[mk('hws','half','scope'),mk('fws','full','scope'),mk('brs','bridge','scope')]},
    {title:'Troubleshooting with voltmeter',items:[mk('hwv','half','dmm'),mk('fwv','full','dmm'),mk('brv','bridge','dmm')]},
    {title:'Practice',items:[{id:'prac',title:'Measurement Practice with No Circuit Faults',icon:'meter',sub:'half-wave, full-wave or bridge; voltmeter or scope',graded:false,
      intro:CC.introPage({text:'<p>Practice measurements on working supplies before you troubleshoot. Choose half-wave, full-wave or bridge and the voltmeter or oscilloscope at the top of the page; each choice builds a new supply with new values. Nothing is scored, so measure as much as you like and compare your readings with the formulas below.</p>'+theory('bridge')}),
      run:(el,s)=>P.run(el,s,{type:'bridge',inst:'scope',practice:true})}]}
  ]
});
})();
</script>
