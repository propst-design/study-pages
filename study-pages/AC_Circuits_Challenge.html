function transformerSet(el,s){
  CC.problemSet(el,s,{count:10,gen:()=>{
    let Tp,Ts,Vp,R,Vs,Is,Ip;
    do{Tp=pick([100,200,250,400,500,600,800,1000,1200,1500,2000,2400]);Ts=pick([20,25,40,50,60,100,120,150,200,250,400,500,1000,2000,3000,4000]);Vp=pick([6,12,24,48,110,115,120,220,240]);
      Vs=Vp*Ts/Tp;R=eVal(10,10000);Is=Vs/R;Ip=Is*Ts/Tp;}while(Ts===Tp||Vs<1||Vs>500||Is<0.01||Is>5||Ip<0.01||Ip>10||Vs*Is>500);
    const combos=[[0,1,2],[0,1,3],[0,2,3],[1,2,3],[0,2,5],[1,2,5]];
    const known=pick(combos);
    // the student only sees the rounded givens, so solve from exactly those
    const shown=v=>CC.parse(fmt(v),false);
    const g={};known.forEach(i=>{g[i]=shown([Tp,Ts,Vp,Vs,Ip,Is][i]);});
    const w=[];
    let tp=g[0],ts=g[1],vp=g[2],vs=g[3],is=g[5];
    if(is!==undefined){vs=is*R;w.push('>Start with Ohm\'s law on the load to get the secondary voltage.','V_s=I_s R',`V_s=${amp(is)}\\times${q(R,'Ω')}=${q(vs,'V')}`);}
    if(vs===undefined){vs=vp*ts/tp;w.push('>The voltage ratio equals the turns ratio.','V_s=V_p\\times\\frac{N_s}{N_p}',`V_s=${q(vp,'V')}\\times\\frac{${n(ts)}}{${n(tp)}}=${q(vs,'V')}`);}
    if(vp===undefined){vp=vs*tp/ts;w.push('>The voltage ratio equals the turns ratio.','V_p=V_s\\times\\frac{N_p}{N_s}',`V_p=${q(vs,'V')}\\times\\frac{${n(tp)}}{${n(ts)}}=${q(vp,'V')}`);}
    if(ts===undefined){ts=tp*vs/vp;w.push('>The turns ratio equals the voltage ratio.','N_s=N_p\\times\\frac{V_s}{V_p}',`N_s=${n(tp)}\\times\\frac{${q(vs,'V')}}{${q(vp,'V')}}=${n(ts)}`);}
    if(tp===undefined){tp=ts*vp/vs;w.push('>The turns ratio equals the voltage ratio.','N_p=N_s\\times\\frac{V_p}{V_s}',`N_p=${n(ts)}\\times\\frac{${q(vp,'V')}}{${q(vs,'V')}}=${n(tp)}`);}
    if(is===undefined){is=vs/R;w.push('>Ohm\'s law on the load gives the secondary current.','I_s=\\frac{V_s}{R}',`I_s=\\frac{${q(vs,'V')}}{${q(R,'Ω')}}=${amp(is)}`);}
    const ip=is*ts/tp;
    w.push(`>Current changes the opposite way to voltage: a step-${ts>tp?'up':'down'} transformer steps current ${ts>tp?'down':'up'}.`,'I_p=I_s\\times\\frac{N_s}{N_p}',`I_p=${amp(is)}\\times\\frac{${n(ts)}}{${n(tp)}}=${amp(ip)}`,
      `>Check: input power equals output power, ${m(`V_p I_p=V_s I_s=${q(vs*is,'W',3)}`)}.`);
    const vals=[tp,ts,vp,vs,ip,is];
    const L=[['Number of primary turns, Np',''],['Number of secondary turns, Ns',''],['Primary voltage, Vp','V'],['Secondary voltage, Vs','V'],['Primary current, Ip','A'],['Secondary current, Is','A']];
    return {title:'Transformer problem',prompt:`<p>The blue boxes are known. Calculate the three empty yellow boxes. You will also need the load resistance shown on the schematic. Assume an ideal transformer.</p>`,
      diagram:XF_DIAG('R = '+fR(R)),
      fields:L.map((f,i)=>({key:'x'+i,label:f[0],unit:f[1],value:known.includes(i)?g[i]:vals[i],given:known.includes(i)})),
      explain:`<div class="formulas"><div>${M('\\frac{V_s}{V_p}=\\frac{N_s}{N_p}')}</div><div>${M('\\frac{I_p}{I_s}=\\frac{N_s}{N_p}')}</div><div>${M('I_s=\\frac{V_s}{R}')}</div></div>`,work:w};
  }});
}

/* ---------- Troubleshooting ---------- */
function makeMeter(){return CC.meterErr();}
const openMsg=(vs,a,b,f)=>[`>The supply current is 0 mA, so the circuit is open somewhere. With no current, every good part drops 0 V and the full supply voltage appears across the break.`,`>The meter reads about ${fmt(vs,3)} V only across <b>${a}</b> to <b>${b}</b>, so the fault is <b>${f}</b>.`];
function seriesBoard(){
  // series loop: J1-F1-T1-C1-T2-R1-T3-L1-T4-J2, driven at 1 kHz
  const Vs=10,F=1000,w=TP*F;
  let R,C,L;
  do{R=eVal(330,3300);C=capFor(F,R*rnd(0.5,1.6));L=indFor(F,R*rnd(0.5,1.6));}while(!L_OK(L)||L<10e-3||!C_OK(C));
  const tol=()=>1+rnd(-0.2,0.2);
  const Ra=R*tol(),Ca=C*tol(),La=L*tol();
  const faults=['Fuse Blown','C1 Open','C1 Shorted','R1 Open','R1 Shorted','L1 Open','L1 Shorted','Trace 1 Open','Trace 2 Open','Trace 3 Open','Trace 4 Open','No Faults'];
  const ans=ri(0,faults.length-1);const f=faults[ans];
  const pads=['J1','F1a','F1b','C1a','C1b','R1a','R1b','L1a','L1b','J2'];
  const names={J1:'J1 (supply +)',F1a:'F1 left',F1b:'F1 right',C1a:'C1 left',C1b:'C1 right',R1a:'R1 top',R1b:'R1 bottom',L1a:'L1 right',L1b:'L1 left',J2:'J2 (supply −)'};
  const OPEN=null;
  const Z=[Cx.c(0),Cx.c(0.1),Cx.c(0),Cx.c(0,-1/(w*Ca)),Cx.c(0),Cx.c(Ra),Cx.c(0),Cx.c(La*w*0.03,La*w),Cx.c(0)];
  const map={'Fuse Blown':[1,OPEN],'C1 Open':[3,OPEN],'C1 Shorted':[3,Cx.c(0)],'R1 Open':[5,OPEN],'R1 Shorted':[5,Cx.c(0)],'L1 Open':[7,OPEN],'L1 Shorted':[7,Cx.c(0)],'Trace 1 Open':[2,OPEN],'Trace 2 Open':[4,OPEN],'Trace 3 Open':[6,OPEN],'Trace 4 Open':[8,OPEN]};
  let openAt=-1;if(map[f]){if(map[f][1]===OPEN)openAt=map[f][0];else Z[map[f][0]]=map[f][1];}
  const Vsup=Vs*rnd(0.99,1.01);
  const Ztot=Z.reduce((a,b)=>Cx.add(a,b),Cx.c(0));
  const I=openAt>=0?Cx.c(0):Cx.div(Cx.c(Vsup),Ztot);
  const vm=makeMeter(),am=makeMeter();
  const measure=(a,b)=>{let i=pads.indexOf(a),j=pads.indexOf(b);if(i>j)[i,j]=[j,i];let v;
    if(i===j)v=0;else if(openAt>=0)v=(openAt>=i&&openAt<j)?Vsup:0;
    else{let z=Cx.c(0);for(let k=i;k<j;k++)z=Cx.add(z,Z[k]);v=Cx.abs(Cx.mul(I,z));}
    const r=vm(v);return {value:r,text:CC.lcd(r)+' V'};};
  const P={J1:[60,150],F1a:[100,150],F1b:[190,150],C1a:[250,150],C1b:[340,150],R1a:[470,175],R1b:[470,285],L1a:[360,300],L1b:[250,300],J2:[60,300]};
  const svg=()=>B.svg(540,340,
    B.supply(20,8,200,70,'AC POWER SUPPLY',Vs+' VAC @ 1 kHz')+B.pcb(20,110,505,220)+
    B.wire([[150,78],[150,95],[60,95],[60,150]],'#c62828')+B.wire([[180,78],[180,100],[34,100],[34,300],[60,300]],'#222')+
    B.trace([P.J1,P.F1a])+B.trace([P.F1b,P.C1a],'TRACE 1',[220,140])+B.trace([P.C1b,[470,150],P.R1a],'TRACE 2',[410,140])+B.trace([P.R1b,[470,300],P.L1a],'TRACE 3',[415,318])+B.trace([P.L1b,P.J2],'TRACE 4',[150,318])+
    B.part('F',P.F1a,P.F1b,'F1')+B.part('C',P.C1a,P.C1b,'C1')+B.part('R',P.R1a,P.R1b,'R1')+B.part('L',P.L1b,P.L1a,'L1')+
    B.label(60,135,'J1',{size:11})+B.label(60,325,'J2',{size:11}));
  const padsArr=pads.map(id=>({id,x:P[id][0],y:P[id][1],label:names[id]}));
  // what the marked values predict (for the worked explanation)
  const XCn=1/(w*C),XLn=w*L,Zn=Math.hypot(R,XLn-XCn),In=Vs/Zn;
  const work=()=>{
    const st=['>With the marked values, a good circuit should draw about '+fmt(In*1e3,3)+' mA:',
      `X_C=\\frac{1}{2\\pi F C}=${q(XCn,'Ω',3)}`,`X_L=2\\pi F L=${q(XLn,'Ω',3)}`,
      `Z=\\sqrt{R^2+(X_L-X_C)^2}=${q(Zn,'Ω',3)}`,`I=\\frac{V_S}{Z}=${q(In*1e3,'mA',3)}`,
      `V_R\\approx${q(In*R,'V',3)}\\quad V_C\\approx${q(In*XCn,'V',3)}\\quad V_L\\approx${q(In*XLn,'V',3)}`];
    if(openAt>=0)st.push(...openMsg(Vsup,names[pads[openAt]],names[pads[openAt+1]],f));
    else if(f==='No Faults')st.push(`>The supply current (${fmt(Cx.abs(I)*1e3,3)} mA) and every part voltage are close to the expected values, allowing for the 20% part tolerance. There is no fault.`);
    else{const part=f.slice(0,2),k=map[f][0];
      st.push(`>Current flows (${fmt(Cx.abs(I)*1e3,3)} mA), so nothing is open. A shorted part drops 0 V. The reading across <b>${names[pads[k]]}</b> to <b>${names[pads[k+1]]}</b> is 0 V instead of the few volts expected, so <b>${part} is shorted</b>.`,
        '>Shorting one reactance changes the net reactance, so the current can go up or down. The 0 V reading, not the current, is what identifies the part.');}
    return st;};
  return {svg,pads:padsArr,faults,answer:ans,measure,work,
    meters:()=>[{label:'Supply AC volts',text:CC.lcd(vm(Vsup),1)},{label:'Supply AC mA',text:CC.lcd(am(Cx.abs(I)*1000),1)}],
    info:()=>`Marked values: R1 = ${fR(R)}, C1 = ${fC(C)}, L1 = ${fL(L)}. The supply is ${Vs} V at 1 kHz. Parts can be 20% off their marked values and the meters up to 5% off.`};
}
function xfmrBoard(){
  const w=TP*60;let Vsup0,ratio,Vsec,R,L,Inom;
  // keep the reflected load current well above the magnetizing current so "load open" and "load working" are easy to tell apart
  do{Vsup0=pick([24,48,120]);ratio=pick([2,4,5,6,10]);Vsec=Vsup0/ratio;R=eVal(10,470);L=indFor(60,R*rnd(0.4,1.2));Inom=Vsec/Math.hypot(R,w*L);}
  while(!L_OK(L)||L<10e-3||Inom>0.5||Inom*Inom*R>10||Inom/ratio<0.015);
  const tol=()=>1+rnd(-0.2,0.2);const Ra=R*tol(),La=L*tol();
  const faults=['Fuse Blown','Primary Open','Secondary Open','R1 Open','R1 Shorted','L1 Open','L1 Shorted','Trace 1 Open','Trace 2 Open','Trace 3 Open','Trace 4 Open','No Faults'];
  const ans=ri(0,faults.length-1),f=faults[ans];
  const Vsup=Vsup0*rnd(0.99,1.01);
  // primary loop pads: J1,F1a,F1b,P1,P2,J2  elements: wire,F1,T1,PRI,wire
  const priPads=['J1','F1a','F1b','P1','P2','J2'];
  let priOpen=({'Fuse Blown':1,'Trace 1 Open':2,'Primary Open':3})[f];if(priOpen===undefined)priOpen=-1;
  // secondary loop pads: S1,R1a,R1b,L1a,L1b,S2  elements: T2,R1,T3,L1,T4
  const secPads=['S1','R1a','R1b','L1a','L1b','S2'];
  const Zs=[Cx.c(0),Cx.c(Ra),Cx.c(0),Cx.c(La*w*0.04,La*w),Cx.c(0)];
  let secOpen=({'Trace 2 Open':0,'R1 Open':1,'Trace 3 Open':2,'L1 Open':3,'Trace 4 Open':4})[f];if(secOpen===undefined)secOpen=-1;
  if(f==='R1 Shorted')Zs[1]=Cx.c(0);if(f==='L1 Shorted')Zs[3]=Cx.c(0);
  const E=(priOpen<0&&f!=='Secondary Open')?Vsup/ratio:0;
  const Zt=Zs.reduce((a,b)=>Cx.add(a,b),Cx.c(0.4)); // 0.4 Ω winding resistance
  const Is=(secOpen>=0||E===0)?Cx.c(0):Cx.div(Cx.c(E),Zt);
  // magnetizing current: drawn whenever the primary is energized, lags the supply by 90°
  const Imag=0.002+0.05*Inom/ratio;
  const Ip=priOpen>=0?0:Cx.abs(Cx.c(Is.re/ratio,Is.im/ratio-Imag));
  const vm=makeMeter(),am=makeMeter();
  const measure=(a,b)=>{let v=0;
    const ia=priPads.indexOf(a),ib=priPads.indexOf(b),sa=secPads.indexOf(a),sb=secPads.indexOf(b);
    if(ia>=0&&ib>=0){let i=Math.min(ia,ib),j=Math.max(ia,ib);
      if(priOpen>=0)v=(priOpen>=i&&priOpen<j)?Vsup:0;else v=(3>=i&&3<j)?Vsup:0;}
    else if(sa>=0&&sb>=0){let i=Math.min(sa,sb),j=Math.max(sa,sb);
      if(E===0)v=0;else if(secOpen>=0)v=(secOpen>=i&&secOpen<j)?E:0;
      else{let z=Cx.c(0);for(let k=i;k<j;k++)z=Cx.add(z,Zs[k]);v=Cx.abs(Cx.mul(Is,z));}}
    else v=0; // primary and secondary are isolated from each other
    const r=vm(v);return {value:r,text:CC.lcd(r)+' V'};};
  const P={J1:[60,150],F1a:[90,150],F1b:[170,150],P1:[205,175],P2:[205,280],J2:[60,300],S1:[285,175],S2:[285,280],R1a:[370,150],R1b:[480,150],L1a:[480,200],L1b:[480,300]};
  const names={J1:'J1 (supply)',F1a:'F1 left',F1b:'F1 right',P1:'Primary P1',P2:'Primary P2',J2:'J2 (supply)',S1:'Secondary S1',S2:'Secondary S2',R1a:'R1 left',R1b:'R1 right',L1a:'L1 top',L1b:'L1 bottom'};
  const svg=()=>B.svg(540,340,
    B.supply(20,8,200,70,'AC POWER SUPPLY',Vsup0+' VAC @ 60 Hz')+B.pcb(20,110,505,220)+
    B.wire([[150,78],[150,95],[60,95],[60,150]],'#c62828')+B.wire([[180,78],[180,100],[34,100],[34,300],[60,300]],'#222')+
    B.trace([P.J1,P.F1a])+B.trace([P.F1b,[205,150],P.P1],'TRACE 1',[188,140])+B.trace([P.P2,[205,300],P.J2])+
    B.trace([P.S1,[285,150],P.R1a],'TRACE 2',[325,140])+B.trace([P.R1b,[505,150],[505,200],P.L1a],'TRACE 3',[517,180,90])+B.trace([P.L1b,[480,310],[285,310],P.S2],'TRACE 4',[385,324])+
    B.xfmr(215,180,60,95,'T1')+B.part('F',P.F1a,P.F1b,'F1')+B.part('PR',P.R1a,P.R1b,'R1')+B.part('L',P.L1a,P.L1b,'L1')+
    B.label(195,172,'P1',{size:10,anchor:'end'})+B.label(195,296,'P2',{size:10,anchor:'end'})+B.label(296,172,'S1',{size:10,anchor:'start'})+B.label(296,296,'S2',{size:10,anchor:'start'})+B.label(60,135,'J1',{size:11})+B.label(60,325,'J2',{size:11}));
  const padsArr=Object.keys(P).map(id=>({id,x:P[id][0],y:P[id][1],label:names[id]}));
  const XLn=w*L,Zn=Math.hypot(R,XLn);
  const work=()=>{
    const st=[`>Expected values from the markings: the secondary should give ${m(`V_s=\\frac{${n(Vsup0)}\\,\\text{V}}{${ratio}}=${q(Vsec,'V',3)}`)}, and the load should draw about ${fmt(Inom*1e3,3)} mA:`,
      `X_L=2\\pi F L=${q(XLn,'Ω',3)}`,`Z=\\sqrt{R^2+X_L^2}=${q(Zn,'Ω',3)}`,`I_s=\\frac{V_s}{Z}=${q(Inom*1e3,'mA',3)}`,
      `I_p\\approx\\frac{I_s}{${ratio}}=${q(Inom/ratio*1e3,'mA',3)}`,'>The supply current is this reflected load current plus a few milliamperes of magnetizing current.'];
    if(priOpen>=0){st.push(`>The supply current is 0 mA: the primary circuit is open, so not even the transformer's small magnetizing current flows. With no current, the full supply voltage appears across the break.`,
      `>The meter reads about ${fmt(Vsup,3)} V only across <b>${names[priPads[priOpen]]}</b> to <b>${names[priPads[priOpen+1]]}</b>, so the fault is <b>${f}</b>. The secondary reads 0 V everywhere.`);}
    else if(f==='Secondary Open')st.push(`>The supply still draws a few milliamperes (${fmt(Ip*1e3,2)} mA). That is the magnetizing current of an energized transformer with no load, so the primary circuit is complete. The full supply voltage is across P1 to P2.`,
      '>Yet S1 to S2 reads 0 V and no voltage appears anywhere in the secondary circuit. An open in the load would show the secondary voltage across the break; here there is no voltage at all, so the <b>secondary winding is open</b>.');
    else if(secOpen>=0)st.push(`>The supply draws only the transformer's small magnetizing current (${fmt(Ip*1e3,2)} mA), so the secondary carries no load current. S1 to S2 reads the full secondary voltage, so the winding is fine and the break is in the load circuit.`,
      `>The secondary voltage (about ${fmt(E,3)} V) appears only across <b>${names[secPads[secOpen]]}</b> to <b>${names[secPads[secOpen+1]]}</b>, so the fault is <b>${f}</b>.`);
    else if(f==='No Faults')st.push(`>The supply current, the secondary voltage and the R1 and L1 voltages are all close to the expected values (allowing for the 20% tolerance). There is no fault.`);
    else{const part=f.slice(0,2);st.push(`>Load current flows, so nothing is open. A shorted part drops 0 V: the reading across <b>${part}</b> is about 0 V while the other part has nearly the whole secondary voltage, so <b>${part} is shorted</b>.`);}
    return st;};
  return {svg,pads:padsArr,faults,answer:ans,measure,work,
    meters:()=>[{label:'Supply AC volts',text:CC.lcd(vm(Vsup),1)},{label:'Supply AC mA',text:CC.lcd(am(Ip*1000),1)}],
    info:()=>`T1 is a ${ratio}:1 step-down transformer (primary : secondary turns). Marked values: R1 = ${fR(R)}, L1 = ${fL(L)}. Parts can be 20% off their marked values and the meters up to 5% off.`};
}

  manual:`<h2>About this program</h2><p>AC Circuits Challenge is a set of practice exercises to use alongside a textbook or course. It gives you instant feedback on every answer, help and worked solutions when you need them, and a score for every exercise.</p>
  <p>There are fourteen exercises:</p><ul><li><b>Fundamentals:</b> voltage conversions (rms, peak, peak-to-peak, average), transformers, and capacitors and inductors in series and parallel.</li><li><b>Series and parallel AC circuits:</b> RC, RL and RLC worksheets.</li><li><b>Resonance:</b> series and parallel resonant circuits.</li><li><b>Troubleshooting:</b> find the fault on a series RLC board and on a transformer board using a virtual voltmeter.</li></ul>
  <p>Every run picks new values, so you can practice an exercise as often as you like. Each exercise starts with a short page of key ideas and formulas; choose <b>Begin</b> when you are ready. The program times each exercise. When you finish, you can print a certificate with your name, ID, score, time and a validity code that an instructor can confirm with <b>Check validity</b>.</p>
  <h2>Conventions used</h2><p>Phase angle θ is always the impedance angle: the angle by which the source voltage leads the total current. It is positive for inductive circuits and negative for capacitive circuits. The RC and RL sheets accept either sign; the RLC sheets grade the sign.</p><p>Inductor and capacitor values are those you would find in a parts catalog (1 mH to 1 H, 1 nF to 10 µF), and the troubleshooting parts have a 20% tolerance.</p>`,
  groups:[
    {title:'Fundamentals',items:[
      {id:'conv',title:'Voltage Conversions',icon:'wave',sub:'rms, peak, peak-to-peak, average',intro:CC.introPage({text:two(`<p>An AC voltage can be described four ways. <b>Rms</b> (effective) voltage is what most meters show, and it lets you use Ohm's law and power formulas just as with DC. <b>Peak</b> voltage is the highest point of the wave and matters for rectifiers and part ratings. <b>Peak-to-peak</b> is the full height from the lowest to the highest point, which is what you read on an oscilloscope. <b>Average</b> voltage is the mean over one half cycle.</p><p>For a sine wave the four are linked by fixed factors. The easiest method is to convert the given value to peak first, then from peak to each of the others.</p>`,sineSVG(55,0)),extra:convFormulas,how:PS_HOW('eleven','Each gives one rms, peak, peak-to-peak or average voltage; find the other three.')}),run:conversions},
      {id:'xfmr',title:'Transformers',icon:'xfmr',sub:'turns, voltage and current ratios',intro:CC.introPage({text:two(`<p>A transformer steps AC voltage up or down. The source connects to the primary winding and the load to the secondary winding. If the secondary has more turns than the primary, the voltage is stepped up; if it has fewer, the voltage is stepped down.</p><p>An ideal transformer delivers the same power it takes in, so current changes the opposite way to voltage: stepping voltage up steps current down. Use Ohm's law on the load to find the secondary current.</p>`,XF_DIAG('')),formulas:[{cap:'Voltage ratio',tex:'\\frac{V_s}{V_p}=\\frac{N_s}{N_p}'},{cap:'Current ratio',tex:'\\frac{I_p}{I_s}=\\frac{N_s}{N_p}'},{cap:'Secondary current (Ohm\'s law)',tex:'I_s=\\frac{V_s}{R}'}],
        how:PS_HOW('ten','Each shows three known values in blue boxes; find the three yellow boxes. You will also need the load resistance on the schematic. N is the number of turns, p means primary and s means secondary.')}),run:transformerSet},
      {id:'spc',title:'Series and Parallel C',icon:'cap',sub:'total capacitance',intro:spIntro('C'),run:(el,s)=>CC.problemSet(el,s,{list:()=>spProblems('C')})},
      {id:'spl',title:'Series and Parallel L',icon:'ind',sub:'total inductance',intro:spIntro('L'),run:(el,s)=>CC.problemSet(el,s,{list:()=>spProblems('L')})},
    ]},
    {title:'Series and parallel AC circuits',items:[
      wsModule('rcs','RC Series Circuits','res','reactance, impedance, phase',()=>seriesWS('RC'),T.rcS,[F.XC,F.ZRC,F.IT,F.thRC,F.VR,{cap:'Capacitor voltage',tex:'V_C=I_T X_C'},F.PTs,F.PA],sc(['R','C']),sketch.rcS,SIGN_FREE),
      wsModule('rls','RL Series Circuits','ind','reactance, impedance, phase',()=>seriesWS('RL'),T.rlS,[F.XL,F.ZRL,F.IT,F.thRL,F.VR,{cap:'Inductor voltage',tex:'V_L=I_T X_L'},F.PTs,F.PA],sc(['R','L']),sketch.rlS,SIGN_FREE),
      wsModule('rlcs','RLC Series Circuits','wave','13 quantities',()=>seriesWS('RLC'),T.rlcS,[F.XC,F.XL,F.ZRLC,F.IT,{cap:'Phase angle',tex:'\\theta=\\arctan\\left(\\frac{X_L-X_C}{R}\\right)'},{cap:'Part voltages',tex:'V_R=I_T R\\quad V_C=I_T X_C\\quad V_L=I_T X_L'},F.PTs,F.PA],sc(['R','C','L']),sketch.rlcS,SIGN_GRADED),
      wsModule('rcp','RC Parallel Circuits','cap','branch currents, phase',()=>parallelWS('RC'),T.rcP,[F.XC,{cap:'Branch currents',tex:'I_R=\\frac{V_S}{R}\\quad I_C=\\frac{V_S}{X_C}'},{cap:'Total current',tex:'I_T=\\sqrt{I_R^2+I_C^2}'},F.ZP,{cap:'Phase angle',tex:'\\theta=-\\arctan\\left(\\frac{I_C}{I_R}\\right)'},F.PTp,F.PA],pc(['R','C']),sketch.rcP,SIGN_FREE),
      wsModule('rlp','RL Parallel Circuits','ind','branch currents, phase',()=>parallelWS('RL'),T.rlP,[F.XL,{cap:'Branch currents',tex:'I_R=\\frac{V_S}{R}\\quad I_L=\\frac{V_S}{X_L}'},{cap:'Total current',tex:'I_T=\\sqrt{I_R^2+I_L^2}'},F.ZP,{cap:'Phase angle',tex:'\\theta=\\arctan\\left(\\frac{I_L}{I_R}\\right)'},F.PTp,F.PA],pc(['R','L']),sketch.rlP,SIGN_FREE),
      wsModule('rlcp','RLC Parallel Circuits','wave','13 quantities',()=>parallelWS('RLC'),T.rlcP,[F.XC,F.XL,{cap:'Total current',tex:'I_T=\\sqrt{I_R^2+(I_L-I_C)^2}'},F.ZP,{cap:'Phase angle',tex:'\\theta=\\arctan\\left(\\frac{I_L-I_C}{I_R}\\right)'},F.PTp,F.PA],pc(['R','L','C']),sketch.rlcP,SIGN_GRADED),
    ]},
    {title:'Resonance',items:[
      wsModule('sres','Series Resonance','wave','resonant frequency, Q effects',seriesRes,T.sR,[F.Fr,{cap:'At resonance',tex:'X_L=X_C\\quad Z=R\\quad \\theta=0°'},F.IT,{cap:'Reactive voltages',tex:'V_L=V_C=I_T X_L'}],sc(['R','C','L']),sketch.sR,'At resonance θ is 0°.'),
      wsModule('pres','Parallel Resonance','wave','resonant frequency, tank current',parallelRes,T.pR,[F.Fr,{cap:'At resonance',tex:'X_L=X_C\\quad I_T=I_R\\quad \\theta=0°'},{cap:'Branch currents',tex:'I_L=I_C=\\frac{V_S}{X_L}'},F.ZP],pc(['R','L','C']),sketch.pR,'At resonance θ is 0°.'),
    ]},
    {title:'Troubleshooting',items:[
      {id:'ts1',title:'Troubleshooting Simple Circuits',icon:'wrench',sub:'series RLC on a PC board',intro:CC.introPage({text:`<p>A fuse, capacitor, resistor and inductor are wired in series on a PC board, driven by a 10 V, 1 kHz supply. Any one part can be open or shorted, any of the four copper traces can be open, or the board can be working. Use the voltmeter to find out which.</p>
        <p><b>A good strategy:</b></p><ul><li>Look at the supply current first. <b>0 mA</b> means the loop is open. With no current, good parts drop 0 V and the full supply voltage appears across the break, so look for the one spot that reads the full voltage.</li><li>If current flows, nothing is open. A <b>shorted</b> part drops 0 V, so look for a part with no voltage across it.</li><li>If every part has a reasonable voltage, the board has no fault.</li></ul>
        <p>Remember that in a series RLC circuit the capacitor or inductor voltage can be larger than the supply voltage. Review series RLC circuits before you start.</p>`,how:TS_HOW}),run:(el,s)=>CC.trouble(el,s,{count:10,points:10,build:seriesBoard})},
      {id:'ts2',title:'Troubleshooting Transformer Circuits',icon:'xfmr',sub:'fuse, transformer, R and L',intro:CC.introPage({text:`<p>A fuse and a step-down transformer feed a load made of a power resistor and an inductor in series. Any of these can be faulty: the fuse blown, either transformer winding open, the resistor or inductor open or shorted, or one of the four copper traces open. The board can also be working.</p>
        <p><b>A good strategy:</b></p><ul><li>Look at the supply current first. <b>0 mA</b> means the primary circuit is open (fuse, trace 1 or the primary winding). Find the spot that reads the full supply voltage.</li><li>An energized transformer always draws a small <b>magnetizing current</b>, even with nothing connected to its secondary. If the supply current is just a few milliamperes, no load current is flowing: either the secondary winding is open (no secondary voltage anywhere) or the load circuit is open (the secondary voltage appears across the break).</li><li>If normal current flows, look for a shorted part: it drops 0 V.</li></ul>
        <p>The primary and secondary are isolated from each other, so always keep both probes on the same side of the transformer.</p>`,how:TS_HOW}),run:(el,s)=>CC.trouble(el,s,{count:10,points:10,build:xfmrBoard})},
    ]}
  ]
});
})();
