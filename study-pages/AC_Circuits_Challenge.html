<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>AC Circuits Challenge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b3261e'/%3E%3Cpath d='M5 16q5.5-12 11 0t11 0' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<style>:root{
  --bg:#f4f1ea; --surface:#fffdf8; --surface2:#f0ece2; --ink:#1d2228; --ink2:#55606b; --line:#d9d2c3;
  --brand:#b3261e; --brand-ink:#fff; --accent:#1f5fa8; --ok:#1e7d43; --ok-bg:#e3f3e8; --bad:#b3261e; --bad-bg:#fbe6e4;
  --warn:#9a6400; --warn-bg:#fdf1d8; --board:#c9a66b; --board-dark:#9c7a42; --trace:#e8c48a; --copper:#b5652b;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06); --r:12px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15181c; --surface:#1e2228; --surface2:#262b33; --ink:#e9e6df; --ink2:#a3abb5; --line:#363c46;
  --brand:#ff6b5e; --brand-ink:#1a0d0b; --accent:#7fb2ff; --ok:#5fd08a; --ok-bg:#16301f; --bad:#ff7a6e; --bad-bg:#3a1c1a;
  --warn:#f0b54a; --warn-bg:#3a2e12; --board:#6b5530; --board-dark:#4e3d22; --trace:#a8854d; --copper:#d58a4d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15181c; --surface:#1e2228; --surface2:#262b33; --ink:#e9e6df; --ink2:#a3abb5; --line:#363c46;
  --brand:#ff6b5e; --brand-ink:#1a0d0b; --accent:#7fb2ff; --ok:#5fd08a; --ok-bg:#16301f; --bad:#ff7a6e; --bad-bg:#3a1c1a;
  --warn:#f0b54a; --warn-bg:#3a2e12; --board:#6b5530; --board-dark:#4e3d22; --trace:#a8854d; --copper:#d58a4d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
math{font-size:1.1em}
math[display="block"]{margin:.4em 0;overflow-x:auto;overflow-y:hidden;max-width:100%}

/* header */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);}
.topbar .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{width:34px;height:34px;flex:none}
.brand{font-weight:800;color:var(--brand);letter-spacing:-.01em;line-height:1.1;font-size:1.05rem;text-decoration:none}
.brand small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw;color:var(--ink2);font-weight:500;font-size:.72rem;letter-spacing:0}
.topbar .sp{flex:1}
.home-chip{text-decoration:none;color:inherit}
@media (max-width:560px){.home-chip span{display:none}}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 10px;font-size:.85rem;cursor:pointer;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;width:38px;height:38px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}

main{max-width:1100px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:1.6rem;line-height:1.2;margin:.2em 0 .4em;letter-spacing:-.01em}
h2{font-size:1.2rem;margin:1.2em 0 .5em}
h3{font-size:1rem;margin:1em 0 .4em}
p{margin:.5em 0}
.muted{color:var(--ink2)}
.small{font-size:.875rem}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card+.card{margin-top:14px}
.grid{display:grid;gap:12px}
.cols2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.cols2{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:42px;text-decoration:none;color:var(--ink)}
.btn:hover{filter:brightness(.97)}
.btn:focus-visible,.iconbtn:focus-visible,.chip:focus-visible,input:focus-visible,.menu-item:focus-visible,.pad:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.blue{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.875rem;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}

/* home */
.hero{display:grid;gap:16px;grid-template-columns:1fr;align-items:center;margin-bottom:8px}
@media (min-width:860px){.hero{grid-template-columns:1.1fr 1fr}}
.hero h1{font-size:2rem;color:var(--brand);margin:0}
.group-title{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);margin:22px 0 8px;font-weight:700}
.menu{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.menu-item{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;box-shadow:var(--shadow);min-height:64px;width:100%;color:var(--ink)}
.menu-item:hover{border-color:var(--brand)}
.menu-item .ic{width:42px;height:42px;flex:none;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--brand)}
.menu-item .ic svg{width:30px;height:30px}
.menu-item b{display:block;line-height:1.25}
.menu-item span{font-size:.8rem;color:var(--ink2)}
.menu-item .best{margin-left:auto;font-size:.75rem;font-weight:700;color:var(--ok);white-space:nowrap}
.utils{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

/* intro */
.intro-text p{max-width:68ch}
.formulas{display:grid;gap:8px 18px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));align-items:center}
.formula{background:var(--surface2);border-radius:10px;padding:8px 12px;overflow-x:auto}
.formula .cap{font-size:.78rem;color:var(--ink2);display:block}
.diagram{display:flex;justify-content:center;align-items:center;background:var(--surface2);border-radius:10px;padding:10px;overflow:hidden}
.diagram svg{max-width:100%;height:auto}
.where{font-size:.85rem;color:var(--ink2);margin:.2em 0 0;padding-left:1em}

/* status bar */
.statusbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.pill{border-radius:999px;background:var(--surface2);border:1px solid var(--line);padding:3px 10px;font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}

/* givens */
.givens{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.given{background:var(--warn-bg);border-radius:10px;padding:6px 10px}
.given .k{font-size:.8rem;color:var(--ink2)}
.given .v{font-weight:700;font-variant-numeric:tabular-nums;font-size:1.05rem}

/* worksheet rows */
.ws{display:grid;gap:8px}
.wrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--surface)}
.wrow .lab{font-weight:600;text-align:center}
.wrow .inp{display:flex;align-items:center;gap:6px;min-width:0}
.wrow input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 10px;font-variant-numeric:tabular-nums;font-size:1rem}
.wrow .unit{color:var(--ink2);min-width:2.2em;font-size:.95rem}
.wrow .acts{display:flex;gap:6px}
.wrow .fb{grid-column:1/-1;font-size:.875rem;display:none}
.wrow.ok{border-color:var(--ok);background:var(--ok-bg)}
.wrow.bad{border-color:var(--bad);background:var(--bad-bg)}
.wrow.ok .fb,.wrow.bad .fb,.wrow.info .fb{display:block}
.wrow.ok .fb{color:var(--ok)} .wrow.bad .fb{color:var(--bad)}
input.ok{border-color:var(--ok)!important;background:var(--ok-bg)!important}
input.bad{border-color:var(--bad)!important;background:var(--bad-bg)!important}
input.known{background:#dbe8fb!important;border-color:#9dbbe6!important;font-weight:700}
:root[data-theme="dark"] input.known{background:#1d2d47!important;border-color:#35507c!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) input.known{background:#1d2d47!important;border-color:#35507c!important}}
input.ask{background:var(--warn-bg)!important}

/* problems list */
.prob{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.prob-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.field{display:grid;gap:4px;margin:8px 0}
.field label{font-size:.875rem;color:var(--ink2)}
.field input{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:9px 10px;width:100%}
.fields{display:grid;gap:4px 14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.verdict{font-weight:800;font-size:1.25rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.progress{height:6px;border-radius:999px;background:var(--surface2);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--brand);transition:width .3s}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,15,.5);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--surface);border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.35);padding:18px}
.modal h3{margin-top:0}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:120;font-weight:600;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}

/* tables */
table.t{border-collapse:collapse;width:100%;font-size:.9rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.tablewrap{overflow-x:auto}

/* board / troubleshooting */
.board-wrap{background:var(--surface2);border-radius:12px;padding:8px;overflow:hidden}
.board-wrap svg{width:100%;height:auto;display:block;touch-action:manipulation}
.pad{cursor:pointer}
.pad circle.hit{fill:transparent}
.pad:hover circle.ring{stroke:var(--accent);stroke-width:3}
.meter{display:flex;gap:10px;flex-wrap:wrap}
.lcd{font-family:var(--mono);background:#9fb59a;color:#0f1a0e;border-radius:6px;padding:4px 10px;font-size:1.35rem;min-width:7.5ch;text-align:right;box-shadow:inset 0 2px 4px rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.meterbox{background:#3b3f45;color:#eee;border-radius:10px;padding:8px 10px;display:grid;gap:4px;justify-items:start}
.meterbox .ml{font-size:.75rem;letter-spacing:.05em;text-transform:uppercase;color:#c9cdd2}
.faults{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.faults label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;background:var(--surface)}
.faults input{accent-color:var(--brand);width:18px;height:18px}
.faults label.correct{border-color:var(--ok);background:var(--ok-bg)}
.faults label.wrong{border-color:var(--bad);background:var(--bad-bg)}

/* certificate */
.cert{background:#fffdf4;color:#222;border:10px double #8a6d1f;padding:28px;text-align:center;border-radius:6px;max-width:760px;margin:0 auto}
.cert h2{font-family:Georgia,serif;font-size:2rem;margin:.2em 0;color:#7a1610}
.cert .big{font-family:Georgia,serif;font-size:1.6rem;margin:.3em 0}
.cert dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;text-align:left;max-width:460px;margin:18px auto 0}
.cert dt{color:#666}
.cert dd{margin:0;font-weight:600}

.kbd{font-family:var(--mono);background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:.85em}
.hide{display:none!important}
.center{text-align:center}
.mt{margin-top:14px}
.anim-bulb{transition:opacity .3s}

@media print{
  .topbar,.noprint,.toast,.scrim{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0;max-width:none}
  .card{box-shadow:none;border:none}
  .cert{border-color:#8a6d1f}
}

@media (max-width:520px){.brand small{display:none}.brand{font-size:1rem}h1{font-size:1.35rem}.hero h1{font-size:1.6rem}main{padding:12px 12px 60px}.card{padding:12px}.wrow{grid-template-columns:48px minmax(0,1fr) auto;padding:6px}}

.work{margin-top:6px;color:var(--ink)}.work summary{cursor:pointer;font-weight:600;color:var(--accent);font-size:.875rem}.work[open]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}.work math{font-size:1em}
</style>

<script>/* Circuits Challenge offline engine. No network access, no external libraries. */
(function(){
'use strict';
const CC = window.CC = {};

/* ---------- small utils ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
CC.$ = $; CC.$$ = $$;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
CC.esc = esc;
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
CC.el = el;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
Object.assign(CC,{rnd,ri,pick,shuffle});
CC.E12=[1,1.2,1.5,1.8,2.2,2.7,3.3,3.9,4.7,5.6,6.8,8.2];
CC.E6=[1,1.5,2.2,3.3,4.7,6.8];
/** random value from an E-series between lo and hi (inclusive) */
CC.eVal=function(lo,hi,series=CC.E12){const out=[];for(let d=-15;d<=9;d++){for(const m of series){const v=+(m*Math.pow(10,d)).toPrecision(3);if(v>=lo*0.999&&v<=hi*1.001)out.push(v);}}return pick(out);};
/** round to nearest E-series value */
CC.eNear=function(x,series=CC.E12){const d=Math.floor(Math.log10(x));let best=null,bd=1e99;for(const dd of [d-1,d,d+1])for(const m of series){const v=+(m*Math.pow(10,dd)).toPrecision(3);const e=Math.abs(Math.log(v/x));if(e<bd){bd=e;best=v;}}return best;};
CC.sig=(x,n=3)=>x===0?0:+x.toPrecision(n);
/** format number for display: up to `n` significant figures, no exponent, trims zeros */
CC.fmt=function(x,n=4){
  if(x===null||x===undefined||isNaN(x))return '—';
  if(!isFinite(x))return '∞';
  if(Math.abs(x)<1e-12)return '0';
  let v=+x.toPrecision(n);
  let s;
  const a=Math.abs(v);
  if(a>=1e15||a<1e-9) s=v.toExponential(n-1);
  else { const dec=Math.max(0,n-1-Math.floor(Math.log10(a))); s=v.toFixed(Math.min(dec,12)); if(s.indexOf('.')>=0)s=s.replace(/0+$/,'').replace(/\.$/,''); }
  // thousands separators for readability on integers part
  const parts=s.split('.'); if(Math.abs(v)>=10000) parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,','); return parts.join('.');
};
/** parse a typed number. Accepts "1,234.5", "1.2e3", "−5", and SI suffixes k, M, m, u/µ, n, p if allowSuffix */
CC.parse=function(str,allowSuffix=true){
  if(str===null||str===undefined)return NaN;
  let s=String(str).trim().replace(/[−–]/g,'-').replace(/\s+/g,'');
  if(!s)return NaN;
  s=s.replace(/,(?=\d{3}(\D|$))/g,'');
  s=s.replace(/,/g,'.');
  let mult=1;
  if(allowSuffix){const m=s.match(/^(.*?)([kKMmuµnp])$/);if(m&&m[1]!==''&&!isNaN(+m[1])){mult={k:1e3,K:1e3,M:1e6,m:1e-3,u:1e-6,'µ':1e-6,n:1e-9,p:1e-12}[m[2]];s=m[1];}}
  if(!/^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(s))return NaN;
  return parseFloat(s)*mult;
};
/** compare typed value with correct value */
CC.prefixed=u=>/^(m|k|µ|μ|M|n|p|G)./.test(u||'');
CC.close=function(user,correct,tol=0.02,absTol=null){
  if(isNaN(user))return false;
  if(absTol===null) absTol=Math.max(1e-9,Math.abs(correct)*1e-6);
  if(Math.abs(user-correct)<=absTol)return true;
  return Math.abs(user-correct)<=Math.abs(correct)*tol;
};
CC.fmtTime=function(ms){const s=Math.round(ms/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(ss).padStart(2,'0');};
CC.deg=r=>r*180/Math.PI;
CC.rad=d=>d*Math.PI/180;

/* complex numbers */
const Cx=CC.Cx={
  c:(re,im=0)=>({re,im}),
  add:(a,b)=>({re:a.re+b.re,im:a.im+b.im}),
  sub:(a,b)=>({re:a.re-b.re,im:a.im-b.im}),
  mul:(a,b)=>({re:a.re*b.re-a.im*b.im,im:a.re*b.im+a.im*b.re}),
  div:(a,b)=>{const d=b.re*b.re+b.im*b.im;return {re:(a.re*b.re+a.im*b.im)/d,im:(a.im*b.re-a.re*b.im)/d};},
  abs:a=>Math.hypot(a.re,a.im),
  inv:a=>Cx.div({re:1,im:0},a),
  par:(a,b)=>Cx.div(Cx.mul(a,b),Cx.add(a,b))
};

/* ---------- storage (best effort) ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}},
  del(k){try{localStorage.removeItem(k);}catch(e){}}
};
CC.store=store;

/* ---------- TeX-subset → MathML ---------- */
const GREEK={alpha:'α',beta:'β',gamma:'γ',delta:'δ',theta:'θ',pi:'π',omega:'ω',phi:'φ',lambda:'λ',tau:'τ',mu:'μ',rho:'ρ',sigma:'σ',epsilon:'ε',eta:'η',
  Omega:'Ω',Delta:'Δ',Sigma:'Σ',Phi:'Φ',Theta:'Θ',Lambda:'Λ'};
const OPS={cdot:'·',times:'×',approx:'≈',pm:'±',to:'→',ne:'≠',le:'≤',ge:'≥',angle:'∠',infty:'∞',deg:'°',div:'÷',parallel:'∥',cdots:'⋯',ldots:'…',
  overline:null,rightarrow:'→',leftarrow:'←',Rightarrow:'⇒',equiv:'≡',neg:'¬',oplus:'⊕',odot:'⊙',vee:'∨',wedge:'∧',bar:null};
function texToMathML(src,block){
  const p={s:src,i:0,up:0};
  const body=seq(p,null);
  return '<math'+(block?' display="block"':'')+'><mrow>'+body+'</mrow></math>';
}
CC.tex=texToMathML;
CC.m=s=>texToMathML(s,false);
CC.M=s=>texToMathML(s,true);
function seq(p,end){
  let out='';
  while(p.i<p.s.length){
    const c=p.s[p.i];
    if(end&&c===end){p.i++;return out;}
    if(c===' '){p.i++;continue;}
    let base=atom(p); if(base===null)continue;
    let sub=null,sup=null;
    for(;;){
      while(p.s[p.i]===' ')p.i++;
      const d=p.s[p.i];

/* ---------- modal / toast ---------- */
CC.modal=function(html,buttons=[{label:'Close',primary:true}],opts={}){
  return new Promise(res=>{
    const sc=el(`<div class="scrim" role="dialog" aria-modal="true"><div class="modal">${html}<div class="row end mt modal-btns"></div></div></div>`);
    const bb=$('.modal-btns',sc);
    const close=v=>{sc.remove();document.removeEventListener('keydown',onKey);res(v);};
    buttons.forEach((b,i)=>{const x=el(`<button class="btn ${b.primary?'primary':''} ${b.cls||''}">${b.label}</button>`);x.onclick=()=>{if(b.onClick&&b.onClick(sc)===false)return;close(b.value!==undefined?b.value:i);};bb.appendChild(x);});
    const onKey=e=>{if(e.key==='Escape'&&!opts.noEscape)close(-1);};
    document.addEventListener('keydown',onKey);
    sc.addEventListener('click',e=>{if(e.target===sc&&!opts.noEscape)close(-1);});
    document.body.appendChild(sc);
    const f=$('input',sc)||$('.btn.primary',sc);if(f)setTimeout(()=>f.focus(),30);
    if(opts.onOpen)opts.onOpen(sc);
  });
};
CC.confirm=(msg,yes='Yes',no='Cancel')=>CC.modal(`<p>${msg}</p>`,[{label:no,value:false},{label:yes,primary:true,value:true}]).then(v=>v===true);

/* ---------- validity code ---------- */
function hashStr(s){let h1=0x811c9dc5,h2=0x1b873593;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,16777619);h2=Math.imul(h2^c,2246822507);h2^=h2>>>13;}return [h1>>>0,h2>>>0];}
CC.validity=function(prog,name,id,title,score,time,date){
  const norm=[prog,name.trim().toUpperCase(),String(id).trim(),title.trim().toUpperCase(),String(score).trim(),String(time).trim(),String(date).trim()].join('|');
  const [a,b]=hashStr(norm);const A='ABCDEFGHJKLMNPQRSTUVWXYZ';let out='';let x=a,y=b;
  for(let i=0;i<10;i++){const v=(i<5?x:y);out+=A[v%A.length];if(i<5)x=Math.floor(x/A.length);else y=Math.floor(y/A.length);}
  return out.slice(0,5)+'-'+out.slice(5);
};

class Session{
  constructor(m){this.m=m;this.t0=Date.now();this.done=false;this.timers=[];}
  elapsed(){return Date.now()-this.t0;}
  every(fn,ms){const t=setInterval(fn,ms);this.timers.push(t);return t;}
  cleanup(){this.timers.forEach(clearInterval);}
  restart(){location.hash='#/run/'+this.m.id;App.route();}
  finish(score,summary){
    if(this.done)return;this.done=true;this.cleanup();
    score=Math.max(0,Math.min(100,Math.round(score)));
    const st=App.student();
    const time=CC.fmtTime(this.elapsed());
    const d=new Date();const date=d.toLocaleString(undefined,{year:'numeric',month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const rec={mid:this.m.id,title:this.m.title,score,time,date,name:st&&!App.guest?st.name:'(practice)',id:st&&!App.guest?st.id:''};
    if(this.m.graded!==false){const g=store.get(App.key('grades'),[]);g.push(rec);store.set(App.key('grades'),g.slice(-500));}
    App.last=rec;
    const pass=App.cfg.pass||80;
    const certOk=App.opts().certs&&rec.id;
    return CC.modal(`<h3>Exercise completed</h3><p class="verdict ${score>=pass?'ok':'bad'}">Score: ${score}%</p><p class="muted">Time on task: ${time}</p>${summary?`<div class="small">${summary}</div>`:''}${!rec.id?'<p class="small muted">Sign in with a name and ID to print a certificate.</p>':''}`,
      [{label:'Main menu',value:'menu'},{label:'Review',value:'review'},...(certOk?[{label:'Certificate',value:'cert'}]:[]),{label:'Try again',primary:true,value:'again'}],{noEscape:false}).then(v=>{
        if(v==='menu')location.hash='#/';
        else if(v==='cert')location.hash='#/cert';
        else if(v==='again')this.restart();
      });
  }
}

/* ---------- exercise kit: helpers for intro pages ---------- */
CC.introPage=function({text,formulas,diagram,extra,how}){

/* worked solution renderer: steps are TeX strings (math) or strings starting with '>' (prose) */
CC.workHTML=function(steps,label='Show worked solution'){
  if(!steps||!steps.length)return '';
  const body=steps.map(t=>typeof t==='string'&&t.startsWith('>')?`<p class="small">${t.slice(1)}</p>`:CC.M(t)).join('');
  return `<details class="work"><summary>${label}</summary>${body}</details>`;
};
/* ---------- Worksheet: one circuit, many answers, Check (-2) Help (-3) Grade ---------- */
CC.worksheet=function(root,s,spec){
  CC._last=spec;
  const checkCost=spec.checkCost??2, helpCost=spec.helpCost??3, N=spec.items.length;
  let pen=0;const helped=new Set();
  const w=el(`<div>
    <div class="statusbar"><span class="pill" id="wpen">Deductions: 0</span><span class="pill" id="wtime">0:00</span><span class="pill small">Check: −${checkCost} if wrong${helpCost?` · Help: −${helpCost}`:''}</span></div>
    <div class="cols2"><div><div class="card"><h2 style="margin-top:0">${esc(spec.title||'Circuit')}</h2><div class="diagram">${spec.diagram||''}</div><div class="givens">${spec.givens.map(g=>`<div class="given"><div class="k">${g.k}</div><div class="v">${g.v}</div></div>`).join('')}</div>${spec.note?`<p class="small muted">${spec.note}</p>`:''}</div><div id="wextra"></div></div>
    <div><div class="card"><h2 style="margin-top:0">Find</h2><div class="ws" id="ws"></div>
    <div class="row end mt"><button class="btn primary" id="wgrade">Grade</button></div></div></div></div></div>`);
  root.appendChild(w);
  const wsEl=$('#ws',w);
  const upd=()=>{$('#wpen',w).textContent='Deductions: '+pen;$('#wpen',w).className='pill'+(pen?' bad':'');};
  s.every(()=>{$('#wtime',w).textContent=CC.fmtTime(s.elapsed());},1000);
  const ok=(it,val)=>{if(it.signFree)return CC.close(Math.abs(val),Math.abs(it.value),it.tol??spec.tol??0.02,it.absTol??null);return CC.close(val,it.value,it.tol??spec.tol??0.02,it.absTol??null);};
  spec.items.forEach((it,i)=>{
    const r=el(`<div class="wrow"><div class="lab">${CC.m(it.sym)}</div><div class="inp"><input type="text" inputmode="decimal" autocomplete="off" aria-label="${esc(it.name||it.sym)}"><span class="unit">${esc(it.unit||'')}</span></div>
      <div class="acts"><button class="btn sm" data-a="c" title="Check your answer. Cost: ${checkCost} points if wrong." aria-label="Check">${IC.check.replace('<svg','<svg width="18" height="18"')}</button><button class="btn sm" data-a="h" title="Formulas and hints. Cost: ${helpCost} points." aria-label="Help">?</button></div><div class="fb"></div></div>`);
    it._row=r;const inp=$('input',r);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const nx=spec.items[i+1];if(nx)$('input',nx._row).focus();else $('#wgrade',w).focus();}});
    $('[data-a=c]',r).onclick=()=>{
      const val=CC.parse(inp.value,!CC.prefixed(it.unit));
      if(isNaN(val)){CC.toast('Type a number first.');return;}
      if(ok(it,val)){r.className='wrow ok';$('.fb',r).textContent='Right!';}
      else{pen+=checkCost;r.className='wrow bad';$('.fb',r).textContent=`Not right — ${checkCost} points deducted.`;upd();}
    };
    $('[data-a=h]',r).onclick=async()=>{
      const first=!helped.has(i);
      if(first){const go=await CC.modal(`<h3>Help for ${CC.m(it.sym)}</h3><p>Help shows the formula and method for this item. It costs ${helpCost} points, charged once per item.</p><p class="small muted">Choose Exit help to go back with no penalty.</p>`,[{label:'Exit help',value:false},{label:`Show help (−${helpCost})`,primary:true,value:true}]);
        if(go!==true)return;helped.add(i);pen+=helpCost;upd();}
      CC.modal(`<h3>${CC.m(it.sym)}${it.name?` — ${esc(it.name)}`:''}</h3>${(it.help||[]).map(h=>typeof h==='string'&&h.startsWith('$')?CC.M(h.slice(1)):`<p>${h}</p>`).join('')}`);
    };
    wsEl.appendChild(r);
  });
  $('#wgrade',w).onclick=async()=>{
    const blanks=spec.items.filter(it=>!$('input',it._row).value.trim()).length;
    if(blanks&&!(await CC.confirm(`${blanks} answer${blanks>1?'s are':' is'} blank and will be graded as wrong. Grade now?`,'Grade')))return;
    let right=0;
    spec.items.forEach(it=>{const inp=$('input',it._row);const val=CC.parse(inp.value,!CC.prefixed(it.unit));const good=!isNaN(val)&&ok(it,val);if(good)right++;inp.disabled=true;
      it._row.className='wrow '+(good?'ok':'bad');$('.fb',it._row).innerHTML=(good?'Right! ':'')+`Correct answer: <b>${CC.fmt(it.value)} ${esc(it.unit||'')}</b>`+CC.workHTML(typeof it.work==='function'?it.work():it.work);$$('button',it._row).forEach(b=>b.disabled=true);});
    $('#wgrade',w).disabled=true;
    const raw=right/N*100;const score=raw-pen;
    if(spec.after)spec.after($('#wextra',w));
    s.finish(score,`${right} of ${N} answers correct (${Math.round(raw)}%), minus ${pen} points for checks and help.`);
    const again=el('<div class="row end mt noprint"><button class="btn primary">New problem</button></div>');$('button',again).onclick=()=>s.restart();$('#wgrade',w).parentNode.after(again);
  };
};

/* ---------- Problem set: N problems one at a time, each graded immediately ---------- */
CC.problemSet=function(root,s,spec){
  const N=spec.count;let i=0,right=0,total=0;const log=[];
  const probs=spec.list?spec.list():Array.from({length:N},(_,k)=>spec.gen(k));
  CC._last=probs;
  const w=el(`<div><div class="statusbar"><span class="pill" id="pn"></span><span class="pill" id="ps">Correct: 0</span><span class="pill" id="pt">0:00</span></div><div class="progress"><i id="pb" style="width:0"></i></div><div id="pbody" class="mt"></div></div>`);
  root.appendChild(w);
  s.every(()=>{$('#pt',w).textContent=CC.fmtTime(s.elapsed());},1000);
  const show=()=>{
    const p=probs[i];
    $('#pn',w).textContent=`Problem ${i+1} of ${probs.length}`;$('#pb',w).style.width=(i/probs.length*100)+'%';
    const body=$('#pbody',w);body.innerHTML='';
    const card=el(`<div class="card"><div class="cols2"><div>${p.title?`<h2 style="margin-top:0">${p.title}</h2>`:''}${p.prompt?`<div>${p.prompt}</div>`:''}${p.diagram?`<div class="diagram mt">${p.diagram}</div>`:''}</div>
      <div><div class="fields" id="pf"></div><div id="pfb"></div><div class="row end mt"><button class="btn primary" id="pg">${spec.gradeLabel||'Grade answers'}</button></div></div></div></div>`);
    body.appendChild(card);
    const pf=$('#pf',card);
    p.fields.forEach(f=>{
      let fe;
      if(f.choices){
        fe=el(`<div class="field"><label>${f.label}</label><div class="faults">${f.choices.map((c,ci)=>`<label><input type="radio" name="ch_${f.key}" value="${ci}"> <span>${c}</span></label>`).join('')}</div></div>`);
      } else {
        fe=el(`<div class="field"><label>${f.label}${f.unit?` <span class="muted">(${esc(f.unit)})</span>`:''}</label><input type="text" inputmode="${f.text?'text':'decimal'}" autocomplete="off" ${f.given?'readonly':''} class="${f.given?'known':'ask'}" value="${f.given?esc(f.show||CC.fmt(f.value)):''}"></div>`);
        const inp=$('input',fe);inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const all=$$('input:not([readonly])',pf);const k=all.indexOf(inp);if(all[k+1])all[k+1].focus();else $('#pg',card).click();}});
      }
      f._el=fe;pf.appendChild(fe);
    });
    const firstAsk=$('input:not([readonly])',pf);if(firstAsk&&window.innerWidth>700)firstAsk.focus();
    $('#pg',card).onclick=()=>{
      const btn=$('#pg',card);
      if(btn.dataset.done){i++;if(i>=probs.length)return end();return show();}
      let pr=0,pt=0;const fbs=[];
      p.fields.forEach(f=>{if(f.given)return;pt++;let good;
        if(f.choices){const c=$('input:checked',f._el);good=c&&+c.value===f.answer;$$('.faults label',f._el).forEach((lb,ci)=>{if(ci===f.answer)lb.classList.add('correct');else if(c&&+c.value===ci)lb.classList.add('wrong');});$$('input',f._el).forEach(x=>x.disabled=true);}
        else{const inp=$('input',f._el);
          if(f.check)good=f.check(inp.value);
          else if(f.text)good=inp.value.trim().toUpperCase().replace(/\s+/g,'')===String(f.value).toUpperCase().replace(/\s+/g,'');
          else{const v=CC.parse(inp.value,f.suffix!==false&&!CC.prefixed(f.unit));good=f.signFree?CC.close(Math.abs(v),Math.abs(f.value),f.tol??spec.tol??0.02,f.absTol??null):CC.close(v,f.value,f.tol??spec.tol??0.02,f.absTol??null);}
          inp.classList.add(good?'ok':'bad');inp.readOnly=true;
          if(!good)fbs.push(`${f.label}: correct answer is <b>${f.show||CC.fmt(f.value)}${f.unit?' '+esc(f.unit):''}</b>`);}
        if(good)pr++;});
      right+=pr;total+=pt;log.push({i,pr,pt});
      $('#ps',w).textContent=`Correct: ${right} of ${total}`;
      const allGood=pr===pt;
      $('#pfb',card).innerHTML=`<p class="verdict ${allGood?'ok':'bad'}">${allGood?'Correct!':(pr?`${pr} of ${pt} correct`:'Incorrect')}</p>${fbs.length?`<p class="small">${fbs.join('<br>')}</p>`:''}${p.explain?`<div class="formula mt">${p.explain}</div>`:''}${CC.workHTML(typeof p.work==='function'?p.work():p.work)}`;
      btn.dataset.done='1';btn.textContent=i+1<probs.length?'Next problem':'Finish';btn.focus();
    };
  };
  const end=()=>{$('#pb',w).style.width='100%';const score=total?right/total*100:0;s.finish(score,`${right} of ${total} answers correct.`);
    const again=el('<div class="card mt center"><p>Exercise finished.</p><div class="row" style="justify-content:center"><a class="btn" href="#/">Main menu</a><button class="btn primary">New problem set</button></div></div>');$('button',again).onclick=()=>s.restart();$('#pbody',w).appendChild(again);};
  show();
};

/* ---------- Troubleshooting: PC board, probes, meter, fault list ---------- */
/* spec: {count, points, build(k)=>{svg(state)->string, pads:[{id,x,y}], faults:[names], answer:index, measure(a,b)->{text,value}, info(): html, meters(): [{label,text}]}} */
CC.trouble=function(root,s,spec){
  const N=spec.count||10, P=spec.points||10;let k=0,earned=0;
  const w=el(`<div><div class="statusbar"><span class="pill" id="tn"></span><span class="pill" id="tp"></span><span class="pill" id="ts">Score: 0</span><span class="pill" id="tt">0:00</span></div><div id="tbody"></div></div>`);
  root.appendChild(w);
  s.every(()=>{$('#tt',w).textContent=CC.fmtTime(s.elapsed());},1000);
  const next=()=>{
    const b=spec.build(k);let pts=P;CC._last=b;
    if(!b.padName)b.padName=id=>{const p=b.pads.find(q=>q.id===id);return p&&p.label||id;};let probe={red:null,black:null,active:'red'};let lastKey=null;const readings=[];
    $('#tn',w).textContent=`Problem ${k+1} of ${N}`;
    const updP=()=>{$('#tp',w).textContent=`${pts} point${pts===1?'':'s'} remain for this item`;$('#tp',w).className='pill'+(pts<P/2?' bad':'');};
    updP();
    const body=$('#tbody',w);body.innerHTML='';
    const card=el(`<div class="cols2"><div><div class="card"><div class="board-wrap" id="bw"></div>
      <div class="row mt" style="justify-content:space-between"><div class="row"><span class="small muted">Tap a pad to move the</span><button class="btn sm" id="pr" style="border-color:#c62828">● Red probe</button><button class="btn sm" id="pk">● Black probe</button></div></div>
      <div class="meter mt" id="mt"></div><div class="small muted mt" id="info"></div></div></div>
      <div><div class="card"><h3 style="margin-top:0">${spec.selectLabel||'Select the circuit fault'}</h3><div class="faults" id="fl"></div><div class="row end mt"><button class="btn primary" id="tg">Grade item</button></div><div id="tfb"></div></div>
      <div class="card"><h3 style="margin-top:0">Readings</h3><div class="small" id="rlog"><span class="muted">No readings yet. Each new reading costs 1 point.</span></div></div></div></div>`);
    body.appendChild(card);
    $('#info',card).innerHTML=b.info?b.info():'';
    const fl=$('#fl',card);b.faults.forEach((f,i)=>fl.appendChild(el(`<label><input type="radio" name="flt" value="${i}"> <span>${esc(f)}</span></label>`)));
    const setActive=a=>{probe.active=a;$('#pr',card).classList.toggle('blue',a==='red');$('#pk',card).classList.toggle('blue',a==='black');};
    $('#pr',card).onclick=()=>setActive('red');$('#pk',card).onclick=()=>setActive('black');setActive('red');
    const meterHTML=()=>{
      const ms=(b.meters?b.meters():[]).map(m=>`<div class="meterbox"><span class="ml">${m.label}</span><span class="lcd">${m.text}</span></div>`).join('');
      let main='----';
      if(probe.red&&probe.black){main=b.measure(probe.red,probe.black).text;}
      return `<div class="meterbox"><span class="ml">${spec.meterLabel||'Voltmeter'}</span><span class="lcd">${main}</span></div>`+ms;
    };
    const draw=()=>{
      const pads=b.pads.map(p=>{const r=probe.red===p.id,bl=probe.black===p.id;
        return `<g class="pad" data-id="${p.id}" tabindex="0" role="button" aria-label="Test point ${esc(p.label||p.id)}"><circle class="ring" cx="${p.x}" cy="${p.y}" r="7" fill="#d8d8d8" stroke="#777" stroke-width="2"/><circle cx="${p.x}" cy="${p.y}" r="2.5" fill="#555"/>${r?`<circle cx="${p.x}" cy="${p.y}" r="11" fill="none" stroke="#d32f2f" stroke-width="4"/><text x="${p.x+12}" y="${p.y-10}" fill="#d32f2f" font-weight="800" font-size="14">+</text>`:''}${bl?`<circle cx="${p.x}" cy="${p.y}" r="${r?15:11}" fill="none" stroke="#111" stroke-width="4"/><text x="${p.x-20}" y="${p.y-10}" fill="#111" font-weight="800" font-size="16">−</text>`:''}<circle class="hit" cx="${p.x}" cy="${p.y}" r="16"/></g>`;}).join('');
      $('#bw',card).innerHTML=b.svg().replace('</svg>',pads+'</svg>');
      $$('.pad',card).forEach(g=>{const f=()=>tap(g.dataset.id);g.onclick=f;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f();}};});
      $('#mt',card).innerHTML=meterHTML();
    };
    const tap=id=>{
      if(card.dataset.graded)return;
      probe[probe.active]=id;
      setActive(probe.active==='red'?'black':'red');
      if(probe.red&&probe.black){const key=probe.red+'|'+probe.black;if(key!==lastKey){lastKey=key;if(pts>0)pts--;updP();
        const m=b.measure(probe.red,probe.black);readings.unshift(`<span style="color:#d32f2f">+${esc(b.padName(probe.red))}</span> / −${esc(b.padName(probe.black))}: <b>${m.text}</b>`);
        $('#rlog',card).innerHTML=readings.slice(0,12).join('<br>');}}
      draw();
    };
    draw();
    $('#tg',card).onclick=()=>{
      const btn=$('#tg',card);
      if(card.dataset.graded){k++;if(k>=N)return end();return next();}
      const c=$('input:checked',fl);
      if(!c){CC.modal('<p>You did not select a fault. Select a fault, then choose Grade item.</p>');return;}
      card.dataset.graded='1';
      const good=+c.value===b.answer;const got=good?pts:0;earned+=got;
      $$('label',fl).forEach((lb,i)=>{if(i===b.answer)lb.classList.add('correct');else if(i===+c.value)lb.classList.add('wrong');});
      $$('input',fl).forEach(x=>x.disabled=true);
      $('#ts',w).textContent=`Score: ${earned}`;
      $('#tfb',card).innerHTML=`<p class="verdict ${good?'ok':'bad'}">${good?'Correct!':'Incorrect'}</p><p class="small">${good?`You earned ${got} point${got===1?'':'s'} on this item.`:`The correct answer is highlighted: <b>${esc(b.faults[b.answer])}</b>.`} Your total score so far is ${earned} point${earned===1?'':'s'}.</p>${b.explain?`<p class="small muted">${b.explain()}</p>`:''}${CC.workHTML(typeof b.work==='function'?b.work():b.work,'Show how to find this fault')}`;
      btn.textContent=k+1<N?'Continue':'Finish';
    };
  };
  const end=()=>{const score=earned/(N*P)*100;s.finish(score,`${earned} of ${N*P} possible points.`);};
  next();
};

/* meter helpers */
CC.meterErr=()=>{const bias=rnd(-0.03,0.03);return v=>v*(1+bias+rnd(-0.008,0.008));};
CC.lcd=(v,dec=2)=>{if(!isFinite(v))return 'OL';const a=Math.abs(v);if(a<0.005)return (0).toFixed(dec);return v.toFixed(a>=100?1:dec);};

/** component between two pad points (horizontal or vertical) */
B.part=(type,a,b,label)=>{
  const [x1,y1]=a,[x2,y2]=b;const cx=(x1+x2)/2,cy=(y1+y2)/2;const L=Math.hypot(x2-x1,y2-y1);const ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI;

  if(type==='PR')body=`<rect x="${-bl/2}" y="-10" width="${bl}" height="20" rx="2" fill="#f1f1f1" stroke="#888"/><text x="0" y="3.5" font-size="8" text-anchor="middle" fill="#666">POWER RESISTOR</text>`;
  if(type==='C')body=`<rect x="${-bl/2}" y="-9" width="${bl}" height="18" rx="5" fill="#f5c518" stroke="#a88600"/><line x1="${-bl/2+6}" y1="-9" x2="${-bl/2+6}" y2="9" stroke="#a88600"/>`;
  if(type==='L')body=`<rect x="${-bl/2}" y="-10" width="${bl}" height="20" rx="4" fill="#a3322a" stroke="#5e1a15"/>`+Array.from({length:7},(_,i)=>`<line x1="${-bl/2+5+i*(bl-10)/6}" y1="-10" x2="${-bl/2+5+i*(bl-10)/6}" y2="10" stroke="#7a221c" stroke-width="1.5"/>`).join('');
  if(type==='F')body=`<rect x="${-bl/2}" y="-7" width="${bl}" height="14" rx="3" fill="#e9f3f7" stroke="#8aa"/><rect x="${-bl/2}" y="-7" width="8" height="14" fill="#bbb"/><rect x="${bl/2-8}" y="-7" width="8" height="14" fill="#bbb"/><line x1="${-bl/2+8}" y1="0" x2="${bl/2-8}" y2="0" stroke="#777" stroke-width="1"/>`;
  if(type==='D')body=`<rect x="${-bl/2}" y="-6" width="${bl}" height="12" rx="3" fill="#222"/><rect x="${bl/2-9}" y="-6" width="4" height="12" fill="#ddd"/>`;

  return `<g transform="translate(${cx},${cy}) rotate(${flip?ang-180:ang})">${lead}${body}</g>${lab}`;
};
B.xfmr=(x,y,w,h,label)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="#2a8c8c" stroke="#145"/><rect x="${x+w*.25}" y="${y-6}" width="${w*.5}" height="${h+12}" rx="3" fill="#cfd8dc" stroke="#78909c"/><text x="${x+w/2}" y="${y+h/2+4}" font-size="11" font-weight="800" text-anchor="middle" fill="#455a64" transform="rotate(-90 ${x+w/2} ${y+h/2})">ACME</text>${label?B.label(x+w/2,y+h+24,label):''}`;

<script></script>
<script>(function(){
'use strict';

/* ---------- value helpers ---------- */

const pickV=()=>pick([5,6,9,10,12,15,18,20,24,30]);
const pickF=()=>pick([60,100,200,400,500,1000,2000,2500,5000,10000]);
const capFor=(F,X)=>eNear(1/(TP*F*X)*1e6)*1e-6;          // farads, E12 rounded

const C_OK=c=>c>=1e-9&&c<=10e-6;     // 1 nF … 10 µF (non-polarized)
const L_OK=l=>l>=1e-3&&l<=1;         // 1 mH … 1 H

/* ---------- TeX helpers for worked solutions (numbers formatted exactly as CC.fmt shows them) ---------- */
const n=(x,s=4)=>fmt(x,s).replace(/,/g,'\\,');
const UT={'Ω':'\\,\\Omega','°':'°','':''};
const q=(x,u,s=4)=>n(x,s)+(u in UT?UT[u]:'\\,\\text{'+u+'}');
const capF=C=>`${n(C*1e6,3)}\\times10^{-6}\\,\\text{F}`;
const indH=L=>L>=1?`${n(L,3)}\\,\\text{H}`:`${n(L*1e3,3)}\\times10^{-3}\\,\\text{H}`;
const amp=I=>`${n(I)}\\,\\text{A}`;
const toMA=I=>`I=${amp(I)}=${q(I*1e3,'mA')}`;

/* ---------- shared help text ---------- */
const H={
  XC:[`Start here: impedance, current and the voltages all depend on ${m('X_C')}.`,'$X_C=\\frac{1}{2\\pi F C}',`Use hertz and farads, for example ${m('0.22\\,\\text{µF}=0.22\\times10^{-6}\\,\\text{F}')}.`,'<b>Common mistakes:</b> leaving out the 2π, or entering microfarads as if they were farads.'],
  XL:[`Start here: impedance, current and the voltages all depend on ${m('X_L')}.`,'$X_L=2\\pi F L',`Use hertz and henries, for example ${m('68\\,\\text{mH}=0.068\\,\\text{H}')}.`,'<b>Common mistakes:</b> leaving out the 2π, or entering millihenries as if they were henries.'],
  ma:`Ohm's law gives amperes. Multiply by 1000 for milliamperes: ${m('0.0025\\,\\text{A}=2.5\\,\\text{mA}')}.`,
  same:x=>[`A series circuit has only one path, so the same current flows through every part: ${m(x+'=I_T')}.`,`Find ${m('I_T=\\frac{V_S}{Z}')} first.`],
  vsame:x=>[`Every branch of a parallel circuit is connected straight across the source, so ${m(x+'=V_S')}.`],
  pa:['$P_A=V_S I_T','Apparent power is the source voltage times the total current, in volt-amperes (VA). Volts times milliamperes gives mVA.'],
  ptS:['$P_T=I_T^2 R=V_R I_T','Only the resistance turns electrical energy into heat, so true power uses the resistor only. Volts times milliamperes gives mW.','<b>Common mistake:</b> using the source voltage or the impedance here. That gives apparent power, not true power.'],
  ptP:['$P_T=V_S I_R','Only the resistor branch dissipates power. Volts times milliamperes gives mW.','<b>Common mistake:</b> using the total current. That gives apparent power.'],
};
const it=(sym,name,unit,value,help,work,extra={})=>Object.assign({sym,name,unit,value,help,work},extra);
const PH_TOL={absTol:0.6};

/* ---------- intro / how-it-works text ---------- */
const TOLNOTE='An answer is accepted when it is within 2% of the exact value, so rounding to three or four significant figures is fine. Phase angles are also accepted within 0.6°.';
const PHASE=`<p><b>Phase angle sign.</b> In this program θ is the impedance angle: the angle by which the source voltage leads the total current. It is <b>positive</b> for an inductive circuit (current lags the voltage) and <b>negative</b> for a capacitive circuit (current leads the voltage).</p>`;
const howWS=signNote=>`<p>One circuit is shown with its values. Work out every quantity in the list and type each answer in the unit shown beside its box. You can type plain numbers or use prefixes such as <span class="kbd">4.7k</span>.</p>
<ul><li><b>✓ (Check)</b> tests a single answer. A right answer costs nothing; a wrong one costs 2 points.</li>
<li><b>? (Help)</b> shows the formula and method for that item. It costs 3 points the first time you open it for an item.</li>
<li><b>Grade</b> marks the whole sheet. Your score is the percentage of answers that are right, minus any deductions. Blank answers count as wrong.</li></ul>
<p>${TOLNOTE} ${signNote}</p><p>After grading, every item shows a worked solution with this circuit's numbers. Each run picks new values, so you can practice as often as you like. A score of 80% or more is a pass.</p>`;
const SIGN_FREE='For θ in this exercise, either sign is accepted.';
const SIGN_GRADED='For θ in this exercise the sign is graded: positive if the circuit is inductive, negative if it is capacitive.';

/* ---------- series RC / RL / RLC worksheets ---------- */
function seriesWS(type){
  const hasC=type!=='RL',hasL=type!=='RC',rlc=hasC&&hasL;
  const span=rlc?[0.3,3]:[0.4,2.5];
  let V,F,R,C=null,L=null,XC=0,XL=0,X,Z,I;
  for(;;){
    V=pickV();F=pickF();R=eVal(470,10000);
    C=hasC?capFor(F,R*rnd(...span)):null;L=hasL?indFor(F,R*rnd(...span)):null;
    XC=hasC?1/(TP*F*C):0;XL=hasL?TP*F*L:0;X=XL-XC;Z=Math.hypot(R,X);I=V/Z;
    if(hasC&&!C_OK(C))continue;if(hasL&&!L_OK(L))continue;
    if(I<0.2e-3||I>50e-3)continue;
    if(rlc&&Math.abs(X)<0.15*R)continue;
    break;
  }
  const th=CC.deg(Math.atan(X/R)),VR=I*R,VC=I*XC,VL=I*XL,PT=I*I*R,PA=V*I,mA=I*1e3;
  const items=[];
  const wXC=['X_C=\\frac{1}{2\\pi F C}',`X_C=\\frac{1}{2\\pi\\times${q(F,'Hz')}\\times${capF(C)}}`,`X_C=${q(XC,'Ω')}`];
  const wXL=['X_L=2\\pi F L',`X_L=2\\pi\\times${q(F,'Hz')}\\times${indH(L)}`,`X_L=${q(XL,'Ω')}`];
  if(hasC)items.push(it('X_C','Capacitive reactance','Ω',XC,H.XC,wXC));
  if(hasL)items.push(it('X_L','Inductive reactance','Ω',XL,H.XL,wXL));
  const zTex=rlc?'Z=\\sqrt{R^2+(X_L-X_C)^2}':hasC?'Z=\\sqrt{R^2+X_C^2}':'Z=\\sqrt{R^2+X_L^2}';
  const zNum=rlc?`Z=\\sqrt{(${q(R,'Ω')})^2+(${q(XL,'Ω')}-${q(XC,'Ω')})^2}`:`Z=\\sqrt{(${q(R,'Ω')})^2+(${q(hasC?XC:XL,'Ω')})^2}`;
  const zHelp=rlc?['Inductive and capacitive reactance point in opposite directions (180° apart), so subtract them first. Then combine the net reactance with R at 90°.','$Z=\\sqrt{R^2+(X_L-X_C)^2}','<b>Common mistake:</b> adding the two reactances, or adding R and X directly instead of using the square root.']
    :[`Resistance and reactance are 90° apart, so they add like the sides of a right triangle.`,'$'+zTex,'<b>Common mistake:</b> simply adding R and X. Z is always larger than either one but smaller than their sum.'];
  items.push(it('Z','Impedance','Ω',Z,zHelp,[zTex,zNum,`Z=${q(Z,'Ω')}`]));
  const wI=['I_T=\\frac{V_S}{Z}',`I_T=\\frac{${q(V,'V')}}{${q(Z,'Ω')}}=${amp(I)}=${q(mA,'mA')}`];
  const same=s=>['>A series circuit has one path, so the same current flows through every part.',`${s}=I_T=\\frac{V_S}{Z}=\\frac{${q(V,'V')}}{${q(Z,'Ω')}}=${q(mA,'mA')}`];
  items.push(it('I_R','Resistor current','mA',mA,[...H.same('I_R'),H.ma],same('I_R')));
  if(hasC)items.push(it('I_C','Capacitor current','mA',mA,[...H.same('I_C'),H.ma],same('I_C')));
  if(hasL)items.push(it('I_L','Inductor current','mA',mA,[...H.same('I_L'),H.ma],same('I_L')));
  items.push(it('I_T','Total current','mA',mA,['Use Ohm\'s law with the impedance, not the resistance.','$I_T=\\frac{V_S}{Z}',H.ma],wI));
  let thHelp,thWork;
  if(rlc){
    thHelp=['$\\theta=\\arctan\\left(\\frac{X_L-X_C}{R}\\right)',`Keep the sign of ${m('X_L-X_C')}. If ${m('X_L')} is larger the circuit is inductive and θ is positive; if ${m('X_C')} is larger it is capacitive and θ is negative.`,'Set your calculator to degrees. <b>The sign is graded in this exercise.</b>'];
    thWork=['\\theta=\\arctan\\left(\\frac{X_L-X_C}{R}\\right)',`\\theta=\\arctan\\left(\\frac{${q(XL,'Ω')}-${q(XC,'Ω')}}{${q(R,'Ω')}}\\right)`,`\\theta=${n(th)}°`,`>${X>0?`${m('X_L')} is larger, so the circuit is inductive and θ is positive (the current lags the source voltage).`:`${m('X_C')} is larger, so the circuit is capacitive and θ is negative (the current leads the source voltage).`}`];
  } else if(hasC){
    thHelp=['$\\theta=-\\arctan\\left(\\frac{X_C}{R}\\right)',`The arctangent of ${m('\\frac{X_C}{R}')} gives the size of the angle. A series RC circuit is capacitive, so its impedance angle lies between 0° and −90°.`,'Set your calculator to degrees. '+SIGN_FREE];
    thWork=['\\theta=-\\arctan\\left(\\frac{X_C}{R}\\right)',`\\theta=-\\arctan\\left(\\frac{${q(XC,'Ω')}}{${q(R,'Ω')}}\\right)`,`\\theta=${n(th)}°`,'>Negative because the circuit is capacitive: the current leads the source voltage. Either sign was accepted.'];
  } else {
    thHelp=['$\\theta=\\arctan\\left(\\frac{X_L}{R}\\right)',`The arctangent of ${m('\\frac{X_L}{R}')} gives the angle. A series RL circuit is inductive, so its impedance angle lies between 0° and +90°.`,'Set your calculator to degrees. '+SIGN_FREE];
    thWork=['\\theta=\\arctan\\left(\\frac{X_L}{R}\\right)',`\\theta=\\arctan\\left(\\frac{${q(XL,'Ω')}}{${q(R,'Ω')}}\\right)`,`\\theta=${n(th)}°`,'>Positive because the circuit is inductive: the current lags the source voltage.'];
  }
  items.push(it('\\theta','Phase angle','°',th,thHelp,thWork,Object.assign({signFree:!rlc},PH_TOL)));
  const vw=(s,x,xs)=>[`${s}=I_T ${xs}`,`${s}=${amp(I)}\\times${q(x,'Ω')}`,`${s}=${q(I*x,'V')}`];
  items.push(it('V_R','Voltage across resistor','V',VR,['$V_R=I_T R',`Use the current in amperes and the resistance in ohms. (Milliamperes times kilohms also gives volts.)`],vw('V_R',R,'R')));
  if(hasC){const w=vw('V_C',XC,'X_C');if(!hasL)w.push('>Check: the voltages add at 90°, not directly.',`\\sqrt{V_R^2+V_C^2}=\\sqrt{(${n(VR)})^2+(${n(VC)})^2}=${q(V,'V')}=V_S`);
    items.push(it('V_C','Voltage across capacitor','V',VC,['$V_C=I_T X_C','Use the reactance, not the impedance.','<b>Common mistake:</b> expecting the part voltages to add up to the source. They add as vectors, not as plain numbers.'],w));}
  if(hasL){const w=vw('V_L',XL,'X_L');if(!hasC)w.push('>Check: the voltages add at 90°, not directly.',`\\sqrt{V_R^2+V_L^2}=\\sqrt{(${n(VR)})^2+(${n(VL)})^2}=${q(V,'V')}=V_S`);
    else w.push(`>${m('V_L')} and ${m('V_C')} are 180° apart, so either one can be larger than the source voltage. Check:`,`\\sqrt{V_R^2+(V_L-V_C)^2}=${q(V,'V')}=V_S`);
    items.push(it('V_L','Voltage across inductor','V',VL,['$V_L=I_T X_L','Use the reactance, not the impedance.'+(hasC?' In a series RLC circuit this voltage can be larger than the source.':'')],w));}
  items.push(it('P_T','True power','mW',PT*1e3,H.ptS,['P_T=I_T^2 R',`P_T=(${amp(I)})^2\\times${q(R,'Ω')}=${n(PT)}\\,\\text{W}=${q(PT*1e3,'mW')}`]));
  items.push(it('P_A','Apparent power','mVA',PA*1e3,H.pa,['P_A=V_S I_T',`P_A=${q(V,'V')}\\times${q(mA,'mA')}=${q(PA*1e3,'mVA')}`,`>The power factor is ${m(`\\frac{P_T}{P_A}=\\cos\\theta=${n(Math.cos(CC.rad(th)),3)}`)}.`]));
  const name={RC:'Series RC circuit',RL:'Series RL circuit',RLC:'Series RLC circuit'}[type];
  const comps=[{t:'R',label:'R'}];if(hasC)comps.push({t:'C',label:'C'});if(hasL)comps.push({t:'L',label:'L'});
  const givens=[{k:'Source voltage',v:V+' V'},{k:'Frequency',v:fF(F)},{k:'R',v:fR(R)}];if(hasC)givens.push({k:'C',v:fC(C)});if(hasL)givens.push({k:'L',v:fL(L)});
  const vecs=[{x:R,y:0,label:'R',color:'var(--brand)',ldy:X>0?16:-8}];
  if(hasL)vecs.push({x:0,y:XL,label:'XL',color:'var(--ink2)',ldx:-18});
  if(hasC)vecs.push({x:0,y:-XC,label:'XC',color:'var(--ink2)',ldx:-18});
  vecs.push({x:R,y:X,label:'Z',ldx:X>0?-12:12});
  return {title:name,diagram:S.series(comps,{srcLabel:'VS'}),givens,
    note:rlc?'θ is the impedance angle: positive if the circuit is inductive, negative if it is capacitive. The sign is graded.':'θ is the impedance angle (positive = inductive, negative = capacitive). Either sign is accepted here.',
    items,after:x=>phasorCard(x,vecs,th,'Impedance vector diagram',`θ = ${fmt(th,3)}° (${th>0?'inductive':'capacitive'})`)};
}

/* ---------- parallel RC / RL / RLC worksheets ---------- */
function parallelWS(type){
  const hasC=type!=='RL',hasL=type!=='RC',rlc=hasC&&hasL;
  const span=rlc?[0.3,3]:[0.4,2.5];
  let V,F,R,C=null,L=null,XC=0,XL=0,IR,IC,IL,Bn,IT,Z;
  for(;;){
    V=pickV();F=pickF();R=eVal(470,10000);
    C=hasC?capFor(F,R*rnd(...span)):null;L=hasL?indFor(F,R*rnd(...span)):null;
    XC=hasC?1/(TP*F*C):0;XL=hasL?TP*F*L:0;
    IR=V/R;IC=hasC?V/XC:0;IL=hasL?V/XL:0;Bn=IL-IC;IT=Math.hypot(IR,Bn);Z=V/IT;
    if(hasC&&!C_OK(C))continue;if(hasL&&!L_OK(L))continue;
    if(IT>100e-3)continue;
    if(rlc&&Math.abs(Bn)<0.15*IR)continue;
    break;
  }
  const th=CC.deg(Math.atan(Bn/IR)),PT=V*IR,PA=V*IT;
  const items=[];
  if(hasC)items.push(it('X_C','Capacitive reactance','Ω',XC,H.XC,['X_C=\\frac{1}{2\\pi F C}',`X_C=\\frac{1}{2\\pi\\times${q(F,'Hz')}\\times${capF(C)}}`,`X_C=${q(XC,'Ω')}`]));
  if(hasL)items.push(it('X_L','Inductive reactance','Ω',XL,H.XL,['X_L=2\\pi F L',`X_L=2\\pi\\times${q(F,'Hz')}\\times${indH(L)}`,`X_L=${q(XL,'Ω')}`]));
  items.push(it('Z','Impedance','Ω',Z,['In a parallel circuit it is easiest to find the branch currents and the total current first, then use Ohm\'s law.','$Z=\\frac{V_S}{I_T}',rlc?`Z can never be larger than ${m('R')}, because the total current is never smaller than ${m('I_R')}.`:`Z is always smaller than both ${m('R')} and ${m(hasC?'X_C':'X_L')}.`,`<b>Common mistake:</b> using the series formula ${m('\\sqrt{R^2+X^2}')}.`],
    ['Z=\\frac{V_S}{I_T}',`Z=\\frac{${q(V,'V')}}{${amp(IT)}}`,`Z=${q(Z,'Ω')}`,'>Find the total current first (see its worked solution).']));
  items.push(it('I_R','Resistor current','mA',IR*1e3,['Each branch sees the full source voltage, so use Ohm\'s law on each branch by itself.','$I_R=\\frac{V_S}{R}',H.ma],
    ['I_R=\\frac{V_S}{R}',`I_R=\\frac{${q(V,'V')}}{${q(R,'Ω')}}=${amp(IR)}=${q(IR*1e3,'mA')}`]));
  if(hasC)items.push(it('I_C','Capacitor current','mA',IC*1e3,['$I_C=\\frac{V_S}{X_C}',`Find ${m('X_C')} first.`,H.ma],['I_C=\\frac{V_S}{X_C}',`I_C=\\frac{${q(V,'V')}}{${q(XC,'Ω')}}=${amp(IC)}=${q(IC*1e3,'mA')}`]));
  if(hasL)items.push(it('I_L','Inductor current','mA',IL*1e3,['$I_L=\\frac{V_S}{X_L}',`Find ${m('X_L')} first.`,H.ma],['I_L=\\frac{V_S}{X_L}',`I_L=\\frac{${q(V,'V')}}{${q(XL,'Ω')}}=${amp(IL)}=${q(IL*1e3,'mA')}`]));
  const itTex=rlc?'I_T=\\sqrt{I_R^2+(I_L-I_C)^2}':hasC?'I_T=\\sqrt{I_R^2+I_C^2}':'I_T=\\sqrt{I_R^2+I_L^2}';
  const itNum=rlc?`I_T=\\sqrt{(${q(IR*1e3,'mA')})^2+(${q(IL*1e3,'mA')}-${q(IC*1e3,'mA')})^2}`:`I_T=\\sqrt{(${q(IR*1e3,'mA')})^2+(${q((hasC?IC:IL)*1e3,'mA')})^2}`;
  items.push(it('I_T','Total current','mA',IT*1e3,rlc?[`The inductor and capacitor currents are 180° apart, so subtract them first. Then combine the net reactive current with ${m('I_R')} at 90°.`,'$'+itTex,'<b>Common mistake:</b> adding the branch currents directly. That only works in DC circuits.']:['The resistor and reactive currents are 90° apart, so they add like the sides of a right triangle.','$'+itTex,'<b>Common mistake:</b> adding the branch currents directly. That only works in DC circuits.'],[itTex,itNum,`I_T=${q(IT*1e3,'mA')}`]));
  let thHelp,thWork;const lead=Math.abs(th);
  if(rlc){
    thHelp=['$\\theta=\\arctan\\left(\\frac{I_L-I_C}{I_R}\\right)',`If ${m('I_L')} is larger the circuit is inductive: the total current lags and θ is positive. If ${m('I_C')} is larger it is capacitive: the total current leads and θ is negative.`,'<b>The sign is graded in this exercise.</b> Some textbooks give the angle of the current instead, which has the opposite sign. Here θ is always the impedance angle.'];
    thWork=['\\theta=\\arctan\\left(\\frac{I_L-I_C}{I_R}\\right)',`\\theta=\\arctan\\left(\\frac{${q(IL*1e3,'mA')}-${q(IC*1e3,'mA')}}{${q(IR*1e3,'mA')}}\\right)`,`\\theta=${n(th)}°`,`>${Bn>0?`${m('I_L')} is larger, so the circuit is inductive: the total current lags the source voltage by ${fmt(lead,3)}° and θ is positive.`:`${m('I_C')} is larger, so the circuit is capacitive: the total current leads the source voltage by ${fmt(lead,3)}° and θ is negative.`}`];
  } else if(hasC){
    thHelp=['$\\theta=-\\arctan\\left(\\frac{I_C}{I_R}\\right)',`The arctangent of ${m('\\frac{I_C}{I_R}')} gives the angle by which the total current leads the source voltage. A capacitive circuit has a negative impedance angle.`,SIGN_FREE];
    thWork=['\\theta=-\\arctan\\left(\\frac{I_C}{I_R}\\right)',`\\theta=-\\arctan\\left(\\frac{${q(IC*1e3,'mA')}}{${q(IR*1e3,'mA')}}\\right)`,`\\theta=${n(th)}°`,`>The total current leads the source voltage by ${fmt(lead,3)}°, so the impedance angle is negative. Either sign was accepted.`];
  } else {
    thHelp=['$\\theta=\\arctan\\left(\\frac{I_L}{I_R}\\right)',`The arctangent of ${m('\\frac{I_L}{I_R}')} gives the angle by which the total current lags the source voltage. An inductive circuit has a positive impedance angle.`,SIGN_FREE];
    thWork=['\\theta=\\arctan\\left(\\frac{I_L}{I_R}\\right)',`\\theta=\\arctan\\left(\\frac{${q(IL*1e3,'mA')}}{${q(IR*1e3,'mA')}}\\right)`,`\\theta=${n(th)}°`,`>The total current lags the source voltage by ${fmt(lead,3)}°, so the impedance angle is positive. Either sign was accepted.`];
  }
  items.push(it('\\theta','Phase angle','°',th,thHelp,thWork,Object.assign({signFree:!rlc},PH_TOL)));
  const vs=s=>['>Every branch is connected directly across the source.',`${s}=V_S=${q(V,'V')}`];
  items.push(it('V_R','Voltage across resistor','V',V,H.vsame('V_R'),vs('V_R')));
  if(hasC)items.push(it('V_C','Voltage across capacitor','V',V,H.vsame('V_C'),vs('V_C')));
  if(hasL)items.push(it('V_L','Voltage across inductor','V',V,H.vsame('V_L'),vs('V_L')));
  items.push(it('P_T','True power','mW',PT*1e3,H.ptP,['P_T=V_S I_R',`P_T=${q(V,'V')}\\times${q(IR*1e3,'mA')}=${q(PT*1e3,'mW')}`]));
  items.push(it('P_A','Apparent power','mVA',PA*1e3,H.pa,['P_A=V_S I_T',`P_A=${q(V,'V')}\\times${q(IT*1e3,'mA')}=${q(PA*1e3,'mVA')}`,`>The power factor is ${m(`\\frac{P_T}{P_A}=\\cos\\theta=${n(Math.cos(CC.rad(th)),3)}`)}.`]));
  const name={RC:'Parallel RC circuit',RL:'Parallel RL circuit',RLC:'Parallel RLC circuit'}[type];
  const comps=[{t:'R',label:'R'}];if(hasL)comps.push({t:'L',label:'L'});if(hasC)comps.push({t:'C',label:'C'});
  const givens=[{k:'Source voltage',v:V+' V'},{k:'Frequency',v:fF(F)},{k:'R',v:fR(R)}];if(hasC)givens.push({k:'C',v:fC(C)});if(hasL)givens.push({k:'L',v:fL(L)});
  const k=1e3,net=(IC-IL)*k;
  const vecs=[{x:IR*k,y:0,label:'IR',color:'var(--brand)',ldy:net<0?-8:16}];
  if(hasC)vecs.push({x:0,y:IC*k,label:'IC',color:'var(--ink2)',ldx:-18});
  if(hasL)vecs.push({x:0,y:-IL*k,label:'IL',color:'var(--ink2)',ldx:-18});
  vecs.push({x:IR*k,y:net,label:'IT',ldx:net>0?-14:14});
  return {title:name,diagram:S.parallel(comps,{srcLabel:'VS'}),givens,
    note:rlc?'θ is the impedance angle: positive if the circuit is inductive (current lags), negative if it is capacitive (current leads). The sign is graded.':'θ is the impedance angle (positive = inductive, negative = capacitive). Either sign is accepted here.',
    items,after:x=>phasorCard(x,vecs,-th,'Current vector diagram (mA)',`${m('I_T')} ${th<0?'leads':'lags'} ${m('V_S')} by ${fmt(lead,3)}°, so θ = ${fmt(th,3)}° (${th>0?'inductive':'capacitive'})`)};
}

/* ---------- resonance worksheets ---------- */
function resValues(){
  for(;;){const L=eVal(1e-3,100e-3),C=eVal(0.001e-6,1e-6);const Fr=1/(TP*Math.sqrt(L*C));
    if(Fr>=200&&Fr<=100000)return {L,C,Fr,X:TP*Fr*L};}
}
const frWork=(L,C,Fr)=>['F_R=\\frac{1}{2\\pi\\sqrt{L C}}',`F_R=\\frac{1}{2\\pi\\sqrt{${indH(L)}\\times${capF(C)}}}`,`F_R=${q(Fr,'Hz')}`];
const frHelp=['Find the resonant frequency first; every reactance in this sheet is calculated at that frequency.','$F_R=\\frac{1}{2\\pi\\sqrt{L C}}','Use henries and farads. The answer is in hertz, so do not convert it to kHz.','<b>Common mistake:</b> forgetting to take the square root before dividing.'];
function seriesRes(){
  let L,C,Fr,X,R,V,I;
  for(;;){({L,C,Fr,X}=resValues());R=eNear(X*rnd(0.05,0.4));V=pick([1,2,3,5,6,10]);I=V/R;
    if(R>=10&&I>=0.5e-3&&I<=50e-3&&I*X<=60)break;}
  const mA=I*1e3,Q=X/R;
  return {title:'Series resonant circuit',diagram:S.series([{t:'R',label:'R'},{t:'C',label:'C'},{t:'L',label:'L'}],{srcLabel:'VS'}),
    givens:[{k:'Source voltage',v:V+' V'},{k:'R',v:fR(R)},{k:'C',v:fC(C)},{k:'L',v:fL(L)}],
    note:'The source is set to the resonant frequency of the circuit. θ is the impedance angle.',
    items:[it('F_R','Resonant frequency','Hz',Fr,frHelp,frWork(L,C,Fr)),
      it('X_L','Inductive reactance','Ω',X,['$X_L=2\\pi F_R L','Use the resonant frequency you just found.'],['X_L=2\\pi F_R L',`X_L=2\\pi\\times${q(Fr,'Hz')}\\times${indH(L)}`,`X_L=${q(X,'Ω')}`]),
      it('X_C','Capacitive reactance','Ω',X,['$X_C=\\frac{1}{2\\pi F_R C}',`At resonance ${m('X_C')} equals ${m('X_L')}, which makes a good check on your arithmetic.`],['X_C=\\frac{1}{2\\pi F_R C}',`X_C=\\frac{1}{2\\pi\\times${q(Fr,'Hz')}\\times${capF(C)}}`,`X_C=${q(X,'Ω')}=X_L`]),
      it('Z','Impedance','Ω',R,['$Z=\\sqrt{R^2+(X_L-X_C)^2}','At resonance the reactances cancel, leaving only the resistance.'],['Z=\\sqrt{R^2+(X_L-X_C)^2}',`Z=\\sqrt{(${q(R,'Ω')})^2+0^2}=${q(R,'Ω')}`,'>A series resonant circuit has its lowest impedance, equal to R.']),
      it('I_T','Total current','mA',mA,['$I_T=\\frac{V_S}{Z}','Because Z equals R at resonance, the current is as large as it can be.',H.ma],['I_T=\\frac{V_S}{Z}',`I_T=\\frac{${q(V,'V')}}{${q(R,'Ω')}}=${amp(I)}=${q(mA,'mA')}`]),
      it('\\theta','Phase angle','°',0,['$\\theta=\\arctan\\left(\\frac{X_L-X_C}{R}\\right)','With the reactances equal, the circuit acts like a pure resistance.'],['\\theta=\\arctan\\left(\\frac{X_L-X_C}{R}\\right)=\\arctan(0)=0°','>Current and voltage are in phase.'],PH_TOL),
      it('V_R','Voltage across resistor','V',V,['$V_R=I_T R','All of the source voltage appears across R.'],['V_R=I_T R',`V_R=${amp(I)}\\times${q(R,'Ω')}=${q(V,'V')}`]),
      it('V_L','Voltage across inductor','V',I*X,['$V_L=I_T X_L',`This can be much larger than the source voltage: it is Q times ${m('V_S')}, where ${m('Q=\\frac{X_L}{R}')}.`],['V_L=I_T X_L',`V_L=${amp(I)}\\times${q(X,'Ω')}=${q(I*X,'V')}`,`>That is ${m(`Q=\\frac{X_L}{R}=${n(Q,3)}`)} times the source voltage.`]),
      it('V_C','Voltage across capacitor','V',I*X,['$V_C=I_T X_C',`${m('V_C')} equals ${m('V_L')}; the two are 180° apart and cancel.`],['V_C=I_T X_C',`V_C=${amp(I)}\\times${q(X,'Ω')}=${q(I*X,'V')}`,'>It equals the inductor voltage, and the two cancel each other.']),
      it('P_T','True power','mW',I*I*R*1e3,['$P_T=I_T^2 R=V_S I_T','At resonance true power equals apparent power. Volts times milliamperes gives mW.'],['P_T=I_T^2 R',`P_T=(${amp(I)})^2\\times${q(R,'Ω')}=${q(I*I*R*1e3,'mW')}`])],
    after:x=>phasorCard(x,[{x:0,y:X,label:'XL',color:'var(--ink2)',ldx:-18},{x:0,y:-X,label:'XC',color:'var(--ink2)',ldx:-18},{x:R*3,y:0,label:'R = Z',color:'var(--brand)',ldy:-8}],0,'At resonance the reactances cancel','θ = 0°')};
}
function parallelRes(){
  let L,C,Fr,X,R,V,IR,IX;
  for(;;){({L,C,Fr,X}=resValues());R=eNear(X*rnd(2.5,20));V=pick([5,6,9,10,12,15,20]);IR=V/R;IX=V/X;
    if(R<=1e6&&IR>=0.1e-3&&IX<=100e-3)break;}
  return {title:'Parallel resonant circuit',diagram:S.parallel([{t:'R',label:'R'},{t:'L',label:'L'},{t:'C',label:'C'}],{srcLabel:'VS'}),
    givens:[{k:'Source voltage',v:V+' V'},{k:'R',v:fR(R)},{k:'C',v:fC(C)},{k:'L',v:fL(L)}],
    note:'The source is set to the resonant frequency of the circuit. Assume ideal components (no coil resistance). θ is the impedance angle.',
    items:[it('F_R','Resonant frequency','Hz',Fr,frHelp,frWork(L,C,Fr)),

const T={
  rcS:`<p>In a capacitor the current reaches its peak 90° before the voltage does. In a resistor current and voltage are in phase. So in a series RC circuit the resistance and the capacitive reactance add at right angles, like the two short sides of a right triangle. The long side is the impedance Z, the total opposition to current.</p><p>The same current flows through both parts. The resistor and capacitor voltages are also 90° apart, so they add as vectors to give the source voltage.</p>${PHASE}<p>A series RC circuit is capacitive, so θ lies between 0° and −90°.</p>`,
  rlS:`<p>In an inductor the voltage reaches its peak 90° before the current does. In a resistor current and voltage are in phase. So in a series RL circuit the resistance and the inductive reactance add at right angles, like the two short sides of a right triangle. The long side is the impedance Z.</p><p>The same current flows through both parts, and the resistor and inductor voltages add as vectors to give the source voltage.</p>${PHASE}<p>A series RL circuit is inductive, so θ lies between 0° and +90°.</p>`,
  rcP:`<p>In a parallel circuit every branch has the full source voltage across it, so start with each branch current. The capacitor current leads the voltage by 90° while the resistor current is in phase, so the two branch currents add at right angles to give the total current.</p><p>Once you know the total current, Ohm's law gives the impedance. In a parallel circuit Z is smaller than either branch opposition.</p>${PHASE}<p>In a parallel RC circuit the total current leads the source voltage, so θ lies between 0° and −90°. Many textbooks quote the same angle as a positive current angle; that is why either sign is accepted for the RC and RL sheets.</p>`,
  rlP:`<p>In a parallel circuit every branch has the full source voltage across it, so start with each branch current. The inductor current lags the voltage by 90° while the resistor current is in phase, so the two branch currents add at right angles to give the total current.</p><p>Once you know the total current, Ohm's law gives the impedance. In a parallel circuit Z is smaller than either branch opposition.</p>${PHASE}<p>In a parallel RL circuit the total current lags the source voltage, so θ lies between 0° and +90°.</p>`,
  rlcS:`<p>A capacitor's current leads its voltage by 90° and an inductor's current lags by 90°, so their reactances point in opposite directions and partly cancel. Subtract them to get the net reactance, then combine that with the resistance at 90° to get the impedance.</p><p>Because the reactive voltages cancel each other, the voltage across the inductor or the capacitor can be larger than the source voltage.</p>${PHASE}<p>In a series RLC circuit θ lies between −90° and +90°. It is positive when ${m('X_L')} is larger and negative when ${m('X_C')} is larger. <b>On this sheet the sign is graded.</b></p>`,
  rlcP:`<p>Each branch has the full source voltage across it, so find the three branch currents first. The capacitor and inductor currents are 180° apart and partly cancel. Subtract them to get the net reactive current, then combine that with the resistor current at 90° to get the total current. Ohm's law then gives the impedance.</p><p>Because the reactive currents cancel, the total current can be smaller than a single branch current.</p>${PHASE}<p>In a parallel RLC circuit θ is positive (inductive) when ${m('I_L')} is larger and negative (capacitive) when ${m('I_C')} is larger. <b>On this sheet the sign is graded.</b> Watch out: when ${m('I_C')} is larger, the current leads and θ is negative, even though some books then quote a positive current angle.</p>`,
  sR:`<p>Resonance happens at the one frequency where the inductive and capacitive reactances are equal. In a series circuit they cancel completely, so the impedance is just the resistance and the phase angle is 0°. That makes the current as large as it can be.</p><p>The vector diagram shows the reactances canceling, leaving the impedance on top of the resistance.</p><p>Each reactance still carries the full current, so the inductor and capacitor voltages can be many times the source voltage. The ratio is the circuit Q: ${m('Q=\\frac{X_L}{R}')}.</p>`,
  pR:`<p>Resonance happens at the one frequency where the inductive and capacitive reactances are equal. In a parallel circuit the inductor and capacitor currents are then equal and opposite, so they cancel. Only the resistor current flows from the source, the phase angle is 0°, and the impedance is at its highest.</p><p>The vector diagram shows the reactive currents canceling, leaving the total current on top of the resistor current.</p><p>A large current still circulates back and forth between the inductor and the capacitor. It can be many times larger than the current drawn from the source.</p>`
};

const VC_LAB=['Effective or rms voltage','Peak voltage','Peak to peak voltage','Average voltage during one half cycle'];

function conversions(el,s){
  CC.problemSet(el,s,{count:11,gen:()=>{
    let kind,given,vp;
    do{kind=ri(0,3);given=+(pick([1,2,5,10,20,50,100])*rnd(1,9.9)).toPrecision(3);vp=[given*Math.SQRT2,given,given/2,given*Math.PI/2][kind];}while(vp<1||vp>400);
    const vals=[vp/Math.SQRT2,vp,vp*2,vp*2/Math.PI];vals[kind]=given;
    const g=VC_SYM[kind];
    const work=[];
    if(kind===0)work.push('>First convert the rms value to peak.',`V_P=V_{rms}\\times1.414=${n(given)}\\times1.414=${q(vp,'V')}`);
    if(kind===2)work.push('>First convert the peak-to-peak value to peak.',`V_P=\\frac{V_{PP}}{2}=\\frac{${n(given)}}{2}=${q(vp,'V')}`);
    if(kind===3)work.push('>First convert the average value to peak.',`V_P=V_{avg}\\times1.571=${n(given)}\\times1.571=${q(vp,'V')}`);
    if(kind===1)work.push('>The peak value is given, so convert from it directly.');
    if(kind!==0)work.push(`V_{rms}=V_P\\times0.707=${n(vp)}\\times0.707=${q(vals[0],'V')}`);
    if(kind!==2)work.push(`V_{PP}=V_P\\times2=${n(vp)}\\times2=${q(vals[2],'V')}`);
    if(kind!==3)work.push(`V_{avg}=V_P\\times0.637=${n(vp)}\\times0.637=${q(vals[3],'V')}`);
    work.push('>Check: the order from largest to smallest is always peak-to-peak, peak, rms, average.');
    return {title:'Voltage conversion',prompt:`<p>The meter shows <b>${fmt(given)} V ${['rms','peak','peak to peak','average'][kind]}</b>. Calculate the other three voltages.</p>`,
      diagram:sineSVG(vp,kind),
      fields:VC_LAB.map((l,i)=>({key:'v'+i,label:l,unit:'V',value:vals[i],given:i===kind})),
      explain:convFormulas,work};
  }});
}

function spProblems(kind){ // kind 'C' or 'L'
  const types=shuffle([0,0,0,1,1,1,2,2,2,3,3,3]);// 0:2 par,1:3 par,2:2 ser,3:3 ser
  return types.map(t=>{
    const nn=t%2?3:2,par=t<2;
    const vals=Array.from({length:nn},()=>kind==='C'?eVal(0.01,100):eVal(1,1000));
    const unit=kind==='C'?'µF':'mH';
    const sum=(kind==='C')===par;
    const total=sum?vals.reduce((a,b)=>a+b,0):1/vals.reduce((a,b)=>a+1/b,0);
    const comps=vals.map((v,i)=>({t:kind,label:kind+(i+1)}));
    const dia=par?S.parallel(comps,{gap:76,first:84}):S.series(comps);
    const sym=kind+'_T';const parts=vals.map((_,i)=>kind+'_'+(i+1));
    const form=sum?sym+'='+parts.join('+'):sym+'=\\frac{1}{'+parts.map(p=>'\\frac{1}{'+p+'}').join('+')+'}';
    const u=unit==='µF'?'\\,\\text{µF}':'\\,\\text{mH}';
    const work=[form];
    if(sum)work.push(`${sym}=${vals.map(v=>n(v)).join('+')}=${n(total)}${u}`);
    else{const rec=vals.reduce((a,b)=>a+1/b,0);
      work.push(`${sym}=\\frac{1}{${vals.map(v=>'\\frac{1}{'+n(v)+'}').join('+')}}`,`${sym}=\\frac{1}{${n(rec)}}=${n(total)}${u}`,
        `>Check: the total must be smaller than the smallest ${kind==='C'?'capacitor':'inductor'} (${fmt(Math.min(...vals))} ${unit}).`);}
    const tip=sum?'':`<p class="small"><b>Common mistake:</b> forgetting the last step, ${m(sym+'=\\frac{1}{\\text{sum}}')}. Keep every value in ${unit} and the answer comes out in ${unit}.</p>`;
    return {title:`${nn} ${kind==='C'?'capacitors':'inductors'} in ${par?'parallel':'series'}`,
      prompt:`<div class="givens">${vals.map((v,i)=>`<div class="given"><div class="k">${kind}${i+1}</div><div class="v">${fmt(v)} ${unit}</div></div>`).join('')}</div>`,
      diagram:dia,fields:[{key:'t',label:`Total ${kind==='C'?'capacitance':'inductance'}, ${m(sym)}`,unit,value:total}],
      explain:`<p class="small">${sum?'Values in '+(par?'parallel':'series')+' simply add.':'Use the reciprocal formula.'}</p>${M(form)}${tip}`,work};
  });
}
function spIntro(kind){
  const C=kind==='C';
  const txt=C?`<p>Capacitors are connected in parallel to get more capacitance, and in series to get a higher voltage rating (or a smaller value). Capacitors combine the <b>opposite</b> way to resistors:</p><ul><li><b>Parallel:</b> the capacitances simply add.</li><li><b>Series:</b> use the reciprocal formula. The total is always smaller than the smallest capacitor.</li></ul>`
    :`<p>Inductors are connected in series to get more inductance, and in parallel to share current or to get a smaller value. As long as the coils do not share magnetic fields, inductors combine the <b>same</b> way as resistors:</p><ul><li><b>Series:</b> the inductances simply add.</li><li><b>Parallel:</b> use the reciprocal formula. The total is always smaller than the smallest inductor.</li></ul>`;
  const k=kind;const sumT=nn=>k+'_T='+Array.from({length:nn},(_,i)=>k+'_'+(i+1)).join('+');const recT=nn=>k+'_T=\\frac{1}{'+Array.from({length:nn},(_,i)=>'\\frac{1}{'+k+'_'+(i+1)+'}').join('+')+'}';
  const sumG=k+'_T='+k+'_1+'+k+'_2+'+k+'_3+\\cdots+'+k+'_n';const recG=k+'_T=\\frac{1}{\\frac{1}{'+k+'_1}+\\frac{1}{'+k+'_2}+\\cdots+\\frac{1}{'+k+'_n}}';
  const par=C?[sumT(2),sumT(3),sumG]:[recT(2),recT(3),recG], ser=C?[recT(2),recT(3),recG]:[sumT(2),sumT(3),sumG];
  return CC.introPage({text:txt,extra:`<div class="cols2 mt"><div class="formula"><b>Parallel ${C?'capacitors':'inductors'}</b>${par.map(t=>M(t)).join('')}</div><div class="formula"><b>Series ${C?'capacitors':'inductors'}</b>${ser.map(t=>M(t)).join('')}</div></div>`,
    how:`<p>You get 12 problems in random order: two or three ${C?'capacitors':'inductors'}, in series or in parallel. Type the total in ${C?'µF':'mH'} and choose <b>Grade answers</b>, then <b>Next problem</b>. Keep every value in ${C?'µF':'mH'}; there is no need to convert to ${C?'farads':'henries'}.</p><p>Your score is the percentage of problems right. ${TOLNOTE.split('.')[0]}. Each graded problem shows a worked solution.</p>`});
}
