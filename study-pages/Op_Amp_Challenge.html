/* ---------- exercise kit: helpers for intro pages ---------- */
CC.introPage=function({text,formulas,diagram,extra,how}){
  let h='';
  if(diagram)h+=`<div class="diagram" style="margin-bottom:12px">${diagram}</div>`;
  if(text)h+=`<div class="intro-text">${text}</div>`;
  if(formulas&&formulas.length){h+=`<h3>Key relationships</h3><div class="formulas">${formulas.map(f=>`<div class="formula">${f.cap?`<span class="cap">${f.cap}</span>`:''}${CC.M(f.tex||f)}${f.where?`<div class="where">${f.where}</div>`:''}</div>`).join('')}</div>`;}
  if(extra)h+=extra;
  if(how)h+=`<h3>How this exercise works</h3><div class="small intro-text">${how}</div>`;
  return h;
};

/* worked solution renderer: steps are TeX strings (math) or strings starting with '>' (prose) */
CC.workHTML=function(steps,label='Show worked solution'){
  if(!steps||!steps.length)return '';
  const body=steps.map(t=>typeof t==='string'&&t.startsWith('>')?`<p class="small">${t.slice(1)}</p>`:CC.M(t)).join('');
  return `<details class="work"><summary>${label}</summary>${body}</details>`;
};
/* ---------- Worksheet: one circuit, many answers, Check (-2) Help (-3) Grade ---------- */
CC.worksheet=function(root,s,spec){
  CC._last=spec;
  const checkCost=spec.checkCost??2, helpCost=spec.helpCost??3, N=spec.items.length;
  let pen=0;const helped=new Set();
  const w=el(`<div>
    <div class="statusbar"><span class="pill" id="wpen">Deductions: 0</span><span class="pill" id="wtime">0:00</span><span class="pill small">Check: −${checkCost} if wrong${helpCost?` · Help: −${helpCost}`:''}</span></div>
    <div class="cols2"><div><div class="card"><h2 style="margin-top:0">${esc(spec.title||'Circuit')}</h2><div class="diagram">${spec.diagram||''}</div><div class="givens">${spec.givens.map(g=>`<div class="given"><div class="k">${g.k}</div><div class="v">${g.v}</div></div>`).join('')}</div>${spec.note?`<p class="small muted">${spec.note}</p>`:''}</div><div id="wextra"></div></div>
    <div><div class="card"><h2 style="margin-top:0">Find</h2><div class="ws" id="ws"></div>
    <div class="row end mt"><button class="btn primary" id="wgrade">Grade</button></div></div></div></div></div>`);
  root.appendChild(w);
  const wsEl=$('#ws',w);
  const upd=()=>{$('#wpen',w).textContent='Deductions: '+pen;$('#wpen',w).className='pill'+(pen?' bad':'');};
  s.every(()=>{$('#wtime',w).textContent=CC.fmtTime(s.elapsed());},1000);
  const ok=(it,val)=>{if(it.signFree)return CC.close(Math.abs(val),Math.abs(it.value),it.tol??spec.tol??0.02,it.absTol??null);return CC.close(val,it.value,it.tol??spec.tol??0.02,it.absTol??null);};
  spec.items.forEach((it,i)=>{
    const r=el(`<div class="wrow"><div class="lab">${CC.m(it.sym)}</div><div class="inp"><input type="text" inputmode="decimal" autocomplete="off" aria-label="${esc(it.name||it.sym)}"><span class="unit">${esc(it.unit||'')}</span></div>
      <div class="acts"><button class="btn sm" data-a="c" title="Check your answer. Cost: ${checkCost} points if wrong." aria-label="Check">${IC.check.replace('<svg','<svg width="18" height="18"')}</button><button class="btn sm" data-a="h" title="Formulas and hints. Cost: ${helpCost} points." aria-label="Help">?</button></div><div class="fb"></div></div>`);
    it._row=r;const inp=$('input',r);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const nx=spec.items[i+1];if(nx)$('input',nx._row).focus();else $('#wgrade',w).focus();}});
    $('[data-a=c]',r).onclick=()=>{
      const val=CC.parse(inp.value,!CC.prefixed(it.unit));
      if(isNaN(val)){CC.toast('Type a number first.');return;}
      if(ok(it,val)){r.className='wrow ok';$('.fb',r).textContent='Right!';}
      else{pen+=checkCost;r.className='wrow bad';$('.fb',r).textContent=`Not right — ${checkCost} points deducted.`;upd();}
    };
    $('[data-a=h]',r).onclick=async()=>{
      const first=!helped.has(i);
      if(first){const go=await CC.modal(`<h3>Help for ${CC.m(it.sym)}</h3><p>Help shows the formula and method for this item. It costs ${helpCost} points, charged once per item.</p><p class="small muted">Choose Exit help to go back with no penalty.</p>`,[{label:'Exit help',value:false},{label:`Show help (−${helpCost})`,primary:true,value:true}]);
        if(go!==true)return;helped.add(i);pen+=helpCost;upd();}
      CC.modal(`<h3>${CC.m(it.sym)}${it.name?` — ${esc(it.name)}`:''}</h3>${(it.help||[]).map(h=>typeof h==='string'&&h.startsWith('$')?CC.M(h.slice(1)):`<p>${h}</p>`).join('')}`);
    };
    wsEl.appendChild(r);
  });
  $('#wgrade',w).onclick=async()=>{
    const blanks=spec.items.filter(it=>!$('input',it._row).value.trim()).length;
    if(blanks&&!(await CC.confirm(`${blanks} answer${blanks>1?'s are':' is'} blank and will be graded as wrong. Grade now?`,'Grade')))return;
    let right=0;
    spec.items.forEach(it=>{const inp=$('input',it._row);const val=CC.parse(inp.value,!CC.prefixed(it.unit));const good=!isNaN(val)&&ok(it,val);if(good)right++;inp.disabled=true;
      it._row.className='wrow '+(good?'ok':'bad');$('.fb',it._row).innerHTML=(good?'Right! ':'')+`Correct answer: <b>${CC.fmt(it.value)} ${esc(it.unit||'')}</b>`+CC.workHTML(typeof it.work==='function'?it.work():it.work);$$('button',it._row).forEach(b=>b.disabled=true);});
    $('#wgrade',w).disabled=true;
    const raw=right/N*100;const score=raw-pen;
    if(spec.after)spec.after($('#wextra',w));
    s.finish(score,`${right} of ${N} answers correct (${Math.round(raw)}%), minus ${pen} points for checks and help.`);
    const again=el('<div class="row end mt noprint"><button class="btn primary">New problem</button></div>');$('button',again).onclick=()=>s.restart();$('#wgrade',w).parentNode.after(again);
  };
};

/* ---------- Problem set: N problems one at a time, each graded immediately ---------- */
CC.problemSet=function(root,s,spec){
  const N=spec.count;let i=0,right=0,total=0;const log=[];
  const probs=spec.list?spec.list():Array.from({length:N},(_,k)=>spec.gen(k));
  CC._last=probs;
  const w=el(`<div><div class="statusbar"><span class="pill" id="pn"></span><span class="pill" id="ps">Correct: 0</span><span class="pill" id="pt">0:00</span></div><div class="progress"><i id="pb" style="width:0"></i></div><div id="pbody" class="mt"></div></div>`);
  root.appendChild(w);
  s.every(()=>{$('#pt',w).textContent=CC.fmtTime(s.elapsed());},1000);
  const show=()=>{
    const p=probs[i];
    $('#pn',w).textContent=`Problem ${i+1} of ${probs.length}`;$('#pb',w).style.width=(i/probs.length*100)+'%';
    const body=$('#pbody',w);body.innerHTML='';
    const card=el(`<div class="card"><div class="cols2"><div>${p.title?`<h2 style="margin-top:0">${p.title}</h2>`:''}${p.prompt?`<div>${p.prompt}</div>`:''}${p.diagram?`<div class="diagram mt">${p.diagram}</div>`:''}</div>
      <div><div class="fields" id="pf"></div><div id="pfb"></div><div class="row end mt"><button class="btn primary" id="pg">${spec.gradeLabel||'Grade answers'}</button></div></div></div></div>`);
    body.appendChild(card);
    const pf=$('#pf',card);
    p.fields.forEach(f=>{
      let fe;
      if(f.choices){
        fe=el(`<div class="field"><label>${f.label}</label><div class="faults">${f.choices.map((c,ci)=>`<label><input type="radio" name="ch_${f.key}" value="${ci}"> <span>${c}</span></label>`).join('')}</div></div>`);
      } else {
        fe=el(`<div class="field"><label>${f.label}${f.unit?` <span class="muted">(${esc(f.unit)})</span>`:''}</label><input type="text" inputmode="${f.text?'text':'decimal'}" autocomplete="off" ${f.given?'readonly':''} class="${f.given?'known':'ask'}" value="${f.given?esc(f.show||CC.fmt(f.value)):''}"></div>`);
        const inp=$('input',fe);inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const all=$$('input:not([readonly])',pf);const k=all.indexOf(inp);if(all[k+1])all[k+1].focus();else $('#pg',card).click();}});
      }
      f._el=fe;pf.appendChild(fe);
    });
    const firstAsk=$('input:not([readonly])',pf);if(firstAsk&&window.innerWidth>700)firstAsk.focus();
    $('#pg',card).onclick=()=>{
      const btn=$('#pg',card);
      if(btn.dataset.done){i++;if(i>=probs.length)return end();return show();}
      let pr=0,pt=0;const fbs=[];
      p.fields.forEach(f=>{if(f.given)return;pt++;let good;
        if(f.choices){const c=$('input:checked',f._el);good=c&&+c.value===f.answer;$$('.faults label',f._el).forEach((lb,ci)=>{if(ci===f.answer)lb.classList.add('correct');else if(c&&+c.value===ci)lb.classList.add('wrong');});$$('input',f._el).forEach(x=>x.disabled=true);}
        else{const inp=$('input',f._el);
          if(f.check)good=f.check(inp.value);
          else if(f.text)good=inp.value.trim().toUpperCase().replace(/\s+/g,'')===String(f.value).toUpperCase().replace(/\s+/g,'');
          else{const v=CC.parse(inp.value,f.suffix!==false&&!CC.prefixed(f.unit));good=f.signFree?CC.close(Math.abs(v),Math.abs(f.value),f.tol??spec.tol??0.02,f.absTol??null):CC.close(v,f.value,f.tol??spec.tol??0.02,f.absTol??null);}
          inp.classList.add(good?'ok':'bad');inp.readOnly=true;
          if(!good)fbs.push(`${f.label}: correct answer is <b>${f.show||CC.fmt(f.value)}${f.unit?' '+esc(f.unit):''}</b>`);}
        if(good)pr++;});
      right+=pr;total+=pt;log.push({i,pr,pt});
      $('#ps',w).textContent=`Correct: ${right} of ${total}`;
      const allGood=pr===pt;
      $('#pfb',card).innerHTML=`<p class="verdict ${allGood?'ok':'bad'}">${allGood?'Correct!':(pr?`${pr} of ${pt} correct`:'Incorrect')}</p>${fbs.length?`<p class="small">${fbs.join('<br>')}</p>`:''}${p.explain?`<div class="formula mt">${p.explain}</div>`:''}${CC.workHTML(typeof p.work==='function'?p.work():p.work)}`;
      btn.dataset.done='1';btn.textContent=i+1<probs.length?'Next problem':'Finish';btn.focus();
    };
  };
  const end=()=>{$('#pb',w).style.width='100%';const score=total?right/total*100:0;s.finish(score,`${right} of ${total} answers correct.`);
    const again=el('<div class="card mt center"><p>Exercise finished.</p><div class="row" style="justify-content:center"><a class="btn" href="#/">Main menu</a><button class="btn primary">New problem set</button></div></div>');$('button',again).onclick=()=>s.restart();$('#pbody',w).appendChild(again);};
  show();
};

/* ---------- Troubleshooting: PC board, probes, meter, fault list ---------- */
/* spec: {count, points, build(k)=>{svg(state)->string, pads:[{id,x,y}], faults:[names], answer:index, measure(a,b)->{text,value}, info(): html, meters(): [{label,text}]}} */
CC.trouble=function(root,s,spec){
  const N=spec.count||10, P=spec.points||10;let k=0,earned=0;
  const w=el(`<div><div class="statusbar"><span class="pill" id="tn"></span><span class="pill" id="tp"></span><span class="pill" id="ts">Score: 0</span><span class="pill" id="tt">0:00</span></div><div id="tbody"></div></div>`);
  root.appendChild(w);
  s.every(()=>{$('#tt',w).textContent=CC.fmtTime(s.elapsed());},1000);
  const next=()=>{
    const b=spec.build(k);let pts=P;CC._last=b;
    if(!b.padName)b.padName=id=>{const p=b.pads.find(q=>q.id===id);return p&&p.label||id;};let probe={red:null,black:null,active:'red'};let lastKey=null;const readings=[];
    $('#tn',w).textContent=`Problem ${k+1} of ${N}`;
    const updP=()=>{$('#tp',w).textContent=`${pts} point${pts===1?'':'s'} remain for this item`;$('#tp',w).className='pill'+(pts<P/2?' bad':'');};
    updP();
    const body=$('#tbody',w);body.innerHTML='';
    const card=el(`<div class="cols2"><div><div class="card"><div class="board-wrap" id="bw"></div>
      <div class="row mt" style="justify-content:space-between"><div class="row"><span class="small muted">Tap a pad to move the</span><button class="btn sm" id="pr" style="border-color:#c62828">● Red probe</button><button class="btn sm" id="pk">● Black probe</button></div></div>
      <div class="meter mt" id="mt"></div><div class="small muted mt" id="info"></div></div></div>
      <div><div class="card"><h3 style="margin-top:0">${spec.selectLabel||'Select the circuit fault'}</h3><div class="faults" id="fl"></div><div class="row end mt"><button class="btn primary" id="tg">Grade item</button></div><div id="tfb"></div></div>
      <div class="card"><h3 style="margin-top:0">Readings</h3><div class="small" id="rlog"><span class="muted">No readings yet. Each new reading costs 1 point.</span></div></div></div></div>`);
    body.appendChild(card);
    $('#info',card).innerHTML=b.info?b.info():'';
    const fl=$('#fl',card);b.faults.forEach((f,i)=>fl.appendChild(el(`<label><input type="radio" name="flt" value="${i}"> <span>${esc(f)}</span></label>`)));
    const setActive=a=>{probe.active=a;$('#pr',card).classList.toggle('blue',a==='red');$('#pk',card).classList.toggle('blue',a==='black');};
    $('#pr',card).onclick=()=>setActive('red');$('#pk',card).onclick=()=>setActive('black');setActive('red');
    const meterHTML=()=>{
      const ms=(b.meters?b.meters():[]).map(m=>`<div class="meterbox"><span class="ml">${m.label}</span><span class="lcd">${m.text}</span></div>`).join('');
      let main='----';
      if(probe.red&&probe.black){main=b.measure(probe.red,probe.black).text;}
      return `<div class="meterbox"><span class="ml">${spec.meterLabel||'Voltmeter'}</span><span class="lcd">${main}</span></div>`+ms;
    };
    const draw=()=>{
      const pads=b.pads.map(p=>{const r=probe.red===p.id,bl=probe.black===p.id;
        return `<g class="pad" data-id="${p.id}" tabindex="0" role="button" aria-label="Test point ${esc(p.label||p.id)}"><circle class="ring" cx="${p.x}" cy="${p.y}" r="7" fill="#d8d8d8" stroke="#777" stroke-width="2"/><circle cx="${p.x}" cy="${p.y}" r="2.5" fill="#555"/>${r?`<circle cx="${p.x}" cy="${p.y}" r="11" fill="none" stroke="#d32f2f" stroke-width="4"/><text x="${p.x+12}" y="${p.y-10}" fill="#d32f2f" font-weight="800" font-size="14">+</text>`:''}${bl?`<circle cx="${p.x}" cy="${p.y}" r="${r?15:11}" fill="none" stroke="#111" stroke-width="4"/><text x="${p.x-20}" y="${p.y-10}" fill="#111" font-weight="800" font-size="16">−</text>`:''}<circle class="hit" cx="${p.x}" cy="${p.y}" r="16"/></g>`;}).join('');
      $('#bw',card).innerHTML=b.svg().replace('</svg>',pads+'</svg>');
      $$('.pad',card).forEach(g=>{const f=()=>tap(g.dataset.id);g.onclick=f;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f();}};});
      $('#mt',card).innerHTML=meterHTML();
    };
    const tap=id=>{
      if(card.dataset.graded)return;
      probe[probe.active]=id;
      setActive(probe.active==='red'?'black':'red');
      if(probe.red&&probe.black){const key=probe.red+'|'+probe.black;if(key!==lastKey){lastKey=key;if(pts>0)pts--;updP();
        const m=b.measure(probe.red,probe.black);readings.unshift(`<span style="color:#d32f2f">+${esc(b.padName(probe.red))}</span> / −${esc(b.padName(probe.black))}: <b>${m.text}</b>`);
        $('#rlog',card).innerHTML=readings.slice(0,12).join('<br>');}}
      draw();
    };
    draw();
    $('#tg',card).onclick=()=>{
      const btn=$('#tg',card);
      if(card.dataset.graded){k++;if(k>=N)return end();return next();}
      const c=$('input:checked',fl);
      if(!c){CC.modal('<p>You did not select a fault. Select a fault, then choose Grade item.</p>');return;}
      card.dataset.graded='1';
      const good=+c.value===b.answer;const got=good?pts:0;earned+=got;
      $$('label',fl).forEach((lb,i)=>{if(i===b.answer)lb.classList.add('correct');else if(i===+c.value)lb.classList.add('wrong');});
      $$('input',fl).forEach(x=>x.disabled=true);
      $('#ts',w).textContent=`Score: ${earned}`;
      $('#tfb',card).innerHTML=`<p class="verdict ${good?'ok':'bad'}">${good?'Correct!':'Incorrect'}</p><p class="small">${good?`You earned ${got} point${got===1?'':'s'} on this item.`:`The correct answer is highlighted: <b>${esc(b.faults[b.answer])}</b>.`} Your total score so far is ${earned} point${earned===1?'':'s'}.</p>${b.explain?`<p class="small muted">${b.explain()}</p>`:''}${CC.workHTML(typeof b.work==='function'?b.work():b.work,'Show how to find this fault')}`;
      btn.textContent=k+1<N?'Continue':'Finish';
    };
  };
  const end=()=>{const score=earned/(N*P)*100;s.finish(score,`${earned} of ${N*P} possible points.`);};
  next();
};

/* meter helpers */
CC.meterErr=()=>{const bias=rnd(-0.03,0.03);return v=>v*(1+bias+rnd(-0.008,0.008));};
CC.lcd=(v,dec=2)=>{if(!isFinite(v))return 'OL';const a=Math.abs(v);if(a<0.005)return (0).toFixed(dec);return v.toFixed(a>=100?1:dec);};

/* ---------- PC-board drawing kit ---------- */
const B=CC.board={};
B.svg=(w,h,inner)=>`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="printed circuit board" font-family="FN Greek,system-ui,sans-serif">${inner}</svg>`;
B.pcb=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="var(--board)" stroke="var(--board-dark)" stroke-width="3"/>`+[[x+10,y+10],[x+w-10,y+10],[x+10,y+h-10],[x+w-10,y+h-10]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--board-dark)"/>`).join('');
B.trace=(pts,label,lp)=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--trace)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>`+(label?`<text x="${lp[0]}" y="${lp[1]}" font-size="11" font-weight="700" fill="#5a3b12" ${lp[2]?`transform="rotate(${lp[2]} ${lp[0]} ${lp[1]})"`:''} text-anchor="middle">${label}</text>`:'');
B.wire=(pts,color='#c62828')=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
B.label=(x,y,t,o={})=>`<text x="${x}" y="${y}" font-size="${o.size||12}" font-weight="${o.w||700}" fill="${o.fill||'#3a2508'}" text-anchor="${o.anchor||'middle'}">${esc(t)}</text>`;
/** component between two pad points (horizontal or vertical) */
B.part=(type,a,b,label)=>{
  const [x1,y1]=a,[x2,y2]=b;const cx=(x1+x2)/2,cy=(y1+y2)/2;const L=Math.hypot(x2-x1,y2-y1);const ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
  let body='';const bl=Math.min(L-26,64);
  const lead=`<line x1="${-L/2}" y1="0" x2="${L/2}" y2="0" stroke="#9a9a9a" stroke-width="2.5"/>`;
  if(type==='R')body=`<rect x="${-bl/2}" y="-8" width="${bl}" height="16" rx="7" fill="#e6d3a8" stroke="#8b6f3a"/>`+[-.3,-.12,.06,.3].map((p,i)=>`<rect x="${p*bl-2.5}" y="-8" width="5" height="16" fill="${['#c62828','#6d4c41','#ef6c00','#c9a227'][i]}"/>`).join('');
  if(type==='PR')body=`<rect x="${-bl/2}" y="-10" width="${bl}" height="20" rx="2" fill="#f1f1f1" stroke="#888"/><text x="0" y="3.5" font-size="8" text-anchor="middle" fill="#666">POWER RESISTOR</text>`;
  if(type==='C')body=`<rect x="${-bl/2}" y="-9" width="${bl}" height="18" rx="5" fill="#f5c518" stroke="#a88600"/><line x1="${-bl/2+6}" y1="-9" x2="${-bl/2+6}" y2="9" stroke="#a88600"/>`;
  if(type==='L')body=`<rect x="${-bl/2}" y="-10" width="${bl}" height="20" rx="4" fill="#a3322a" stroke="#5e1a15"/>`+Array.from({length:7},(_,i)=>`<line x1="${-bl/2+5+i*(bl-10)/6}" y1="-10" x2="${-bl/2+5+i*(bl-10)/6}" y2="10" stroke="#7a221c" stroke-width="1.5"/>`).join('');
  if(type==='F')body=`<rect x="${-bl/2}" y="-7" width="${bl}" height="14" rx="3" fill="#e9f3f7" stroke="#8aa"/><rect x="${-bl/2}" y="-7" width="8" height="14" fill="#bbb"/><rect x="${bl/2-8}" y="-7" width="8" height="14" fill="#bbb"/><line x1="${-bl/2+8}" y1="0" x2="${bl/2-8}" y2="0" stroke="#777" stroke-width="1"/>`;
  if(type==='D')body=`<rect x="${-bl/2}" y="-6" width="${bl}" height="12" rx="3" fill="#222"/><rect x="${bl/2-9}" y="-6" width="4" height="12" fill="#ddd"/>`;
  const flip=Math.abs(ang)>90;
  const lab=label?`<text x="${cx+(Math.abs(ang)===90?14:0)}" y="${cy+(Math.abs(ang)===90?4:22)}" font-size="12" font-weight="700" fill="#2b1a05" text-anchor="${Math.abs(ang)===90?'start':'middle'}">${esc(label)}</text>`:'';
  return `<g transform="translate(${cx},${cy}) rotate(${flip?ang-180:ang})">${lead}${body}</g>${lab}`;
};
B.xfmr=(x,y,w,h,label)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="#2a8c8c" stroke="#145"/><rect x="${x+w*.25}" y="${y-6}" width="${w*.5}" height="${h+12}" rx="3" fill="#cfd8dc" stroke="#78909c"/><text x="${x+w/2}" y="${y+h/2+4}" font-size="11" font-weight="800" text-anchor="middle" fill="#455a64" transform="rotate(-90 ${x+w/2} ${y+h/2})">ACME</text>${label?B.label(x+w/2,y+h+24,label):''}`;
B.supply=(x,y,w,h,title,readout)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="#4a3b33" stroke="#2a201b" stroke-width="2"/><rect x="${x+8}" y="${y+8}" width="${w-16}" height="${h-16}" rx="5" fill="#e9e4dc"/><text x="${x+w/2}" y="${y+26}" font-size="11" font-weight="800" text-anchor="middle" fill="#b3261e">${esc(title)}</text>${readout?`<text x="${x+w/2}" y="${y+46}" font-size="13" font-weight="700" text-anchor="middle" fill="#333">${esc(readout)}</text>`:''}`;

})();
</script>
<script>/* Op Amp Challenge: student-facing text (HTML). Rewritten from the original ETCAI lessons. */
(function(){
'use strict';
const m=CC.m,M=CC.M;
const T=window.OAT={};

/* ---------- program ---------- */
T.whatIs=`<p>An operational amplifier, or <b>op amp</b>, is an integrated-circuit amplifier with a very high voltage gain, typically 100,000 or more. On its own that gain is far too high to be useful, so almost every op amp circuit uses <b>negative feedback</b>: a resistor network feeds part of the output back to the inverting input and sets a smaller, precise gain.</p>
<p>The symbol is a triangle with two inputs and one output. A signal on the <b>+ (noninverting)</b> input appears at the output with the same polarity. A signal on the <b>− (inverting)</b> input appears at the output with the opposite polarity (shifted 180° for AC).</p>
<p>Most op amps come in an 8-pin DIP or a small surface-mount package. On the popular 741 pinout, pin 2 is the inverting input, pin 3 the noninverting input, pin 6 the output, pin 7 the positive supply and pin 4 the negative supply.</p>`;
T.hints=`<h3>Power supplies</h3><p>Most op amp circuits run from a dual supply such as ±15 V. The point where the two supplies join is the circuit ground. The supplies are usually equal, but they don't have to be. The supply pins are drawn on the symbols in this program; many schematics leave them off, but the op amp still needs power.</p>
<p>An op amp can also run from a single supply. The signal then has to be referenced to about half the supply voltage, which makes connecting signal sources a little more involved.</p>
<h3>Output limits</h3><p>The output can't go beyond the supply voltages. A typical op amp output saturates (clips) one to two volts inside each rail, so a ±15 V op amp swings to about ±13.5 V. If a formula predicts a larger output, the real output simply stops at the saturation level.</p>
<p>Most op amps can only supply a few milliamps (a 741 about 20 mA). For heavier loads, add a current booster: a complementary pair of power transistors inside the feedback loop. The loop gain removes the crossover distortion of the transistor pair.</p>`;
T.manual=`<p>Op Amp Challenge gives you practice analyzing, designing and troubleshooting common op amp circuits. It works best alongside a textbook or class. Every activity picks new component values and a new item order each time, so you can repeat an activity as often as you like without memorizing answers.</p>
<h3>Activities</h3>
<ul>
<li><b>Simple Op Amp Applications</b>: followers, comparators and current-to-voltage converters.</li>
<li><b>Inverting Amplifiers</b> and <b>Noninverting Amplifiers</b>: gain, input and output impedance, output voltage, choosing resistors.</li>
<li><b>Sum and Difference Amps</b>: summing amplifiers (equal and weighted inputs) and difference amplifiers.</li>
<li><b>Op Amp Characteristics</b>: gain-bandwidth, slew rate, bias and offset currents, common-mode rejection.</li>
<li><b>OA Troubleshooting One to Four</b>: find the fault on a virtual inverting amplifier board or instrumentation amplifier board with a DC voltmeter. Two and Four charge a point for every reading.</li>
<li><b>Design calculators</b> (ungraded): second-order active filters, RC sine-wave oscillators and a square/triangle wave generator.</li>
</ul>
<h3>Answering and scoring</h3>
<p>Each activity's start page explains how it is scored. In the calculation activities a numeric answer is correct when it is within ±1% of the exact answer, so three significant figures are enough. Type the number in the unit shown next to the answer box. After you grade an item you can open a worked solution that uses that item's numbers.</p>
<p>Significant figures are the digits that carry meaning, not counting leading zeros: 30.46 has four, 0.00073 has two. Keep full precision while you calculate and round only the final answer.</p>`;

/* ---------- shared scoring note ---------- */
T.howItems=(n,extra)=>`<p>You will get ${n} items, one at a time, in random order. Some ask for a number and some are multiple choice. Each item is graded as soon as you choose <b>Grade answer</b>, and your score is the percentage of items you get right.</p>
<p>Numeric answers are accepted within <b>±1%</b> of the exact value, so three significant figures are enough. Enter the number in the unit shown beside the box (for example, if the box says kΩ, type <span class="kbd">4.7</span>, not 4700). After grading you can open a worked solution with the item's own numbers.</p>${extra||''}`;

/* ---------- simple applications ---------- */
T.simpleIntro=`<p>This activity covers three simple op amp circuits that need no more than an op amp and one resistor: the voltage follower, the comparator and the current-to-voltage (I to V) converter.</p>`;
T.follower=`<p>A <b>voltage follower</b> connects the output straight back to the inverting input. The output equals the input, so the voltage gain is 1. That sounds useless, but the follower has two very useful properties:</p>
<ul><li><b>Very high input impedance.</b> The closed-loop input impedance is about the op amp's open-loop gain times its own input impedance, often thousands of megohms. The follower barely loads the signal source.</li>
<li><b>Very low output impedance.</b> Usually well under 1 Ω, so the follower can drive the circuits that follow it.</li></ul>
<p>Followers are used as buffers between a weak, high-impedance source (such as a sensor) and the rest of a system.</p>`;
T.comparator=`<p>A <b>comparator</b> tells you which of two voltages is greater. With no feedback, the op amp's huge gain drives the output to its limit:</p>
<ul><li>If input B (the + input) is greater than input A (the − input), the output goes to about <b>+V</b>.</li>
<li>If input A is greater than input B, the output goes to about <b>−V</b>.</li></ul>
<p>"Greater" means further to the right on the number line, so −1 V is greater than −5 V. In practice the output stops a volt or two short of each supply rail.</p>
<p>Comparators are usually part of a larger circuit, such as a voltage regulator, a level detector or an analog-to-digital converter.</p>`;
T.itov=`<p>A <b>current-to-voltage (I to V) converter</b> feeds the input current into the inverting input, which is held at virtual ground. All of that current flows through the feedback resistor ${m('R_f')}, so by Ohm's law:</p>${M('V_{out}=-I_{in}R_f')}
<p>For example, with ${m('R_f=100\\text{ k}\\Omega')} and ${m('I_{in}=20\\text{ µA}')}, the output is 2 V (negative for current flowing into the input as drawn). Going the other way, ${m('I_{in}=V_{out}/R_f')}.</p>
<p>Because the input sits at virtual ground, the current source sees almost zero resistance and doesn't have to supply any voltage. Sensors such as photodiodes produce a current, and an I to V converter turns it into a voltage the next stage can use.</p>`;

/* ---------- inverting ---------- */
T.invIntro=`<p>The <b>inverting amplifier</b> gives a fixed gain set by two resistors and an output that is opposite in polarity to the input. A positive DC input gives a negative output, and an AC output is 180° out of phase with the input.</p>
<p>The inverting input is held at virtual ground (0 V) by the feedback, so the input resistor ${m('R_i')} connects the source to 0 V. That makes the input impedance simply ${m('R_i')}, and the output impedance is close to 0 Ω.</p>
<p>Resistor ${m('R_1')} from the + input to ground is optional. When it's used it should equal ${m('R_i')} in parallel with ${m('R_f')}. The two inputs then see the same DC resistance, so the bias currents create equal voltage drops that cancel, and the output offset is smaller. ${m('R_1')} doesn't change the gain.</p>`;
T.invMistakes=`<p class="small"><b>Common mistakes:</b> forgetting the minus sign on the output; using ${m('R_f/R_i+1')} (that's the noninverting formula); mixing kΩ and Ω in the same calculation; and forgetting that the output can't exceed the saturation level (about ±13.5 V on ±15 V supplies).</p>`;

/* ---------- noninverting ---------- */
T.noninvIntro=`<p>The <b>noninverting amplifier</b> applies the signal to the + input. The output has the same polarity as the input, and the gain is always at least 1:</p>${M('A=\\frac{R_f}{R_i}+1')}
<p>Its big advantage is input impedance. Negative feedback multiplies the op amp's own input impedance ${m('z_{in}')} by one plus the loop gain:</p>${M('Z_{in}=z_{in}\\left(1+A_{OL}B\\right)')}${M('B=\\frac{R_i}{R_i+R_f}=\\frac{1}{A}')}
<p>With an open-loop gain ${m('A_{OL}')} of 100,000 or more, the result is in the gigohms, so for most purposes it is "very high". The output impedance is close to 0 Ω.</p>`;
T.noninvMistakes=`<p class="small"><b>Common mistakes:</b> forgetting the "+1" in the gain; using ${m('Z_{in}=R_i')} (that's the inverting amplifier); and using the closed-loop gain ${m('A')} instead of the open-loop gain ${m('A_{OL}')} in the input-impedance formula.</p>`;

/* ---------- sum and difference ---------- */
T.sumIntro=`<p>Op amps got their name from doing math operations. Voltages can stand for numbers (for example 0.1 V = 1), and simple op amp circuits can then add and subtract them.</p>`;
T.summing=`<p>A <b>summing amplifier</b> is an inverting amplifier with several input resistors. The inverting input is a virtual ground, so each input current is ${m('V_n/R_n')} and all of them flow through ${m('R_f')}:</p>${M('V_{out}=-\\left(\\frac{R_f}{R_1}V_1+\\frac{R_f}{R_2}V_2+\\frac{R_f}{R_3}V_3\\right)')}
<p>When all the resistors are equal this becomes ${m('V_{out}=-(V_1+V_2+V_3)')}. When the input resistors are equal and ${m('R_f')} is larger, the sum is multiplied by ${m('R_f/R_1')}. When the input resistors differ, each input has its own weight (a <b>scaling adder</b>). Remember the output is the <i>negative</i> of the sum.</p>
<p>Summing amplifiers are also used as audio mixers. The virtual ground keeps the inputs from interacting.</p>`;
T.difference=`<p>A <b>difference amplifier</b> sends ${m('V_1')} to the − input through ${m('R_1')}, and ${m('V_2')} to the + input through the divider ${m('R_2')} and ${m('R_3')}. When the resistor ratios match (${m('R_f/R_1=R_3/R_2')}):</p>${M('V_{out}=\\frac{R_f}{R_1}\\left(V_2-V_1\\right)')}
<p>With all four resistors equal, ${m('V_{out}=V_2-V_1')}. Treat the voltages as signed numbers: ${m('-4-(-6)=+2\\text{ V}')}.</p>`;
T.sumMistakes=`<p class="small"><b>Common mistakes:</b> dropping the minus sign on a summing amplifier; mishandling negative inputs (write each one in parentheses); and subtracting in the wrong order on the difference amplifier (it's ${m('V_2-V_1')}, the + side minus the − side).</p>`;

/* ---------- characteristics ---------- */
T.gbw=`<p>An op amp's gain falls as frequency rises. For a stable, internally compensated op amp the product of closed-loop gain and bandwidth is constant. This is the <b>gain-bandwidth product</b> (GBW), also called the unity-gain frequency ${m('f_T')}. It's on the data sheet: 1 MHz for a 741.</p>${M('BW=\\frac{GBW}{A_{CL}}')}
<p>Here ${m('A_{CL}')} is the <b>noise gain</b> ${m('1+R_f/R_i')}. For a noninverting amplifier that equals the signal gain. For an inverting amplifier it is one more than ${m('R_f/R_i')}. Many textbooks simply divide by ${m('R_f/R_i')}; for large gains the difference is small, and both methods are accepted in this activity.</p>`;
T.slew=`<p>The <b>slew rate</b> (SR) is the fastest the output voltage can change, in volts per microsecond. A 741's slew rate is about 0.5 V/µs. When a fast pulse hits the input, the output ramps at the slew rate instead of jumping, so the time to reach the final value is:</p>${M('\\Delta t=\\frac{|V_{out}|}{SR}')}
<p>Work out the final output first (gain × input), then divide by the slew rate. Time is always positive. Slow slewing turns square edges into slopes and limits the largest undistorted sine wave at high frequency.</p>`;
T.offset=`<p>With both inputs grounded, the output should be 0 V, but small mismatches in the input transistors cause an <b>input offset voltage</b> of a few millivolts. Negative feedback keeps its effect small. Op amps like the 741 have offset-null pins for a trimmer potentiometer that is adjusted for 0 V out with 0 V in. Leave the null pins open if you don't need them.</p>`;
T.bias=`<p>The op amp inputs draw tiny DC currents called <b>input bias currents</b>: nanoamps to microamps for bipolar op amps, picoamps for FET-input types. Smaller is better. Each input needs a DC path to ground for its bias current.</p>
<p>The data sheet <b>input bias current</b> is the average of the two input currents, and the <b>input offset current</b> is the difference between them:</p>${M('I_{B}=\\frac{I(A)+I(B)}{2}')}${M('I_{OS}=\\left|I(A)-I(B)\\right|')}
<p>Bias currents flowing through the input resistors create small error voltages. Giving both inputs the same DC resistance (resistor ${m('R_1')} on an inverting amplifier) makes the drops cancel, leaving only the effect of the offset current.</p>`;
T.cmrr=`<p>A <b>common-mode</b> signal is one that appears equally on both inputs, such as hum picked up on both wires from a sensor. An ideal difference amplifier ignores it. A real one passes a little of it, with a common-mode gain ${m('A_{cm}=V_{out}/V_{CM}')}. The <b>common-mode rejection ratio</b> compares the wanted differential gain ${m('A_d')} with that unwanted gain:</p>${M('\\mathrm{CMRR}=20\\log\\left(\\frac{A_d}{A_{cm}}\\right)\\text{ dB}')}
<p>To measure it, tie both inputs of a difference amplifier together and drive them with ${m('V_{CM}')}, as in the figure. With matched resistors, any output is due to the op amp. When ${m('A_d=1')} the formula reduces to ${m('20\\log(V_{CM}/V_{out})')}. A larger CMRR is better; 70 to 100 dB is typical.</p>`;
T.charMistakes=`<p class="small"><b>Common mistakes:</b> mixing mV and V in the CMRR ratio (convert both to volts); using ${m('10\\log')} instead of ${m('20\\log')} for a voltage ratio; using kHz and MHz inconsistently in bandwidth problems; and dividing the input, not the output, voltage by the slew rate.</p>`;

/* ---------- troubleshooting ---------- */
T.tsInv1=`<p>OA Troubleshooting One gives you ten inverting amplifier boards. Each one is either working or has a single fault. Use the DC voltmeter (black lead on ground) and the adjustable DC source on IN1 to find it.</p>`;
T.tsInv2=`<p>OA Troubleshooting Two uses the same inverting amplifier board, but every new meter reading costs a point, so plan your measurements. Changing the input voltage is free.</p>`;
T.tsInst3=`<p>OA Troubleshooting Three gives you ten instrumentation amplifier boards, each either working or with a single fault. Use the DC voltmeter and the adjustable DC sources on IN1 and IN2.</p>`;
T.tsInst4=`<p>OA Troubleshooting Four uses the same instrumentation amplifier board, but every new meter reading costs a point, so plan your measurements. Changing the input voltages is free.</p>`;
T.howTs=per=>per?`<p>There are 10 boards. Each starts with <b>15 points</b>, and every time you move the probe to a new pad the board loses 1 point (down to 0). Select the fault and choose <b>Grade selection</b>; a correct answer earns the points that remain, a wrong answer earns 0. You get one try per board. The maximum is 150 points, but real scores are much lower because several readings are always needed. Your percentage is your points out of 150.</p>`
  :`<p>There are 10 boards worth <b>10 points</b> each, for a maximum of 100. You can take as many readings and change the input as often as you like. Select the fault and choose <b>Grade selection</b>; you get one try per board.</p>`;
T.meterNote=`<p>Like a real meter, the voltmeter has a little drift and calibration error, but it is accurate enough to find every fault. Tap a solder pad to move the red probe.</p>`;
T.invGeneral=`<p>The board is an inverting amplifier with ${m('R_1=10\\text{ k}\\Omega')} and ${m('R_2=100\\text{ k}\\Omega')}, so the gain is 10 and the output is inverted:</p>${M('A=\\frac{R_2}{R_1}=10\\qquad OUT=-A\\,(IN1)')}
<p>R3 gives the + input the same DC resistance to ground as the − input, to reduce offset; it doesn't affect the gain. With ±15 V supplies the output saturates near ±13.5 V, so inputs larger than about ±1.35 V drive the output to its limit. In normal operation pin 2, the right end of R1 and the top of R2 sit at virtual ground (0 V) whatever the input.</p>`;
T.instGeneral=`<p>The board is an instrumentation amplifier. IC1 and IC2 are followers that give both inputs a very high input impedance. IC3 is a difference amplifier with ${m('R_1=R_2=10\\text{ k}\\Omega')} and ${m('R_3=R_4=100\\text{ k}\\Omega')}:</p>${M('A=\\frac{R_3}{R_1}=10\\qquad OUT=A\\,(IN2-IN1)')}
<p>So IN2 is amplified by 10 without inversion, and IN1 is amplified by 10 and inverted. With ±15 V supplies the output saturates near ±13.5 V. The circuit is DC coupled, so a fault in IC1 or IC2 drives an input of IC3 and can make IC3 look faulty. Always check the stage feeding a suspect op amp.</p>`;
T.opampFail=`<p>An op amp contains many transistors, and one can fail in many ways. Most failures are drastic: the output latches near the positive or negative supply and no longer responds to the input. Those are the failures simulated here.</p>
<p>But a saturated output does <i>not</i> prove the op amp is bad. Four things can put the output near a rail:</p>
<ol><li>The input is large enough to drive the output into saturation.</li><li>An input pin is open (feedback or bias path broken).</li><li>The +V or −V supply is missing at the IC.</li><li>The op amp really is defective.</li></ol>
<p>Blame the op amp only after ruling out the other three.</p>`;
T.traceGen=`<p>An open PC board trace is usually a hairline crack in the copper, often too small to see. Every point on a good trace has the same voltage, so <b>different voltages at the two ends of a trace mean that trace is open</b>.</p>`;
T.invTraces=`<ul>
<li><b>Trace 1</b> (IN1 to R1): with a nonzero input, IN1 and the left end of R1 read differently. The output stays at 0 V.</li>
<li><b>Trace 2</b> (+15 V to pin 7): pin 7 no longer reads +15 V. A starved pin 7 usually floats near the <i>negative</i> supply, and the output sits near −V regardless of the input.</li>
<li><b>Trace 3</b> (−15 V to pin 4): pin 4 reads a positive voltage instead of −15 V, and the output sits near +V.</li>
<li><b>Trace 4</b> (R1/R2 junction to pin 2): pin 2 floats at a few millivolts, the loop is broken and the output latches. R1 and R2 then form a divider between IN1 and the output, so the junction is no longer at 0 V.</li>
<li><b>Trace 5</b> (pin 6 to OUT): pin 6 is correct but the OUT terminal reads about 0 V.</li></ul>`;
T.invResistors=`<p>Carbon resistors almost always fail open, so open resistors are simulated here.</p><ul>
<li><b>R1 open:</b> no signal reaches the op amp. The circuit acts as a follower with no input, so the output stays at 0 V. Every voltage looks normal except that the output doesn't respond to IN1.</li>
<li><b>R2 open:</b> no feedback, so the op amp runs at full open-loop gain. A tiny positive input drives the output to −V, a tiny negative input to +V. Pin 2 reads the same as IN1.</li>
<li><b>R3 open:</b> pin 3 floats and the output usually latches near −V. Pin 3 reads a few tens of millivolts negative (about −20 mV) while the bottom of R3 reads 0 V. Pin 2 sits at the R1/R2 divider voltage, about −1.2 V with IN1 at 0.</li></ul>`;
T.instTraces=`<ul>
<li><b>Trace 1</b> (−15 V bus to pin 4 of IC1, IC2 and IC3): every pin 4 reads a positive voltage instead of −15 V, and all three outputs sit near +V.</li>
<li><b>Trace 2</b> (+15 V to IC1 and IC2 pin 7): both pin 7s float near the negative supply and both follower outputs sit near −V. IC3 sees equal inputs, so OUT stays near 0 V and doesn't respond to either input.</li>
<li><b>Trace 3</b> (branch to IC1 pin 7 only): IC1 pin 7 floats negative and IC1's output sits near −V, which drives OUT toward +V. IC2's pin 7 is still at +15 V.</li>
<li><b>Trace 4</b> (+15 V to IC3 pin 7): IC3 pin 7 floats negative and OUT latches near −V. IC1 and IC2 still follow their inputs.</li></ul>`;
T.instResistors=`<p>Resistors R1 and R2 can fail open.</p><ul>
<li><b>R1 open:</b> IC1's signal no longer reaches IC3. IC3 becomes a follower of its + input, so OUT = ${m('IN2\\cdot R_4/(R_2+R_4)')}, about 0.91 × IN2, and IN1 has no effect.</li>
<li><b>R2 open:</b> IC2's signal no longer reaches IC3. R4 pulls pin 3 to 0 V, IC3 becomes an inverting amplifier with gain 10, and OUT = −10 × IN1. IN2 has no effect.</li></ul>`;

/* ---------- calculators ---------- */
T.filtIntro=`<p>Filters pass some frequencies and reject others. Passive RC or LC filters lose signal in their components; <b>active filters</b> add an amplifier (here an op amp) to keep the signal level up and allow responses passive filters can't easily give.</p>
<p>This calculator covers the second-order (two-pole) <b>Sallen-Key</b> low-pass and high-pass filters. Change any component and it recalculates the corner frequency ${m('f_c')}, the passband gain ${m('A')} and the damping factor ${m('D')}, and plots the response.</p>
<p>The damping factor decides the shape of the response, often as much as ${m('f_c')} does:</p>
<ul><li><b>Chebyshev</b> (blue, ${m('D')} below about 1.3): a hump just before cutoff, then a fast roll-off. It can ring on transients.</li>
<li><b>Butterworth</b> (red, ${m('D=1.414')}): as flat as possible in the passband, a good general choice.</li>
<li><b>Bessel</b> (green, ${m('D=1.732')}): gradual roll-off with the cleanest pulse response.</li></ul>
<p>${m('D')} at or below zero means the circuit will oscillate instead of filtering.</p>`;
T.filtNote=`<p>For an equal-component design (${m('R_1=R_2')}, ${m('C_1=C_2')}) the damping factor is simply ${m('D=3-A')}. That gives ${m('A=1.586')} (${m('R_f/R_i=0.586')}) for Butterworth, ${m('A=1.268')} for Bessel and ${m('A=1.955')} for a 1 dB Chebyshev. ${m('f_c')} is the circuit's natural (corner) frequency; it is the −3 dB point only for the Butterworth response. Use stable capacitors (film types) and values below about 1 µF.</p>`;
T.oscIntro=`<p>The <b>Wien-bridge</b> and <b>phase-shift</b> oscillators generate sine waves, usually at audio and lower frequencies. Both use an op amp to supply gain and an RC network to set the frequency.</p>
<p>An oscillator needs to meet the <b>Barkhausen criterion</b>: the feedback must come back in phase, and the loop gain ${m('AB')} (amplifier gain × feedback-network loss) must equal 1. If ${m('AB')} is even slightly below 1 the oscillation dies out. If it is above 1 the output grows until it clips, which distorts the sine wave. So the gain must be set carefully, or stabilized automatically.</p>
<p>Real circuits run somewhat off the calculated frequency because of component tolerances and loading, especially the phase-shift oscillator, so build and tune the final design on a breadboard.</p>`;
T.psNote=`<p>The three RC sections each shift the phase by 60°, for 180° in total; the inverting amplifier adds the other 180°. At the oscillation frequency the network divides the signal by 29, so the amplifier gain ${m('A=R_f/R_i')} must be at least 29. Set it a little higher so oscillation always starts. Keep ${m('R_i')} at least ten times ${m('R')} so it doesn't load the last RC section (heavier loading raises the gain needed).</p>`;
T.wbNote=`<p>The series RC and parallel RC arms of the Wien bridge give zero phase shift and a loss of exactly 3 at ${m('f_o=1/(2\\pi RC)')}. The noninverting amplifier must therefore have a gain ${m('A=1+R_f/R_i')} of at least 3; slightly more makes sure oscillation starts, and much more causes distortion.</p>`;
T.gainStab=`<p>Because the Wien-bridge oscillator needs a gain of almost exactly 3, practical circuits stabilize it automatically. A classic method replaces ${m('R_i')} with a small incandescent lamp. The cold filament has a low resistance, so the gain starts above 3 and oscillation builds up. As the signal grows, the filament heats, its resistance rises and the gain falls until it settles at 3 with low distortion.</p>
<p>The lamp must be a very low-current type (about 10 V at 14 mA, such as the 1869), and ${m('R_f')} is chosen at a little over twice the lamp's cold resistance (for example 750 Ω). Modern designs often use a JFET or diodes in the feedback path instead.</p>`;
T.sqIntro=`<p>IC1 is a <b>relaxation oscillator</b>. Capacitor C1 charges through R1 toward the output voltage, and the op amp compares the capacitor voltage with a fraction of the output set by the divider ${m('R_a')} (feedback) and ${m('R_b')} (to ground). Each time the capacitor crosses that threshold the output flips, which makes a square wave. IC2, R2 and C2 form an <b>integrator</b> that turns the square wave into a triangle wave.</p>`;
T.sqNote=`<p>The period depends on R1, C1 and the feedback fraction ${m('B=R_b/(R_a+R_b)')}:</p>${M('T=2R_1C_1\\ln\\left(\\frac{1+B}{1-B}\\right)=2R_1C_1\\ln\\left(1+\\frac{2R_b}{R_a}\\right)')}
<p>The integrator makes a good triangle wave when its time constant ${m('R_2C_2')} is at least five times the period. A longer time constant gives a straighter but smaller triangle; add an amplifier after the integrator if you need more amplitude. The square wave is drawn ideal; a real op amp's slew rate rounds its edges, so use this circuit for low frequencies.</p>`;
})();

/* ---------- single-probe DMM troubleshooting ---------- */
/* spec: {count, points, perReading:bool, build(k)->{svg(), pads:[{id,x,y,label}], faults, answer, read(id,inputs)->volts, inputs:[{key,label,value,min,max,step}], schematic, explain}} */
K.trouble=function(root,s,spec){
  const N=spec.count||10,P=spec.points||10,per=!!spec.perReading;let k=0,earned=0;const max=N*P;
  const w=CC.el(`<div><div class="statusbar"><span class="pill" id="tn"></span>${per?'<span class="pill" id="tp"></span>':''}<span class="pill" id="ts">Points earned: 0</span><span class="pill" id="tt">0:00</span></div><div id="tbody"></div></div>`);
  root.appendChild(w);
  s.every(()=>{CC.$('#tt',w).textContent=CC.fmtTime(s.elapsed());},1000);
  const next=()=>{
    const b=spec.build(k);CC._last=b;let pts=P,probe=null;const inputs={};(b.inputs||[]).forEach(i=>inputs[i.key]=i.value);
    const meter=CC.meterErr();
    CC.$('#tn',w).textContent=`Item ${k+1} of ${N}`;
    const upd=()=>{if(per){CC.$('#tp',w).textContent=`${pts} point${pts===1?'':'s'} remain for item`;CC.$('#tp',w).className='pill'+(pts<P/2?' bad':'');}};upd();
    const body=CC.$('#tbody',w);body.innerHTML='';
    const card=CC.el(`<div class="cols2"><div><div class="card"><div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="small muted">Tap a solder pad to move the meter probe. The black lead is on ground.</span><button class="btn sm" id="sch">Schematic</button></div>
      <div class="board-wrap oak-scroll" id="bw"></div><div class="diagram mt hide" id="schd">${b.schematic||''}</div>
      <div class="row mt" style="align-items:stretch"><div class="meterbox"><span class="ml">DC voltmeter</span><span class="lcd" id="lcd">----</span><span class="small" style="color:#c9cdd2" id="where">Probe not placed</span></div><div id="srcs" class="row"></div></div></div></div>
      <div><div class="card"><h3 style="margin-top:0">Select the circuit fault</h3><div class="faults" id="fl"></div><div class="row end mt"><button class="btn primary" id="tg">Grade selection</button></div><div id="tfb"></div></div>
      <div class="card small muted">${spec.note||''}</div></div></div>`);
    body.appendChild(card);
    CC.$('#sch',card).onclick=()=>{const d=CC.$('#schd',card);d.classList.toggle('hide');CC.$('#sch',card).textContent=d.classList.contains('hide')?'Schematic':'Schematic off';};
    b.faults.forEach((f,i)=>CC.$('#fl',card).appendChild(CC.el(`<label><input type="radio" name="flt" value="${i}"> <span>${esc(f)}</span></label>`)));
    const srcs=CC.$('#srcs',card);
    (b.inputs||[]).forEach(inp=>{const e=CC.el(`<div class="meterbox"><span class="ml">${esc(inp.label)} DC source</span><div class="row" style="gap:6px"><button class="btn sm" data-d="-1" aria-label="Decrease ${esc(inp.label)}">▼</button><span class="lcd" style="min-width:6ch" data-v></span><button class="btn sm" data-d="1" aria-label="Increase ${esc(inp.label)}">▲</button></div></div>`);
      const show=()=>{CC.$('[data-v]',e).textContent=(inputs[inp.key]>=0?'+':'')+inputs[inp.key].toFixed(2);};show();
      CC.$$('[data-d]',e).forEach(bt=>bt.onclick=()=>{if(card.dataset.graded)return;inputs[inp.key]=Math.max(inp.min,Math.min(inp.max,+(inputs[inp.key]+(+bt.dataset.d)*inp.step).toFixed(3)));show();readout(false);});
      srcs.appendChild(e);});
    const readout=(charge)=>{
      if(!probe){CC.$('#lcd',card).textContent='----';return;}
      const v=meter(b.read(probe,inputs))+CC.rnd(-0.002,0.002);
      CC.$('#lcd',card).textContent=(v>=0?'+':'')+(Math.abs(v)<10?v.toFixed(3):v.toFixed(2));
      const p=b.pads.find(q=>q.id===probe);CC.$('#where',card).textContent=p.label;
      if(charge&&per&&pts>0){pts--;upd();}
    };
    const draw=()=>{
      const pads=b.pads.map(p=>`<g class="pad" data-id="${p.id}" tabindex="0" role="button" aria-label="Solder pad ${esc(p.label)}"><circle class="ring" cx="${p.x}" cy="${p.y}" r="6" fill="#e0e0e0" stroke="#777" stroke-width="2"/><circle cx="${p.x}" cy="${p.y}" r="2" fill="#555"/>${probe===p.id?`<circle cx="${p.x}" cy="${p.y}" r="10" fill="none" stroke="#d32f2f" stroke-width="4"/><path d="M${p.x+6},${p.y-6} l18,-22" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>`:''}<circle class="hit" cx="${p.x}" cy="${p.y}" r="13"/></g>`).join('');
      CC.$('#bw',card).innerHTML=b.svg().replace('</svg>',pads+'</svg>');
      CC.$$('.pad',card).forEach(g=>{const f=()=>{if(card.dataset.graded)return;const ch=probe!==g.dataset.id;probe=g.dataset.id;draw();readout(ch);};g.onclick=f;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f();}};});
    };
    draw();
    CC.$('#tg',card).onclick=()=>{
      const btn=CC.$('#tg',card);
      if(card.dataset.graded){k++;if(k>=N)return end();return next();}
      const c=CC.$('input:checked',CC.$('#fl',card));
      if(!c){CC.modal('<p>You did not select a fault. Select a fault, then choose Grade selection.</p>');return;}
      card.dataset.graded='1';const good=+c.value===b.answer;const got=good?pts:0;earned+=got;
      CC.$$('#fl label',card).forEach((lb,i)=>{if(i===b.answer)lb.classList.add('correct');else if(i===+c.value)lb.classList.add('wrong');});
      CC.$$('#fl input',card).forEach(x=>x.disabled=true);
      CC.$('#ts',w).textContent=`Points earned: ${earned}`;
      CC.$('#tfb',card).innerHTML=`<p class="verdict ${good?'ok':'bad'}">${good?'Right!':'Incorrect'}</p><p class="small">${good?`You earned ${got} point${got===1?'':'s'} on this item.`:`The correct answer is highlighted: <b>${esc(b.faults[b.answer])}</b>.`} Your total score so far is ${earned} point${earned===1?'':'s'}.</p>${b.explain?`<p class="small">${typeof b.explain==='function'?b.explain():b.explain}</p>`:''}${CC.workHTML(typeof b.work==='function'?b.work():b.work,'Show how to find this fault')}`;
      btn.textContent=k+1<N?'Continue':'Finish';
    };
  };
  const end=()=>s.finish(earned/max*100,`${earned} of ${max} possible points.`);
  next();
};

/* ---------- small plot helper ---------- */
K.plot=function({w=340,h=200,xs,series,xlog,ylab,xlab,ymin,ymax,xticks,yticks}){
  const L=42,R=26,T=10,B=30;const pw=w-L-R,ph=h-T-B;
  const x0=xs[0],x1=xs[xs.length-1];const fx=xlog?(x=>L+(Math.log10(x)-Math.log10(x0))/(Math.log10(x1)-Math.log10(x0))*pw):(x=>L+(x-x0)/(x1-x0)*pw);
  let lo=ymin,hi=ymax;if(lo===undefined){lo=Infinity;hi=-Infinity;series.forEach(s=>s.ys.forEach(y=>{if(isFinite(y)){lo=Math.min(lo,y);hi=Math.max(hi,y);}}));const pad=(hi-lo)*0.08||1;lo-=pad;hi+=pad;}
  const fy=y=>T+(1-(Math.max(lo,Math.min(hi,y))-lo)/(hi-lo))*ph;
  let g=`<rect x="${L}" y="${T}" width="${pw}" height="${ph}" fill="var(--surface)" stroke="var(--line)"/>`;
  (yticks||[]).forEach(t=>{g+=`<line x1="${L}" x2="${L+pw}" y1="${fy(t)}" y2="${fy(t)}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${L-4}" y="${fy(t)+4}" font-size="10" text-anchor="end" fill="var(--ink2)">${t}</text>`;});
  (xticks||[]).forEach(t=>{g+=`<line y1="${T}" y2="${T+ph}" x1="${fx(t.v)}" x2="${fx(t.v)}" stroke="var(--line)" stroke-dasharray="2 3"/><text y="${T+ph+13}" x="${fx(t.v)}" font-size="10" text-anchor="middle" fill="var(--ink2)">${t.l}</text>`;});
  series.forEach(s=>{g+=`<polyline fill="none" stroke="${s.color||'var(--accent)'}" stroke-width="2" points="${xs.map((x,i)=>fx(x).toFixed(1)+','+fy(s.ys[i]).toFixed(1)).join(' ')}"/>`;});
  if(ylab)g+=`<text x="12" y="${T+ph/2}" font-size="10" fill="var(--ink2)" text-anchor="middle" transform="rotate(-90 12 ${T+ph/2})">${esc(ylab)}</text>`;
  if(xlab)g+=`<text x="${L+pw/2}" y="${h-2}" font-size="10" fill="var(--ink2)" text-anchor="middle">${esc(xlab)}</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="graph">${g}</svg>`;
};

/* ---------- calculator form ---------- */
/* fields:[{key,label(tex),unit,value}], compute(vals)->html */
K.calc=function(root,{title,diagram,fields,compute,note}){
  const card=CC.el(`<div class="cols2"><div class="card"><h2 style="margin-top:0">${title}</h2><div class="diagram">${diagram}</div>${note?`<p class="small muted">${note}</p>`:''}</div><div class="card"><div class="fields" id="cf"></div><div class="row end"><button class="btn primary" id="cgo">Recalculate</button></div><div id="cout" class="mt"></div></div></div>`);
  root.appendChild(card);
  const cf=CC.$('#cf',card);
  fields.forEach(f=>{const e=CC.el(`<div class="field"><label>${CC.m(f.label)} <span class="muted">(${esc(f.unit)})</span></label><input type="text" inputmode="decimal" value="${f.value}" data-k="${f.key}"></div>`);cf.appendChild(e);});
  const go=()=>{const v={};let bad=false;CC.$$('input',cf).forEach(i=>{const x=CC.parse(i.value,false);if(!(x>0)){i.classList.add('bad');bad=true;}else{i.classList.remove('bad');v[i.dataset.k]=x;}});
    CC.$('#cout',card).innerHTML=bad?'<p class="small" style="color:var(--bad)">Enter positive numbers in every block.</p>':compute(v);};
  CC.$$('input',cf).forEach(i=>{i.addEventListener('change',go);i.addEventListener('keydown',e=>{if(e.key==='Enter')go();});});
  CC.$('#cgo',card).onclick=go;go();
};
})();

</script>
<script>(function(){
'use strict';
const {fmt,pick,rnd,ri,shuffle,eVal,m,M,svg:S,board:B,esc}=CC;
const T=window.OAT,F=OAK.fig,{W,R,C,G,D,txt}=OAK;
const Mq=s=>s.split('\\qquad').map(x=>M(x)).join('');
const splitQ=w=>w&&w.flatMap(t=>t.startsWith('>')?[t]:t.split('\\qquad'));
const H3=t=>`<h3>${t}</h3>`;
const ex=(q,steps)=>`<div class="formula"><p class="small" style="margin-top:0">${q}</p>${steps.map(s=>Mq(s)).join('')}</div>`;
const kO=v=>fmt(v,4)+' kΩ';
const TOL=0.01;
const fig=(svg,cap='Figure One')=>`<figure style="margin:0;text-align:center">${svg}<figcaption class="small muted">${cap}</figcaption></figure>`;
/* TeX number helpers for worked solutions */
const N=(v,d=4)=>fmt(v,d);
const P_=(v,d=4)=>v<0?`(${N(v,d)})`:N(v,d);          // parenthesize negatives
const kT=v=>`${N(v)}\\text{ k}\\Omega`;
const sg=(v,n=3)=>+(+v).toPrecision(n);                 // value exactly as displayed
const sci=v=>{if(v===0)return '0';const e=Math.floor(Math.log10(Math.abs(v)));if(e>=-2&&e<4)return N(v);return `${N(v/Math.pow(10,e))}\\times10^{${e}}`;};

/* ---------- item helpers ---------- */
function mc(q,correct,others,diagram,why){const opts=shuffle([correct,...others]);return {title:'',prompt:`<p>${q}</p>`,diagram,fields:[{key:'a',label:'Select the best answer',choices:opts.map(esc),answer:opts.indexOf(correct)}],work:why?['>'+why]:undefined};}
function num(q,value,unit,diagram,extra,method,work){return {prompt:`<p>${q}</p>`,diagram,fields:[Object.assign({key:'a',label:'Answer',unit,value},extra||{})],explain:method,work:splitQ(work)};}
const vSigned=v=>(v>0?'+':'')+fmt(v,3).replace('-','−');
const tip=t=>`<p class="small" style="margin:6px 0 0">${t}</p>`;

/* ---------- Simple applications ---------- */
function simpleItems(){
  const it=[];
  it.push(mc('What type of circuit is shown in figure one?','Follower',['Comparator','I to V Converter'],fig(F.follower()),'The output is wired straight back to the − input and the signal goes to the + input, with no resistors. That is a voltage follower (gain 1).'));
  it.push(mc('What type of circuit is shown in figure one?','Comparator',['Follower','I to V Converter'],fig(F.comparator()),'Two signals go to the two inputs and there is no feedback from the output, so the op amp compares them and the output swings to one rail or the other. That is a comparator.'));
  it.push(mc('What type of circuit is shown in figure one?','I to V Converter',['Follower','Comparator'],fig(F.itov()),'A current source drives the − input (virtual ground) and a feedback resistor Rf converts that current into an output voltage. That is a current-to-voltage converter.'));
  const vin=+(rnd(-9,9)).toFixed(2)||1.25;
  it.push(num(`Input voltage = ${fmt(vin)} V. What is the output voltage of the circuit in figure one?`,vin,'V',fig(F.follower()),{},M('V_{out}=V_{in}'),['>A follower has a gain of exactly 1 and no inversion, so the output copies the input, sign included.','V_{out}=V_{in}=' +N(vin)+'\\text{ V}']));
  it.push(num('What is the voltage gain of the circuit in figure one?',1,'',fig(F.follower()),{},M('A=1'),['>The output is fed back directly to the − input, so the op amp makes the output equal to the + input.','A=\\frac{V_{out}}{V_{in}}=1']));
  it.push(mc('The input impedance of the circuit in figure one is ______.','Very High',['Very Low'],fig(F.follower()),'Feedback multiplies the op amp’s own input impedance by about its open-loop gain, so a follower’s input impedance is thousands of megohms: very high.'));
  it.push(mc('The output impedance of the circuit in figure one is ______.','Very Low',['Very High'],fig(F.follower()),'Negative feedback divides the op amp’s output impedance by the loop gain, so the follower’s output impedance is far below 1 Ω: very low.'));
  for(let j=0;j<2;j++){
    const V=pick([12,15]);let va,vb;do{va=+(rnd(-9,9)).toFixed(1);vb=+(rnd(-9,9)).toFixed(1);}while(Math.abs(va-vb)<0.3);
    const out=vb>va?V:-V;
    it.push({prompt:`<p>The supply voltages are ±${V} V. Input A = ${vSigned(va)} V and input B = ${vSigned(vb)} V. What is the approximate output voltage of the circuit in figure one?</p>`,diagram:fig(F.comparator({va:'A '+vSigned(va)+' V',vb:'B '+vSigned(vb)+' V'})),
      fields:[{key:'a',label:'Answer',unit:'V',value:out,show:(out>0?'+':'')+out,check:s=>{const u=CC.parse(s);return !isNaN(u)&&Math.sign(u)===Math.sign(out)&&Math.abs(u)>=V*0.85&&Math.abs(u)<=V*1.001;}}],
      explain:tip(`Any answer from ${fmt(V*0.85,3)} V to ${V} V with the correct sign is accepted, because a real output stops a volt or two short of the rail.`),
      work:[`>Input B is the + input and input A is the − input. Compare them on the number line: B = ${vSigned(vb)} V is ${vb>va?'greater':'less'} than A = ${vSigned(va)} V.`,`>${vb>va?'B > A, so the output swings to the positive rail':'A > B, so the output swings to the negative rail'}: about ${out>0?'+':'−'}${V} V (a real op amp gets within about 1 to 2 V of the rail).`]});
  }
  for(let j=0;j<2;j++){const rf=pick([1,1.5,2,3,4.7,10,22,47]);const imax=Math.min(900,Math.floor(12/rf*1000));const iin=ri(20,imax);const vo=iin*1e-6*rf*1e3;
    it.push(num(`Rf = ${fmt(rf)} kΩ and the input current is ${iin} µA. What is the magnitude of the output voltage of the circuit in figure one?`,vo,'V',fig(F.itov({rf:'Rf'})),{signFree:true},M('|V_{out}|=I_{in}R_f')+tip('With the current flowing into the input as drawn, the output is negative; either sign is accepted.'),
      ['>Convert to base units first: µA to A and kΩ to Ω.',`|V_{out}|=I_{in}R_f=(${iin}\\times10^{-6}\\text{ A})(${N(rf*1e3)}\\text{ }\\Omega)`,`|V_{out}|=${N(vo)}\\text{ V}`]));}
  {const rf=pick([1,2,3,10,100]);const vo=+(rnd(0.5,9)).toFixed(2);const ii=vo/(rf*1e3)*1e6;
    it.push(num(`Rf = ${fmt(rf)} kΩ and the output voltage is ${fmt(vo)} V. What is the input current of the circuit in figure one?`,ii,'µA',fig(F.itov()),{signFree:true},M('I_{in}=\\frac{V_{out}}{R_f}'),
      [`I_{in}=\\frac{V_{out}}{R_f}=\\frac{${N(vo)}\\text{ V}}{${N(rf*1e3)}\\text{ }\\Omega}`,`I_{in}=${N(ii/1e6,4)}\\text{ A}=${N(ii)}\\text{ µA}`]));}
  return shuffle(it);
}

/* ---------- Inverting ---------- */
function invItems(){
  const it=[];const pr=()=>{let ri_,rf;do{ri_=eVal(1,47);rf=eVal(2.2,470);}while(rf/ri_<1.5||rf/ri_>60);return [ri_,rf];};
  for(let j=0;j<2;j++){const [a,b]=pr();it.push(num(`Ri = ${kO(a)} and Rf = ${kO(b)}. What is the voltage gain of figure one?`,b/a,'',fig(F.inverting()),{signFree:true},M('A=\\frac{R_f}{R_i}')+tip('You may enter the gain as positive or negative; the minus sign just means the output is inverted.'),
    [`A=\\frac{R_f}{R_i}=\\frac{${kT(b)}}{${kT(a)}}`,`A=${N(b/a)}`,'>You may also write the gain as negative to show the inversion.']));}
  for(let j=0;j<2;j++){const [a,b]=pr();it.push(num(`Ri = ${kO(a)} and Rf = ${kO(b)}. What value should resistor R1 be in figure one?`,a*b/(a+b),'kΩ',fig(F.inverting({r1:'R1'})),{},M('R_1=\\frac{R_f R_i}{R_f+R_i}'),
    ['>R1 should equal Ri in parallel with Rf, so both inputs see the same DC resistance and the bias-current offsets cancel.',`R_1=\\frac{R_fR_i}{R_f+R_i}=\\frac{(${N(b)})(${N(a)})}{${N(b)}+${N(a)}}\\text{ k}\\Omega`,`R_1=${kT(a*b/(a+b))}`]));}
  for(let j=0;j<2;j++){const z=eVal(1,100);it.push(num(`An input impedance of ${kO(z)} is required. What value should Ri be in figure one?`,z,'kΩ',fig(F.inverting()),{},M('R_i=Z_{in}'),
    ['>The − input is a virtual ground, so the source sees only Ri.',`R_i=Z_{in}=${kT(z)}`]));}
  for(let j=0;j<2;j++){const A=pick([2,3,4,5,6,7,8,10,12,15,20,25,50]);const a=eVal(1,22);it.push(num(`Ri = ${kO(a)}. What value of Rf is required for a gain of ${A} in figure one?`,A*a,'kΩ',fig(F.inverting()),{},M('R_f=A\\,R_i'),
    [`R_f=A\\,R_i=(${A})(${kT(a)})`,`R_f=${kT(A*a)}`]));}
  const zo=['near 0 ohms','equal to Ri','equal to Rf','equal to R1'];
  for(let j=0;j<2;j++)it.push(mc('The output impedance of the circuit in figure one is ______.','near 0 ohms',zo.slice(1),fig(F.inverting({r1:'R1'})),'Negative feedback makes the op amp hold its output voltage regardless of load, so the output impedance is close to 0 Ω.'));
  for(let j=0;j<2;j++)it.push(mc('The input impedance of the circuit in figure one is ______.','equal to Ri',['near 0 ohms','equal to Rf','equal to R1'],fig(F.inverting({r1:'R1'})),'The − input is held at virtual ground, so the signal source drives Ri to 0 V. The input impedance equals Ri.'));
  for(let j=0;j<4;j++){let a,b,vin,vo,mv;do{[a,b]=pr();mv=Math.random()<0.5;vin=sg(mv?rnd(-900,900):rnd(-3,3));vo=-b/a*vin;}while(Math.abs(mv?vo/1000:vo)>12||Math.abs(vin)<(mv?5:0.05));
    const u=mv?'mV':'V';
    it.push(num(`Ri = ${kO(a)}, Rf = ${kO(b)} and Vin = ${vSigned(vin)} ${u}. What is the output voltage of figure one?`,vo,u,fig(F.inverting()),{},M('V_{out}=-\\frac{R_f}{R_i}V_{in}'),
      [`A=\\frac{R_f}{R_i}=\\frac{${kT(b)}}{${kT(a)}}=${N(b/a)}`,`V_{out}=-A\\,V_{in}=-(${N(b/a)})${P_(vin)}\\text{ ${u}}`,`V_{out}=${N(vo)}\\text{ ${u}}`,'>The output has the opposite sign to the input.']));}
  {// saturation item: the formula predicts more than the output can deliver
    let a,b,vin,ideal;do{a=eVal(1,10);b=eVal(47,470);vin=sg(rnd(0.4,2)*(Math.random()<0.5?-1:1),2);ideal=-b/a*vin;}while(Math.abs(ideal)<20||Math.abs(ideal)>200);
    const sat=ideal>0?13.5:-13.5;
    it.push({prompt:`<p>Ri = ${kO(a)}, Rf = ${kO(b)} and Vin = ${vSigned(vin)} V. The supplies are ±15 V and the output can swing to within about 1.5 V of each supply. What is the output voltage of figure one?</p>`,diagram:fig(F.inverting()),
      fields:[{key:'a',label:'Answer',unit:'V',value:sat,show:(sat>0?'+':'−')+'13.5',check:s=>{const u=CC.parse(s);return !isNaN(u)&&Math.sign(u)===Math.sign(sat)&&Math.abs(u)>=13&&Math.abs(u)<=15;}}],
      explain:M('V_{out}=-\\frac{R_f}{R_i}V_{in}')+tip('Answers from 13 V to 15 V with the correct sign are accepted.'),
      work:[`V_{out}=-\\frac{R_f}{R_i}V_{in}=-\\frac{${kT(b)}}{${kT(a)}}${P_(vin)}\\text{ V}=${N(ideal)}\\text{ V}`,`>That is more than the op amp can deliver. The output saturates about 1.5 V inside the ${sat>0?'positive':'negative'} supply.`,`V_{out}\\approx${sat>0?'+':'-'}13.5\\text{ V}`]});}
  return shuffle(it);
}
/* ---------- Noninverting ---------- */
function noninvItems(){
  const it=[];const pr=()=>{let a,b;do{a=eVal(1,47);b=eVal(2.2,470);}while(b/a<1||b/a>60);return [a,b];};
  for(let j=0;j<2;j++){const [a,b]=pr();it.push(num(`Ri = ${kO(a)} and Rf = ${kO(b)}. What is the voltage gain of figure one?`,b/a+1,'',fig(F.noninv()),{},M('A=\\frac{R_f}{R_i}+1'),
    [`A=\\frac{R_f}{R_i}+1=\\frac{${kT(b)}}{${kT(a)}}+1`,`A=${N(b/a)}+1=${N(b/a+1)}`]));}
  for(let j=0;j<2;j++){const A=pick([2,3,4,5,8,10,11,16,21,26,31,51]);const a=eVal(1,22);it.push(num(`A voltage gain, A, of ${A} is required. Ri = ${kO(a)}. What value should Rf be in figure one?`,a*(A-1),'kΩ',fig(F.noninv()),{},M('R_f=R_i(A-1)'),
    ['>Rearrange the gain formula: A = Rf/Ri + 1, so Rf = Ri(A − 1).',`R_f=R_i(A-1)=(${kT(a)})(${A}-1)`,`R_f=${kT(a*(A-1))}`]));}
  for(let j=0;j<2;j++)it.push(mc('The input impedance of the circuit in figure one is ______.','very high',['equal to Ri','equal to Rf','very low'],fig(F.noninv()),'The signal drives the op amp’s + input directly, and feedback multiplies the op amp’s own input impedance by (1 + loop gain). The result is very high, typically gigohms.'));
  for(let j=0;j<2;j++)it.push(mc('The output impedance of the circuit in figure one is ______.','near 0 ohms',['equal to Ri','equal to Rf','very high'],fig(F.noninv()),'Negative feedback holds the output voltage constant as the load changes, so the output impedance is close to 0 Ω.'));
  for(let j=0;j<2;j++){let a,b,vin,vo;do{[a,b]=pr();vin=sg(rnd(-900,900));vo=(b/a+1)*vin;}while(Math.abs(vo)>12000||Math.abs(vin)<5);
    it.push(num(`Ri = ${kO(a)}, Rf = ${kO(b)} and Vin = ${vSigned(vin)} mV. What is the output voltage of figure one?`,vo,'mV',fig(F.noninv()),{},M('V_{out}=A\\,V_{in}=\\left(\\frac{R_f}{R_i}+1\\right)V_{in}'),
      [`A=\\frac{${kT(b)}}{${kT(a)}}+1=${N(b/a+1)}`,`V_{out}=A\\,V_{in}=(${N(b/a+1)})${P_(vin)}\\text{ mV}`,`V_{out}=${N(vo)}\\text{ mV}`,'>A noninverting amplifier keeps the sign of the input.']));}
  for(let j=0;j<2;j++){const [a,b]=pr();const z=pick([1,1.5,2,3,5]);const aol=pick([50000,100000,200000]);const A=b/a+1;const Z=z*1e6*(1+aol/A);
    it.push(num(`Ri = ${kO(a)}, Rf = ${kO(b)}. The op amp has an open-loop gain ${m('A_{OL}')} of ${fmt(aol)} and an open-loop input impedance ${m('z_{in}')} of ${z} MΩ. What is the closed-loop input impedance of figure one?`,Z/1e9,'GΩ',fig(F.noninv()),{},Mq('Z_{in}=z_{in}\\left(1+A_{OL}B\\right)\\qquad B=\\frac{R_i}{R_i+R_f}=\\frac{1}{A}'),
      [`>First find the feedback fraction ${m('B')}, then multiply ${m('z_{in}')} by one plus the loop gain ${m('A_{OL}B')}.`,`A=\\frac{R_f}{R_i}+1=${N(A)}\\qquad B=\\frac{1}{A}=${N(1/A)}`,`A_{OL}B=\\frac{${fmt(aol)}}{${N(A)}}=${N(aol/A)}`,`Z_{in}=(${z}\\text{ M}\\Omega)(1+${N(aol/A)})=${N(Z/1e6)}\\text{ M}\\Omega`,`Z_{in}=${N(Z/1e9)}\\text{ G}\\Omega`]));}
  return shuffle(it);
}
/* ---------- Sum and difference ---------- */
function sumItems(){
  const it=[];const v=()=>+(rnd(-5,5)).toFixed(1)||0.5;
  const vlist=vs=>vs.map(x=>P_(x)).join('+');
  const sumQ=(n,ratio)=>{let vs,out,r,rf;do{vs=Array.from({length:n},v);r=eVal(1,47);rf=ratio?sg(r*pick([2,3,4,5])):r;out=-(rf/r)*vs.reduce((a,b)=>a+b,0);}while(Math.abs(out)>12);
    const names=n===3?'R1, R2, R3':'R1, R2';
    const given=ratio?`${names.replace(/, (?=R\d$)/,' and ')} = ${kO(r)}, Rf = ${kO(rf)}`:`${names} and Rf = ${kO(r)}`;
    const vv=vs.map((_,i)=>'V_'+(i+1)).join('+');
    const tex=ratio?`V_{out}=-\\frac{R_f}{R_1}(${vv})`:`V_{out}=-(${vv})`;const S=vs.reduce((a,b)=>a+b,0);
    const work=ratio?[`V_{out}=-\\frac{R_f}{R_1}(${vv})=-\\frac{${kT(rf)}}{${kT(r)}}(${vlist(vs)})\\text{ V}`,`V_{out}=-(${N(rf/r)})${P_(S)}\\text{ V}=${N(out)}\\text{ V}`]:[`V_{out}=-(${vv})=-(${vlist(vs)})\\text{ V}`,`V_{out}=-${P_(S)}\\text{ V}=${N(out)}\\text{ V}`];
    return num(`${given}. What is the output voltage of the circuit if ${vs.map((x,i)=>`V${i+1} = ${vSigned(x)} V`).join(', ')}?`,out,'V',fig(F.summing(n),n===3?'Figure Two':'Figure One'),{absTol:0.005},M(tex),work);};
  const wsumQ=()=>{let vs,out,r1,r2,rf;do{vs=[v(),v()];r1=eVal(1,47);r2=sg(r1*pick([2,3,4,5,10]));rf=sg(r1*pick([1,2,3,5]));out=-(rf/r1*vs[0]+rf/r2*vs[1]);}while(Math.abs(out)>12||Math.abs(out)<0.05);
    return num(`R1 = ${kO(r1)}, R2 = ${kO(r2)} and Rf = ${kO(rf)}. What is the output voltage of the circuit if V1 = ${vSigned(vs[0])} V and V2 = ${vSigned(vs[1])} V?`,out,'V',fig(F.summing(2)),{},M('V_{out}=-\\left(\\frac{R_f}{R_1}V_1+\\frac{R_f}{R_2}V_2\\right)'),
      ['>The input resistors differ, so each input has its own gain.',`\\frac{R_f}{R_1}=\\frac{${kT(rf)}}{${kT(r1)}}=${N(rf/r1)}\\qquad\\frac{R_f}{R_2}=\\frac{${kT(rf)}}{${kT(r2)}}=${N(rf/r2)}`,`V_{out}=-\\left((${N(rf/r1)})${P_(vs[0])}+(${N(rf/r2)})${P_(vs[1])}\\right)\\text{ V}`,`V_{out}=${N(out)}\\text{ V}`]);};
  for(let j=0;j<3;j++)it.push(sumQ(2,false));
  for(let j=0;j<3;j++)it.push(sumQ(3,false));
  for(let j=0;j<2;j++)it.push(sumQ(2,true));
  it.push(sumQ(3,true));
  for(let j=0;j<2;j++)it.push(wsumQ());

      const xs=Array.from({length:301},(_,i)=>i/300*3*Tt);const sq=xs.map(t=>((t/Tt)%1)<0.5?1:-1);const amp=Math.min(1,Tt/(4*TC))*1;let y=0,tri=[];const dt=xs[1]-xs[0];
      // integrate centred
      xs.forEach((t,i)=>{tri.push(y);y-=sq[i]*dt/TC;});const mid=(Math.max(...tri)+Math.min(...tri))/2;tri=tri.map(v=>(v-mid));const tmax=Math.max(...tri.map(Math.abs))||1;const relAmp=Math.min(1,Tt/(4*TC));tri=tri.map(v=>v/tmax*0.8);

const exInv=ex(''+m('R_{i}')+' = 3.3 kΩ, '+m('R_{f}')+' = 12 kΩ and '+m('V_{in}')+' = 28 mV in figure one.',['A=\\frac{R_f}{R_i}=\\frac{12\\text{ k}\\Omega}{3.3\\text{ k}\\Omega}=3.636','Z_{in}=R_i=3.3\\text{ k}\\Omega\\qquad Z_{out}\\approx0\\,\\Omega','R_1=\\frac{R_fR_i}{R_f+R_i}=\\frac{(12)(3.3)}{12+3.3}\\text{ k}\\Omega=2.588\\text{ k}\\Omega','V_{out}=-A\\,V_{in}=-(3.636)(28\\text{ mV})=-101.8\\text{ mV}'])+ex('Design an inverting amplifier with a gain of 7 and an input impedance of 12 kΩ.',['R_i=Z_{in}=12\\text{ k}\\Omega','R_f=A\\,R_i=(7)(12\\text{ k}\\Omega)=84\\text{ k}\\Omega','R_1=\\frac{R_fR_i}{R_f+R_i}=\\frac{(84)(12)}{84+12}\\text{ k}\\Omega=10.5\\text{ k}\\Omega']);
const exNon=ex(''+m('R_{i}')+' = 1 kΩ and '+m('R_{f}')+' = 100 kΩ in figure one. The op amp has '+m('A_{OL}')+' = 100,000 and '+m('z_{in}')+' = 1 MΩ. '+m('V_{in}')+' = 17.3 mV.',['A=\\frac{R_f}{R_i}+1=\\frac{100\\text{ k}\\Omega}{1\\text{ k}\\Omega}+1=101','Z_{in}=z_{in}\\left(1+\\frac{A_{OL}}{A}\\right)=(1\\text{ M}\\Omega)\\left(1+\\frac{100{,}000}{101}\\right)=991\\text{ M}\\Omega','V_{out}=A\\,V_{in}=(101)(17.3\\text{ mV})=1.747\\text{ V}'])+ex('Design a noninverting amplifier with a gain of 16. Any '+m('R_{i}')+' above about 1 kΩ works; choose 2.2 kΩ.',['R_f=R_i(A-1)=(2.2\\text{ k}\\Omega)(16-1)=33\\text{ k}\\Omega']);
const exSum=ex('R1, R2 and Rf = 10 kΩ in figure one. V1 = 2 V and V2 = 1.3 V.',['V_{out}=-(V_1+V_2)=-(2+1.3)\\text{ V}=-3.3\\text{ V}'])+ex('R1, R2, R3 and Rf = 3.3 kΩ in figure two. V1 = 1.7 V, V2 = −2.4 V and V3 = −3.4 V.',['V_{out}=-\\left(1.7+(-2.4)+(-3.4)\\right)\\text{ V}=-(-4.1)\\text{ V}=4.1\\text{ V}'])+ex('R1 = 10 kΩ, R2 = 20 kΩ and Rf = 20 kΩ. V1 = 1.5 V and V2 = −2 V.',['V_{out}=-\\left(\\frac{20}{10}(1.5)+\\frac{20}{20}(-2)\\right)\\text{ V}=-(3-2)\\text{ V}=-1\\text{ V}']);
const exDiff=ex('All four resistors equal. V2 = 3 V and V1 = 1.2 V.',['V_{out}=V_2-V_1=3-1.2=1.8\\text{ V}'])+ex('All four resistors equal. V2 = −4 V and V1 = −6 V.',['V_{out}=-4-(-6)=-4+6=2\\text{ V}'])+ex('R1 = R2 = 10 kΩ, R3 = Rf = 30 kΩ. V2 = 0.5 V and V1 = 0.2 V.',['V_{out}=\\frac{R_f}{R_1}(V_2-V_1)=\\frac{30}{10}(0.5-0.2)\\text{ V}=0.9\\text{ V}']);
const charIntro=()=>H3('Gain-bandwidth product')+T.gbw+ex('A 741 (GBW = 1 MHz) noninverting amplifier has a gain of 100.',['BW=\\frac{GBW}{A_{CL}}=\\frac{1\\text{ MHz}}{100}=10\\text{ kHz}'])+ex('A 741 inverting amplifier has '+m('R_{f}')+' = 22 kΩ and '+m('R_{i}')+' = 10 kΩ.',['A_{CL}=1+\\frac{R_f}{R_i}=1+2.2=3.2','BW=\\frac{1\\text{ MHz}}{3.2}=312.5\\text{ kHz}'])+'<p class="small">Dividing by the signal gain '+m('R_f/R_i=2.2')+' instead gives 454.5 kHz. Both answers are accepted in this activity.</p>'+
  H3('Slew rate')+T.slew+ex('A +2 V pulse drives an inverting amplifier with '+m('R_{f}')+' = 30 kΩ and '+m('R_{i}')+' = 10 kΩ. The slew rate is 3 V/µs.',['|V_{out}|=V_{in}\\frac{R_f}{R_i}=(2\\text{ V})\\frac{30\\text{ k}\\Omega}{10\\text{ k}\\Omega}=6\\text{ V}','\\Delta t=\\frac{|V_{out}|}{SR}=\\frac{6\\text{ V}}{3\\text{ V/µs}}=2\\text{ µs}'])+
  H3('Input offset voltage')+T.offset+two(H3('Input bias and offset currents')+T.bias,fig(F.bias()))+ex('I(A) = 90 nA and I(B) = 70 nA.',['I_B=\\frac{90+70}{2}\\text{ nA}=80\\text{ nA}\\qquad I_{OS}=|90-70|\\text{ nA}=20\\text{ nA}'])+
  two(H3('Common-mode rejection ratio')+T.cmrr,fig(F.cmrr()))+ex('A unity-gain difference amplifier ('+m('A_{d}')+' = 1) with both inputs tied to a 3 V PP common-mode signal has a 1 mV PP output.',['A_{cm}=\\frac{1\\text{ mV}}{3\\text{ V}}=3.333\\times10^{-4}','\\mathrm{CMRR}=20\\log\\left(\\frac{1}{3.333\\times10^{-4}}\\right)=20\\log(3000)=69.54\\text{ dB}'])+T.charMistakes;

const two=(a,b)=>`<div class="cols2" style="align-items:start"><div>${a}</div><div class="diagram">${b}</div></div>`;
const progIntro=()=>two(H3('What is an op amp?')+T.whatIs,fig(OAK.wrap(240,130,OAK.OA(70,65,{}).svg+W([30,47],[70,47])+W([30,83],[70,83])+W([140,65],[200,65])+txt(20,51,'−')+txt(20,87,'+')+txt(205,69,'Out',{anchor:'start'})),'Figure one'))+T.hints;

CC.App.init({
  id:'opamp',title:'Op Amp Challenge',tagline:'Operational amplifier exercises · offline edition',
