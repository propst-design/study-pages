  footer:'Based on Op Amp Challenge © ETCAI Products. Offline HTML edition.',pass:80,
  manual:T.manual,
  hero:slot=>{slot.appendChild(CC.el(`<div class="card"><div class="diagram">${F.inverting({r1:'R1'})}</div><p class="small muted center" style="margin-bottom:0">Inverting amplifier: ${m('A=-\\frac{R_f}{R_i}')}</p></div>`));},
  groups:[
    {title:'Getting started',items:[
      {id:'intro',title:'Program Introduction',icon:'amp',sub:'what is an op amp?',graded:false,intro:progIntro(),run:(el,s)=>{el.appendChild(CC.el(`<div class="card intro-text">${T.manual}<div class="row end"><a class="btn primary" href="#/">Main menu</a></div></div>`));}},
    ]},
    {title:'Amplifier activities',items:[
      {id:'simple',title:'Simple Op Amp Applications',icon:'amp',sub:'followers, comparators, I to V',intro:CC.introPage({text:T.simpleIntro+two(H3('Followers')+T.follower,fig(F.follower()))+two(H3('Comparators')+T.comparator,fig(F.comparator()))+two(H3('I to V converters')+T.itov,fig(F.itov())),how:T.howItems(12,'<p>Comparator answers are accepted anywhere from 85% of the supply voltage up to the supply voltage, with the correct sign.</p>')}),run:itemsRun(simpleItems)},
      {id:'inv',title:'Inverting Amplifiers',icon:'amp',sub:'17 analysis and design items',intro:CC.introPage({text:two(T.invIntro,fig(F.inverting({r1:'R1'})))+`<div class="formulas"><div class="formula"><span class="cap">Gain</span>${M('A=\\frac{R_f}{R_i}')}</div><div class="formula"><span class="cap">Input impedance</span>${M('Z_{in}=R_i')}</div><div class="formula"><span class="cap">Output</span>${M('V_{out}=-A\\,V_{in}')}</div><div class="formula"><span class="cap">Offset resistor</span>${M('R_1=\\frac{R_fR_i}{R_f+R_i}')}</div></div>`+H3('Examples')+exInv+T.invMistakes,how:T.howItems(17,'<p>The gain may be entered with or without the minus sign. One item asks for an output that saturates; answers from 13 V to 15 V with the correct sign are accepted there.</p>')}),run:itemsRun(invItems)},
      {id:'noninv',title:'Noninverting Amplifiers',icon:'amp',sub:'12 analysis and design items',intro:CC.introPage({text:two(T.noninvIntro,fig(F.noninv()))+`<div class="formulas"><div class="formula"><span class="cap">Gain</span>${M('A=\\frac{R_f}{R_i}+1')}</div><div class="formula"><span class="cap">Input impedance (closed loop)</span>${M('Z_{in}=z_{in}\\left(1+\\frac{A_{OL}}{A}\\right)')}</div><div class="formula"><span class="cap">Output</span>${M('V_{out}=A\\,V_{in}')}</div></div>`+H3('Examples')+exNon+T.noninvMistakes,how:T.howItems(12)}),run:itemsRun(noninvItems)},
      {id:'sum',title:'Sum and Difference Amps',icon:'amp',sub:'17 analog math items',intro:CC.introPage({text:T.sumIntro+two(H3('Summing amplifier')+T.summing,fig(F.summing(3),'Figure Two'))+exSum+two(H3('Difference amplifier')+T.difference,fig(F.difference()))+exDiff+T.sumMistakes,how:T.howItems(17)}),run:itemsRun(sumItems)},
      {id:'char',title:'Op Amp Characteristics',icon:'amp',sub:'bandwidth, slew rate, CMRR, bias',intro:CC.introPage({text:charIntro(),how:T.howItems(16,`<p>For the bandwidth of an inverting amplifier, answers using either the noise gain ${m('1+R_f/R_i')} or the signal gain ${m('R_f/R_i')} are accepted.</p>`)}),run:itemsRun(charItems)},
    ]},
    {title:'Troubleshooting',items:[
      {id:'ts1',title:'OA Troubleshooting One',icon:'wrench',sub:'inverting amplifier · 10 points each',intro:tsIntro(T.tsInv1,T.invGeneral,H3('Open resistors')+T.invResistors,invSchematic(),false).replace(T.traceGen,T.traceGen+T.invTraces),run:tsRun(invBoard,false)},
      {id:'ts2',title:'OA Troubleshooting Two',icon:'wrench',sub:'inverting amplifier · readings cost points',intro:tsIntro(T.tsInv2,T.invGeneral,H3('Open resistors')+T.invResistors,invSchematic(),true).replace(T.traceGen,T.traceGen+T.invTraces),run:tsRun(invBoard,true)},
      {id:'ts3',title:'OA Troubleshooting Three',icon:'wrench',sub:'instrumentation amplifier · 10 points each',intro:tsIntro(T.tsInst3,T.instGeneral,H3('Open resistors')+T.instResistors,instSchematic(),false).replace(T.traceGen,T.traceGen+T.instTraces),run:tsRun(instBoard,false)},
      {id:'ts4',title:'OA Troubleshooting Four',icon:'wrench',sub:'instrumentation amplifier · readings cost points',intro:tsIntro(T.tsInst4,T.instGeneral,H3('Open resistors')+T.instResistors,instSchematic(),true).replace(T.traceGen,T.traceGen+T.instTraces),run:tsRun(instBoard,true)},
    ]},
    {title:'Design calculators (ungraded)',items:[
      {id:'filt',title:'Active Filter Calculator',icon:'wave',sub:'second-order low and high pass',graded:false,intro:CC.introPage({text:two(T.filtIntro,`<div><p class="small muted">Typical response shapes: Chebyshev (blue), Butterworth (red) and Bessel (green).</p>`+OAK.plot({xs:Array.from({length:81},(_,i)=>Math.pow(10,-1+i*2/80)),xlog:true,ymin:-30,ymax:6,yticks:[-30,-20,-10,0],xticks:[{v:0.1,l:'0.1 fc'},{v:1,l:'fc'},{v:10,l:'10 fc'}],series:[[1.0,'#1f5fa8'],[1.414,'#b3261e'],[1.732,'#1e7d43']].map(([d,c])=>({color:c,ys:Array.from({length:81},(_,i)=>{const u=Math.pow(10,-1+i*2/80);return -20*Math.log10(Math.hypot(1-u*u,d*u));})}))})+'</div>')+T.filtNote}),run:filterRun},
      {id:'osc',title:'RC Oscillator Calculator',icon:'wave',sub:'phase-shift and Wien-bridge',graded:false,intro:CC.introPage({text:T.oscIntro}),run:oscRun},
