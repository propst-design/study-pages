<script>(function(){
'use strict';
const {fmt,pick,rnd,ri,eVal,m,M,esc}=CC;
const K=CC.kit,D=K.draw;
const BG='#1b1f24';
const fv=v=>K.fmtVolt(v);

/* ---------------- lesson text ---------------- */
const TXT={
voltmeters:`<p>A <b>voltmeter</b> measures voltage, the electrical "pressure" that pushes current through a circuit, in volts (V). An 8 V source pushes twice as hard as a 4 V source. Voltage comes from batteries, generators, solar cells, power supplies and other sources. A voltmeter can measure a source, and it can measure the <b>voltage drop</b> across a resistor or any other part in a circuit. Around any complete loop, the voltage drops add up to the applied voltage.</p>
<p>A voltmeter is connected <b>across</b> (in parallel with) the part or points you're measuring. The circuit stays powered. A digital voltmeter has a very high input resistance (typically 10 MΩ), so it draws almost no current and barely disturbs the circuit.</p>
<p><b>Polarity:</b> the meter shows a positive number when the red probe is more positive than the black probe, and a negative number when it's more negative.</p>
<h3>Opens and shorts</h3>
<p>Most circuit faults are opens or shorts.</p>
<ul><li>A <b>short</b> is a near-0 Ω path. Since ${m('V=IR')} and ${m('R\\approx0')}, the voltage across a short is about <b>0 V</b>, even though current flows. Reading 0 V across a part that should have a voltage drop points to a short.</li>
<li>An <b>open</b> is a break in the path, with infinite resistance. No current flows in a series circuit with an open, so every good part drops 0 V and <b>the entire supply voltage appears across the open</b>.</li></ul>
<p>Voltmeters are usually one function of a digital multimeter (DMM), selected with the range switch. Choose <b>DCV</b> for batteries and DC circuits and <b>ACV</b> for AC circuits.</p>
<h3>Ohm's law</h3><p>One volt pushes one ampere through one ohm:</p>${M('V=I R')}
<p>where ${m('V')} is voltage in volts, ${m('I')} is current in amperes and ${m('R')} is resistance in ohms (Ω). For example, ${m('V=(2\\,\\text{A})(3\\,\\Omega)=6\\,\\text{V}')}.</p>`,
purpose:`<p>A digital voltmeter's numbers are easy to read, but what do they tell you about the circuit? These activities let you practice reading voltages in context. Each one is a simulated lab bench: you move the probes, read the meter and decide what's wrong. Every activity picks new values and faults each time you run it, so you can practice as often as you like without memorizing answers. You get immediate feedback, and the correct answer is shown when you miss one.</p>
<p>These skills apply to electronics, electrical, automotive and HVAC work, and to any job that uses a voltmeter.</p>
<h3>The activities</h3>
<p><b>Open Circuits One and Two</b>: find open wires and parts in a series circuit with a battery, fuse, heater element and connecting wires. Sometimes two parts are open at once.</p>
<p><b>Shorts and Opens One and Two</b>: find an open or shorted module in a series circuit. Voltage readings tell shorted, open and normal parts apart.</p>
<p><b>Circuit Testing One and Two</b>: identify unmarked "battery modules" by measuring the voltages between their wires. The sources inside can be wired series-aiding or series-opposing.</p>
<p><b>Circuit Testing Three and Four</b>: identify the internal wiring of voltage-divider modules (a source and two or three resistors).</p>
<p><b>Troubleshooting One and Two</b>: find the open wire or part in a DC series circuit.</p>
<p><b>Troubleshooting Three and Four</b>: troubleshoot a 120 V AC circuit with a switch and three heater elements. Faults include open loads, a bad switch, a dead supply and hidden shorts inside a conduit.</p>
<p><b>Troubleshooting Five and Six</b>: troubleshoot a DC series-parallel circuit. Faults include shorted and open modules, a blown fuse and a weak battery.</p>
<p>In each pair, the second activity is the same as the first with stricter scoring: only a set number of probe moves are free, and each extra move costs a point.</p>`,
using:`<h3>How the program works</h3><p>Pick an activity from the main menu. Each one starts with a short introduction to the ideas you need. Choose <b>Begin</b> when you're ready.</p>
<p>In an activity, tap a test point to move a meter probe there (red = +, black = −). Like a real digital meter, the simulated meter has a small calibration error (up to about ±2%), and a reading of zero may show a few millivolts either way. The program times each activity.</p>
<p>When you finish, you'll see your score. If you're signed in with a name and ID you can print a certificate with your name, ID, date, time on task, score and a validity code that lets an instructor check the certificate hasn't been altered.</p>`,
bench:`<p>Practice finding a bad module with AC voltage readings. It isn't graded, so it also works well as a classroom demonstration. The AC source voltage changes from board to board, so check the source display each time.</p>
<p>Each module contains a resistor in parallel with a small capacitor, and the four modules are connected in series across a 60 Hz AC source. At 60 Hz the capacitor's reactance is hundreds of kilohms or more, far larger than the resistor, so each good module behaves like its resistor. Tap a module to connect the voltmeter across it. At most one module is defective. Select the defect, choose <b>Check selection</b>, then <b>Next PC board</b> for a new one.</p>
<p><b>No fault:</b> the four resistors are equal (within ±5%), so each module drops about one-fourth of the source voltage.</p>
<p><b>Open module</b> (open resistor): nearly the entire source voltage appears across the open module. The others read close to 0 V. Only the capacitor's tiny current still flows.</p>
<p><b>Shorted module</b> (shorted capacitor): the shorted module reads about 0 V and the other three each drop about one-third of the source voltage.</p>`,
open:`<p>A circuit is a complete path for current. An <b>open circuit</b> has a break somewhere in that path, so it has infinite resistance. A conductor can break inside its insulation and still look perfect from the outside, and any part (a fuse, a heater element, a lamp) can fail open.</p>
<h3>Finding an open with a voltmeter</h3><p>In a working series circuit, the voltage divides in proportion to resistance. Almost all of it is dropped across the load (here the heater). A fuse drops a small voltage, and wires drop almost nothing.</p>
<p><b>With one open part, no current flows. The good parts drop 0 V, and the entire supply voltage appears across the open part.</b></p>
<p><b>With two open parts</b>, the section between them isn't connected to either battery terminal. A voltmeter across just one of the opens reads about 0 V, because the other open breaks the meter's path back to the battery. Measuring across both opens at once shows the full voltage. A good method: put the black probe on Battery − and move the red probe from Battery + toward the load. The reading drops to 0 V just past the first open. Then put the black probe on Battery + and work back from Battery −. The reading changes from −12 V to 0 V just past the second open.</p>`,
modules3:`<p>This circuit has three modules in series with a 12 V battery and a fuse. Each module contains a resistor in parallel with a capacitor. Your job is to find the fault, if any, in each of ten circuits. The black probe stays on the battery's negative terminal, and you move the red probe.</p>
<p>A resistor usually fails <b>open</b>. A module with an open resistor is an open circuit, because a good capacitor blocks DC and provides no current path. A capacitor often fails <b>shorted</b>, and a shorted capacitor shorts the whole module, bypassing its resistor.</p>
<h3>What each fault looks like</h3><p>All readings below are with the black probe on Battery −. Current flows from Battery + through the fuse, then M3, M2 and M1, back to Battery −.</p>
<table class="t small"><thead><tr><th>Condition</th><th>M3 top</th><th>M3 bottom = M2 bottom</th><th>M2 top = M1 top</th><th>M1 bottom</th></tr></thead><tbody>
<tr><td>Normal</td><td>full</td><td>⅔</td><td>⅓</td><td>0</td></tr>
<tr><td>Blown fuse</td><td>0</td><td>0</td><td>0</td><td>0 (fuse left = full)</td></tr>
<tr><td>M1 open</td><td>full</td><td>full</td><td>full</td><td>0</td></tr>
<tr><td>M2 open</td><td>full</td><td>full</td><td>0</td><td>0</td></tr>
<tr><td>M3 open</td><td>full</td><td>0</td><td>0</td><td>0</td></tr>
<tr><td>M1 shorted</td><td>full</td><td>½</td><td>0</td><td>0</td></tr>
<tr><td>M2 shorted</td><td>full</td><td>½</td><td>½</td><td>0</td></tr>
<tr><td>M3 shorted</td><td>full</td><td>full</td><td>½</td><td>0</td></tr></tbody></table>
<p class="small">"Full" means the battery voltage minus the small drop across the fuse.</p>
<p><b>Why:</b> an open module takes the whole supply voltage, so every point before it reads full voltage and every point after it reads 0 V. A shorted module drops 0 V, and the remaining two equal modules each take half the supply.</p>
<p><b>Common mistake:</b> M1 open, M2 open and M3 open all have one terminal at full voltage and one at 0 V. Check which module the voltage step is across.</p>`,
battery:`<p>A batch of battery-pack modules was built without type labels. Each module has two wires on the left (purple, green) and two on the right (blue, red). Your job is to identify each module's type by measuring the voltages between its wires.</p>
<p>There are ten types, A through J. Most contain two voltage sources, V1 and V2, wired to the four wires in different ways. A few contain only one source. A voltmeter across two wires reads the sum of the source voltages in the path between them, with the right signs. A pair of wires with no complete path through the module reads 0 V.</p>
<p><b>Series-aiding</b> sources point the same way, and their voltages add:</p>${M('V_{TOTAL}=V_1+V_2')}
<p><b>Series-opposing</b> sources point opposite ways. They subtract, and the result has the polarity of the larger source:</p>${M('V_{TOTAL}=V_1-V_2')}
<h3>An example</h3><p>In a source symbol, the long line is the positive terminal and the short line is the negative terminal. Take a module with an 11 V source from purple (+) to blue, a 36 V source from red (+) to green, and a wire joining green and blue (type A):</p>
<ul><li>Red probe on purple, black on blue: <b>+11 V</b>. The red probe is on the + terminal of the 11 V source.</li>
<li>Green and blue: <b>0 V</b>. There's only a wire between them.</li>
<li>Red probe on purple, black on red: the two sources are series-opposing, so ${m('11\\,\\text{V}-36\\,\\text{V}=-25\\,\\text{V}')}. The reading is negative because the black probe is on the + terminal of the larger (36 V) source.</li>
<li>Red probe on green, black on red: <b>−36 V</b>. The black probe is on the + terminal of the 36 V source.</li></ul>
<p>Reversing both sources reverses every polarity. Reversing just one makes them series-aiding: purple to red would read ${m('-11\\,\\text{V}-36\\,\\text{V}=-47\\,\\text{V}')} with the 11 V source reversed, or ${m('+11\\,\\text{V}+36\\,\\text{V}=+47\\,\\text{V}')} with the 36 V source reversed.</p>
<p><b>Tip:</b> sketch the module and write each reading on it as you go. Keep track of which probe is on which wire. Swapping the probes changes the sign, not the size.</p>`,
divider:`<p>These modules each contain one DC source and a resistor voltage divider. The four wires (purple, green, blue, red) connect to different points in the divider, and different module types connect them differently. Your job is to find out which wire goes where.</p>
<p>In a series circuit, each resistor's share of the source voltage is its resistance divided by the total resistance. For a two-resistor divider:</p>
<div class="formulas">${['V_{R1}=V\\frac{R_1}{R_1+R_2}','V_{R2}=V\\frac{R_2}{R_1+R_2}=V-V_{R1}'].map(t=>`<div class="formula">${M(t)}</div>`).join('')}</div>
<p>For three resistors, use the total ${m('R_1+R_2+R_3')} on the bottom. The resistor drops always add up to the source voltage, so you can find the last one by subtraction.</p>
<p><b>Method:</b> first work out the voltage of each point, measured from the source's negative terminal: + is the full source voltage, junction A is ${m('V_{R2}')} (plus ${m('V_{R3}')} in the three-resistor module), and so on. Then find a wire that reads the most negative compared with the others, which is the − terminal. Measure every other wire against it and match the readings to the point voltages. A wire that reads 0 V to every other wire is not connected. Two wires that read 0 V to each other are tied to the same point.</p>
<p><b>Polarity:</b> a positive reading means the red probe is on the higher-voltage point.</p>`,
ts1:`<p>In this activity you move only the red probe. The black probe stays on the battery's negative terminal. That's an efficient way to troubleshoot: every reading tells you the voltage of one point compared with Battery −.</p>
<p>In a series circuit with one open part, every point between Battery + and the open reads the full battery voltage. Every point between the open and Battery − reads 0 V. <b>The open part is the one with full voltage on one terminal and 0 V on the other.</b> For example, if the blue wire is open in a 12 V circuit, every point from Battery + up to one end of the blue wire reads 12 V, and every point past its other end reads 0 V.</p>
<p>Some circuits have no fault. Then the voltage steps down a little at each part, in proportion to its resistance: the three equal resistors each drop about one-third of the battery voltage, the fuse drops a few hundredths of a volt and the wires drop almost nothing.</p>
<p><b>Strategy:</b> don't test every point in order. Start in the middle of the circuit. If that point reads full voltage, the open is further along toward Battery −. If it reads 0 V, the open is back toward Battery +. Keep halving the section that's left, and you'll find any open in about four readings.</p>`,
ac:`<p>This circuit has three heater elements (R1, R2 and R3) in series with a toggle switch, powered from a 120 V AC line (household line voltage). Set the meter to AC volts. The black probe stays on the neutral (white) conductor, and you move the red probe to the test points on the conduit. The colored wires run through the conduit to the test points, so a hidden short between two of them is possible.</p>
<table class="t small"><thead><tr><th>Test point</th><th>Wire</th><th>Connected to</th></tr></thead><tbody>
<tr><td>TP1</td><td>orange</td><td>hot side of the switch (the supply)</td></tr>
<tr><td>TP3</td><td>red</td><td>load side of S1, top of R1</td></tr>
<tr><td>TP4</td><td>purple</td><td>between R1 and R2</td></tr>
<tr><td>TP2</td><td>blue</td><td>between R2 and R3</td></tr>
<tr><td>TP5</td><td>bare copper</td><td>equipment ground, which reads about 0 V to neutral</td></tr></tbody></table>
<h3>Normal operation</h3><p>TP1 reads the line voltage (120 V ± 5%). With S1 ON, TP3 reads the full line voltage too, and the heaters divide it in proportion to their resistances:</p>
<div class="formulas"><div class="formula">${M('V_{TP2}=V_{R3}=V_{S}\\frac{R_3}{R_1+R_2+R_3}')}</div><div class="formula">${M('V_{TP4}=V_{R2}+V_{R3}=V_{S}\\frac{R_2+R_3}{R_1+R_2+R_3}')}</div></div>
<p>With S1 OFF, no current flows, so TP3, TP4 and TP2 all read 0 V (they connect to neutral through the heaters).</p>
<h3>Faults</h3>
<p><b>R1 open:</b> TP1 normal. TP3 reads full voltage with S1 ON (0 V when OFF). TP4 and TP2 read 0 V.</p>
<p><b>R2 open:</b> TP1 normal. TP3 and TP4 read full voltage with S1 ON. TP2 reads 0 V.</p>
<p><b>No source voltage:</b> every test point reads 0 V, including TP1.</p>
<p><b>S1 open (stuck off):</b> TP1 normal. TP3, TP4 and TP2 read 0 V whether S1 is ON or OFF.</p>
<p><b>S1 shorted (stuck on):</b> normal voltages whether S1 is ON or OFF. The circuit can't be turned off, so test with S1 OFF!</p>
<p><b>Red-to-purple short:</b> bypasses R1. TP3 and TP4 read full voltage, and R2 and R3 divide it: ${m('V_{TP2}=V_S\\frac{R_3}{R_2+R_3}')}.</p>
<p><b>Purple-to-blue short:</b> bypasses R2. TP3 reads full voltage, and TP4 and TP2 read the same: ${m('V_{TP4}=V_{TP2}=V_S\\frac{R_3}{R_1+R_3}')}.</p>
<p><b>Red-to-blue short:</b> bypasses R1 and R2. TP3, TP4 and TP2 all read full voltage, and only R3 carries current.</p>
<p><b>Tip:</b> a divider calculation is just "this resistor's share": divide the resistance by the total resistance in the path, then multiply by the source voltage. Use the TP1 reading as ${m('V_S')}. The line voltage varies by about ±5%.</p>`,
sp:`<p>This activity asks you to find shorted modules, open modules, a blown fuse or a weak battery in the circuit shown. Each module is a resistor (6 Ω) in parallel with a capacitor in one package. Modules fail open (open resistor) or shorted (shorted capacitor). The black probe stays on Battery −.</p>
<p><b>The circuit:</b> M2 and M4 are in series, and that pair is in parallel with M3. The parallel group is in series with M1. With DC, the capacitors carry no current and have no effect.</p>
${M('R_T=R_1+\\frac{R_3(R_2+R_4)}{R_3+R_2+R_4}=6+\\frac{6\\times12}{18}=10\\,\\Omega')}
<p><b>Normal operation:</b> all the current flows through M1, so M1 drops ${m('\\frac{6}{10}=60\\%')} of the supply. The parallel group drops the other 40%, so M3 drops 40%, and M2 and M4 split that equally at 20% each. Reading from Battery −: M1 right (= M2 left = M3 top) is about 40% of the supply, and M2 right (= M4 top) is about 20%.</p>
<table class="t small"><thead><tr><th>Condition</th><th>Total R</th><th>M1 right / M3 top</th><th>M4 top</th><th>Clue</th></tr></thead><tbody>
<tr><td>Normal</td><td>10 Ω</td><td>40%</td><td>20%</td><td>battery 12 V ± 10%</td></tr>
<tr><td>Blown fuse</td><td>∞</td><td>0</td><td>0</td><td>fuse left = battery, fuse right = 0 V</td></tr>
<tr><td>Weak battery</td><td>10 Ω</td><td>40%</td><td>20%</td><td>battery below 10.8 V (90% of 12 V); every reading is proportionally low</td></tr>
<tr><td>M1 open</td><td>∞</td><td>0</td><td>0</td><td>M1 left = full; no current, so <b>both fuse terminals read the same</b></td></tr>
<tr><td>M2 open</td><td>12 Ω</td><td>50%</td><td>0</td><td>M1 and M3 split the supply</td></tr>
<tr><td>M3 open</td><td>18 Ω</td><td>67%</td><td>33%</td><td>M1, M2 and M4 split the supply in thirds</td></tr>
<tr><td>M1 shorted</td><td>4 Ω</td><td>100%</td><td>50%</td><td>M1 drops 0 V</td></tr>
<tr><td>M2 shorted</td><td>9 Ω</td><td>33%</td><td>33%</td><td>M3 and M4 in parallel; M2 drops 0 V</td></tr>
<tr><td>M3 shorted</td><td>6 Ω</td><td>0</td><td>0</td><td>large current (about 2 A), so <b>the fuse drops a few tenths of a volt</b></td></tr>
<tr><td>M4 shorted</td><td>9 Ω</td><td>33%</td><td>0</td><td>M2 and M3 in parallel</td></tr></tbody></table>
<p><b>Watch out:</b> "M1 open" and "M3 shorted" both put full voltage on M1 left and 0 V on M1 right. Tell them apart by comparing the two fuse terminals. With no current (M1 open) they read the same. With the large current of a shorted M3, the fuse right terminal reads a few tenths of a volt lower than the left.</p>`
};

  const w=2*Math.PI*60,Bc=w*Cn*1e-9;
  // module impedance (complex): R in parallel with C; open → C alone; shorted capacitor → 0.01 Ω
  const Z=r.map((x,i)=>{if(f===`M${i+1} Shorted`)return [0.01,0];const G=f===`M${i+1} Open`?0:1/x;const d=G*G+Bc*Bc;return [G/d,-Bc/d];});
  const Zt=Z.reduce((a,z)=>[a[0]+z[0],a[1]+z[1]],[0.01,0]);const Zabs=Math.hypot(Zt[0],Zt[1]);
  const vmod=i=>Vs*Math.hypot(Z[i][0],Z[i][1])/Zabs;
  const ys=[70,130,190,250];
  const svg=()=>{let g=`<rect x="20" y="60" width="110" height="130" rx="10" fill="#2b2b2b"/><rect x="40" y="30" width="70" height="44" rx="4" fill="#f1f1f1" stroke="#bbb"/><circle cx="62" cy="52" r="5" fill="#333"/><circle cx="88" cy="52" r="5" fill="#333"/>`+T(75,140,'AC OUTPUT',{size:11})+T(75,158,fmt(Vs,4)+' VAC',{size:12,fill:'#7fffd4'})+T(75,176,'60 Hz',{size:11});
    g+=`<rect x="200" y="40" width="320" height="250" rx="8" fill="#1d7a3a" stroke="#0e4a22" stroke-width="3"/>`;
    const tr=pts=>`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#f3c7a0" stroke-width="7" stroke-linejoin="round"/>`;
    g+=D.wire([[110,180],[160,180],[160,70],[230,70]],'#222')+D.wire([[110,190],[150,190],[150,270],[230,270],[230,250]],'#222');
    g+=tr([[230,70],[290,70]])+tr([[430,70],[480,70],[480,130],[430,130]])+tr([[290,130],[250,130],[250,190],[290,190]])+tr([[430,190],[480,190],[480,250],[430,250]])+tr([[290,250],[230,250]]);
    ys.forEach((y,i)=>g+=D.part('M',[290,y],[430,y],'M'+(i+1),{bl:90}));
    return D.svg(540,300,g,BG);};
  return {svg,parts:ys.map((y,i)=>({id:'M'+(i+1),label:'M'+(i+1),x:275,y:y-24,w:170,h:46})),options:BENCH_OPTS,answer:ans,
    measure:id=>vmod(+id[1]-1),
    params:tbl([['Each module','resistor in parallel with a capacitor'],['Resistor',fmt(Rn)+' Ω ± 5%'],['Capacitor',fmt(Cn)+' nF'],['Source','AC, 60 Hz (voltage shown on the source)'],['Connection','M1 to M4 in series across the AC output']])};
}

  manual:`<h2>About this program</h2><p>Voltmeter Challenge is a set of simulated lab activities for learning to troubleshoot with a digital voltmeter. Students move the meter probes, interpret the readings and diagnose the fault. Every answer is graded right away, and the correct answer is shown after a miss. The activities also work for whole-class demonstrations on a projector or large screen.</p><p>New values and faults are chosen each time an activity runs, so students can repeat an activity without memorizing answers. Each activity opens with an introduction to the ideas it uses. Choose <b>Begin</b> to start. The program records the time on task. Signed-in students can print a certificate showing the activity, name, ID, date and time, score, time on task and a validity code. Use <b>Check validity</b> to confirm a certificate hasn't been altered.</p>
  <h3>Scoring</h3><p>Every activity has 10 items worth 10 points each, and the score is the percentage of the 100 possible points. In the first activity of each pair, measurements are free. In the stricter second activity, each item allows a set number of free probe moves (placing or moving a probe counts as a move). Each extra move costs one point, and a wrong answer earns 0 for that item. The free allowance is enough for a well-planned set of measurements, so an efficient technician can still score 100%. (The original program scored these activities as 14 or 20 points per item minus one point per move, reported as 0 to 140 or 0 to 200.)</p>`+TXT.purpose,
