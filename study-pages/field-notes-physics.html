// ── field-line simulator
function simField(el) {
  el.innerHTML = '<canvas></canvas><div class="simbar"><button data-a="+">Add + charge</button><button data-a="-">Add − charge</button><button data-a="r">Reset</button><span class="hint" style="margin:0">Drag charges to move them. Double-click one to remove it.</span></div>';
  const cv = $('canvas', el);
  let Q = [];
  const reset = () => { Q = [{ x: .33, y: .5, q: 1 }, { x: .67, y: .5, q: -1 }]; };
  reset();
  let W = 0, H = 0;
  const field = (x, y) => { let ex = 0, ey = 0; for (const c of Q) { const dx = x - c.x * W, dy = y - c.y * H, r2 = dx * dx + dy * dy + 1e-6, r3 = r2 * Math.sqrt(r2); ex += c.q * dx / r3; ey += c.q * dy / r3; } return [ex, ey]; };
  const draw = (c, w, h) => {
    W = w; H = h; c.clearRect(0, 0, w, h);
    const lineClr = cssv('--lineclr');
    // faint vector grid
    c.strokeStyle = cssv('--line'); c.lineWidth = 1;
    const s = 28;
    for (let x = s / 2; x < w; x += s) for (let y = s / 2; y < h; y += s) {
      const [ex, ey] = field(x, y), m = Math.hypot(ex, ey); if (!m) continue;
      const L = 9; c.beginPath(); c.moveTo(x - ex / m * L / 2, y - ey / m * L / 2); c.lineTo(x + ex / m * L / 2, y + ey / m * L / 2); c.stroke();
    }
    // field lines
    // Lines start on + charges (traced along E). If there is net negative charge, lines arriving
    // from infinity are also traced backwards from the − charges; those that would end on a + charge
    // duplicate a line already drawn and are skipped.
    const pos = Q.filter(q => q.q > 0), neg = Q.filter(q => q.q < 0);
    c.strokeStyle = lineClr; c.lineWidth = 1.4; c.fillStyle = lineClr;
    const n = 16, step = 3, R0 = 13;
    const trace = (sc, k, dir) => {
      const a = (k + .5) / n * 2 * Math.PI; let x = sc.x * w + R0 * Math.cos(a), y = sc.y * h + R0 * Math.sin(a);
      const pts = [[x, y]];
      for (let i = 0; i < 1400; i++) {
        let [ex, ey] = field(x, y); const m = Math.hypot(ex, ey); if (!m) break;
        // midpoint step
        const mx = x + dir * ex / m * step / 2, my = y + dir * ey / m * step / 2;
        [ex, ey] = field(mx, my); const m2 = Math.hypot(ex, ey); if (!m2) break;
        x += dir * ex / m2 * step; y += dir * ey / m2 * step; pts.push([x, y]);
        if (x < -40 || y < -40 || x > w + 40 || y > h + 40) return { pts, end: null };
        const o = Q.find(o => o !== sc && Math.sign(o.q) !== Math.sign(sc.q) && Math.hypot(x - o.x * w, y - o.y * h) < 10);
        if (o) return { pts, end: o };
      }
      return { pts, end: null };
    };
    const drawLine = (pts, k, dir) => {
      c.beginPath(); c.moveTo(...pts[0]); pts.forEach(p => c.lineTo(...p)); c.stroke();
      const j = Math.min(pts.length - 1, Math.round((70 + (k % 3) * 25) / step));
      if (j < 2 || j > pts.length - 4) return;
      const [x0, y0] = pts[j - 1], [x1, y1] = pts[j];
      const ang = Math.atan2(y1 - y0, x1 - x0) + (dir < 0 ? Math.PI : 0);
      c.save(); c.translate(x1, y1); c.rotate(ang); c.beginPath(); c.moveTo(5, 0); c.lineTo(-4, -3.5); c.lineTo(-4, 3.5); c.closePath(); c.fill(); c.restore();
    };
    for (const sc of pos) for (let k = 0; k < n; k++) drawLine(trace(sc, k, 1).pts, k, 1);
    if (neg.length > pos.length) for (const sc of neg) for (let k = 0; k < n; k++) { const r = trace(sc, k, -1); if (!r.end) drawLine(r.pts, k, -1); }
    // charges
    for (const q of Q) {
      const col = q.q > 0 ? cssv('--pos') : cssv('--neg');
      c.beginPath(); c.arc(q.x * w, q.y * h, 12, 0, 7); c.fillStyle = col; c.fill();
      c.strokeStyle = '#fff'; c.lineWidth = 2.2; c.beginPath(); c.moveTo(q.x * w - 5, q.y * h); c.lineTo(q.x * w + 5, q.y * h);
      if (q.q > 0) { c.moveTo(q.x * w, q.y * h - 5); c.lineTo(q.x * w, q.y * h + 5); } c.stroke();
    }
  };
  const redraw = setupCanvas(cv, 0.6, draw);
  let drag = null;
  const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
  const hit = (x, y) => Q.find(q => Math.hypot((q.x - x) * W, (q.y - y) * H) < 18);
  cv.onpointerdown = e => { const [x, y] = pt(e); drag = hit(x, y); if (drag) cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => { const [x, y] = pt(e); cv.style.cursor = hit(x, y) ? 'grab' : 'default'; if (!drag) return; drag.x = Math.min(.98, Math.max(.02, x)); drag.y = Math.min(.97, Math.max(.03, y)); redraw(); };
  cv.onpointerup = () => drag = null;
  cv.ondblclick = e => { const [x, y] = pt(e); const h = hit(x, y); if (h) { Q = Q.filter(q => q !== h); redraw(); } };
  el.querySelectorAll('button').forEach(b => b.onclick = () => {
    if (b.dataset.a === 'r') reset(); else if (Q.length < 8) Q.push({ x: .2 + Math.random() * .6, y: .2 + Math.random() * .6, q: b.dataset.a === '+' ? 1 : -1 });
    redraw();
  });
}

function simRC(el) {
  el.innerHTML = '<canvas></canvas><div class="simbar"></div>';
  const cv = $('canvas', el), bar = $('.simbar', el);
  let redraw = () => {};
  const sR = logSlider('R', 100, 1e6, 1e4, 'Ω', () => redraw()), sC = logSlider('C', 1e-6, 1e-3, 1e-4, 'F', () => redraw());
  const tau = document.createElement('span'); tau.className = 'val';
  bar.append(sR, sC, tau);
  redraw = setupCanvas(cv, 0.45, (c, w, h) => {
    c.clearRect(0, 0, w, h);
    const pad = { l: 44, r: 14, t: 14, b: 36 }, pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
    const t0 = sR.get() * sC.get(); const [a, b] = fmt(t0, 's'); tau.textContent = 'τ = RC = ' + a + ' ' + b;
    // time window: the next power of ten at or above 5τ, so the curve always fits and the axis reads in real units
    const T = 10 ** Math.ceil(Math.log10(5 * t0) - 1e-9);

    c.textAlign = 'right'; c.fillStyle = cssv('--muted');
    [0, .5, 1].forEach(v => { const y = pad.t + ph * (1 - v); c.fillText(v, pad.l - 6, y + 4); c.strokeStyle = cssv('--line'); c.beginPath(); c.moveTo(pad.l, y); c.lineTo(w - pad.r, y); c.stroke(); });
    c.textAlign = 'center'; for (let k = 0; k <= 5; k++) { const s = T * k / 5, [sv, su] = s >= 1 ? [String(s), 's'] : fmt(s, 's'); c.fillText(k ? sv + ' ' + su : '0', pad.l + pw * k / 5, h - pad.b + 16); }
    const curve = (f, col, dash) => { c.strokeStyle = col; c.lineWidth = 2.4; c.setLineDash(dash); c.beginPath(); for (let i = 0; i <= 300; i++) { const t = T * i / 300, x = pad.l + pw * t / T, y = pad.t + ph * (1 - f(t)); i ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke(); c.setLineDash([]); };
    curve(t => 1 - Math.exp(-t / t0), cssv('--ci'), []);
    curve(t => Math.exp(-t / t0), cssv('--es'), [6, 5]);
    if (t0 <= T) { const x = pad.l + pw * t0 / T; c.strokeStyle = cssv('--muted'); c.setLineDash([2, 4]); c.beginPath(); c.moveTo(x, pad.t); c.lineTo(x, h - pad.b); c.stroke(); c.setLineDash([]); c.fillStyle = cssv('--ink'); c.fillText('τ', x + 8, pad.t + 12); }
    c.textAlign = 'left'; c.font = '13px -apple-system,sans-serif';
    c.fillStyle = cssv('--ci'); c.fillText('— charging', w - pad.r - 170, pad.t + ph * .55);
    c.fillStyle = cssv('--es'); c.fillText('- - discharging', w - pad.r - 170, pad.t + ph * .55 + 18);
  });
}

function simRLC(el) {
  el.innerHTML = '<canvas></canvas><div class="simbar"></div>';
  const cv = $('canvas', el), bar = $('.simbar', el);
  let redraw = () => {};
  const sR = logSlider('R', 1, 1000, 20, 'Ω', () => redraw()), sL = logSlider('L', 1e-3, 1, 0.1, 'H', () => redraw()), sC = logSlider('C', 1e-8, 1e-4, 1e-5, 'F', () => redraw());
  const f0o = document.createElement('span'); f0o.className = 'val';
  bar.append(sR, sL, sC, f0o);
  redraw = setupCanvas(cv, 0.45, (c, w, h) => {
    c.clearRect(0, 0, w, h);
    const pad = { l: 44, r: 14, t: 14, b: 36 }, pw = w - pad.l - pad.r, ph = h - pad.t - pad.b;
    const R = sR.get(), L = sL.get(), C = sC.get(), f0 = 1 / (2 * Math.PI * Math.sqrt(L * C));
    const [a, b] = fmt(f0, 'Hz'); f0o.textContent = 'f₀ = ' + a + ' ' + b + ' · Q = ' + (Math.sqrt(L / C) / R).toPrecision(3);
    const lo = 1, hi = 5; // 10 Hz .. 100 kHz
    axes(c, w, h, pad, 'driving frequency (Hz, log scale)', 'I / I at f₀');
    c.textAlign = 'right'; c.fillStyle = cssv('--muted');
    [0, .5, 1].forEach(v => { const y = pad.t + ph * (1 - v); c.fillText(v, pad.l - 6, y + 4); c.strokeStyle = cssv('--line'); c.beginPath(); c.moveTo(pad.l, y); c.lineTo(w - pad.r, y); c.stroke(); });
    c.textAlign = 'center';
    for (let d = lo; d <= hi; d++) { const x = pad.l + pw * (d - lo) / (hi - lo); c.fillText(['10', '100', '1k', '10k', '100k'][d - 1], x, h - pad.b + 16); c.strokeStyle = cssv('--line'); c.beginPath(); c.moveTo(x, pad.t); c.lineTo(x, h - pad.b); c.stroke(); }
    c.strokeStyle = cssv('--in'); c.lineWidth = 2.4; c.beginPath();
    for (let i = 0; i <= 500; i++) { const lf = lo + (hi - lo) * i / 500, f = 10 ** lf, wv = 2 * Math.PI * f; const Z = Math.hypot(R, wv * L - 1 / (wv * C)); const y = pad.t + ph * (1 - R / Z), x = pad.l + pw * i / 500; i ? c.lineTo(x, y) : c.moveTo(x, y); }

    // lens
    c.strokeStyle = cssv('--mg'); c.lineWidth = 3; c.beginPath(); c.moveTo(ox, Y(1.7)); c.lineTo(ox, Y(-1.7)); c.stroke();
    const tip = (y, dir) => { c.beginPath(); c.moveTo(ox - 8, y + dir * (conv ? 8 : -8)); c.lineTo(ox, y); c.lineTo(ox + 8, y + dir * (conv ? 8 : -8)); c.stroke(); };
    tip(Y(1.7), 1); tip(Y(-1.7), -1);
    const arrow = (u, hgt, col, dash) => { c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 3; c.setLineDash(dash); c.beginPath(); c.moveTo(X(u), oy); c.lineTo(X(u), Y(hgt)); c.stroke(); c.setLineDash([]);
      const s = Math.sign(hgt) || 1; c.beginPath(); c.moveTo(X(u), Y(hgt)); c.lineTo(X(u) - 7, Y(hgt) + s * 11); c.lineTo(X(u) + 7, Y(hgt) + s * 11); c.closePath(); c.fill(); };
    // rays (object at u = -dO)
    const P = [X(-dO), Y(hO)];
    const ray = (pts, col, virt) => { c.strokeStyle = col; c.lineWidth = 1.6; c.beginPath(); c.moveTo(...pts[0]); pts.slice(1).forEach(p => c.lineTo(...p)); c.stroke();
      if (virt) { c.setLineDash([4, 4]); c.globalAlpha = .6; c.beginPath(); c.moveTo(...pts[1]); c.lineTo(...virt); c.stroke(); c.setLineDash([]); c.globalAlpha = 1; } };
    const far = (from, slope) => [w + 20, from[1] - slope * (w + 20 - from[0])];
    const imgPt = [X(di), Y(hI)];
    const virtual = di < 0;
    // 1. parallel ray, then through (or away from) far focal point
    const A1 = [ox, Y(hO)], s1 = -hO / f; ray([P, A1, far(A1, s1)], cssv('--es'), virtual ? imgPt : null);
    // 2. through centre
    const s2 = hO / dO; const A2 = [ox, oy]; ray([P, A2, far(A2, -s2)], cssv('--ci'), virtual ? imgPt : null);
    // 3. toward near focal point, exits parallel
    if (Math.abs(dO - f) > 0.05) { const yl3 = hO * f / (f - dO); const A3 = [ox, Y(yl3)]; ray([P, A3, [w + 20, Y(yl3)]], cssv('--wv'), virtual ? imgPt : null); }
    arrow(-dO, hO, cssv('--ink'), []);
    if (isFinite(di) && Math.abs(di) < 40) arrow(di, hI, cssv('--in'), virtual ? [5, 4] : []);
    const fmtd = v => (v * 10).toFixed(1) + ' cm';
    out.textContent = !isFinite(di) || Math.abs(di) > 1e3 ? 'object at the focal point: rays come out parallel, no image forms' :
      `with |f| = 10 cm: object ${fmtd(dO)} · image ${fmtd(Math.abs(di))} ${virtual ? 'same side (virtual)' : 'far side (real)'} · magnification ${m.toFixed(2)}× ${m < 0 ? 'inverted' : 'upright'}`;
  });
  let drag = false;
  cv.onpointerdown = e => { const r = cv.getBoundingClientRect(), x = e.clientX - r.left; if (Math.abs(x - (ox - dO * U)) < 24) { drag = true; cv.setPointerCapture(e.pointerId); } };
  cv.onpointermove = e => { const r = cv.getBoundingClientRect(), x = e.clientX - r.left; cv.style.cursor = Math.abs(x - (ox - dO * U)) < 24 ? 'ew-resize' : 'default'; if (!drag) return; dO = Math.min(3.8, Math.max(0.3, (ox - x) / U)); redraw(); };
  cv.onpointerup = () => drag = false;
}
Object.assign(SIMS, { standing: simStanding, ripple: simRipple, doppler: simDoppler, lens: simLens });

// ── thermo & modern sims
function simGas(el) {
  el.innerHTML = '<canvas></canvas><div class="simbar"></div>';
  const cv = $('canvas', el), bar = $('.simbar', el);
  let P = [], hits = 0, hitT = 0, pAvg = 0, redraw = () => {};
  const sT = linSlider('Temperature', 50, 600, 300, 10, 'K', () => rescale());
  const sV = linSlider('Volume', 30, 100, 100, 1, '%', () => { P.forEach(p => { if (p.x > sV.get() / 100) p.x = Math.random() * sV.get() / 100; }); });
  const sN = linSlider('Molecules', 20, 300, 120, 10, '', () => fill());
  const out = readout(); out.style.flexBasis = '100%';
  bar.append(sT, sV, sN, out);
  let curT = 300;
  const spd = T => 0.55 * Math.sqrt(T / 300); // box-widths per second (rms-ish)
  const fill = () => { const n = sN.get(); while (P.length < n) { const a = Math.random() * 2 * Math.PI, g = Math.sqrt(-2 * Math.log(Math.random() + 1e-9)) * spd(curT) / Math.SQRT2; P.push({ x: Math.random() * 0.28 + 0.01, y: Math.random() * 0.9 + 0.05, vx: g * Math.cos(a), vy: g * Math.sin(a) }); } P.length = n;
    // set this finite sample's mean v² to exactly the value for temperature T (otherwise a random sample of 20–300 molecules is ±5–20% off)
    const m2 = P.reduce((s, p) => s + p.vx * p.vx + p.vy * p.vy, 0) / n, f = spd(curT) / Math.sqrt(m2); P.forEach(p => { p.vx *= f; p.vy *= f; }); };
  const rescale = () => { const T = sT.get(), f = Math.sqrt(T / curT); P.forEach(p => { p.vx *= f; p.vy *= f; }); curT = T; };
  fill();
  redraw = setupCanvas(cv, 0.5, (c, w, h) => {
    c.clearRect(0, 0, w, h);
    const bw = sV.get() / 100, BX = w * bw, aspect = h / w;
    c.fillStyle = cssv('--soft'); c.fillRect(BX, 0, w - BX, h);
    c.fillStyle = cssv('--muted'); c.fillRect(BX - 3, 0, 6, h);
    const hot = cssv('--es'), cold = cssv('--mg'), v0 = spd(curT);
    P.forEach(p => { const s = Math.hypot(p.vx, p.vy); c.fillStyle = s > v0 * 1.15 ? hot : s < v0 * 0.7 ? cold : cssv('--ink'); c.beginPath(); c.arc(Math.min(BX - 6, Math.max(3, p.x * w)), Math.min(h - 3, Math.max(3, p.y * h)), 3, 0, 7); c.fill(); });
    const Pth = sN.get() * curT / (sV.get() / 100) / (120 * 300);
    out.textContent = `measured pressure (from wall hits, running average): ${pAvg ? pAvg.toFixed(2) : '…'} · ideal-gas prediction ∝ N·T/V: ${Pth.toFixed(2)} (both relative to the starting state) · red = fast, blue = slow`;
  });
  loop(dt => {
    const bw = sV.get() / 100, asp = cv.clientHeight / cv.clientWidth || 0.5;
    // box is 0..bw wide (in canvas widths) and 0..1 tall (in canvas heights); vy is in widths/s like vx
    let mom = 0;
    P.forEach(p => {
      p.x += p.vx * dt; p.y += p.vy * dt / asp;
      if (p.x < 0) { p.x = -p.x; p.vx = Math.abs(p.vx); mom += 2 * p.vx; }
      if (p.x > bw) { if (p.vx > 0) { mom += 2 * p.vx; p.vx = -p.vx; } p.x = Math.max(0, 2 * bw - p.x); }
      if (p.y < 0) { p.y = -p.y; p.vy = Math.abs(p.vy); mom += 2 * p.vy; }
      if (p.y > 1) { p.y = 2 - p.y; p.vy = -Math.abs(p.vy); mom += 2 * Math.abs(p.vy); }
    });
    // pressure = momentum delivered to all four walls per unit time per unit wall length (2D),
    // normalised by the value N<v²>/2A expected for the default state (120 molecules, 300 K, full box)
    hits += mom / (2 * bw + 2 * asp); hitT += dt;
    if (hitT > 0.5) { const p = hits / hitT, ref = 120 * spd(300) ** 2 / 2 / (1 * asp), v = p / ref;
      pAvg = pAvg ? pAvg + (v - pAvg) * 0.3 : v; hits = 0; hitT = 0; }
    redraw();
  });
}

function simLightClock(el) {
  el.innerHTML = '<canvas></canvas><div class="simbar"></div>';
  const cv = $('canvas', el), bar = $('.simbar', el);
  let t = 0, redraw = () => {};
  const sb = linSlider('Speed v/c', 0, 0.95, 0.6, 0.05, '', () => { t = 0; });
  const out = readout(); out.style.flexBasis = '100%';
  bar.append(sb, out);
  const T0 = 1.6; // seconds per tick for resting clock (animation time)
  redraw = setupCanvas(cv, 0.42, (c, w, h) => {
    c.clearRect(0, 0, w, h);
    const b = sb.get(), g = 1 / Math.sqrt(1 - b * b), H = h * 0.62, top = h * 0.16, bot = top + H;
    const half = w * 0.28; // resting clock in left panel
    c.strokeStyle = cssv('--line'); c.beginPath(); c.moveTo(half + 20, 8); c.lineTo(half + 20, h - 8); c.stroke();
    c.font = '12px -apple-system,sans-serif'; c.fillStyle = cssv('--muted'); c.textAlign = 'center';
    c.fillText('clock at rest', half / 2 + 10, h - 8); c.fillText('clock moving right at v (seen from rest frame)', half + 20 + (w - half - 20) / 2, h - 8);
    const mirror = (x, y) => { c.fillStyle = cssv('--mg'); c.fillRect(x - 22, y - 3, 44, 6); };
    // resting clock
    const cx = half / 2 + 10, ph0 = (t / T0) % 2, y0 = ph0 < 1 ? bot - ph0 * H : top + (ph0 - 1) * H;
    mirror(cx, top); mirror(cx, bot);
    c.fillStyle = cssv('--wv'); c.beginPath(); c.arc(cx, y0, 6, 0, 7); c.fill();
    // moving clock (rest-frame view): light speed c ≡ H/T0 px/s; each mirror-to-mirror trip takes γ·T0,
    // during which the clock moves v·γ·T0 sideways, so the light runs along a diagonal of length c·γ·T0.
    const cpx = H / T0, Tm = g * T0, pL = half + 20, span = w - pL, xs = 40;
    const xpos = pL + ((xs + b * cpx * t) % span);
    const ph = (t / Tm) % 2, ym = ph < 1 ? bot - ph * H : top + (ph - 1) * H;
    // trail: the light's path over the last round trip (capped so it never spans more than 90% of the panel), ending at the photon
    const yAt = tt => { const q = ((tt / Tm) % 2 + 2) % 2; return q < 1 ? bot - q * H : top + (q - 1) * H; };
    const t1 = Math.max(0, t - Math.min(2 * Tm, b > 0 ? 0.9 * span / (b * cpx) : Infinity)), knots = [t1];
    for (let k = Math.ceil(t1 / Tm); k * Tm < t; k++) if (k * Tm > t1) knots.push(k * Tm);
    knots.push(t);
    c.save(); c.beginPath(); c.rect(pL + 1, 0, span, h); c.clip();
    // draw three copies one panel-width apart so the clock and its trail wrap seamlessly
    for (const off of [-span, 0, span]) {
      const X = xpos + off;
      c.strokeStyle = cssv('--wv'); c.globalAlpha = .5; c.lineWidth = 1.5; c.beginPath();
      knots.forEach((tt, i) => { const px = X - b * cpx * (t - tt), py = yAt(tt); i ? c.lineTo(px, py) : c.moveTo(px, py); });
      c.stroke(); c.globalAlpha = 1;
      mirror(X, top); mirror(X, bot);
      c.fillStyle = cssv('--wv'); c.beginPath(); c.arc(X, ym, 6, 0, 7); c.fill();
    }
    c.restore();
    const ticks0 = Math.floor(t / (2 * T0)), ticksM = Math.floor(t / (2 * Tm));
    c.fillStyle = cssv('--ink'); c.font = '600 13px -apple-system,sans-serif';
    c.fillText(`ticks: ${ticks0}`, cx, 18); c.fillText(`ticks: ${ticksM}`, pL + span / 2, 18);
    out.textContent = `γ = ${g.toFixed(3)} · the moving clock's light travels a longer diagonal at the same speed, so each tick takes ${g.toFixed(2)}× as long`;
  });
  loop(dt => { t += dt; redraw(); });
}

function simHalfLife(el) {
  el.innerHTML = '<canvas></canvas><div class="simbar"></div>';
  const cv = $('canvas', el), bar = $('.simbar', el);
  const G = 20, N0 = G * G; let alive, hist, t, redraw = () => {};
  const reset = () => { alive = new Array(N0).fill(true); hist = [[0, N0]]; t = 0; };
  const sh = linSlider('Half-life', 1, 8, 3, 0.5, 's', () => reset());
  const rb = document.createElement('button'); rb.textContent = 'Restart'; rb.onclick = () => reset();
  const out = readout();
  bar.append(sh, rb, out); reset();
  redraw = setupCanvas(cv, 0.45, (c, w, h) => {
    c.clearRect(0, 0, w, h);
    const gs = Math.min(h - 20, w * 0.42), cell = gs / G, gx = 10, gy = (h - gs) / 2;
    for (let i = 0; i < N0; i++) { c.fillStyle = alive[i] ? cssv('--ci') : cssv('--line'); c.fillRect(gx + (i % G) * cell + 1, gy + Math.floor(i / G) * cell + 1, cell - 2, cell - 2); }
    // graph
    const L = gx + gs + 50, Rr = w - 12, T = h - 30, B = 16, Tmax = sh.get() * 5;
    const X = s => L + (Rr - L) * s / Tmax, Y = n => B + (T - B) * (1 - n / N0);
    axes(c, w, h, { l: L, r: w - Rr, t: B, b: h - T }, 'time (s)', '');
    c.fillStyle = cssv('--muted'); c.font = '11px -apple-system,sans-serif'; c.textAlign = 'center';
    for (let k = 0; k <= 5; k++) { c.fillText(k === 0 ? '0' : k + 'T½', X(k * sh.get()), T + 14); c.strokeStyle = cssv('--line'); c.beginPath(); c.moveTo(X(k * sh.get()), B); c.lineTo(X(k * sh.get()), T); c.stroke(); }
    c.textAlign = 'right'; [1, .5, .25, .125].forEach(f => c.fillText(N0 * f, L - 5, Y(N0 * f) + 4)); c.textAlign = 'center';
    c.save(); c.translate(L - 34, (B + T) / 2); c.rotate(-Math.PI / 2); c.fillText('undecayed nuclei', 0, 0); c.restore();
    c.strokeStyle = cssv('--muted'); c.setLineDash([4, 4]); c.lineWidth = 1.5; c.beginPath();
    for (let i = 0; i <= 100; i++) { const s = Tmax * i / 100, y = Y(N0 * 0.5 ** (s / sh.get())); i ? c.lineTo(X(s), y) : c.moveTo(X(s), y); } c.stroke(); c.setLineDash([]);
    c.strokeStyle = cssv('--ci'); c.lineWidth = 2.4; c.beginPath(); hist.forEach(([s, n], i) => i ? c.lineTo(X(s), Y(n)) : c.moveTo(X(s), Y(n))); c.stroke();
    const n = hist[hist.length - 1][1];
    out.textContent = `undecayed ${n} of ${N0} · expected N₀(½)^(t/T½) = ${Math.round(N0 * 0.5 ** (t / sh.get()))} (dashed curve)`;
  });
  loop(dt => {
    if (t < sh.get() * 5) {
      t += dt; const p = 1 - Math.pow(0.5, dt / sh.get());
      for (let i = 0; i < N0; i++) if (alive[i] && Math.random() < p) alive[i] = false;
      hist.push([t, alive.filter(Boolean).length]);
    }
    redraw();
  });
}
Object.assign(SIMS, { gas: simGas, lightclock: simLightClock, halflife: simHalfLife });
