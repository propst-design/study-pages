ncoding=\"application/x-tex\">a = g\\sin\\theta/(1+\\beta)</annotation></semantics></math></span>.</p>","related":["inertia","energy","incline"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mtext>cm</mtext></msub></mrow><annotation encoding=\"application/x-tex\">v_{\\text{cm}}</annotation></semantics></math></span>","speed of the centre of mass","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>","angular velocity of the spin","rad/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","radius of the rolling object","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K</mi></mrow><annotation encoding=\"application/x-tex\">K</annotation></semantics></math></span>","total kinetic energy, translational plus rotational","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span>","mass of the rolling object","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","forward speed of the centre (same as <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mtext>cm</mtext></msub></mrow><annotation encoding=\"application/x-tex\">v_{\\text{cm}}</annotation></semantics></math></span>)","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","moment of inertia about the centre","kg·m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">g</annotation></semantics></math></span>","gravitational acceleration ≈ 9.81 m/s²","m/s²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span>","height descended from rest","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>β</mi></mrow><annotation encoding=\"application/x-tex\">\\beta</annotation></semantics></math></span>","shape factor in <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mo>=</mo><mi>β</mi><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">I = \\beta M R^2</annotation></semantics></math></span> (1 hoop, ½ cylinder, ⅖ sphere)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>","acceleration down the slope","m/s²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","angle of the slope above horizontal","°"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>β</mi></mrow><annotation encoding=\"application/x-tex\">\\beta</annotation></semantics></math></span>","beta","BAY-tuh","a shape factor: the moment of inertia divided by <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">MR^2</annotation></semantics></math></span> (1 for a hoop, ½ for a solid cylinder, ⅖ for a solid sphere)."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","theta","THAY-tuh","the angle of the slope."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>","omega","oh-MAY-guh","angular velocity of the spinning object, in rad/s."]],"calc":{"title":"Race down a ramp","inputs":[{"k":"h","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span>","unit":"m","d":"2"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>sliding (no friction)</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{sliding (no friction)}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>solid sphere</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{solid sphere}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>solid cylinder</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{solid cylinder}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>hoop</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{hoop}</annotation></semantics></math></span>"],"outUnits":["m/s","m/s","m/s","m/s"]}},{"id":"shm","group":"os","title":"Simple Harmonic Motion","blurb":"Anything pulled back in proportion to how far it is displaced oscillates as a sine wave.","body":"\n<p>A mass on a spring feels a restoring force proportional to its displacement <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span> from equilibrium, pointing back toward equilibrium (Hooke's law, with spring constant <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>):</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>F</mi><mo>=</mo><mo>−</mo><mi>k</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">F = -kx</annotation></semantics></math></span></div>\n<p>Combining this with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi><mo>=</mo><mi>m</mi><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">F = ma</annotation></semantics></math></span> gives an equation whose solution is a smooth sinusoidal oscillation:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>x</mi><mo stretchy=\"false\">(</mo><mi>t</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mi>A</mi><mi>cos</mi><mo>⁡</mo><mo stretchy=\"false\">(</mo><mi>ω</mi><mi>t</mi><mo>+</mo><mi>ϕ</mi><mo stretchy=\"false\">)</mo><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>ω</mi><mo>=</mo><msqrt><mfrac><mi>k</mi><mi>m</mi></mfrac></msqrt><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mi>m</mi><mi>k</mi></mfrac></msqrt></mrow><annotation encoding=\"application/x-tex\">x(t) = A\\cos(\\omega t + \\phi), \\qquad \\omega = \\sqrt{\\frac{k}{m}}, \\qquad T = 2\\pi\\sqrt{\\frac{m}{k}}</annotation></semantics></math></span></div>\n<p>Here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span> is the amplitude (the largest displacement), <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span> the angular frequency and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ϕ</mi></mrow><annotation encoding=\"application/x-tex\">\\phi</annotation></semantics></math></span> a phase set by how the motion starts. The period doesn't depend on the amplitude. A stiffer spring or lighter mass oscillates faster.</p>\n<p>Energy sloshes between the spring and the motion, and the total stays fixed:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>E</mi><mo>=</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi>k</mi><msup><mi>A</mi><mn>2</mn></msup><mo separator=\"true\">,</mo><mspace width=\"2em\"/><msub><mi>v</mi><mi>max</mi><mo>⁡</mo></msub><mo>=</mo><mi>A</mi><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">E = \\tfrac12 k A^2, \\qquad v_{\\max} = A\\omega</annotation></semantics></math></span></div>\n<p>Many systems behave like this for small displacements: pendulums, vibrating molecules, guitar strings, and the <a href=\"#/rlc\">charge in an LC circuit</a>. That's why simple harmonic motion is one of the most useful models in physics.</p>","related":["pendulum","energy","rlc","standing"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi></mrow><annotation encoding=\"application/x-tex\">F</annotation></semantics></math></span>","restoring force of the spring","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>","spring constant (stiffness)","N/m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>","displacement from equilibrium","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","time","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span>","amplitude: the largest displacement","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>","angular frequency, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mrow><mi>k</mi><mi mathvariant=\"normal\">/</mi><mi>m</mi></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">\\sqrt{k/m}</annotation></semantics></math></span>","rad/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ϕ</mi></mrow><annotation encoding=\"application/x-tex\">\\phi</annotation></semantics></math></span>","phase constant, set by how the motion starts","rad"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","oscillating mass","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","period: time for one full oscillation","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","circle constant ≈ 3.14159",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi></mrow><annotation encoding=\"application/x-tex\">E</annotation></semantics></math></span>","total mechanical energy of the oscillator","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>max</mi><mo>⁡</mo></msub></mrow><annotation encoding=\"application/x-tex\">v_{\\max}</annotation></semantics></math></span>","maximum speed, reached passing through equilibrium","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>","acceleration of the mass","m/s²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","frequency: oscillations per second, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mi mathvariant=\"normal\">/</mi><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">1/T</annotation></semantics></math></span>","Hz"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","pi","pie","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span> (a circumference divided by its diameter). It appears wherever circles, rotation or spreading in all directions are involved."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ϕ</mi></mrow><annotation encoding=\"application/x-tex\">\\phi</annotation></semantics></math></span>","phi","fie","phase constant: where in its cycle the motion is at <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">t = 0</annotation></semantics></math></span>."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>","omega","oh-MAY-guh","angular frequency, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">2\\pi</annotation></semantics></math></span> times the frequency, in rad/s."]],"calc":{"title":"Mass on a spring","inputs":[{"k":"m","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","unit":"kg","d":"0.5"},{"k":"k","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>","unit":"N/m","d":"200"},{"k":"A","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span>","unit":"m","d":"0.05"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>max</mi><mo>⁡</mo></msub></mrow><annotation encoding=\"application/x-tex\">v_{\\max}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi></mrow><annotation encoding=\"application/x-tex\">E</annotation></semantics></math></span>"],"outUnits":["rad/s","s","Hz","m/s","J"]}},{"id":"pendulum","group":"os","title":"Pendulums","blurb":"A swinging weight is nearly a perfect clock, as long as the swing is small.","body":"\n<p>A simple pendulum is a weight on a light string of length <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>. Gravity pulls it back toward the bottom with a force <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><mi>g</mi><mi>sin</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">mg\\sin\\theta</annotation></semantics></math></span>. For small angles, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo>≈</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\sin\\theta\\approx\\theta</annotation></semantics></math></span> (in radians) and the motion is simple harmonic, with period</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>T</mi><mo>≈</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mi>L</mi><mi>g</mi></mfrac></msqrt></mrow><annotation encoding=\"application/x-tex\">T \\approx 2\\pi\\sqrt{\\frac{L}{g}}</annotation></semantics></math></span></div>\n<p>Neither the mass nor the amplitude appears. This is what made pendulum clocks so accurate, and Galileo is said to have noticed it watching a swinging lamp.</p>\n<p>For larger swings the true period is a little longer than the small-angle formula predicts. A good correction, with the amplitude <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_0</annotation></semantics></math></span> in radians, is</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>T</mi><mo>≈</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><mi>L</mi><mi>g</mi></mfrac></msqrt><mrow><mo fence=\"true\">(</mo><mn>1</mn><mo>+</mo><mfrac><msubsup><mi>θ</mi><mn>0</mn><mn>2</mn></msubsup><mn>16</mn></mfrac><mo fence=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">T \\approx 2\\pi\\sqrt{\\frac{L}{g}}\\left(1 + \\frac{\\theta_0^2}{16}\\right)</annotation></semantics></math></span></div>\n<p>At 20° the error is under 1%; at 90° the true period is about 18% longer. The simulator below integrates the full equation so you can compare.</p>\n<p>A <b>physical pendulum</b> (any rigid object swinging about a pivot at distance <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span> from its centre of mass) has <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mrow><mi>I</mi><mi mathvariant=\"normal\">/</mi><mo stretchy=\"false\">(</mo><mi>m</mi><mi>g</mi><mi>d</mi><mo stretchy=\"false\">)</mo></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">T = 2\\pi\\sqrt{I/(m g d)}</annotation></semantics></math></span> for small swings, where <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span> is its moment of inertia about the pivot.</p>\n<div class=\"sim\" data-sim=\"pendulum\"></div>","related":["shm","energy","gravity"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","period: time for one full swing back and forth","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","circle constant ≈ 3.14159",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","length of the string, pivot to the weight","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">g</annotation></semantics></math></span>","gravitational acceleration ≈ 9.81 m/s² on Earth","m/s²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_{0}</annotation></semantics></math></span>","amplitude: largest swing angle (radians in the correction formula)","°"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","mass of the swinging object","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","angle of the string from vertical (radians in <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo>≈</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\sin\\theta\\approx\\theta</annotation></semantics></math></span>)","rad"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","distance from the pivot to the centre of mass of a physical pendulum","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","moment of inertia of a physical pendulum about its pivot","kg·m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mtext>small-angle</mtext></msub></mrow><annotation encoding=\"application/x-tex\">T_{\\text{small-angle}}</annotation></semantics></math></span>","period from the small-angle formula <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>π</mi><msqrt><mrow><mi>L</mi><mi mathvariant=\"normal\">/</mi><mi>g</mi></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">2\\pi\\sqrt{L/g}</annotation></semantics></math></span>","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mtext>exact</mtext></msub></mrow><annotation encoding=\"application/x-tex\">T_{\\text{exact}}</annotation></semantics></math></span>","true period at the given amplitude","s"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","theta","THAY-tuh","the swing angle from vertical; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_0</annotation></semantics></math></span> is the release angle (in radians in formulas)."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","pi","pie","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span> (a circumference divided by its diameter). It appears wherever circles, rotation or spreading in all directions are involved."]],"calc":{"title":"Pendulum period","inputs":[{"k":"L","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","unit":"m","d":"1"},{"k":"g","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">g</annotation></semantics></math></span>","unit":"m/s²","d":"9.81"},{"k":"th","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_0</annotation></semantics></math></span>","unit":"°","d":"10"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mtext>small-angle</mtext></msub></mrow><annotation encoding=\"application/x-tex\">T_{\\text{small-angle}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mtext>exact</mtext></msub></mrow><annotation encoding=\"application/x-tex\">T_{\\text{exact}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>difference</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{difference}</annotation></semantics></math></span>"],"outUnits":["s","s","%"]}},{"id":"gravity","group":"os","title":"Universal Gravitation","blurb":"Every mass attracts every other mass with an inverse-square force.","body":"\n<p>Newton realised that the force making an apple fall is the same one holding the Moon in orbit. Any two masses <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">m_1</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">m_2</annotation></semantics></math></span>, a distance <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span> apart, attract with a force along the line between them:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>F</mi><mo>=</mo><mfrac><mrow><mi>G</mi><msub><mi>m</mi><mn>1</mn></msub><msub><mi>m</mi><mn>2</mn></msub></mrow><msup><mi>r</mi><mn>2</mn></msup></mfrac><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>G</mi><mo>=</mo><mn>6.674</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>11</mn></mrow></msup><mtext> N</mtext><mo lspace=\"0em\" rspace=\"0em\">⋅</mo><msup><mtext>m</mtext><mn>2</mn></msup><mi mathvariant=\"normal\">/</mi><msup><mtext>kg</mtext><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">F = \\frac{G m_1 m_2}{r^2}, \\qquad G = 6.674\\times10^{-11}\\ \\text{N}{\\cdot}\\text{m}^2/\\text{kg}^2</annotation></semantics></math></span></div>\n<p><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>G</mi></mrow><annotation encoding=\"application/x-tex\">G</annotation></semantics></math></span> is tiny, so gravity between everyday objects is imperceptible; it only matters when at least one mass is enormous. At the surface of a planet of mass <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span> and radius <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span> this gives <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi><mo>=</mo><mi>G</mi><mi>M</mi><mi mathvariant=\"normal\">/</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">g = GM/R^2</annotation></semantics></math></span>, about <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>9.81</mn><mtext> </mtext><msup><mtext>m/s</mtext><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">9.81\\ \\text{m/s}^2</annotation></semantics></math></span> on Earth and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1.62</mn><mtext> </mtext><msup><mtext>m/s</mtext><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">1.62\\ \\text{m/s}^2</annotation></semantics></math></span> on the Moon.</p>\n<p>Gravitational potential energy, taking zero at infinite separation, is negative:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>U</mi><mo>=</mo><mo>−</mo><mfrac><mrow><mi>G</mi><msub><mi>m</mi><mn>1</mn></msub><msub><mi>m</mi><mn>2</mn></msub></mrow><mi>r</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">U = -\\frac{G m_1 m_2}{r}</annotation></semantics></math></span></div>\n<p>Near the surface, changes in this reduce to the familiar <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><mi>g</mi><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">mgh</annotation></semantics></math></span>. The form of the law matches <a href=\"#/coulomb\">Coulomb's law</a>, but gravity is always attractive and vastly weaker.</p>","related":["orbits","pendulum","coulomb"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi></mrow><annotation encoding=\"application/x-tex\">F</annotation></semantics></math></span>","gravitational attraction between the two masses","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>G</mi></mrow><annotation encoding=\"application/x-tex\">G</annotation></semantics></math></span>","gravitational constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6.674</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>11</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">6.674\\times10^{-11}</annotation></semantics></math></span> N·m²/kg²","N·m²/kg²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">m_{1}</annotation></semantics></math></span>","first mass","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">m_{2}</annotation></semantics></math></span>","second mass","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","distance between the centres of the two masses","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>U</mi></mrow><annotation encoding=\"application/x-tex\">U</annotation></semantics></math></span>","gravitational potential energy, zero at infinite separation","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span>","mass of the planet or moon","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","radius of the planet or moon","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">g</annotation></semantics></math></span>","gravitational acceleration at the surface, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>G</mi><mi>M</mi><mi mathvariant=\"normal\">/</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">GM/R^2</annotation></semantics></math></span>","m/s²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","mass of an object at the surface","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span>","height above the surface","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>g</mi><mtext>Earth</mtext></msub></mrow><annotation encoding=\"application/x-tex\">g_{\\text{Earth}}</annotation></semantics></math></span>","Earth’s surface gravity ≈ 9.81 m/s²","m/s²"]],"greek":[],"calc":{"title":"Surface gravity of a body","inputs":[{"k":"M","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span>","unit":"kg","d":"5.972e24"},{"k":"Rr","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","unit":"m","d":"6.371e6"},{"k":"m","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","unit":"kg","d":"70"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">g</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>weight</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{weight}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi><mi mathvariant=\"normal\">/</mi><msub><mi>g</mi><mtext>Earth</mtext></msub></mrow><annotation encoding=\"application/x-tex\">g / g_{\\text{Earth}}</annotation></semantics></math></span>"],"outUnits":["m/s²","N","×"]}},{"id":"orbits","group":"os","title":"Orbits & Escape","blurb":"Orbiting is falling while moving sideways fast enough to keep missing the ground.","body":"\n<p>For a circular orbit, gravity supplies exactly the centripetal force. For a small body of mass <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span> orbiting a planet of mass <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span> at distance <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span> from its centre, setting <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>G</mi><mi>M</mi><mi>m</mi><mi mathvariant=\"normal\">/</mi><msup><mi>r</mi><mn>2</mn></msup><mo>=</mo><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup><mi mathvariant=\"normal\">/</mi><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">GMm/r^2 = mv^2/r</annotation></semantics></math></span> gives the orbital speed and period:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>v</mi><mo>=</mo><msqrt><mfrac><mrow><mi>G</mi><mi>M</mi></mrow><mi>r</mi></mfrac></msqrt><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mfrac><msup><mi>r</mi><mn>3</mn></msup><mrow><mi>G</mi><mi>M</mi></mrow></mfrac></msqrt></mrow><annotation encoding=\"application/x-tex\">v = \\sqrt{\\frac{GM}{r}}, \\qquad T = 2\\pi\\sqrt{\\frac{r^3}{GM}}</annotation></semantics></math></span></div>\n<p>The second result is Kepler's third law: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>T</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">T^2</annotation></semantics></math></span> is proportional to <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>r</mi><mn>3</mn></msup></mrow><annotation encoding=\"application/x-tex\">r^3</annotation></semantics></math></span>. Higher orbits are slower and take much longer. The International Space Station, about 400 km up, circles Earth in roughly 92 minutes; a geostationary satellite, about 35,800 km up, takes exactly one sidereal day.</p>\n<p><b>Escape.</b> To leave a planet entirely, a projectile's kinetic energy must at least cancel its negative gravitational potential energy, so that it can reach infinity with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K</mi><mo>+</mo><mi>U</mi><mo>≥</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">K + U \\ge 0</annotation></semantics></math></span>:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>v</mi><mtext>esc</mtext></msub><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi>G</mi><mi>M</mi></mrow><mi>r</mi></mfrac></msqrt><mo>=</mo><msqrt><mn>2</mn></msqrt><mtext> </mtext><msub><mi>v</mi><mtext>orbit</mtext></msub></mrow><annotation encoding=\"application/x-tex\">v_{\\text{esc}} = \\sqrt{\\frac{2GM}{r}} = \\sqrt2\\,v_{\\text{orbit}}</annotation></semantics></math></span></div>\n<p>From Earth's surface that's about 11.2 km/s. Real orbits are generally ellipses, with the planet at one focus (Kepler's first law), and the orbiting body sweeps out equal areas in equal times (his second law), a consequence of <a href=\"#/angmom\">conserved angular momentum</a>.</p>","related":["gravity","circular","angmom","energy"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","orbital speed for a circular orbit","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>G</mi></mrow><annotation encoding=\"application/x-tex\">G</annotation></semantics></math></span>","gravitational constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6.674</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>11</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">6.674\\times10^{-11}</annotation></semantics></math></span> N·m²/kg²","N·m²/kg²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span>","mass of the planet being orbited","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","orbit radius, measured from the planet’s centre","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","orbital period (calculator shows minutes)","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","circle constant ≈ 3.14159",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mtext>esc</mtext></msub></mrow><annotation encoding=\"application/x-tex\">v_{\\text{esc}}</annotation></semantics></math></span>","escape speed: minimum launch speed to reach infinity","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mtext>orbit</mtext></msub></mrow><annotation encoding=\"application/x-tex\">v_{\\text{orbit}}</annotation></semantics></math></span>","circular orbital speed at distance <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","mass of the orbiting body","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K</mi></mrow><annotation encoding=\"application/x-tex\">K</annotation></semantics></math></span>","kinetic energy of the orbiting body","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>U</mi></mrow><annotation encoding=\"application/x-tex\">U</annotation></semantics></math></span>","gravitational potential energy (negative, zero at infinity)","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mtext>planet</mtext></msub></mrow><annotation encoding=\"application/x-tex\">R_{\\text{planet}}</annotation></semantics></math></span>","radius of the planet; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span> is this plus the altitude","m"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","pi","pie","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span> (a circumference divided by its diameter). It appears wherever circles, rotation or spreading in all directions are involved."]],"calc":{"title":"Orbit around Earth","inputs":[{"k":"M","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span>","unit":"kg","d":"5.972e24"},{"k":"Rp","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mtext>planet</mtext></msub></mrow><annotation encoding=\"application/x-tex\">R_{\\text{planet}}</annotation></semantics></math></span>","unit":"m","d":"6.371e6"},{"k":"h","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>altitude</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{altitude}</annotation></semantics></math></span>","unit":"m","d":"4.2e5"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mtext>orbit</mtext></msub></mrow><annotation encoding=\"application/x-tex\">v_{\\text{orbit}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mtext>esc</mtext></msub><mtext> (at that altitude)</mtext></mrow><annotation encoding=\"application/x-tex\">v_{\\text{esc}}\\ \\text{(at that altitude)}</annotation></semantics></math></span>"],"outUnits":["m/s","min","m/s"]}},{"id":"waves","group":"wa","title":"What Is a Wave?","blurb":"A disturbance that carries energy from place to place without carrying matter along.","body":"\n<p>Drop a pebble in a pond and ripples spread outward, but the water itself mostly bobs up and down in place. A wave moves a <b>pattern</b> and its energy, not the medium.</p>\n<p>In a <b>transverse</b> wave the medium moves perpendicular to the direction of travel (a shaken rope; for light it is the electric and magnetic fields that oscillate, with no medium needed). In a <b>longitudinal</b> wave it moves back and forth along the direction of travel (sound, a pushed Slinky). Water waves are a mix of both.</p>\n<p>A repeating wave has a <b>wavelength</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span> (distance between neighbouring crests), a <b>frequency</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span> (crests passing per second) and a <b>period</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">/</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">T = 1/f</annotation></semantics></math></span>. One wavelength passes in one period, which gives the most-used equation in all of wave physics:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>v</mi><mo>=</mo><mi>f</mi><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">v = f\\lambda</annotation></semantics></math></span></div>\n<p>The speed depends on the medium, not the source. Shaking a rope faster raises <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span> and shortens <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>; the speed stays the same. A sinusoidal wave of amplitude <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span> (the maximum displacement) travelling in the <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>+</mo><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">+x</annotation></semantics></math></span> direction can be written</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>y</mi><mo stretchy=\"false\">(</mo><mi>x</mi><mo separator=\"true\">,</mo><mi>t</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mi>A</mi><mi>sin</mi><mo>⁡</mo><mo stretchy=\"false\">(</mo><mi>k</mi><mi>x</mi><mo>−</mo><mi>ω</mi><mi>t</mi><mo stretchy=\"false\">)</mo><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>k</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi></mrow><mi>λ</mi></mfrac><mo separator=\"true\">,</mo><mspace width=\"1em\"/><mi>ω</mi><mo>=</mo><mn>2</mn><mi>π</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">y(x,t) = A\\sin(kx - \\omega t), \\qquad k = \\frac{2\\pi}{\\lambda},\\quad \\omega = 2\\pi f</annotation></semantics></math></span></div>\n<p>where <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span> is the <b>wave number</b> (radians of phase per metre) and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span> the <b>angular frequency</b> (radians per second). Dividing gives the speed back: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>=</mo><mi>ω</mi><mi mathvariant=\"normal\">/</mi><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">v = \\omega/k</annotation></semantics></math></span>.</p>","related":["wavestring","superposition","sound","emwaves"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","wave speed: how fast the pattern travels through the medium","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","frequency: crests passing a point per second","Hz"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","wavelength: distance between neighbouring crests","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi></mrow><annotation encoding=\"application/x-tex\">y</annotation></semantics></math></span>","displacement of the medium at position <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span> and time <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>","position along the direction of travel","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","time","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span>","amplitude: maximum displacement from rest","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>","wave number <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>p</mi><mi>i</mi><mi mathvariant=\"normal\">/</mi><mi>l</mi><mi>a</mi><mi>m</mi><mi>b</mi><mi>d</mi><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">2pi/lambda</annotation></semantics></math></span>: radians of phase per metre","rad/m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>","angular frequency <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>p</mi><mi>i</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">2pi f</annotation></semantics></math></span>: radians of phase per second","rad/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","circle constant ≈ 3.14159",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","period: time for one full cycle, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mi mathvariant=\"normal\">/</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">1/f</annotation></semantics></math></span>","s"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","lambda","LAM-duh","wavelength: the distance between neighbouring crests, in metres."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","pi","pie","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span> (a circumference divided by its diameter). It appears wherever circles, rotation or spreading in all directions are involved."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>","omega","oh-MAY-guh","angular frequency, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>π</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">2\\pi f</annotation></semantics></math></span>, in rad/s."]],"calc":{"title":"Speed, frequency, wavelength","inputs":[{"k":"f","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","unit":"Hz","d":"440"},{"k":"v","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","unit":"m/s","d":"343"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>"],"outUnits":["m","s","rad/m","rad/s"]}},{"id":"wavestring","group":"wa","title":"Waves on a String","blurb":"Tension speeds a wave up; mass slows it down.","body":"\n<p>A pulse on a stretched string travels at a speed set by just two things: the tension <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mi>T</mi></msub></mrow><annotation encoding=\"application/x-tex\">F_T</annotation></semantics></math></span> pulling the string tight, and the string's mass per unit length <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math></span>:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>v</mi><mo>=</mo><msqrt><mfrac><msub><mi>F</mi><mi>T</mi></msub><mi>μ</mi></mfrac></msqrt></mrow><annotation encoding=\"application/x-tex\">v = \\sqrt{\\frac{F_T}{\\mu}}</annotation></semantics></math></span></div>\n<p>Tighter strings carry waves faster; heavier strings carry them slower. This is why a guitar's thick bass strings sound lower, and why tightening a tuning peg raises the pitch.</p>\n<p>A sinusoidal wave of amplitude <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span> and angular frequency <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mo>=</mo><mn>2</mn><mi>π</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">\\omega = 2\\pi f</annotation></semantics></math></span> carries energy along the string at an average rate</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>P</mi><mtext>avg</mtext></msub><mo>=</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi>μ</mi><mtext> </mtext><mi>v</mi><mtext> </mtext><msup><mi>ω</mi><mn>2</mn></msup><msup><mi>A</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">P_{\\text{avg}} = \\tfrac12 \\mu\\, v\\, \\omega^2 A^2</annotation></semantics></math></span></div>\n<p>Power goes as the square of both amplitude and frequency. Doubling the amplitude quadruples the energy delivered.</p>\n<p>When a wave reaches the end of the string it reflects. At a fixed end the reflected pulse comes back upside down; at a free end it comes back the same way up. Where a light string joins a heavy one, part of the wave is transmitted and part is reflected (inverted, as if from a partly fixed end); going from heavy to light, the reflected part stays upright.</p>","related":["waves","standing","superposition"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","speed of waves along the string","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mi>T</mi></msub></mrow><annotation encoding=\"application/x-tex\">F_{T}</annotation></semantics></math></span>","tension pulling the string tight","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math></span>","linear mass density: string mass per unit length","kg/m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mtext>avg</mtext></msub></mrow><annotation encoding=\"application/x-tex\">P_{\\text{avg}}</annotation></semantics></math></span>","average power (energy per second) carried along the string","W"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>","angular frequency of the wave, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>p</mi><mi>i</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">2pi f</annotation></semantics></math></span>","rad/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span>","amplitude: maximum sideways displacement of the string","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","circle constant ≈ 3.14159",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","frequency of the wave","Hz"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","wavelength on the string, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mi mathvariant=\"normal\">/</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">v/f</annotation></semantics></math></span>","m"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","lambda","LAM-duh","wavelength."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math></span>","mu","myoo","linear density: the string's mass per metre of length, in kg/m."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","pi","pie","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span> (a circumference divided by its diameter). It appears wherever circles, rotation or spreading in all directions are involved."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>","omega","oh-MAY-guh","angular frequency, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>π</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">2\\pi f</annotation></semantics></math></span>."]],"calc":{"title":"String wave speed","inputs":[{"k":"F","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mi>T</mi></msub></mrow><annotation encoding=\"application/x-tex\">F_T</annotation></semantics></math></span>","unit":"N","d":"70"},{"k":"mu","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math></span>","unit":"kg/m","d":"0.0012"},{"k":"f","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","unit":"Hz","d":"196"},{"k":"A","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span>","unit":"m","d":"0.002"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mtext>avg</mtext></msub></mrow><annotation encoding=\"application/x-tex\">P_{\\text{avg}}</annotation></semantics></math></span>"],"outUnits":["m/s","m","W"]}},{"id":"superposition","group":"wa","title":"Superposition & Interference","blurb":"Where waves overlap, their displacements simply add.","body":"\n<p>Two waves can pass right through each other. Where they overlap, the total displacement is just the sum of the two:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>y</mi><mo>=</mo><msub><mi>y</mi><mn>1</mn></msub><mo>+</mo><msub><mi>y</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">y = y_1 + y_2</annotation></semantics></math></span></div>\n<p>When crests meet crests the waves reinforce (<b>constructive interference</b>); when crests meet troughs they cancel (<b>destructive interference</b>). For two sources vibrating in step, which happens depends on the <b>path difference</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>r</mi><mo>=</mo><mi mathvariant=\"normal\">∣</mi><msub><mi>r</mi><mn>2</mn></msub><mo>−</mo><msub><mi>r</mi><mn>1</mn></msub><mi mathvariant=\"normal\">∣</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta r = |r_2 - r_1|</annotation></semantics></math></span>, the difference in the distances <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">r_1</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">r_2</annotation></semantics></math></span> from each source to the point:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>r</mi><mo>=</mo><mi>m</mi><mi>λ</mi><mtext>  (constructive)</mtext><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi mathvariant=\"normal\">Δ</mi><mi>r</mi><mo>=</mo><mrow><mo fence=\"true\">(</mo><mi>m</mi><mo>+</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mo fence=\"true\">)</mo></mrow><mi>λ</mi><mtext>  (destructive)</mtext></mrow><annotation encoding=\"application/x-tex\">\\Delta r = m\\lambda\\ \\ \\text{(constructive)}, \\qquad \\Delta r = \\left(m + \\tfrac12\\right)\\lambda\\ \\ \\text{(destructive)}</annotation></semantics></math></span></div>\n<p>with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><mo>=</mo><mn>0</mn><mo separator=\"true\">,</mo><mn>1</mn><mo separator=\"true\">,</mo><mn>2</mn><mo separator=\"true\">,</mo><mo>…</mo></mrow><annotation encoding=\"application/x-tex\">m = 0, 1, 2, \\ldots</annotation></semantics></math></span> This simple rule explains standing waves, beats, the colours of soap bubbles, noise-cancelling headphones and the bright and dark bands in the <a href=\"#/doubleslit\">double-slit experiment</a>.</p>\n<p>Two speakers playing the same tone produce a pattern of loud and quiet spots across a room. The simulator below shows the pattern from two point sources; bright regions are where the waves add up.</p>\n<div class=\"sim\" data-sim=\"ripple\"></div>","related":["waves","standing","beats","doubleslit","thinfilm"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi></mrow><annotation encoding=\"application/x-tex\">y</annotation></semantics></math></span>","total displacement where the two waves overlap","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>y</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">y_{1}</annotation></semantics></math></span>","displacement due to the first wave alone","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>y</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">y_{2}</annotation></semantics></math></span>","displacement due to the second wave alone","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","\"change/difference in\"; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>D</mi><mi>e</mi><mi>l</mi><mi>t</mi><mi>a</mi><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">Delta r</annotation></semantics></math></span> is the path difference",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","distance from a source; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>D</mi><mi>e</mi><mi>l</mi><mi>t</mi><mi>a</mi><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">Delta r</annotation></semantics></math></span> is the path difference <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">∣</mi><msub><mi>r</mi><mn>2</mn></msub><mo>−</mo><msub><mi>r</mi><mn>1</mn></msub><mi mathvariant=\"normal\">∣</mi></mrow><annotation encoding=\"application/x-tex\">|r_2 - r_1|</annotation></semantics></math></span>","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","whole number 0, 1, 2, … counting wavelengths of path difference",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","wavelength of the waves from both sources","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">r_{2}</annotation></semantics></math></span>","distance from the second source to the point","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">r_{1}</annotation></semantics></math></span>","distance from the first source to the point","m"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","capital delta","DEL-tuh","“difference in”: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta r</annotation></semantics></math></span> is the difference between the distances from the two sources."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","lambda","LAM-duh","wavelength."]],"calc":{"title":"Two-source path difference","inputs":[{"k":"r1","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">r_1</annotation></semantics></math></span>","unit":"m","d":"3.00"},{"k":"r2","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">r_2</annotation></semantics></math></span>","unit":"m","d":"3.86"},{"k":"lam","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","unit":"m","d":"0.343"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>r</mi><mi mathvariant=\"normal\">/</mi><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta r / \\lambda</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>result</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{result}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>amplitude (fraction of max)</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{amplitude (fraction of max)}</annotation></semantics></math></span>"],"outUnits":["wavelengths","","×"]}},{"id":"standing","group":"wa","title":"Standing Waves","blurb":"Waves reflecting back and forth lock into fixed patterns of nodes and antinodes.","body":"\n<p>Send a wave down a string fixed at both ends and it reflects back on itself. At most frequencies the reflections jumble up, but at certain special frequencies they line up perfectly into a <b>standing wave</b>. It seems to vibrate in place, with points that never move (<b>nodes</b>) and points of maximum motion (<b>antinodes</b>).</p>\n<p>Both ends must be nodes, so a whole number of half-wavelengths must fit along the length <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>. With <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span> the wave speed on the string:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>λ</mi><mi>n</mi></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mi>L</mi></mrow><mi>n</mi></mfrac><mo separator=\"true\">,</mo><mspace width=\"2em\"/><msub><mi>f</mi><mi>n</mi></msub><mo>=</mo><mfrac><mrow><mi>n</mi><mi>v</mi></mrow><mrow><mn>2</mn><mi>L</mi></mrow></mfrac><mo>=</mo><mi>n</mi><msub><mi>f</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>n</mi><mo>=</mo><mn>1</mn><mo separator=\"true\">,</mo><mn>2</mn><mo separator=\"true\">,</mo><mn>3</mn><mo separator=\"true\">,</mo><mo>…</mo></mrow><annotation encoding=\"application/x-tex\">\\lambda_n = \\frac{2L}{n}, \\qquad f_n = \\frac{n v}{2L} = n f_1, \\qquad n = 1, 2, 3, \\ldots</annotation></semantics></math></span></div>\n<p>The lowest, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">f_1</annotation></semantics></math></span>, is the <b>fundamental</b>; the others are <b>harmonics</b> at whole-number multiples. A plucked string vibrates in a mix of these at once, and the particular mix is a big part of what makes a violin sound different from a piano playing the same note.</p>\n<p>Neighbouring nodes are half a wavelength apart. The <a href=\"#/pipes\">same idea</a> sets the notes of wind instruments, and the same logic, applied to electron waves, helps explain why atoms have discrete energy levels.</p>\n<div class=\"sim\" data-sim=\"standing\"></div>","related":["wavestring","superposition","pipes","shm"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>λ</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\lambda_{n}</annotation></semantics></math></span>","wavelength of the <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>th harmonic, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>L</mi><mi mathvariant=\"normal\">/</mi><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">2L/n</annotation></semantics></math></span>","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","length of the string between its fixed ends","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>","harmonic number 1, 2, 3, … (number of half-wavelengths on the string)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">f_{n}</annotation></semantics></math></span>","frequency of the <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>th harmonic, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><msub><mi>f</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">n f_1</annotation></semantics></math></span>","Hz"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","wave speed on the string","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">f_{1}</annotation></semantics></math></span>","fundamental: lowest stan
