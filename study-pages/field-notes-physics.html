><msup><mi>c</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\gamma mc^2</annotation></semantics></math></span> (calculator shows eV)","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">c</annotation></semantics></math></span>","speed of light in vacuum, 299 792 458","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">E_{0}</annotation></semantics></math></span>","rest energy, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><msup><mi>c</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">mc^2</annotation></semantics></math></span> (calculator shows eV)","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K</mi></mrow><annotation encoding=\"application/x-tex\">K</annotation></semantics></math></span>","relativistic kinetic energy, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\">(</mo><mi>γ</mi><mo>−</mo><mn>1</mn><mo stretchy=\"false\">)</mo><mi>m</mi><msup><mi>c</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">(\\gamma - 1)mc^2</annotation></semantics></math></span> (calculator shows eV)","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>K</mi><mtext>classical</mtext></msub></mrow><annotation encoding=\"application/x-tex\">K_{\\text{classical}}</annotation></semantics></math></span>","Newtonian kinetic energy <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\tfrac12 mv^2</annotation></semantics></math></span>, for comparison (shown in eV)","J"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>γ</mi></mrow><annotation encoding=\"application/x-tex\">\\gamma</annotation></semantics></math></span>","gamma","GAM-uh","the Lorentz factor, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mi mathvariant=\"normal\">/</mi><msqrt><mrow><mn>1</mn><mo>−</mo><msup><mi>v</mi><mn>2</mn></msup><mi mathvariant=\"normal\">/</mi><msup><mi>c</mi><mn>2</mn></msup></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">1/\\sqrt{1 - v^2/c^2}</annotation></semantics></math></span>."]],"calc":{"title":"Energy of a fast particle","inputs":[{"k":"m","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","unit":"kg","d":"9.109e-31"},{"k":"b","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mi mathvariant=\"normal\">/</mi><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">v/c</annotation></semantics></math></span>","unit":"","d":"0.99"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">E_0</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi></mrow><annotation encoding=\"application/x-tex\">E</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K</mi></mrow><annotation encoding=\"application/x-tex\">K</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>K</mi><mtext>classical</mtext></msub></mrow><annotation encoding=\"application/x-tex\">K_{\\text{classical}}</annotation></semantics></math></span>"],"outUnits":["eV","eV","eV","eV"]}},{"id":"photoelectric","group":"qu","title":"Photons & the Photoelectric Effect","blurb":"Light arrives in packets, each with energy set by its frequency.","body":"\n<p>Shine light on a clean metal and it can knock electrons out. The wave picture of light predicted that brighter light would always eventually do it, and give the electrons more energy. Experiments showed something else: below a certain frequency, no electrons come out however bright the light. Above it, electrons appear instantly, and brightness changes only how many.</p>\n<p>Einstein explained this in 1905. Light comes in packets, <b>photons</b>, each with energy</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>E</mi><mo>=</mo><mi>h</mi><mi>f</mi><mo>=</mo><mfrac><mrow><mi>h</mi><mi>c</mi></mrow><mi>λ</mi></mfrac><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>h</mi><mo>=</mo><mn>6.626</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>34</mn></mrow></msup><mtext> J</mtext><mo lspace=\"0em\" rspace=\"0em\">⋅</mo><mtext>s</mtext></mrow><annotation encoding=\"application/x-tex\">E = hf = \\frac{hc}{\\lambda}, \\qquad h = 6.626\\times10^{-34}\\ \\text{J}{\\cdot}\\text{s}</annotation></semantics></math></span></div>\n<p>A single photon gives all its energy to a single electron. Some of it, the <b>work function</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ϕ</mi></mrow><annotation encoding=\"application/x-tex\">\\phi</annotation></semantics></math></span>, is spent freeing the electron from the metal; the rest becomes kinetic energy:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>K</mi><mi>max</mi><mo>⁡</mo></msub><mo>=</mo><mi>h</mi><mi>f</mi><mo>−</mo><mi>ϕ</mi></mrow><annotation encoding=\"application/x-tex\">K_{\\max} = hf - \\phi</annotation></semantics></math></span></div>\n<p>Below the threshold <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mn>0</mn></msub><mo>=</mo><mi>ϕ</mi><mi mathvariant=\"normal\">/</mi><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">f_0 = \\phi/h</annotation></semantics></math></span>, no photon has enough energy, so nothing happens. Brighter light just means more photons.</p>\n<p>A handy number: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi><mi>c</mi><mo>≈</mo><mn>1240</mn><mtext> eV</mtext><mo lspace=\"0em\" rspace=\"0em\">⋅</mo><mtext>nm</mtext></mrow><annotation encoding=\"application/x-tex\">hc \\approx 1240\\ \\text{eV}{\\cdot}\\text{nm}</annotation></semantics></math></span>, so a 620 nm red photon carries 2.0 eV. Light behaves as a wave when it spreads and interferes, and as particles when it's absorbed or emitted. This wave–particle duality runs through all of quantum physics.</p>","related":["bohr","debroglie","emwaves","heattransfer"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi></mrow><annotation encoding=\"application/x-tex\">E</annotation></semantics></math></span>","energy of one photon","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span>","Planck constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6.626</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>34</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">6.626\\times10^{-34}</annotation></semantics></math></span>","J·s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","frequency of the light","Hz"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">c</annotation></semantics></math></span>","speed of light in vacuum, 299 792 458","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","wavelength of the light","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>K</mi><mi>max</mi><mo>⁡</mo></msub></mrow><annotation encoding=\"application/x-tex\">K_{\\max}</annotation></semantics></math></span>","maximum kinetic energy of an ejected electron (calculator shows eV)","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ϕ</mi></mrow><annotation encoding=\"application/x-tex\">\\phi</annotation></semantics></math></span>","work function: minimum energy to free an electron from the metal (input in eV)","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">f_{0}</annotation></semantics></math></span>","threshold frequency, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ϕ</mi><mi mathvariant=\"normal\">/</mi><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">\\phi/h</annotation></semantics></math></span>; below it no electrons are emitted","Hz"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mtext>photon</mtext></msub></mrow><annotation encoding=\"application/x-tex\">E_{\\text{photon}}</annotation></semantics></math></span>","energy of one photon of the chosen wavelength","eV"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>λ</mi><mtext>threshold</mtext></msub></mrow><annotation encoding=\"application/x-tex\">\\lambda_{\\text{threshold}}</annotation></semantics></math></span>","longest wavelength that can still eject electrons","m"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","lambda","LAM-duh","wavelength of the light."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ϕ</mi></mrow><annotation encoding=\"application/x-tex\">\\phi</annotation></semantics></math></span>","phi","fie","work function: the minimum energy needed to free an electron from the metal."]],"calc":{"title":"Photon and metal","inputs":[{"k":"lam","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","unit":"m","d":"400e-9"},{"k":"phi","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ϕ</mi><mtext> (sodium ≈ 2.3)</mtext></mrow><annotation encoding=\"application/x-tex\">\\phi\\ \\text{(sodium ≈ 2.3)}</annotation></semantics></math></span>","unit":"eV","d":"2.3"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mtext>photon</mtext></msub></mrow><annotation encoding=\"application/x-tex\">E_{\\text{photon}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>K</mi><mi>max</mi><mo>⁡</mo></msub></mrow><annotation encoding=\"application/x-tex\">K_{\\max}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>λ</mi><mtext>threshold</mtext></msub></mrow><annotation encoding=\"application/x-tex\">\\lambda_{\\text{threshold}}</annotation></semantics></math></span>"],"outUnits":["eV","eV","m"]}},{"id":"bohr","group":"qu","title":"Atomic Energy Levels","blurb":"Electrons in atoms have only certain allowed energies, giving each element its spectral fingerprint.","body":"\n<p>Hot gases don't glow with a smooth rainbow. Each element emits only certain sharp colours, its line spectrum. Niels Bohr explained hydrogen's lines in 1913 by proposing that the electron can occupy only certain orbits, with energies</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>E</mi><mi>n</mi></msub><mo>=</mo><mo>−</mo><mfrac><mrow><mn>13.6</mn><mtext> eV</mtext></mrow><msup><mi>n</mi><mn>2</mn></msup></mfrac><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>n</mi><mo>=</mo><mn>1</mn><mo separator=\"true\">,</mo><mn>2</mn><mo separator=\"true\">,</mo><mn>3</mn><mo separator=\"true\">,</mo><mo>…</mo></mrow><annotation encoding=\"application/x-tex\">E_n = -\\frac{13.6\\ \\text{eV}}{n^2}, \\qquad n = 1, 2, 3, \\ldots</annotation></semantics></math></span></div>\n<p>The energy is negative because the electron is bound; 13.6 eV is what it takes to ionize hydrogen from its ground state <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">n = 1</annotation></semantics></math></span>. When the electron drops from a higher level to a lower one, it emits a single photon carrying the difference:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>h</mi><mi>f</mi><mo>=</mo><msub><mi>E</mi><msub><mi>n</mi><mi>i</mi></msub></msub><mo>−</mo><msub><mi>E</mi><msub><mi>n</mi><mi>f</mi></msub></msub><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mfrac><mn>1</mn><mi>λ</mi></mfrac><mo>=</mo><msub><mi>R</mi><mi>H</mi></msub><mrow><mo fence=\"true\">(</mo><mfrac><mn>1</mn><msubsup><mi>n</mi><mi>f</mi><mn>2</mn></msubsup></mfrac><mo>−</mo><mfrac><mn>1</mn><msubsup><mi>n</mi><mi>i</mi><mn>2</mn></msubsup></mfrac><mo fence=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">hf = E_{n_i} - E_{n_f}, \\qquad \\frac{1}{\\lambda} = R_H\\left(\\frac{1}{n_f^2} - \\frac{1}{n_i^2}\\right)</annotation></semantics></math></span></div>\n<p>where <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>n</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">n_i</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>n</mi><mi>f</mi></msub></mrow><annotation encoding=\"application/x-tex\">n_f</annotation></semantics></math></span> are the initial and final levels and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mi>H</mi></msub><mo>=</mo><mn>1.097</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mn>7</mn></msup><mtext> </mtext><msup><mtext>m</mtext><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">R_H = 1.097\\times10^{7}\\ \\text{m}^{-1}</annotation></semantics></math></span> is the Rydberg constant. Drops to <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">n = 2</annotation></semantics></math></span> give the visible <b>Balmer series</b>: red at 656 nm, blue-green at 486 nm, violet at 434 nm and 410 nm. Drops to <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">n = 1</annotation></semantics></math></span> are ultraviolet (Lyman), and to <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">n = 3</annotation></semantics></math></span> infrared (Paschen).</p>\n<p>Bohr's orbit picture was replaced by quantum mechanics, where electrons are spread-out waves (<a href=\"#/debroglie\">matter waves</a>) rather than tiny planets. But the energy levels for hydrogen come out the same, and the idea of discrete levels explains lasers, neon signs, fluorescence and how astronomers know what stars are made of.</p>","related":["photoelectric","debroglie","grating","standing"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">E_{n}</annotation></semantics></math></span>","energy of the hydrogen electron in level <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span> (negative: bound)","eV"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>","principal quantum number labelling the energy level (1, 2, 3, …)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span>","Planck constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6.626</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>34</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">6.626\\times10^{-34}</annotation></semantics></math></span>","J·s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","frequency of the emitted photon","Hz"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><msub><mi>n</mi><mi>i</mi></msub></msub></mrow><annotation encoding=\"application/x-tex\">E_{n_i}</annotation></semantics></math></span>","energy of the initial (higher) level","eV"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><msub><mi>n</mi><mi>f</mi></msub></msub></mrow><annotation encoding=\"application/x-tex\">E_{n_f}</annotation></semantics></math></span>","energy of the final (lower) level","eV"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","wavelength of the emitted photon","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mi>H</mi></msub></mrow><annotation encoding=\"application/x-tex\">R_{H}</annotation></semantics></math></span>","Rydberg constant for hydrogen, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1.097</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mn>7</mn></msup></mrow><annotation encoding=\"application/x-tex\">1.097\\times10^{7}</annotation></semantics></math></span>","1/m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>n</mi><mi>f</mi></msub></mrow><annotation encoding=\"application/x-tex\">n_{f}</annotation></semantics></math></span>","quantum number of the final level",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>n</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">n_{i}</annotation></semantics></math></span>","quantum number of the initial level",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mtext>photon</mtext></msub></mrow><annotation encoding=\"application/x-tex\">E_{\\text{photon}}</annotation></semantics></math></span>","energy of the emitted photon, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><msub><mi>n</mi><mi>i</mi></msub></msub><mo>−</mo><msub><mi>E</mi><msub><mi>n</mi><mi>f</mi></msub></msub></mrow><annotation encoding=\"application/x-tex\">E_{n_i} - E_{n_f}</annotation></semantics></math></span>","eV"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","lambda","LAM-duh","wavelength of the emitted light."]],"calc":{"title":"Hydrogen transition","inputs":[{"k":"ni","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>n</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">n_i</annotation></semantics></math></span>","unit":"","d":"3"},{"k":"nf","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>n</mi><mi>f</mi></msub></mrow><annotation encoding=\"application/x-tex\">n_f</annotation></semantics></math></span>","unit":"","d":"2"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mtext>photon</mtext></msub></mrow><annotation encoding=\"application/x-tex\">E_{\\text{photon}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><msub><mi>n</mi><mi>i</mi></msub></msub></mrow><annotation encoding=\"application/x-tex\">E_{n_i}</annotation></semantics></math></span>"],"outUnits":["eV","m","eV"]}},{"id":"debroglie","group":"qu","title":"Matter Waves","blurb":"Particles have wavelengths too, which is why electrons diffract.","body":"\n<p>If light waves behave like particles, Louis de Broglie asked in 1924, might particles behave like waves? He proposed that anything with momentum <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">p</annotation></semantics></math></span> has a wavelength</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>λ</mi><mo>=</mo><mfrac><mi>h</mi><mi>p</mi></mfrac><mo>=</mo><mfrac><mi>h</mi><mrow><mi>m</mi><mi>v</mi></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">\\lambda = \\frac{h}{p} = \\frac{h}{mv}</annotation></semantics></math></span></div>\n<p>For everyday objects this is absurdly small; a thrown baseball has <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi><mo>∼</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>34</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">\\lambda \\sim 10^{-34}</annotation></semantics></math></span> m, far too tiny to ever notice. But an electron accelerated through a few tens of volts has a wavelength comparable to the spacing of atoms in a crystal. In 1927 electrons fired at crystals were seen to diffract exactly as predicted. Electrons, neutrons, atoms and even large molecules have since all shown interference.</p>\n<p>For an electron accelerated from rest through a potential difference <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span> (non-relativistic):</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>λ</mi><mo>=</mo><mfrac><mi>h</mi><msqrt><mrow><mn>2</mn><mi>m</mi><mi>e</mi><mi>V</mi></mrow></msqrt></mfrac></mrow><annotation encoding=\"application/x-tex\">\\lambda = \\frac{h}{\\sqrt{2 m e V}}</annotation></semantics></math></span></div>\n<p>Electron microscopes exploit these short wavelengths to resolve detail far finer than light allows (see <a href=\"#/diffraction\">diffraction limit</a>).</p>\n<p>Matter waves also explain Bohr's levels. An electron bound in an atom must form a <a href=\"#/standing\">standing wave</a>, so only certain wavelengths, and therefore only certain energies, fit.</p>","related":["photoelectric","bohr","uncertainty","diffraction"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","de Broglie wavelength of the particle","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span>","Planck constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6.626</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>34</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">6.626\\times10^{-34}</annotation></semantics></math></span>","J·s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">p</annotation></semantics></math></span>","momentum of the particle","kg·m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","mass of the particle (electron mass in the accelerated-electron formula)","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","speed of the particle","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi></mrow><annotation encoding=\"application/x-tex\">e</annotation></semantics></math></span>","elementary charge, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1.602</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>19</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">1.602\\times10^{-19}</annotation></semantics></math></span>","C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>","potential difference the electron is accelerated through from rest","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>λ</mi><mtext>electron</mtext></msub></mrow><annotation encoding=\"application/x-tex\">\\lambda_{\\text{electron}}</annotation></semantics></math></span>","wavelength of an electron accelerated through <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>λ</mi><mtext>object</mtext></msub></mrow><annotation encoding=\"application/x-tex\">\\lambda_{\\text{object}}</annotation></semantics></math></span>","wavelength of an object of mass <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span> moving at speed <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","m"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","lambda","LAM-duh","the de Broglie wavelength of a particle."]],"calc":{"title":"De Broglie wavelength","inputs":[{"k":"V","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi><mtext> (electron)</mtext></mrow><annotation encoding=\"application/x-tex\">V\\ \\text{(electron)}</annotation></semantics></math></span>","unit":"V","d":"54"},{"k":"m","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><mtext> (any object)</mtext></mrow><annotation encoding=\"application/x-tex\">m\\ \\text{(any object)}</annotation></semantics></math></span>","unit":"kg","d":"0.145"},{"k":"v","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","unit":"m/s","d":"40"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>λ</mi><mtext>electron</mtext></msub></mrow><annotation encoding=\"application/x-tex\">\\lambda_{\\text{electron}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>λ</mi><mtext>object</mtext></msub></mrow><annotation encoding=\"application/x-tex\">\\lambda_{\\text{object}}</annotation></semantics></math></span>"],"outUnits":["m","m"]}},{"id":"uncertainty","group":"qu","title":"Uncertainty Principle","blurb":"Position and momentum can’t both be pinned down at once.","body":"\n<p>A wave that's spread out has a well-defined wavelength, but no definite location. Squeeze it into a short pulse and its location sharpens, but it becomes a mix of many wavelengths. Since a particle's wavelength sets its momentum, the same trade-off applies to particles. Werner Heisenberg put it as follows, with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta x</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta p</annotation></semantics></math></span> the spreads in position and momentum:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>x</mi><mtext> </mtext><mi mathvariant=\"normal\">Δ</mi><mi>p</mi><mo>≥</mo><mfrac><mi mathvariant=\"normal\">ℏ</mi><mn>2</mn></mfrac><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi mathvariant=\"normal\">ℏ</mi><mo>=</mo><mfrac><mi>h</mi><mrow><mn>2</mn><mi>π</mi></mrow></mfrac><mo>=</mo><mn>1.055</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>34</mn></mrow></msup><mtext> J</mtext><mo lspace=\"0em\" rspace=\"0em\">⋅</mo><mtext>s</mtext></mrow><annotation encoding=\"application/x-tex\">\\Delta x\\,\\Delta p \\ge \\frac{\\hbar}{2}, \\qquad \\hbar = \\frac{h}{2\\pi} = 1.055\\times10^{-34}\\ \\text{J}{\\cdot}\\text{s}</annotation></semantics></math></span></div>\n<p>This isn't a limit of our instruments. It's a property of nature: a particle simply doesn't <i>have</i> a precise position and momentum at the same time. There's a similar relation between energy and time, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>E</mi><mtext> </mtext><mi mathvariant=\"normal\">Δ</mi><mi>t</mi><mo>≳</mo><mi mathvariant=\"normal\">ℏ</mi><mi mathvariant=\"normal\">/</mi><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">\\Delta E\\,\\Delta t \\gtrsim \\hbar/2</annotation></semantics></math></span>, which is why short-lived excited states emit spectral lines that are slightly blurred in frequency.</p>\n<p>For big objects the limit is irrelevant. For electrons in atoms it's decisive. Confining an electron to an atom-sized region forces it to have a large spread of momentum, so it can't just fall into the nucleus. That keeps atoms stable and sets their size.</p>\n<p>Quantum mechanics describes particles with a <b>wavefunction</b> whose squared magnitude gives the probability per unit volume of finding the particle at each place. Effects like <b>tunnelling</b>, where a particle crosses a barrier it classically couldn't, follow from this and make possible flash memory, scanning tunnelling microscopes and alpha decay.</p>","related":["debroglie","bohr","decay"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","uncertainty (spread) in the quantity that follows",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>","position of the particle (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta x</annotation></semantics></math></span> is its spread)","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">p</annotation></semantics></math></span>","momentum of the particle (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta p</annotation></semantics></math></span> is its spread)","kg·m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">ℏ</mi></mrow><annotation encoding=\"application/x-tex\">\\hbar</annotation></semantics></math></span>","reduced Planck constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi><mi mathvariant=\"normal\">/</mi><mn>2</mn><mi>π</mi><mo>=</mo><mn>1.055</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>34</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">h/2\\pi = 1.055\\times10^{-34}</annotation></semantics></math></span>","J·s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span>","Planck constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6.626</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>34</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">6.626\\times10^{-34}</annotation></semantics></math></span>","J·s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","pi, ≈ 3.14159",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi></mrow><annotation encoding=\"application/x-tex\">E</annotation></semantics></math></span>","energy of a state (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>E</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta E</annotation></semantics></math></span> is its spread)","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","time (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta t</annotation></semantics></math></span> is the duration or lifetime of the state)","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","mass of the particle","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mi>min</mi><mo>⁡</mo></msub></mrow><annotation encoding=\"application/x-tex\">p_{\\min}</annotation></semantics></math></span>","smallest allowed momentum spread, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><msub><mi>p</mi><mi>min</mi><mo>⁡</mo></msub><mo>=</mo><mi mathvariant=\"normal\">ℏ</mi><mi mathvariant=\"normal\">/</mi><mo stretchy=\"false\">(</mo><mn>2</mn><mi mathvariant=\"normal\">Δ</mi><mi>x</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\Delta p_{\\min} = \\hbar/(2\\Delta x)</annotation></semantics></math></span>","kg·m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>min</mi><mo>⁡</mo></msub></mrow><annotation encoding=\"application/x-tex\">v_{\\min}</annotation></semantics></math></span>","corresponding smallest velocity spread, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><msub><mi>v</mi><mi>min</mi><mo>⁡</mo></msub><mo>=</mo><mi mathvariant=\"normal\">Δ</mi><msub><mi>p</mi><mi>min</mi><mo>⁡</mo></msub><mi mathvariant=\"normal\">/</mi><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta v_{\\min} = \\Delta p_{\\min}/m</annotation></semantics></math></span>","m/s"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","capital delta","DEL-tuh","“spread” or uncertainty: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta x</annotation></semantics></math></span> in position, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta p</annotation></semantics></math></span> in momentum."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","pi","pie","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span> (a circumference divided by its diameter). It appears wherever circles, rotation or spreading in all directions are involved."]],"calc":{"title":"Minimum momentum spread","inputs":[{"k":"dx","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta x</annotation></semantics></math></span>","unit":"m","d":"1e-10"},{"k":"m","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","unit":"kg","d":"9.109e-31"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><msub><mi>p</mi><mi>min</mi><mo>⁡</mo></msub></mrow><annotation encoding=\"application/x-tex\">\\Delta p_{\\min}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><msub><mi>v</mi><mi>min</mi><mo>⁡</mo></msub></mrow><annotation encoding=\"application/x-tex\">\\Delta v_{\\min}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>energy scale </mtext><mo stretchy=\"false\">(</mo><mi mathvariant=\"normal\">Δ</mi><mi>p</mi><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup><mi mathvariant=\"normal\">/</mi><mn>2</mn><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">\\text{energy scale}\\ (\\Delta p)^2/2m</annotation></semantics></math></span>"],"outUnits":["kg·m/s","m/s","eV"]}},{"id":"binding","group":"nu","title":"The Nucleus & Binding Energy","blurb":"Protons and neutrons held together by the strong force, and the energy locked in that bond.","body":"\n<p>An atom's nucleus is a few femtometres across (1 fm <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>15</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">= 10^{-15}</annotation></semantics></math></span> m), tens of thousands of times smaller than the atom, yet holds almost all its mass. It contains <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Z</mi></mrow><annotation encoding=\"application/x-tex\">Z</annotation></semantics></math></span> protons and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span> neutrons, together called nucleons; the mass number is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi><mo>=</mo><mi>Z</mi><mo>+</mo><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">A = Z + N</annotation></semantics></math></span>. Isotopes of an element have the same <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Z</mi></mrow><annotation encoding=\"application/x-tex\">Z</annotation></semantics></math></span> but different <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>. Nuclear radius grows roughly as <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi><mo>≈</mo><mn>1.2</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>15</mn></mrow></msup><mtext> m</mtext><mo>×</mo><msup><mi>A</mi><mrow><mn>1</mn><mi mathvariant=\"normal\">/</mi><mn>3</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">r \\approx 1.2\\times10^{-15}\\ \\text{m}\\times A^{1/3}</annotation></semantics></math></span>.</p>\n<p>The protons repel each other electrically. What holds the nucleus together is the <b>strong nuclear force</b>, much stronger than the electric repulsion at those distances but dying away beyond a few femtometres.</p>\n<p>A nucleus weighs <i>less</i> than its separate protons and neutrons. The missing mass, the <b>mass defect</b>, is the binding energy that would be needed to pull it apart:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>E</mi><mi>B</mi></msub><mo>=</mo><mrow><mo fence=\"true\">(</mo><mi>Z</mi><msub><mi>m</mi><mi>p</mi></msub><mo>+</mo><mi>N</mi><msub><mi>m</mi><mi>n</mi></msub><mo>−</mo><msub><mi>m</mi><mtext>nucleus</mtext></msub><mo fence=\"true\">)</mo></mrow><msup><mi>c</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">E_B = \\left(Z m_p + N m_n - m_{\\text{nucleus}}\\right)c^2</annotation></semantics></math></span></div>\n<p>In atomic mass units (u), <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mtext> u</mtext><mo>×</mo><msup><mi>c</mi><mn>2</mn></msup><mo>=</mo><mn>931.5</mn></mrow><annotation encoding=\"application/x-tex\">1\\ \\text{u}\\times c^2 = 931.5</annotation></semantics></math></span> MeV. Tables usually list <i>atomic</i> masses, which include the electrons; using the hydrogen-atom mass in place of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mi>p</mi></msub></mrow><annotation encoding=\"application/x-tex\">m_p</annotation></semantics></math></span> makes the electron masses cancel, which is what the calculator below does. Binding energy per nucleon rises steeply for light nuclei, peaks near iron and nickel at about 8.8 MeV, then slowly falls for heavier ones. That curve explains why <a href=\"#/fission\">fusing light nuclei and splitting heavy ones</a> both release energy.</p>","related":["massenergy","decay","fission"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mi>B</mi></msub></mrow><annotation encoding=\"application/x-tex\">E_{B}</annotation></semantics></math></span>","binding energy of the nucleus (calculator shows MeV)","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Z</mi></mrow><annotation encoding=\"application/x-tex\">Z</annotation></semantics></math></span>","atomic number: number of protons",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mi>p</mi></msub></mrow><annotation encoding=\"application/x-tex\">m_{p}</annotation></semantics></math></span>","mass of a proton (calculator uses the hydrogen-atom mass)","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>","number of neutrons",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">m_{n}</annotation></semantics></math></span>","mass of a neutron","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mtext>nucleus</mtext></msub></mrow><annotation encoding=\"application/x-tex\">m_{\\text{nucleus}}</annotation></semantics></math></span>","measured mass of the whole nucleus","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">c</annotation></semantics></math></span>","speed of light in vacuum, 299 792 458","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span>","mass number: total number of nucleons, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Z</mi><mo>+</mo><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">Z + N</annotation></semantics></math></span>",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","approximate radius of the nucleus","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mtext>atom</mtext></msub></mrow><annotation encoding=\"application/x-tex\">m_{\\text{atom}}</annotation></semantics></math></span>","atomic mass of the neutral atom, including electrons","u"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","\"change in\"; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta m</annotation></semantics></math></span> is the mass defect",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","mass; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta m</annotation></semantics></math></span> is the mass defect (nucleons minus nucleus)","u"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","capital delta","DEL-tuh","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta m</annotation></semantics></math></span>, the mass defect: how much lighter the nucleus is than its separate parts."]],"calc":{"title":"Binding energy from masses","inputs":[{"k":"Z","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Z</mi></mrow><annotation encoding=\"application/x-tex\">Z</annotation></semantics></math></span>","unit":"","d":"2"},{"k":"N","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>","unit":"","d":"2"},{"k":"M","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mtext>atom</mtext></msub><mtext> (He-4)</mtext></mrow><annotation encoding=\"application/x-tex\">m_{\\text{atom}}\\ \\text{(He-4)}</annotation></semantics></math></span>","unit":"u","d":"4.002602"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta m</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mi>B</mi></msub></mrow><annotation encoding=\"application/x-tex\">E_B</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mi>B</mi></msub><mi mathvariant=\"normal\">/</mi><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">E_B / A</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>"],"outUnits":["u","MeV","MeV","m"]}},{"id":"decay","group":"nu","title":"Radioactive Decay","blurb":"Unstable nuclei transform at random, but large numbers follow a precise half-life.","body":"\n<p>Unstable nuclei change into more stable ones by emitting radiation. The main types:</p>\n<table class=\"t\">\n<tr><th>Decay</th><th>Emits</th><th>Change</th><th>Stopped by</th></tr>\n<tr><td>Alpha (α)</td><td>helium-4 nucleus</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Z</mi><mo>−</mo><mn>2</mn><mo separator=\"true\">,</mo><mtext> </mtext><mi>A</mi><mo>−</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">Z - 2,\\ A - 4</annotation></semantics></math></span></td><td>a sheet of paper, a few cm of air</td></tr>\n<tr><td>Beta-minus (β⁻)</td><td>electron + antineutrino</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Z</mi><mo>+</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">Z + 1</annotation></semantics></math></span>, same <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span></td><td>a few mm of aluminium</td></tr>\n<tr><td>Beta-plus (β⁺)</td><td>positron + neutrino</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Z</mi><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">Z - 1</annotation></semantics></math></span>, same <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span></td><td>a few mm of aluminium</td></tr>\n<tr><td>Gamma (γ)</td><td>high-energy photon</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Z</mi></mrow><annotation encoding=\"application/x-tex\">Z</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span> unchanged; nucleus drops to a lower energy state</td><td>reduced (never fully stopped) by thick lead or concrete</td></tr>\n</table>\n<p>No one can predict when a particular nucleus will decay, but each has a fixed chance per second, the <b>decay constant</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>. A large sample of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>N</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">N_0</annotation></semantics></math></span> nuclei therefore shrinks exponentially, with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mrow><mn>1</mn><mi mathvariant=\"normal\">/</mi><mn>2</mn></mrow></msub></mrow><annotation encoding=\"application/x-tex\">T_{1/2}</annotation></semantics></math></span> the <b>half-life</b>:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>N</mi><mo stretchy=\"false\">(</mo><mi>t</mi><mo stretchy=\"false\">)</mo><mo>=</mo><msub><mi>N</mi><mn>0</mn></msub><mtext> </mtext><msup><mi>e</mi><mrow><mo>−</mo><mi>λ</mi><mi>t</mi></mrow></msup><mo>=</mo><msub><mi>N</mi><mn>0</mn></msub><msup><mrow><mo fence=\"true\">(</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mo fence=\"true\">)</mo></mrow><mrow><mi>t</mi><mi mathvariant=\"normal\">/</mi><msub><mi>T</mi><mrow><mn>1</mn><mi mathvariant=\"normal\">/</mi><mn>2</mn></mrow></msub></mrow></msup><mo separator=\"true\">,</mo><mspace width=\"2em\"/><msub><mi>T</mi><mrow><mn>1</mn><mi mathvariant=\"normal\">/</mi><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mi>ln</mi><mo>⁡</mo><mn>2</mn></mrow><mi>λ</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">N(t) = N_0\\,e^{-\\lambda t} = N_0\\left(\\tfrac12\\right)^{t/T_{1/2}}, \\qquad T_{1/2} = \\frac{\\ln 2}{\\lambda}</annotation></semantics></math></span></div>\n<p>After one half-life half remains, after two a quarter, and so on. The <b>activity</b> (decays per second, in becquerels) is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi><mo>=</mo><mi>λ</mi><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">A = \\lambda N</annotation></semantics></math></span> (this <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span> is not the mass number). Half-lives range from far less than a microsecond to many billions of years. Carbon-14, with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mrow><mn>1</mn><mi mathvariant=\"normal\">/</mi><mn>2</mn></mrow></msub><mo>=</mo><mn>5730</mn></mrow><annotation encoding=\"application/x-tex\">T_{1/2} = 5730</annotation></semantics></math></span> years, lets archaeologists date once-living material; uranium-238, at 4.47 billion years, dates rocks and the Earth itself.</p>\n<p>Watch the randomness average out below: each square decays independently, yet the count tracks the smooth curve.</p>\n<div class=\"sim\" data-sim=\"halflife\"></div>","related":["binding","fission","uncertainty"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>","number of undecayed nuclei remaining at time <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","time elapsed (calculator works in years)","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>N</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">N_{0}</annotation></semantics></math></span>","initial number of nuclei",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","decay constant: probability per unit time that a nucleus decays","1/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi></mrow><annotation encoding=\"application/x-tex\">e</annotation></semantics></math></span>","Euler's number, ≈ 2.718 (base of natural logarithms)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mrow><mn>1</mn><mi mathvariant=\"normal\">/</mi><mn>2</mn></mrow></msub></mrow><annotation encoding=\"application/x-tex\">T_{1/2}</annotation></semantics></math></span>","half-life: time for half the nuclei to decay (calculator uses years)","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Z</mi></mrow><annotation encoding=\"application/x-tex\">Z</annotation></semantics></math></span>","atomic number: number of protons in the nucleus",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span>","mass number in the decay table; activity <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda N</annotation></semantics></math></span> (decays per second) in the text","none or Bq"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>A</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">A_{0}</annotation></semantics></math></span>","initial activity, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi><msub><mi>N</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\lambda N_0</annotation></semantics></math></span>","Bq"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi></mrow><annotation encoding=\"application/x-tex\">\\alpha</annotation></semantics></math></span>","alpha","AL-fuh","alpha (α) decay: emission of a helium-4 nucleus."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>β</mi></mrow><annotation encoding=\"application/x-tex\">\\beta</annotation></semantics></math></span>","beta","BAY-tuh","beta (β) decay: emission of an electron or positron."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>γ</mi></mrow><annotation encoding=\"application/x-tex\">\\gamma</annotation></semantics></math></span>","gamma","GAM-uh","gamma (γ) rays: high-energy photons from a nucleus."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","lambda","LAM-duh","decay constant: the chance per unit time that a given nucleus decays."]],"calc":{"title":"Half-life and dating","inputs":[{"k":"T","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mrow><mn>1</mn><mi mathvariant=\"normal\">/</mi><mn>2</mn></mrow></msub></mrow><annotation encoding=\"application/x-tex\">T_{1/2}</annotation></semantics></math></span>","unit":"years","d":"5730"},{"k":"frac","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>fraction left</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{fraction left}</annotation></semantics></math></span>","unit":"","d":"0.25"},{"k":"N0","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>N</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">N_0</annotation></semantics></math></span>","unit":"nuclei","d":"1e12"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>age</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{age}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>A</mi><mn>0</mn></msub><mo>=</mo><mi>λ</mi><msub><mi>N</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">A_0 = \\lambda N_0</annotation></semantics></math></span>"],"outUnits":["years","1/year","Bq"]}},{"id":"fission","group":"nu","title":"Fission & Fusion","blurb":"Splitting heavy nuclei and fusing light ones both release energy.","body":"\n<p>Because binding energy per nucleon peaks near iron, moving toward that peak from either side releases energy.</p>\n<p><b>Fission</b> splits a heavy nucleus into two mid-sized ones. Uranium-235 absorbs a slow neutron, becomes unstable, and splits, for example</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msubsup><mrow></mrow><mn>0</mn><mn>1</mn></msubsup><mtext>n</mtext><mo>+</mo><msubsup><mrow></mrow><mn>92</mn><mn>235</mn></msubsup><mtext>U</mtext><mtext>  </mtext><mo>→</mo><mtext>  </mtext><msubsup><mrow></mrow><mn>56</mn><mn>141</mn></msubsup><mtext>Ba</mtext><mo>+</mo><msubsup><mrow></mrow><mn>36</mn><mn>92</mn></msubsup><mtext>Kr</mtext><mo>+</mo><mn>3</mn><mtext> </mtext><msubsup><mrow></mrow><mn>0</mn><mn>1</mn></msubsup><mtext>n</mtext><mo>+</mo><mo>≈</mo><mn>200</mn><mtext> MeV</mtext></mrow><annotation encoding=\"application/x-tex\">^{1}_{0}\\text{n} + {}^{235}_{92}\\text{U} \\;\\to\\; {}^{141}_{56}\\text{Ba} + {}^{92}_{36}\\text{Kr} + 3\\,{}^{1}_{0}\\text{n} + \\approx 200\\ \\text{MeV}</annotation></semantics></math></span></div>\n<p>The released neutrons can split more nuclei, a <b>chain reaction</b>. In a reactor, a <b>moderator</b> (water or graphite) slows the neutrons so that uranium-235 captures them readily, and <b>control rods</b> absorb surplus neutrons so that, on average, exactly one neutron from each fission goes on to cause another, holding the power steady.</p>\n<p><b>Fusion</b> joins light nuclei. The Sun fuses hydrogen into helium; on Earth the most promising reaction joins two hydrogen isotopes:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msubsup><mrow></mrow><mn>1</mn><mn>2</mn></msubsup><mtext>H</mtext><mo>+</mo><msubsup><mrow></mrow><mn>1</mn><mn>3</mn></msubsup><mtext>H</mtext><mtext>  </mtext><mo>→</mo><mtext>  </mtext><msubsup><mrow></mrow><mn>2</mn><mn>4</mn></msubsup><mtext>He</mtext><mo>+</mo><msubsup><mrow></mrow><mn>0</mn><mn>1</mn></msubsup><mtext>n</mtext><mo>+</mo><mn>17.6</mn><mtext> MeV</mtext></mrow><annotation encoding=\"application/x-tex\">^{2}_{1}\\text{H} + {}^{3}_{1}\\text{H} \\;\\to\\; {}^{4}_{2}\\text{He} + {}^{1}_{0}\\text{n} + 17.6\\ \\text{MeV}</annotation></semantics></math></span></div>\n<p>Fusion releases more energy per kilogram of fuel than fission and leaves far less long-lived waste. The difficulty is that nuclei repel electrically, so fusion needs temperatures above 100 million kelvin and a way to confine such a plasma. That remains a major engineering challenge.</p>\n<p>In both cases the energy comes from mass: the products weigh slightly less, and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mo>=</mo><mi mathvariant=\"normal\">Δ</mi><mi>m</mi><mtext> </mtext><msup><mi>c</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">E = \\Delta m\\,c^2</annotation></semantics></math></span>.</p>","related":["binding","massenergy","decay"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi></mrow><annotation encoding=\"application/x-tex\">E</annotation></semantics></math></span>","energy released (calculator also shows kWh)","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","\"change in\"; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta m</annotation></semantics></math></span> is the mass lost in the reaction",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","mass; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta m</annotation></semantics></math></span> is how much lighter the products are than the reactants","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">c</annotation></semantics></math></span>","speed of light in vacuum, 299 792 458","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mtext>fuel</mtext></msub></mrow><annotation encoding=\"application/x-tex\">m_{\\text{fuel}}</annotation></semantics></math></span>","total mass of fuel used up","kg"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","capital delta","DEL-tuh","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta m</annotation></semantics></math></span>, the mass lost in the reaction."]],"calc":{"title":"Energy from fuel","inputs":[{"k":"m","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mtext>fuel</mtext></msub></mrow><annotation encoding=\"application/x-tex\">m_{\\text{fuel}}</annotation></semantics></math></span>","unit":"kg","d":"1"},{"k":"Ef","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>energy per reaction</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{energy per reaction}</annotation></semantics></math></span>","unit":"MeV","d":"200"},{"k":"A","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>fuel mass per reaction</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{fuel mass per reaction}</annotation></semantics></math></span>","unit":"u","d":"235"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>reactions</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{reactions}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi></mrow><annotation encoding=\"application/x-tex\">E</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi></mrow><annotation encoding=\"application/x-tex\">E</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>coal equivalent (24 MJ/kg)</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{coal equivalent (24 MJ/kg)}</annotation></semantics></math></span>"],"outUnits":["","J","kWh","tonnes"]}}];
const MAPPOS = {"mech":{"kinematics":[110,80],"projectile":[300,60],"circular":[520,90],"newton":[180,230],"friction":[80,360],"incline":[260,380],"work":[470,300],"energy":[560,420],"mpower":[380,470],"momentum":[700,240],"collisions":[860,320],"torque":[740,80],"inertia":[920,160],"angmom":[900,450],"rolling":[700,560],"shm":[420,590],"pendulum":[190,560],"gravity":[545,190],"orbits":[820,620]},"wav":{"waves":[130,80],"wavestring":[110,230],"superposition":[340,150],"standing":[300,300],"sound":[560,70],"doppler":[790,80],"pipes":[560,260],"beats":[790,220],"reflection":[120,400],"refraction":[300,470],"mirrors":[120,560],"lenses":[330,610],"instruments":[560,560],"doubleslit":[560,410],"diffraction":[790,470],"grating":[870,600],"thinfilm":[800,340],"polarization":[930,410]},"em":{"charge":[90,90],"coulomb":[250,60],"efield":[420,110],"gauss":[600,60],"potential":[300,210],"capacitance":[470,250],"current":[110,330],"resistance":[250,400],"seriesparallel":[120,500],"power":[300,560],"kirchhoff":[420,470],"rc":[580,380],"bfield":[640,190],"wireforce":[800,120],"biotsavart":[800,260],"ampere":[920,180],"faraday":[720,450],"inductance":[730,330],"ac":[560,540],"rlc":[720,590],"transformer":[880,520],"maxwell":[900,360],"emwaves":[930,600]},"mod":{"temperature":[110,80],"heat":[300,60],"heattransfer":[500,90],"idealgas":[130,230],"kinetic":[320,200],"firstlaw":[260,340],"processes":[90,380],"heatengines":[250,480],"secondlaw":[460,330],"timedilation":[770,70],"length":[920,160],"massenergy":[800,260],"photoelectric":[600,210],"bohr":[620,400],"debroglie":[480,560],"uncertainty":[660,610],"binding":[880,380],"decay":[900,520],"fission":[760,470]}};
const R = String.raw;
const CALC = {
"kinematics": (v) => [[R`v`, v.v0 + v.a * v.t, 'm/s'], [R`\Delta x`, v.v0 * v.t + 0.5 * v.a * v.t * v.t, 'm'], [R`\bar v`, v.v0 + 0.5 * v.a * v.t, 'm/s']],
"projectile": (v) => {
        const th = v.th * Math.PI / 180, s = Math.sin(th);
        return [[R`T`, 2 * v.v0 * s / v.g, 's'], [R`H`, (v.v0 * s) ** 2 / (2 * v.g), 'm'], [R`R`, v.v0 * v.v0 * Math.sin(2 * th) / v.g, 'm']];
      },
"circular": (v) => [[R`a_c`, v.v * v.v / v.r, 'm/s²'], [R`F_c`, v.m * v.v * v.v / v.r, 'N'], [R`T`, 2 * Math.PI * v.r / v.v, 's'], [R`\omega`, v.v / v.r, 'rad/s']],
"newton": (v) => {
        const a = v.F / v.m;
        return [[R`a`, a, 'm/s²'], [R`W = mg`, v.m * 9.80665, 'N'], [R`\Delta v\ \text{in}\ t`, a * v.t, 'm/s']];
      },
"friction": (v) => {
        const N = v.m * 9.80665, fs = v.ms * N, fk = v.mk * N;
        const moves = v.F > fs;
        return [[R`N`, N, 'N'], [R`f_{s,\max}`, fs, 'N'], [R`\text{moves?}`, moves ? 'yes' : 'no', ''], [R`a`, moves ? (v.F - fk) / v.m : 0, 'm/s²']];
      },
"incline": (v) => {
        const th = v.th * Math.PI / 180, a = 9.80665 * (Math.sin(th) - v.mk * Math.cos(th));
        const starts = Math.tan(th) > v.ms; // static friction must be beaten before it moves from rest
        return [[R`a`, Math.max(a, 0), 'm/s²'], [R`\theta_{\text{slip}}`, Math.atan(v.ms) * 180 / Math.PI, '°'], [R`v_{\text{bottom}}\ (\text{from rest})`, starts && a > 0 ? Math.sqrt(2 * a * v.L) : 0, 'm/s']];
      },
"work": (v) => [[R`W`, v.F * v.d * Math.cos(v.th * Math.PI / 180), 'J'], [R`F_{\parallel}`, v.F * Math.cos(v.th * Math.PI / 180), 'N']],
"energy": (v) => [[R`U = mgh`, v.m * 9.80665 * v.h, 'J'], [R`K_0`, 0.5 * v.m * v.v0 * v.v0, 'J'], [R`v\ \text{after falling}\ h`, v.v0 * v.v0 + 2 * 9.80665 * v.h >= 0 ? Math.sqrt(v.v0 * v.v0 + 2 * 9.80665 * v.h) : 'never gets that high', 'm/s']],
"mpower": (v) => {
        const W = v.m * 9.80665 * v.h, P = W / v.t;
        return [[R`W`, W, 'J'], [R`P`, P, 'W'], [R`P`, P / 745.7, 'hp']];
      },
"momentum": (v) => {
        const J = v.m * (v.vf - v.vi);
        return [[R`p_i`, v.m * v.vi, 'kg·m/s'], [R`J = \Delta p`, J, 'N·s'], [R`F_{\text{avg}}`, J / v.dt, 'N']];
      },
"collisions": (v) => {
        const M = v.m1 + v.m2, vc = (v.m1 * v.v1 + v.m2 * v.v2) / M;
        const a = vc - v.e * v.m2 * (v.v1 - v.v2) / M, b = vc + v.e * v.m1 * (v.v1 - v.v2) / M;
        const K0 = 0.5 * v.m1 * v.v1 ** 2 + 0.5 * v.m2 * v.v2 ** 2, K1 = 0.5 * v.m1 * a * a + 0.5 * v.m2 * b * b;
        const lost = Math.abs(K0 - K1) < 1e-9 * Math.max(K0, 1e-30) ? 0 : K0 - K1;
        return [[R`v_1'`, a, 'm/s'], [R`v_2'`, b, 'm/s'], [R`K\ \text{lost}`, lost, 'J']];
      },
"torque": (v) => [[R`\tau`, v.r * v.F * Math.sin(v.th * Math.PI / 180), 'N·m'], [R`m_2\ \text{needed at}\ r = 2\ \text{m}`, v.m1 * v.r1 / 2, 'kg']],
"inertia": (v) => {
        const I = 0.5 * v.M * v.R * v.R, al = v.tau / I, w = al * v.t;
        return [[R`I`, I, 'kg·m²'], [R`\alpha`, al, 'rad/s²'], [R`\omega\ \text{after}\ t`, w, 'rad/s'], [R`K_{\text{rot}}`, 0.5 * I * w * w, 'J']];
      },
"angmom": (v) => {
        const w2 = v.I1 * v.w1 / v.I2;
        return [[R`L`, v.I1 * v.w1, 'kg·m²/s'], [R`\omega_2`, w2, 'rad/s'], [R`K_2 / K_1`, (v.I2 * w2 * w2) / (v.I1 * v.w1 * v.w1), '×']];
      },
"rolling": (v) => [[R`\text{sliding (no friction)}`, Math.sqrt(2 * 9.80665 * v.h), 'm/s'], [R`\text{solid sphere}`, Math.sqrt(2 * 9.80665 * v.h / 1.4), 'm/s'], [R`\text{solid cylinder}`, Math.sqrt(2 * 9.80665 * v.h / 1.5), 'm/s'], [R`\text{hoop}`, Math.sqrt(9.80665 * v.h), 'm/s']],
"shm": (v) => {
        const w = Math.sqrt(v.k / v.m);
        return [[R`\omega`, w, 'rad/s'], [R`T`, 2 * Math.PI / w, 's'], [R`f`, w / (2 * Math.PI), 'Hz'], [R`v_{\max}`, v.A * w, 'm/s'], [R`E`, 0.5 * v.k * v.A * v.A, 'J']];
      },
"pendulum": (v) => {
        const T0 = 2 * Math.PI * Math.sqrt(v.L / v.g), th = v.th * Math.PI / 180;
        // exact via arithmetic-geometric mean: T = T0 / AGM(1, cos(th/2))
        let a = 1, b = Math.cos(th / 2);
        for (let i = 0; i < 20; i++) { const an = (a + b) / 2; b = Math.sqrt(a * b); a = an; }
        if (Math.abs(v.th) >= 180) return [[R`T_{\text{small-angle}}`, T0, 's'], [R`T_{\text{exact}}`, 'infinite (balanced upside down)', 's'], [R`\text{difference}`, '—', '%']];
        return [[R`T_{\text{small-angle}}`, T0, 's'], [R`T_{\text{exact}}`, T0 / a, 's'], [R`\text{difference}`, (1 / a - 1) * 100, '%']];
      },
"gravity": (v) => {
        const g = 6.6743e-11 * v.M / (v.Rr * v.Rr);
        return [[R`g`, g, 'm/s²'], [R`\text{weight}`, v.m * g, 'N'], [R`g / g_{\text{Earth}}`, g / 9.80665, '×']];
      },
"orbits": (v) => {
        const GM = 6.6743e-11 * v.M, r = v.Rp + v.h;
        return [[R`v_{\text{orbit}}`, Math.sqrt(GM / r), 'm/s'], [R`T`, 2 * Math.PI * Math.sqrt(r ** 3 / GM) / 60, 'min'], [R`v_{\text{esc}}\ \text{(at that altitude)}`, Math.sqrt(2 * GM / r), 'm/s']];
      },
"waves": (v) => [[R`\lambda`, v.v / v.f, 'm'], [R`T`, 1 / v.f, 's'], [R`k`, 2 * Math.PI * v.f / v.v, 'rad/m'], [R`\omega`, 2 * Math.PI * v.f, 'rad/s']],
"wavestring": (v) => {
        const s = Math.sqrt(v.F / v.mu), w = 2 * Math.PI * v.f;
        return [[R`v`, s, 'm/s'], [R`\lambda`, s / v.f, 'm'], [R`P_{\text{avg}}`, 0.5 * v.mu * s * w * w * v.A * v.A, 'W']];
      },
"superposition": (v) => {
        const m = Math.abs(v.r2 - v.r1) / v.lam, frac = m - Math.floor(m);
        const kind = Math.min(frac, 1 - frac) < 0.1 ? 'mostly constructive' : Math.abs(frac - 0.5) < 0.1 ? 'mostly destructive' : 'partial';
        return [[R`\Delta r / \lambda`, m, 'wavelengths'], [R`\text{result}`, kind, ''], [R`\text{amplitude (fraction of max)}`, Math.abs(Math.cos(Math.PI * m)), '×']];
      },
"standing": (v) => [[R`f_1`, v.v / (2 * v.L), 'Hz'], [R`f_n`, v.n * v.v / (2 * v.L), 'Hz'], [R`\lambda_n`, 2 * v.L / v.n, 'm'], [R`\text{nodes (incl. ends)}`, Math.round(v.n) + 1, '']],
"sound": (v) => {
        const I = v.P / (4 * Math.PI * v.r * v.r);

const SI = new Set(['J/s', 'N', 'V', 'A', 'W', 'J', 'F', 'H', 'T', 'Ω', 's', 'm', 'Hz', 'C', 'N·m', 'V/m', 'N/C', 'm/s']);

  return `${+m.toPrecision(4)} × 10${sup(String(ex))}`;
}
function fmt(x, unit) {

  const base = unit.split('/')[0];
  if (SI.has(unit) && x !== 0 && !(unit === 'm/s' || unit === 'V/m' || unit === 'N/C') ) {
    const a = Math.abs(x);
    for (const [p, s] of PRE) if (a >= p * 0.9995) { return [+(x / p).toPrecision(4) + '', s + unit]; }
    return [sci(x), unit];
  }
  return [sci(x), unit];
}

let cleanups = [];

  const fit = () => { const w = cv.clientWidth, h = Math.round(w * aspect), d = devicePixelRatio || 1; cv.width = w * d; cv.height = h * d; cv.style.height = h + 'px'; const c = cv.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0); draw(c, w, h); };

function logSlider(label, min, max, val, unit, onch) {

  wrap.innerHTML = `<span>${label}</span><input type="range" min="0" max="1000" value="${(Math.log10(val) - lmin) / (lmax - lmin) * 1000}"><span class="val"></span>`;
