s=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_{0}</annotation></semantics></math></span>","permeability of free space, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub><mo>≈</mo><mn>4</mn><mi>π</mi><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>7</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">\\mu_0 \\approx 4\\pi\\times10^{-7}</annotation></semantics></math></span> T·m/A","T·m/A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_{1}</annotation></semantics></math></span>","current in the first parallel wire","A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_{2}</annotation></semantics></math></span>","current in the second parallel wire","A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span>",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","distance between the two parallel wires","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mtext>wire</mtext></msub></mrow><annotation encoding=\"application/x-tex\">F_{\\text{wire}}</annotation></semantics></math></span>","force on the wire when it is perpendicular to the field","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>τ</mi><mi>max</mi><mo>⁡</mo></msub></mrow><annotation encoding=\"application/x-tex\">\\tau_{\\max}</annotation></semantics></math></span>","maximum torque on the coil (axis perpendicular to the field)","N·m"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","theta","THAY-tuh","angle between the wire (or the coil's face normal) and the field."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math></span>","mu","myoo","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math></span> alone is the coil's magnetic dipole moment, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi><mi>I</mi><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">NIA</annotation></semantics></math></span>. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_0</annotation></semantics></math></span> is the permeability of free space, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mi>π</mi><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>7</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">4\\pi\\times10^{-7}</annotation></semantics></math></span> T·m/A."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","pi","pie","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span> (a circumference divided by its diameter). It appears wherever circles, rotation or spreading in all directions are involved."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi></mrow><annotation encoding=\"application/x-tex\">\\tau</annotation></semantics></math></span>","tau","rhymes with “cow”","torque on the coil, in N·m."]],"calc":{"title":"Wire and coil","inputs":[{"k":"I","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","unit":"A","d":"5"},{"k":"L","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","unit":"m","d":"0.2"},{"k":"B","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B</mi></mrow><annotation encoding=\"application/x-tex\">B</annotation></semantics></math></span>","unit":"T","d":"0.5"},{"k":"N","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>","unit":"turns","d":"100"},{"k":"A","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span>","unit":"m²","d":"0.0025"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mtext>wire</mtext></msub><mtext> </mtext><mo stretchy=\"false\">(</mo><mi>θ</mi><mo>=</mo><mn>9</mn><msup><mn>0</mn><mo>∘</mo></msup><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">F_{\\text{wire}}\\ (\\theta = 90^\\circ)</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>τ</mi><mi>max</mi><mo>⁡</mo></msub></mrow><annotation encoding=\"application/x-tex\">\\tau_{\\max}</annotation></semantics></math></span>"],"outUnits":["N","N·m"]}},{"id":"biotsavart","group":"mg","title":"Fields from Currents","blurb":"Currents create magnetic fields: wires, loops and solenoids.","body":"\n<p>Every small piece of current <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mtext> </mtext><mi>d</mi><mover accent=\"true\"><mi mathvariant=\"normal\">ℓ</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">I\\,d\\vec\\ell</annotation></semantics></math></span> contributes to the magnetic field around it (the Biot–Savart law):</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>d</mi><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover><mo>=</mo><mfrac><msub><mi>μ</mi><mn>0</mn></msub><mrow><mn>4</mn><mi>π</mi></mrow></mfrac><mtext> </mtext><mfrac><mrow><mi>I</mi><mtext> </mtext><mi>d</mi><mover accent=\"true\"><mi mathvariant=\"normal\">ℓ</mi><mo>⃗</mo></mover><mo>×</mo><mover accent=\"true\"><mi>r</mi><mo>^</mo></mover></mrow><msup><mi>r</mi><mn>2</mn></msup></mfrac><mo separator=\"true\">,</mo><mspace width=\"2em\"/><msub><mi>μ</mi><mn>0</mn></msub><mo>≈</mo><mn>4</mn><mi>π</mi><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>7</mn></mrow></msup><mtext> T</mtext><mo lspace=\"0em\" rspace=\"0em\">⋅</mo><mtext>m/A</mtext></mrow><annotation encoding=\"application/x-tex\">d\\vec B = \\frac{\\mu_0}{4\\pi}\\,\\frac{I\\,d\\vec\\ell \\times \\hat r}{r^2}, \\qquad \\mu_0 \\approx 4\\pi\\times10^{-7}\\ \\text{T}{\\cdot}\\text{m/A}</annotation></semantics></math></span></div>\n<p>Here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>r</mi><mo>^</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\hat r</annotation></semantics></math></span> is the unit vector from the current element to the point where you want the field, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span> is the distance between them, and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_0</annotation></semantics></math></span> is the permeability of free space. Adding up the pieces for common shapes gives results worth memorising:</p>\n<table class=\"t\">\n<tr><th>Source</th><th>Field</th></tr>\n<tr><td>Long straight wire, distance <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span></td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B</mi><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msub><mi>μ</mi><mn>0</mn></msub><mi>I</mi></mrow><mrow><mn>2</mn><mi>π</mi><mi>r</mi></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">B = \\dfrac{\\mu_0 I}{2\\pi r}</annotation></semantics></math></span></td></tr>\n<tr><td>Centre of a circular loop, radius <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span></td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B</mi><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msub><mi>μ</mi><mn>0</mn></msub><mi>I</mi></mrow><mrow><mn>2</mn><mi>R</mi></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">B = \\dfrac{\\mu_0 I}{2R}</annotation></semantics></math></span></td></tr>\n<tr><td>Inside a long solenoid, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span> turns per metre</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B</mi><mo>=</mo><msub><mi>μ</mi><mn>0</mn></msub><mi>n</mi><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">B = \\mu_0 n I</annotation></semantics></math></span></td></tr>\n</table>\n<p>Field lines around a straight wire are circles. Wrap your right hand around the wire with your thumb along the current, and your fingers curl the way <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec B</annotation></semantics></math></span> points.</p>","related":["ampere","wireforce","inductance","bfield"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","an infinitesimally small piece/change (in derivatives and integrals)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{B}</annotation></semantics></math></span>","magnetic field vector; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">d\\vec B</annotation></semantics></math></span> is the contribution of one current element","T"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_{0}</annotation></semantics></math></span>","permeability of free space, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub><mo>≈</mo><mn>4</mn><mi>π</mi><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>7</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">\\mu_0 \\approx 4\\pi\\times10^{-7}</annotation></semantics></math></span> T·m/A","T·m/A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span>",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","current in the wire, loop or solenoid","A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi mathvariant=\"normal\">ℓ</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{\\ell}</annotation></semantics></math></span>","position along the wire; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mover accent=\"true\"><mi mathvariant=\"normal\">ℓ</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">d\\vec\\ell</annotation></semantics></math></span> is a short piece pointing along the current","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>r</mi><mo>^</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\hat{r}</annotation></semantics></math></span>","unit vector from the current element to the field point",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","distance from the current element or straight wire to the field point","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B</mi></mrow><annotation encoding=\"application/x-tex\">B</annotation></semantics></math></span>","magnitude of the magnetic field","T"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","radius of the circular loop","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>","turns per unit length of the solenoid","turns/m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>B</mi><mtext>wire</mtext></msub></mrow><annotation encoding=\"application/x-tex\">B_{\\text{wire}}</annotation></semantics></math></span>","field at distance <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span> from a long straight wire","T"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>B</mi><mtext>loop</mtext></msub></mrow><annotation encoding=\"application/x-tex\">B_{\\text{loop}}</annotation></semantics></math></span>","field at the centre of a circular loop of radius <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","T"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>B</mi><mtext>solenoid</mtext></msub></mrow><annotation encoding=\"application/x-tex\">B_{\\text{solenoid}}</annotation></semantics></math></span>","field inside a long solenoid","T"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math></span>","mu","myoo","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_0</annotation></semantics></math></span>, the permeability of free space, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4</mn><mi>π</mi><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>7</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">4\\pi\\times10^{-7}</annotation></semantics></math></span> T·m/A. It sets the strength of magnetic effects in a vacuum."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","pi","pie","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span> (a circumference divided by its diameter). It appears wherever circles, rotation or spreading in all directions are involved."]],"calc":{"title":"Wire, loop and solenoid","inputs":[{"k":"I","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","unit":"A","d":"10"},{"k":"r","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi><mtext> or </mtext><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">r\\ \\text{or}\\ R</annotation></semantics></math></span>","unit":"m","d":"0.05"},{"k":"n","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>","unit":"turns/m","d":"1000"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>B</mi><mtext>wire</mtext></msub></mrow><annotation encoding=\"application/x-tex\">B_{\\text{wire}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>B</mi><mtext>loop</mtext></msub></mrow><annotation encoding=\"application/x-tex\">B_{\\text{loop}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>B</mi><mtext>solenoid</mtext></msub></mrow><annotation encoding=\"application/x-tex\">B_{\\text{solenoid}}</annotation></semantics></math></span>"],"outUnits":["T","T","T"]}},{"id":"ampere","group":"mg","title":"Ampère's Law","blurb":"The magnetic field circulating around a loop measures the current through it.","body":"\n<p>Ampère's law plays the role for magnetism that Gauss's law plays for electricity. Walk around any closed path and add up the component of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec B</annotation></semantics></math></span> along the way. The total depends only on the current threading the path:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mo>∮</mo><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover><mo>⋅</mo><mi>d</mi><mover accent=\"true\"><mi mathvariant=\"normal\">ℓ</mi><mo>⃗</mo></mover><mo>=</mo><msub><mi>μ</mi><mn>0</mn></msub><msub><mi>I</mi><mtext>enc</mtext></msub></mrow><annotation encoding=\"application/x-tex\">\\oint \\vec B\\cdot d\\vec\\ell = \\mu_0 I_{\\text{enc}}</annotation></semantics></math></span></div>\n<p>With enough symmetry it gives fields almost for free. For a circle of radius <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span> around a long wire, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B</mi></mrow><annotation encoding=\"application/x-tex\">B</annotation></semantics></math></span> is constant along the path, so <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B</mi><mo stretchy=\"false\">(</mo><mn>2</mn><mi>π</mi><mi>r</mi><mo stretchy=\"false\">)</mo><mo>=</mo><msub><mi>μ</mi><mn>0</mn></msub><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">B(2\\pi r) = \\mu_0 I</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B</mi><mo>=</mo><msub><mi>μ</mi><mn>0</mn></msub><mi>I</mi><mi mathvariant=\"normal\">/</mi><mo stretchy=\"false\">(</mo><mn>2</mn><mi>π</mi><mi>r</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">B = \\mu_0 I/(2\\pi r)</annotation></semantics></math></span>. A rectangular path partly inside a long solenoid gives <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B</mi><mo>=</mo><msub><mi>μ</mi><mn>0</mn></msub><mi>n</mi><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">B = \\mu_0 n I</annotation></semantics></math></span> inside and nearly zero outside.</p>\n<p>Inside a toroid (a solenoid bent into a doughnut) with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span> total turns, at distance <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span> from its centre:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>B</mi><mo>=</mo><mfrac><mrow><msub><mi>μ</mi><mn>0</mn></msub><mi>N</mi><mi>I</mi></mrow><mrow><mn>2</mn><mi>π</mi><mi>r</mi></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">B = \\frac{\\mu_0 N I}{2\\pi r}</annotation></semantics></math></span></div>\n<p>Maxwell noticed that this law breaks down while a capacitor is charging, and fixed it by adding a term for changing electric flux. See <a href=\"#/maxwell\">Maxwell's equations</a>.</p>","related":["biotsavart","gauss","maxwell"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{B}</annotation></semantics></math></span>","magnetic field vector along the closed path","T"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","an infinitesimally small piece/change (in derivatives and integrals)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi mathvariant=\"normal\">ℓ</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{\\ell}</annotation></semantics></math></span>","position along the closed path; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mover accent=\"true\"><mi mathvariant=\"normal\">ℓ</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">d\\vec\\ell</annotation></semantics></math></span> is a short step along it","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_{0}</annotation></semantics></math></span>","permeability of free space, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub><mo>≈</mo><mn>4</mn><mi>π</mi><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>7</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">\\mu_0 \\approx 4\\pi\\times10^{-7}</annotation></semantics></math></span> T·m/A","T·m/A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mtext>enc</mtext></msub></mrow><annotation encoding=\"application/x-tex\">I_{\\text{enc}}</annotation></semantics></math></span>","net current passing through the closed path","A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B</mi></mrow><annotation encoding=\"application/x-tex\">B</annotation></semantics></math></span>","magnitude of the magnetic field","T"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>","total number of turns on the toroid",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","current in the wire, solenoid or toroid winding","A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span>",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","radius of the circular path: distance from the wire or the toroid’s centre","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>","turns per unit length of the solenoid","turns/m"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math></span>","mu","myoo","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_0</annotation></semantics></math></span>, the permeability of free space."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","pi","pie","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span> (a circumference divided by its diameter). It appears wherever circles, rotation or spreading in all directions are involved."]],"calc":{"title":"Toroid","inputs":[{"k":"N","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>","unit":"turns","d":"500"},{"k":"I","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","unit":"A","d":"2"},{"k":"r","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","unit":"m","d":"0.1"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B</mi></mrow><annotation encoding=\"application/x-tex\">B</annotation></semantics></math></span>"],"outUnits":["T"]}},{"id":"faraday","group":"in","title":"Faraday's Law","blurb":"A changing magnetic flux induces a voltage.","body":"\n<p>Magnetic flux through a loop measures how much field passes through it:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi mathvariant=\"normal\">Φ</mi><mi>B</mi></msub><mo>=</mo><mo>∫</mo><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover><mo>⋅</mo><mi>d</mi><mover accent=\"true\"><mi>A</mi><mo>⃗</mo></mover><mo>=</mo><mi>B</mi><mi>A</mi><mi>cos</mi><mo>⁡</mo><mi>θ</mi><mtext>  </mtext><mo stretchy=\"false\">(</mo><mtext>uniform field</mtext><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\Phi_B = \\int \\vec B\\cdot d\\vec A = B A\\cos\\theta \\ \\ (\\text{uniform field})</annotation></semantics></math></span></div>\n<p>Here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span> is the angle between <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec B</annotation></semantics></math></span> and the normal to the loop. Faraday discovered that whenever this flux changes, for any reason, an emf (a voltage driving current around the loop) appears. For a coil of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span> turns:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>ℰ</mi><mo>=</mo><mo>−</mo><mi>N</mi><mtext> </mtext><mfrac><mrow><mi>d</mi><msub><mi mathvariant=\"normal\">Φ</mi><mi>B</mi></msub></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E} = -N\\,\\frac{d\\Phi_B}{dt}</annotation></semantics></math></span></div>\n<p>The flux can change because the field strength changes, the loop's area changes, or the loop rotates. The minus sign is <b>Lenz's law</b>: the induced current flows in whichever direction creates a field that opposes the change in flux. Push a magnet toward a coil and the coil pushes back.</p>\n<p>A rod of length <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span> sliding at speed <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span> across a field (with rod, motion and field all mutually perpendicular) gives motional emf <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ℰ</mi><mo>=</mo><mi>B</mi><mi>L</mi><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E} = B L v</annotation></semantics></math></span>. A coil spinning at angular speed <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span> gives a sinusoidal emf, which is how generators make alternating current:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>ℰ</mi><mo stretchy=\"false\">(</mo><mi>t</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mi>N</mi><mi>B</mi><mi>A</mi><mtext> </mtext><mi>ω</mi><mi>sin</mi><mo>⁡</mo><mi>ω</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}(t) = N B A\\,\\omega \\sin\\omega t</annotation></semantics></math></span></div>","related":["inductance","transformer","maxwell","ac"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">Φ</mi><mi>B</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\Phi_{B}</annotation></semantics></math></span>","magnetic flux through the loop","Wb"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{B}</annotation></semantics></math></span>","magnetic field vector","T"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","an infinitesimally small piece/change (in derivatives and integrals)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>A</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{A}</annotation></semantics></math></span>","area vector, normal to the loop; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mover accent=\"true\"><mi>A</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">d\\vec A</annotation></semantics></math></span> is a small patch","m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B</mi></mrow><annotation encoding=\"application/x-tex\">B</annotation></semantics></math></span>","magnitude of the (uniform) magnetic field","T"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span>","area of the loop (of each turn of the coil)","m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","angle between <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec B</annotation></semantics></math></span> and the normal to the loop","°"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ℰ</mi></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}</annotation></semantics></math></span>","induced emf around the loop or coil","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>","number of turns in the coil",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","time","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>","angular speed of the spinning coil, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mo>=</mo><mn>2</mn><mi>π</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">\\omega = 2\\pi f</annotation></semantics></math></span>","rad/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","length of the sliding rod","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","speed of the sliding rod","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","rotation frequency of the generator coil","Hz"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ℰ</mi><mtext>peak</mtext></msub></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}_{\\text{peak}}</annotation></semantics></math></span>","peak generator emf, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi><mi>B</mi><mi>A</mi><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">NBA\\omega</annotation></semantics></math></span>","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ℰ</mi><mtext>rms</mtext></msub></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}_{\\text{rms}}</annotation></semantics></math></span>","rms generator emf, peak divided by <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mn>2</mn></msqrt></mrow><annotation encoding=\"application/x-tex\">\\sqrt2</annotation></semantics></math></span>","V"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","theta","THAY-tuh","angle between the field and the loop's normal."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Φ</mi></mrow><annotation encoding=\"application/x-tex\">\\Phi</annotation></semantics></math></span>","capital phi","fie","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">Φ</mi><mi>B</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\Phi_B</annotation></semantics></math></span>, magnetic flux: how much field passes through a loop, in webers (T·m²)."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>","omega","oh-MAY-guh","angular speed of the spinning coil, in rad/s."]],"calc":{"title":"Generator emf","inputs":[{"k":"N","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>","unit":"turns","d":"200"},{"k":"B","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B</mi></mrow><annotation encoding=\"application/x-tex\">B</annotation></semantics></math></span>","unit":"T","d":"0.2"},{"k":"A","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span>","unit":"m²","d":"0.01"},{"k":"f","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","unit":"Hz","d":"60"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ℰ</mi><mtext>peak</mtext></msub></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}_{\\text{peak}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ℰ</mi><mtext>rms</mtext></msub></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}_{\\text{rms}}</annotation></semantics></math></span>"],"outUnits":["V","V"]}},{"id":"inductance","group":"in","title":"Inductance & RL Circuits","blurb":"Coils resist changes in their own current.","body":"\n<p>A coil's current creates magnetic flux through its own turns. If the current changes, so does the flux, and Faraday's law induces an emf that opposes the change. The proportionality constant is the <b>inductance</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>, measured in henries (H):</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>ℰ</mi><mi>L</mi></msub><mo>=</mo><mo>−</mo><mi>L</mi><mtext> </mtext><mfrac><mrow><mi>d</mi><mi>I</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo separator=\"true\">,</mo><mspace width=\"2em\"/><msub><mi>L</mi><mtext>solenoid</mtext></msub><mo>=</mo><mfrac><mrow><msub><mi>μ</mi><mn>0</mn></msub><msup><mi>N</mi><mn>2</mn></msup><mi>A</mi></mrow><mi mathvariant=\"normal\">ℓ</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}_L = -L\\,\\frac{dI}{dt}, \\qquad L_{\\text{solenoid}} = \\frac{\\mu_0 N^2 A}{\\ell}</annotation></semantics></math></span></div>\n<p>For a long solenoid, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span> is the number of turns, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span> the cross-sectional area and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">ℓ</mi></mrow><annotation encoding=\"application/x-tex\">\\ell</annotation></semantics></math></span> the length.</p>\n<p>An inductor stores energy in its magnetic field:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>U</mi><mo>=</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi>L</mi><msup><mi>I</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">U = \\tfrac12 L I^2</annotation></semantics></math></span></div>\n<p>Switch on a battery in series with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>, and the current can't jump instantly. It climbs toward <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ℰ</mi><mi mathvariant=\"normal\">/</mi><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}/R</annotation></semantics></math></span> with time constant <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi><mo>=</mo><mi>L</mi><mi mathvariant=\"normal\">/</mi><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">\\tau = L/R</annotation></semantics></math></span>:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>I</mi><mo stretchy=\"false\">(</mo><mi>t</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mfrac><mi>ℰ</mi><mi>R</mi></mfrac><mrow><mo fence=\"true\">(</mo><mn>1</mn><mo>−</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>t</mi><mi>R</mi><mi mathvariant=\"normal\">/</mi><mi>L</mi></mrow></msup><mo fence=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">I(t) = \\frac{\\mathcal{E}}{R}\\left(1 - e^{-tR/L}\\right)</annotation></semantics></math></span></div>\n<p>Interrupting the current suddenly makes <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mi>I</mi><mi mathvariant=\"normal\">/</mi><mi>d</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">dI/dt</annotation></semantics></math></span> huge, so inductors can produce large voltage spikes. That is the spark in a car's ignition coil, and why relay coils are fitted with protection (flyback) diodes.</p>","related":["faraday","rc","ac","biotsavart"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ℰ</mi><mi>L</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}_{L}</annotation></semantics></math></span>","self-induced emf across the inductor, opposing changes in current","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","inductance of the coil","H"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","an infinitesimally small piece/change (in derivatives and integrals)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","current through the inductor","A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","time (since the battery was switched on, in <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mo stretchy=\"false\">(</mo><mi>t</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">I(t)</annotation></semantics></math></span>)","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>L</mi><mtext>solenoid</mtext></msub></mrow><annotation encoding=\"application/x-tex\">L_{\\text{solenoid}}</annotation></semantics></math></span>","inductance of a long solenoid","H"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_{0}</annotation></semantics></math></span>","permeability of free space, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub><mo>≈</mo><mn>4</mn><mi>π</mi><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>7</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">\\mu_0 \\approx 4\\pi\\times10^{-7}</annotation></semantics></math></span> T·m/A","T·m/A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>","number of turns on the solenoid",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span>","cross-sectional area of the solenoid","m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">ℓ</mi></mrow><annotation encoding=\"application/x-tex\">\\ell</annotation></semantics></math></span>","length of the solenoid","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>U</mi></mrow><annotation encoding=\"application/x-tex\">U</annotation></semantics></math></span>","energy stored in the inductor’s magnetic field","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ℰ</mi></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}</annotation></semantics></math></span>","emf of the battery driving the RL circuit","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","resistance in series with the inductor","Ω"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi></mrow><annotation encoding=\"application/x-tex\">e</annotation></semantics></math></span>","Euler's number, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi><mo>≈</mo><mn>2.718</mn></mrow><annotation encoding=\"application/x-tex\">e \\approx 2.718</annotation></semantics></math></span> (base of the exponential)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi></mrow><annotation encoding=\"application/x-tex\">\\tau</annotation></semantics></math></span>","time constant of the RL circuit, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi><mo>=</mo><mi>L</mi><mi mathvariant=\"normal\">/</mi><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">\\tau = L/R</annotation></semantics></math></span>","s"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math></span>","mu","myoo","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_0</annotation></semantics></math></span>, the permeability of free space."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi></mrow><annotation encoding=\"application/x-tex\">\\tau</annotation></semantics></math></span>","tau","rhymes with “cow”","the time constant <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mi mathvariant=\"normal\">/</mi><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">L/R</annotation></semantics></math></span> of an RL circuit."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Ω</mi></mrow><annotation encoding=\"application/x-tex\">\\Omega</annotation></semantics></math></span>","capital omega","oh-MAY-guh","the ohm, the unit of resistance (and reactance and impedance). <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mtext> </mtext><mi mathvariant=\"normal\">Ω</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1\\ \\Omega = 1</annotation></semantics></math></span> V/A."]],"calc":{"title":"Solenoid inductor","inputs":[{"k":"N","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>","unit":"turns","d":"500"},{"k":"A","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span>","unit":"m²","d":"1e-4"},{"k":"l","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">ℓ</mi></mrow><annotation encoding=\"application/x-tex\">\\ell</annotation></semantics></math></span>","unit":"m","d":"0.05"},{"k":"I","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","unit":"A","d":"1"},{"k":"R","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","unit":"Ω","d":"10"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>U</mi></mrow><annotation encoding=\"application/x-tex\">U</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi><mo>=</mo><mi>L</mi><mi mathvariant=\"normal\">/</mi><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">\\tau = L/R</annotation></semantics></math></span>"],"outUnits":["H","J","s"]}},{"id":"ac","group":"in","title":"AC & Reactance","blurb":"How resistors, capacitors and inductors respond to sinusoidal voltage.","body":"\n<p>Mains electricity alternates sinusoidally, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi><mo stretchy=\"false\">(</mo><mi>t</mi><mo stretchy=\"false\">)</mo><mo>=</mo><msub><mi>V</mi><mn>0</mn></msub><mi>sin</mi><mo>⁡</mo><mi>ω</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">V(t) = V_0\\sin\\omega t</annotation></semantics></math></span> with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mo>=</mo><mn>2</mn><mi>π</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">\\omega = 2\\pi f</annotation></semantics></math></span>. Meters report <b>rms</b> values, the steady DC level that would deliver the same average power to a resistor:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>V</mi><mtext>rms</mtext></msub><mo>=</mo><mfrac><msub><mi>V</mi><mn>0</mn></msub><msqrt><mn>2</mn></msqrt></mfrac><mo separator=\"true\">,</mo><mspace width=\"2em\"/><msub><mi>I</mi><mtext>rms</mtext></msub><mo>=</mo><mfrac><msub><mi>I</mi><mn>0</mn></msub><msqrt><mn>2</mn></msqrt></mfrac></mrow><annotation encoding=\"application/x-tex\">V_{\\text{rms}} = \\frac{V_0}{\\sqrt 2}, \\qquad I_{\\text{rms}} = \\frac{I_0}{\\sqrt 2}</annotation></semantics></math></span></div>\n<p>Capacitors and inductors oppose AC with a <b>reactance</b>, measured in ohms, that depends on frequency:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>X</mi><mi>C</mi></msub><mo>=</mo><mfrac><mn>1</mn><mrow><mi>ω</mi><mi>C</mi></mrow></mfrac><mo separator=\"true\">,</mo><mspace width=\"2em\"/><msub><mi>X</mi><mi>L</mi></msub><mo>=</mo><mi>ω</mi><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">X_C = \\frac{1}{\\omega C}, \\qquad X_L = \\omega L</annotation></semantics></math></span></div>\n<p>A capacitor blocks DC and low frequencies and passes high ones; an inductor does the reverse. They also shift timing: in a capacitor the current leads the voltage by 90°, and in an inductor it lags by 90°. A resistor keeps them in step.</p>\n<div class=\"note\"><b>Mnemonic.</b> \"ELI the ICE man\": in an inductor (L), voltage E comes before current I; in a capacitor (C), current I comes before voltage E.</div>","related":["rlc","inductance","capacitance","power"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mtext>rms</mtext></msub></mrow><annotation encoding=\"application/x-tex\">V_{\\text{rms}}</annotation></semantics></math></span>","rms (effective) voltage, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mn>0</mn></msub><mi mathvariant=\"normal\">/</mi><msqrt><mn>2</mn></msqrt></mrow><annotation encoding=\"application/x-tex\">V_0/\\sqrt2</annotation></semantics></math></span>","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">V_{0}</annotation></semantics></math></span>","peak (amplitude) voltage","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mtext>rms</mtext></msub></mrow><annotation encoding=\"application/x-tex\">I_{\\text{rms}}</annotation></semantics></math></span>","rms (effective) current","A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_{0}</annotation></semantics></math></span>","peak (amplitude) current","A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>X</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">X_{C}</annotation></semantics></math></span>","capacitive reactance: a capacitor’s opposition to AC","Ω"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>","angular frequency, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mo>=</mo><mn>2</mn><mi>π</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">\\omega = 2\\pi f</annotation></semantics></math></span>","rad/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C</mi></mrow><annotation encoding=\"application/x-tex\">C</annotation></semantics></math></span>","capacitance","F"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>X</mi><mi>L</mi></msub></mrow><annotation encoding=\"application/x-tex\">X_{L}</annotation></semantics></math></span>","inductive reactance: an inductor’s opposition to AC","Ω"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","inductance","H"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>","instantaneous voltage <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi><mo stretchy=\"false\">(</mo><mi>t</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">V(t)</annotation></semantics></math></span> of the AC supply","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","time","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span>",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","frequency of the AC supply","Hz"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","pi","pie","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span> (a circumference divided by its diameter). It appears wherever circles, rotation or spreading in all directions are involved."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>","omega","oh-MAY-guh","angular frequency, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>π</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">2\\pi f</annotation></semantics></math></span>, in rad/s."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Ω</mi></mrow><annotation encoding=\"application/x-tex\">\\Omega</annotation></semantics></math></span>","capital omega","oh-MAY-guh","the ohm, the unit of resistance (and reactance and impedance). <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mtext> </mtext><mi mathvariant=\"normal\">Ω</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1\\ \\Omega = 1</annotation></semantics></math></span> V/A."]],"calc":{"title":"Reactance at a frequency","inputs":[{"k":"f","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","unit":"Hz","d":"60"},{"k":"C","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C</mi></mrow><annotation encoding=\"application/x-tex\">C</annotation></semantics></math></span>","unit":"F","d":"10e-6"},{"k":"L","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","unit":"H","d":"0.1"},{"k":"V0","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">V_0</annotation></semantics></math></span>","unit":"V","d":"170"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>X</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">X_C</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>X</mi><mi>L</mi></msub></mrow><annotation encoding=\"application/x-tex\">X_L</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mtext>rms</mtext></msub></mrow><annotation encoding=\"application/x-tex\">V_{\\text{rms}}</annotation></semantics></math></span>"],"outUnits":["rad/s","Ω","Ω","V"]}},{"id":"rlc","group":"in","title":"RLC Circuits & Resonance","blurb":"At one special frequency the inductor and capacitor cancel out.","body":"\n<p>Put a resistor, inductor and capacitor in series with an AC source. The total opposition to current is the <b>impedance</b>, which combines resistance and the two reactances:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>Z</mi><mo>=</mo><msqrt><mrow><msup><mi>R</mi><mn>2</mn></msup><mo>+</mo><msup><mrow><mo fence=\"true\">(</mo><msub><mi>X</mi><mi>L</mi></msub><mo>−</mo><msub><mi>X</mi><mi>C</mi></msub><mo fence=\"true\">)</mo></mrow><mn>2</mn></msup></mrow></msqrt><mo separator=\"true\">,</mo><mspace width=\"2em\"/><msub><mi>I</mi><mtext>rms</mtext></msub><mo>=</mo><mfrac><msub><mi>V</mi><mtext>rms</mtext></msub><mi>Z</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">Z = \\sqrt{R^2 + \\left(X_L - X_C\\right)^2}, \\qquad I_{\\text{rms}} = \\frac{V_{\\text{rms}}}{Z}</annotation></semantics></math></span></div>\n<p>The source voltage leads the current by a phase angle <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ϕ</mi></mrow><annotation encoding=\"application/x-tex\">\\phi</annotation></semantics></math></span> (negative when the capacitor dominates, so the current leads instead):</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>tan</mi><mo>⁡</mo><mi>ϕ</mi><mo>=</mo><mfrac><mrow><msub><mi>X</mi><mi>L</mi></msub><mo>−</mo><msub><mi>X</mi><mi>C</mi></msub></mrow><mi>R</mi></mfrac><mo separator=\"true\">,</mo><mspace width=\"2em\"/><msub><mi>P</mi><mtext>avg</mtext></msub><mo>=</mo><msub><mi>I</mi><mtext>rms</mtext></msub><msub><mi>V</mi><mtext>rms</mtext></msub><mi>cos</mi><mo>⁡</mo><mi>ϕ</mi></mrow><annotation encoding=\"application/x-tex\">\\tan\\phi = \\frac{X_L - X_C}{R}, \\qquad P_{\\text{avg}} = I_{\\text{rms}} V_{\\text{rms}} \\cos\\phi</annotation></semantics></math></span></div>\n<p>Because <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>X</mi><mi>L</mi></msub></mrow><annotation encoding=\"application/x-tex\">X_L</annotation></semantics></math></span> rises with frequency and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>X</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">X_C</annotation></semantics></math></span> falls, there's a frequency where they're equal and cancel. There <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Z</mi><mo>=</mo><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">Z = R</annotation></semantics></math></span>, the current peaks, and the circuit is <b>resonant</b>:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>f</mi><mn>0</mn></msub><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>π</mi><msqrt><mrow><mi>L</mi><mi>C</mi></mrow></msqrt></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">f_0 = \\frac{1}{2\\pi\\sqrt{LC}}</annotation></semantics></math></span></div>\n<p>A small <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span> gives a tall, narrow peak. This selectivity is how a radio tunes in one station and ignores the rest. Drag the sliders to see it:</p>\n<div class=\"sim\" data-sim=\"rlc\"></div>","related":["ac","inductance","capacitance","emwaves"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Z</mi></mrow><annotation encoding=\"application/x-tex\">Z</annotation></semantics></math></span>","impedance: total opposition of the series RLC circuit to AC","Ω"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","resistance","Ω"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>X</mi><mi>L</mi></msub></mrow><annotation encoding=\"application/x-tex\">X_{L}</annotation></semantics></math></span>","inductive reactance, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">\\omega L</annotation></semantics></math></span>","Ω"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>X</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">X_{C}</annotation></semantics></math></span>","capacitive reactance, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mi mathvariant=\"normal\">/</mi><mo stretchy=\"false\">(</mo><mi>ω</mi><mi>C</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">1/(\\omega C)</annotation></semantics></math></span>","Ω"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mtext>rms</mtext></msub></mrow><annotation encoding=\"application/x-tex\">I_{\\text{rms}}</annotation></semantics></math></span>","rms current in the circuit","A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mtext>rms</mtext></msub></mrow><annotation encoding=\"application/x-tex\">V_{\\text{rms}}</annotation></semantics></math></span>","rms voltage of the AC source","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ϕ</mi></mrow><annotation encoding=\"application/x-tex\">\\phi</annotation></semantics></math></span>","phase angle by which the source voltage leads the current","°"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mtext>avg</mtext></msub></mrow><annotation encoding=\"application/x-tex\">P_{\\text{avg}}</annotation></semantics></math></span>","average power delivered (all dissipated in <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>)","W"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">f_{0}</annotation></semantics></math></span>","resonant frequency, where <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>X</mi><mi>L</mi></msub><mo>=</mo><msub><mi>X</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">X_L = X_C</annotation></semantics></math></span>","Hz"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span>",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","inductance","H"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C</mi></mrow><annotation encoding=\"application/x-tex\">C</annotation></semantics></math></span>","capacitance","F"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","frequency of the AC source","Hz"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","pi","pie","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span> (a circumference divided by its diameter). It appears wherever circles, rotation or spreading in all directions are involved."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ϕ</mi></mrow><annotation encoding=\"application/x-tex\">\\phi</annotation></semantics></math></span>","phi","fie","phase angle: how far the source voltage leads the current. It is negative when the capacitor dominates and the current leads instead."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Ω</mi></mrow><annotation encoding=\"application/x-tex\">\\Omega</annotation></semantics></math></span>","capital omega","oh-MAY-guh","the ohm, the unit of resistance (and reactance and impedance). <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mtext> </mtext><mi mathvariant=\"normal\">Ω</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1\\ \\Omega = 1</annotation></semantics></math></span> V/A."]],"calc":{"title":"Series RLC","inputs":[{"k":"R","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","unit":"Ω","d":"50"},{"k":"L","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","unit":"H","d":"0.1"},{"k":"C","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C</mi></mrow><annotation encoding=\"application/x-tex\">C</annotation></semantics></math></span>","unit":"F","d":"10e-6"},{"k":"f","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","unit":"Hz","d":"150"},{"k":"V","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mtext>rms</mtext></msub></mrow><annotation encoding=\"application/x-tex\">V_{\\text{rms}}</annotation></semantics></math></span>","unit":"V","d":"120"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">f_0</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Z</mi></mrow><annotation encoding=\"application/x-tex\">Z</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mtext>rms</mtext></msub></mrow><annotation encoding=\"application/x-tex\">I_{\\text{rms}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ϕ</mi></mrow><annotation encoding=\"application/x-tex\">\\phi</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mtext>avg</mtext></msub></mrow><annotation encoding=\"application/x-tex\">P_{\\text{avg}}</annotation></semantics></math></span>"],"outUnits":["Hz","Ω","A","°","W"]}},{"id":"transformer","group":"in","title":"Transformers","blurb":"Two coils sharing a core trade voltage for current.","body":"\n<p>A transformer is two coils wound on a shared iron core. Alternating current in the primary coil makes a changing flux in the core, and that same flux threads the secondary coil, inducing an emf there. Since every turn sees the same <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mi mathvariant=\"normal\">Φ</mi><mi mathvariant=\"normal\">/</mi><mi>d</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">d\\Phi/dt</annotation></semantics></math></span>, the voltages are in the ratio of the turns:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mfrac><msub><mi>V</mi><mi>s</mi></msub><msub><mi>V</mi><mi>p</mi></msub></mfrac><mo>=</mo><mfrac><msub><mi>N</mi><mi>s</mi></msub><msub><mi>N</mi><mi>p</mi></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">\\frac{V_s}{V_p} = \\frac{N_s}{N_p}</annotation></semantics></math></span></div>\n<p>An ideal transformer wastes no energy, so power in equals power out, and the currents go the opposite way:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>V</mi><mi>p</mi></msub><msub><mi>I</mi><mi>p</mi></msub><mo>=</mo><msub><mi>V</mi><mi>s</mi></msub><msub><mi>I</mi><mi>s</mi></msub><mspace width=\"1em\"/><mo>⇒</mo><mspace width=\"1em\"/><mfrac><msub><mi>I</mi><mi>s</mi></msub><msub><mi>I</mi><mi>p</mi></msub></mfrac><mo>=</mo><mfrac><msub><mi>N</mi><mi>p</mi></msub><msub><mi>N</mi><mi>s</mi></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">V_p I_p = V_s I_s \\quad\\Rightarrow\\quad \\frac{I_s}{I_p} = \\frac{N_p}{N_s}</annotation></semantics></math></span></div>\n<p>Step-up transformers at power stations raise the voltage to hundreds of kilovolts for transmission, cutting current and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>I</mi><mn>2</mn></msup><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">I^2R</annotation></semantics></math></span> losses. Step-down transformers near homes bring it back to household levels. Transformers only work with AC, because a steady current makes no changing flux.</p>","related":["faraday","power","ac"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mi>s</mi></msub></mrow><annotation encoding=\"application/x-tex\">V_{s}</annotation></semantics></math></span>","voltage across the secondary coil","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mi>p</mi></msub></mrow><annotation encoding=\"application/x-tex\">V_{p}</annotation></semantics></math></span>","voltage across the primary coil","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>N</mi><mi>s</mi></
