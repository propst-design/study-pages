<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Notes: Physics</title>
<style>
:root{
  --bg:#f7f5f0; --panel:#ffffff; --ink:#1d1f24; --muted:#5d636e; --line:#e2ded4; --soft:#efece4;
  --accent:#2457c5; --note:#fbf6e6; --noteline:#e7d9a8;
  --es:#d0573a; --ci:#2f8f5b; --mg:#2c6fd1; --in:#8a4fc9; --wv:#c28a14;
  --pos:#d0453a; --neg:#2c6fd1; --lineclr:#3b4150;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15171b; --panel:#1d2025; --ink:#e7e6e1; --muted:#9aa0aa; --line:#30343b; --soft:#252930;
  --accent:#7aa5ff; --note:#26231a; --noteline:#4d4426;
  --es:#ef7c5e; --ci:#52c084; --mg:#6ea3f5; --in:#b48ae8; --wv:#e2b347;
  --pos:#ff7a6e; --neg:#73a8ff; --lineclr:#aab1bf; color-scheme: dark;
}}
:root[data-theme="dark"]{
  --bg:#15171b; --panel:#1d2025; --ink:#e7e6e1; --muted:#9aa0aa; --line:#30343b; --soft:#252930;
  --accent:#7aa5ff; --note:#26231a; --noteline:#4d4426;
  --es:#ef7c5e; --ci:#52c084; --mg:#6ea3f5; --in:#b48ae8; --wv:#e2b347;
  --pos:#ff7a6e; --neg:#73a8ff; --lineclr:#aab1bf; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
h1,h2,h3{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:600;line-height:1.2;letter-spacing:-.01em}
math{font-size:1.08em}
.layout{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);background:var(--panel);position:sticky;top:0;height:100vh;overflow:auto;padding:20px 16px}
.brand{display:flex;align-items:center;gap:10px;margin:0 0 16px;color:var(--ink)}
.brand svg{flex:none}
.brand b{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:19px;display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--muted)}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;margin-bottom:12px}
.navtop a{display:block;padding:5px 8px;border-radius:6px;color:var(--ink);font-size:14px}
.navsubj{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.navsubj>summary{font:600 15px/1.2 "Iowan Old Style",Palatino,Georgia,serif;color:var(--ink);padding:8px 8px}
.navgroup{margin:2px 0 4px 6px}
.navgroup>summary{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:5px 8px}
nav summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:7px;border-radius:6px;user-select:none}
nav summary::-webkit-details-marker{display:none}
nav summary::before{content:"";width:6px;height:6px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-right:2px}
nav details[open]>summary::before{transform:rotate(45deg)}
nav summary:hover{background:var(--soft)}
nav .cnt{margin-left:auto;font:500 11px -apple-system,sans-serif;color:var(--muted);letter-spacing:0;text-transform:none}
.navtools{display:flex;gap:6px;margin:10px 0 0}
.navtools button{flex:1;font:inherit;font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:7px;padding:5px 6px;cursor:pointer}
.navtools button:hover{color:var(--ink);border-color:var(--accent)}
.greek td:first-child{width:56px;text-align:center}
.syms td:first-child{width:90px;text-align:center;white-space:nowrap}
.syms td:first-child math{font-size:1.15em}
.syms td.unit{white-space:nowrap;color:var(--muted);font-size:14px}
.syms td{font-size:15px;padding:6px 10px}
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary h3{margin:0;flex:1}
details.fold>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;margin:0 6px 4px}
details.fold:not([open])>summary::after{transform:rotate(-45deg);margin-bottom:0}
details.fold[open]>summary{margin-bottom:12px}
.cnt2{font:500 13px -apple-system,sans-serif;color:var(--muted);margin-left:4px}
.greek td:first-child math{font-size:1.6em}
.greek .gname{font-weight:600}
.greek .pron{color:var(--muted);font-size:13px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.tabs a{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--ink);background:var(--panel)}.tabs a.on{border-color:var(--ink);font-weight:600}
h2.subj{font-size:26px;margin:34px 0 4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
nav a.item{display:block;padding:4px 8px 4px 22px;border-radius:6px;color:var(--ink);font-size:14px}
nav a.item:hover,.navtop a:hover{background:var(--soft);text-decoration:none}
nav a.active{background:var(--soft);font-weight:600}
main{padding:36px 48px 80px;max-width:900px;width:100%;min-width:0}
.crumb{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:6px}
h1.title{font-size:38px;margin:0 0 6px}
.lede{color:var(--muted);font-size:18px;margin:0 0 24px}
.body p{margin:0 0 14px}
.eq{overflow-x:auto;overflow-y:hidden;padding:10px 4px;margin:6px 0 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;text-align:center}
.eq math{font-size:1.18em}
.note{background:var(--note);border:1px solid var(--noteline);border-radius:10px;padding:12px 14px;margin:6px 0 18px;font-size:15px}
.t{border-collapse:collapse;width:100%;margin:6px 0 18px;font-size:15px;display:block;overflow-x:auto}
.t th,.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
.t th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;margin:26px 0}
.card h3{margin:0 0 12px;font-size:20px;display:flex;align-items:center;gap:8px}
.tag{font:600 11px/1 -apple-system,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 8px}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.fields label{display:grid;grid-template-columns:90px 1fr 70px;align-items:center;gap:8px;margin-bottom:8px}
.fields input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:15px ui-monospace,SFMono-Regular,Menlo,monospace}
.fields input.bad{border-color:var(--es)}
.fields .u,.outs .u{color:var(--muted);font-size:13px}
.outs{background:var(--soft);border-radius:10px;padding:10px 12px}
.outs div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.outs div:last-child{border-bottom:0}
.outs .v{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;text-align:right}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.related{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--ink)}
.chip:hover{border-color:var(--accent);text-decoration:none}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:30px;font-size:14px}
.pager a{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel);color:var(--ink);flex:1}
.pager a.next{text-align:right}
.pager small{display:block;color:var(--muted);font-size:12px}
.sim{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0 20px}
.sim canvas{width:100%;display:block;border-radius:8px;background:var(--bg);touch-action:none}
.simbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:10px;font-size:14px}
.simbar button{font:inherit;font-size:13px;padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.simbar button:hover{border-color:var(--accent)}
.simbar label{display:flex;align-items:center;gap:8px}
.simbar input[type=range]{width:130px}
.simbar .val{font:13px ui-monospace,Menlo,monospace;color:var(--muted);min-width:64px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:20px}
.gcard{background:var(--panel);border:1px solid var(--line);border-top:4px solid;border-radius:12px;padding:14px 16px}
.gcard h3{margin:0 0 8px;font-size:19px}
.gcard a{display:block;font-size:14px;padding:2px 0}
.map{width:100%;height:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.map .edge{stroke:var(--line);stroke-width:1.6}
.map .edge.hot{stroke:var(--ink);stroke-width:2.2}
.map g.node{cursor:pointer}
.map g.node rect{fill:var(--bg);stroke-width:2}
.map g.node:hover rect{fill:var(--soft)}
.map text{fill:var(--ink);font:600 13px -apple-system,sans-serif;pointer-events:none}
.mapwrap{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin:10px 0}
.legend span{display:flex;align-items:center;gap:6px}
.consts td:first-child{width:40%}
.menu-btn{display:none}
.theme-btn{margin-top:18px;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:7px;padding:6px 10px;cursor:pointer;width:100%}
.empty{color:var(--muted);font-size:14px;padding:6px 8px}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}
  .brand{margin:0}
  .menu-btn{display:block;margin-left:auto;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px}
  #navpanel{display:none;margin-top:12px} aside.open #navpanel{display:block}
  main{padding:20px 16px 60px}
  h1.title{font-size:30px}
  .calc{grid-template-columns:1fr}
  .fields label{grid-template-columns:70px 1fr 60px}
}
</style>
</head>

row><mo>−</mo><mn>27</mn></mrow></msup><mtext> kg</mtext></mrow><annotation encoding="application/x-tex">1.673\times10^{-27}\ \text{kg}</annotation></semantics></math></span></td></tr><tr><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>h</mi></mrow><annotation encoding="application/x-tex">h</annotation></semantics></math></span></td><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>6.626</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>34</mn></mrow></msup><mtext> J</mtext><mo lspace="0em" rspace="0em">⋅</mo><mtext>s</mtext></mrow><annotation encoding="application/x-tex">6.626\times10^{-34}\ \text{J}{\cdot}\text{s}</annotation></semantics></math></span></td></tr><tr><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">ℏ</mi><mo>=</mo><mi>h</mi><mi mathvariant="normal">/</mi><mn>2</mn><mi>π</mi></mrow><annotation encoding="application/x-tex">\hbar = h/2\pi</annotation></semantics></math></span></td><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1.055</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>34</mn></mrow></msup><mtext> J</mtext><mo lspace="0em" rspace="0em">⋅</mo><mtext>s</mtext></mrow><annotation encoding="application/x-tex">1.055\times10^{-34}\ \text{J}{\cdot}\text{s}</annotation></semantics></math></span></td></tr><tr><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>k</mi><mi>B</mi></msub></mrow><annotation encoding="application/x-tex">k_B</annotation></semantics></math></span></td><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1.381</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>23</mn></mrow></msup><mtext> J/K</mtext></mrow><annotation encoding="application/x-tex">1.381\times10^{-23}\ \text{J/K}</annotation></semantics></math></span></td></tr><tr><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>R</mi></mrow><annotation encoding="application/x-tex">R</annotation></semantics></math></span></td><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>8.314</mn><mtext> J/(mol</mtext><mo lspace="0em" rspace="0em">⋅</mo><mtext>K)</mtext></mrow><annotation encoding="application/x-tex">8.314\ \text{J/(mol}{\cdot}\text{K)}</annotation></semantics></math></span></td></tr><tr><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>N</mi><mi>A</mi></msub></mrow><annotation encoding="application/x-tex">N_A</annotation></semantics></math></span></td><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>6.022</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mn>23</mn></msup><mtext> </mtext><msup><mtext>mol</mtext><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow><annotation encoding="application/x-tex">6.022\times10^{23}\ \text{mol}^{-1}</annotation></semantics></math></span></td></tr><tr><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>σ</mi></mrow><annotation encoding="application/x-tex">\sigma</annotation></semantics></math></span></td><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>5.670</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>8</mn></mrow></msup><mtext> </mtext><msup><mtext>W/(m</mtext><mn>2</mn></msup><mrow></mrow><mo lspace="0em" rspace="0em">⋅</mo><msup><mtext>K</mtext><mn>4</mn></msup><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">5.670\times10^{-8}\ \text{W/(m}^2\text{}{\cdot}\text{K}^4)</annotation></semantics></math></span></td></tr><tr><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>m</mi><mi>n</mi></msub></mrow><annotation encoding="application/x-tex">m_n</annotation></semantics></math></span></td><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1.675</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>27</mn></mrow></msup><mtext> kg</mtext></mrow><annotation encoding="application/x-tex">1.675\times10^{-27}\ \text{kg}</annotation></semantics></math></span></td></tr><tr><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mtext> u</mtext></mrow><annotation encoding="application/x-tex">1\ \text{u}</annotation></semantics></math></span></td><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1.661</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>27</mn></mrow></msup><mtext> kg</mtext><mo>=</mo><mn>931.5</mn><mtext> MeV</mtext><mi mathvariant="normal">/</mi><msup><mi>c</mi><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">1.661\times10^{-27}\ \text{kg} = 931.5\ \text{MeV}/c^2</annotation></semantics></math></span></td></tr><tr><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>G</mi></mrow><annotation encoding="application/x-tex">G</annotation></semantics></math></span></td><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>6.674</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>11</mn></mrow></msup><mtext> N</mtext><mo lspace="0em" rspace="0em">⋅</mo><msup><mtext>m</mtext><mn>2</mn></msup><mi mathvariant="normal">/</mi><msup><mtext>kg</mtext><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">6.674\times10^{-11}\ \text{N}{\cdot}\text{m}^2/\text{kg}^2</annotation></semantics></math></span></td></tr><tr><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>g</mi><mtext> (standard)</mtext></mrow><annotation encoding="application/x-tex">g\ \text{(standard)}</annotation></semantics></math></span></td><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>9.807</mn><mtext> </mtext><msup><mtext>m/s</mtext><mn>2</mn></msup></mrow><annotation encoding="application/x-tex">9.807\ \text{m/s}^2</annotation></semantics></math></span></td></tr><tr><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>M</mi><mo lspace="0em" rspace="0em">⊕</mo></msub></mrow><annotation encoding="application/x-tex">M_{\oplus}</annotation></semantics></math></span></td><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>5.972</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mn>24</mn></msup><mtext> kg</mtext></mrow><annotation encoding="application/x-tex">5.972\times10^{24}\ \text{kg}</annotation></semantics></math></span></td></tr><tr><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>R</mi><mo lspace="0em" rspace="0em">⊕</mo></msub></mrow><annotation encoding="application/x-tex">R_{\oplus}</annotation></semantics></math></span></td><td><span class="katex"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>6.371</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mn>6</mn></msup><mtext> m</mtext></mrow><annotation encoding="application/x-tex">6.371\times10^{6}\ \text{m}</annotation></semantics></math></span></td></tr></table>

<script>
const SUBJECTS = [{"id":"mech","name":"Mechanics","blurb":"Motion, forces, energy, rotation and gravity."},{"id":"wav","name":"Waves, Sound & Light","blurb":"Vibrations, sound, rays, lenses and the wave nature of light."},{"id":"em","name":"Electricity & Magnetism","blurb":"From static charge to light itself."},{"id":"mod","name":"Heat & Modern Physics","blurb":"Thermodynamics, relativity, quantum physics and the nucleus."}];
const GROUPS = [{"id":"mo","name":"Motion","color":"ci","subject":"mech"},{"id":"fo","name":"Forces","color":"es","subject":"mech"},{"id":"en","name":"Energy & Momentum","color":"wv","subject":"mech"},{"id":"ro","name":"Rotation","color":"in","subject":"mech"},{"id":"os","name":"Oscillations & Gravity","color":"mg","subject":"mech"},{"id":"wa","name":"Wave Basics","color":"ci","subject":"wav"},{"id":"so","name":"Sound","color":"wv","subject":"wav"},{"id":"li","name":"Rays & Optics","color":"es","subject":"wav"},{"id":"wo","name":"Wave Optics","color":"in","subject":"wav"},{"id":"es","name":"Electrostatics","color":"es","subject":"em"},{"id":"ci","name":"Circuits","color":"ci","subject":"em"},{"id":"mg","name":"Magnetism","color":"mg","subject":"em"},{"id":"in","name":"Induction & AC","color":"in","subject":"em"},{"id":"wv","name":"Fields & Waves","color":"wv","subject":"em"},{"id":"th","name":"Heat & Temperature","color":"es","subject":"mod"},{"id":"td","name":"Thermodynamics","color":"wv","subject":"mod"},{"id":"rl","name":"Relativity","color":"mg","subject":"mod"},{"id":"qu","name":"Quantum & Atoms","color":"in","subject":"mod"},{"id":"nu","name":"Nuclear Physics","color":"ci","subject":"mod"}];
const TOPICS = [{"id":"kinematics","group":"mo","title":"Motion in a Line","blurb":"Position, velocity and acceleration, and the equations for constant acceleration.","body":"\n<p>Kinematics describes motion without asking what causes it. Three quantities do the work: <b>position</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>, <b>velocity</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span> (how fast position changes) and <b>acceleration</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span> (how fast velocity changes).</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>v</mi><mo>=</mo><mfrac><mrow><mi>d</mi><mi>x</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>a</mi><mo>=</mo><mfrac><mrow><mi>d</mi><mi>v</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">v = \\frac{dx}{dt}, \\qquad a = \\frac{dv}{dt}</annotation></semantics></math></span></div>\n<p>When acceleration is constant, as for a dropped object or a car braking steadily, four equations connect everything. Here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>x</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">x_0</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">v_0</annotation></semantics></math></span> are the position and velocity at <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">t = 0</annotation></semantics></math></span>. Each equation leaves out a different variable, so pick the one missing the quantity you don't know and don't need:</p>\n<table class=\"t\">\n<tr><th>Equation</th><th>Leaves out</th></tr>\n<tr><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>=</mo><msub><mi>v</mi><mn>0</mn></msub><mo>+</mo><mi>a</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">v = v_0 + a t</annotation></semantics></math></span></td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span></td></tr>\n<tr><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><msub><mi>x</mi><mn>0</mn></msub><mo>+</mo><msub><mi>v</mi><mn>0</mn></msub><mi>t</mi><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>a</mi><msup><mi>t</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">x = x_0 + v_0 t + \\tfrac12 a t^2</annotation></semantics></math></span></td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span></td></tr>\n<tr><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>v</mi><mn>2</mn></msup><mo>=</mo><msubsup><mi>v</mi><mn>0</mn><mn>2</mn></msubsup><mo>+</mo><mn>2</mn><mi>a</mi><mtext> </mtext><mo stretchy=\"false\">(</mo><mi>x</mi><mo>−</mo><msub><mi>x</mi><mn>0</mn></msub><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">v^2 = v_0^2 + 2a\\,(x - x_0)</annotation></semantics></math></span></td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span></td></tr>\n<tr><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><msub><mi>x</mi><mn>0</mn></msub><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo stretchy=\"false\">(</mo><msub><mi>v</mi><mn>0</mn></msub><mo>+</mo><mi>v</mi><mo stretchy=\"false\">)</mo><mtext> </mtext><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">x = x_0 + \\tfrac12 (v_0 + v)\\,t</annotation></semantics></math></span></td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span></td></tr>\n</table>\n<p>On a position-time graph, velocity is the slope. On a velocity-time graph, acceleration is the slope and displacement is the area under the line.</p>\n<div class=\"note\"><b>Free fall.</b> Near Earth's surface, ignoring air resistance, everything accelerates downward at <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi><mo>≈</mo><mn>9.81</mn><mtext> </mtext><msup><mtext>m/s</mtext><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">g \\approx 9.81\\ \\text{m/s}^2</annotation></semantics></math></span>, whatever its mass.</div>","related":["projectile","newton","circular"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","velocity: how fast position changes, with sign giving direction","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","an infinitesimally small change (used in derivatives such as <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mi>x</mi><mi mathvariant=\"normal\">/</mi><mi>d</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">dx/dt</annotation></semantics></math></span>)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>","position along the line of motion","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","time elapsed since <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">t = 0</annotation></semantics></math></span>","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>","acceleration: how fast velocity changes (constant in the four equations)","m/s²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>x</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">x_{0}</annotation></semantics></math></span>","initial position, at <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">t = 0</annotation></semantics></math></span>","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">v_{0}</annotation></semantics></math></span>","initial velocity, at <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">t = 0</annotation></semantics></math></span>","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">g</annotation></semantics></math></span>","gravitational acceleration near Earth’s surface, ≈ 9.81 m/s²","m/s²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","“change in”: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>x</mi><mo>=</mo><mi>x</mi><mo>−</mo><msub><mi>x</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\Delta x = x - x_0</annotation></semantics></math></span> is the displacement",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>v</mi><mo stretchy=\"true\">‾</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\overline{v}</annotation></semantics></math></span>","average velocity over the time <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","m/s"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","capital delta","DEL-tuh","“change in”: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta x</annotation></semantics></math></span> means the final value of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span> minus the starting value."]],"calc":{"title":"Constant acceleration","inputs":[{"k":"v0","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">v_0</annotation></semantics></math></span>","unit":"m/s","d":"0"},{"k":"a","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>","unit":"m/s²","d":"9.81"},{"k":"t","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","unit":"s","d":"3"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta x</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>v</mi><mo>ˉ</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\bar v</annotation></semantics></math></span>"],"outUnits":["m/s","m","m/s"]}},{"id":"projectile","group":"mo","title":"Projectile Motion","blurb":"Sideways motion and vertical motion carry on independently.","body":"\n<p>Throw a ball and gravity only pulls down. So the horizontal motion has no acceleration at all, while the vertical motion is ordinary free fall. Treat the two separately and the problem splits into two easy ones. For a launch from the origin at speed <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">v_0</annotation></semantics></math></span> and angle <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span> above the horizontal, with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi></mrow><annotation encoding=\"application/x-tex\">y</annotation></semantics></math></span> measured upward:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>x</mi><mo>=</mo><msub><mi>v</mi><mn>0</mn></msub><mi>cos</mi><mo>⁡</mo><mi>θ</mi><mtext>  </mtext><mi>t</mi><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>y</mi><mo>=</mo><msub><mi>v</mi><mn>0</mn></msub><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mtext>  </mtext><mi>t</mi><mo>−</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi>g</mi><msup><mi>t</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">x = v_0\\cos\\theta\\;t, \\qquad y = v_0\\sin\\theta\\;t - \\tfrac12 g t^2</annotation></semantics></math></span></div>\n<p>Eliminating <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span> shows the path is a parabola. For a launch and landing at the same height:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>T</mi><mo>=</mo><mfrac><mrow><mn>2</mn><msub><mi>v</mi><mn>0</mn></msub><mi>sin</mi><mo>⁡</mo><mi>θ</mi></mrow><mi>g</mi></mfrac><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>H</mi><mo>=</mo><mfrac><mrow><msubsup><mi>v</mi><mn>0</mn><mn>2</mn></msubsup><msup><mrow><mi>sin</mi><mo>⁡</mo></mrow><mn>2</mn></msup><mi>θ</mi></mrow><mrow><mn>2</mn><mi>g</mi></mrow></mfrac><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>R</mi><mo>=</mo><mfrac><mrow><msubsup><mi>v</mi><mn>0</mn><mn>2</mn></msubsup><mi>sin</mi><mo>⁡</mo><mn>2</mn><mi>θ</mi></mrow><mi>g</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">T = \\frac{2 v_0 \\sin\\theta}{g}, \\qquad H = \\frac{v_0^2\\sin^2\\theta}{2g}, \\qquad R = \\frac{v_0^2 \\sin 2\\theta}{g}</annotation></semantics></math></span></div>\n<p>The range is largest at 45°, and complementary angles (say 30° and 60°) land in the same place. The higher one just takes longer. Real projectiles fall short of these numbers because of air drag, and in practice the best angle is usually somewhat below 45°.</p>\n<div class=\"sim\" data-sim=\"projectile\"></div>","related":["kinematics","energy","circular"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>","horizontal distance from the launch point","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">v_{0}</annotation></semantics></math></span>","launch speed","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","launch angle above the horizontal","°"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","time since launch","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi></mrow><annotation encoding=\"application/x-tex\">y</annotation></semantics></math></span>","height above the launch point, measured upward","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">g</annotation></semantics></math></span>","gravitational acceleration, ≈ 9.81 m/s² on Earth","m/s²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","time of flight, launch to landing at the same height","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>H</mi></mrow><annotation encoding=\"application/x-tex\">H</annotation></semantics></math></span>","maximum height reached above the launch level","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","range: horizontal distance travelled before landing","m"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","theta","THAY-tuh","the launch angle, measured up from the horizontal."]],"calc":{"title":"Level-ground launch","inputs":[{"k":"v0","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">v_0</annotation></semantics></math></span>","unit":"m/s","d":"20"},{"k":"th","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","unit":"°","d":"40"},{"k":"g","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">g</annotation></semantics></math></span>","unit":"m/s²","d":"9.81"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>H</mi></mrow><annotation encoding=\"application/x-tex\">H</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>"],"outUnits":["s","m","m"]}},{"id":"circular","group":"mo","title":"Circular Motion","blurb":"Moving in a circle at steady speed still means accelerating, toward the centre.","body":"\n<p>An object moving round a circle at constant speed keeps changing direction, so its velocity changes and it is accelerating. That acceleration always points to the centre of the circle (it's called <b>centripetal</b>, \"centre-seeking\"):</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>a</mi><mi>c</mi></msub><mo>=</mo><mfrac><msup><mi>v</mi><mn>2</mn></msup><mi>r</mi></mfrac><mo>=</mo><msup><mi>ω</mi><mn>2</mn></msup><mi>r</mi><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>v</mi><mo>=</mo><mi>ω</mi><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">a_c = \\frac{v^2}{r} = \\omega^2 r, \\qquad v = \\omega r</annotation></semantics></math></span></div>\n<p>Here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span> is the angular speed in radians per second. One trip around takes the period <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><mi>r</mi><mi mathvariant=\"normal\">/</mi><mi>v</mi><mo>=</mo><mn>2</mn><mi>π</mi><mi mathvariant=\"normal\">/</mi><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">T = 2\\pi r / v = 2\\pi/\\omega</annotation></semantics></math></span>.</p>\n<p>By Newton's second law, something must supply a net inward force <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mi>c</mi></msub><mo>=</mo><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup><mi mathvariant=\"normal\">/</mi><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">F_c = m v^2/r</annotation></semantics></math></span>. It's never a new kind of force, just whichever real force is doing the job: tension in a string, friction on a car's tyres, gravity for a satellite, the normal force from a loop-the-loop track.</p>\n<div class=\"note\"><b>No outward force.</b> The \"pushed outward\" feeling on a turning bus is your body's inertia trying to go straight while the bus turns under you.</div>","related":["kinematics","newton","orbits","torque"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>c</mi></msub></mrow><annotation encoding=\"application/x-tex\">a_{c}</annotation></semantics></math></span>","centripetal acceleration, pointing to the circle’s centre","m/s²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","speed along the circle","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","radius of the circle","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>","angular speed: angle swept per second","rad/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","period: time for one full trip around","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","circle constant ≈ 3.14159",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mi>c</mi></msub></mrow><annotation encoding=\"application/x-tex\">F_{c}</annotation></semantics></math></span>","net inward (centripetal) force needed to keep the object on the circle","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","mass of the moving object","kg"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","pi","pie","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span> (a circumference divided by its diameter). It appears wherever circles, rotation or spreading in all directions are involved."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>","omega","oh-MAY-guh","angular speed: the angle swept per second, in radians per second."]],"calc":{"title":"Centripetal force","inputs":[{"k":"m","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","unit":"kg","d":"1200"},{"k":"v","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","unit":"m/s","d":"20"},{"k":"r","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","unit":"m","d":"50"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>c</mi></msub></mrow><annotation encoding=\"application/x-tex\">a_c</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mi>c</mi></msub></mrow><annotation encoding=\"application/x-tex\">F_c</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>"],"outUnits":["m/s²","N","s","rad/s"]}},{"id":"newton","group":"fo","title":"Newton's Laws","blurb":"Three rules linking force to changes in motion.","body":"\n<p><b>First law (inertia).</b> An object stays at rest, or keeps moving in a straight line at constant speed, unless a net force acts on it. Motion doesn't need a force; <i>changes</i> in motion do.</p>\n<p><b>Second law.</b> The net force on an object equals its mass times its acceleration:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mo>∑</mo><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover><mo>=</mo><mi>m</mi><mover accent=\"true\"><mi>a</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\sum \\vec F = m\\vec a</annotation></semantics></math></span></div>\n<p>Force is measured in newtons: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mtext> N</mtext><mo>=</mo><mn>1</mn><mtext> kg</mtext><mo lspace=\"0em\" rspace=\"0em\">⋅</mo><msup><mtext>m/s</mtext><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">1\\ \\text{N} = 1\\ \\text{kg}{\\cdot}\\text{m/s}^2</annotation></semantics></math></span>. Weight is the force of gravity on a mass, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>W</mi><mo>=</mo><mi>m</mi><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">W = mg</annotation></semantics></math></span>: it is the force that would give the object acceleration <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">g</annotation></semantics></math></span> if nothing else acted.</p>\n<p><b>Third law.</b> Forces come in pairs. If A pushes on B, B pushes back on A with a force of equal size in the opposite direction. The two forces act on <i>different</i> objects, so they never cancel each other out.</p>\n<p><b>How to use them:</b> draw a free-body diagram for each object, showing every force acting <i>on</i> it. Choose axes, add up components, and set each sum equal to <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">m a</annotation></semantics></math></span> along that axis.</p>","related":["kinematics","friction","incline","momentum","circular"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{F}</annotation></semantics></math></span>","force vector; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>∑</mo><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\sum \\vec F</annotation></semantics></math></span> is the net force","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","mass of the object","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>a</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{a}</annotation></semantics></math></span>","acceleration vector; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span> alone is its magnitude or a component","m/s²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>W</mi></mrow><annotation encoding=\"application/x-tex\">W</annotation></semantics></math></span>","weight: the gravitational force on the mass, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">mg</annotation></semantics></math></span>","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">g</annotation></semantics></math></span>","gravitational acceleration ≈ 9.81 m/s²","m/s²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>","acceleration (magnitude, or component along an axis)","m/s²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mtext>net</mtext></msub></mrow><annotation encoding=\"application/x-tex\">F_{\\text{net}}</annotation></semantics></math></span>","net force: the sum of all forces on the object","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","time for which the net force acts","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","“change in”: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta v</annotation></semantics></math></span> is the change in velocity",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","velocity of the object","m/s"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","capital delta","DEL-tuh","“change in”: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta x</annotation></semantics></math></span> means the final value of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span> minus the starting value."]],"calc":{"title":"Second law","inputs":[{"k":"F","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mtext>net</mtext></msub></mrow><annotation encoding=\"application/x-tex\">F_{\\text{net}}</annotation></semantics></math></span>","unit":"N","d":"500"},{"k":"m","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","unit":"kg","d":"70"},{"k":"t","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","unit":"s","d":"2"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>W</mi><mo>=</mo><mi>m</mi><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">W = mg</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>v</mi><mtext> in </mtext><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta v\\ \\text{in}\\ t</annotation></semantics></math></span>"],"outUnits":["m/s²","N","m/s"]}},{"id":"friction","group":"fo","title":"Friction","blurb":"Contact forces that resist sliding between surfaces.","body":"\n<p>When two surfaces press together, friction acts along the contact, opposing sliding. It comes in two forms.</p>\n<p><b>Static friction</b> holds things still. It adjusts to whatever is needed, up to a maximum:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>f</mi><mi>s</mi></msub><mo>≤</mo><msub><mi>μ</mi><mi>s</mi></msub><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">f_s \\le \\mu_s N</annotation></semantics></math></span></div>\n<p><b>Kinetic friction</b> acts once sliding starts, and is roughly constant:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>f</mi><mi>k</mi></msub><mo>=</mo><msub><mi>μ</mi><mi>k</mi></msub><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">f_k = \\mu_k N</annotation></semantics></math></span></div>\n<p><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span> is the normal force, the push of the surface perpendicular to itself, and the <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math></span> values are coefficients that depend on the pair of materials. Usually <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mi>k</mi></msub><mo>&lt;</mo><msub><mi>μ</mi><mi>s</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_k &lt; \\mu_s</annotation></semantics></math></span>, which is why a heavy box is hardest to get moving and then slides more easily. To a good approximation friction doesn't depend on the contact area.</p>\n<table class=\"t\">\n<tr><th>Surfaces</th><th><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mi>s</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_s</annotation></semantics></math></span></th><th><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mi>k</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_k</annotation></semantics></math></span></th></tr>\n<tr><td>Rubber on dry concrete</td><td>~1.0</td><td>~0.8</td></tr>\n<tr><td>Wood on wood</td><td>~0.4</td><td>~0.3</td></tr>\n<tr><td>Steel on steel (dry)</td><td>~0.7</td><td>~0.5</td></tr>\n<tr><td>Ice on ice</td><td>~0.1</td><td>~0.03</td></tr>\n</table>\n<p class=\"hint\">Typical textbook values; real ones vary a lot with surface condition.</p>","related":["newton","incline","work"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mi>s</mi></msub></mrow><annotation encoding=\"application/x-tex\">f_{s}</annotation></semantics></math></span>","static friction force: whatever is needed to prevent sliding","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mi>s</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_{s}</annotation></semantics></math></span>","coefficient of static friction for the pair of surfaces",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>","normal force: the surface’s push perpendicular to itself (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">mg</annotation></semantics></math></span> on a level floor)","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mi>k</mi></msub></mrow><annotation encoding=\"application/x-tex\">f_{k}</annotation></semantics></math></span>","kinetic friction force on a sliding object","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mi>k</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_{k}</annotation></semantics></math></span>","coefficient of kinetic friction for the pair of surfaces",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math></span>","friction coefficient in general (static or kinetic)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","mass of the box","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mtext>push</mtext></msub></mrow><annotation encoding=\"application/x-tex\">F_{\\text{push}}</annotation></semantics></math></span>","horizontal applied push on the box","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mrow><mi>s</mi><mo separator=\"true\">,</mo><mi>max</mi><mo>⁡</mo></mrow></msub></mrow><annotation encoding=\"application/x-tex\">f_{s,\\max}</annotation></semantics></math></span>","maximum static friction, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mi>s</mi></msub><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">\\mu_s N</annotation></semantics></math></span>; a larger push starts sliding","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>","acceleration of the box once it slides","m/s²"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math></span>","mu","myoo","coefficient of friction, a pure number for a pair of surfaces. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mi>s</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_s</annotation></semantics></math></span> is static (before slipping), <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mi>k</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_k</annotation></semantics></math></span> is kinetic (while sliding)."]],"calc":{"title":"Box on a level floor","inputs":[{"k":"m","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","unit":"kg","d":"40"},{"k":"ms","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mi>s</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_s</annotation></semantics></math></span>","unit":"","d":"0.5"},{"k":"mk","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mi>k</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_k</annotation></semantics></math></span>","unit":"","d":"0.35"},{"k":"F","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mtext>push</mtext></msub></mrow><annotation encoding=\"application/x-tex\">F_{\\text{push}}</annotation></semantics></math></span>","unit":"N","d":"250"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mrow><mi>s</mi><mo separator=\"true\">,</mo><mi>max</mi><mo>⁡</mo></mrow></msub></mrow><annotation encoding=\"application/x-tex\">f_{s,\\max}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>moves?</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{moves?}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>"],"outUnits":["N","N","","m/s²"]}},{"id":"incline","group":"fo","title":"Inclined Planes","blurb":"Tilting a surface splits gravity into along-slope and into-slope parts.","body":"\n<p>On a slope at angle <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>, the easiest axes run along the slope and perpendicular to it. Gravity <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">mg</annotation></semantics></math></span> splits into two pieces:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>F</mi><mo lspace=\"0em\" rspace=\"0em\">∥</mo></msub><mo>=</mo><mi>m</mi><mi>g</mi><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo separator=\"true\">,</mo><mspace width=\"2em\"/><msub><mi>F</mi><mo lspace=\"0em\" rspace=\"0em\">⊥</mo></msub><mo>=</mo><mi>m</mi><mi>g</mi><mi>cos</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">F_{\\parallel} = mg\\sin\\theta, \\qquad F_{\\perp} = mg\\cos\\theta</annotation></semantics></math></span></div>\n<p>The surface pushes back with a normal force <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi><mo>=</mo><mi>m</mi><mi>g</mi><mi>cos</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">N = mg\\cos\\theta</annotation></semantics></math></span>, so friction is weaker on a steeper slope. With no friction, a block slides down with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mi>g</mi><mi>sin</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">a = g\\sin\\theta</annotation></semantics></math></span>. With kinetic friction (coefficient <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mi>k</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_k</annotation></semantics></math></span>), taking down the slope as positive:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>a</mi><mo>=</mo><mi>g</mi><mtext> </mtext><mo stretchy=\"false\">(</mo><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo>−</mo><msub><mi>μ</mi><mi>k</mi></msub><mi>cos</mi><mo>⁡</mo><mi>θ</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">a = g\\,(\\sin\\theta - \\mu_k\\cos\\theta)</annotation></semantics></math></span></div>\n<p>A block at rest starts to slip when the slope reaches the angle where gravity's along-slope part just beats the maximum static friction:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>tan</mi><mo>⁡</mo><msub><mi>θ</mi><mtext>slip</mtext></msub><mo>=</mo><msub><mi>μ</mi><mi>s</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\tan\\theta_{\\text{slip}} = \\mu_s</annotation></semantics></math></span></div>\n<p>Tilting a board until something slides is a quick way to measure <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mi>s</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_s</annotation></semantics></math></span>.</p>","related":["friction","newton","energy","rolling"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mo lspace=\"0em\" rspace=\"0em\">∥</mo></msub></mrow><annotation encoding=\"application/x-tex\">F_{\\parallel}</annotation></semantics></math></span>","component of gravity along the slope (downhill)","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","mass of the block","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">g</annotation></semantics></math></span>","gravitational acceleration ≈ 9.81 m/s²","m/s²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","angle of the slope above horizontal","°"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mo lspace=\"0em\" rspace=\"0em\">⊥</mo></msub></mrow><annotation encoding=\"application/x-tex\">F_{\\perp}</annotation></semantics></math></span>","component of gravity perpendicular to the slope, into it","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>","acceleration of the block down the slope","m/s²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mi>k</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_{k}</annotation></semantics></math></span>","coefficient of kinetic friction",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mtext>slip</mtext></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_{\\text{slip}}</annotation></semantics></math></span>","slope angle at which a resting block starts to slide","°"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mi>s</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_{s}</annotation></semantics></math></span>","coefficient of static friction",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>","normal force from the slope, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><mi>g</mi><mi>c</mi><mi>o</mi><mi>s</mi><mi>h</mi><mi>e</mi><mi>t</mi><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">mgcos\theta</annotation></semantics></math></span>","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","length of the slope the block slides down","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mtext>bottom</mtext></msub></mrow><annotation encoding=\"application/x-tex\">v_{\\text{bottom}}</annotation></semantics></math></span>","speed at the bottom after sliding from rest","m/s"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","theta","THAY-tuh","the angle of the slope above the horizontal."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math></span>","mu","myoo","coefficient of friction: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mi>s</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_s</annotation></semantics></math></span> static, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mi>k</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_k</annotation></semantics></math></span> kinetic."]],"calc":{"title":"Block on a slope","inputs":[{"k":"th","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","unit":"°","d":"30"},{"k":"mk","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mi>k</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_k</annotation></semantics></math></span>","unit":"","d":"0.2"},{"k":"ms","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mi>s</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_s</annotation></semantics></math></span>","unit":"","d":"0.4"},{"k":"L","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mtext> (slope length)</mtext></mrow><annotation encoding=\"application/x-tex\">L\\ \\text{(slope length)}</annotation></semantics></math></span>","unit":"m","d":"5"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mtext>slip</mtext></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_{\\text{slip}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mtext>bottom</mtext></msub><mtext> </mtext><mo stretchy=\"false\">(</mo><mtext>from rest</mtext><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">v_{\\text{bottom}}\\ (\\text{from rest})</annotation></semantics></math></span>"],"outUnits":["m/s²","°","m/s"]}},{"id":"work","group":"en","title":"Work","blurb":"A force does work when it moves something along its direction.","body":"\n<p>Work measures energy transferred by a force. Only the part of the force along the displacement <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>d</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec d</annotation></semantics></math></span> counts, where <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span> is the angle between the force and the displacement:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>W</mi><mo>=</mo><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover><mo>⋅</mo><mover accent=\"true\"><mi>d</mi><mo>⃗</mo></mover><mo>=</mo><mi>F</mi><mi>d</mi><mi>cos</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">W = \\vec F\\cdot\\vec d = F d\\cos\\theta</annotation></semantics></math></span></div>\n<p>Work is measured in joules: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mtext> J</mtext><mo>=</mo><mn>1</mn><mtext> N</mtext><mo lspace=\"0em\" rspace=\"0em\">⋅</mo><mtext>m</mtext></mrow><annotation encoding=\"application/x-tex\">1\\ \\text{J} = 1\\ \\text{N}{\\cdot}\\text{m}</annotation></semantics></math></span>. A force perpendicular to the motion does no work (carrying a bag across a level floor, or gravity on a circular orbit). A force opposing the motion, like friction, does negative work and takes energy away.</p>\n<p>When the force varies, add it up piece by piece, which is the area under a force-position graph:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>W</mi><mo>=</mo><mo>∫</mo><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover><mo>⋅</mo><mi>d</mi><mover accent=\"true\"><mi>r</mi><mo>⃗</mo></mover><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mtext>stretching a spring by </mtext><mi>x</mi><mtext>: </mtext><mi>W</mi><mo>=</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi>k</mi><msup><mi>x</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">W = \\int \\vec F\\cdot d\\vec r, \\qquad \\text{stretching a spring by } x\\text{: } W = \\tfrac12 k x^2</annotation></semantics></math></span></div>\n<p>The <b>work-energy theorem</b> ties work to motion: the net work on an object equals its change in kinetic energy, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>W</mi><mtext>net</mtext></msub><mo>=</mo><mi mathvariant=\"normal\">Δ</mi><mi>K</mi></mrow><annotation encoding=\"application/x-tex\">W_{\\text{net}} = \\Delta K</annotation></semantics></math></span>.</p>","related":["energy","mpower","friction"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>W</mi></mrow><annotation encoding=\"application/x-tex\">W</annotation></semantics></math></span>","work done by the force: energy it transfers","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{F}</annotation></semantics></math></span>","force vector; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi></mrow><annotation encoding=\"application/x-tex\">F</annotation></semantics></math></span> alone is its magnitude","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>d</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{d}</annotation></semantics></math></span>","displacement vector; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span> alone is its magnitude","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi></mrow><annotation encoding=\"application/x-tex\">F</annotation></semantics></math></span>","magnitude of the force","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","magnitude of the displacement; in <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mover accent=\"true\"><mi>r</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">d\\vec r</annotation></semantics></math></span>, an infinitesimally small change","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","angle between the force and the displacement","°"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>r</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{r}</annotation></semantics></math></span>","position vector; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mover accent=\"true\"><mi>r</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">d\\vec r</annotation></semantics></math></span> is a tiny step along the path","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>","distance a spring is stretched from its natural length","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>","spring constant (stiffness)","N/m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>W</mi><mtext>net</mtext></msub></mrow><annotation encoding=\"application/x-tex\">W_{\\text{net}}</annotation></semantics></math></span>","net work: total work by all forces on the object","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","“change in”: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/Math
