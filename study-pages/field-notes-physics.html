n encoding=\"application/x-tex\">Q</annotation></semantics></math></span>","magnitude of the charge on each conductor (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>+</mo><mi>Q</mi></mrow><annotation encoding=\"application/x-tex\">+Q</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mi>Q</mi></mrow><annotation encoding=\"application/x-tex\">-Q</annotation></semantics></math></span>)","C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>","potential difference between the two conductors","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>κ</mi></mrow><annotation encoding=\"application/x-tex\">\\kappa</annotation></semantics></math></span>","dielectric constant of the material between the plates (1 for vacuum)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ε</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\varepsilon_{0}</annotation></semantics></math></span>","permittivity of free space, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ε</mi><mn>0</mn></msub><mo>≈</mo><mn>8.85</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>12</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">\\varepsilon_0 \\approx 8.85\\times10^{-12}</annotation></semantics></math></span> C²/(N·m²)","C²/(N·m²)"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span>","area of each plate","m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","gap (separation) between the plates","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>U</mi></mrow><annotation encoding=\"application/x-tex\">U</annotation></semantics></math></span>","energy stored in the capacitor’s electric field","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mo lspace=\"0em\" rspace=\"0em\">∥</mo></msub></mrow><annotation encoding=\"application/x-tex\">C_{\\parallel}</annotation></semantics></math></span>","equivalent capacitance of capacitors in parallel","F"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">C_{1}</annotation></semantics></math></span>","capacitance of the first capacitor in a combination","F"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">C_{2}</annotation></semantics></math></span>","capacitance of the second capacitor in a combination","F"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mtext>series</mtext></msub></mrow><annotation encoding=\"application/x-tex\">C_{\\text{series}}</annotation></semantics></math></span>","equivalent capacitance of capacitors in series","F"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi></mrow><annotation encoding=\"application/x-tex\">E</annotation></semantics></math></span>","uniform electric field between the plates, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mo>=</mo><mi>V</mi><mi mathvariant=\"normal\">/</mi><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">E = V/d</annotation></semantics></math></span>","V/m"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ε</mi></mrow><annotation encoding=\"application/x-tex\">\\varepsilon</annotation></semantics></math></span>","epsilon","EP-sih-lon","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ε</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\varepsilon_0</annotation></semantics></math></span>, the permittivity of free space."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>κ</mi></mrow><annotation encoding=\"application/x-tex\">\\kappa</annotation></semantics></math></span>","kappa","KAP-uh","dielectric constant: how much an insulating material between the plates increases capacitance (1 for vacuum)."]],"calc":{"title":"Parallel-plate capacitor","inputs":[{"k":"A","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span>","unit":"m²","d":"0.01"},{"k":"d","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","unit":"m","d":"1e-3"},{"k":"k","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>κ</mi></mrow><annotation encoding=\"application/x-tex\">\\kappa</annotation></semantics></math></span>","unit":"","d":"1"},{"k":"V","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>","unit":"V","d":"12"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C</mi></mrow><annotation encoding=\"application/x-tex\">C</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi></mrow><annotation encoding=\"application/x-tex\">Q</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>U</mi></mrow><annotation encoding=\"application/x-tex\">U</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mo>=</mo><mi>V</mi><mi mathvariant=\"normal\">/</mi><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">E = V/d</annotation></semantics></math></span>"],"outUnits":["F","C","J","V/m"]}},{"id":"current","group":"ci","title":"Electric Current","blurb":"The rate at which charge flows past a point.","body":"\n<p>Current is how much charge passes a point per second. One ampere is one coulomb per second.</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>I</mi><mo>=</mo><mfrac><mrow><mi>d</mi><mi>Q</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">I = \\frac{dQ}{dt}</annotation></semantics></math></span></div>\n<p>By convention current points in the direction positive charge would move. In metal wires the actual carriers are electrons moving the opposite way. Their average <b>drift velocity</b> is surprisingly slow, often a fraction of a millimetre per second, even though the signal (the push from the field) travels along the wire at a large fraction of light speed:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>I</mi><mo>=</mo><mi>n</mi><mi>q</mi><msub><mi>v</mi><mi>d</mi></msub><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">I = n q v_d A</annotation></semantics></math></span></div>\n<p>where <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span> is the number of carriers per unit volume, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">q</annotation></semantics></math></span> the charge on each, and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span> the wire's cross-sectional area. A copper wire has about <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8.5</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mn>28</mn></msup></mrow><annotation encoding=\"application/x-tex\">8.5\\times10^{28}</annotation></semantics></math></span> free electrons per cubic metre, so a huge number of slow carriers makes a large current.</p>","related":["charge","resistance","kirchhoff","bfield"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","electric current: charge passing a point per unit time","A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","an infinitesimally small piece/change (in derivatives and integrals)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi></mrow><annotation encoding=\"application/x-tex\">Q</annotation></semantics></math></span>","charge that has flowed past a point","C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","time","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>","number density of charge carriers (carriers per unit volume)","m⁻³"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">q</annotation></semantics></math></span>","charge on each carrier (for electrons, magnitude <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi></mrow><annotation encoding=\"application/x-tex\">e</annotation></semantics></math></span>)","C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>d</mi></msub></mrow><annotation encoding=\"application/x-tex\">v_{d}</annotation></semantics></math></span>","drift velocity: average speed of the carriers along the wire","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span>","cross-sectional area of the wire","m²"]],"greek":[],"calc":{"title":"Drift velocity in a wire","inputs":[{"k":"I","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","unit":"A","d":"2"},{"k":"A","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span>","unit":"m²","d":"1e-6"},{"k":"n","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>","unit":"m⁻³","d":"8.5e28"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>d</mi></msub></mrow><annotation encoding=\"application/x-tex\">v_d</annotation></semantics></math></span>"],"outUnits":["m/s"]}},{"id":"resistance","group":"ci","title":"Resistance & Ohm's Law","blurb":"Voltage drives current; resistance limits it.","body":"\n<p>For many materials, the current through a piece is proportional to the voltage across it. The constant of proportionality is the resistance, measured in ohms (Ω):</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>V</mi><mo>=</mo><mi>I</mi><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">V = I R</annotation></semantics></math></span></div>\n<p>This is Ohm's law. It's an empirical rule, not a fundamental law: metals and resistors obey it well, diodes and bulbs don't. Resistance depends on the material's <b>resistivity</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ρ</mi></mrow><annotation encoding=\"application/x-tex\">\\rho</annotation></semantics></math></span> and on the object's shape:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>R</mi><mo>=</mo><mi>ρ</mi><mtext> </mtext><mfrac><mi>L</mi><mi>A</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">R = \\rho\\,\\frac{L}{A}</annotation></semantics></math></span></div>\n<p>Longer wires resist more; thicker wires resist less. Resistivity of metals rises with temperature, roughly as <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ρ</mi><mo>=</mo><msub><mi>ρ</mi><mn>0</mn></msub><mtext> </mtext><mo stretchy=\"false\">[</mo><mn>1</mn><mo>+</mo><mi>α</mi><mo stretchy=\"false\">(</mo><mi>T</mi><mo>−</mo><msub><mi>T</mi><mn>0</mn></msub><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">]</mo></mrow><annotation encoding=\"application/x-tex\">\\rho = \\rho_0\\,[1 + \\alpha (T - T_0)]</annotation></semantics></math></span>, where <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ρ</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\rho_0</annotation></semantics></math></span> is the value at a reference temperature <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">T_0</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi></mrow><annotation encoding=\"application/x-tex\">\\alpha</annotation></semantics></math></span> is the temperature coefficient (about <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.004</mn></mrow><annotation encoding=\"application/x-tex\">0.004</annotation></semantics></math></span> per kelvin for copper).</p>\n<table class=\"t\">\n<tr><th>Material</th><th><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ρ</mi></mrow><annotation encoding=\"application/x-tex\">\\rho</annotation></semantics></math></span> at 20 °C (Ω·m)</th></tr>\n<tr><td>Silver</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1.6</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>8</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">1.6\\times10^{-8}</annotation></semantics></math></span></td></tr>\n<tr><td>Copper</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1.7</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>8</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">1.7\\times10^{-8}</annotation></semantics></math></span></td></tr>\n<tr><td>Aluminium</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2.7</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>8</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">2.7\\times10^{-8}</annotation></semantics></math></span></td></tr>\n<tr><td>Nichrome</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1.1</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>6</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">1.1\\times10^{-6}</annotation></semantics></math></span></td></tr>\n<tr><td>Glass</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><msup><mn>0</mn><mn>10</mn></msup></mrow><annotation encoding=\"application/x-tex\">10^{10}</annotation></semantics></math></span> to <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><msup><mn>0</mn><mn>14</mn></msup></mrow><annotation encoding=\"application/x-tex\">10^{14}</annotation></semantics></math></span></td></tr>\n</table>","related":["current","seriesparallel","power","kirchhoff"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>","voltage (potential difference) across the resistor or wire","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","current through it","A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","resistance","Ω"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ρ</mi></mrow><annotation encoding=\"application/x-tex\">\\rho</annotation></semantics></math></span>","resistivity of the material (at temperature <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>)","Ω·m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","length of the wire","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span>","cross-sectional area of the wire","m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ρ</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\rho_{0}</annotation></semantics></math></span>","resistivity at the reference temperature <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">T_0</annotation></semantics></math></span>","Ω·m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi></mrow><annotation encoding=\"application/x-tex\">\\alpha</annotation></semantics></math></span>","temperature coefficient of resistivity","1/K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","temperature of the material","K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">T_{0}</annotation></semantics></math></span>","reference temperature (e.g. 20 °C)","K"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi></mrow><annotation encoding=\"application/x-tex\">\\alpha</annotation></semantics></math></span>","alpha","AL-fuh","temperature coefficient of resistivity: the fractional change in <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ρ</mi></mrow><annotation encoding=\"application/x-tex\">\\rho</annotation></semantics></math></span> per kelvin."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ρ</mi></mrow><annotation encoding=\"application/x-tex\">\\rho</annotation></semantics></math></span>","rho","roe","resistivity, a property of the material, in Ω·m; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ρ</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\rho_0</annotation></semantics></math></span> is its value at reference temperature <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">T_0</annotation></semantics></math></span>."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Ω</mi></mrow><annotation encoding=\"application/x-tex\">\\Omega</annotation></semantics></math></span>","capital omega","oh-MAY-guh","the ohm, the unit of resistance (and reactance and impedance). <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mtext> </mtext><mi mathvariant=\"normal\">Ω</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1\\ \\Omega = 1</annotation></semantics></math></span> V/A."]],"calc":{"title":"Wire resistance and Ohm’s law","inputs":[{"k":"rho","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ρ</mi></mrow><annotation encoding=\"application/x-tex\">\\rho</annotation></semantics></math></span>","unit":"Ω·m","d":"1.7e-8"},{"k":"L","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","unit":"m","d":"10"},{"k":"A","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span>","unit":"m²","d":"1e-6"},{"k":"V","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>","unit":"V","d":"1"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mo>=</mo><mi>V</mi><mi mathvariant=\"normal\">/</mi><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">I = V/R</annotation></semantics></math></span>"],"outUnits":["Ω","A"]}},{"id":"seriesparallel","group":"ci","title":"Series & Parallel","blurb":"Combining resistors into a single equivalent.","body":"\n<p>Resistors in <b>series</b> share the same current, one after another, so their voltages add and so do their resistances:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>R</mi><mtext>series</mtext></msub><mo>=</mo><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><msub><mi>R</mi><mn>2</mn></msub><mo>+</mo><msub><mi>R</mi><mn>3</mn></msub><mo>+</mo><mo>⋯</mo></mrow><annotation encoding=\"application/x-tex\">R_{\\text{series}} = R_1 + R_2 + R_3 + \\cdots</annotation></semantics></math></span></div>\n<p>Resistors in <b>parallel</b> share the same voltage, side by side, so their currents add. That makes their conductances (reciprocal resistances) add:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mfrac><mn>1</mn><msub><mi>R</mi><mo lspace=\"0em\" rspace=\"0em\">∥</mo></msub></mfrac><mo>=</mo><mfrac><mn>1</mn><msub><mi>R</mi><mn>1</mn></msub></mfrac><mo>+</mo><mfrac><mn>1</mn><msub><mi>R</mi><mn>2</mn></msub></mfrac><mo>+</mo><mo>⋯</mo><mtext> </mtext><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mtext>two resistors: </mtext><msub><mi>R</mi><mo lspace=\"0em\" rspace=\"0em\">∥</mo></msub><mo>=</mo><mfrac><mrow><msub><mi>R</mi><mn>1</mn></msub><msub><mi>R</mi><mn>2</mn></msub></mrow><mrow><msub><mi>R</mi><mn>1</mn></msub><mo>+</mo><msub><mi>R</mi><mn>2</mn></msub></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">\\frac{1}{R_{\\parallel}} = \\frac{1}{R_1} + \\frac{1}{R_2} + \\cdots, \\qquad \\text{two resistors: } R_{\\parallel} = \\frac{R_1 R_2}{R_1 + R_2}</annotation></semantics></math></span></div>\n<p>A parallel combination is always smaller than its smallest member, and every extra branch lowers it further. That is why plugging more appliances into a household circuit (which wires them in parallel) increases the total current drawn.</p>\n<div class=\"note\"><b>Watch the swap.</b> Capacitors combine the opposite way: they add in parallel and add reciprocally in series.</div>","related":["resistance","kirchhoff","capacitance"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mtext>series</mtext></msub></mrow><annotation encoding=\"application/x-tex\">R_{\\text{series}}</annotation></semantics></math></span>","equivalent resistance of resistors in series","Ω"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_{1}</annotation></semantics></math></span>","resistance of the first resistor","Ω"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_{2}</annotation></semantics></math></span>","resistance of the second resistor","Ω"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_{3}</annotation></semantics></math></span>","resistance of the third resistor","Ω"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mo lspace=\"0em\" rspace=\"0em\">∥</mo></msub></mrow><annotation encoding=\"application/x-tex\">R_{\\parallel}</annotation></semantics></math></span>","equivalent resistance of resistors in parallel","Ω"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Ω</mi></mrow><annotation encoding=\"application/x-tex\">\\Omega</annotation></semantics></math></span>","capital omega","oh-MAY-guh","the ohm, the unit of resistance (and reactance and impedance). <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mtext> </mtext><mi mathvariant=\"normal\">Ω</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1\\ \\Omega = 1</annotation></semantics></math></span> V/A."]],"calc":{"title":"Combine three resistors","inputs":[{"k":"R1","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_1</annotation></semantics></math></span>","unit":"Ω","d":"100"},{"k":"R2","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_2</annotation></semantics></math></span>","unit":"Ω","d":"220"},{"k":"R3","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_3</annotation></semantics></math></span>","unit":"Ω","d":"470"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mtext>series</mtext></msub></mrow><annotation encoding=\"application/x-tex\">R_{\\text{series}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mo lspace=\"0em\" rspace=\"0em\">∥</mo></msub></mrow><annotation encoding=\"application/x-tex\">R_{\\parallel}</annotation></semantics></math></span>"],"outUnits":["Ω","Ω"]}},{"id":"power","group":"ci","title":"Electric Power","blurb":"The rate at which a circuit element converts electrical energy.","body":"\n<p>When charge <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi></mrow><annotation encoding=\"application/x-tex\">Q</annotation></semantics></math></span> falls through a potential difference <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span> it gives up energy <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">QV</annotation></semantics></math></span>. Doing that at a rate <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mo>=</mo><mi>d</mi><mi>Q</mi><mi mathvariant=\"normal\">/</mi><mi>d</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">I = dQ/dt</annotation></semantics></math></span> gives power:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>P</mi><mo>=</mo><mi>I</mi><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">P = I V</annotation></semantics></math></span></div>\n<p>For a resistor, where all the energy turns into heat (Joule heating), Ohm's law lets you write this two more ways:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>P</mi><mo>=</mo><msup><mi>I</mi><mn>2</mn></msup><mi>R</mi><mo>=</mo><mfrac><msup><mi>V</mi><mn>2</mn></msup><mi>R</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">P = I^2 R = \\frac{V^2}{R}</annotation></semantics></math></span></div>\n<p>Utilities bill by energy, not power, using the kilowatt-hour: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mtext> kWh</mtext><mo>=</mo><mn>3.6</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mn>6</mn></msup><mtext> J</mtext></mrow><annotation encoding=\"application/x-tex\">1\\ \\text{kWh} = 3.6\\times10^{6}\\ \\text{J}</annotation></semantics></math></span>. Power lines run at high voltage because, for a given power delivered, a higher voltage means a lower current and much smaller <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>I</mi><mn>2</mn></msup><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">I^2R</annotation></semantics></math></span> losses in the wires.</p>","related":["resistance","transformer","ac"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span>","power: rate at which electrical energy is converted","W"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","current through the element","A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>","potential difference across the element","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","resistance of the resistor (or of the power-line wires in <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>I</mi><mn>2</mn></msup><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">I^2R</annotation></semantics></math></span> losses)","Ω"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi></mrow><annotation encoding=\"application/x-tex\">Q</annotation></semantics></math></span>","charge falling through the potential difference","C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","an infinitesimally small piece/change (in derivatives and integrals)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","time; in the calculator, how long the device runs (entered in hours)","s"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Ω</mi></mrow><annotation encoding=\"application/x-tex\">\\Omega</annotation></semantics></math></span>","capital omega","oh-MAY-guh","the ohm, the unit of resistance (and reactance and impedance). <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mtext> </mtext><mi mathvariant=\"normal\">Ω</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1\\ \\Omega = 1</annotation></semantics></math></span> V/A."]],"calc":{"title":"Power and energy cost","inputs":[{"k":"V","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>","unit":"V","d":"120"},{"k":"R","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","unit":"Ω","d":"14.4"},{"k":"h","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","unit":"hours","d":"3"},{"k":"price","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>price</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{price}</annotation></semantics></math></span>","unit":"$/kWh","d":"0.15"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>energy</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{energy}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>cost</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{cost}</annotation></semantics></math></span>"],"outUnits":["A","W","kWh",""]}},{"id":"kirchhoff","group":"ci","title":"Kirchhoff's Rules","blurb":"Charge and energy conservation applied to circuits.","body":"\n<p>When a circuit can't be reduced to simple series and parallel pieces, two rules always work.</p>\n<p><b>Junction rule</b> (charge conservation): the total current flowing into any junction equals the total flowing out.</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mo>∑</mo><msub><mi>I</mi><mtext>in</mtext></msub><mo>=</mo><mo>∑</mo><msub><mi>I</mi><mtext>out</mtext></msub></mrow><annotation encoding=\"application/x-tex\">\\sum I_{\\text{in}} = \\sum I_{\\text{out}}</annotation></semantics></math></span></div>\n<p><b>Loop rule</b> (energy conservation): going around any closed loop, the sum of all potential rises and drops is zero.</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><munder><mo>∑</mo><mtext>loop</mtext></munder><mi mathvariant=\"normal\">Δ</mi><mi>V</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\\sum_{\\text{loop}} \\Delta V = 0</annotation></semantics></math></span></div>\n<p><b>Sign conventions.</b> Crossing a resistor in the direction of the assumed current is a drop of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">IR</annotation></semantics></math></span>; against it, a rise. Crossing a battery from − to + is a rise of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ℰ</mi></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}</annotation></semantics></math></span>. If a current comes out negative, it just flows opposite to your guess.</p>\n<p>Write one junction equation for every junction except one (the last is redundant) and one loop equation for each independent loop, then solve them together for the unknown currents.</p>\n<p>The calculator below solves the common two-battery, three-resistor network. Three branches join a top junction to a bottom junction: the left branch holds battery <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ℰ</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}_1</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_1</annotation></semantics></math></span>, the right branch holds <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ℰ</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}_2</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_2</annotation></semantics></math></span>, and the middle branch, shared by both loops, holds only <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_3</annotation></semantics></math></span>. Both batteries have their + terminal facing the top junction. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_1</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_2</annotation></semantics></math></span> are taken as flowing up through the outer branches into the top junction, and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_3</annotation></semantics></math></span> as flowing down through <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_3</annotation></semantics></math></span>, so <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>3</mn></msub><mo>=</mo><msub><mi>I</mi><mn>1</mn></msub><mo>+</mo><msub><mi>I</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_3 = I_1 + I_2</annotation></semantics></math></span>. A negative result means that current actually flows the other way.</p>","related":["seriesparallel","resistance","current"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mtext>in</mtext></msub></mrow><annotation encoding=\"application/x-tex\">I_{\\text{in}}</annotation></semantics></math></span>","a current flowing into the junction","A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mtext>out</mtext></msub></mrow><annotation encoding=\"application/x-tex\">I_{\\text{out}}</annotation></semantics></math></span>","a current flowing out of the junction","A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","\"change in\" the quantity that follows",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>","electric potential; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta V</annotation></semantics></math></span> is each rise or drop around a loop","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","current in a branch (assumed direction; negative means it flows the other way)","A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","resistance of a resistor in the loop","Ω"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ℰ</mi></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}</annotation></semantics></math></span>","emf of a battery: the potential rise crossing it from − to +","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ℰ</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}_{1}</annotation></semantics></math></span>","emf of the battery in the left branch (+ terminal toward the top junction)","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_{1}</annotation></semantics></math></span>","resistor in the left branch, in series with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ℰ</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}_1</annotation></semantics></math></span>","Ω"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ℰ</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}_{2}</annotation></semantics></math></span>","emf of the battery in the right branch (+ terminal toward the top junction)","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_{2}</annotation></semantics></math></span>","resistor in the right branch, in series with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ℰ</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}_2</annotation></semantics></math></span>","Ω"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_{3}</annotation></semantics></math></span>","resistor in the middle branch, shared by both loops","Ω"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_{1}</annotation></semantics></math></span>","current up through the left branch (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ℰ</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}_1</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_1</annotation></semantics></math></span>) into the top junction","A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_{2}</annotation></semantics></math></span>","current up through the right branch (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ℰ</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}_2</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_2</annotation></semantics></math></span>) into the top junction","A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_{3}</annotation></semantics></math></span>","current down through the middle resistor <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_3</annotation></semantics></math></span>; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>3</mn></msub><mo>=</mo><msub><mi>I</mi><mn>1</mn></msub><mo>+</mo><msub><mi>I</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_3 = I_1 + I_2</annotation></semantics></math></span>","A"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","capital delta","DEL-tuh","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta V</annotation></semantics></math></span>, a change in potential across one element of the loop."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Ω</mi></mrow><annotation encoding=\"application/x-tex\">\\Omega</annotation></semantics></math></span>","capital omega","oh-MAY-guh","the ohm, the unit of resistance (and reactance and impedance). <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mtext> </mtext><mi mathvariant=\"normal\">Ω</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1\\ \\Omega = 1</annotation></semantics></math></span> V/A."]],"calc":{"title":"Two-loop network","inputs":[{"k":"E1","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ℰ</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}_1</annotation></semantics></math></span>","unit":"V","d":"12"},{"k":"E2","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ℰ</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}_2</annotation></semantics></math></span>","unit":"V","d":"6"},{"k":"R1","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_1</annotation></semantics></math></span>","unit":"Ω","d":"4"},{"k":"R2","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_2</annotation></semantics></math></span>","unit":"Ω","d":"2"},{"k":"R3","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_3</annotation></semantics></math></span>","unit":"Ω","d":"6"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_1</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_2</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>3</mn></msub><mo>=</mo><msub><mi>I</mi><mn>1</mn></msub><mo>+</mo><msub><mi>I</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_3 = I_1 + I_2</annotation></semantics></math></span>"],"outUnits":["A","A","A"]}},{"id":"rc","group":"ci","title":"RC Circuits","blurb":"Capacitors charge and discharge exponentially through a resistor.","body":"\n<p>Connect an uncharged capacitor to a battery through a resistor. At first the capacitor acts like a wire and current is large; as charge builds up its voltage opposes the battery and the current dies away. The voltage across the capacitor rises as</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>V</mi><mi>C</mi></msub><mo stretchy=\"false\">(</mo><mi>t</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mi>ℰ</mi><mrow><mo fence=\"true\">(</mo><mn>1</mn><mo>−</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>t</mi><mi mathvariant=\"normal\">/</mi><mi>τ</mi></mrow></msup><mo fence=\"true\">)</mo></mrow><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>τ</mi><mo>=</mo><mi>R</mi><mi>C</mi></mrow><annotation encoding=\"application/x-tex\">V_C(t) = \\mathcal{E}\\left(1 - e^{-t/\\tau}\\right), \\qquad \\tau = RC</annotation></semantics></math></span></div>\n<p>Here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ℰ</mi></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}</annotation></semantics></math></span> is the battery's emf (its voltage). Discharging from an initial voltage <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">V_0</annotation></semantics></math></span> through the same resistor, it falls as <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mi>C</mi></msub><mo stretchy=\"false\">(</mo><mi>t</mi><mo stretchy=\"false\">)</mo><mo>=</mo><msub><mi>V</mi><mn>0</mn></msub><mtext> </mtext><msup><mi>e</mi><mrow><mo>−</mo><mi>t</mi><mi mathvariant=\"normal\">/</mi><mi>τ</mi></mrow></msup></mrow><annotation encoding=\"application/x-tex\">V_C(t) = V_0\\,e^{-t/\\tau}</annotation></semantics></math></span>. The <b>time constant</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi></mrow><annotation encoding=\"application/x-tex\">\\tau</annotation></semantics></math></span> sets the pace: after one <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi></mrow><annotation encoding=\"application/x-tex\">\\tau</annotation></semantics></math></span> a charging capacitor reaches about 63% of its final voltage, and after <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn><mi>τ</mi></mrow><annotation encoding=\"application/x-tex\">5\\tau</annotation></semantics></math></span> it's over 99%.</p>\n<p>RC timing shows up everywhere: camera-flash charging, blinking LEDs, audio filters, and the debounce circuits that clean up the noisy contact of a pressed switch.</p>\n<div class=\"sim\" data-sim=\"rc\"></div>","related":["capacitance","kirchhoff","inductance"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">V_{C}</annotation></semantics></math></span>","voltage across the capacitor at time <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","time since the switch was closed","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ℰ</mi></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}</annotation></semantics></math></span>","emf (voltage) of the charging battery","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi></mrow><annotation encoding=\"application/x-tex\">\\tau</annotation></semantics></math></span>","time constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi><mo>=</mo><mi>R</mi><mi>C</mi></mrow><annotation encoding=\"application/x-tex\">\\tau = RC</annotation></semantics></math></span>","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi></mrow><annotation encoding=\"application/x-tex\">e</annotation></semantics></math></span>","Euler's number, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi><mo>≈</mo><mn>2.718</mn></mrow><annotation encoding=\"application/x-tex\">e \\approx 2.718</annotation></semantics></math></span> (base of the exponential)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","resistance in series with the capacitor","Ω"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C</mi></mrow><annotation encoding=\"application/x-tex\">C</annotation></semantics></math></span>","capacitance","F"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">V_{0}</annotation></semantics></math></span>","initial capacitor voltage when discharging begins","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","charging current at time <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mo>=</mo><mo stretchy=\"false\">(</mo><mi>ℰ</mi><mi mathvariant=\"normal\">/</mi><mi>R</mi><mo stretchy=\"false\">)</mo><mtext> </mtext><msup><mi>e</mi><mrow><mo>−</mo><mi>t</mi><mi mathvariant=\"normal\">/</mi><mi>τ</mi></mrow></msup></mrow><annotation encoding=\"application/x-tex\">I = (\\mathcal{E}/R)\\,e^{-t/\\tau}</annotation></semantics></math></span>","A"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi></mrow><annotation encoding=\"application/x-tex\">\\tau</annotation></semantics></math></span>","tau","rhymes with “cow”","the time constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi><mi>C</mi></mrow><annotation encoding=\"application/x-tex\">RC</annotation></semantics></math></span>, in seconds: how long charging takes to reach about 63%."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Ω</mi></mrow><annotation encoding=\"application/x-tex\">\\Omega</annotation></semantics></math></span>","capital omega","oh-MAY-guh","the ohm, the unit of resistance (and reactance and impedance). <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mtext> </mtext><mi mathvariant=\"normal\">Ω</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">1\\ \\Omega = 1</annotation></semantics></math></span> V/A."]],"calc":{"title":"Time constant","inputs":[{"k":"R","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","unit":"Ω","d":"10000"},{"k":"C","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C</mi></mrow><annotation encoding=\"application/x-tex\">C</annotation></semantics></math></span>","unit":"F","d":"100e-6"},{"k":"E","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ℰ</mi></mrow><annotation encoding=\"application/x-tex\">\\mathcal{E}</annotation></semantics></math></span>","unit":"V","d":"9"},{"k":"t","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","unit":"s","d":"1"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi></mrow><annotation encoding=\"application/x-tex\">\\tau</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mi>C</mi></msub><mo stretchy=\"false\">(</mo><mi>t</mi><mo stretchy=\"false\">)</mo><mtext> charging</mtext></mrow><annotation encoding=\"application/x-tex\">V_C(t)\\ \\text{charging}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mo stretchy=\"false\">(</mo><mi>t</mi><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">I(t)</annotation></semantics></math></span>"],"outUnits":["s","V","A"]}},{"id":"bfield","group":"mg","title":"Magnetic Force on a Charge","blurb":"Moving charges feel a sideways push from a magnetic field.","body":"\n<p>A magnetic field <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec B</annotation></semantics></math></span> (measured in tesla, T) exerts a force only on <b>moving</b> charges, and that force is perpendicular to both the velocity and the field:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover><mo>=</mo><mi>q</mi><mtext> </mtext><mover accent=\"true\"><mi>v</mi><mo>⃗</mo></mover><mo>×</mo><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>F</mi><mo>=</mo><mi mathvariant=\"normal\">∣</mi><mi>q</mi><mi mathvariant=\"normal\">∣</mi><mi>v</mi><mi>B</mi><mi>sin</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\vec F = q\\,\\vec v \\times \\vec B, \\qquad F = |q| v B \\sin\\theta</annotation></semantics></math></span></div>\n<p>Here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span> is the angle between <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>v</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec v</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec B</annotation></semantics></math></span>. Combined with the electric force this is the Lorentz force, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover><mo>=</mo><mi>q</mi><mo stretchy=\"false\">(</mo><mover accent=\"true\"><mi>E</mi><mo>⃗</mo></mover><mo>+</mo><mover accent=\"true\"><mi>v</mi><mo>⃗</mo></mover><mo>×</mo><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\vec F = q(\\vec E + \\vec v\\times\\vec B)</annotation></semantics></math></span>. Use the right-hand rule: point your fingers along <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>v</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec v</annotation></semantics></math></span>, curl them toward <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec B</annotation></semantics></math></span>, and your thumb gives the force on a positive charge.</p>\n<p>Because the magnetic force is always perpendicular to the motion, it never does work. It changes a particle's direction but not its speed. A charge moving perpendicular to a uniform field goes in a circle:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>r</mi><mo>=</mo><mfrac><mrow><mi>m</mi><mi>v</mi></mrow><mrow><mi mathvariant=\"normal\">∣</mi><mi>q</mi><mi mathvariant=\"normal\">∣</mi><mi>B</mi></mrow></mfrac><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>f</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">∣</mi><mi>q</mi><mi mathvariant=\"normal\">∣</mi><mi>B</mi></mrow><mrow><mn>2</mn><mi>π</mi><mi>m</mi></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">r = \\frac{m v}{|q| B}, \\qquad f = \\frac{|q| B}{2\\pi m}</annotation></semantics></math></span></div>\n<p>The frequency doesn't depend on speed (as long as the particle is well below light speed), which is the principle behind the cyclotron. The radius does depend on mass, which is how a mass spectrometer sorts ions.</p>","related":["efield","wireforce","biotsavart","current"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{F}</annotation></semantics></math></span>","force vector on the moving charge (magnetic, or Lorentz with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>E</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec E</annotation></semantics></math></span>)","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">q</annotation></semantics></math></span>","charge of the moving particle (sign matters for direction)","C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>v</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{v}</annotation></semantics></math></span>","velocity of the charge","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{B}</annotation></semantics></math></span>","magnetic field vector","T"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi></mrow><annotation encoding=\"application/x-tex\">F</annotation></semantics></math></span>","magnitude of the magnetic force","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","speed of the charge","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B</mi></mrow><annotation encoding=\"application/x-tex\">B</annotation></semantics></math></span>","magnitude of the magnetic field","T"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","angle between <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>v</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec v</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec B</annotation></semantics></math></span>","°"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","radius of the circular orbit","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","mass of the particle","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","cyclotron frequency: revolutions per second in the orbit","Hz"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span>",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>E</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{E}</annotation></semantics></math></span>","electric field vector (in the full Lorentz force)","N/C"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","theta","THAY-tuh","angle between the velocity and the magnetic field."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","pi","pie","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span> (a circumference divided by its diameter). It appears wherever circles, rotation or spreading in all directions are involved."]],"calc":{"title":"Circular orbit in a field","inputs":[{"k":"m","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","unit":"kg","d":"9.109e-31"},{"k":"q","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">q</annotation></semantics></math></span>","unit":"C","d":"1.602e-19"},{"k":"v","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","unit":"m/s","d":"1e6"},{"k":"B","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B</mi></mrow><annotation encoding=\"application/x-tex\">B</annotation></semantics></math></span>","unit":"T","d":"0.01"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi><mtext> </mtext><mo stretchy=\"false\">(</mo><mi>θ</mi><mo>=</mo><mn>9</mn><msup><mn>0</mn><mo>∘</mo></msup><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">F\\ (\\theta = 90^\\circ)</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>"],"outUnits":["N","m","Hz"]}},{"id":"wireforce","group":"mg","title":"Force on a Current","blurb":"A current-carrying wire in a field is pushed sideways; this is how motors work.","body":"\n<p>A current is a stream of moving charges, so a wire carrying current through a magnetic field feels the sum of all their forces:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover><mo>=</mo><mi>I</mi><mtext> </mtext><mover accent=\"true\"><mi>L</mi><mo>⃗</mo></mover><mo>×</mo><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>F</mi><mo>=</mo><mi>I</mi><mi>L</mi><mi>B</mi><mi>sin</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\vec F = I\\,\\vec L \\times \\vec B, \\qquad F = I L B \\sin\\theta</annotation></semantics></math></span></div>\n<p>Here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>L</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec L</annotation></semantics></math></span> points along the wire in the direction of the current, with magnitude equal to the length in the field. A closed loop in a uniform field feels no net force, but it does feel a <b>torque</b> that tries to line up its face perpendicular to the field. For a coil of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span> turns, each of area <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span>:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>τ</mi><mo>=</mo><mi>N</mi><mi>I</mi><mi>A</mi><mi>B</mi><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mi>μ</mi><mi>B</mi><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>μ</mi><mo>=</mo><mi>N</mi><mi>I</mi><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">\\tau = N I A B \\sin\\theta = \\mu B \\sin\\theta, \\qquad \\mu = N I A</annotation></semantics></math></span></div>\n<p><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math></span> is the coil's magnetic dipole moment, and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span> is the angle between the field and the coil's axis (the normal to its face). An electric motor keeps the coil turning by reversing the current every half-turn (with a commutator) so the torque always pushes the same way.</p>\n<p>Two parallel wires a distance <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span> apart also push on each other, attracting if their currents flow the same way and repelling if opposite:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mfrac><mi>F</mi><mi>L</mi></mfrac><mo>=</mo><mfrac><mrow><msub><mi>μ</mi><mn>0</mn></msub><msub><mi>I</mi><mn>1</mn></msub><msub><mi>I</mi><mn>2</mn></msub></mrow><mrow><mn>2</mn><mi>π</mi><mi>d</mi></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">\\frac{F}{L} = \\frac{\\mu_0 I_1 I_2}{2\\pi d}</annotation></semantics></math></span></div>","related":["bfield","biotsavart","ampere"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{F}</annotation></semantics></math></span>","force vector on the current-carrying wire","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","current in the wire or coil","A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>L</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{L}</annotation></semantics></math></span>","length vector along the wire in the direction of the current","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{B}</annotation></semantics></math></span>","magnetic field vector","T"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi></mrow><annotation encoding=\"application/x-tex\">F</annotation></semantics></math></span>","magnitude of the force on a wire (or between two wires, as <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi><mi mathvariant=\"normal\">/</mi><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">F/L</annotation></semantics></math></span>)","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","length of wire in the field (or of the parallel wires, in <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi><mi mathvariant=\"normal\">/</mi><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">F/L</annotation></semantics></math></span>)","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B</mi></mrow><annotation encoding=\"application/x-tex\">B</annotation></semantics></math></span>","magnitude of the magnetic field","T"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","angle between <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>L</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec L</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec B</annotation></semantics></math></span> (force), or between <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec B</annotation></semantics></math></span> and the coil axis (torque)","°"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi></mrow><annotation encoding=\"application/x-tex\">\\tau</annotation></semantics></math></span>","torque on the coil","N·m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>","number of turns in the coil",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span>","area of each turn of the coil","m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math></span>","magnetic dipole moment of the coil, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi><mo>=</mo><mi>N</mi><mi>I</mi><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">\\mu = NIA</annotation></semantics></math></span>","A·m²"],["<span class=\"katex\"><math xmln
