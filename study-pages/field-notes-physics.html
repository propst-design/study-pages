ML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>K</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta K</annotation></semantics></math></span> is final minus initial kinetic energy",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K</mi></mrow><annotation encoding=\"application/x-tex\">K</annotation></semantics></math></span>","kinetic energy of the object","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mo lspace=\"0em\" rspace=\"0em\">∥</mo></msub></mrow><annotation encoding=\"application/x-tex\">F_{\\parallel}</annotation></semantics></math></span>","component of the force along the displacement, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi><mi>cos</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">F\\cos\\theta</annotation></semantics></math></span>","N"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","capital delta","DEL-tuh","“change in”: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta x</annotation></semantics></math></span> means the final value of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span> minus the starting value."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","theta","THAY-tuh","the angle between the force and the direction of motion."]],"calc":{"title":"Work by a force","inputs":[{"k":"F","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi></mrow><annotation encoding=\"application/x-tex\">F</annotation></semantics></math></span>","unit":"N","d":"100"},{"k":"d","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","unit":"m","d":"10"},{"k":"th","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","unit":"°","d":"30"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>W</mi></mrow><annotation encoding=\"application/x-tex\">W</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mo lspace=\"0em\" rspace=\"0em\">∥</mo></msub></mrow><annotation encoding=\"application/x-tex\">F_{\\parallel}</annotation></semantics></math></span>"],"outUnits":["J","N"]}},{"id":"energy","group":"en","title":"Energy Conservation","blurb":"Kinetic and potential energy trade places while the total stays fixed.","body":"\n<p>A moving object has <b>kinetic energy</b>, and a force like gravity or a spring stores <b>potential energy</b> that depends on position (height <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span>, or spring stretch <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span> with spring constant <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>):</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>K</mi><mo>=</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup><mo separator=\"true\">,</mo><mspace width=\"2em\"/><msub><mi>U</mi><mi>g</mi></msub><mo>=</mo><mi>m</mi><mi>g</mi><mi>h</mi><mo separator=\"true\">,</mo><mspace width=\"2em\"/><msub><mi>U</mi><mi>s</mi></msub><mo>=</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi>k</mi><msup><mi>x</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">K = \\tfrac12 m v^2, \\qquad U_g = m g h, \\qquad U_s = \\tfrac12 k x^2</annotation></semantics></math></span></div>\n<p>When only conservative forces (gravity, springs) do work, the total mechanical energy is constant. Energy just moves between kinetic and potential forms:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>K</mi><mn>1</mn></msub><mo>+</mo><msub><mi>U</mi><mn>1</mn></msub><mo>=</mo><msub><mi>K</mi><mn>2</mn></msub><mo>+</mo><msub><mi>U</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">K_1 + U_1 = K_2 + U_2</annotation></semantics></math></span></div>\n<p>This often makes problems far easier than using forces. A roller coaster dropping height <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span> from rest reaches <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>=</mo><msqrt><mrow><mn>2</mn><mi>g</mi><mi>h</mi></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">v = \\sqrt{2gh}</annotation></semantics></math></span> no matter how the track twists, as long as friction is negligible.</p>\n<p>Friction and drag aren't conservative. They turn mechanical energy into heat, so with them included:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>K</mi><mn>1</mn></msub><mo>+</mo><msub><mi>U</mi><mn>1</mn></msub><mo>=</mo><msub><mi>K</mi><mn>2</mn></msub><mo>+</mo><msub><mi>U</mi><mn>2</mn></msub><mo>+</mo><msub><mi>E</mi><mtext>lost</mtext></msub></mrow><annotation encoding=\"application/x-tex\">K_1 + U_1 = K_2 + U_2 + E_{\\text{lost}}</annotation></semantics></math></span></div>\n<p>Total energy, counting heat, is always conserved. This is one of the most basic laws in physics.</p>","related":["work","projectile","shm","collisions","potential","firstlaw","massenergy"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K</mi></mrow><annotation encoding=\"application/x-tex\">K</annotation></semantics></math></span>","kinetic energy: energy of motion","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","mass of the object","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","speed of the object","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>U</mi><mi>g</mi></msub></mrow><annotation encoding=\"application/x-tex\">U_{g}</annotation></semantics></math></span>","gravitational potential energy relative to a chosen zero height","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">g</annotation></semantics></math></span>","gravitational acceleration ≈ 9.81 m/s²","m/s²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span>","height above the reference level (or height dropped)","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>U</mi><mi>s</mi></msub></mrow><annotation encoding=\"application/x-tex\">U_{s}</annotation></semantics></math></span>","elastic potential energy stored in a spring","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>","spring constant (stiffness)","N/m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>","spring stretch or compression from natural length","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>K</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">K_{1}</annotation></semantics></math></span>","kinetic energy at the first (initial) moment","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>U</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">U_{1}</annotation></semantics></math></span>","potential energy at the first (initial) moment","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>K</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">K_{2}</annotation></semantics></math></span>","kinetic energy at the second (later) moment","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>U</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">U_{2}</annotation></semantics></math></span>","potential energy at the second (later) moment","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mtext>lost</mtext></msub></mrow><annotation encoding=\"application/x-tex\">E_{\\text{lost}}</annotation></semantics></math></span>","mechanical energy turned into heat by friction or drag","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">v_{0}</annotation></semantics></math></span>","initial speed at the starting height","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>U</mi></mrow><annotation encoding=\"application/x-tex\">U</annotation></semantics></math></span>","gravitational potential energy at height <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><mi>g</mi><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">mgh</annotation></semantics></math></span>","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>K</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">K_{0}</annotation></semantics></math></span>","initial kinetic energy","J"]],"greek":[],"calc":{"title":"Drop or launch","inputs":[{"k":"m","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","unit":"kg","d":"2"},{"k":"h","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span>","unit":"m","d":"10"},{"k":"v0","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">v_0</annotation></semantics></math></span>","unit":"m/s","d":"0"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>U</mi><mo>=</mo><mi>m</mi><mi>g</mi><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">U = mgh</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>K</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">K_0</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mtext> after falling </mtext><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">v\\ \\text{after falling}\\ h</annotation></semantics></math></span>"],"outUnits":["J","J","m/s"]}},{"id":"mpower","group":"en","title":"Mechanical Power","blurb":"How fast work gets done.","body":"\n<p>Power is the rate of doing work, or of transferring energy. Lifting a box slowly or quickly takes the same work, but doing it quickly takes more power.</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>P</mi><mo>=</mo><mfrac><mrow><mi>d</mi><mi>W</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mtext>units: </mtext><mn>1</mn><mtext> W</mtext><mo>=</mo><mn>1</mn><mtext> J/s</mtext></mrow><annotation encoding=\"application/x-tex\">P = \\frac{dW}{dt}, \\qquad \\text{units: } 1\\ \\text{W} = 1\\ \\text{J/s}</annotation></semantics></math></span></div>\n<p>For a force pushing something along at velocity <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>P</mi><mo>=</mo><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover><mo>⋅</mo><mover accent=\"true\"><mi>v</mi><mo>⃗</mo></mover><mo>=</mo><mi>F</mi><mi>v</mi><mi>cos</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">P = \\vec F\\cdot\\vec v = F v\\cos\\theta</annotation></semantics></math></span></div>\n<p>That explains why cars need much more power at high speed: drag force rises roughly as <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>v</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">v^2</annotation></semantics></math></span>, so the power to overcome it rises as <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>v</mi><mn>3</mn></msup></mrow><annotation encoding=\"application/x-tex\">v^3</annotation></semantics></math></span>. Doubling your speed takes about eight times the power.</p>\n<p>The older unit, one horsepower, is about 746 W. A fit person can sustain roughly 100 to 300 W for an extended effort.</p>\n<p>Electrical power follows the same idea. See <a href=\"#/power\">Electric Power</a>.</p>","related":["work","energy","power"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span>","power: rate of doing work (calculator also shows horsepower)","W"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","an infinitesimally small change (used in the derivative <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mi>W</mi><mi mathvariant=\"normal\">/</mi><mi>d</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">dW/dt</annotation></semantics></math></span>)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>W</mi></mrow><annotation encoding=\"application/x-tex\">W</annotation></semantics></math></span>","work done","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","time taken","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{F}</annotation></semantics></math></span>","force vector; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi></mrow><annotation encoding=\"application/x-tex\">F</annotation></semantics></math></span> alone is its magnitude","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>v</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{v}</annotation></semantics></math></span>","velocity vector of the pushed object; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span> alone is its speed","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi></mrow><annotation encoding=\"application/x-tex\">F</annotation></semantics></math></span>","magnitude of the pushing force","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","speed of the object","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","angle between the force and the velocity","°"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","mass being lifted","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span>","height lifted","m"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","theta","THAY-tuh","the angle between the force and the velocity."]],"calc":{"title":"Lifting power","inputs":[{"k":"m","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","unit":"kg","d":"75"},{"k":"h","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span>","unit":"m","d":"12"},{"k":"t","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","unit":"s","d":"20"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>W</mi></mrow><annotation encoding=\"application/x-tex\">W</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span>"],"outUnits":["J","W","hp"]}},{"id":"momentum","group":"en","title":"Momentum & Impulse","blurb":"Mass times velocity, conserved whenever no outside force acts.","body":"\n<p>Momentum is mass times velocity, a vector pointing the way the object moves:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mover accent=\"true\"><mi>p</mi><mo>⃗</mo></mover><mo>=</mo><mi>m</mi><mover accent=\"true\"><mi>v</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec p = m\\vec v</annotation></semantics></math></span></div>\n<p>Newton's second law can be written in terms of momentum, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>∑</mo><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover><mo>=</mo><mi>d</mi><mover accent=\"true\"><mi>p</mi><mo>⃗</mo></mover><mi mathvariant=\"normal\">/</mi><mi>d</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">\\sum\\vec F = d\\vec p/dt</annotation></semantics></math></span>. Integrating over a short push gives the <b>impulse</b>, the change in momentum:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mover accent=\"true\"><mi>J</mi><mo>⃗</mo></mover><mo>=</mo><mo>∫</mo><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover><mtext> </mtext><mi>d</mi><mi>t</mi><mo>=</mo><mi mathvariant=\"normal\">Δ</mi><mover accent=\"true\"><mi>p</mi><mo>⃗</mo></mover><mo separator=\"true\">,</mo><mspace width=\"2em\"/><msub><mi>F</mi><mtext>avg</mtext></msub><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">Δ</mi><mi>p</mi></mrow><mrow><mi mathvariant=\"normal\">Δ</mi><mi>t</mi></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">\\vec J = \\int \\vec F\\,dt = \\Delta\\vec p, \\qquad F_{\\text{avg}} = \\frac{\\Delta p}{\\Delta t}</annotation></semantics></math></span></div>\n<p>For a given change in momentum, spreading it over a longer time means a smaller force. That's the idea behind airbags, crumple zones and bending your knees when you land.</p>\n<p><b>Conservation.</b> Inside a system the forces come in equal-and-opposite pairs (Newton's third law), so they cancel in the total. If no external force acts, the total momentum never changes:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mo>∑</mo><msub><mover accent=\"true\"><mi>p</mi><mo>⃗</mo></mover><mtext>before</mtext></msub><mo>=</mo><mo>∑</mo><msub><mover accent=\"true\"><mi>p</mi><mo>⃗</mo></mover><mtext>after</mtext></msub></mrow><annotation encoding=\"application/x-tex\">\\sum \\vec p_{\\text{before}} = \\sum \\vec p_{\\text{after}}</annotation></semantics></math></span></div>","related":["collisions","newton","angmom"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>p</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{p}</annotation></semantics></math></span>","momentum vector, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><mover accent=\"true\"><mi>v</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">m\\vec v</annotation></semantics></math></span>; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">p</annotation></semantics></math></span> alone is its magnitude","kg·m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","mass of the object","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>v</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{v}</annotation></semantics></math></span>","velocity vector","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>J</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{J}</annotation></semantics></math></span>","impulse vector: change in momentum from a force acting over time","N·s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{F}</annotation></semantics></math></span>","force vector acting on the object","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","an infinitesimally small change (used in <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mover accent=\"true\"><mi>p</mi><mo>⃗</mo></mover><mi mathvariant=\"normal\">/</mi><mi>d</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">d\\vec p/dt</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>∫</mo><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover><mtext> </mtext><mi>d</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">\\int \\vec F\\,dt</annotation></semantics></math></span>)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","time","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","“change in”: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta p</annotation></semantics></math></span> is the momentum change, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta t</annotation></semantics></math></span> the contact time",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mtext>avg</mtext></msub></mrow><annotation encoding=\"application/x-tex\">F_{\\text{avg}}</annotation></semantics></math></span>","average force during the contact time","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">p</annotation></semantics></math></span>","momentum (magnitude or 1-D component)","kg·m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover accent=\"true\"><mi>p</mi><mo>⃗</mo></mover><mtext>before</mtext></msub></mrow><annotation encoding=\"application/x-tex\">\\vec{p}_{\\text{before}}</annotation></semantics></math></span>","momentum of each object before the interaction","kg·m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover accent=\"true\"><mi>p</mi><mo>⃗</mo></mover><mtext>after</mtext></msub></mrow><annotation encoding=\"application/x-tex\">\\vec{p}_{\\text{after}}</annotation></semantics></math></span>","momentum of each object after the interaction","kg·m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">v_{i}</annotation></semantics></math></span>","initial velocity (sign gives direction)","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>f</mi></msub></mrow><annotation encoding=\"application/x-tex\">v_{f}</annotation></semantics></math></span>","final velocity (sign gives direction)","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">p_{i}</annotation></semantics></math></span>","initial momentum","kg·m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>J</mi></mrow><annotation encoding=\"application/x-tex\">J</annotation></semantics></math></span>","impulse (1-D): change in momentum","N·s"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","capital delta","DEL-tuh","“change in”: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta x</annotation></semantics></math></span> means the final value of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span> minus the starting value."]],"calc":{"title":"Impulse and average force","inputs":[{"k":"m","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","unit":"kg","d":"0.145"},{"k":"vi","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">v_i</annotation></semantics></math></span>","unit":"m/s","d":"-40"},{"k":"vf","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>f</mi></msub></mrow><annotation encoding=\"application/x-tex\">v_f</annotation></semantics></math></span>","unit":"m/s","d":"45"},{"k":"dt","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta t</annotation></semantics></math></span>","unit":"s","d":"0.0007"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">p_i</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>J</mi><mo>=</mo><mi mathvariant=\"normal\">Δ</mi><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">J = \\Delta p</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mtext>avg</mtext></msub></mrow><annotation encoding=\"application/x-tex\">F_{\\text{avg}}</annotation></semantics></math></span>"],"outUnits":["kg·m/s","N·s","N"]}},{"id":"collisions","group":"en","title":"Collisions","blurb":"Momentum is always conserved in a collision; kinetic energy only sometimes.","body":"\n<p>In a collision the objects push on each other hard for a brief time, so outside forces hardly matter and total momentum is conserved. What happens to kinetic energy depends on the collision.</p>\n<p><b>Elastic:</b> kinetic energy is conserved too (billiard balls, nearly). In one dimension, for masses <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">m_1</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">m_2</annotation></semantics></math></span> with object 2 initially at rest:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msubsup><mi>v</mi><mn>1</mn><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msubsup><mo>=</mo><mfrac><mrow><msub><mi>m</mi><mn>1</mn></msub><mo>−</mo><msub><mi>m</mi><mn>2</mn></msub></mrow><mrow><msub><mi>m</mi><mn>1</mn></msub><mo>+</mo><msub><mi>m</mi><mn>2</mn></msub></mrow></mfrac><mtext> </mtext><msub><mi>v</mi><mn>1</mn></msub><mo separator=\"true\">,</mo><mspace width=\"2em\"/><msubsup><mi>v</mi><mn>2</mn><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msubsup><mo>=</mo><mfrac><mrow><mn>2</mn><msub><mi>m</mi><mn>1</mn></msub></mrow><mrow><msub><mi>m</mi><mn>1</mn></msub><mo>+</mo><msub><mi>m</mi><mn>2</mn></msub></mrow></mfrac><mtext> </mtext><msub><mi>v</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">v_1&#x27; = \\frac{m_1 - m_2}{m_1 + m_2}\\,v_1, \\qquad v_2&#x27; = \\frac{2m_1}{m_1 + m_2}\\,v_1</annotation></semantics></math></span></div>\n<p><b>Perfectly inelastic:</b> the objects stick together and move as one. This loses the most kinetic energy that momentum conservation allows:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msup><mi>v</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup><mo>=</mo><mfrac><mrow><msub><mi>m</mi><mn>1</mn></msub><msub><mi>v</mi><mn>1</mn></msub><mo>+</mo><msub><mi>m</mi><mn>2</mn></msub><msub><mi>v</mi><mn>2</mn></msub></mrow><mrow><msub><mi>m</mi><mn>1</mn></msub><mo>+</mo><msub><mi>m</mi><mn>2</mn></msub></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">v&#x27; = \\frac{m_1 v_1 + m_2 v_2}{m_1 + m_2}</annotation></semantics></math></span></div>\n<p>Real collisions fall in between. The <b>coefficient of restitution</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi></mrow><annotation encoding=\"application/x-tex\">e</annotation></semantics></math></span> compares how fast the objects separate to how fast they approached: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">e = 1</annotation></semantics></math></span> is elastic, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">e = 0</annotation></semantics></math></span> is sticking together.</p>\n<div class=\"sim\" data-sim=\"collide\"></div>","related":["momentum","energy"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msubsup><mi>v</mi><mn>1</mn><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msubsup></mrow><annotation encoding=\"application/x-tex\">v&#x27;_{1}</annotation></semantics></math></span>","velocity of object 1 after the collision","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">m_{1}</annotation></semantics></math></span>","mass of object 1","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">m_{2}</annotation></semantics></math></span>","mass of object 2","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">v_{1}</annotation></semantics></math></span>","velocity of object 1 before the collision","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msubsup><mi>v</mi><mn>2</mn><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msubsup></mrow><annotation encoding=\"application/x-tex\">v&#x27;_{2}</annotation></semantics></math></span>","velocity of object 2 after the collision","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>v</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup></mrow><annotation encoding=\"application/x-tex\">v&#x27;</annotation></semantics></math></span>","common velocity of the stuck-together objects after a perfectly inelastic collision","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">v_{2}</annotation></semantics></math></span>","velocity of object 2 before the collision (zero in the elastic formulas)","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi></mrow><annotation encoding=\"application/x-tex\">e</annotation></semantics></math></span>","coefficient of restitution: separation speed ÷ approach speed (1 elastic, 0 sticking)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K</mi></mrow><annotation encoding=\"application/x-tex\">K</annotation></semantics></math></span>","total kinetic energy (calculator shows the amount lost)","J"]],"greek":[],"calc":{"title":"1-D collision","inputs":[{"k":"m1","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">m_1</annotation></semantics></math></span>","unit":"kg","d":"2"},{"k":"v1","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">v_1</annotation></semantics></math></span>","unit":"m/s","d":"3"},{"k":"m2","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">m_2</annotation></semantics></math></span>","unit":"kg","d":"1"},{"k":"v2","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">v_2</annotation></semantics></math></span>","unit":"m/s","d":"-1"},{"k":"e","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi></mrow><annotation encoding=\"application/x-tex\">e</annotation></semantics></math></span>","unit":"","d":"1"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msubsup><mi>v</mi><mn>1</mn><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msubsup></mrow><annotation encoding=\"application/x-tex\">v_1&#x27;</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msubsup><mi>v</mi><mn>2</mn><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msubsup></mrow><annotation encoding=\"application/x-tex\">v_2&#x27;</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K</mi><mtext> lost</mtext></mrow><annotation encoding=\"application/x-tex\">K\\ \\text{lost}</annotation></semantics></math></span>"],"outUnits":["m/s","m/s","J"]}},{"id":"torque","group":"ro","title":"Torque","blurb":"The turning effect of a force depends on where and how it is applied.","body":"\n<p>Push a door near its hinge and it barely moves; push at the handle and it swings easily. The turning effect is <b>torque</b>, which depends on the force <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi></mrow><annotation encoding=\"application/x-tex\">F</annotation></semantics></math></span>, the distance <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span> from the pivot to where the force acts, and the angle <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span> between <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>r</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec r</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec F</annotation></semantics></math></span>:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>τ</mi><mo>=</mo><mi>r</mi><mi>F</mi><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mover accent=\"true\"><mi>τ</mi><mo>⃗</mo></mover><mo>=</mo><mover accent=\"true\"><mi>r</mi><mo>⃗</mo></mover><mo>×</mo><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\tau = r F \\sin\\theta, \\qquad \\vec\\tau = \\vec r\\times\\vec F</annotation></semantics></math></span></div>\n<p>The combination <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi><mi>sin</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">r\\sin\\theta</annotation></semantics></math></span> is the <b>lever arm</b>, the perpendicular distance from the pivot to the force's line of action. Torque is measured in N·m (not joules, even though the units match). By convention a counterclockwise torque is positive.</p>\n<p><b>Equilibrium.</b> An object stays at rest only if both the forces and the torques balance:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mo>∑</mo><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover><mo>=</mo><mn>0</mn><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mo>∑</mo><mi>τ</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\\sum \\vec F = 0, \\qquad \\sum \\tau = 0</annotation></semantics></math></span></div>\n<p>You can take torques about any point, so pick one where an unknown force acts. Its torque vanishes and drops out of the equation. A seesaw balances when <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mn>1</mn></msub><mi>g</mi><mtext> </mtext><msub><mi>r</mi><mn>1</mn></msub><mo>=</mo><msub><mi>m</mi><mn>2</mn></msub><mi>g</mi><mtext> </mtext><msub><mi>r</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">m_1 g\\, r_1 = m_2 g\\, r_2</annotation></semantics></math></span>.</p>","related":["inertia","angmom","circular","wireforce"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi></mrow><annotation encoding=\"application/x-tex\">\\tau</annotation></semantics></math></span>","torque: turning effect of a force about the pivot (counterclockwise positive)","N·m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","distance from the pivot to where the force acts","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi></mrow><annotation encoding=\"application/x-tex\">F</annotation></semantics></math></span>","magnitude of the applied force","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","angle between <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>r</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec r</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec F</annotation></semantics></math></span>","°"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>τ</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{\\tau}</annotation></semantics></math></span>","torque vector, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>r</mi><mo>⃗</mo></mover><mo>×</mo><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec r\\times\\vec F</annotation></semantics></math></span>; direction is along the rotation axis","N·m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>r</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{r}</annotation></semantics></math></span>","position vector from the pivot to the force’s point of application","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{F}</annotation></semantics></math></span>","force vector; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi></mrow><annotation encoding=\"application/x-tex\">F</annotation></semantics></math></span> alone is its magnitude","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">m_{1}</annotation></semantics></math></span>","mass on one side of the seesaw","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">g</annotation></semantics></math></span>","gravitational acceleration ≈ 9.81 m/s²","m/s²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">r_{1}</annotation></semantics></math></span>","distance of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">m_1</annotation></semantics></math></span> from the pivot","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">m_{2}</annotation></semantics></math></span>","mass on the other side of the seesaw","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">r_{2}</annotation></semantics></math></span>","distance of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">m_2</annotation></semantics></math></span> from the pivot","m"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","theta","THAY-tuh","the angle between the position vector <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>r</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec r</annotation></semantics></math></span> (pivot to where the force acts) and the force."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi></mrow><annotation encoding=\"application/x-tex\">\\tau</annotation></semantics></math></span>","tau","rhymes with “cow”","torque, the turning effect of a force, in N·m."]],"calc":{"title":"Torque and balance","inputs":[{"k":"F","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi></mrow><annotation encoding=\"application/x-tex\">F</annotation></semantics></math></span>","unit":"N","d":"50"},{"k":"r","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","unit":"m","d":"0.3"},{"k":"th","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","unit":"°","d":"90"},{"k":"m1","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mn>1</mn></msub><mtext> </mtext><mo stretchy=\"false\">(</mo><mtext>seesaw</mtext><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">m_1\\ (\\text{seesaw})</annotation></semantics></math></span>","unit":"kg","d":"30"},{"k":"r1","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">r_1</annotation></semantics></math></span>","unit":"m","d":"1.5"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi></mrow><annotation encoding=\"application/x-tex\">\\tau</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mn>2</mn></msub><mtext> needed at </mtext><mi>r</mi><mo>=</mo><mn>2</mn><mtext> m</mtext></mrow><annotation encoding=\"application/x-tex\">m_2\\ \\text{needed at}\\ r = 2\\ \\text{m}</annotation></semantics></math></span>"],"outUnits":["N·m","kg"]}},{"id":"inertia","group":"ro","title":"Rotational Dynamics","blurb":"Moment of inertia is to rotation what mass is to straight-line motion.","body":"\n<p>Rotation has its own version of each straight-line quantity: angle <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>, angular velocity <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span> and angular acceleration <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi></mrow><annotation encoding=\"application/x-tex\">\\alpha</annotation></semantics></math></span>. The constant-acceleration equations carry over with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>→</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">x\\to\\theta</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>→</mo><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">v\\to\\omega</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>→</mo><mi>α</mi></mrow><annotation encoding=\"application/x-tex\">a\\to\\alpha</annotation></semantics></math></span>.</p>\n<p>Newton's second law for rotation replaces force with torque and mass with the <b>moment of inertia</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>, which measures how hard an object is to spin up:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mo>∑</mo><mi>τ</mi><mo>=</mo><mi>I</mi><mi>α</mi><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>I</mi><mo>=</mo><mo>∑</mo><msub><mi>m</mi><mi>i</mi></msub><msubsup><mi>r</mi><mi>i</mi><mn>2</mn></msubsup></mrow><annotation encoding=\"application/x-tex\">\\sum\\tau = I\\alpha, \\qquad I = \\sum m_i r_i^2</annotation></semantics></math></span></div>\n<p>Mass far from the axis counts much more than mass near it. Common shapes of mass <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span>, each about an axis through its centre (for the hoop and disc, the symmetry axis; for the rod, perpendicular to its length <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>):</p>\n<table class=\"t\">\n<tr><th>Shape</th><th><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span></th></tr>\n<tr><td>Thin hoop or ring</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">M R^2</annotation></semantics></math></span></td></tr>\n<tr><td>Solid disc or cylinder</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\tfrac12 M R^2</annotation></semantics></math></span></td></tr>\n<tr><td>Solid sphere</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>2</mn><mn>5</mn></mfrac><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\tfrac25 M R^2</annotation></semantics></math></span></td></tr>\n<tr><td>Hollow sphere</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>2</mn><mn>3</mn></mfrac><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\tfrac23 M R^2</annotation></semantics></math></span></td></tr>\n<tr><td>Rod about its centre</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>1</mn><mn>12</mn></mfrac><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\tfrac1{12} M L^2</annotation></semantics></math></span></td></tr>\n</table>\n<p>A spinning object stores kinetic energy <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>I</mi><msup><mi>ω</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">K = \\tfrac12 I\\omega^2</annotation></semantics></math></span>. For an axis parallel to one through the centre of mass but a distance <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span> away, use the parallel-axis theorem <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mo>=</mo><msub><mi>I</mi><mtext>cm</mtext></msub><mo>+</mo><mi>M</mi><msup><mi>d</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">I = I_{\\text{cm}} + M d^2</annotation></semantics></math></span>.</p>","related":["torque","angmom","rolling"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi></mrow><annotation encoding=\"application/x-tex\">\\tau</annotation></semantics></math></span>","torque on the object","N·m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","moment of inertia: resistance to angular acceleration","kg·m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi></mrow><annotation encoding=\"application/x-tex\">\\alpha</annotation></semantics></math></span>","angular acceleration","rad/s²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">m_{i}</annotation></semantics></math></span>","mass of the <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>i</mi></mrow><annotation encoding=\"application/x-tex\">i</annotation></semantics></math></span>-th small piece of the object","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">r_{i}</annotation></semantics></math></span>","distance of the <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>i</mi></mrow><annotation encoding=\"application/x-tex\">i</annotation></semantics></math></span>-th piece from the axis","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","rotation angle","rad"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>","angular velocity","rad/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span>","linear position (its rotational counterpart is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>)","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","linear velocity (its rotational counterpart is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>)","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>","linear acceleration (its rotational counterpart is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi></mrow><annotation encoding=\"application/x-tex\">\\alpha</annotation></semantics></math></span>)","m/s²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span>","total mass of the object","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","length of the rod","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","radius of the hoop, disc or sphere","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K</mi></mrow><annotation encoding=\"application/x-tex\">K</annotation></semantics></math></span>","rotational kinetic energy","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","distance between the new axis and the parallel axis through the centre of mass","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mtext>cm</mtext></msub></mrow><annotation encoding=\"application/x-tex\">I_{\\text{cm}}</annotation></semantics></math></span>","moment of inertia about a parallel axis through the centre of mass","kg·m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","time the torque is applied","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>K</mi><mtext>rot</mtext></msub></mrow><annotation encoding=\"application/x-tex\">K_{\\text{rot}}</annotation></semantics></math></span>","rotational kinetic energy after time <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","J"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi></mrow><annotation encoding=\"application/x-tex\">\\alpha</annotation></semantics></math></span>","alpha","AL-fuh","angular acceleration, in rad/s²."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","theta","THAY-tuh","angle turned, in radians."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi></mrow><annotation encoding=\"application/x-tex\">\\tau</annotation></semantics></math></span>","tau","rhymes with “cow”","torque, in N·m."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>","omega","oh-MAY-guh","angular velocity, in rad/s."]],"calc":{"title":"Spin up a solid disc","inputs":[{"k":"M","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span>","unit":"kg","d":"5"},{"k":"R","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","unit":"m","d":"0.2"},{"k":"tau","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi></mrow><annotation encoding=\"application/x-tex\">\\tau</annotation></semantics></math></span>","unit":"N·m","d":"2"},{"k":"t","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","unit":"s","d":"3"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi></mrow><annotation encoding=\"application/x-tex\">\\alpha</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mtext> after </mtext><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">\\omega\\ \\text{after}\\ t</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>K</mi><mtext>rot</mtext></msub></mrow><annotation encoding=\"application/x-tex\">K_{\\text{rot}}</annotation></semantics></math></span>"],"outUnits":["kg·m²","rad/s²","rad/s","J"]}},{"id":"angmom","group":"ro","title":"Angular Momentum","blurb":"Spin that stays constant unless an outside torque acts.","body":"\n<p>Angular momentum is the rotational counterpart of momentum. For a rigid body spinning about a fixed axis, and for a point mass moving past an origin:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>L</mi><mo>=</mo><mi>I</mi><mi>ω</mi><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mover accent=\"true\"><mi>L</mi><mo>⃗</mo></mover><mo>=</mo><mover accent=\"true\"><mi>r</mi><mo>⃗</mo></mover><mo>×</mo><mover accent=\"true\"><mi>p</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">L = I\\omega, \\qquad \\vec L = \\vec r\\times\\vec p</annotation></semantics></math></span></div>\n<p>Torque changes angular momentum the way force changes momentum, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>∑</mo><mover accent=\"true\"><mi>τ</mi><mo>⃗</mo></mover><mo>=</mo><mi>d</mi><mover accent=\"true\"><mi>L</mi><mo>⃗</mo></mover><mi mathvariant=\"normal\">/</mi><mi>d</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">\\sum\\vec\\tau = d\\vec L/dt</annotation></semantics></math></span>. So with no external torque, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span> is conserved:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>I</mi><mn>1</mn></msub><msub><mi>ω</mi><mn>1</mn></msub><mo>=</mo><msub><mi>I</mi><mn>2</mn></msub><msub><mi>ω</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_1\\omega_1 = I_2\\omega_2</annotation></semantics></math></span></div>\n<p>A figure skater pulling in their arms lowers <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>, so <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span> rises and they spin faster. A diver tucks to spin through a somersault, then stretches out to slow the rotation before entering the water. On a larger scale, a collapsing star spins up enormously as it shrinks, which is why neutron stars can rotate hundreds of times a second.</p>\n<p>Because <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>L</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec L</annotation></semantics></math></span> is a vector, conservation also fixes its direction. That's why a spinning gyroscope holds its orientation, and why a fast-spinning top doesn't simply topple: gravity's torque only slowly swings <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>L</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec L</annotation></semantics></math></span> around in a circle (precession).</p>","related":["inertia","momentum","orbits","torque"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","angular momentum (about the axis)","kg·m²/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","moment of inertia about the spin axis","kg·m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>","angular velocity","rad/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>L</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{L}</annotation></semantics></math></span>","angular momentum vector; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span> alone is its magnitude","kg·m²/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>r</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{r}</annotation></semantics></math></span>","position vector of the point mass from the origin","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>p</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{p}</annotation></semantics></math></span>","linear momentum vector of the point mass","kg·m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_{1}</annotation></semantics></math></span>","moment of inertia before (e.g. arms out)","kg·m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ω</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\omega_{1}</annotation></semantics></math></span>","angular velocity before","rad/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_{2}</annotation></semantics></math></span>","moment of inertia after (e.g. arms pulled in)","kg·m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ω</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\omega_{2}</annotation></semantics></math></span>","angular velocity after","rad/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>τ</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{\\tau}</annotation></semantics></math></span>","external torque vector","N·m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","an infinitesimally small change (used in the derivative <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mover accent=\"true\"><mi>L</mi><mo>⃗</mo></mover><mi mathvariant=\"normal\">/</mi><mi>d</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">d\\vec L/dt</annotation></semantics></math></span>)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","time","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>K</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">K_{2}</annotation></semantics></math></span>","rotational kinetic energy after","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>K</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">K_{1}</annotation></semantics></math></span>","rotational kinetic energy before","J"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi></mrow><annotation encoding=\"application/x-tex\">\\tau</annotation></semantics></math></span>","tau","rhymes with “cow”","torque, in N·m. With no outside torque, angular momentum is conserved."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>","omega","oh-MAY-guh","angular velocity, in rad/s."]],"calc":{"title":"Skater pulls in","inputs":[{"k":"I1","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_1</annotation></semantics></math></span>","unit":"kg·m²","d":"4"},{"k":"w1","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ω</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\omega_1</annotation></semantics></math></span>","unit":"rad/s","d":"6"},{"k":"I2","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_2</annotation></semantics></math></span>","unit":"kg·m²","d":"1.5"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ω</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\omega_2</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>K</mi><mn>2</mn></msub><mi mathvariant=\"normal\">/</mi><msub><mi>K</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">K_2 / K_1</annotation></semantics></math></span>"],"outUnits":["kg·m²/s","rad/s","×"]}},{"id":"rolling","group":"ro","title":"Rolling Motion","blurb":"Rolling combines moving forward with spinning, and splits the energy between them.","body":"\n<p>A wheel rolling without slipping moves forward and spins at once, with the two locked together. The contact point is momentarily at rest, which gives the rolling condition linking the centre's speed <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mtext>cm</mtext></msub></mrow><annotation encoding=\"application/x-tex\">v_{\\text{cm}}</annotation></semantics></math></span> to the spin rate <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span> and radius <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>v</mi><mtext>cm</mtext></msub><mo>=</mo><mi>ω</mi><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">v_{\\text{cm}} = \\omega R</annotation></semantics></math></span></div>\n<p>Its kinetic energy has a translational part and a rotational part:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>K</mi><mo>=</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi>M</mi><msup><mi>v</mi><mn>2</mn></msup><mo>+</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi>I</mi><msup><mi>ω</mi><mn>2</mn></msup><mo>=</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mrow><mo fence=\"true\">(</mo><mi>M</mi><mo>+</mo><mfrac><mi>I</mi><msup><mi>R</mi><mn>2</mn></msup></mfrac><mo fence=\"true\">)</mo></mrow><msup><mi>v</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">K = \\tfrac12 M v^2 + \\tfrac12 I\\omega^2 = \\tfrac12\\left(M + \\frac{I}{R^2}\\right) v^2</annotation></semantics></math></span></div>\n<p>Write <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mo>=</mo><mi>β</mi><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">I = \\beta M R^2</annotation></semantics></math></span>, where <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>β</mi></mrow><annotation encoding=\"application/x-tex\">\\beta</annotation></semantics></math></span> is 1 for a hoop, ½ for a solid cylinder and ⅖ for a solid sphere. Rolling down a height <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span> from rest gives</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>v</mi><mo>=</mo><msqrt><mfrac><mrow><mn>2</mn><mi>g</mi><mi>h</mi></mrow><mrow><mn>1</mn><mo>+</mo><mi>β</mi></mrow></mfrac></msqrt></mrow><annotation encoding=\"application/x-tex\">v = \\sqrt{\\frac{2 g h}{1 + \\beta}}</annotation></semantics></math></span></div>\n<p>Mass and radius cancel. (Static friction at the contact point makes it roll, but does no work, because that point isn't sliding.) In a race down a ramp, any solid sphere beats any solid cylinder, which beats any hoop, because a smaller share of the energy goes into spinning. The same split of energy sets the acceleration on a slope: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mi>g</mi><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mi mathvariant=\"normal\">/</mi><mo stretchy=\"false\">(</mo><mn>1</mn><mo>+</mo><mi>β</mi><mo stretchy=\"false\">)</mo></mrow><annotation e
