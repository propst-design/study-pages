ding-wave frequency, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mi mathvariant=\"normal\">/</mi><mn>2</mn><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">v/2L</annotation></semantics></math></span>","Hz"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","lambda","LAM-duh","wavelength; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>λ</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\lambda_n</annotation></semantics></math></span> is the wavelength of the <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>th harmonic."]],"calc":{"title":"Harmonics of a string","inputs":[{"k":"L","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","unit":"m","d":"0.65"},{"k":"v","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","unit":"m/s","d":"286"},{"k":"n","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>","unit":"","d":"3"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">f_1</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">f_n</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>λ</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\lambda_n</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>nodes (incl. ends)</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{nodes (incl. ends)}</annotation></semantics></math></span>"],"outUnits":["Hz","Hz","m",""]}},{"id":"sound","group":"so","title":"Sound","blurb":"Pressure waves in air, measured in decibels.","body":"\n<p>Sound is a longitudinal wave: a vibrating object squeezes and stretches the air next to it, and those pressure changes travel outward. Its speed depends on the medium's springiness and density. In air it rises with temperature:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>v</mi><mo>≈</mo><mn>331</mn><mtext> m/s</mtext><mo>+</mo><mo stretchy=\"false\">(</mo><mn>0.6</mn><mtext> m/s per °C</mtext><mo stretchy=\"false\">)</mo><mo>×</mo><msub><mi>T</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">v \\approx 331\\ \\text{m/s} + (0.6\\ \\text{m/s per °C})\\times T_C</annotation></semantics></math></span></div>\n<p>Here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_C</annotation></semantics></math></span> is the air temperature in °C. That's about 343 m/s at 20 °C. Sound moves roughly four times faster in water and over ten times faster in steel. A count between a lightning flash and its thunder gives the distance: about three seconds per kilometre.</p>\n<p>Humans hear roughly 20 Hz to 20 kHz. The <b>intensity</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span> (power per unit area) spans an enormous range, so loudness is described on a logarithmic decibel scale relative to the threshold of hearing <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>0</mn></msub><mo>=</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>12</mn></mrow></msup><mtext> </mtext><msup><mtext>W/m</mtext><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">I_0 = 10^{-12}\\ \\text{W/m}^2</annotation></semantics></math></span>:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>β</mi><mo>=</mo><mn>10</mn><msub><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>10</mn></msub><mfrac><mi>I</mi><msub><mi>I</mi><mn>0</mn></msub></mfrac><mtext>  dB</mtext></mrow><annotation encoding=\"application/x-tex\">\\beta = 10\\log_{10}\\frac{I}{I_0}\\ \\ \\text{dB}</annotation></semantics></math></span></div>\n<p>Every 10 dB is ten times the intensity; +3 dB is about double. From a small source sound spreads over a sphere, so at distance <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span> from a source of power <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span> the intensity is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mo>=</mo><mi>P</mi><mi mathvariant=\"normal\">/</mi><mo stretchy=\"false\">(</mo><mn>4</mn><mi>π</mi><msup><mi>r</mi><mn>2</mn></msup><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">I = P/(4\\pi r^2)</annotation></semantics></math></span>, and doubling the distance drops the level by about 6 dB.</p>\n<table class=\"t\">\n<tr><th>Sound</th><th>Level</th></tr>\n<tr><td>Rustling leaves</td><td>~20 dB</td></tr>\n<tr><td>Conversation</td><td>~60 dB</td></tr>\n<tr><td>Busy traffic</td><td>~80 dB</td></tr>\n<tr><td>Rock concert</td><td>~110 dB</td></tr>\n<tr><td>Threshold of pain</td><td>~120–130 dB</td></tr>\n</table>","related":["waves","doppler","pipes","beats"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","speed of sound in air","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_{C}</annotation></semantics></math></span>","air temperature in degrees Celsius","°C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>β</mi></mrow><annotation encoding=\"application/x-tex\">\\beta</annotation></semantics></math></span>","sound intensity level (loudness) on the decibel scale","dB"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","intensity: sound power per unit area","W/m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_{0}</annotation></semantics></math></span>","threshold-of-hearing reference intensity, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>12</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">10^{-12}</annotation></semantics></math></span> W/m²","W/m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","distance from the sound source","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span>","acoustic power emitted by the source","W"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","circle constant ≈ 3.14159",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mtext>sound</mtext></msub></mrow><annotation encoding=\"application/x-tex\">v_{\\text{sound}}</annotation></semantics></math></span>","speed of sound in air at temperature <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_C</annotation></semantics></math></span>","m/s"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>β</mi></mrow><annotation encoding=\"application/x-tex\">\\beta</annotation></semantics></math></span>","beta","BAY-tuh","sound level in decibels (dB), a logarithmic measure of intensity."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","pi","pie","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span> (a circumference divided by its diameter). It appears wherever circles, rotation or spreading in all directions are involved."]],"calc":{"title":"Decibels from a source","inputs":[{"k":"P","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mtext> (acoustic)</mtext></mrow><annotation encoding=\"application/x-tex\">P\\ \\text{(acoustic)}</annotation></semantics></math></span>","unit":"W","d":"0.01"},{"k":"r","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","unit":"m","d":"5"},{"k":"T","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_C</annotation></semantics></math></span>","unit":"°C","d":"20"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>β</mi></mrow><annotation encoding=\"application/x-tex\">\\beta</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mtext>sound</mtext></msub></mrow><annotation encoding=\"application/x-tex\">v_{\\text{sound}}</annotation></semantics></math></span>"],"outUnits":["W/m²","dB","m/s"]}},{"id":"doppler","group":"so","title":"Doppler Effect","blurb":"Motion squeezes or stretches waves, shifting the pitch you hear.","body":"\n<p>A siren sounds higher as an ambulance approaches and lower as it moves away. A moving source crowds its wavefronts together ahead of it and spreads them out behind. A moving listener meets wavefronts more or less often. Either way, the frequency heard changes:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msup><mi>f</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup><mo>=</mo><mi>f</mi><mtext> </mtext><mfrac><mrow><mi>v</mi><mo>±</mo><msub><mi>v</mi><mi>o</mi></msub></mrow><mrow><mi>v</mi><mo>∓</mo><msub><mi>v</mi><mi>s</mi></msub></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">f&#x27; = f\\,\\frac{v \\pm v_o}{v \\mp v_s}</annotation></semantics></math></span></div>\n<p>Here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span> is the emitted frequency, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span> the speed of sound, and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>o</mi></msub></mrow><annotation encoding=\"application/x-tex\">v_o</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>s</mi></msub></mrow><annotation encoding=\"application/x-tex\">v_s</annotation></semantics></math></span> the observer's and source's speeds, all measured relative to the air. Use the upper signs when they move <i>toward</i> each other (pitch goes up) and the lower signs when moving apart.</p>\n<p>When a source moves faster than sound, the wavefronts pile up into a cone-shaped <b>shock wave</b>, heard on the ground as a sonic boom. The cone's half-angle <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span> depends on the Mach number <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi><mo>=</mo><msub><mi>v</mi><mi>s</mi></msub><mi mathvariant=\"normal\">/</mi><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">M = v_s/v</annotation></semantics></math></span>:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mfrac><mn>1</mn><mi>M</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">\\sin\\theta = \\frac{1}{M}</annotation></semantics></math></span></div>\n<p>Light shows a Doppler shift too. Distant galaxies appear redshifted, with the shift growing with distance, a key piece of evidence that the universe is expanding. Police radar and weather radar both measure speed this way.</p>\n<div class=\"sim\" data-sim=\"doppler\"></div>","related":["sound","waves","emwaves"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>f</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup></mrow><annotation encoding=\"application/x-tex\">f&#x27;</annotation></semantics></math></span>","frequency heard by the observer","Hz"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","frequency emitted by the source","Hz"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","speed of sound relative to the air","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>o</mi></msub></mrow><annotation encoding=\"application/x-tex\">v_{o}</annotation></semantics></math></span>","observer's speed relative to the air","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>s</mi></msub></mrow><annotation encoding=\"application/x-tex\">v_{s}</annotation></semantics></math></span>","source's speed relative to the air","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","half-angle of the shock-wave cone","°"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span>","Mach number: source speed divided by sound speed, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>s</mi></msub><mi mathvariant=\"normal\">/</mi><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v_s/v</annotation></semantics></math></span>",""]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","theta","THAY-tuh","half-angle of the shock-wave cone behind a supersonic source."]],"calc":{"title":"Moving source and listener","inputs":[{"k":"f","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","unit":"Hz","d":"700"},{"k":"vs","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>s</mi></msub></mrow><annotation encoding=\"application/x-tex\">v_s</annotation></semantics></math></span>","unit":"m/s","d":"30"},{"k":"vo","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>o</mi></msub></mrow><annotation encoding=\"application/x-tex\">v_o</annotation></semantics></math></span>","unit":"m/s","d":"0"},{"k":"v","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","unit":"m/s","d":"343"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>f</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup><mtext> approaching</mtext></mrow><annotation encoding=\"application/x-tex\">f&#x27;\\ \\text{approaching}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>f</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup><mtext> receding</mtext></mrow><annotation encoding=\"application/x-tex\">f&#x27;\\ \\text{receding}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi><mo>=</mo><msub><mi>v</mi><mi>s</mi></msub><mi mathvariant=\"normal\">/</mi><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">M = v_s / v</annotation></semantics></math></span>"],"outUnits":["Hz","Hz",""]}},{"id":"pipes","group":"so","title":"Resonance in Pipes","blurb":"Air columns ring at notes set by their length and whether their ends are open.","body":"\n<p>Blow across a bottle or through a flute and the air inside sets up a standing sound wave. An open end lets the air move freely, so it's a displacement <b>antinode</b>. A closed end stops the air, so it's a <b>node</b>.</p>\n<p><b>Open at both ends</b> (flute, open organ pipe): an antinode at each end, so all harmonics are present:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>f</mi><mi>n</mi></msub><mo>=</mo><mfrac><mrow><mi>n</mi><mi>v</mi></mrow><mrow><mn>2</mn><mi>L</mi></mrow></mfrac><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>n</mi><mo>=</mo><mn>1</mn><mo separator=\"true\">,</mo><mn>2</mn><mo separator=\"true\">,</mo><mn>3</mn><mo separator=\"true\">,</mo><mo>…</mo></mrow><annotation encoding=\"application/x-tex\">f_n = \\frac{n v}{2L}, \\qquad n = 1, 2, 3, \\ldots</annotation></semantics></math></span></div>\n<p><b>Closed at one end</b> (a bottle, a clarinet to a good approximation): a node at one end and an antinode at the other. Only odd harmonics fit, and the fundamental is an octave lower than an open pipe of the same length:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>f</mi><mi>n</mi></msub><mo>=</mo><mfrac><mrow><mi>n</mi><mi>v</mi></mrow><mrow><mn>4</mn><mi>L</mi></mrow></mfrac><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>n</mi><mo>=</mo><mn>1</mn><mo separator=\"true\">,</mo><mn>3</mn><mo separator=\"true\">,</mo><mn>5</mn><mo separator=\"true\">,</mo><mo>…</mo></mrow><annotation encoding=\"application/x-tex\">f_n = \\frac{n v}{4L}, \\qquad n = 1, 3, 5, \\ldots</annotation></semantics></math></span></div>\n<p>Here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span> is the pipe length and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span> the speed of sound. The missing even harmonics give closed pipes their hollow, woody tone. In real pipes the antinode sits slightly beyond each open end, so the effective length is a little longer than the physical one (by about <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0.6</mn></mrow><annotation encoding=\"application/x-tex\">0.6</annotation></semantics></math></span> times the pipe's radius per open end).</p>","related":["standing","sound","beats"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">f_{n}</annotation></semantics></math></span>","frequency of the <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>th harmonic of the pipe","Hz"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>","harmonic number: 1, 2, 3, … (open pipe) or 1, 3, 5, … (closed pipe)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","speed of sound in the air column","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","length of the pipe (air column)","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">f_{1}</annotation></semantics></math></span>","fundamental (lowest) frequency, for open–open or closed pipe","Hz"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">f_{2}</annotation></semantics></math></span>","second harmonic of an open–open pipe, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mi mathvariant=\"normal\">/</mi><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">v/L</annotation></semantics></math></span>","Hz"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mn>3</mn></msub></mrow><annotation encoding=\"application/x-tex\">f_{3}</annotation></semantics></math></span>","third harmonic of a closed pipe, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><mi>v</mi><mi mathvariant=\"normal\">/</mi><mn>4</mn><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">3v/4L</annotation></semantics></math></span> (its first overtone)","Hz"]],"greek":[],"calc":{"title":"Pipe notes","inputs":[{"k":"L","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","unit":"m","d":"0.6"},{"k":"v","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","unit":"m/s","d":"343"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mn>1</mn></msub><mtext> open–open</mtext></mrow><annotation encoding=\"application/x-tex\">f_1\\ \\text{open–open}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mn>2</mn></msub><mtext> open–open</mtext></mrow><annotation encoding=\"application/x-tex\">f_2\\ \\text{open–open}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mn>1</mn></msub><mtext> closed</mtext></mrow><annotation encoding=\"application/x-tex\">f_1\\ \\text{closed}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mn>3</mn></msub><mtext> closed</mtext></mrow><annotation encoding=\"application/x-tex\">f_3\\ \\text{closed}</annotation></semantics></math></span>"],"outUnits":["Hz","Hz","Hz","Hz"]}},{"id":"beats","group":"so","title":"Beats","blurb":"Two nearly equal tones swell and fade at the difference of their frequencies.","body":"\n<p>Play two notes whose frequencies are close but not equal, and they drift in and out of step. When they're in step they reinforce; half a beat later they cancel. You hear a single tone whose loudness throbs at the <b>beat frequency</b>:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>f</mi><mtext>beat</mtext></msub><mo>=</mo><mi mathvariant=\"normal\">∣</mi><msub><mi>f</mi><mn>1</mn></msub><mo>−</mo><msub><mi>f</mi><mn>2</mn></msub><mi mathvariant=\"normal\">∣</mi></mrow><annotation encoding=\"application/x-tex\">f_{\\text{beat}} = |f_1 - f_2|</annotation></semantics></math></span></div>\n<p>The tone you hear sits at the average frequency <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mo stretchy=\"false\">(</mo><msub><mi>f</mi><mn>1</mn></msub><mo>+</mo><msub><mi>f</mi><mn>2</mn></msub><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\tfrac12 (f_1 + f_2)</annotation></semantics></math></span>. Adding the two waves shows why:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>sin</mi><mo>⁡</mo><msub><mi>ω</mi><mn>1</mn></msub><mi>t</mi><mo>+</mo><mi>sin</mi><mo>⁡</mo><msub><mi>ω</mi><mn>2</mn></msub><mi>t</mi><mo>=</mo><mn>2</mn><mi>cos</mi><mo>⁡</mo><mtext> ⁣</mtext><mrow><mo fence=\"true\">(</mo><mfrac><mrow><msub><mi>ω</mi><mn>1</mn></msub><mo>−</mo><msub><mi>ω</mi><mn>2</mn></msub></mrow><mn>2</mn></mfrac><mi>t</mi><mo fence=\"true\">)</mo></mrow><mi>sin</mi><mo>⁡</mo><mtext> ⁣</mtext><mrow><mo fence=\"true\">(</mo><mfrac><mrow><msub><mi>ω</mi><mn>1</mn></msub><mo>+</mo><msub><mi>ω</mi><mn>2</mn></msub></mrow><mn>2</mn></mfrac><mi>t</mi><mo fence=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\sin\\omega_1 t + \\sin\\omega_2 t = 2\\cos\\!\\left(\\frac{\\omega_1 - \\omega_2}{2}t\\right)\\sin\\!\\left(\\frac{\\omega_1 + \\omega_2}{2}t\\right)</annotation></semantics></math></span></div>\n<p>The cosine factor is a slow envelope. Loudness depends on its size, not its sign, so it peaks twice per cosine cycle, which is why the beat rate is the full difference, not half of it.</p>\n<p>Musicians tune by ear this way: play against a reference and adjust until the beats slow down and vanish. Beyond about 15 to 20 beats per second the ear stops hearing a throb and hears roughness instead.</p>","related":["superposition","sound","pipes"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mtext>beat</mtext></msub></mrow><annotation encoding=\"application/x-tex\">f_{\\text{beat}}</annotation></semantics></math></span>","beat frequency: how often the loudness swells per second","Hz"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">f_{1}</annotation></semantics></math></span>","frequency of the first tone","Hz"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">f_{2}</annotation></semantics></math></span>","frequency of the second tone","Hz"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ω</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\omega_{1}</annotation></semantics></math></span>","angular frequency of the first tone, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>p</mi><mi>i</mi><msub><mi>f</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">2pi f_1</annotation></semantics></math></span>","rad/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","time","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ω</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\omega_{2}</annotation></semantics></math></span>","angular frequency of the second tone, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>p</mi><mi>i</mi><msub><mi>f</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">2pi f_2</annotation></semantics></math></span>","rad/s"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math></span>","omega","oh-MAY-guh","angular frequency, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>π</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">2\\pi f</annotation></semantics></math></span>, of each tone."]],"calc":{"title":"Beat frequency","inputs":[{"k":"f1","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">f_1</annotation></semantics></math></span>","unit":"Hz","d":"440"},{"k":"f2","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">f_2</annotation></semantics></math></span>","unit":"Hz","d":"443"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mtext>beat</mtext></msub></mrow><annotation encoding=\"application/x-tex\">f_{\\text{beat}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>heard pitch</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{heard pitch}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>time between beats</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{time between beats}</annotation></semantics></math></span>"],"outUnits":["Hz","Hz","s"]}},{"id":"reflection","group":"li","title":"Reflection","blurb":"Light bounces off a surface at the same angle it arrived.","body":"\n<p>When light travels in a uniform material it goes in straight lines, so we can trace it as <b>rays</b>. At a smooth surface, a ray reflects so that the angle of reflection equals the angle of incidence, both measured from the <b>normal</b> (the line perpendicular to the surface):</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>θ</mi><mi>r</mi></msub><mo>=</mo><msub><mi>θ</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_r = \\theta_i</annotation></semantics></math></span></div>\n<p>A smooth surface like a mirror or still water gives <b>specular</b> reflection and a clear image. A rough surface like paper scatters light every which way (<b>diffuse</b> reflection), which is how you see most objects at all.</p>\n<p>In a <b>plane mirror</b>, the image appears as far behind the mirror as the object is in front, the same size and upright, but reversed front-to-back. It's a <b>virtual</b> image: light only seems to come from it. You need a mirror only half your height to see your whole body, wherever you stand.</p>\n<p>Curved mirrors focus light. See <a href=\"#/mirrors\">Curved Mirrors</a>.</p>","related":["refraction","mirrors","emwaves"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mi>r</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_{r}</annotation></semantics></math></span>","angle of reflection, measured from the normal","°"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_{i}</annotation></semantics></math></span>","angle of incidence, measured from the normal","°"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","theta","THAY-tuh","angles measured from the normal (the line perpendicular to the surface): <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_i</annotation></semantics></math></span> incidence, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mi>r</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_r</annotation></semantics></math></span> reflection."]],"calc":{"title":"Two mirrors at an angle","inputs":[{"k":"a","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>angle between mirrors</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{angle between mirrors}</annotation></semantics></math></span>","unit":"°","d":"60"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>images seen</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{images seen}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>deviation after both</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{deviation after both}</annotation></semantics></math></span>"],"outUnits":["","°"]}},{"id":"refraction","group":"li","title":"Refraction","blurb":"Light bends as it changes speed crossing from one material into another.","body":"\n<p>Light travels slower in glass or water than in a vacuum. The <b>index of refraction</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span> measures how much slower, comparing the vacuum speed <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">c</annotation></semantics></math></span> with the speed <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span> in the material:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>n</mi><mo>=</mo><mfrac><mi>c</mi><mi>v</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">n = \\frac{c}{v}</annotation></semantics></math></span></div>\n<p>When light crosses a boundary at an angle, the change of speed bends it. Going into a higher-index material it bends toward the normal; going out it bends away. The angles <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_1</annotation></semantics></math></span> (incoming, in index <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>n</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">n_1</annotation></semantics></math></span>) and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_2</annotation></semantics></math></span> (outgoing, in index <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>n</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">n_2</annotation></semantics></math></span>), both measured from the normal, obey <b>Snell's law</b>:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>n</mi><mn>1</mn></msub><mi>sin</mi><mo>⁡</mo><msub><mi>θ</mi><mn>1</mn></msub><mo>=</mo><msub><mi>n</mi><mn>2</mn></msub><mi>sin</mi><mo>⁡</mo><msub><mi>θ</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">n_1\\sin\\theta_1 = n_2\\sin\\theta_2</annotation></semantics></math></span></div>\n<p>The frequency stays the same across the boundary, so the wavelength shrinks inside the slower material: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>λ</mi><mi>n</mi></msub><mo>=</mo><mi>λ</mi><mi mathvariant=\"normal\">/</mi><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda_n = \\lambda/n</annotation></semantics></math></span>, where <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span> is the wavelength in vacuum.</p>\n<p><b>Total internal reflection.</b> Going from high <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span> to low <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>, the ray bends away from the normal. Beyond a <b>critical angle</b> no refracted ray is possible, and all the light reflects back:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>sin</mi><mo>⁡</mo><msub><mi>θ</mi><mi>c</mi></msub><mo>=</mo><mfrac><msub><mi>n</mi><mn>2</mn></msub><msub><mi>n</mi><mn>1</mn></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">\\sin\\theta_c = \\frac{n_2}{n_1}</annotation></semantics></math></span></div>\n<p>This traps light inside optical fibres and makes diamonds sparkle. Because <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span> is slightly different for each colour, refraction also spreads white light into a spectrum (dispersion), which is how prisms and rainbows work.</p>\n<table class=\"t\">\n<tr><th>Material</th><th><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span> (yellow light)</th></tr>\n<tr><td>Air</td><td>1.0003</td></tr><tr><td>Water</td><td>1.33</td></tr><tr><td>Crown glass</td><td>1.52</td></tr><tr><td>Diamond</td><td>2.42</td></tr>\n</table>","related":["reflection","lenses","thinfilm","polarization"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>","index of refraction of a material, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c</mi><mi mathvariant=\"normal\">/</mi><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">c/v</annotation></semantics></math></span>",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">c</annotation></semantics></math></span>","speed of light in vacuum ≈ 3.00×10⁸ m/s","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","speed of light in the material","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>n</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">n_{1}</annotation></semantics></math></span>","refractive index of the first (incoming) medium",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_{1}</annotation></semantics></math></span>","angle of the incoming ray from the normal","°"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>n</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">n_{2}</annotation></semantics></math></span>","refractive index of the second (outgoing) medium",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_{2}</annotation></semantics></math></span>","angle of the refracted ray from the normal","°"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mi>c</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_{c}</annotation></semantics></math></span>","critical angle for total internal reflection (needs <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>n</mi><mn>1</mn></msub><mo>&gt;</mo><msub><mi>n</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">n_1 &gt; n_2</annotation></semantics></math></span>)","°"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>λ</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\lambda_{n}</annotation></semantics></math></span>","wavelength inside the material, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>l</mi><mi>a</mi><mi>m</mi><mi>b</mi><mi>d</mi><mi>a</mi><mi mathvariant=\"normal\">/</mi><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">lambda/n</annotation></semantics></math></span>","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","wavelength in vacuum","m"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","theta","THAY-tuh","angles measured from the normal; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mi>c</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_c</annotation></semantics></math></span> is the critical angle for total internal reflection."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","lambda","LAM-duh","wavelength; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>λ</mi><mi>n</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\lambda_n</annotation></semantics></math></span> is the shorter wavelength inside a material of index <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>."]],"calc":{"title":"Snell's law","inputs":[{"k":"n1","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>n</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">n_1</annotation></semantics></math></span>","unit":"","d":"1.00"},{"k":"n2","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>n</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">n_2</annotation></semantics></math></span>","unit":"","d":"1.33"},{"k":"t1","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_1</annotation></semantics></math></span>","unit":"°","d":"45"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_2</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mi>c</mi></msub><mtext> </mtext><mo stretchy=\"false\">(</mo><msub><mi>n</mi><mn>1</mn></msub><mo>&gt;</mo><msub><mi>n</mi><mn>2</mn></msub><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\theta_c\\ (n_1 &gt; n_2)</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mtext> in medium 2</mtext></mrow><annotation encoding=\"application/x-tex\">v\\ \\text{in medium 2}</annotation></semantics></math></span>"],"outUnits":["","","m/s"]}},{"id":"mirrors","group":"li","title":"Curved Mirrors","blurb":"Concave mirrors focus light; convex mirrors spread it out.","body":"\n<p>A <b>concave</b> mirror (curved inward, like the inside of a spoon) reflects rays arriving parallel to its axis to a single point, the <b>focal point</b> (exactly so only for rays near the axis). For a spherical mirror of radius <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>, the focal length is half the radius:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>f</mi><mo>=</mo><mfrac><mi>R</mi><mn>2</mn></mfrac></mrow><annotation encoding=\"application/x-tex\">f = \\frac{R}{2}</annotation></semantics></math></span></div>\n<p>Object distance <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>d</mi><mi>o</mi></msub></mrow><annotation encoding=\"application/x-tex\">d_o</annotation></semantics></math></span>, image distance <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>d</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">d_i</annotation></semantics></math></span> and focal length are linked by the mirror equation, and the image size by the magnification:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mfrac><mn>1</mn><msub><mi>d</mi><mi>o</mi></msub></mfrac><mo>+</mo><mfrac><mn>1</mn><msub><mi>d</mi><mi>i</mi></msub></mfrac><mo>=</mo><mfrac><mn>1</mn><mi>f</mi></mfrac><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>m</mi><mo>=</mo><mo>−</mo><mfrac><msub><mi>d</mi><mi>i</mi></msub><msub><mi>d</mi><mi>o</mi></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">\\frac{1}{d_o} + \\frac{1}{d_i} = \\frac{1}{f}, \\qquad m = -\\frac{d_i}{d_o}</annotation></semantics></math></span></div>\n<p><b>Signs:</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span> is positive for concave mirrors and negative for convex ones. A positive <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>d</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">d_i</annotation></semantics></math></span> means a real image in front of the mirror (it can be projected on a screen); negative means a virtual image behind it. Negative <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span> means the image is upside down.</p>\n<p>An object farther than <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span> from a concave mirror makes a real, inverted image. Closer than <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>, you get an enlarged, upright virtual image, which is how shaving and makeup mirrors work. A <b>convex</b> mirror always gives a small, upright virtual image, covering a wide field of view: car side mirrors and shop security mirrors.</p>","related":["reflection","lenses","instruments"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","focal length: positive for concave, negative for convex mirrors","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","radius of curvature of the spherical mirror","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>d</mi><mi>o</mi></msub></mrow><annotation encoding=\"application/x-tex\">d_{o}</annotation></semantics></math></span>","object distance from the mirror","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>d</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">d_{i}</annotation></semantics></math></span>","image distance: positive = real (in front), negative = virtual (behind)","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","magnification <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><msub><mi>d</mi><mi>i</mi></msub><mi mathvariant=\"normal\">/</mi><msub><mi>d</mi><mi>o</mi></msub></mrow><annotation encoding=\"application/x-tex\">-d_i/d_o</annotation></semantics></math></span>: negative means inverted image",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>h</mi><mi>o</mi></msub></mrow><annotation encoding=\"application/x-tex\">h_{o}</annotation></semantics></math></span>","object height","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>h</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">h_{i}</annotation></semantics></math></span>","image height, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><msub><mi>h</mi><mi>o</mi></msub></mrow><annotation encoding=\"application/x-tex\">m h_o</annotation></semantics></math></span> (negative = inverted)","m"]],"greek":[],"calc":{"title":"Mirror equation","inputs":[{"k":"f","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","unit":"m","d":"0.2"},{"k":"do","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>d</mi><mi>o</mi></msub></mrow><annotation encoding=\"application/x-tex\">d_o</annotation></semantics></math></span>","unit":"m","d":"0.5"},{"k":"ho","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>h</mi><mi>o</mi></msub></mrow><annotation encoding=\"application/x-tex\">h_o</annotation></semantics></math></span>","unit":"m","d":"0.05"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>d</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">d_i</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>h</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">h_i</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>image</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{image}</annotation></semantics></math></span>"],"outUnits":["m","×","m",""]}},{"id":"lenses","group":"li","title":"Thin Lenses","blurb":"Curved glass bends light to form images: the basis of eyes, cameras and glasses.","body":"\n<p>A <b>converging</b> lens (thicker in the middle) bends parallel rays inward to a focal point. A <b>diverging</b> lens (thinner in the middle) spreads them out as if they came from a focal point on the near side. For a thin lens the same equations as mirrors apply:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mfrac><mn>1</mn><msub><mi>d</mi><mi>o</mi></msub></mfrac><mo>+</mo><mfrac><mn>1</mn><msub><mi>d</mi><mi>i</mi></msub></mfrac><mo>=</mo><mfrac><mn>1</mn><mi>f</mi></mfrac><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>m</mi><mo>=</mo><mo>−</mo><mfrac><msub><mi>d</mi><mi>i</mi></msub><msub><mi>d</mi><mi>o</mi></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">\\frac{1}{d_o} + \\frac{1}{d_i} = \\frac{1}{f}, \\qquad m = -\\frac{d_i}{d_o}</annotation></semantics></math></span></div>\n<p>Here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span> is positive for converging lenses and negative for diverging ones, and a positive <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>d</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">d_i</annotation></semantics></math></span> means a real image on the far side of the lens.</p>\n<p>The focal length depends on the glass's index <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span> and the radii of curvature <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_1</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_2</annotation></semantics></math></span> of the two faces (the lensmaker's equation, for a thin lens in air):</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mfrac><mn>1</mn><mi>f</mi></mfrac><mo>=</mo><mo stretchy=\"false\">(</mo><mi>n</mi><mo>−</mo><mn>1</mn><mo stretchy=\"false\">)</mo><mrow><mo fence=\"true\">(</mo><mfrac><mn>1</mn><msub><mi>R</mi><mn>1</mn></msub></mfrac><mo>−</mo><mfrac><mn>1</mn><msub><mi>R</mi><mn>2</mn></msub></mfrac><mo fence=\"true\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\frac{1}{f} = (n - 1)\\left(\\frac{1}{R_1} - \\frac{1}{R_2}\\right)</annotation></semantics></math></span></div>\n<p>Opticians use <b>power</b> in dioptres, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">/</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">P = 1/f</annotation></semantics></math></span> with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span> in metres. A +2.5 D reading lens has <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi><mo>=</mo><mn>40</mn></mrow><annotation encoding=\"application/x-tex\">f = 40</annotation></semantics></math></span> cm. Lenses in contact add their powers.</p>\n<p>In the lensmaker's equation, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_1</annotation></semantics></math></span> is the face the light meets first, and a radius counts as positive when its centre of curvature lies on the far (outgoing) side of the lens. So a symmetric converging lens has <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>1</mn></msub><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">R_1 &gt; 0</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>2</mn></msub><mo>&lt;</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">R_2 &lt; 0</annotation></semantics></math></span>, giving a positive <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>.</p>\n<p>To find the image from a converging lens by drawing, trace three rays from the top of the object: one parallel to the axis (refracts through the far focal point), one through the centre (goes straight on), and one through the near focal point (comes out parallel). Drag the object below to try it.</p>\n<div class=\"sim\" data-sim=\"lens\"></div>","related":["refraction","mirrors","instruments"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>d</mi><mi>o</mi></msub></mrow><annotation encoding=\"application/x-tex\">d_{o}</annotation></semantics></math></span>","object distance from the lens","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>d</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">d_{i}</annotation></semantics></math></span>","image distance: positive = real image on far side, negative = virtual","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","focal length: positive for converging, negative for diverging lenses","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","magnification <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><msub><mi>d</mi><mi>i</mi></msub><mi mathvariant=\"normal\">/</mi><msub><mi>d</mi><mi>o</mi></msub></mrow><annotation encoding=\"application/x-tex\">-d_i/d_o</annotation></semantics></math></span>: negative means inverted image",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>","refractive index of the lens glass",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_{1}</annotation></semantics></math></span>","radius of the face light meets first; positive if centre lies on far side","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>R</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">R_{2}</annotation></semantics></math></span>","radius of the second face; positive if centre lies on far side","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span>","lens power <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mi mathvariant=\"normal\">/</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">1/f</annotation></semantics></math></span>, with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span> in metres","D"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>h</mi><mi>o</mi></msub></mrow><annotation encoding=\"application/x-tex\">h_{o}</annotation></semantics></math></span>","object height","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>h</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">h_{i}</annotation></semantics></math></span>","image height, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><msub><mi>h</mi><mi>o</mi></msub></mrow><annotation encoding=\"application/x-tex\">m h_o</annotation></semantics></math></span> (negative = inverted)","m"]],"greek":[],"calc":{"title":"Thin-lens equation","inputs":[{"k":"f","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","unit":"m","d":"0.1"},{"k":"do","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>d</mi><mi>o</mi></msub></mrow><annotation encoding=\"application/x-tex\">d_o</annotation></semantics></math></span>","unit":"m","d":"0.3"},{"k":"ho","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>h</mi><mi>o</mi></msub></mrow><annotation encoding=\"application/x-tex\">h_o</annotation></semantics></math></span>","unit":"m","d":"0.02"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>d</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">d_i</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>h</mi><mi>i</mi></msub></mrow><annotation encoding=\"application/x-tex\">h_i</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">/</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">P = 1/f</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>image</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{image}</annotation></semantics></math></span>"],"outUnits":["m","×","m","D",""]}},{"id":"instruments","group":"li","title":"Optical Instruments","blurb":"The eye, magnifiers, microscopes and telescopes, built from lenses.","body":"\n<p><b>The eye</b> focuses light with the cornea and an adjustable lens onto the retina. A typical eye can focus from infinity down to a <b>near point</b> of about 25 cm. Short-sightedness (eye focuses too strongly) is corrected with a diverging lens; long-sightedness with a converging one.</p>\n<p><b>Magnifying glass.</b> Holding a converging lens close to your eye lets you bring an object nearer than 25 cm while still seeing it in focus, so it fills more of your view. With the image at infinity (relaxed eye), the angular magnification is</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>M</mi><mo>=</mo><mfrac><mrow><mn>25</mn><mtext> cm</mtext></mrow><mi>f</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">M = \\frac{25\\ \\text{cm}}{f}</annotation></semantics></math></span></div>\n<p><b>Microscope.</b> A short-focus objective makes an enlarged real image, which an eyepiece then magnifies. The magnifications multiply. With tube length <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span> (roughly the distance between the two lenses) and focal lengths <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mi>o</mi></msub></mrow><annotation encoding=\"application/x-tex\">f_o</annotation></semantics></math></span> for the objective and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mi>e</mi></msub></mrow><annotation encoding=\"application/x-tex\">f_e</annotation></semantics></math></span> for the eyepiece:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>M</mi><mo>≈</mo><mo>−</mo><mfrac><mi>L</mi><msub><mi>f</mi><mi>o</mi></msub></mfrac><mo>⋅</mo><mfrac><mrow><mn>25</mn><mtext> cm</mtext></mrow><msub><mi>f</mi><mi>e</mi></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">M \\approx -\\frac{L}{f_o}\\cdot\\frac{25\\ \\text{cm}}{f_e}</annotation></semantics></math></span></div>\n<p><b>Telescope.</b> A long-focus objective makes an image of a distant object, and the eyepiece magnifies it:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>M</mi><mo>=</mo><mo>−</mo><mfrac><msub><mi>f</mi><mi>o</mi></msub><msub><mi>f</mi><mi>e</mi></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">M = -\\frac{f_o}{f_e}</annotation></semantics></math></span></div>\n<p>The minus signs mean the final image is upside down. Big telescopes are wide mainly to gather more light and sharpen detail (see <a href=\"#/diffraction\">diffraction limit</a>), not just to magnify.</p>","related":["lenses","mirrors","diffraction"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span>","angular magnification (negative = inverted final image)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","focal length of the magnifying glass","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","microscope tube length, roughly the distance between the lenses","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mi>o</mi></msub></mrow><annotation encoding=\"application/x-tex\">f_{o}</annotation></semantics></math></span>","focal length of the objective lens","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mi>e</mi></msub></mrow><annotation encoding=\"application/x-tex\">f_{e}</annotation></semantics></math></span>","focal length of the eyepiece lens","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>M</mi><mtext>telescope</mtext></msub></mrow><annotation encoding=\"application/x-tex\">M_{\\text{telescope}}</annotation></semantics></math></span>","telescope angular magnification, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><msub><mi>f</mi><mi>o</mi></msub><mi mathvariant=\"normal\">/</mi><msub><mi>f</mi><mi>e</mi></msub></mrow><annotation encoding=\"application/x-tex\">-f_o/f_e</annotation></semantics></math></span>",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>M</mi><mtext>magnifier</mtext></msub></mrow><annotation encoding=\"application/x-tex\">M_{\\text{magnifier}}</annotation></semantics></math></span>","magnifying-glass angular magnification, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>25</mn><mi>e</mi><mi>x</mi><mi>t</mi><mrow><mi>c</mi><mi>m</mi></mrow><mi mathvariant=\"normal\">/</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">25 \text{cm}/f</annotation></semantics></math></span>",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>M</mi><mtext>microscope</mtext></msub></mrow><annotation encoding=\"application/x-tex\">M_{\\text{microscope}}</annotation></semantics></math></span>","microscope magnification, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mo stretchy=\"false\">(</mo><mi>L</mi><mi mathvariant=\"normal\">/</mi><msub><mi>f</mi><mi>o</mi></msub><mo stretchy=\"false\">)</mo><mo stretchy=\"false\">(</mo><mn>25</mn><mi>e</mi><mi>x</mi><mi>t</mi><mrow><mi>c</mi><mi>m</mi></mrow><mi mathvariant=\"normal\">/</mi><msub><mi>f</mi><mi>e</mi></msub><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">-(L/f_o)(25 \text{cm}/f_e)</annotation></semantics></math></span>",""]],"greek":[],"calc":{"title":"Magnification","inputs":[{"k":"fo","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mi>o</mi></msub></mrow><annotation encoding=\"application/x-tex\">f_o</annotation></semantics></math></span>","unit":"m","d":"0.9"},{"k":"fe","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mi>e</mi></msub></mrow><annotation encoding=\"application/x-tex\">f_e</annotation></semantics></math></span>","unit":"m","d":"0.025"},{"k":"L","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mtext> (microscope tube)</mtext></mrow><annotation encoding=\"application/x-tex\">L\\ \\text{(microscope tube)}</annotation></semantics></math></span>","unit":"m","d":"0.16"},{"k":"fom","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mi>o</mi></msub><mtext> (microscope)</mtext></mrow><annotation encoding=\"application/x-tex\">f_o\\ \\text{(microscope)}</annotation></semantics></math></span>","unit":"m","d":"0.004"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>M</mi><mtext>telescope</mtext></msub></mrow><annotation encoding=\"application/x-tex\">M_{\\text{telescope}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>M</mi><mtext>magnifier</mtext></msub><mtext> </mtext><mo stretchy=\"false\">(</mo><msub><mi>f</mi><mi>e</mi></msub><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">M_{\\text{magnifier}}\\ (f_e)</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>M</mi><mtext>microscope</mtext></msub></mrow><annotation encoding=\"application/x-tex\">M_{\\text{microscope}}</annotation></semantics></math></span>"],"outUnits":["×","×","×"]}},{"id":"doubleslit","group":"wo","title":"Double-Slit Interference","blurb":"Young's experiment: light through two slits makes bright and dark fringes.","body":"\n<p>In 1801 Thomas Young shone light through two narrow, closely spaced slits and saw not two bright lines on the far wall but a whole row of evenly spaced bright and dark bands. Only waves do that, and it became powerful evidence that light is a wave.</p>\n<p>Light from the two slits travels slightly different distances to each point on the screen. For slits a distance <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span> apart and a distant screen, the path difference at angle <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span> from the central line is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mi>sin</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">d\\sin\\theta</annotation></semantics></math></span>, so with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><mo>=</mo><mn>0</mn><mo separator=\"true\">,</mo><mn>1</mn><mo separator=\"true\">,</mo><mn>2</mn><mo separator=\"true\">,</mo><mo>…</mo></mrow><annotation encoding=\"application/x-tex\">m = 0, 1, 2, \\ldots</annotation></semantics></math></span></p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>d</mi><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mi>m</mi><mi>λ</mi><mtext>  (bright)</mtext><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>d</mi><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mrow><mo fence=\"true\">(</mo><mi>m</mi><mo>+</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mo fence=\"true\">)</mo></mrow><mi>λ</mi><mtext>  (dark)</mtext></mrow><annotation encoding=\"application/x-tex\">d\\sin\\theta = m\\lambda\\ \\ \\text{(bright)}, \\qquad d\\sin\\theta = \\left(m + \\tfrac12\\right)\\lambda\\ \\ \\text{(dark)}</annotation></semantics></math></span></div>\n<p>For a screen at distance <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span> and small angles, the bright fringes are evenly spaced by</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>y</mi><mo>=</mo><mfrac><mrow><mi>λ</mi><mi>L</mi></mrow><mi>d</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">\\Delta y = \\frac{\\lambda L}{d}</annotation></semantics></math></span></div>\n<p>Narrower slit spacing or longer wavelength spreads the fringes out. The experiment works one photon at a time, too: each lands at a single spot, but over thousands of photons the fringe pattern builds up. That result is central to quantum mechanics.</p>\n<p>See the pattern form from two sources on the <a href=\"#/superposition\">Superposition</a> page.</p>","related":["superposition","diffraction","grating"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","distance between the two slits","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","angle from the central line to a point on the screen","°"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","fringe order: whole number 0, 1, 2, …",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","wavelength of the light","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding
