=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","\"change/difference in\"; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>D</mi><mi>e</mi><mi>l</mi><mi>t</mi><mi>a</mi><mi>y</mi></mrow><annotation encoding=\"application/x-tex\">Delta y</annotation></semantics></math></span> is the spacing between bright fringes",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi></mrow><annotation encoding=\"application/x-tex\">y</annotation></semantics></math></span>","position on the screen; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>D</mi><mi>e</mi><mi>l</mi><mi>t</mi><mi>a</mi><mi>y</mi></mrow><annotation encoding=\"application/x-tex\">Delta y</annotation></semantics></math></span> is the bright-fringe spacing","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","distance from the slits to the screen","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mi>m</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_{m}</annotation></semantics></math></span>","angle of the <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>th bright fringe","°"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>y</mi><mi>m</mi></msub></mrow><annotation encoding=\"application/x-tex\">y_{m}</annotation></semantics></math></span>","distance of the <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>th bright fringe from the screen centre","m"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","capital delta","DEL-tuh","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>y</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta y</annotation></semantics></math></span> is the spacing between neighbouring bright fringes."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","theta","THAY-tuh","the angle from the centre line to a point on the screen."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","lambda","LAM-duh","wavelength of the light."]],"calc":{"title":"Fringe spacing","inputs":[{"k":"lam","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","unit":"m","d":"633e-9"},{"k":"d","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","unit":"m","d":"0.25e-3"},{"k":"L","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","unit":"m","d":"2"},{"k":"m","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","unit":"","d":"3"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>y</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta y</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mi>m</mi></msub><mtext> (bright)</mtext></mrow><annotation encoding=\"application/x-tex\">\\theta_m\\ \\text{(bright)}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>y</mi><mi>m</mi></msub></mrow><annotation encoding=\"application/x-tex\">y_m</annotation></semantics></math></span>"],"outUnits":["m","°","m"]}},{"id":"diffraction","group":"wo","title":"Diffraction","blurb":"Waves spread out around edges and through openings, which limits how sharp any image can be.","body":"\n<p>Waves bend around obstacles and spread out after passing through gaps. You can hear around a corner because sound wavelengths (centimetres to metres; about 0.7 m for a 500 Hz tone) are comparable to doorways. Light's wavelengths are tiny, so its diffraction only shows up with small openings.</p>\n<p><b>Single slit.</b> Light of wavelength <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span> through one slit of width <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span> makes a wide central bright band with fainter ones either side. The dark fringes fall at angles <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span> given by</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>a</mi><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mi>m</mi><mi>λ</mi><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>m</mi><mo>=</mo><mo>±</mo><mn>1</mn><mo separator=\"true\">,</mo><mo>±</mo><mn>2</mn><mo separator=\"true\">,</mo><mo>…</mo></mrow><annotation encoding=\"application/x-tex\">a\\sin\\theta = m\\lambda, \\qquad m = \\pm1, \\pm2, \\ldots</annotation></semantics></math></span></div>\n<p>A narrower slit gives a <i>wider</i> pattern. Squeeze light through a smaller gap and it spreads out more.</p>\n<p><b>Resolution.</b> A circular lens or mirror of diameter <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>D</mi></mrow><annotation encoding=\"application/x-tex\">D</annotation></semantics></math></span> blurs a point of light into a small disc. Two points can just be told apart when their angular separation is at least</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>θ</mi><mi>min</mi><mo>⁡</mo></msub><mo>≈</mo><mn>1.22</mn><mtext> </mtext><mfrac><mi>λ</mi><mi>D</mi></mfrac><mtext>  (Rayleigh criterion)</mtext></mrow><annotation encoding=\"application/x-tex\">\\theta_{\\min} \\approx 1.22\\,\\frac{\\lambda}{D}\\ \\ \\text{(Rayleigh criterion)}</annotation></semantics></math></span></div>\n<p>This sets the ultimate sharpness of telescopes, cameras and even your eye. It's why radio telescopes, working at long wavelengths, must be enormous, and why electron microscopes, with much shorter wavelengths, see finer detail than light microscopes.</p>","related":["doubleslit","grating","instruments"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">a</annotation></semantics></math></span>","width of the single slit","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","angle of a dark fringe from the central direction","rad"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","dark-fringe order: ±1, ±2, … (zero excluded)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","wavelength of the light","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mi>min</mi><mo>⁡</mo></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_{\\min}</annotation></semantics></math></span>","smallest resolvable angular separation (Rayleigh criterion)","rad"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>D</mi></mrow><annotation encoding=\"application/x-tex\">D</annotation></semantics></math></span>","diameter of the circular lens or mirror aperture","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","distance from the slit to the screen","m"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","theta","THAY-tuh","angle from the straight-through direction; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mi>min</mi><mo>⁡</mo></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_{\\min}</annotation></semantics></math></span> is the smallest resolvable angular separation."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","lambda","LAM-duh","wavelength."]],"calc":{"title":"Slit and aperture","inputs":[{"k":"lam","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","unit":"m","d":"550e-9"},{"k":"a","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mtext> (slit)</mtext></mrow><annotation encoding=\"application/x-tex\">a\\ \\text{(slit)}</annotation></semantics></math></span>","unit":"m","d":"0.05e-3"},{"k":"L","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","unit":"m","d":"1.5"},{"k":"D","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>D</mi><mtext> (aperture)</mtext></mrow><annotation encoding=\"application/x-tex\">D\\ \\text{(aperture)}</annotation></semantics></math></span>","unit":"m","d":"0.2"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>central band width</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{central band width}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mi>min</mi><mo>⁡</mo></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_{\\min}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mi>min</mi><mo>⁡</mo></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_{\\min}</annotation></semantics></math></span>"],"outUnits":["m","rad","arcsec"]}},{"id":"grating","group":"wo","title":"Diffraction Gratings","blurb":"Thousands of evenly spaced slits split light sharply into its colours.","body":"\n<p>A diffraction grating has a huge number of equally spaced lines, often hundreds per millimetre. Bright maxima appear at the same angles as for two slits, but with so many slits contributing they become extremely sharp and bright, with nearly total darkness between:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>d</mi><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mi>m</mi><mi>λ</mi><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>d</mi><mo>=</mo><mfrac><mn>1</mn><mtext>lines per metre</mtext></mfrac></mrow><annotation encoding=\"application/x-tex\">d\\sin\\theta = m\\lambda, \\qquad d = \\frac{1}{\\text{lines per metre}}</annotation></semantics></math></span></div>\n<p>Here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span> is the spacing between neighbouring lines and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><mo>=</mo><mn>0</mn><mo separator=\"true\">,</mo><mo>±</mo><mn>1</mn><mo separator=\"true\">,</mo><mo>±</mo><mn>2</mn><mo separator=\"true\">,</mo><mo>…</mo></mrow><annotation encoding=\"application/x-tex\">m = 0, \\pm1, \\pm2, \\ldots</annotation></semantics></math></span> is the <b>order</b>.</p>\n<p>Because the angle depends on wavelength, each colour lands at a different place, and white light fans out into a spectrum in each order <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>. Gratings are far more precise than prisms for this, so spectrometers use them to identify elements by their characteristic spectral lines, from lab samples to the atmospheres of distant stars.</p>\n<p>The number of orders you can see is limited: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>sin</mi><mo>⁡</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\sin\\theta</annotation></semantics></math></span> must stay below 1, so <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><mo>&lt;</mo><mi>d</mi><mi mathvariant=\"normal\">/</mi><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">m &lt; d/\\lambda</annotation></semantics></math></span>.</p>\n<p>The rainbow sheen on a CD or DVD is grating diffraction from its closely spaced tracks of data.</p>","related":["doubleslit","diffraction","emwaves"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","spacing between neighbouring grating lines, 1/(lines per metre)","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","angle of a bright maximum from the straight-through direction","°"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","order of the maximum: 0, ±1, ±2, …",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","wavelength of the light","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mi>m</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_{m}</annotation></semantics></math></span>","angle of the <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>th-order maximum","°"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mi>max</mi><mo>⁡</mo></msub></mrow><annotation encoding=\"application/x-tex\">m_{\\max}</annotation></semantics></math></span>","highest visible order (largest whole <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span> below <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mi mathvariant=\"normal\">/</mi><mi>l</mi><mi>a</mi><mi>m</mi><mi>b</mi><mi>d</mi><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">d/lambda</annotation></semantics></math></span>)",""]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","theta","THAY-tuh","angle of each bright maximum from the straight-through direction."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","lambda","LAM-duh","wavelength."]],"calc":{"title":"Grating angles","inputs":[{"k":"N","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>lines per mm</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{lines per mm}</annotation></semantics></math></span>","unit":"","d":"600"},{"k":"lam","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","unit":"m","d":"589e-9"},{"k":"m","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","unit":"","d":"1"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mi>m</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_m</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mi>max</mi><mo>⁡</mo></msub></mrow><annotation encoding=\"application/x-tex\">m_{\\max}</annotation></semantics></math></span>"],"outUnits":["m","",""]}},{"id":"thinfilm","group":"wo","title":"Thin-Film Interference","blurb":"Why soap bubbles and oil slicks shimmer with colour.","body":"\n<p>A thin transparent film reflects light from both its top and bottom surfaces. The two reflections overlap and interfere. Whether a given colour is reinforced or cancelled depends on the film's thickness <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>, its index <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>, and an extra twist at each reflection.</p>\n<p><b>Phase flips.</b> Light reflecting off a material with a <i>higher</i> index flips upside down (a half-wavelength shift). Reflecting off a lower index, it doesn't. For a soap film in air, only the top reflection flips, so near-normal incidence gives</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mn>2</mn><mi>n</mi><mi>t</mi><mo>=</mo><mrow><mo fence=\"true\">(</mo><mi>m</mi><mo>+</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mo fence=\"true\">)</mo></mrow><mi>λ</mi><mtext>  (bright)</mtext><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mn>2</mn><mi>n</mi><mi>t</mi><mo>=</mo><mi>m</mi><mi>λ</mi><mtext>  (dark)</mtext></mrow><annotation encoding=\"application/x-tex\">2nt = \\left(m + \\tfrac12\\right)\\lambda\\ \\ \\text{(bright)}, \\qquad 2nt = m\\lambda\\ \\ \\text{(dark)}</annotation></semantics></math></span></div>\n<p>If both reflections flip, or neither does, the two conditions swap.</p>\n<p>As a bubble's thickness varies, different colours are reinforced in different places. Where it thins to almost nothing just before popping, it turns black: the extra path <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>n</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">2nt</annotation></semantics></math></span> becomes negligible, so only the half-wavelength flip remains and every colour cancels.</p>\n<p><b>Anti-reflection coatings</b> on glasses and camera lenses use a layer whose index lies between air and glass, so <i>both</i> reflections flip. Making it a quarter-wavelength thick (measured inside the coating) then makes the two reflections cancel:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>t</mi><mo>=</mo><mfrac><mi>λ</mi><mrow><mn>4</mn><msub><mi>n</mi><mtext>coating</mtext></msub></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">t = \\frac{\\lambda}{4 n_{\\text{coating}}}</annotation></semantics></math></span></div>","related":["superposition","refraction","doubleslit"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>","refractive index of the film",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","thickness of the film or coating","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","whole number 0, 1, 2, … labelling the interference order",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","wavelength of the light in vacuum (air)","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>n</mi><mtext>coating</mtext></msub></mrow><annotation encoding=\"application/x-tex\">n_{\\text{coating}}</annotation></semantics></math></span>","refractive index of the anti-reflection coating",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>n</mi><mtext>film</mtext></msub></mrow><annotation encoding=\"application/x-tex\">n_{\\text{film}}</annotation></semantics></math></span>","refractive index of the soap film",""]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","lambda","LAM-duh","wavelength of the light (in air)."]],"calc":{"title":"Soap film in air","inputs":[{"k":"n","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>n</mi><mtext>film</mtext></msub></mrow><annotation encoding=\"application/x-tex\">n_{\\text{film}}</annotation></semantics></math></span>","unit":"","d":"1.33"},{"k":"t","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","unit":"m","d":"400e-9"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>bright (visible)</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{bright (visible)}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>quarter-wave </mtext><mi>t</mi><mtext> for 550 nm</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{quarter-wave } t\\ \\text{for 550 nm}</annotation></semantics></math></span>"],"outUnits":["","m"]}},{"id":"polarization","group":"wo","title":"Polarization","blurb":"The direction light’s electric field vibrates in, and how filters select it.","body":"\n<p>Light is a transverse wave, so its electric field vibrates in some direction perpendicular to its travel. Ordinary light from the Sun or a bulb is <b>unpolarized</b>, a random mix of all directions. <b>Polarized</b> light vibrates in just one.</p>\n<p>A polarizing filter passes only the component along its axis. Unpolarized light loses half its intensity going through. Polarized light of intensity <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_0</annotation></semantics></math></span> hitting a filter whose axis is at angle <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span> to the polarization comes out with intensity given by <b>Malus's law</b>:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>I</mi><mo>=</mo><msub><mi>I</mi><mn>0</mn></msub><msup><mrow><mi>cos</mi><mo>⁡</mo></mrow><mn>2</mn></msup><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">I = I_0\\cos^2\\theta</annotation></semantics></math></span></div>\n<p>Two filters crossed at 90° block everything. Slip a third filter between them at 45° and some light gets through again (one eighth of the original unpolarized intensity), a surprising result that follows directly from the law.</p>\n<p>Reflection also polarizes light. At one special angle of incidence, <b>Brewster's angle</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mi>B</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_B</annotation></semantics></math></span>, the reflected light is completely polarized parallel to the surface (light going from index <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>n</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">n_1</annotation></semantics></math></span> to <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>n</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">n_2</annotation></semantics></math></span>):</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>tan</mi><mo>⁡</mo><msub><mi>θ</mi><mi>B</mi></msub><mo>=</mo><mfrac><msub><mi>n</mi><mn>2</mn></msub><msub><mi>n</mi><mn>1</mn></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">\\tan\\theta_B = \\frac{n_2}{n_1}</annotation></semantics></math></span></div>\n<p>Polarized sunglasses have a vertical axis to block this horizontally polarized glare off roads and water. LCD screens, 3-D cinema glasses and stress-testing of plastic parts all rely on polarization.</p>","related":["emwaves","refraction","thinfilm"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","intensity of light transmitted through a filter","W/m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">I_{0}</annotation></semantics></math></span>","intensity before the filter (in the calculator: unpolarized light entering the first filter)","W/m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","angle between the polarization (or previous filter axis) and the filter axis","°"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mi>B</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_{B}</annotation></semantics></math></span>","Brewster's angle: incidence angle giving fully polarized reflection","°"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>n</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">n_{2}</annotation></semantics></math></span>","refractive index of the material the light reflects off",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>n</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">n_{1}</annotation></semantics></math></span>","refractive index of the medium the light comes from",""]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math></span>","theta","THAY-tuh","angle between the light's polarization and the filter's axis; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mi>B</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\theta_B</annotation></semantics></math></span> is Brewster's angle."]],"calc":{"title":"Filters in a row","inputs":[{"k":"I0","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mn>0</mn></msub><mtext> (unpolarized)</mtext></mrow><annotation encoding=\"application/x-tex\">I_0\\ \\text{(unpolarized)}</annotation></semantics></math></span>","unit":"W/m²","d":"100"},{"k":"a","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi><mtext> between filters</mtext></mrow><annotation encoding=\"application/x-tex\">\\theta\\ \\text{between filters}</annotation></semantics></math></span>","unit":"°","d":"30"},{"k":"n2","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>n</mi><mn>2</mn></msub><mtext> (for Brewster)</mtext></mrow><annotation encoding=\"application/x-tex\">n_2\\ \\text{(for Brewster)}</annotation></semantics></math></span>","unit":"","d":"1.52"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mtext> after first</mtext></mrow><annotation encoding=\"application/x-tex\">I\\ \\text{after first}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mtext> after second</mtext></mrow><annotation encoding=\"application/x-tex\">I\\ \\text{after second}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mi>B</mi></msub><mtext> </mtext><mo stretchy=\"false\">(</mo><mtext>from air</mtext><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\theta_B\\ (\\text{from air})</annotation></semantics></math></span>"],"outUnits":["W/m²","W/m²","°"]}},{"id":"charge","group":"es","title":"Electric Charge","blurb":"The property of matter that creates and responds to electric forces.","body":"\n<p>Charge comes in two kinds, which we call positive and negative. Like charges repel and unlike charges attract. Ordinary matter is usually neutral because its protons and electrons are present in equal numbers; an object becomes \"charged\" when it gains or loses electrons.</p>\n<p>Two facts make charge special. It is <b>quantized</b>: every free charge observed in nature is a whole-number multiple of the elementary charge <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi></mrow><annotation encoding=\"application/x-tex\">e</annotation></semantics></math></span>. And it is <b>conserved</b>: in any isolated process, the total charge before equals the total charge after. Rubbing a balloon on your hair doesn't create charge, it just moves electrons from one to the other.</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>q</mi><mo>=</mo><mi>n</mi><mi>e</mi><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>e</mi><mo>=</mo><mn>1.602</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>19</mn></mrow></msup><mtext> C</mtext></mrow><annotation encoding=\"application/x-tex\">q = n e, \\qquad e = 1.602\\times10^{-19}\\ \\text{C}</annotation></semantics></math></span></div>\n<p>The SI unit is the coulomb (C). One coulomb is huge on everyday scales: it is the charge of about <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6.24</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mn>18</mn></msup></mrow><annotation encoding=\"application/x-tex\">6.24\\times10^{18}</annotation></semantics></math></span> electrons. Static charges you can build up by friction are typically nanocoulombs to microcoulombs.</p>\n<div class=\"note\"><b>Conductors vs. insulators.</b> In a conductor some electrons are free to roam, so excess charge spreads out and, once things settle, sits on the outer surface. In an insulator charges stay roughly where they are put.</div>","related":["coulomb","efield","current"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">q</annotation></semantics></math></span>","the total charge on an object (any whole-number multiple of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi></mrow><annotation encoding=\"application/x-tex\">e</annotation></semantics></math></span>)","C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>","a whole number: how many elementary charges (electrons) make up <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">q</annotation></semantics></math></span>",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi></mrow><annotation encoding=\"application/x-tex\">e</annotation></semantics></math></span>","the elementary charge, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi><mo>≈</mo><mn>1.602</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>19</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">e \\approx 1.602\\times10^{-19}</annotation></semantics></math></span> C (charge magnitude of one electron or proton)","C"]],"greek":[],"calc":{"title":"Count the electrons","inputs":[{"k":"q","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">q</annotation></semantics></math></span>","unit":"C","d":"1e-6"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mi mathvariant=\"normal\">∣</mi><mi>q</mi><mi mathvariant=\"normal\">∣</mi><mi mathvariant=\"normal\">/</mi><mi>e</mi></mrow><annotation encoding=\"application/x-tex\">n = |q|/e</annotation></semantics></math></span>"],"outUnits":["electrons"]}},{"id":"coulomb","group":"es","title":"Coulomb's Law","blurb":"The force between two point charges falls off as the square of their separation.","body":"\n<p>Two point charges push or pull on each other with a force along the line joining them. Its size is proportional to the product of the charges and inversely proportional to the square of the distance between them:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>F</mi><mo>=</mo><mi>k</mi><mtext> </mtext><mfrac><mrow><mi mathvariant=\"normal\">∣</mi><msub><mi>q</mi><mn>1</mn></msub><msub><mi>q</mi><mn>2</mn></msub><mi mathvariant=\"normal\">∣</mi></mrow><msup><mi>r</mi><mn>2</mn></msup></mfrac><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>k</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mn>4</mn><mi>π</mi><msub><mi>ε</mi><mn>0</mn></msub></mrow></mfrac><mo>≈</mo><mn>8.99</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mn>9</mn></msup><mtext> N</mtext><mo lspace=\"0em\" rspace=\"0em\">⋅</mo><msup><mtext>m</mtext><mn>2</mn></msup><mi mathvariant=\"normal\">/</mi><msup><mtext>C</mtext><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">F = k\\,\\frac{|q_1 q_2|}{r^2}, \\qquad k = \\frac{1}{4\\pi\\varepsilon_0} \\approx 8.99\\times10^{9}\\ \\text{N}{\\cdot}\\text{m}^2/\\text{C}^2</annotation></semantics></math></span></div>\n<p>Here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span> is the distance between the charges and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ε</mi><mn>0</mn></msub><mo>≈</mo><mn>8.85</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>12</mn></mrow></msup><mtext> </mtext><msup><mtext>C</mtext><mn>2</mn></msup><mi mathvariant=\"normal\">/</mi><mo stretchy=\"false\">(</mo><mtext>N</mtext><mo lspace=\"0em\" rspace=\"0em\">⋅</mo><msup><mtext>m</mtext><mn>2</mn></msup><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\varepsilon_0 \\approx 8.85\\times10^{-12}\\ \\text{C}^2/(\\text{N}{\\cdot}\\text{m}^2)</annotation></semantics></math></span> is the permittivity of free space. The force is repulsive when the charges have the same sign and attractive when they differ. In vector form, the force on charge 2 due to charge 1 is</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover><mn>12</mn></msub><mo>=</mo><mi>k</mi><mtext> </mtext><mfrac><mrow><msub><mi>q</mi><mn>1</mn></msub><msub><mi>q</mi><mn>2</mn></msub></mrow><msup><mi>r</mi><mn>2</mn></msup></mfrac><mtext> </mtext><msub><mover accent=\"true\"><mi>r</mi><mo>^</mo></mover><mn>12</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\vec F_{12} = k\\,\\frac{q_1 q_2}{r^2}\\,\\hat r_{12}</annotation></semantics></math></span></div>\n<p>where <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover accent=\"true\"><mi>r</mi><mo>^</mo></mover><mn>12</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\hat r_{12}</annotation></semantics></math></span> points from 1 toward 2. With several charges, forces simply add as vectors (superposition).</p>\n<div class=\"note\"><b>Compare with gravity.</b> Both are inverse-square laws, but the electric force between two protons is about <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><msup><mn>0</mn><mn>36</mn></msup></mrow><annotation encoding=\"application/x-tex\">10^{36}</annotation></semantics></math></span> times stronger than their gravitational attraction. Gravity dominates at large scales only because matter is almost perfectly neutral.</div>","related":["charge","efield","potential"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi></mrow><annotation encoding=\"application/x-tex\">F</annotation></semantics></math></span>","magnitude of the electric force between the two point charges","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>","Coulomb constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">/</mi><mo stretchy=\"false\">(</mo><mn>4</mn><mi>π</mi><msub><mi>ε</mi><mn>0</mn></msub><mo stretchy=\"false\">)</mo><mo>≈</mo><mn>8.99</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mn>9</mn></msup></mrow><annotation encoding=\"application/x-tex\">k = 1/(4\\pi\\varepsilon_0) \\approx 8.99\\times10^{9}</annotation></semantics></math></span> N·m²/C²","N·m²/C²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>q</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">q_{1}</annotation></semantics></math></span>","charge of the first point charge (sign included)","C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>q</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">q_{2}</annotation></semantics></math></span>","charge of the second point charge (sign included)","C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","distance between the two charges","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span>",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ε</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\varepsilon_{0}</annotation></semantics></math></span>","permittivity of free space, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ε</mi><mn>0</mn></msub><mo>≈</mo><mn>8.85</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>12</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">\\varepsilon_0 \\approx 8.85\\times10^{-12}</annotation></semantics></math></span> C²/(N·m²)","C²/(N·m²)"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover><mn>12</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\vec{F}_{12}</annotation></semantics></math></span>","force vector on charge 2 due to charge 1","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mover accent=\"true\"><mi>r</mi><mo>^</mo></mover><mn>12</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\hat{r}_{12}</annotation></semantics></math></span>","unit vector pointing from charge 1 toward charge 2",""]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ε</mi></mrow><annotation encoding=\"application/x-tex\">\\varepsilon</annotation></semantics></math></span>","epsilon","EP-sih-lon","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ε</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\varepsilon_0</annotation></semantics></math></span>, the permittivity of free space, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>8.85</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>12</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">8.85\\times10^{-12}</annotation></semantics></math></span> F/m. It sets the strength of electric forces in a vacuum."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","pi","pie","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span> (a circumference divided by its diameter). It appears wherever circles, rotation or spreading in all directions are involved."]],"calc":{"title":"Force between two charges","inputs":[{"k":"q1","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>q</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">q_1</annotation></semantics></math></span>","unit":"C","d":"2e-6"},{"k":"q2","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>q</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">q_2</annotation></semantics></math></span>","unit":"C","d":"-3e-6"},{"k":"r","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","unit":"m","d":"0.05"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">∣</mi><mi>F</mi><mi mathvariant=\"normal\">∣</mi></mrow><annotation encoding=\"application/x-tex\">|F|</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>type</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{type}</annotation></semantics></math></span>"],"outUnits":["N",""]}},{"id":"efield","group":"es","title":"Electric Field","blurb":"Force per unit charge: a map of what a test charge would feel at every point.","body":"\n<p>Instead of saying charge A pushes on charge B, we can say charge A sets up a <b>field</b> throughout space, and B responds to the field where it sits. The electric field is the force a small positive test charge would feel, divided by that charge:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mover accent=\"true\"><mi>E</mi><mo>⃗</mo></mover><mo>=</mo><mfrac><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover><msub><mi>q</mi><mn>0</mn></msub></mfrac><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mtext>units: N/C</mtext><mo>=</mo><mtext>V/m</mtext></mrow><annotation encoding=\"application/x-tex\">\\vec E = \\frac{\\vec F}{q_0}, \\qquad \\text{units: N/C} = \\text{V/m}</annotation></semantics></math></span></div>\n<p>For a single point charge the field points radially away from a positive charge (toward a negative one) with magnitude</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>E</mi><mo>=</mo><mi>k</mi><mtext> </mtext><mfrac><mrow><mi mathvariant=\"normal\">∣</mi><mi>q</mi><mi mathvariant=\"normal\">∣</mi></mrow><msup><mi>r</mi><mn>2</mn></msup></mfrac></mrow><annotation encoding=\"application/x-tex\">E = k\\,\\frac{|q|}{r^2}</annotation></semantics></math></span></div>\n<p>Fields from several sources add as vectors. Field lines are a way of drawing this: they start on positive charges, end on negative ones (or run off to infinity), never cross, and are packed more tightly where the field is stronger.</p>\n<p><b>Try it:</b> drag the charges in the simulator below, add more, and watch the field lines rearrange.</p>\n<div class=\"sim\" data-sim=\"field\"></div>","related":["coulomb","gauss","potential","bfield"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>E</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{E}</annotation></semantics></math></span>","electric field vector: force per unit charge at a point","N/C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>F</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{F}</annotation></semantics></math></span>","electric force felt by the small test charge","N"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>q</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">q_{0}</annotation></semantics></math></span>","small positive test charge used to probe the field","C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi></mrow><annotation encoding=\"application/x-tex\">E</annotation></semantics></math></span>","magnitude of the electric field of the point charge","N/C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>","Coulomb constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">/</mi><mo stretchy=\"false\">(</mo><mn>4</mn><mi>π</mi><msub><mi>ε</mi><mn>0</mn></msub><mo stretchy=\"false\">)</mo><mo>≈</mo><mn>8.99</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mn>9</mn></msup></mrow><annotation encoding=\"application/x-tex\">k = 1/(4\\pi\\varepsilon_0) \\approx 8.99\\times10^{9}</annotation></semantics></math></span> N·m²/C²","N·m²/C²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">q</annotation></semantics></math></span>","the source point charge creating the field","C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","distance from the point charge to where the field is measured","m"]],"greek":[],"calc":{"title":"Field of a point charge","inputs":[{"k":"q","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">q</annotation></semantics></math></span>","unit":"C","d":"1e-9"},{"k":"r","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","unit":"m","d":"0.1"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi></mrow><annotation encoding=\"application/x-tex\">E</annotation></semantics></math></span>"],"outUnits":["N/C"]}},{"id":"gauss","group":"es","title":"Gauss's Law","blurb":"The electric flux out of any closed surface measures the charge inside.","body":"\n<p>Imagine wrapping any closed surface around some charges and counting how much field \"flows out\" through it. That total, the electric flux, depends only on the charge enclosed, not on the shape of the surface or on charges outside it:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mo>∮</mo><mover accent=\"true\"><mi>E</mi><mo>⃗</mo></mover><mo>⋅</mo><mi>d</mi><mover accent=\"true\"><mi>A</mi><mo>⃗</mo></mover><mo>=</mo><mfrac><msub><mi>Q</mi><mtext>enc</mtext></msub><msub><mi>ε</mi><mn>0</mn></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">\\oint \\vec E\\cdot d\\vec A = \\frac{Q_{\\text{enc}}}{\\varepsilon_0}</annotation></semantics></math></span></div>\n<p>Here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mover accent=\"true\"><mi>A</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">d\\vec A</annotation></semantics></math></span> is a small patch of the surface, pointing outward, and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mtext>enc</mtext></msub></mrow><annotation encoding=\"application/x-tex\">Q_{\\text{enc}}</annotation></semantics></math></span> is the net charge inside. This is always true, but it is most useful when symmetry lets you pull <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi></mrow><annotation encoding=\"application/x-tex\">E</annotation></semantics></math></span> out of the integral. Three classic results:</p>\n<table class=\"t\">\n<tr><th>Charge distribution</th><th>Field</th></tr>\n<tr><td>Point charge, or spherically symmetric charge <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi></mrow><annotation encoding=\"application/x-tex\">Q</annotation></semantics></math></span> (outside it)</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mi>Q</mi><mrow><mn>4</mn><mi>π</mi><msub><mi>ε</mi><mn>0</mn></msub><msup><mi>r</mi><mn>2</mn></msup></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">E = \\dfrac{Q}{4\\pi\\varepsilon_0 r^2}</annotation></semantics></math></span></td></tr>\n<tr><td>Infinite line, charge per length <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span></td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mi>λ</mi><mrow><mn>2</mn><mi>π</mi><msub><mi>ε</mi><mn>0</mn></msub><mi>r</mi></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">E = \\dfrac{\\lambda}{2\\pi\\varepsilon_0 r}</annotation></semantics></math></span></td></tr>\n<tr><td>Infinite sheet, charge per area <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>σ</mi></mrow><annotation encoding=\"application/x-tex\">\\sigma</annotation></semantics></math></span></td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mi>σ</mi><mrow><mn>2</mn><msub><mi>ε</mi><mn>0</mn></msub></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">E = \\dfrac{\\sigma}{2\\varepsilon_0}</annotation></semantics></math></span></td></tr>\n</table>\n<p>A consequence: inside a conductor in equilibrium the field is zero, so any excess charge must sit on its surface. A related argument shows that a closed metal shell (a Faraday cage) shields an empty space inside it from external static fields.</p>","related":["efield","capacitance","maxwell"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>E</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{E}</annotation></semantics></math></span>","electric field vector on the closed surface","N/C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","an infinitesimally small piece/change (in derivatives and integrals)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>A</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{A}</annotation></semantics></math></span>","area vector of the surface; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mover accent=\"true\"><mi>A</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">d\\vec A</annotation></semantics></math></span> is a small patch pointing outward","m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mtext>enc</mtext></msub></mrow><annotation encoding=\"application/x-tex\">Q_{\\text{enc}}</annotation></semantics></math></span>","net charge enclosed by the closed surface","C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ε</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\varepsilon_{0}</annotation></semantics></math></span>","permittivity of free space, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ε</mi><mn>0</mn></msub><mo>≈</mo><mn>8.85</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>12</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">\\varepsilon_0 \\approx 8.85\\times10^{-12}</annotation></semantics></math></span> C²/(N·m²)","C²/(N·m²)"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi></mrow><annotation encoding=\"application/x-tex\">E</annotation></semantics></math></span>","magnitude of the electric field","N/C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi></mrow><annotation encoding=\"application/x-tex\">Q</annotation></semantics></math></span>","total charge of a point charge or spherically symmetric distribution","C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span>",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","distance from the centre of the sphere or from the line","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","linear charge density: charge per unit length of the line","C/m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>σ</mi></mrow><annotation encoding=\"application/x-tex\">\\sigma</annotation></semantics></math></span>","surface charge density: charge per unit area of the sheet","C/m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mtext>line</mtext></msub></mrow><annotation encoding=\"application/x-tex\">E_{\\text{line}}</annotation></semantics></math></span>","field magnitude at distance <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span> from an infinite charged line","N/C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mtext>sheet</mtext></msub></mrow><annotation encoding=\"application/x-tex\">E_{\\text{sheet}}</annotation></semantics></math></span>","field magnitude near an infinite charged sheet (independent of distance)","N/C"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ε</mi></mrow><annotation encoding=\"application/x-tex\">\\varepsilon</annotation></semantics></math></span>","epsilon","EP-sih-lon","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ε</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\varepsilon_0</annotation></semantics></math></span>, the permittivity of free space."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","lambda","LAM-duh","linear charge density: charge per metre along a line, in C/m."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\pi</annotation></semantics></math></span>","pi","pie","the circle constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>π</mi><mo>≈</mo><mn>3.14159</mn></mrow><annotation encoding=\"application/x-tex\">\\pi \\approx 3.14159</annotation></semantics></math></span> (a circumference divided by its diameter). It appears wherever circles, rotation or spreading in all directions are involved."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>σ</mi></mrow><annotation encoding=\"application/x-tex\">\\sigma</annotation></semantics></math></span>","sigma","SIG-muh","surface charge density: charge per square metre, in C/m²."]],"calc":{"title":"Field near a charged line or sheet","inputs":[{"k":"lam","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","unit":"C/m","d":"1e-8"},{"k":"sig","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>σ</mi></mrow><annotation encoding=\"application/x-tex\">\\sigma</annotation></semantics></math></span>","unit":"C/m²","d":"1e-8"},{"k":"r","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","unit":"m","d":"0.02"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mtext>line</mtext></msub></mrow><annotation encoding=\"application/x-tex\">E_{\\text{line}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mtext>sheet</mtext></msub></mrow><annotation encoding=\"application/x-tex\">E_{\\text{sheet}}</annotation></semantics></math></span>"],"outUnits":["N/C","N/C"]}},{"id":"potential","group":"es","title":"Electric Potential","blurb":"Potential energy per unit charge, measured in volts.","body":"\n<p>Because the electric force from static charges is conservative, we can define a potential energy for a charge in a field. Dividing by the charge gives the <b>electric potential</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>, a scalar measured in volts (1 V = 1 J/C). Only differences in potential matter physically.</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>U</mi><mo>=</mo><mi>q</mi><mtext> </mtext><mi mathvariant=\"normal\">Δ</mi><mi>V</mi><mo separator=\"true\">,</mo><mspace width=\"2em\"/><msub><mi>V</mi><mtext>point</mtext></msub><mo>=</mo><mi>k</mi><mtext> </mtext><mfrac><mi>q</mi><mi>r</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">\\Delta U = q\\,\\Delta V, \\qquad V_{\\text{point}} = k\\,\\frac{q}{r}</annotation></semantics></math></span></div>\n<p>The point-charge formula takes <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">V = 0</annotation></semantics></math></span> infinitely far away, the usual choice.</p>\n<p>The field points \"downhill\" in potential, from high <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span> to low <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>, and its strength is how steeply <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span> changes:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mover accent=\"true\"><mi>E</mi><mo>⃗</mo></mover><mo>=</mo><mo>−</mo><mi mathvariant=\"normal\">∇</mi><mi>V</mi><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mtext>uniform field: </mtext><mi mathvariant=\"normal\">Δ</mi><mi>V</mi><mo>=</mo><mo>−</mo><mi>E</mi><mtext> </mtext><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">\\vec E = -\\nabla V, \\qquad \\text{uniform field: } \\Delta V = -E\\,d</annotation></semantics></math></span></div>\n<p>In the uniform case <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span> is the distance moved along the field direction.</p>\n<p>Surfaces of constant potential (equipotentials) are always perpendicular to field lines. A charge can move along an equipotential without any work being done.</p>\n<div class=\"note\"><b>The electron-volt.</b> The energy an electron gains falling through 1 V is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mtext> eV</mtext><mo>=</mo><mn>1.602</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>19</mn></mrow></msup><mtext> J</mtext></mrow><annotation encoding=\"application/x-tex\">1\\ \\text{eV} = 1.602\\times10^{-19}\\ \\text{J}</annotation></semantics></math></span>, a convenient unit in atomic and particle physics.</div>","related":["efield","coulomb","capacitance","current"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","\"change in\" the quantity that follows",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>U</mi></mrow><annotation encoding=\"application/x-tex\">U</annotation></semantics></math></span>","electric potential energy of a charge (calculator: of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>q</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">q_0</annotation></semantics></math></span> at distance <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>)","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">q</annotation></semantics></math></span>","a charge moved through a potential difference (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>U</mi><mo>=</mo><mi>q</mi><mi mathvariant=\"normal\">Δ</mi><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta U = q\\Delta V</annotation></semantics></math></span>), or the source point charge in <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mtext>point</mtext></msub></mrow><annotation encoding=\"application/x-tex\">V_{\\text{point}}</annotation></semantics></math></span>","C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>","electric potential (energy per unit charge); <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta V</annotation></semantics></math></span> is a potential difference","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mtext>point</mtext></msub></mrow><annotation encoding=\"application/x-tex\">V_{\\text{point}}</annotation></semantics></math></span>","potential at distance <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span> from a point charge, taking <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">V = 0</annotation></semantics></math></span> at infinity","V"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>","Coulomb constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>=</mo><mn>1</mn><mi mathvariant=\"normal\">/</mi><mo stretchy=\"false\">(</mo><mn>4</mn><mi>π</mi><msub><mi>ε</mi><mn>0</mn></msub><mo stretchy=\"false\">)</mo><mo>≈</mo><mn>8.99</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mn>9</mn></msup></mrow><annotation encoding=\"application/x-tex\">k = 1/(4\\pi\\varepsilon_0) \\approx 8.99\\times10^{9}</annotation></semantics></math></span> N·m²/C²","N·m²/C²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","distance from the source point charge","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>E</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{E}</annotation></semantics></math></span>","electric field vector, pointing \"downhill\" in potential","V/m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">∇</mi></mrow><annotation encoding=\"application/x-tex\">\\nabla</annotation></semantics></math></span>","del: the spatial rate of change (gradient/divergence/curl)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi></mrow><annotation encoding=\"application/x-tex\">E</annotation></semantics></math></span>","magnitude of a uniform electric field","V/m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","distance moved along the field direction in a uniform field","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>q</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">q_{0}</annotation></semantics></math></span>","test charge placed at distance <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span> from the source charge","C"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","capital delta","DEL-tuh","“change in”: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta x</annotation></semantics></math></span> means the final value of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span> minus the starting value."]],"calc":{"title":"Potential and energy","inputs":[{"k":"q","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>q</mi><mtext> (source)</mtext></mrow><annotation encoding=\"application/x-tex\">q\\ \\text{(source)}</annotation></semantics></math></span>","unit":"C","d":"1e-9"},{"k":"r","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">r</annotation></semantics></math></span>","unit":"m","d":"0.1"},{"k":"q0","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>q</mi><mn>0</mn></msub><mtext> (test)</mtext></mrow><annotation encoding=\"application/x-tex\">q_0\\ \\text{(test)}</annotation></semantics></math></span>","unit":"C","d":"1.602e-19"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>U</mi><mo>=</mo><msub><mi>q</mi><mn>0</mn></msub><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">U = q_0 V</annotation></semantics></math></span>"],"outUnits":["V","J"]}},{"id":"capacitance","group":"es","title":"Capacitance","blurb":"How much charge a pair of conductors stores per volt.","body":"\n<p>A capacitor is any pair of conductors separated by an insulator. Put <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>+</mo><mi>Q</mi></mrow><annotation encoding=\"application/x-tex\">+Q</annotation></semantics></math></span> on one and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mi>Q</mi></mrow><annotation encoding=\"application/x-tex\">-Q</annotation></semantics></math></span> on the other and a potential difference <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span> appears between them. The ratio is the capacitance, measured in farads (F):</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>C</mi><mo>=</mo><mfrac><mi>Q</mi><mi>V</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">C = \\frac{Q}{V}</annotation></semantics></math></span></div>\n<p>For two parallel plates of area <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span> separated by a small gap <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>, filled with a material of dielectric constant <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>κ</mi></mrow><annotation encoding=\"application/x-tex\">\\kappa</annotation></semantics></math></span> (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>κ</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">\\kappa = 1</annotation></semantics></math></span> for vacuum):</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>C</mi><mo>=</mo><mfrac><mrow><mi>κ</mi><mtext> </mtext><msub><mi>ε</mi><mn>0</mn></msub><mi>A</mi></mrow><mi>d</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">C = \\frac{\\kappa\\,\\varepsilon_0 A}{d}</annotation></semantics></math></span></div>\n<p>Charging a capacitor takes work, which is stored in the electric field between the plates:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>U</mi><mo>=</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi>C</mi><msup><mi>V</mi><mn>2</mn></msup><mo>=</mo><mfrac><msup><mi>Q</mi><mn>2</mn></msup><mrow><mn>2</mn><mi>C</mi></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">U = \\tfrac12 C V^2 = \\frac{Q^2}{2C}</annotation></semantics></math></span></div>\n<p>Capacitors in parallel add directly; in series their reciprocals add:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>C</mi><mo lspace=\"0em\" rspace=\"0em\">∥</mo></msub><mo>=</mo><msub><mi>C</mi><mn>1</mn></msub><mo>+</mo><msub><mi>C</mi><mn>2</mn></msub><mo>+</mo><mo>⋯</mo><mspace width=\"2em\"/><mfrac><mn>1</mn><msub><mi>C</mi><mtext>series</mtext></msub></mfrac><mo>=</mo><mfrac><mn>1</mn><msub><mi>C</mi><mn>1</mn></msub></mfrac><mo>+</mo><mfrac><mn>1</mn><msub><mi>C</mi><mn>2</mn></msub></mfrac><mo>+</mo><mo>⋯</mo></mrow><annotation encoding=\"application/x-tex\">C_{\\parallel} = C_1 + C_2 + \\cdots \\qquad \\frac{1}{C_{\\text{series}}} = \\frac{1}{C_1} + \\frac{1}{C_2} + \\cdots</annotation></semantics></math></span></div>","related":["potential","gauss","rc","seriesparallel"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>C</mi></mrow><annotation encoding=\"application/x-tex\">C</annotation></semantics></math></span>","capacitance: charge stored per volt","F"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi></mrow><annotatio
