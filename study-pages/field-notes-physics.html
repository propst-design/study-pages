l–Boltzmann distribution, with a long tail of fast molecules. Those fast ones escape first from a liquid's surface, which is why evaporation cools what's left behind.</p>","related":["idealgas","temperature","secondlaw"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span>","pressure of the gas","Pa"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>","volume of the gas","m³"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>","number of molecules",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","mass of one molecule","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>v</mi><mo stretchy=\"true\">‾</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\overline{v}</annotation></semantics></math></span>","overline means average: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><msup><mi>v</mi><mn>2</mn></msup><mo stretchy=\"true\">‾</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\overline{v^2}</annotation></semantics></math></span> is the mean of the squared molecular speed","m²/s²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>K</mi><mo stretchy=\"true\">‾</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\overline{K}</annotation></semantics></math></span>","average translational kinetic energy per molecule (calculator also shows eV)","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>k</mi><mi>B</mi></msub></mrow><annotation encoding=\"application/x-tex\">k_{B}</annotation></semantics></math></span>","Boltzmann constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1.381</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>23</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">1.381\\times10^{-23}</annotation></semantics></math></span>","J/K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","absolute temperature of the gas","K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mtext>rms</mtext></msub></mrow><annotation encoding=\"application/x-tex\">v_{\\text{rms}}</annotation></semantics></math></span>","root-mean-square molecular speed","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","gas constant, 8.314","J/(mol·K)"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span>","molar mass of the gas (N₂ ≈ 0.028)","kg/mol"]],"greek":[],"calc":{"title":"Molecular speed","inputs":[{"k":"T","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","unit":"K","d":"293"},{"k":"M","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi><mtext> (molar mass)</mtext></mrow><annotation encoding=\"application/x-tex\">M\\ \\text{(molar mass)}</annotation></semantics></math></span>","unit":"kg/mol","d":"0.028"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mtext>rms</mtext></msub></mrow><annotation encoding=\"application/x-tex\">v_{\\text{rms}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>K</mi><mo stretchy=\"true\">‾</mo></mover><mtext> per molecule</mtext></mrow><annotation encoding=\"application/x-tex\">\\overline K\\ \\text{per molecule}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>K</mi><mo stretchy=\"true\">‾</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\overline K</annotation></semantics></math></span>"],"outUnits":["m/s","J","eV"]}},{"id":"firstlaw","group":"td","title":"First Law of Thermodynamics","blurb":"Energy conservation including heat: you can’t get more out than you put in.","body":"\n<p>A system's <b>internal energy</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>U</mi></mrow><annotation encoding=\"application/x-tex\">U</annotation></semantics></math></span> is the total kinetic and potential energy of its molecules' random motion. It can change in two ways: heat flowing in or out, or work being done. The first law keeps the books:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>U</mi><mo>=</mo><mi>Q</mi><mo>−</mo><mi>W</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta U = Q - W</annotation></semantics></math></span></div>\n<p>Here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi></mrow><annotation encoding=\"application/x-tex\">Q</annotation></semantics></math></span> is heat added <i>to</i> the system and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>W</mi></mrow><annotation encoding=\"application/x-tex\">W</annotation></semantics></math></span> is work done <i>by</i> the system. (Some books flip the sign of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>W</mi></mrow><annotation encoding=\"application/x-tex\">W</annotation></semantics></math></span>; check which convention is in use.)</p>\n<p>A gas does work when it expands against a pressure: a small volume change <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">dV</annotation></semantics></math></span> at pressure <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span> does work <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mtext> </mtext><mi>d</mi><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">P\\,dV</annotation></semantics></math></span>. Adding these up over the whole change gives the area under the curve on a pressure–volume (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">PV</annotation></semantics></math></span>) diagram:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>W</mi><mo>=</mo><mo>∫</mo><mi>P</mi><mtext> </mtext><mi>d</mi><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">W = \\int P\\,dV</annotation></semantics></math></span></div>\n<p>For an ideal gas, internal energy depends only on temperature. For a monatomic gas like helium, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>U</mi><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>n</mi><mi>R</mi><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">U = \\tfrac32 nRT</annotation></semantics></math></span>; for diatomic gases like air at room temperature, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>U</mi><mo>≈</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>n</mi><mi>R</mi><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">U \\approx \\tfrac52 nRT</annotation></semantics></math></span>.</p>\n<p>The first law rules out perpetual motion machines that create energy from nothing. It doesn't say which way heat flows or how much of it can become work. That's the job of the <a href=\"#/secondlaw\">second law</a>.</p>","related":["processes","heat","heatengines","energy"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","\"change in\" (here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>U</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta U</annotation></semantics></math></span>, and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta T</annotation></semantics></math></span> in the calculator)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>U</mi></mrow><annotation encoding=\"application/x-tex\">U</annotation></semantics></math></span>","internal energy of the system","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi></mrow><annotation encoding=\"application/x-tex\">Q</annotation></semantics></math></span>","heat added to the system","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>W</mi></mrow><annotation encoding=\"application/x-tex\">W</annotation></semantics></math></span>","work done by the system (positive when the gas expands)","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span>","pressure of the gas","Pa"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","an infinitesimally small change (as in <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">dV</annotation></semantics></math></span>, in the work integral)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>","volume of the gas","m³"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>","amount of gas in moles","mol"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","gas constant, 8.314","J/(mol·K)"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","absolute temperature of the gas","K"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","capital delta","DEL-tuh","“change in”: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta x</annotation></semantics></math></span> means the final value of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span> minus the starting value."]],"calc":{"title":"Energy bookkeeping","inputs":[{"k":"Q","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi><mtext> (in)</mtext></mrow><annotation encoding=\"application/x-tex\">Q\\ \\text{(in)}</annotation></semantics></math></span>","unit":"J","d":"500"},{"k":"W","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>W</mi><mtext> (by gas)</mtext></mrow><annotation encoding=\"application/x-tex\">W\\ \\text{(by gas)}</annotation></semantics></math></span>","unit":"J","d":"200"},{"k":"n","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mtext> (monatomic)</mtext></mrow><annotation encoding=\"application/x-tex\">n\\ \\text{(monatomic)}</annotation></semantics></math></span>","unit":"mol","d":"1"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>U</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta U</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta T</annotation></semantics></math></span>"],"outUnits":["J","K"]}},{"id":"processes","group":"td","title":"Gas Processes","blurb":"Isothermal, isobaric, isochoric and adiabatic: four ways to change a gas.","body":"\n<p>Taking a gas from one state to another can follow many paths. Four simple ones cover most problems:</p>\n<table class=\"t\">\n<tr><th>Process</th><th>Held fixed</th><th>Work by gas <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>W</mi></mrow><annotation encoding=\"application/x-tex\">W</annotation></semantics></math></span></th><th>Heat in <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi></mrow><annotation encoding=\"application/x-tex\">Q</annotation></semantics></math></span></th><th><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>U</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta U</annotation></semantics></math></span></th></tr>\n<tr><td>Isobaric</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span></td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mtext> </mtext><mi mathvariant=\"normal\">Δ</mi><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">P\\,\\Delta V</annotation></semantics></math></span></td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><msub><mi>C</mi><mi>P</mi></msub><mi mathvariant=\"normal\">Δ</mi><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">nC_P\\Delta T</annotation></semantics></math></span></td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><msub><mi>C</mi><mi>V</mi></msub><mi mathvariant=\"normal\">Δ</mi><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">nC_V\\Delta T</annotation></semantics></math></span></td></tr>\n<tr><td>Isochoric</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span></td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span></td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><msub><mi>C</mi><mi>V</mi></msub><mi mathvariant=\"normal\">Δ</mi><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">nC_V\\Delta T</annotation></semantics></math></span></td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><msub><mi>C</mi><mi>V</mi></msub><mi mathvariant=\"normal\">Δ</mi><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">nC_V\\Delta T</annotation></semantics></math></span></td></tr>\n<tr><td>Isothermal</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span></td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mi>R</mi><mi>T</mi><mi>ln</mi><mo>⁡</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><msub><mi>V</mi><mn>2</mn></msub><msub><mi>V</mi><mn>1</mn></msub></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">nRT\\ln\\dfrac{V_2}{V_1}</annotation></semantics></math></span></td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mi>W</mi></mrow><annotation encoding=\"application/x-tex\">= W</annotation></semantics></math></span></td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span></td></tr>\n<tr><td>Adiabatic</td><td>no heat flow</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub><mo>−</mo><msub><mi>P</mi><mn>2</mn></msub><msub><mi>V</mi><mn>2</mn></msub></mrow><mrow><mi>γ</mi><mo>−</mo><mn>1</mn></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\dfrac{P_1V_1 - P_2V_2}{\\gamma - 1}</annotation></semantics></math></span></td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">0</annotation></semantics></math></span></td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><msub><mi>C</mi><mi>V</mi></msub><mi mathvariant=\"normal\">Δ</mi><mi>T</mi><mo>=</mo><mo>−</mo><mi>W</mi></mrow><annotation encoding=\"application/x-tex\">nC_V\\Delta T = -W</annotation></semantics></math></span></td></tr>\n</table>\n<p>Here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mi>V</mi></msub></mrow><annotation encoding=\"application/x-tex\">C_V</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mi>P</mi></msub></mrow><annotation encoding=\"application/x-tex\">C_P</annotation></semantics></math></span> are the molar heat capacities at constant volume and constant pressure. For an ideal gas <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mi>V</mi></msub><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">C_V = \\tfrac32 R</annotation></semantics></math></span> (monatomic) or <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">\\tfrac52 R</annotation></semantics></math></span> (diatomic, such as air), and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mi>P</mi></msub><mo>=</mo><msub><mi>C</mi><mi>V</mi></msub><mo>+</mo><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">C_P = C_V + R</annotation></semantics></math></span>, because at constant pressure some of the heat goes into the work of expanding. Since <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>U</mi></mrow><annotation encoding=\"application/x-tex\">U</annotation></semantics></math></span> depends only on <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>U</mi><mo>=</mo><mi>n</mi><msub><mi>C</mi><mi>V</mi></msub><mi mathvariant=\"normal\">Δ</mi><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta U = nC_V\\Delta T</annotation></semantics></math></span> for <i>every</i> process.</p>\n<p>In an adiabatic process the gas is insulated (or the change is too quick for heat to flow). Compressing it does work on it and heats it up; letting it expand cools it. The exponent <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>γ</mi><mo>=</mo><msub><mi>C</mi><mi>P</mi></msub><mi mathvariant=\"normal\">/</mi><msub><mi>C</mi><mi>V</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\gamma = C_P/C_V</annotation></semantics></math></span> is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5</mn><mi mathvariant=\"normal\">/</mi><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">5/3</annotation></semantics></math></span> for monatomic gases and about <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>7</mn><mi mathvariant=\"normal\">/</mi><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">7/5</annotation></semantics></math></span> for air:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>P</mi><msup><mi>V</mi><mi>γ</mi></msup><mo>=</mo><mtext>constant</mtext><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>T</mi><msup><mi>V</mi><mrow><mi>γ</mi><mo>−</mo><mn>1</mn></mrow></msup><mo>=</mo><mtext>constant</mtext></mrow><annotation encoding=\"application/x-tex\">P V^\\gamma = \\text{constant}, \\qquad T V^{\\gamma - 1} = \\text{constant}</annotation></semantics></math></span></div>\n<p>A bicycle pump warms up as you use it, diesel engines ignite fuel purely by compression, and air rising over mountains cools adiabatically, which makes clouds.</p>","related":["firstlaw","idealgas","heatengines"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span>","pressure of the gas","Pa"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>","volume of the gas","m³"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","absolute temperature of the gas","K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>W</mi></mrow><annotation encoding=\"application/x-tex\">W</annotation></semantics></math></span>","work done by the gas","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi></mrow><annotation encoding=\"application/x-tex\">Q</annotation></semantics></math></span>","heat added to the gas","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","\"change in\" the quantity that follows (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta V</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta T</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>U</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta U</annotation></semantics></math></span>)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>U</mi></mrow><annotation encoding=\"application/x-tex\">U</annotation></semantics></math></span>","internal energy of the gas","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>","amount of gas in moles","mol"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mi>P</mi></msub></mrow><annotation encoding=\"application/x-tex\">C_{P}</annotation></semantics></math></span>","molar heat capacity at constant pressure, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mi>V</mi></msub><mo>+</mo><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">C_V + R</annotation></semantics></math></span>","J/(mol·K)"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mi>V</mi></msub></mrow><annotation encoding=\"application/x-tex\">C_{V}</annotation></semantics></math></span>","molar heat capacity at constant volume (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">\\tfrac32 R</annotation></semantics></math></span> monatomic, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">\\tfrac52 R</annotation></semantics></math></span> diatomic)","J/(mol·K)"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","gas constant, 8.314","J/(mol·K)"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">V_{2}</annotation></semantics></math></span>","final volume","m³"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">V_{1}</annotation></semantics></math></span>","initial volume","m³"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">P_{1}</annotation></semantics></math></span>","initial pressure","Pa"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">P_{2}</annotation></semantics></math></span>","final pressure","Pa"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>γ</mi></mrow><annotation encoding=\"application/x-tex\">\\gamma</annotation></semantics></math></span>","heat capacity ratio <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mi>P</mi></msub><mi mathvariant=\"normal\">/</mi><msub><mi>C</mi><mi>V</mi></msub></mrow><annotation encoding=\"application/x-tex\">C_P/C_V</annotation></semantics></math></span> (5/3 monatomic, about 1.4 for air)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">T_{1}</annotation></semantics></math></span>","initial absolute temperature","K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>W</mi><mtext>by gas, isothermal</mtext></msub></mrow><annotation encoding=\"application/x-tex\">W_{\\text{by gas, isothermal}}</annotation></semantics></math></span>","work done by the gas going from <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">V_1</annotation></semantics></math></span> to <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">V_2</annotation></semantics></math></span> at constant temperature (negative when compressed)","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">T_{2}</annotation></semantics></math></span>","final absolute temperature after adiabatic compression","K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>W</mi><mtext>by gas, adiabatic</mtext></msub></mrow><annotation encoding=\"application/x-tex\">W_{\\text{by gas, adiabatic}}</annotation></semantics></math></span>","work done by the gas going from <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">V_1</annotation></semantics></math></span> to <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">V_2</annotation></semantics></math></span> with no heat flow (negative when compressed)","J"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>γ</mi></mrow><annotation encoding=\"application/x-tex\">\\gamma</annotation></semantics></math></span>","gamma","GAM-uh","the heat-capacity ratio <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mi>P</mi></msub><mi mathvariant=\"normal\">/</mi><msub><mi>C</mi><mi>V</mi></msub></mrow><annotation encoding=\"application/x-tex\">C_P/C_V</annotation></semantics></math></span>: about 5/3 for monatomic gases and 7/5 for air."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","capital delta","DEL-tuh","“change in”: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta x</annotation></semantics></math></span> means the final value of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span> minus the starting value."]],"calc":{"title":"Compress some air","inputs":[{"k":"n","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>","unit":"mol","d":"0.04"},{"k":"T1","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">T_1</annotation></semantics></math></span>","unit":"K","d":"300"},{"k":"V1","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">V_1</annotation></semantics></math></span>","unit":"m³","d":"1e-3"},{"k":"V2","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">V_2</annotation></semantics></math></span>","unit":"m³","d":"0.1e-3"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>W</mi><mtext>by gas, isothermal</mtext></msub></mrow><annotation encoding=\"application/x-tex\">W_{\\text{by gas, isothermal}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mn>2</mn></msub><mtext> adiabatic </mtext><mo stretchy=\"false\">(</mo><mi>γ</mi><mo>=</mo><mn>1.4</mn><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">T_2\\ \\text{adiabatic}\\ (\\gamma = 1.4)</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>W</mi><mtext>by gas, adiabatic</mtext></msub></mrow><annotation encoding=\"application/x-tex\">W_{\\text{by gas, adiabatic}}</annotation></semantics></math></span>"],"outUnits":["J","K","J"]}},{"id":"heatengines","group":"td","title":"Heat Engines","blurb":"Turning heat into work, and the hard limit on how well it can be done.","body":"\n<p>A heat engine takes in heat <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mi>H</mi></msub></mrow><annotation encoding=\"application/x-tex\">Q_H</annotation></semantics></math></span> from a hot source, turns part of it into work <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>W</mi></mrow><annotation encoding=\"application/x-tex\">W</annotation></semantics></math></span>, and dumps the rest <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">Q_C</annotation></semantics></math></span> into a cold sink. Car engines, power stations and steam turbines all work this way. Its efficiency is the fraction of heat that becomes work:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>e</mi><mo>=</mo><mfrac><mi>W</mi><msub><mi>Q</mi><mi>H</mi></msub></mfrac><mo>=</mo><mn>1</mn><mo>−</mo><mfrac><msub><mi>Q</mi><mi>C</mi></msub><msub><mi>Q</mi><mi>H</mi></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">e = \\frac{W}{Q_H} = 1 - \\frac{Q_C}{Q_H}</annotation></semantics></math></span></div>\n<p>Sadi Carnot showed that no engine running between two temperatures can beat an idealised reversible engine, whose efficiency depends only on those temperatures (in kelvin):</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>e</mi><mtext>Carnot</mtext></msub><mo>=</mo><mn>1</mn><mo>−</mo><mfrac><msub><mi>T</mi><mi>C</mi></msub><msub><mi>T</mi><mi>H</mi></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">e_{\\text{Carnot}} = 1 - \\frac{T_C}{T_H}</annotation></semantics></math></span></div>\n<p>To approach 100% you'd need a sink at absolute zero. Real power stations, with steam around 800 K and cooling water around 300 K, are capped near 60% and reach about 35 to 45% in practice.</p>\n<p><b>Running it backwards.</b> A refrigerator or heat pump uses work to move heat from cold to hot. Its performance is rated by the coefficient of performance:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mtext>COP</mtext><mtext>fridge</mtext></msub><mo>=</mo><mfrac><msub><mi>Q</mi><mi>C</mi></msub><mi>W</mi></mfrac><mo>≤</mo><mfrac><msub><mi>T</mi><mi>C</mi></msub><mrow><msub><mi>T</mi><mi>H</mi></msub><mo>−</mo><msub><mi>T</mi><mi>C</mi></msub></mrow></mfrac><mo separator=\"true\">,</mo><mspace width=\"2em\"/><msub><mtext>COP</mtext><mtext>heat pump</mtext></msub><mo>=</mo><mfrac><msub><mi>Q</mi><mi>H</mi></msub><mi>W</mi></mfrac><mo>≤</mo><mfrac><msub><mi>T</mi><mi>H</mi></msub><mrow><msub><mi>T</mi><mi>H</mi></msub><mo>−</mo><msub><mi>T</mi><mi>C</mi></msub></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">\\text{COP}_{\\text{fridge}} = \\frac{Q_C}{W} \\le \\frac{T_C}{T_H - T_C}, \\qquad \\text{COP}_{\\text{heat pump}} = \\frac{Q_H}{W} \\le \\frac{T_H}{T_H - T_C}</annotation></semantics></math></span></div>\n<p>A heat pump can deliver three or four joules of heat for every joule of electricity, because it's moving heat rather than making it.</p>","related":["secondlaw","firstlaw","processes"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi></mrow><annotation encoding=\"application/x-tex\">e</annotation></semantics></math></span>","efficiency: fraction of the heat input turned into work (calculator shows %)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>W</mi></mrow><annotation encoding=\"application/x-tex\">W</annotation></semantics></math></span>","work output of the engine per cycle (or work input to a fridge or heat pump)","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mi>H</mi></msub></mrow><annotation encoding=\"application/x-tex\">Q_{H}</annotation></semantics></math></span>","heat exchanged with the hot reservoir (taken in by an engine)","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">Q_{C}</annotation></semantics></math></span>","heat exchanged with the cold reservoir (dumped by an engine)","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>e</mi><mtext>Carnot</mtext></msub></mrow><annotation encoding=\"application/x-tex\">e_{\\text{Carnot}}</annotation></semantics></math></span>","maximum (Carnot) efficiency of an engine between <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>H</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_H</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_C</annotation></semantics></math></span>",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_{C}</annotation></semantics></math></span>","absolute temperature of the cold reservoir","K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>H</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_{H}</annotation></semantics></math></span>","absolute temperature of the hot reservoir","K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>W</mi><mi>max</mi><mo>⁡</mo></msub></mrow><annotation encoding=\"application/x-tex\">W_{\\max}</annotation></semantics></math></span>","greatest work obtainable from heat <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mi>H</mi></msub></mrow><annotation encoding=\"application/x-tex\">Q_H</annotation></semantics></math></span> (Carnot limit)","J"]],"greek":[],"calc":{"title":"Carnot limits","inputs":[{"k":"TH","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>H</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_H</annotation></semantics></math></span>","unit":"K","d":"800"},{"k":"TC","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_C</annotation></semantics></math></span>","unit":"K","d":"300"},{"k":"QH","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mi>H</mi></msub></mrow><annotation encoding=\"application/x-tex\">Q_H</annotation></semantics></math></span>","unit":"J","d":"1000"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>e</mi><mtext>Carnot</mtext></msub></mrow><annotation encoding=\"application/x-tex\">e_{\\text{Carnot}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>W</mi><mi>max</mi><mo>⁡</mo></msub></mrow><annotation encoding=\"application/x-tex\">W_{\\max}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mtext>COP</mtext><mtext>fridge, max</mtext></msub></mrow><annotation encoding=\"application/x-tex\">\\text{COP}_{\\text{fridge, max}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mtext>COP</mtext><mtext>heat pump, max</mtext></msub></mrow><annotation encoding=\"application/x-tex\">\\text{COP}_{\\text{heat pump, max}}</annotation></semantics></math></span>"],"outUnits":["%","J","",""]}},{"id":"secondlaw","group":"td","title":"Entropy & the Second Law","blurb":"Why heat flows from hot to cold, and why time has a direction.","body":"\n<p>Heat never flows by itself from a cold object to a hot one. Equivalently, no engine running in a repeating cycle can turn heat completely into work. These are two statements of the <b>second law of thermodynamics</b>, and both can be expressed through a single quantity called <b>entropy</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S</mi></mrow><annotation encoding=\"application/x-tex\">S</annotation></semantics></math></span>.</p>\n<p>When heat <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi></mrow><annotation encoding=\"application/x-tex\">Q</annotation></semantics></math></span> flows reversibly into a system at temperature <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>, its entropy rises by</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>S</mi><mo>=</mo><mfrac><mi>Q</mi><mi>T</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">\\Delta S = \\frac{Q}{T}</annotation></semantics></math></span></div>\n<p>The second law says the total entropy of an isolated system never decreases:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><msub><mi>S</mi><mtext>total</mtext></msub><mo>≥</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\\Delta S_{\\text{total}} \\ge 0</annotation></semantics></math></span></div>\n<p>When heat <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi></mrow><annotation encoding=\"application/x-tex\">Q</annotation></semantics></math></span> moves from a hot body at <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>H</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_H</annotation></semantics></math></span> to a cold one at <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_C</annotation></semantics></math></span> (each big enough that its temperature barely changes), the cold side gains <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi><mi mathvariant=\"normal\">/</mi><msub><mi>T</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">Q/T_C</annotation></semantics></math></span> and the hot side loses <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi><mi mathvariant=\"normal\">/</mi><msub><mi>T</mi><mi>H</mi></msub></mrow><annotation encoding=\"application/x-tex\">Q/T_H</annotation></semantics></math></span>. Since <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>C</mi></msub><mo>&lt;</mo><msub><mi>T</mi><mi>H</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_C &lt; T_H</annotation></semantics></math></span>, the total goes up, so this direction is allowed. The reverse would lower it.</p>\n<p>Boltzmann gave entropy a meaning: it counts how many microscopic arrangements <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Ω</mi></mrow><annotation encoding=\"application/x-tex\">\\Omega</annotation></semantics></math></span> match what we see at large scale:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>S</mi><mo>=</mo><msub><mi>k</mi><mi>B</mi></msub><mi>ln</mi><mo>⁡</mo><mi mathvariant=\"normal\">Ω</mi></mrow><annotation encoding=\"application/x-tex\">S = k_B \\ln\\Omega</annotation></semantics></math></span></div>\n<p>Mixed-up states vastly outnumber orderly ones, so systems drift toward disorder simply because it's overwhelmingly more likely. That's why a broken cup doesn't reassemble, perfume spreads through a room, and the past looks different from the future.</p>","related":["heatengines","kinetic","firstlaw"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","\"change in\" (here the entropy change <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>S</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta S</annotation></semantics></math></span>)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>S</mi></mrow><annotation encoding=\"application/x-tex\">S</annotation></semantics></math></span>","entropy of the system","J/K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi></mrow><annotation encoding=\"application/x-tex\">Q</annotation></semantics></math></span>","heat transferred (reversibly into the system, or from hot body to cold)","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","absolute temperature at which the heat flows","K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>S</mi><mtext>total</mtext></msub></mrow><annotation encoding=\"application/x-tex\">S_{\\text{total}}</annotation></semantics></math></span>","total entropy of the isolated system (both bodies together)","J/K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>k</mi><mi>B</mi></msub></mrow><annotation encoding=\"application/x-tex\">k_{B}</annotation></semantics></math></span>","Boltzmann constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1.381</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>23</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">1.381\\times10^{-23}</annotation></semantics></math></span>","J/K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Ω</mi></mrow><annotation encoding=\"application/x-tex\">\\Omega</annotation></semantics></math></span>","number of microscopic arrangements (microstates) matching the observed state",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>H</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_{H}</annotation></semantics></math></span>","absolute temperature of the hot body","K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_{C}</annotation></semantics></math></span>","absolute temperature of the cold body","K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>S</mi><mtext>hot</mtext></msub></mrow><annotation encoding=\"application/x-tex\">S_{\\text{hot}}</annotation></semantics></math></span>","entropy of the hot body; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><msub><mi>S</mi><mtext>hot</mtext></msub><mo>=</mo><mo>−</mo><mi>Q</mi><mi mathvariant=\"normal\">/</mi><msub><mi>T</mi><mi>H</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\Delta S_{\\text{hot}} = -Q/T_H</annotation></semantics></math></span> (it loses entropy)","J/K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>S</mi><mtext>cold</mtext></msub></mrow><annotation encoding=\"application/x-tex\">S_{\\text{cold}}</annotation></semantics></math></span>","entropy of the cold body; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><msub><mi>S</mi><mtext>cold</mtext></msub><mo>=</mo><mi>Q</mi><mi mathvariant=\"normal\">/</mi><msub><mi>T</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\Delta S_{\\text{cold}} = Q/T_C</annotation></semantics></math></span> (it gains entropy)","J/K"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","capital delta","DEL-tuh","“change in”: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta x</annotation></semantics></math></span> means the final value of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span> minus the starting value."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Ω</mi></mrow><annotation encoding=\"application/x-tex\">\\Omega</annotation></semantics></math></span>","capital omega","oh-MAY-guh","the number of microscopic arrangements consistent with what we observe."]],"calc":{"title":"Heat flowing downhill","inputs":[{"k":"Q","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi></mrow><annotation encoding=\"application/x-tex\">Q</annotation></semantics></math></span>","unit":"J","d":"1000"},{"k":"TH","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>H</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_H</annotation></semantics></math></span>","unit":"K","d":"373"},{"k":"TC","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_C</annotation></semantics></math></span>","unit":"K","d":"273"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><msub><mi>S</mi><mtext>hot</mtext></msub></mrow><annotation encoding=\"application/x-tex\">\\Delta S_{\\text{hot}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><msub><mi>S</mi><mtext>cold</mtext></msub></mrow><annotation encoding=\"application/x-tex\">\\Delta S_{\\text{cold}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><msub><mi>S</mi><mtext>total</mtext></msub></mrow><annotation encoding=\"application/x-tex\">\\Delta S_{\\text{total}}</annotation></semantics></math></span>"],"outUnits":["J/K","J/K","J/K"]}},{"id":"timedilation","group":"rl","title":"Special Relativity & Time Dilation","blurb":"If light’s speed is the same for everyone, moving clocks must run slow.","body":"\n<p>Einstein built special relativity on two postulates. First, the laws of physics are the same for every observer moving at constant velocity. Second, the speed of light in a vacuum, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">c</annotation></semantics></math></span>, is the same for all of them, no matter how fast the source or observer is moving.</p>\n<p>The second postulate has startling consequences. Picture a clock that ticks by bouncing light between two mirrors, carried on a moving train. A passenger sees the light travel straight up and down. Someone on the platform sees the same light trace a longer diagonal path, because the mirrors move sideways while it is in flight. Since both measure the same light speed, the platform observer must see the moving clock tick more slowly.</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>t</mi><mo>=</mo><mi>γ</mi><mtext> </mtext><mi mathvariant=\"normal\">Δ</mi><msub><mi>t</mi><mn>0</mn></msub><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>γ</mi><mo>=</mo><mfrac><mn>1</mn><msqrt><mrow><mn>1</mn><mo>−</mo><msup><mi>v</mi><mn>2</mn></msup><mi mathvariant=\"normal\">/</mi><msup><mi>c</mi><mn>2</mn></msup></mrow></msqrt></mfrac></mrow><annotation encoding=\"application/x-tex\">\\Delta t = \\gamma\\,\\Delta t_0, \\qquad \\gamma = \\frac{1}{\\sqrt{1 - v^2/c^2}}</annotation></semantics></math></span></div>\n<p><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><msub><mi>t</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\Delta t_0</annotation></semantics></math></span> is the <b>proper time</b>: the time between two events measured by a clock present at both, i.e. one that moves along with whatever is ticking (here, the passenger's clock). <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta t</annotation></semantics></math></span> is the longer time measured in a frame where the clock moves at speed <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>. The Lorentz factor <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>γ</mi></mrow><annotation encoding=\"application/x-tex\">\\gamma</annotation></semantics></math></span> is barely above 1 at everyday speeds but grows without limit as <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span> approaches <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">c</annotation></semantics></math></span>.</p>\n<p>This is measured every day. Muons created high in the atmosphere live only about 2.2 µs at rest, far too short to reach the ground, yet many do, because their clocks run slow from our point of view. GPS satellites must correct for relativity (this effect plus gravity's effect on clocks, from general relativity) or their positions would drift by kilometres per day.</p>\n<div class=\"sim\" data-sim=\"lightclock\"></div>","related":["length","massenergy","emwaves"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","\"time interval\" between two events (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta t</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><msub><mi>t</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\Delta t_0</annotation></semantics></math></span>)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","time; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta t</annotation></semantics></math></span> is the dilated interval measured in the frame where the clock moves","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>γ</mi></mrow><annotation encoding=\"application/x-tex\">\\gamma</annotation></semantics></math></span>","Lorentz factor, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mi mathvariant=\"normal\">/</mi><msqrt><mrow><mn>1</mn><mo>−</mo><msup><mi>v</mi><mn>2</mn></msup><mi mathvariant=\"normal\">/</mi><msup><mi>c</mi><mn>2</mn></msup></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">1/\\sqrt{1 - v^2/c^2}</annotation></semantics></math></span> (always at least 1)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>t</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">t_{0}</annotation></semantics></math></span>","proper time: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><msub><mi>t</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\Delta t_0</annotation></semantics></math></span> is the interval measured by a clock moving with the events","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","speed of the moving clock relative to the observer (calculator uses <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mi mathvariant=\"normal\">/</mi><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">v/c</annotation></semantics></math></span>)","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">c</annotation></semantics></math></span>","speed of light in vacuum, 299 792 458","m/s"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>γ</mi></mrow><annotation encoding=\"application/x-tex\">\\gamma</annotation></semantics></math></span>","gamma","GAM-uh","the Lorentz factor, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mi mathvariant=\"normal\">/</mi><msqrt><mrow><mn>1</mn><mo>−</mo><msup><mi>v</mi><mn>2</mn></msup><mi mathvariant=\"normal\">/</mi><msup><mi>c</mi><mn>2</mn></msup></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">1/\\sqrt{1 - v^2/c^2}</annotation></semantics></math></span>: 1 at rest, growing without limit as <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>→</mo><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">v \\to c</annotation></semantics></math></span>."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","capital delta","DEL-tuh","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta t</annotation></semantics></math></span>, a time interval between two events. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><msub><mi>t</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\Delta t_0</annotation></semantics></math></span> is the proper time."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math></span>","mu","myoo","as a unit prefix (µ), “micro-”, one millionth: 1 µs = <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>6</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">10^{-6}</annotation></semantics></math></span> s."]],"calc":{"title":"Moving clock","inputs":[{"k":"b","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mi mathvariant=\"normal\">/</mi><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">v/c</annotation></semantics></math></span>","unit":"","d":"0.8"},{"k":"t0","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><msub><mi>t</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\Delta t_0</annotation></semantics></math></span>","unit":"s","d":"2.2e-6"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>γ</mi></mrow><annotation encoding=\"application/x-tex\">\\gamma</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta t</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>distance in </mtext><mi mathvariant=\"normal\">Δ</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">\\text{distance in}\\ \\Delta t</annotation></semantics></math></span>"],"outUnits":["","s","m"]}},{"id":"length","group":"rl","title":"Length Contraction & Simultaneity","blurb":"Moving objects are shorter along their motion, and “at the same time” depends on who’s asking.","body":"\n<p>If moving clocks run slow, moving lengths must shrink, or observers would disagree about whether, say, a muon reaches the ground. An object's length along its direction of motion is greatest in its own rest frame (its <b>proper length</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>L</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">L_0</annotation></semantics></math></span>) and contracted for everyone else:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>L</mi><mo>=</mo><mfrac><msub><mi>L</mi><mn>0</mn></msub><mi>γ</mi></mfrac><mo>=</mo><msub><mi>L</mi><mn>0</mn></msub><msqrt><mrow><mn>1</mn><mo>−</mo><msup><mi>v</mi><mn>2</mn></msup><mi mathvariant=\"normal\">/</mi><msup><mi>c</mi><mn>2</mn></msup></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">L = \\frac{L_0}{\\gamma} = L_0\\sqrt{1 - v^2/c^2}</annotation></semantics></math></span></div>\n<p>Only the length along the motion shrinks; widths perpendicular to it are unaffected. From the muon's own point of view, its clock is fine, but the atmosphere rushing toward it is contracted thin enough to cross in its short lifetime. Both pictures give the same answer.</p>\n<p><b>Simultaneity is relative.</b> Two events that happen at the same time in one frame generally don't in another. Suppose that, according to the platform, flashes go off at both ends of a passing train at once. A passenger at the middle of the train is moving toward the front flash and away from the rear one, so the front flash reaches them first; and since light travelled equal distances at the same speed in their frame, they conclude the front flash happened first.</p>\n<p>Velocities don't simply add, either. If a ship moving at <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span> fires a probe forward at speed <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>u</mi></mrow><annotation encoding=\"application/x-tex\">u</annotation></semantics></math></span> relative to the ship, an outside observer measures the probe's speed as</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msup><mi>u</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup><mo>=</mo><mfrac><mrow><mi>u</mi><mo>+</mo><mi>v</mi></mrow><mrow><mn>1</mn><mo>+</mo><mi>u</mi><mi>v</mi><mi mathvariant=\"normal\">/</mi><msup><mi>c</mi><mn>2</mn></msup></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">u&#x27; = \\frac{u + v}{1 + uv/c^2}</annotation></semantics></math></span></div>\n<p>which never exceeds <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">c</annotation></semantics></math></span> as long as <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>u</mi></mrow><annotation encoding=\"application/x-tex\">u</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span> don't.</p>","related":["timedilation","massenergy"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","contracted length measured by an observer the object moves past","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>L</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">L_{0}</annotation></semantics></math></span>","proper length: length in the object’s own rest frame","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>γ</mi></mrow><annotation encoding=\"application/x-tex\">\\gamma</annotation></semantics></math></span>","Lorentz factor, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mi mathvariant=\"normal\">/</mi><msqrt><mrow><mn>1</mn><mo>−</mo><msup><mi>v</mi><mn>2</mn></msup><mi mathvariant=\"normal\">/</mi><msup><mi>c</mi><mn>2</mn></msup></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">1/\\sqrt{1 - v^2/c^2}</annotation></semantics></math></span>",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","speed of the object (or ship) relative to the observer (calculator uses <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mi mathvariant=\"normal\">/</mi><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">v/c</annotation></semantics></math></span>)","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">c</annotation></semantics></math></span>","speed of light in vacuum, 299 792 458","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>u</mi><mo mathvariant=\"normal\" lspace=\"0em\" rspace=\"0em\">′</mo></msup></mrow><annotation encoding=\"application/x-tex\">u&#x27;</annotation></semantics></math></span>","probe’s speed as measured by the outside observer (combined speed)","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>u</mi></mrow><annotation encoding=\"application/x-tex\">u</annotation></semantics></math></span>","probe’s speed relative to the ship (calculator uses <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>u</mi><mi mathvariant=\"normal\">/</mi><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">u/c</annotation></semantics></math></span>)","m/s"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>γ</mi></mrow><annotation encoding=\"application/x-tex\">\\gamma</annotation></semantics></math></span>","gamma","GAM-uh","the Lorentz factor, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mi mathvariant=\"normal\">/</mi><msqrt><mrow><mn>1</mn><mo>−</mo><msup><mi>v</mi><mn>2</mn></msup><mi mathvariant=\"normal\">/</mi><msup><mi>c</mi><mn>2</mn></msup></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">1/\\sqrt{1 - v^2/c^2}</annotation></semantics></math></span>."]],"calc":{"title":"Contraction and velocity addition","inputs":[{"k":"L0","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>L</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">L_0</annotation></semantics></math></span>","unit":"m","d":"100"},{"k":"b","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mi mathvariant=\"normal\">/</mi><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">v/c</annotation></semantics></math></span>","unit":"","d":"0.9"},{"k":"u","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>u</mi><mi mathvariant=\"normal\">/</mi><mi>c</mi><mtext> (second speed)</mtext></mrow><annotation encoding=\"application/x-tex\">u/c\\ \\text{(second speed)}</annotation></semantics></math></span>","unit":"","d":"0.9"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>combined speed</mtext></mrow><annotation encoding=\"application/x-tex\">\\text{combined speed}</annotation></semantics></math></span>"],"outUnits":["m","c"]}},{"id":"massenergy","group":"rl","title":"Mass–Energy Equivalence","blurb":"E = mc²: mass is a very concentrated form of energy.","body":"\n<p>Relativity changes the formulas for energy and momentum. A particle of mass <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span> moving at speed <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span> has</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>p</mi><mo>=</mo><mi>γ</mi><mi>m</mi><mi>v</mi><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>E</mi><mo>=</mo><mi>γ</mi><mi>m</mi><msup><mi>c</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">p = \\gamma m v, \\qquad E = \\gamma m c^2</annotation></semantics></math></span></div>\n<p>Even at rest, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>γ</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">\\gamma = 1</annotation></semantics></math></span> and the energy isn't zero. Every mass carries a <b>rest energy</b>:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>E</mi><mn>0</mn></msub><mo>=</mo><mi>m</mi><msup><mi>c</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">E_0 = mc^2</annotation></semantics></math></span></div>\n<p>Since <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>c</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">c^2</annotation></semantics></math></span> is enormous, a little mass is a huge amount of energy: one gram corresponds to about <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>9</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mn>13</mn></msup></mrow><annotation encoding=\"application/x-tex\">9\\times10^{13}</annotation></semantics></math></span> J, roughly what a large power station produces in a day. The kinetic energy is what's left over, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K</mi><mo>=</mo><mo stretchy=\"false\">(</mo><mi>γ</mi><mo>−</mo><mn>1</mn><mo stretchy=\"false\">)</mo><mi>m</mi><msup><mi>c</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">K = (\\gamma - 1)mc^2</annotation></semantics></math></span>, which reduces to <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\tfrac12 mv^2</annotation></semantics></math></span> at low speeds.</p>\n<p>Energy and momentum are tied together by</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msup><mi>E</mi><mn>2</mn></msup><mo>=</mo><mo stretchy=\"false\">(</mo><mi>p</mi><mi>c</mi><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup><mo>+</mo><mo stretchy=\"false\">(</mo><mi>m</mi><msup><mi>c</mi><mn>2</mn></msup><msup><mo stretchy=\"false\">)</mo><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">E^2 = (pc)^2 + (mc^2)^2</annotation></semantics></math></span></div>\n<p>For a massless particle like a photon this gives <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mo>=</mo><mi>p</mi><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">E = pc</annotation></semantics></math></span>. As a massive particle approaches <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">c</annotation></semantics></math></span> its energy grows without limit, which is why nothing with mass can reach light speed.</p>\n<p>In nuclear reactions the products weigh measurably less than the starting materials, and the missing mass appears as energy. That powers the Sun and nuclear reactors (see <a href=\"#/binding\">Binding Energy</a>).</p>","related":["timedilation","binding","fission"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi></mrow><annotation encoding=\"application/x-tex\">p</annotation></semantics></math></span>","relativistic momentum of the particle","kg·m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>γ</mi></mrow><annotation encoding=\"application/x-tex\">\\gamma</annotation></semantics></math></span>","Lorentz factor, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mi mathvariant=\"normal\">/</mi><msqrt><mrow><mn>1</mn><mo>−</mo><msup><mi>v</mi><mn>2</mn></msup><mi mathvariant=\"normal\">/</mi><msup><mi>c</mi><mn>2</mn></msup></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">1/\\sqrt{1 - v^2/c^2}</annotation></semantics></math></span>",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","mass (rest mass) of the particle","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v</annotation></semantics></math></span>","speed of the particle (calculator uses <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mi mathvariant=\"normal\">/</mi><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">v/c</annotation></semantics></math></span>)","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi></mrow><annotation encoding=\"application/x-tex\">E</annotation></semantics></math></span>","total relativistic energy, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>γ</mi><mi>m</mi
