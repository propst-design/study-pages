msub></mrow><annotation encoding=\"application/x-tex\">N_{s}</annotation></semantics></math></span>","number of turns on the secondary coil",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>N</mi><mi>p</mi></msub></mrow><annotation encoding=\"application/x-tex\">N_{p}</annotation></semantics></math></span>","number of turns on the primary coil",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mi>p</mi></msub></mrow><annotation encoding=\"application/x-tex\">I_{p}</annotation></semantics></math></span>","current in the primary coil","A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mi>s</mi></msub></mrow><annotation encoding=\"application/x-tex\">I_{s}</annotation></semantics></math></span>","current in the secondary coil","A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","an infinitesimally small piece/change (in derivatives and integrals)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Φ</mi></mrow><annotation encoding=\"application/x-tex\">\\Phi</annotation></semantics></math></span>","magnetic flux in the shared core (through each turn)","Wb"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","time","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","current in the transmission lines (in <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>I</mi><mn>2</mn></msup><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">I^2R</annotation></semantics></math></span> losses)","A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","resistance of the transmission lines","Ω"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span>","power transferred (in = out for an ideal transformer)","W"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Φ</mi></mrow><annotation encoding=\"application/x-tex\">\\Phi</annotation></semantics></math></span>","capital phi","fie","magnetic flux in the shared core."]],"calc":{"title":"Ideal transformer","inputs":[{"k":"Vp","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mi>p</mi></msub></mrow><annotation encoding=\"application/x-tex\">V_p</annotation></semantics></math></span>","unit":"V","d":"7200"},{"k":"Np","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>N</mi><mi>p</mi></msub></mrow><annotation encoding=\"application/x-tex\">N_p</annotation></semantics></math></span>","unit":"turns","d":"3000"},{"k":"Ns","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>N</mi><mi>s</mi></msub></mrow><annotation encoding=\"application/x-tex\">N_s</annotation></semantics></math></span>","unit":"turns","d":"50"},{"k":"Is","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mi>s</mi></msub></mrow><annotation encoding=\"application/x-tex\">I_s</annotation></semantics></math></span>","unit":"A","d":"20"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mi>s</mi></msub></mrow><annotation encoding=\"application/x-tex\">V_s</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mi>p</mi></msub></mrow><annotation encoding=\"application/x-tex\">I_p</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span>"],"outUnits":["V","A","W"]}},{"id":"maxwell","group":"wv","title":"Maxwell's Equations","blurb":"Four equations that contain all of classical electromagnetism.","body":"\n<p>James Clerk Maxwell gathered the laws of electricity and magnetism into four equations, adding one crucial term of his own. In integral form:</p>\n<table class=\"t\">\n<tr><th>Law</th><th>Equation</th><th>Says</th></tr>\n<tr><td><a href=\"#/gauss\">Gauss (electric)</a></td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mo>∮</mo><mover accent=\"true\"><mi>E</mi><mo>⃗</mo></mover><mo>⋅</mo><mi>d</mi><mover accent=\"true\"><mi>A</mi><mo>⃗</mo></mover><mo>=</mo><mfrac><msub><mi>Q</mi><mtext>enc</mtext></msub><msub><mi>ε</mi><mn>0</mn></msub></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\oint \\vec E\\cdot d\\vec A = \\frac{Q_{\\text{enc}}}{\\varepsilon_0}</annotation></semantics></math></span></td><td>Charges are sources of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>E</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec E</annotation></semantics></math></span></td></tr>\n<tr><td>Gauss (magnetic)</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mo>∮</mo><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover><mo>⋅</mo><mi>d</mi><mover accent=\"true\"><mi>A</mi><mo>⃗</mo></mover><mo>=</mo><mn>0</mn></mstyle></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\oint \\vec B\\cdot d\\vec A = 0</annotation></semantics></math></span></td><td>No magnetic monopoles</td></tr>\n<tr><td><a href=\"#/faraday\">Faraday</a></td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mo>∮</mo><mover accent=\"true\"><mi>E</mi><mo>⃗</mo></mover><mo>⋅</mo><mi>d</mi><mover accent=\"true\"><mi mathvariant=\"normal\">ℓ</mi><mo>⃗</mo></mover><mo>=</mo><mo>−</mo><mfrac><mrow><mi>d</mi><msub><mi mathvariant=\"normal\">Φ</mi><mi>B</mi></msub></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\oint \\vec E\\cdot d\\vec\\ell = -\\frac{d\\Phi_B}{dt}</annotation></semantics></math></span></td><td>Changing <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec B</annotation></semantics></math></span> makes <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>E</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec E</annotation></semantics></math></span></td></tr>\n<tr><td><a href=\"#/ampere\">Ampère–Maxwell</a></td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mstyle scriptlevel=\"0\" displaystyle=\"true\"><mo>∮</mo><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover><mo>⋅</mo><mi>d</mi><mover accent=\"true\"><mi mathvariant=\"normal\">ℓ</mi><mo>⃗</mo></mover><mo>=</mo><msub><mi>μ</mi><mn>0</mn></msub><msub><mi>I</mi><mtext>enc</mtext></msub><mo>+</mo><msub><mi>μ</mi><mn>0</mn></msub><msub><mi>ε</mi><mn>0</mn></msub><mfrac><mrow><mi>d</mi><msub><mi mathvariant=\"normal\">Φ</mi><mi>E</mi></msub></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></mstyle></mrow><annotation encoding=\"application/x-tex\">\\displaystyle\\oint \\vec B\\cdot d\\vec\\ell = \\mu_0 I_{\\text{enc}} + \\mu_0\\varepsilon_0\\frac{d\\Phi_E}{dt}</annotation></semantics></math></span></td><td>Currents and changing <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>E</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec E</annotation></semantics></math></span> make <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec B</annotation></semantics></math></span></td></tr>\n</table>\n<p>Here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">Φ</mi><mi>B</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\Phi_B</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">Φ</mi><mi>E</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\Phi_E</annotation></semantics></math></span> are the magnetic and electric fluxes through a surface bounded by the path. Maxwell's addition, the changing-electric-flux term (often called displacement current), keeps Ampère's law consistent when current flows into a capacitor. It also means a changing <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>E</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec E</annotation></semantics></math></span> creates <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec B</annotation></semantics></math></span> just as a changing <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec B</annotation></semantics></math></span> creates <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>E</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec E</annotation></semantics></math></span>. The two can sustain each other with no charges around at all, travelling through empty space as a wave.</p>\n<p>In differential form, written for a single point in space (<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ρ</mi></mrow><annotation encoding=\"application/x-tex\">\\rho</annotation></semantics></math></span> is charge density and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>J</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec J</annotation></semantics></math></span> current density):</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi mathvariant=\"normal\">∇</mi><mo>⋅</mo><mover accent=\"true\"><mi>E</mi><mo>⃗</mo></mover><mo>=</mo><mfrac><mi>ρ</mi><msub><mi>ε</mi><mn>0</mn></msub></mfrac><mo separator=\"true\">,</mo><mspace width=\"1em\"/><mi mathvariant=\"normal\">∇</mi><mo>⋅</mo><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover><mo>=</mo><mn>0</mn><mo separator=\"true\">,</mo><mspace width=\"1em\"/><mi mathvariant=\"normal\">∇</mi><mo>×</mo><mover accent=\"true\"><mi>E</mi><mo>⃗</mo></mover><mo>=</mo><mo>−</mo><mfrac><mrow><mi mathvariant=\"normal\">∂</mi><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><mrow><mi mathvariant=\"normal\">∂</mi><mi>t</mi></mrow></mfrac><mo separator=\"true\">,</mo><mspace width=\"1em\"/><mi mathvariant=\"normal\">∇</mi><mo>×</mo><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover><mo>=</mo><msub><mi>μ</mi><mn>0</mn></msub><mover accent=\"true\"><mi>J</mi><mo>⃗</mo></mover><mo>+</mo><msub><mi>μ</mi><mn>0</mn></msub><msub><mi>ε</mi><mn>0</mn></msub><mfrac><mrow><mi mathvariant=\"normal\">∂</mi><mover accent=\"true\"><mi>E</mi><mo>⃗</mo></mover></mrow><mrow><mi mathvariant=\"normal\">∂</mi><mi>t</mi></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">\\nabla\\cdot\\vec E = \\frac{\\rho}{\\varepsilon_0},\\quad \\nabla\\cdot\\vec B = 0,\\quad \\nabla\\times\\vec E = -\\frac{\\partial\\vec B}{\\partial t},\\quad \\nabla\\times\\vec B = \\mu_0\\vec J + \\mu_0\\varepsilon_0\\frac{\\partial\\vec E}{\\partial t}</annotation></semantics></math></span></div>","related":["gauss","faraday","ampere","emwaves"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">∇</mi></mrow><annotation encoding=\"application/x-tex\">\\nabla</annotation></semantics></math></span>","del: the spatial rate of change (gradient/divergence/curl)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>E</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{E}</annotation></semantics></math></span>","electric field vector","N/C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ρ</mi></mrow><annotation encoding=\"application/x-tex\">\\rho</annotation></semantics></math></span>","charge density: charge per unit volume","C/m³"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ε</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\varepsilon_{0}</annotation></semantics></math></span>","permittivity of free space, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ε</mi><mn>0</mn></msub><mo>≈</mo><mn>8.85</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>12</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">\\varepsilon_0 \\approx 8.85\\times10^{-12}</annotation></semantics></math></span> C²/(N·m²)","C²/(N·m²)"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{B}</annotation></semantics></math></span>","magnetic field vector","T"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">∂</mi></mrow><annotation encoding=\"application/x-tex\">\\partial</annotation></semantics></math></span>","partial derivative: rate of change with one variable (here time) at a fixed point",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">t</annotation></semantics></math></span>","time","s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_{0}</annotation></semantics></math></span>","permeability of free space, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub><mo>≈</mo><mn>4</mn><mi>π</mi><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>7</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">\\mu_0 \\approx 4\\pi\\times10^{-7}</annotation></semantics></math></span> T·m/A","T·m/A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>J</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{J}</annotation></semantics></math></span>","current density: current per unit area, pointing along the flow","A/m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","an infinitesimally small piece/change (in derivatives and integrals)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>A</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{A}</annotation></semantics></math></span>","area vector of a surface; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mover accent=\"true\"><mi>A</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">d\\vec A</annotation></semantics></math></span> is a small outward patch","m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mtext>enc</mtext></msub></mrow><annotation encoding=\"application/x-tex\">Q_{\\text{enc}}</annotation></semantics></math></span>","net charge enclosed by the closed surface","C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi mathvariant=\"normal\">ℓ</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{\\ell}</annotation></semantics></math></span>","position along a closed path; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mover accent=\"true\"><mi mathvariant=\"normal\">ℓ</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">d\\vec\\ell</annotation></semantics></math></span> is a short step along it","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">Φ</mi><mi>B</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\Phi_{B}</annotation></semantics></math></span>","magnetic flux through a surface bounded by the path","Wb"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mtext>enc</mtext></msub></mrow><annotation encoding=\"application/x-tex\">I_{\\text{enc}}</annotation></semantics></math></span>","net current through the closed path","A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">Φ</mi><mi>E</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\Phi_{E}</annotation></semantics></math></span>","electric flux through a surface bounded by the path","V·m"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ε</mi></mrow><annotation encoding=\"application/x-tex\">\\varepsilon</annotation></semantics></math></span>","epsilon","EP-sih-lon","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ε</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\varepsilon_0</annotation></semantics></math></span>, the permittivity of free space."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math></span>","mu","myoo","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_0</annotation></semantics></math></span>, the permeability of free space."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ρ</mi></mrow><annotation encoding=\"application/x-tex\">\\rho</annotation></semantics></math></span>","rho","roe","charge density, charge per cubic metre."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Φ</mi></mrow><annotation encoding=\"application/x-tex\">\\Phi</annotation></semantics></math></span>","capital phi","fie","flux: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">Φ</mi><mi>B</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\Phi_B</annotation></semantics></math></span> magnetic, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi mathvariant=\"normal\">Φ</mi><mi>E</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\Phi_E</annotation></semantics></math></span> electric."]]},{"id":"emwaves","group":"wv","title":"Electromagnetic Waves","blurb":"Light, radio and X-rays are all oscillating electric and magnetic fields.","body":"\n<p>Maxwell's equations predict waves in which <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>E</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec E</annotation></semantics></math></span> and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec B</annotation></semantics></math></span> oscillate perpendicular to each other and to the direction of travel. Their speed comes straight out of the two constants of electricity and magnetism:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>c</mi><mo>=</mo><mfrac><mn>1</mn><msqrt><mrow><msub><mi>μ</mi><mn>0</mn></msub><msub><mi>ε</mi><mn>0</mn></msub></mrow></msqrt></mfrac><mo>≈</mo><mn>3.00</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mn>8</mn></msup><mtext> m/s</mtext></mrow><annotation encoding=\"application/x-tex\">c = \\frac{1}{\\sqrt{\\mu_0\\varepsilon_0}} \\approx 3.00\\times10^{8}\\ \\text{m/s}</annotation></semantics></math></span></div>\n<p>When Maxwell computed this and found it matched the measured speed of light, he concluded that light is an electromagnetic wave. The field amplitudes are linked by <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mo>=</mo><mi>c</mi><mi>B</mi></mrow><annotation encoding=\"application/x-tex\">E = cB</annotation></semantics></math></span>, and frequency and wavelength by</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>c</mi><mo>=</mo><mi>f</mi><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">c = f\\lambda</annotation></semantics></math></span></div>\n<p>The waves carry energy. The average intensity <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span> (power per unit area, not current), for peak field <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">E_0</annotation></semantics></math></span>, is</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>I</mi><mo>=</mo><mfrac><msubsup><mi>E</mi><mtext>rms</mtext><mn>2</mn></msubsup><mrow><msub><mi>μ</mi><mn>0</mn></msub><mi>c</mi></mrow></mfrac><mo>=</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi>c</mi><mtext> </mtext><msub><mi>ε</mi><mn>0</mn></msub><msubsup><mi>E</mi><mn>0</mn><mn>2</mn></msubsup></mrow><annotation encoding=\"application/x-tex\">I = \\frac{E_{\\text{rms}}^2}{\\mu_0 c} = \\tfrac12 c\\,\\varepsilon_0 E_0^2</annotation></semantics></math></span></div>\n<p>Light is also absorbed and emitted in quanta called photons, each with energy <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mo>=</mo><mi>h</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">E = hf</annotation></semantics></math></span>, where <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi><mo>=</mo><mn>6.626</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>34</mn></mrow></msup><mtext> J</mtext><mo lspace=\"0em\" rspace=\"0em\">⋅</mo><mtext>s</mtext></mrow><annotation encoding=\"application/x-tex\">h = 6.626\\times10^{-34}\\ \\text{J}{\\cdot}\\text{s}</annotation></semantics></math></span> is Planck's constant.</p>\n<table class=\"t\">\n<tr><th>Band</th><th>Wavelength</th></tr>\n<tr><td>Radio</td><td>&gt; 1 m</td></tr>\n<tr><td>Microwave</td><td>1 mm to 1 m (often counted as part of radio)</td></tr>\n<tr><td>Infrared</td><td>700 nm to 1 mm</td></tr>\n<tr><td>Visible</td><td>400 to 700 nm</td></tr>\n<tr><td>Ultraviolet</td><td>10 to 400 nm</td></tr>\n<tr><td>X-ray and gamma</td><td>&lt; 10 nm</td></tr>\n</table>","related":["maxwell","rlc","faraday","waves","polarization","photoelectric","timedilation"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">c</annotation></semantics></math></span>","speed of light in vacuum, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c</mi><mo>≈</mo><mn>3.00</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mn>8</mn></msup></mrow><annotation encoding=\"application/x-tex\">c \\approx 3.00\\times10^{8}</annotation></semantics></math></span> m/s","m/s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_{0}</annotation></semantics></math></span>","permeability of free space, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub><mo>≈</mo><mn>4</mn><mi>π</mi><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>7</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">\\mu_0 \\approx 4\\pi\\times10^{-7}</annotation></semantics></math></span> T·m/A","T·m/A"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ε</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\varepsilon_{0}</annotation></semantics></math></span>","permittivity of free space, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ε</mi><mn>0</mn></msub><mo>≈</mo><mn>8.85</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>12</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">\\varepsilon_0 \\approx 8.85\\times10^{-12}</annotation></semantics></math></span> C²/(N·m²)","C²/(N·m²)"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","frequency of the wave","Hz"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","wavelength","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","average intensity: power per unit area (not current)","W/m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mtext>rms</mtext></msub></mrow><annotation encoding=\"application/x-tex\">E_{\\text{rms}}</annotation></semantics></math></span>","rms electric field of the wave, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mn>0</mn></msub><mi mathvariant=\"normal\">/</mi><msqrt><mn>2</mn></msqrt></mrow><annotation encoding=\"application/x-tex\">E_0/\\sqrt2</annotation></semantics></math></span>","V/m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">E_{0}</annotation></semantics></math></span>","peak (amplitude) electric field of the wave","V/m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>E</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{E}</annotation></semantics></math></span>","electric field vector of the wave","V/m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><mi>B</mi><mo>⃗</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\vec{B}</annotation></semantics></math></span>","magnetic field vector of the wave","T"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi></mrow><annotation encoding=\"application/x-tex\">E</annotation></semantics></math></span>","electric field magnitude (in <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mo>=</mo><mi>c</mi><mi>B</mi></mrow><annotation encoding=\"application/x-tex\">E = cB</annotation></semantics></math></span>), or photon energy (in <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mo>=</mo><mi>h</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">E = hf</annotation></semantics></math></span>)","V/m or J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>B</mi></mrow><annotation encoding=\"application/x-tex\">B</annotation></semantics></math></span>","magnetic field magnitude of the wave","T"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">h</annotation></semantics></math></span>","Planck's constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi><mo>≈</mo><mn>6.626</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>34</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">h \\approx 6.626\\times10^{-34}</annotation></semantics></math></span> J·s","J·s"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>B</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">B_{0}</annotation></semantics></math></span>","peak magnetic field of the wave, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mn>0</mn></msub><mi mathvariant=\"normal\">/</mi><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">E_0/c</annotation></semantics></math></span>","T"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mtext>photon</mtext></msub></mrow><annotation encoding=\"application/x-tex\">E_{\\text{photon}}</annotation></semantics></math></span>","energy of one photon, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">hf</annotation></semantics></math></span> (calculator shows it in eV)","eV"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ε</mi></mrow><annotation encoding=\"application/x-tex\">\\varepsilon</annotation></semantics></math></span>","epsilon","EP-sih-lon","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ε</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\varepsilon_0</annotation></semantics></math></span>, the permittivity of free space."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","lambda","LAM-duh","wavelength."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math></span>","mu","myoo","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\mu_0</annotation></semantics></math></span>, the permeability of free space."]],"calc":{"title":"Wavelength and photon energy","inputs":[{"k":"f","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">f</annotation></semantics></math></span>","unit":"Hz","d":"100e6"},{"k":"E0","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">E_0</annotation></semantics></math></span>","unit":"V/m","d":"10"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>B</mi><mn>0</mn></msub><mo>=</mo><msub><mi>E</mi><mn>0</mn></msub><mi mathvariant=\"normal\">/</mi><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">B_0 = E_0/c</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi></mrow><annotation encoding=\"application/x-tex\">I</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mtext>photon</mtext></msub><mo>=</mo><mi>h</mi><mi>f</mi></mrow><annotation encoding=\"application/x-tex\">E_{\\text{photon}} = hf</annotation></semantics></math></span>"],"outUnits":["m","T","W/m²","eV"]}},{"id":"temperature","group":"th","title":"Temperature & Expansion","blurb":"What a thermometer measures, and why things grow when they warm up.","body":"\n<p>Temperature measures how vigorously the atoms in something are jiggling. Two objects in contact exchange energy until they reach the same temperature, which is called thermal equilibrium. That's what lets a thermometer work.</p>\n<p>Three scales are in common use. Kelvin starts at <b>absolute zero</b>, the point where thermal motion is at its minimum, and is the one to use in physics formulas:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>T</mi><mi>K</mi></msub><mo>=</mo><msub><mi>T</mi><mi>C</mi></msub><mo>+</mo><mn>273.15</mn><mo separator=\"true\">,</mo><mspace width=\"2em\"/><msub><mi>T</mi><mi>F</mi></msub><mo>=</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>9</mn><mn>5</mn></mfrac></mstyle><msub><mi>T</mi><mi>C</mi></msub><mo>+</mo><mn>32</mn></mrow><annotation encoding=\"application/x-tex\">T_K = T_C + 273.15, \\qquad T_F = \\tfrac95 T_C + 32</annotation></semantics></math></span></div>\n<p>Most materials expand when heated, because more vigorous jiggling pushes atoms slightly further apart. For a rod of length <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span> and for a volume <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>L</mi><mo>=</mo><mi>α</mi><mi>L</mi><mtext> </mtext><mi mathvariant=\"normal\">Δ</mi><mi>T</mi><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi mathvariant=\"normal\">Δ</mi><mi>V</mi><mo>=</mo><mi>β</mi><mi>V</mi><mtext> </mtext><mi mathvariant=\"normal\">Δ</mi><mi>T</mi><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>β</mi><mo>≈</mo><mn>3</mn><mi>α</mi><mtext>  (solids)</mtext></mrow><annotation encoding=\"application/x-tex\">\\Delta L = \\alpha L\\,\\Delta T, \\qquad \\Delta V = \\beta V\\,\\Delta T, \\qquad \\beta \\approx 3\\alpha \\ \\ \\text{(solids)}</annotation></semantics></math></span></div>\n<p>Bridges have expansion joints and railway tracks have gaps for this reason. A bimetallic strip, two metals with different <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi></mrow><annotation encoding=\"application/x-tex\">\\alpha</annotation></semantics></math></span> bonded together, bends as it warms, which is how many simple thermostats work.</p>\n<div class=\"note\"><b>Water is odd.</b> Between 0 °C and 4 °C water <i>shrinks</i> as it warms, so it is densest at 4 °C. Lakes freeze from the top down, and life survives underneath.</div>","related":["heat","idealgas","kinetic"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>K</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_{K}</annotation></semantics></math></span>","temperature on the Kelvin scale (absolute temperature)","K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_{C}</annotation></semantics></math></span>","temperature on the Celsius scale","°C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>F</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_{F}</annotation></semantics></math></span>","temperature on the Fahrenheit scale","°F"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","\"change in\" the quantity that follows (e.g. <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta T</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta L</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta V</annotation></semantics></math></span>)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","original length of the rod or object","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi></mrow><annotation encoding=\"application/x-tex\">\\alpha</annotation></semantics></math></span>","coefficient of linear thermal expansion of the material","1/K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","temperature (here appearing as the change <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta T</annotation></semantics></math></span>)","K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>","original volume of the object or substance","m³"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>β</mi></mrow><annotation encoding=\"application/x-tex\">\\beta</annotation></semantics></math></span>","coefficient of volume thermal expansion; about <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><mi>α</mi></mrow><annotation encoding=\"application/x-tex\">3\\alpha</annotation></semantics></math></span> for solids","1/K"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi></mrow><annotation encoding=\"application/x-tex\">\\alpha</annotation></semantics></math></span>","alpha","AL-fuh","coefficient of linear expansion: fractional change in length per kelvin."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>β</mi></mrow><annotation encoding=\"application/x-tex\">\\beta</annotation></semantics></math></span>","beta","BAY-tuh","coefficient of volume expansion: fractional change in volume per kelvin."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","capital delta","DEL-tuh","“change in”: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta x</annotation></semantics></math></span> means the final value of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span> minus the starting value."]],"calc":{"title":"Convert and expand","inputs":[{"k":"Tc","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>C</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_C</annotation></semantics></math></span>","unit":"°C","d":"25"},{"k":"L","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","unit":"m","d":"100"},{"k":"a","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi></mrow><annotation encoding=\"application/x-tex\">\\alpha</annotation></semantics></math></span>","unit":"1/K","d":"12e-6"},{"k":"dT","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta T</annotation></semantics></math></span>","unit":"K","d":"40"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>K</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_K</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mi>F</mi></msub></mrow><annotation encoding=\"application/x-tex\">T_F</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta L</annotation></semantics></math></span>"],"outUnits":["K","°F","m"]}},{"id":"heat","group":"th","title":"Heat & Phase Changes","blurb":"Energy that flows because of a temperature difference, and where it goes.","body":"\n<p><b>Heat</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi></mrow><annotation encoding=\"application/x-tex\">Q</annotation></semantics></math></span> is energy transferred because of a temperature difference. It's measured in joules (the older calorie is <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4.186</mn><mtext> J</mtext></mrow><annotation encoding=\"application/x-tex\">4.186\\ \\text{J}</annotation></semantics></math></span>, and a food Calorie is 1000 of those). Adding heat to a substance usually raises its temperature, by an amount set by its <b>specific heat</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">c</annotation></semantics></math></span>:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>Q</mi><mo>=</mo><mi>m</mi><mi>c</mi><mtext> </mtext><mi mathvariant=\"normal\">Δ</mi><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">Q = m c\\,\\Delta T</annotation></semantics></math></span></div>\n<p>Water's specific heat, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>4186</mn><mtext> J/(kg</mtext><mo lspace=\"0em\" rspace=\"0em\">⋅</mo><mtext>K)</mtext></mrow><annotation encoding=\"application/x-tex\">4186\\ \\text{J/(kg}{\\cdot}\\text{K)}</annotation></semantics></math></span>, is unusually large. That's why oceans moderate coastal climates and why a pan of water takes so long to boil.</p>\n<p>During a <b>phase change</b> (melting, boiling) the temperature stays fixed while heat goes into breaking molecular bonds. The energy needed per kilogram is the <b>latent heat</b> <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>Q</mi><mo>=</mo><mi>m</mi><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">Q = m L</annotation></semantics></math></span></div>\n<table class=\"t\">\n<tr><th>Water</th><th>Value</th></tr>\n<tr><td>Specific heat (liquid)</td><td>4186 J/(kg·K)</td></tr>\n<tr><td>Specific heat (ice)</td><td>~2100 J/(kg·K)</td></tr>\n<tr><td>Latent heat of fusion</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3.34</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mn>5</mn></msup></mrow><annotation encoding=\"application/x-tex\">3.34\\times10^5</annotation></semantics></math></span> J/kg</td></tr>\n<tr><td>Latent heat of vaporization</td><td><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2.26</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mn>6</mn></msup></mrow><annotation encoding=\"application/x-tex\">2.26\\times10^6</annotation></semantics></math></span> J/kg</td></tr>\n</table>\n<p>Boiling a kilogram of water takes over five times as much energy as heating it from 0 °C to 100 °C. Sweating cools you because evaporating it carries that latent heat away.</p>","related":["temperature","heattransfer","firstlaw"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi></mrow><annotation encoding=\"application/x-tex\">Q</annotation></semantics></math></span>","heat transferred to the substance","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","mass of the substance","kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c</mi></mrow><annotation encoding=\"application/x-tex\">c</annotation></semantics></math></span>","specific heat: energy to raise 1 kg by 1 K (water: 4186)","J/(kg·K)"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","\"change in\" (here the temperature change <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta T</annotation></semantics></math></span>)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","temperature (appearing as the change <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta T</annotation></semantics></math></span>)","K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">L</annotation></semantics></math></span>","latent heat: energy per kilogram needed for a phase change (melting or boiling)","J/kg"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mtext>start</mtext></msub></mrow><annotation encoding=\"application/x-tex\">T_{\\text{start}}</annotation></semantics></math></span>","starting temperature in the calculator (below 0 °C means ice)","°C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mtext>end</mtext></msub></mrow><annotation encoding=\"application/x-tex\">T_{\\text{end}}</annotation></semantics></math></span>","final water temperature in the calculator, if not boiling","°C"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mtext>warm ice</mtext></msub></mrow><annotation encoding=\"application/x-tex\">Q_{\\text{warm ice}}</annotation></semantics></math></span>","heat to warm the ice up to 0 °C","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mtext>melt</mtext></msub></mrow><annotation encoding=\"application/x-tex\">Q_{\\text{melt}}</annotation></semantics></math></span>","heat to melt the ice at 0 °C (latent heat of fusion)","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mtext>warm water</mtext></msub></mrow><annotation encoding=\"application/x-tex\">Q_{\\text{warm water}}</annotation></semantics></math></span>","heat to warm the liquid water to its final temperature","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mtext>boil</mtext></msub></mrow><annotation encoding=\"application/x-tex\">Q_{\\text{boil}}</annotation></semantics></math></span>","heat to boil the water at 100 °C (latent heat of vaporization)","J"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mtext>total</mtext></msub></mrow><annotation encoding=\"application/x-tex\">Q_{\\text{total}}</annotation></semantics></math></span>","total heat for all the stages combined","J"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","capital delta","DEL-tuh","“change in”: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta x</annotation></semantics></math></span> means the final value of <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">x</annotation></semantics></math></span> minus the starting value."]],"calc":{"title":"Ice to steam","inputs":[{"k":"m","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span>","unit":"kg","d":"0.5"},{"k":"T0","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mtext>start</mtext></msub><mtext> (ice if below 0)</mtext></mrow><annotation encoding=\"application/x-tex\">T_{\\text{start}}\\ \\text{(ice if below 0)}</annotation></semantics></math></span>","unit":"°C","d":"-10"},{"k":"T1","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mtext>end</mtext></msub><mtext> (water, if not boiling)</mtext></mrow><annotation encoding=\"application/x-tex\">T_{\\text{end}}\\ \\text{(water, if not boiling)}</annotation></semantics></math></span>","unit":"°C","d":"100"},{"k":"boil","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mtext>boil it? </mtext><mo stretchy=\"false\">(</mo><mn>1</mn><mo>=</mo><mtext>yes</mtext><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\text{boil it?}\\ (1 = \\text{yes})</annotation></semantics></math></span>","unit":"","d":"1"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mtext>warm ice</mtext></msub></mrow><annotation encoding=\"application/x-tex\">Q_{\\text{warm ice}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mtext>melt</mtext></msub></mrow><annotation encoding=\"application/x-tex\">Q_{\\text{melt}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mtext>warm water</mtext></msub></mrow><annotation encoding=\"application/x-tex\">Q_{\\text{warm water}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mtext>boil</mtext></msub></mrow><annotation encoding=\"application/x-tex\">Q_{\\text{boil}}</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>Q</mi><mtext>total</mtext></msub></mrow><annotation encoding=\"application/x-tex\">Q_{\\text{total}}</annotation></semantics></math></span>"],"outUnits":["J","J","J","J","J"]}},{"id":"heattransfer","group":"th","title":"Heat Transfer","blurb":"Conduction, convection and radiation: the three ways heat gets around.","body":"\n<p><b>Conduction</b> passes energy through a material by collisions between neighbouring atoms. Through a slab of area <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span> and thickness <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>, with a temperature difference <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta T</annotation></semantics></math></span> across it, the rate is</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>P</mi><mo>=</mo><mfrac><mrow><mi>k</mi><mi>A</mi><mtext> </mtext><mi mathvariant=\"normal\">Δ</mi><mi>T</mi></mrow><mi>d</mi></mfrac></mrow><annotation encoding=\"application/x-tex\">P = \\frac{k A\\,\\Delta T}{d}</annotation></semantics></math></span></div>\n<p>where <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span> is the thermal conductivity. Metals have high <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span> (copper ≈ 400 W/(m·K)); air, foam and wool have very low <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>, which is why insulation works by trapping still air.</p>\n<p><b>Convection</b> carries heat by moving the fluid itself. Warm air rises because it's less dense, cool air sinks to take its place, and a circulating current forms. It drives sea breezes, weather and the boiling of soup.</p>\n<p><b>Radiation</b> needs no medium at all. Every object glows with electromagnetic radiation, more strongly the hotter it is (the Stefan–Boltzmann law), with emissivity <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi></mrow><annotation encoding=\"application/x-tex\">e</annotation></semantics></math></span> between 0 and 1:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>P</mi><mo>=</mo><mi>e</mi><mi>σ</mi><mi>A</mi><msup><mi>T</mi><mn>4</mn></msup><mo separator=\"true\">,</mo><mspace width=\"2em\"/><mi>σ</mi><mo>=</mo><mn>5.67</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>8</mn></mrow></msup><mtext> </mtext><msup><mtext>W/(m</mtext><mn>2</mn></msup><mrow></mrow><mo lspace=\"0em\" rspace=\"0em\">⋅</mo><msup><mtext>K</mtext><mn>4</mn></msup><mo stretchy=\"false\">)</mo></mrow><annotation encoding=\"application/x-tex\">P = e\\sigma A T^4, \\qquad \\sigma = 5.67\\times10^{-8}\\ \\text{W/(m}^2\\text{}{\\cdot}\\text{K}^4)</annotation></semantics></math></span></div>\n<p>Hotter objects also glow at shorter wavelengths. The peak of the spectrum follows <b>Wien's law</b>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>λ</mi><mi>max</mi><mo>⁡</mo></msub><mi>T</mi><mo>=</mo><mn>2.898</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>3</mn></mrow></msup><mtext> m</mtext><mo lspace=\"0em\" rspace=\"0em\">⋅</mo><mtext>K</mtext></mrow><annotation encoding=\"application/x-tex\">\\lambda_{\\max} T = 2.898\\times10^{-3}\\ \\text{m}{\\cdot}\\text{K}</annotation></semantics></math></span>. Your skin, at about 305 K, glows in the infrared, peaking near 9.5 µm; the Sun, at about 5800 K, peaks in visible light.</p>","related":["heat","photoelectric","emwaves"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span>","rate of heat transfer (power), by conduction or radiation","W"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi></mrow><annotation encoding=\"application/x-tex\">k</annotation></semantics></math></span>","thermal conductivity of the material","W/(m·K)"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span>","area through which heat is conducted, or radiating surface area","m²"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","\"change in\"; here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta T</annotation></semantics></math></span> is the temperature difference across the slab",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","temperature (absolute, in kelvin, for radiation and Wien’s law)","K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi></mrow><annotation encoding=\"application/x-tex\">d</annotation></semantics></math></span>","thickness of the slab heat is conducted through","m"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi></mrow><annotation encoding=\"application/x-tex\">e</annotation></semantics></math></span>","emissivity of the surface, between 0 and 1 (1 = perfect black body)",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>σ</mi></mrow><annotation encoding=\"application/x-tex\">\\sigma</annotation></semantics></math></span>","Stefan–Boltzmann constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5.67</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>8</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">5.67\\times10^{-8}</annotation></semantics></math></span>","W/(m²·K⁴)"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>λ</mi><mi>max</mi><mo>⁡</mo></msub></mrow><annotation encoding=\"application/x-tex\">\\lambda_{\\max}</annotation></semantics></math></span>","wavelength at which the emitted spectrum peaks (Wien’s law)","m"]],"greek":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta</annotation></semantics></math></span>","capital delta","DEL-tuh","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi mathvariant=\"normal\">Δ</mi><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta T</annotation></semantics></math></span>, the temperature difference across the slab."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda</annotation></semantics></math></span>","lambda","LAM-duh","wavelength; <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>λ</mi><mi>max</mi><mo>⁡</mo></msub></mrow><annotation encoding=\"application/x-tex\">\\lambda_{\\max}</annotation></semantics></math></span> is where the glow is brightest."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>μ</mi></mrow><annotation encoding=\"application/x-tex\">\\mu</annotation></semantics></math></span>","mu","myoo","as a unit prefix (µ), “micro-”, one millionth: 1 µs = <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>6</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">10^{-6}</annotation></semantics></math></span> s."],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>σ</mi></mrow><annotation encoding=\"application/x-tex\">\\sigma</annotation></semantics></math></span>","sigma","SIG-muh","the Stefan–Boltzmann constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>5.67</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>8</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">5.67\\times10^{-8}</annotation></semantics></math></span> W/(m²·K⁴)."]],"calc":{"title":"Glowing body","inputs":[{"k":"T","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","unit":"K","d":"5778"},{"k":"A","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi></mrow><annotation encoding=\"application/x-tex\">A</annotation></semantics></math></span>","unit":"m²","d":"1"},{"k":"e","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi></mrow><annotation encoding=\"application/x-tex\">e</annotation></semantics></math></span>","unit":"","d":"1"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>λ</mi><mi>max</mi><mo>⁡</mo></msub></mrow><annotation encoding=\"application/x-tex\">\\lambda_{\\max}</annotation></semantics></math></span>"],"outUnits":["W","m"]}},{"id":"idealgas","group":"th","title":"Ideal Gas Law","blurb":"Pressure, volume, temperature and amount of a gas tied together in one equation.","body":"\n<p>Gases at ordinary densities follow a remarkably simple rule. Pressure <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span>, volume <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>, absolute temperature <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span> and the amount of gas are linked by</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>P</mi><mi>V</mi><mo>=</mo><mi>n</mi><mi>R</mi><mi>T</mi><mo>=</mo><mi>N</mi><msub><mi>k</mi><mi>B</mi></msub><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">PV = nRT = N k_B T</annotation></semantics></math></span></div>\n<p>Here <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span> is the number of moles, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi><mo>=</mo><mn>8.314</mn><mtext> J/(mol</mtext><mo lspace=\"0em\" rspace=\"0em\">⋅</mo><mtext>K)</mtext></mrow><annotation encoding=\"application/x-tex\">R = 8.314\\ \\text{J/(mol}{\\cdot}\\text{K)}</annotation></semantics></math></span> is the gas constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span> the number of molecules and <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>k</mi><mi>B</mi></msub><mo>=</mo><mi>R</mi><mi mathvariant=\"normal\">/</mi><msub><mi>N</mi><mi>A</mi></msub><mo>=</mo><mn>1.381</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>23</mn></mrow></msup><mtext> J/K</mtext></mrow><annotation encoding=\"application/x-tex\">k_B = R/N_A = 1.381\\times10^{-23}\\ \\text{J/K}</annotation></semantics></math></span> is Boltzmann's constant. Temperature must be in kelvin.</p>\n<p>Holding some quantities fixed gives the older named laws: at fixed <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">PV</annotation></semantics></math></span> is constant (Boyle); at fixed <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi><mo>∝</mo><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">V \\propto T</annotation></semantics></math></span> (Charles); at fixed <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo>∝</mo><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">P \\propto T</annotation></semantics></math></span> (Gay-Lussac). For a fixed amount of gas going between two states:</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mfrac><mrow><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub></mrow><msub><mi>T</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><mrow><msub><mi>P</mi><mn>2</mn></msub><msub><mi>V</mi><mn>2</mn></msub></mrow><msub><mi>T</mi><mn>2</mn></msub></mfrac></mrow><annotation encoding=\"application/x-tex\">\\frac{P_1 V_1}{T_1} = \\frac{P_2 V_2}{T_2}</annotation></semantics></math></span></div>\n<p>One mole of any ideal gas at 0 °C and 1 atm occupies about 22.4 litres. Real gases deviate when they're squeezed close to liquefying, because their molecules then take up space and attract each other.</p>\n<p>Pressure is in pascals: <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mtext> atm</mtext><mo>=</mo><mn>101</mn><mo separator=\"true\" lspace=\"0em\" rspace=\"0em\">,</mo><mn>325</mn><mtext> Pa</mtext></mrow><annotation encoding=\"application/x-tex\">1\\ \\text{atm} = 101{,}325\\ \\text{Pa}</annotation></semantics></math></span>.</p>\n<div class=\"sim\" data-sim=\"gas\"></div>","related":["kinetic","temperature","processes"],"syms":[["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span>","pressure of the gas (1 atm = 101 325 Pa)","Pa"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>","volume of the gas","m³"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>","amount of gas in moles","mol"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">R</annotation></semantics></math></span>","gas constant, 8.314","J/(mol·K)"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","absolute temperature of the gas","K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>","number of molecules",""],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>k</mi><mi>B</mi></msub></mrow><annotation encoding=\"application/x-tex\">k_{B}</annotation></semantics></math></span>","Boltzmann constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi><mi mathvariant=\"normal\">/</mi><msub><mi>N</mi><mi>A</mi></msub><mo>=</mo><mn>1.381</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mrow><mo>−</mo><mn>23</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">R/N_A = 1.381\\times10^{-23}</annotation></semantics></math></span>","J/K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">P_{1}</annotation></semantics></math></span>","pressure in the first state","Pa"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">V_{1}</annotation></semantics></math></span>","volume in the first state","m³"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mn>1</mn></msub></mrow><annotation encoding=\"application/x-tex\">T_{1}</annotation></semantics></math></span>","absolute temperature in the first state","K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">P_{2}</annotation></semantics></math></span>","pressure in the second state","Pa"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>V</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">V_{2}</annotation></semantics></math></span>","volume in the second state","m³"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">T_{2}</annotation></semantics></math></span>","absolute temperature in the second state","K"],["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>N</mi><mi>A</mi></msub></mrow><annotation encoding=\"application/x-tex\">N_{A}</annotation></semantics></math></span>","Avogadro constant, <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>6.022</mn><mo>×</mo><mn>1</mn><msup><mn>0</mn><mn>23</mn></msup></mrow><annotation encoding=\"application/x-tex\">6.022\\times10^{23}</annotation></semantics></math></span> per mole","1/mol"]],"greek":[],"calc":{"title":"Solve for pressure","inputs":[{"k":"n","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi></mrow><annotation encoding=\"application/x-tex\">n</annotation></semantics></math></span>","unit":"mol","d":"1"},{"k":"T","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">T</annotation></semantics></math></span>","unit":"K","d":"273.15"},{"k":"V","label":"<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">V</annotation></semantics></math></span>","unit":"m³","d":"0.0224"}],"outLabels":["<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi></mrow><annotation encoding=\"application/x-tex\">P</annotation></semantics></math></span>","<span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span>"],"outUnits":["Pa","atm","molecules"]}},{"id":"kinetic","group":"th","title":"Kinetic Theory","blurb":"Gas pressure and temperature explained by countless molecules in motion.","body":"\n<p>A gas is a swarm of molecules flying about and bouncing off the walls. Each bounce gives the wall a tiny push; the astronomical number of bounces every second adds up to a steady pressure. Working this through for <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi></mrow><annotation encoding=\"application/x-tex\">N</annotation></semantics></math></span> molecules of mass <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">m</annotation></semantics></math></span> gives</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mi>P</mi><mi>V</mi><mo>=</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>3</mn></mfrac></mstyle><mi>N</mi><mi>m</mi><mover accent=\"true\"><msup><mi>v</mi><mn>2</mn></msup><mo stretchy=\"true\">‾</mo></mover></mrow><annotation encoding=\"application/x-tex\">PV = \\tfrac13 N m \\overline{v^2}</annotation></semantics></math></span></div>\n<p>where <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover accent=\"true\"><msup><mi>v</mi><mn>2</mn></msup><mo stretchy=\"true\">‾</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\overline{v^2}</annotation></semantics></math></span> is the average of the squared speed.</p>\n<p>Comparing with the ideal gas law reveals what temperature actually is: the average translational kinetic energy of a molecule.</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><mover accent=\"true\"><mi>K</mi><mo stretchy=\"true\">‾</mo></mover><mo>=</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mi>m</mi><mover accent=\"true\"><msup><mi>v</mi><mn>2</mn></msup><mo stretchy=\"true\">‾</mo></mover><mo>=</mo><mstyle displaystyle=\"false\" scriptlevel=\"0\"><mfrac><mn>3</mn><mn>2</mn></mfrac></mstyle><msub><mi>k</mi><mi>B</mi></msub><mi>T</mi></mrow><annotation encoding=\"application/x-tex\">\\overline{K} = \\tfrac12 m\\overline{v^2} = \\tfrac32 k_B T</annotation></semantics></math></span></div>\n<p>So the typical (root-mean-square) molecular speed is</p>\n<div class=\"eq\"><span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"block\"><semantics><mrow><msub><mi>v</mi><mtext>rms</mtext></msub><mo>=</mo><msqrt><mfrac><mrow><mn>3</mn><msub><mi>k</mi><mi>B</mi></msub><mi>T</mi></mrow><mi>m</mi></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mrow><mn>3</mn><mi>R</mi><mi>T</mi></mrow><mi>M</mi></mfrac></msqrt></mrow><annotation encoding=\"application/x-tex\">v_{\\text{rms}} = \\sqrt{\\frac{3 k_B T}{m}} = \\sqrt{\\frac{3RT}{M}}</annotation></semantics></math></span></div>\n<p>with <span class=\"katex\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">M</annotation></semantics></math></span> the molar mass in kg/mol. Nitrogen molecules in room air average about 500 m/s. Lighter molecules move faster at the same temperature, which is why hydrogen and helium leak out of Earth's atmosphere over time.</p>\n<p>Speeds in a gas aren't all the same; they follow the Maxwel
