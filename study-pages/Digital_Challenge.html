  const w=CC.el(`<div><div class="statusbar"><span class="pill" id="ct">0:00</span><span class="pill small">30 answers</span></div><p class="small muted">Complete each column count starting with the number given at the top of the column. Do not add leading zeros to your answers. Enter moves to the next block.</p>
    <div class="card"><div class="cnt-grid">${starts.map((st,c)=>`<div class="cnt-col"><div class="head">${fmt(st)}</div>${Array.from({length:10},(_,r)=>`<input data-c="${c}" data-r="${r}" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="${base===16?'text':'numeric'}" aria-label="column ${c+1} row ${r+1}"><div class="cor" id="cc${c}_${r}"></div>`).join('')}</div>`).join('')}</div>
    <div class="row end mt"><button class="btn primary" id="cg">Start grading</button></div></div></div>`);
  DK._last={kind:'cnt',ans:starts.map(st=>Array.from({length:10},(_,r)=>fmt(st+r+1)))};
  el.appendChild(w);s.every(()=>{CC.$('#ct',w).textContent=CC.fmtTime(s.elapsed());},1000);
  const inputs=CC.$$('input',w);
  inputs.forEach((inp,i)=>inp.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='ArrowDown'){e.preventDefault();(inputs[i+1]||CC.$('#cg',w)).focus();}else if(e.key==='ArrowUp'&&inputs[i-1]){e.preventDefault();inputs[i-1].focus();}}));
  CC.$('#cg',w).onclick=async()=>{
    const blanks=inputs.filter(x=>!x.value.trim()).length;
    if(blanks&&!(await CC.confirm(`${blanks} block${blanks>1?'s are':' is'} empty and will be graded as wrong. Grade now?`,'Grade')))return;
    let right=0;inputs.forEach(inp=>{const c=+inp.dataset.c,r=+inp.dataset.r;const ans=fmt(starts[c]+r+1);const ok=DK.normNum(inp.value)===ans;if(ok)right++;inp.classList.add(ok?'ok':'bad');inp.readOnly=true;if(!ok)CC.$(`#cc${c}_${r}`,w).textContent=ans;});
    CC.$('#cg',w).disabled=true;s.finish(right/30*100,`${right} of 30 counts correct.`);
    const again=CC.el('<div class="row end mt noprint"><button class="btn primary">New problem set</button></div>');CC.$('button',again).onclick=()=>s.restart();w.appendChild(again);
  };
}

/* ======================= Binary arithmetic ======================= */
function stack(a,b,op){const w=Math.max(a.length,b.length)+1;const pad=x=>x.padStart(w,' ').replace(/ /g,'&nbsp;');return `<div class="sum-table"><div>${pad(a)}</div><div>${op}${pad(b).slice(6)}</div><div class="rule">&nbsp;</div></div>`;}
function carryRow(a,b){// returns carries into each column (string aligned with the sum)
  const n=Math.max(a.length,b.length)+1;const A=a.padStart(n,'0'),B=b.padStart(n,'0');let c=0;const cs=Array(n).fill(' ');
  for(let i=n-1;i>=0;i--){const t=+A[i]+ +B[i]+c;c=t>>1;if(c&&i>0)cs[i-1]='1';}return cs.join('');}
function addProblem(){const bits=ri(3,8);const a=ri(1,(1<<bits)-1),b=ri(1,(1<<ri(2,bits))-1);const A=a.toString(2),B=b.toString(2),S=(a+b).toString(2);
  const cr=carryRow(A,B);
  return {title:'Binary addition',prompt:stack(A,B,'+'),fields:[numField('Sum',S)],explain:`<p class="small">${A}₂ (${a}) + ${B}₂ (${b}) = ${S}₂ (${a+b})</p>`,
    work:[`>Add column by column from the right. The four facts: 0 + 0 = 0, 0 + 1 = 1, 1 + 1 = 0 carry 1, and 1 + 1 + 1 = 1 carry 1.`,
      `>Carries${cr.includes('1')?'':' (none)'}: <span class="kbd" style="white-space:pre">${carryRow(A,B).replace(/ /g,'·')}</span> (· = no carry; each carry is written over the next column to the left)`,
      `\\text{${A}}_{2}+\\text{${B}}_{2}=\\text{${S}}_{2}`,`>Check in decimal: ${a} + ${b} = ${a+b}, and ${S}₂ = ${a+b}.`]};}
function subProblem(){const bits=ri(3,8);let a=ri(2,(1<<bits)-1),b=ri(1,a-1);const A=a.toString(2),B=b.toString(2),D=(a-b).toString(2);
  const n=A.length;const Bp=B.padStart(n,'0');const ones=Bp.split('').map(x=>x==='1'?'0':'1').join('');const twos=((parseInt(ones,2)+1)%(1<<n)).toString(2).padStart(n,'0');
  const sum=(a+parseInt(twos,2)).toString(2);
  return {title:'Binary subtraction',prompt:stack(A,B,'−'),fields:[numField('Difference',D)],explain:`<p class="small">${A}₂ (${a}) − ${B}₂ (${b}) = ${D}₂ (${a-b})</p>`,
    work:[`>Two's complement method (borrowing gives the same result):`,
      `>1. Pad the subtrahend with leading zeros to ${n} bits: <span class="kbd">${Bp}</span>`,
      `>2. Invert every bit (one's complement): <span class="kbd">${ones}</span>, then add 1 (two's complement): <span class="kbd">${twos}</span>`,
      `>3. Add it to the minuend: <span class="kbd">${A} + ${twos} = ${sum}</span>`,
      `>4. Discard the carry out of the ${n}-bit column and drop leading zeros:`,
      `\\text{${A}}_{2}-\\text{${B}}_{2}=\\text{${D}}_{2}`,`>Check in decimal: ${a} − ${b} = ${a-b}.`]};}

    g+=`<rect x="250" y="-2" width="100" height="0" fill="none"/>`;
    g+=`<polyline points="120,110 120,96 100,96 100,14" fill="none" stroke="#d33" stroke-width="3"/><text x="104" y="40" font-size="10" fill="#b22">+5 V (pin 14)</text>`;
    g+=`<polyline points="216,160 216,190 330,190 330,246" fill="none" stroke="#222" stroke-width="3"/><text x="250" y="204" font-size="10" fill="#333">GND (pin 7)</text>`;
    // pull-up resistors to inputs
    const pinX=p=>p<=7?117+(p-1)*16+3:117+(14-p)*16+3;
    const inPins=[pins[0],pins[1]].filter(p=>p!==null);
    inPins.forEach((p,i)=>{const x=pinX(p);g+=`<line x1="${x}" y1="160" x2="${x}" y2="${200+i*8}" stroke="#666" stroke-width="2"/><rect x="${x-14+i*0}" y="${200+i*8}" width="0" height="0"/>`;
      g+=`<path d="M${x},${200+i*8} L${40+i*30},${200+i*8} L${40+i*30},30" fill="none" stroke="#777" stroke-width="2"/><rect x="${34+i*30}" y="60" width="12" height="34" rx="5" fill="#d9b77a" stroke="#8b6f3a"/><rect x="${34+i*30}" y="68" width="12" height="4" fill="#6d4c41"/><rect x="${34+i*30}" y="76" width="12" height="4" fill="#111"/><rect x="${34+i*30}" y="84" width="12" height="4" fill="#ef6c00"/>`;
      const v=i===0?A:B;if(!v)g+=`<path d="M${x},${172} q 10,30 ${30-i*10},70" fill="none" stroke="#8e44ad" stroke-width="4" stroke-linecap="round"/>`;
      g+=`<text x="${40+i*30}" y="110" font-size="9" text-anchor="middle" fill="#555">R${i+1}</text>`;});
    // output → resistor → LED
    const ox=pinX(pins[2]);const oy=pins[2]<=7?160:110;
    g+=`<polyline points="${ox},${oy} ${ox},${oy===160?176:96} 250,${oy===160?176:96} 250,120 280,120" fill="none" stroke="#e5c100" stroke-width="3"/><rect x="280" y="114" width="30" height="12" rx="5" fill="#d9b77a" stroke="#8b6f3a"/><text x="295" y="110" font-size="9" text-anchor="middle" fill="#555">R3 1k</text>`;
    g+=`<line x1="310" y1="120" x2="322" y2="140" stroke="#777" stroke-width="2"/>${out?`<circle cx="326" cy="150" r="22" fill="#ff5a2a" opacity=".35"/>`:''}<circle cx="326" cy="150" r="10" fill="${out?'#ff3b1f':'#8a3a2a'}" stroke="#5a1a10"/><line x1="326" y1="160" x2="330" y2="246" stroke="#777" stroke-width="2"/><text x="326" y="178" font-size="10" text-anchor="middle" fill="#333" font-weight="700">LED</text>`;
    CC.$('#bbv',w).innerHTML=`<svg viewBox="0 0 360 260" width="360" height="260" role="img" aria-label="breadboard" style="max-width:100%;height:auto">${g}</svg>`;
    // schematic
    const gs=DK.gate(t,n,120,70,{});
    let sc=gs.svg+`<line x1="${gs.out[0]}" y1="70" x2="${gs.out[0]+40}" y2="70"/>`+DK.txt(gs.out[0]+28,62,`<tspan class="lv lv${out}">${out}</tspan>`,{size:14,w:800});
    gs.ins.forEach((p,i)=>{const v=i===0?A:B;sc+=`<line x1="${p[0]-40}" y1="${p[1]}" x2="${p[0]}" y2="${p[1]}"/>`+DK.txt(p[0]-46,p[1]+5,`<tspan class="lv lv${v}">${v}</tspan>`,{size:14,w:800,anchor:'end'})+DK.txt(p[0]-12,p[1]-5,`pin ${pins[i]}`,{size:9});});
    sc+=DK.txt(gs.out[0]+20,90,`pin ${pins[2]}`,{size:9})+DK.txt(150,22,`1/${t==='NOT'?6:4} ${part}`,{size:12,w:700});
    sc+=`<polyline points="${gs.out[0]+40},70 ${gs.out[0]+40},100"/>`+CC.svg.vSym('D',gs.out[0]+40,130,'LED')+`<polyline points="${gs.out[0]+40},160 ${gs.out[0]+40},170"/><line x1="${gs.out[0]+28}" y1="170" x2="${gs.out[0]+52}" y2="170"/>`;
    CC.$('#bbs',w).innerHTML=DK.svg(300,180,sc);
    CC.$('#bbi',w).innerHTML=`<button class="btn" id="ba">Input A: ${A}</button>${n>1?`<button class="btn" id="bbB">Input B: ${B}</button>`:''}<span class="pill ${out?'ok':''}">LED ${out?'ON':'OFF'}</span>`;
    CC.$('#ba',w).onclick=()=>{A=1-A;draw();};if(n>1)CC.$('#bbB',w).onclick=()=>{B=1-B;draw();};
    CC.$('#bbb',w).innerHTML=BB.map((b,i)=>`<button class="btn sm ${i===ic?'blue':''}" data-ic="${i}">${b[0]}</button>`).join('');
    CC.$$('[data-ic]',w).forEach(b=>b.onclick=()=>{ic=+b.dataset.ic;draw();});
  };
  draw();
  const fin=CC.el('<div class="row end mt"><a class="btn primary" href="#/">Main menu</a></div>');w.appendChild(fin);
}
const PINOUTS=()=>`<div class="pins">${['7400','7402','7404','7408','7432','7474','7476','7486','7490','7492'].map(p=>`<figure><img class="pinimg" src="${IMG[p]}" alt="${p} pinout diagram"><figcaption class="small"><b>${p}</b></figcaption></figure>`).join('')}</div>`;

const how=h=>`<h3>How this activity works</h3><div class="small intro-text">${h}</div>`;
const tabIntro=(tabs,howHTML)=>body=>{DK.tabs(body,tabs);if(howHTML)body.appendChild(CC.el(`<div>${how(howHTML)}</div>`));};
const ttab=(vars,e,note)=>{const tt=DK.truth(e,vars);return `<div class="tt-card"><div class="math-big">${M('X='+DK.sopTex(e))}</div><table class="tt"><tr>${vars.map(v=>`<th>${v}</th>`).join('')}<th>X</th></tr>${tt.map((x,r)=>`<tr>${vars.map((v,i)=>`<td>${(r>>(vars.length-1-i))&1}</td>`).join('')}<td><b>${x}</b></td></tr>`).join('')}</table>${note?`<p class="small muted">${note}</p>`:''}</div>`;};
const L=(v,neg)=>({v,neg:!!neg});
const xorFig=()=>{const tpl={inputs:{A:30,B:120},gates:[{t:'NOT',in:['A'],col:0,y:55,ask:false},{t:'NOT',in:['B'],col:0,y:95,ask:false},{t:'AND',in:['A',1],col:1,y:40,ask:false},{t:'AND',in:[0,'B'],col:1,y:110,ask:false},{t:'OR',in:[2,3],col:2,y:75,ask:false}]};
  const c=DK.circuit(tpl,{A:0,B:0},0);return c.svg.replace(/<text[^>]*class="lv[^>]*>.*?<\/text>/g,'').replace(/<tspan class="lv lv\d">\d<\/tspan>/g,'');};
const convTables=`<div class="row" style="align-items:flex-start;gap:16px;justify-content:center"><table class="tt"><tr><th>Binary</th><th>Octal</th></tr>${Array.from({length:8},(_,i)=>`<tr><td>${DK.bin(i,3)}</td><td>${i}</td></tr>`).join('')}</table><table class="tt"><tr><th>Binary</th><th>Hex</th></tr>${Array.from({length:16},(_,i)=>`<tr><td>${DK.bin(i,4)}</td><td>${i.toString(16).toUpperCase()}</td></tr>`).join('')}</table></div>`;
const colValueTable=(digits,base,names)=>{const n=digits.length;let tot=0;const rows=digits.split('').map((d,i)=>{const pw=Math.pow(base,n-1-i);const v=parseInt(d,base)*pw;tot+=v;return `<tr><td>${d}</td><td class="small">${names[n-1-i]}</td><td>${v}</td></tr>`;}).join('');return `<table class="tt"><tr><th>Digit</th><th>Column</th><th>Value</th></tr>${rows}<tr><td colspan="2"><b>Total</b></td><td><b>${tot}</b></td></tr></table>`;};

const MCHOW=n=>`<p><b>Scoring:</b> ${n} multiple-choice items, 5 points each, graded one at a time. Each item has exactly one correct answer. After you grade an item the correct answer is highlighted, usually with a short explanation. Items and answer order are shuffled on every run.</p>`;
CC.App.init({
  id:'digital',title:'Digital Challenge',tagline:'Interactive digital electronics · offline edition',
  blurb:'Practice logic gates, truth tables, Boolean simplification, number systems, binary arithmetic, logic ICs, flip-flops, counters and breadboarding. Values are chosen at random, so every run is different.',
  footer:'Based on Digital Challenge V5.0 © 2005 ETCAI Products. Offline HTML edition.',
  pass:80,hero:slot=>latchWidget(slot),
  manual:`<h2>About this program</h2>${TX.purpose}<h2>Using the program</h2>${TX.howto}`,
  groups:[
    {title:'Getting started',items:[
      {id:'intro',title:'Introduction',icon:'book',sub:'what the program does and how to use it',graded:false,
        intro:tabIntro([{title:'About this program',html:`<div class="intro-text">${TX.purpose}</div>`},{title:'Using the program',html:`<div class="intro-text">${TX.howto}</div>`}]),
        run:(el,s)=>{s.done=true;const c=CC.el(`<div><h2 style="margin-top:0">Latch experiment</h2><div id="lw"></div><div class="row end mt"><a class="btn primary" href="#/">Main menu</a></div></div>`);el.appendChild(c);latchWidget(CC.$('#lw',c));}},
    ]},
    {title:'Logic gates and Boolean algebra',items:[
      {id:'gates1',title:'Logic Gates One',icon:'gate',sub:'20 gate outputs',intro:CC.introPage({text:`<p>Logic gates are the building blocks of every computer and digital system. Each gate input and output is in one of two states: <b>low</b> (0, false) or <b>high</b> (1, true). A gate’s output state depends only on its present input states, and the truth table lists the output for every input combination.</p><p>The common gate symbols and their truth tables are shown below. Three-input AND, OR, NAND and NOR gates follow the same rules as the two-input versions.</p>`,
        extra:gateRef([['BUF',1,'Buffer'],['NOT',1,'Inverter'],['OR',2,'OR'],['AND',2,'AND'],['NOR',2,'NOR'],['NAND',2,'NAND'],['XOR',2,'Exclusive OR'],['XNOR',2,'Exclusive NOR']])+RULES,
        how:'<p>You get 20 gates with their inputs already set. Set each output to 0 or 1. <b>Scoring:</b> 5 points per correct output (20 outputs = 100 points). Unanswered outputs count as wrong. After grading, each wrong output shows the correct value.</p>'}),run:gatesOne},
      {id:'gates2',title:'Logic Gates Two',icon:'gate',sub:'4 circuits, 10 outputs',intro:CC.introPage({text:`<p>Real logic circuits connect gates together, so the output of one gate becomes an input of the next. Work through a circuit from left to right: find the output of each gate in the first column, carry those values forward, and repeat.</p><p>The exclusive-OR (XOR) gate is “one or the other, but not both”: its output is 1 when its two inputs are different. Exclusive-NOR (XNOR) is the opposite: 1 when the inputs are the same. An XOR gate can be built from two inverters, two AND gates and an OR gate, as the diagram shows: ${MCH('X=A\\overline{B}+\\overline{A}B')}.</p>`,
        extra:`<div class="cols2" style="align-items:center">${gateRef([['XOR',2,'Exclusive OR'],['XNOR',2,'Exclusive NOR']])}<div class="diagram">${xorFig()}</div></div>`,
        how:'<p>You get four small circuits with their inputs already set: ten gate outputs in all. Set each output to 0 or 1. <b>Scoring:</b> 10 points per correct output (100 points total). After grading, wrong outputs show the correct value and a worked solution traces each circuit gate by gate.</p>'}),run:gatesTwo},
      {id:'name1',title:'Name that Gate! One',icon:'chip',sub:'identify the IC — unlimited tests',intro:CC.introPage({text:`<p>Textbooks start with a gate symbol and ask for its truth table. Here you work the other way round, as you would when testing an unknown chip: change the inputs, watch the output, and work out which logic circuit is inside the IC.</p><p>Tap an input lamp to switch it between high and low. Red = high (1), green = low (0), yellow = an input that is not used by this circuit. A one-input circuit uses IN 1 only; a two-input circuit uses IN 1 and IN 2.</p><p>Don’t decide too early: several gate types give the same output for some input combinations. For example, with both inputs at 1, a 2-input AND, OR and XNOR all give an output of 1. Keep trying input combinations until only one choice is left.</p>`,
        extra:`<div class="diagram">${icBoard([1,0,1],3,0)}</div>`,how:'<p>Ten mystery circuits, one at a time. Test each one as many times as you like, select the circuit you think it is, then choose <b>Grade item</b>. <b>Scoring:</b> 10 points per correct identification, 0 for a wrong one (100 points total). Name that Gate! Two is the same activity, but every input change costs a point.</p>'}),run:(el,s)=>nameGate(el,s,false)},
      {id:'name2',title:'Name that Gate! Two',icon:'chip',sub:'identify the IC — each test costs a point',intro:CC.introPage({text:`<p>This is Name that Gate! One with a twist: every input change costs one point, so you need an efficient test plan. Before you tap, think about which input combination will rule out the most possibilities.</p><p>Some questions to plan with: Which single input combination separates AND from NAND? How few changes do you need to tell a 3-input AND from the other 3-input circuits? Which combinations make XOR and OR look different?</p><p>Red = high (1), green = low (0), yellow = an unused input. The starting input states are random, and you can always see the output for the starting inputs before you make any change.</p>`,
        extra:`<div class="diagram">${icBoard([0,1,0],2,1)}</div>`,how:'<p><b>Scoring:</b> each of the ten circuits starts at 14 points and loses 1 point for every input change you make. A correct identification earns the points that remain; a wrong one earns 0. Your score is the total points, capped at 100%; the absolute maximum of 140 would need ten lucky guesses with no testing at all.</p>'}),run:(el,s)=>nameGate(el,s,true)},
      {id:'truth',title:'Truth Tables',icon:'num',sub:'Boolean expression → truth table',intro:CC.introPage({text:`<p>A Boolean expression is a compact description of a logic circuit; a truth table shows what it does at a glance. To build the table from a sum-of-products (SOP) expression, take one term at a time: a product term is 1 only in the rows where every one of its variables has the required value (1 for a plain letter, 0 for a letter with a bar). Mark a 1 in each of those rows. When every term is done, fill all remaining rows with 0.</p><p>Two worked examples are shown below.</p>`,
        extra:`<div class="tt-wrap">${ttab(['A','B'],[[L('A',1)],[L('A'),L('B',1)]],`${MCH('\\overline{A}')} puts a 1 in every row where A = 0. ${MCH('A\\overline{B}')} puts a 1 where A = 1 and B = 0. The only row left is 11, which is 0.`)}${ttab(['A','B','C'],[[L('A'),L('C')],[L('B',1)],[L('A',1),L('B',1),L('C')]])}</div>`,
        how:'<p>You get three expressions and fill in their truth tables: 20 entries in all. <b>Scoring:</b> 5 points per correct entry (100 points total). After grading, wrong entries show the correct value and a worked solution lists the rows that each term makes 1.</p>'}),run:truthTables},
      {id:'simp',title:'Simplification',icon:'gate',sub:'10 Boolean reductions',intro:CC.introPage({text:`<p>A logic circuit is often more complicated than it needs to be: some terms are redundant and never change the output. A simpler but equivalent expression needs fewer gates, costs less and is faster. Boolean algebra and Karnaugh maps are the two most common simplification methods. Here is a Boolean algebra example:</p>`,
        extra:`<div class="formula">${M('X=ABC+AB\\overline{C}+\\overline{A}\\,\\overline{B}\\,\\overline{C}+\\overline{A}B\\overline{C}')}${M('X=AB(C+\\overline{C})+\\overline{A}\\,\\overline{C}(B+\\overline{B})')}${M('X=AB(1)+\\overline{A}\\,\\overline{C}(1)')}${M('X=AB+\\overline{A}\\,\\overline{C}')}</div><h3>Useful identities</h3><div class="formulas mt"><div class="formula">${M('A+\\overline{A}=1')}</div><div class="formula">${M('A\\cdot1=A')}</div><div class="formula">${M('A+A=A')}</div><div class="formula">${M('A+AB=A')}</div><div class="formula">${M('A+\\overline{A}B=A+B')}</div></div><p class="small muted">A sure-fire check: two expressions are equivalent only if they have exactly the same truth table. Simplest means the fewest product terms, then the fewest letters.</p>`,
        how:'<p>Ten expressions, one at a time. Choose the simplest expression that is equivalent to the one shown. Exactly one choice is equivalent; the others differ in at least one row of the truth table. <b>Scoring:</b> 10 points per correct choice (100 points total). After each item a worked solution shows the truth table rows and the grouping.</p>'}),run:(el,s)=>CC.problemSet(el,s,{count:10,gen:simpProblem})},
    ]},
    {title:'Number systems',items:[
      {id:'conv1',title:'Number Conversions One',icon:'num',sub:'binary ⇄ octal ⇄ hex',intro:CC.introPage({text:`<p>Digital circuits work only in binary, and binary numbers get long: 8, 16 or 32 digits are common. To make them easier to read, write and talk about, people write them in octal (base 8) or hexadecimal (base 16, “hex”). Because 8 = 2<sup>3</sup> and 16 = 2<sup>4</sup>, each octal digit stands for exactly three bits and each hex digit for exactly four bits.</p><p><b>Binary to octal:</b> starting at the right-hand (least significant) end, split the bits into groups of three, then replace each group with one octal digit. <b>Binary to hex:</b> the same, with groups of four. To go back, replace each octal or hex digit with its 3-bit or 4-bit group.</p><p><b>Common mistake:</b> grouping from the left. Always start at the right; only the leftmost group may be short, and you pad it with leading zeros.</p>`,
        extra:`<div class="row" style="justify-content:center;gap:24px;font-family:var(--mono);font-size:1.1rem"><div class="formula"><div>Octal 2307</div><div>↓ ↑</div><div>Binary 10 011 000 111</div></div><div class="formula"><div>Hex 3A8E</div><div>↓ ↑</div><div>Binary 11 1010 1000 1110</div></div></div><h3>Conversion tables</h3>${convTables}`,
        how:'<p>Ten conversions, one at a time. Type your answer and press Enter (or choose <b>Grade answers</b>), then <b>Next problem</b>. Leave out leading zeros; hex letters can be upper or lower case. <b>Scoring:</b> 10 points per exact answer (100 points total). A worked solution is shown after each problem.</p>'}),run:(el,s)=>CC.problemSet(el,s,{count:10,gen:conv1Problem})},
      {id:'conv2',title:'Number Conversions Two',icon:'num',sub:'binary ⇄ decimal ⇄ BCD',intro:CC.introPage({text:`<p>People calculate in decimal; digital circuits calculate in binary, so you need to move between the two.</p><p><b>Decimal to binary:</b> divide by 2 again and again and write down each remainder. The first remainder is the least significant bit (LSB), the last is the most significant bit (MSB). <b>Binary to decimal:</b> add up the column values (1, 2, 4, 8, …) of the columns that hold a 1.</p><p><b>BCD</b> (binary-coded decimal) is a code, not a binary number: each decimal digit is written separately as a 4-bit group (0000 to 1001). Leading zeros inside each group are part of the code. <b>Common mistake:</b> converting the whole decimal number to binary instead of one digit at a time — 25 in BCD is 0010 0101, not 11001.</p>`,
        extra:`<div class="row" style="align-items:flex-start;justify-content:center;gap:18px"><div class="formula"><b>Decimal to binary</b><table class="tt">${[[109,54,1],[54,27,0],[27,13,1],[13,6,1],[6,3,0],[3,1,1],[1,0,1]].map(([a,b,r],i)=>`<tr><td>${a} ÷ 2 = ${b}</td><td>remainder ${r}${i===0?' (LSB)':i===6?' (MSB)':''}</td></tr>`).join('')}</table><p class="center">${M('109_{10}=1101101_2')}</p></div>
          <div class="formula"><b>Binary to decimal</b>${colValueTable('1101101',2,['ones','twos','fours','eights','sixteens','thirty-twos','sixty-fours'])}</div>
          <div class="formula"><b>BCD ⇄ decimal</b><table class="tt"><tr><th>BCD</th><th>Dec</th></tr>${Array.from({length:10},(_,i)=>`<tr><td>${DK.bin(i,4)}</td><td>${i}</td></tr>`).join('')}</table><p class="small center">0011 1000 0101 BCD = 385 decimal</p></div></div>`,
        how:'<p>Ten conversions, one at a time. Type your answer and press Enter (or choose <b>Grade answers</b>), then <b>Next problem</b>. Leave out leading zeros, except in BCD codes, where every digit needs all four bits (spaces between groups are optional). <b>Scoring:</b> 10 points per exact answer (100 points total). A worked solution is shown after each problem.</p>'}),run:(el,s)=>CC.problemSet(el,s,{count:10,gen:conv2Problem})},
      {id:'bincount',title:'Binary Counting',icon:'num',sub:'complete three count columns',intro:CC.introPage({text:`<p>Binary uses only two digits, 0 and 1. The right-hand column is the ones column, and each column to the left is worth twice as much: 1, 2, 4, 8, 16, 32, 64 …</p><p>So 1011011 is 64 + 16 + 8 + 2 + 1 = 91, and 19 = 16 + 2 + 1 = 10011.</p><p><b>Counting rule:</b> add 1 to the right-hand bit. A 1 + 1 becomes 0 and carries 1 to the next column on the left, which can carry again. For example 1011 + 1 = 1100, and 1111 + 1 = 10000 (the count gains a digit).</p>`,
        extra:`<div class="row" style="align-items:flex-start;justify-content:center;gap:18px">${colValueTable('1011011',2,['One','Two','Four','Eight','Sixteen','Thirty-Two','Sixty-Four'])}<table class="tt"><tr><th>Dec</th><th>Binary</th><th>Dec</th><th>Binary</th></tr>${Array.from({length:16},(_,i)=>`<tr><td>${i}</td><td>${DK.bin(i)}</td><td>${i+16}</td><td>${DK.bin(i+16)}</td></tr>`).join('')}</table></div>`,
        how:'<p>Three columns, each with a starting number at the top. Count up by one in each of the ten boxes below it. Enter or the arrow keys move between boxes; leave out leading zeros. Choose <b>Start grading</b> when you are done. <b>Scoring:</b> 30 counts, each worth 1/30 of the score (about 3.3 points). Wrong boxes show the correct count.</p>'}),run:(el,s)=>counting(el,s,2)},
      {id:'octcount',title:'Octal Counting',icon:'num',sub:'complete three count columns',intro:CC.introPage({text:`<p>Octal (base 8) uses the eight digits 0 to 7. Column values multiply by eight as you move left: 1, 8, 64, 512 … The example below shows that 3742 octal is 2018 decimal.</p><p><b>Counting rule:</b> after 7 the digit goes back to 0 and you carry 1 into the next column: 7 → 10, 77 → 100, 1767 → 1770. The digits 8 and 9 never appear.</p><p>Octal is mainly used as a short way to write binary, because each octal digit is exactly three bits.</p>`,
        extra:`<div class="row" style="align-items:flex-start;justify-content:center;gap:18px">${colValueTable('3742',8,['ones','eights','sixty-fours','five-hundred-twelves'])}<table class="tt"><tr><th colspan="6">Octal numbers</th></tr>${Array.from({length:13},(_,r)=>`<tr>${[0,1,2,3,4,5].map(c=>`<td>${(r+c*13).toString(8)}</td>`).join('')}</tr>`).join('')}</table></div>`,
        how:'<p>Three columns, each with a starting number at the top. Count up by one in each of the ten boxes below it, leaving out leading zeros. Choose <b>Start grading</b> when you are done. <b>Scoring:</b> 30 counts, each worth 1/30 of the score. Wrong boxes show the correct count.</p>'}),run:(el,s)=>counting(el,s,8)},
      {id:'hexcount',title:'Hexadecimal Counting',icon:'num',sub:'complete three count columns',intro:CC.introPage({text:`<p>Hexadecimal (base 16, “hex”) needs sixteen digit symbols. After 0–9 it borrows the letters A, B, C, D, E and F for the values 10 to 15. Column values multiply by sixteen as you move left: 1, 16, 256, 4096 …</p><p><b>Counting rule:</b> after F the digit goes back to 0 and you carry 1 into the next column: 9 → A, F → 10, 1FF → 200, FFFF → 10000.</p><p>Hex is mainly used as a short way to write binary, because each hex digit is exactly four bits.</p>`,
        extra:`<div class="row" style="align-items:flex-start;justify-content:center;gap:18px">${colValueTable('2F9B',16,['ones','sixteens','two-hundred-fifty-sixes','four-thousand-ninety-sixes'])}<table class="tt"><tr><th colspan="4">Hexadecimal numbers</th></tr>${Array.from({length:16},(_,r)=>`<tr>${[0,0x10,0x20,0xEFF0].map(c=>`<td>${(r+c).toString(16).toUpperCase()}</td>`).join('')}</tr>`).join('')}</table></div>`,
        how:'<p>Three columns, each with a starting number at the top. Count up by one in each of the ten boxes below it, leaving out leading zeros; letters can be upper or lower case. Choose <b>Start grading</b> when you are done. <b>Scoring:</b> 30 counts, each worth 1/30 of the score. Wrong boxes show the correct count.</p>'}),run:(el,s)=>counting(el,s,16)},
      {id:'binadd',title:'Binary Addition',icon:'num',sub:'10 problems',intro:CC.introPage({text:`<p>Binary addition works just like decimal addition, column by column from the right, but there are only four facts to learn (decimal has a hundred). Whenever a column adds up to 2 or 3, write the low bit and carry 1 into the next column.</p>`,
        extra:`<div class="row" style="align-items:flex-start;justify-content:center;gap:22px"><div><table class="tt"><tr><th>Bit 1</th><th>Bit 2</th><th>Sum</th><th>Carry</th></tr><tr><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>1</td><td>0</td></tr><tr><td>1</td><td>0</td><td>1</td><td>0</td></tr><tr><td>1</td><td>1</td><td>0</td><td>1</td></tr></table><p class="small center">With a carry in: 1 + 1 + 1 = 1, carry 1</p></div>
          <div class="sum-table"><div class="small muted">carries 1000</div><div>&nbsp;&nbsp;1010</div><div>+&nbsp;1100</div><div class="rule">10110</div></div><div class="sum-table"><div class="small muted">carries 1000111</div><div>&nbsp;&nbsp;1010111</div><div>+&nbsp;1100011</div><div class="rule">10111010</div></div></div><p class="small muted center">Check your answer by converting to decimal: 10 + 12 = 22 = 10110₂, and 87 + 99 = 186 = 10111010₂.</p>`,
        how:'<p>Ten problems, one at a time, from easy to harder. Type the sum without leading zeros and press Enter (or choose <b>Grade answers</b>), then <b>Next problem</b>. <b>Scoring:</b> 10 points per exact answer (100 points total). The correct answer and a worked solution are shown after each problem.</p>'}),run:(el,s)=>CC.problemSet(el,s,{count:10,gen:addProblem})},
      {id:'binsub',title:'Binary Subtraction',icon:'num',sub:'10 problems',intro:CC.introPage({text:`<p>You can subtract binary numbers by borrowing, just as in decimal. Digital machines usually use a complement method instead, because it turns subtraction into addition. Both complement methods give the same result as borrowing.</p><p><b>Before you start either method</b>, pad the subtrahend (the number being subtracted) with leading zeros so it has as many bits as the minuend. <b>Common mistake:</b> forgetting this step, which complements too few bits and gives a wrong answer.</p><p><b>One’s complement:</b> invert every bit of the subtrahend and add it to the minuend. Remove the carry from the leftmost column and add it to the right-hand bit (end-around carry). <b>Two’s complement:</b> invert every bit of the subtrahend and add 1, add the result to the minuend, and discard the carry out of the leftmost column. The example below works out 10100 − 1001 (20 − 9 = 11) both ways.</p>`,
        extra:`<div class="cols2"><div class="formula"><b>One’s complement subtraction</b><div class="row" style="gap:16px;align-items:flex-start"><div class="sum-table"><div>&nbsp;&nbsp;10100</div><div>−&nbsp;&nbsp;1001</div><div class="small muted">pad to 5 bits</div><div>−&nbsp;01001</div></div><div class="sum-table"><div>&nbsp;&nbsp;10100</div><div>+&nbsp;10110</div><div class="rule">&nbsp;101010</div><div>+&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;1</div><div class="rule">&nbsp;&nbsp;&nbsp;1011</div></div></div><p class="small">10110 is 01001 with every bit inverted. The carry out of the left column (the leading 1 of 101010) is moved around and added to the right-hand bit: 01010 + 1 = 01011.</p></div>
          <div class="formula"><b>Two’s complement subtraction</b><div class="row" style="gap:16px;align-items:flex-start"><div class="sum-table"><div class="small muted">(1) two’s complement</div><div>01001 padded</div><div>10110 one’s</div><div>+&nbsp;&nbsp;&nbsp;1 add one</div><div class="rule">10111 two’s</div></div><div class="sum-table"><div class="small muted">(2) add to minuend</div><div>&nbsp;&nbsp;10100</div><div>+&nbsp;10111</div><div class="rule">101011</div><div class="small muted">discard the carry</div><div>&nbsp;&nbsp;&nbsp;1011</div></div></div></div></div>`,
        how:'<p>Ten problems, one at a time. The answer is never negative. Type the difference without leading zeros and press Enter (or choose <b>Grade answers</b>), then <b>Next problem</b>. <b>Scoring:</b> 10 points per exact answer (100 points total). The correct answer and a worked two’s-complement solution are shown after each problem.</p>'}),run:(el,s)=>CC.problemSet(el,s,{count:10,gen:subProblem})},
    ]},
    {title:'Integrated circuits and flip-flops',items:[
      {id:'ics',title:'Digital Integrated Circuits',icon:'chip',sub:'20 multiple-choice items',intro:tabIntro([
        {title:'Integrated Circuits',html:`<div class="cols2"><div class="intro-text">${P(`Logic circuits are built as integrated circuits (ICs) on silicon chips sealed in plastic or ceramic packages. Figure 1 shows a 14-pin dual-in-line package (DIP). Its pins plug into a socket or breadboard or are soldered into a circuit board. DIPs come with up to 40 pins or more, and many other package styles are made for surface mounting.\n\nThe marking DM7408N carries three pieces of information. “DM” is the maker’s prefix (National Semiconductor). “7408” is the type: a quad (four-gate) 2-input AND gate in the standard TTL family. The “N” suffix is the package: plastic DIP. Hundreds of different logic functions are available.\n\nFigure 2 shows the pin connections, viewed from the top. The four AND gates are identical. Ground (pin 7) and +Vcc (pin 14) are on opposite corners, so a chip plugged in backwards gets a reversed supply and is usually destroyed. Standard TTL needs a +5 V supply.\n\nPin 1 is marked by a notch at one end of the package, a small dot or dimple next to pin 1, or a colored band. The chip in Figure 1 has all three. Viewed from the top with the notch on the left, pin 1 is at the lower left and the pin numbers run counterclockwise.`)}</div><div><figure class="center"><img src="${IMG.icchip}" alt="14-pin DIP integrated circuit" style="max-width:260px;width:100%"><figcaption class="small">Figure 1</figcaption></figure><figure class="center"><img class="pinimg" src="${IMG['7408']}" alt="7408 pinout"><figcaption class="small">Figure 2 — 7408, top view</figcaption></figure></div></div>`},
        {title:'Logic Families',html:`<div class="intro-text">${P(`This activity sticks to the 74-series logic families. Part numbers start with 74 (commercial temperature range, 0 °C to 70 °C), followed by letters that name the family and two or more digits that name the function. Military-temperature versions start with 54 instead and have the same pin connections.\n\nStandard bipolar TTL (no letters, for example 7408):`)}<ul><li>Supply: Vcc = +5 V (4.75 V to 5.25 V)</li><li>An input reads as <b>low (0)</b> from 0 V to +0.8 V and as <b>high (1)</b> from +2.0 V to +5 V. An open (floating) TTL input acts as a high.</li><li>A TTL output is at most 0.4 V when low and at least 2.4 V when high, which leaves a 0.4 V noise margin.</li><li>Voltages between 0.8 V and 2.0 V are not guaranteed to be read as either state.</li></ul>${P(`Notice that each logic state is a range of voltages. That is what lets noisy circuits still produce exact digital results. Even though an open TTL input acts as a high, good practice is to tie unused inputs high through a resistor.\n\nCMOS logic families have different ratings:`)}<ul><li><b>74C</b> (and the 4000 series): Vcc = +3 V to +15 V</li><li><b>74HC</b>: Vcc = +2 V to +6 V</li><li><b>74HCT</b>: Vcc = +4.5 V to +5.5 V, with TTL-compatible input levels</li><li>CMOS outputs swing almost all the way to the supply rails: a high is close to +Vcc and a low is close to 0 V.</li></ul>${P(`For example, a 74C08 or 74HC08 is a CMOS IC with four 2-input AND gates and the same pinout as the 7408. Floating CMOS inputs have no defined state, so every unused CMOS input must be tied to Vcc or ground. Static electricity can destroy CMOS ICs, which is why a grounded wrist strap is worn when handling them. 74HCT parts can be mixed freely with TTL on the same board. A 74HC part run from 5 V can drive TTL inputs, but a TTL high output (guaranteed only down to 2.4 V) may not read as high at a 74HC input, which needs about 3.5 V; use a 74HCT part or a pull-up resistor there.`)}</div>`},
        {title:'Integrated Circuit Terms',html:`<div class="intro-text"><p><b>TTL</b> — Transistor-Transistor Logic. ICs built from bipolar transistors. TTL is fast, uses relatively more power than CMOS and is not very sensitive to static. The letters after 74 name the family variation:</p><ul><li>74L — low-power TTL</li><li>74H — high-speed TTL</li><li>74S — Schottky TTL (high speed)</li><li>74LS — low-power Schottky TTL</li><li>74AS — advanced Schottky TTL (higher speed)</li></ul><p><b>CMOS</b> — Complementary Metal-Oxide Semiconductor. ICs built from matched p-channel and n-channel MOSFETs. CMOS uses very little power and allows very high circuit density, but static charges can destroy it.</p><ul><li>74C — metal-gate CMOS</li><li>74HC — high-speed CMOS</li><li>74HCT — high-speed CMOS with TTL-compatible input levels</li></ul><p><b>Vcc</b> — the positive supply pin of a logic IC.</p><p><b>Fan-out</b> — the number of gate inputs one gate output can drive reliably. A standard TTL output can drive 10 standard TTL inputs (16 mA ÷ 1.6 mA). CMOS inputs draw almost no current, so a CMOS output can drive 50 or more CMOS inputs; the limit is the added capacitance, which slows switching.</p><p><b>Propagation delay</b> — the time a gate output takes to change after an input changes. Typical values at 5 V: about 10 ns for standard TTL (7400), about 50 ns for metal-gate CMOS (74C00), and about 10 ns for 74HC.</p><p><b>IC complexity</b> — ICs range from a few gates to billions of transistors. Books draw the boundaries a little differently; this activity uses:</p><ul><li>SSI — small-scale integration: fewer than 12 gates per IC</li><li>MSI — medium-scale integration: 12 to 99 gates</li><li>LSI — large-scale integration: 100 to 9,999 gates</li><li>VLSI — very-large-scale integration: 10,000 to 99,999 gates</li><li>ULSI — ultra-large-scale integration: 100,000 or more gates</li></ul></div>`},
        {title:'Pinout Diagrams',html:`<div class="intro-text small"><p>These are top views of the dual-in-line packages. The same pinouts apply to the 74, 74LS, 74S, 74C, 74HC and 74HCT versions and to the 54-series equivalents. Surface-mount and flat packages can differ.</p><p><b>Caution:</b> Vcc and ground are <i>not</i> on opposite corners of the 7476 (Vcc = pin 5, ground = pin 13), the 7490 or the 7492 (Vcc = pin 5, ground = pin 10).</p><p><b>7490 — decade counter.</b> QD is the most significant bit and QA the least significant bit. For decade counting, apply the count pulses to input A (pin 14) and connect QA (pin 12) to input B (pin 1); the jumper is shown in blue. R0(1) and R0(2) both high reset the counter to 0000 (as long as at least one R9 input is low). R9(1) and R9(2) both high set it to 1001. With at least one R0 input and at least one R9 input low, the counter advances on each negative-going (high-to-low) edge of input A.</p><p><b>7492 — divide-by-12 counter.</b> It contains a divide-by-2 stage (input A, output QA) and a divide-by-6 stage (input B, outputs QB to QD). With QA (pin 12) jumpered to input B (pin 1), the outputs go through twelve states and QD is a divide-by-12 output. R0(1) and R0(2) both high reset it to 0000. With at least one R0 input low, it advances on each negative-going edge of input A. (The 4-bit binary counter in this family is the 7493.)</p></div>${PINOUTS()}`},
      ],MCHOW(20)),run:(el,s)=>CC.problemSet(el,s,{list:mcSet(IC_POOL),gradeLabel:'Grade answer'})},
      {id:'dff',title:'Type D Flip-Flops',icon:'ff',sub:'20 multiple-choice items',intro:tabIntro([
        {title:'D Flip-Flop',html:p=>ffInteractive(p,{type:'D',srLow:true,negEdge:false},P(`This D flip-flop works like one half of a 7474 or 74C74. It has two kinds of inputs.\n\n<b>S (set) and R (reset)</b> act immediately, without the clock. The small circles show they are <b>active low</b>: they do their job when they are low. (A bar over the letter, as in the table, means the same thing.) S low with R high sets Q to 1; R low with S high resets Q to 0. Making both S and R low is <b>invalid</b>: on the 7474 both outputs go high, which is not a proper stored state, so avoid it.\n\n<b>D (data) and Cp (clock)</b> can change Q only while S and R are both high (inactive). The clock input responds to an edge, not a level. No circle on Cp means <b>positive-edge</b> (leading-edge) triggering: at the moment Cp goes from low to high, Q takes the value of D. At any other time, changing D does nothing.\n\nTap the colored circles to change S, R, D and Cp and watch the outputs. The current row of the truth table is highlighted.`),dTable({type:'D',srLow:true,negEdge:false}))},
        {title:'D Flip-Flop Variations',html:p=>ffInteractive(p,{type:'D',srLow:false,negEdge:true},P(`D flip-flops come in several variations. This one has <b>active-high</b> S and R inputs (no circles): S high with R low sets Q to 1, R high with S low resets Q to 0, and both low hands control to D and the clock. Both high is invalid: avoid it. This simulation shows both outputs high, but the actual result depends on the internal design.\n\nThe small circle on its Cp input means <b>negative-edge</b> (trailing-edge) triggering. A low-to-high clock change does nothing; on a high-to-low change, Q takes the value of D, provided S and R are both low.\n\nSo when you read a flip-flop symbol, check two things: (1) circles on S and R mean active low, no circles mean active high; (2) a circle on the clock means negative-edge triggering, no circle means positive-edge triggering.`),dTable({type:'D',srLow:false,negEdge:true}))},
        {title:'D Flip-Flop Applications',html:p=>{p.innerHTML=`<div class="cols2"><div class="intro-text">${P(`D flip-flops are often used to build registers, which are circuits that store binary numbers. Each flip-flop stores one bit.\n\n<b>Serial (shift) register — Figure 1.</b> The flip-flops are chained: each Q output drives the next D input, and all the clock inputs are connected together. Bits enter one at a time at the left-hand flip-flop. On each positive clock edge every bit moves one place to the right, the new input bit enters at the left and the right-hand bit is shifted out. Starting from 1 0 1 0 with a 0 at the input, one clock gives 0 1 0 1. Add flip-flops to make the register longer.\n\n<b>Parallel register — Figure 2.</b> Each flip-flop has its own D input and Q output, and all the clock inputs are connected together. All the stored bits are available at the outputs at the same time. If the register holds 0 1 0 0 and 1 0 0 1 is at the inputs, one positive clock edge loads 1 0 0 1.\n\nIn both registers all the S inputs are tied together, and so are all the R inputs. That gives a common S and a common R line, so every flip-flop can be set to 1 or reset to 0 at the same time.`)}</div><div id="regd"></div></div>`;registerDemo(p);}},
      ],MCHOW(20)+'<p>Some items show a flip-flop symbol with its input states. Check the S and R inputs first, then whether the clock makes its active edge, and only then the D input.</p>'),run:(el,s)=>CC.problemSet(el,s,{list:mcSet(DFF_POOL),gradeLabel:'Grade answer'})},
      {id:'jkff',title:'Type JK Flip-Flops',icon:'ff',sub:'20 multiple-choice items',intro:tabIntro([
        {title:'JK Flip-Flop',html:p=>ffInteractive(p,{type:'JK',srLow:true,negEdge:true},`${P(`This JK flip-flop works like one half of a 7476 or 74C76. Its S and R inputs are <b>active low</b> (small circles) and act immediately: S low sets Q to 1, R low resets Q to 0, and both low is an invalid state in which both outputs go high.\n\nJ, K and the clock can change Q only while S and R are both high. The circle on Cp means the outputs change on the <b>negative-going</b> (high-to-low, trailing) clock edge. J and K do nothing by themselves; they decide what happens at that clock edge:`)}<ul><li>J = 0, K = 0: no change</li><li>J = 0, K = 1: Q becomes 0 (reset)</li><li>J = 1, K = 0: Q becomes 1 (set)</li><li>J = 1, K = 1: Q <b>toggles</b> (changes to the opposite state)</li></ul>${P(`Q̄ (“not Q”) is always the opposite of Q, except during the invalid S-and-R state. (The original 7476 is a master-slave type: keep J and K steady while the clock is high. The output still changes on the falling edge.)\n\nTap the colored circles to change the inputs and watch the outputs.`)}`,dTable({type:'JK',srLow:true,negEdge:true}))},
        {title:'JK Flip-Flop Variations',html:p=>ffInteractive(p,{type:'JK',srLow:false,negEdge:false},P(`This JK flip-flop has <b>active-high</b> S and R inputs (no circles): S high with R low sets Q to 1, R high with S low resets Q to 0, and both low hands control to J, K and the clock. Both high is invalid: avoid it. This simulation shows both outputs high, but the actual result depends on the design.\n\nWith no circle on Cp, this flip-flop is <b>positive-edge</b> triggered. A high-to-low clock change does nothing; on a low-to-high change, J and K decide the new state, provided S and R are both low.\n\nAs with D flip-flops, JK flip-flops can have active-high or active-low S and R inputs, and positive-edge or negative-edge clocks. Read the circles on the symbol.`),dTable({type:'JK',srLow:false,negEdge:false}))},
        {title:'Binary Ripple Counters',html:p=>{p.innerHTML=`<div class="cols2"><div class="intro-text">${P(`A JK flip-flop can be wired to act as other flip-flop types. Hold J, K, S and R high (connect them to +Vcc) and it becomes a <b>T (toggle) flip-flop</b>: the Cp input becomes the T input, and Q changes state on every high-to-low transition of T. To toggle on the rising edge instead, put an inverter in front of T.\n\nFour T flip-flops make a <b>binary ripple counter</b>. The input pulses go to the T input of flip-flop D; QD drives TC, QC drives TB and QB drives TA. Flip-flop D toggles on the falling edge of each input pulse, flip-flop C toggles each time QD goes from 1 to 0, and so on down the chain. The Q outputs (A = MSB, D = LSB) count in binary. Each flip-flop also divides the frequency by 2.\n\nThe <b>modulus</b> of a counter is the number of different states it goes through, counting zero. A binary ripple counter with N flip-flops has a modulus of 2<sup>N</sup>: four flip-flops give 2<sup>4</sup> = 16 states (0000 to 1111) and six give 64.\n\nTwo 7476 or 74C76 ICs (two JK flip-flops each) are enough to build this counter. Tie the R inputs together to make a counter reset line: hold it high while counting, and pulse it low to reset all four flip-flops to 0.`)}</div><div><div class="diagram">${TFF_FIG()}</div><p class="small"><b>Use the buttons to step the counter through its 16 states.</b></p><div id="cnt"></div></div></div>`;counterDemo(p,16);}},
        {title:'Decade Counters',html:p=>{p.innerHTML=`<div class="cols2"><div class="intro-text">${P(`Hold J, K and S high and use R as an active-low reset, and a JK flip-flop becomes a trailing-edge T flip-flop that can be cleared.\n\nAdd a 2-input NAND gate to the 4-bit ripple counter, with its inputs connected to QA and QC and its output connected to all the R inputs. The counter counts normally from 0000 to 1001 (nine). The tenth pulse tries to make 1010, the first count with QA and QC both 1. The NAND output immediately goes low and resets every flip-flop, so the 1010 state lasts only a few nanoseconds. The count after 1001 is therefore 0000: a <b>decade</b> (modulus-10) counter.\n\nThis counter needs two 7476 or 74C76 ICs and one NAND gate. Decade counters are also available as single ICs, such as the 7490 and 74C90, which contain the flip-flops and the reset logic in one package.`)}</div><div><p class="small"><b>Step the decade counter through its ten states.</b></p><div id="cnt"></div></div></div>`;counterDemo(p,10);}},
      ],MCHOW(20)+'<p>Some items show a flip-flop symbol with its input states. Check the S and R inputs first, then whether the clock makes its active edge, and only then J and K.</p>'),run:(el,s)=>CC.problemSet(el,s,{list:mcSet(JKFF_POOL),gradeLabel:'Grade answer'})},
      {id:'bread',title:'Breadboarding Circuits',icon:'bread',sub:'virtual breadboard experiment',graded:false,intro:tabIntro([
        {title:'Breadboarding',html:`<div class="cols2"><div class="intro-text">${P(`This is a virtual breadboard. You can try six different gate ICs: the 74HC00 (NAND), 74HC02 (NOR), 74HC04 (inverter), 74HC08 (AND), 74HC32 (OR) and 74HC86 (XOR). It starts with a 74HC08 quad 2-input AND gate; tap a button to swap in another IC.\n\nThe circuit runs from a regulated +5 V supply, with + on pin 14 and ground on pin 7. 74HC chips are rated for 2 V to 6 V, so do <b>not</b> run them from a 9 V battery (the photo shows a 9 V battery, which is too much for 74HC parts). For a 9 V battery, use 74C or 4000-series CMOS instead, which work from 3 V to 15 V.\n\nTwo 10 kΩ pull-up resistors connect the gate inputs to +5 V, so an input is high when nothing else is connected. A purple jumper from an input to ground makes that input low; removing the jumper makes it high again. Never leave a CMOS input floating.\n\nThe output drives an LED through a 1 kΩ series resistor, which limits the current to about 3 mA: (5 V − 2 V) ÷ 1 kΩ. The LED is on when the output is high and off when it is low.\n\nTap the input buttons beside the schematic to switch each input. The jumpers are added or removed for you, and the schematic shows the 1 or 0 on each pin.\n\nIf you have the parts, build the real circuit too. Flip-flops, registers and counters can be breadboarded the same way; the Pinout Diagrams tab shows the connections, and more LEDs can be added to watch other outputs.`)}</div><div><figure class="center" style="margin:0"><img src="${IMG.breadbd1}" alt="Breadboard with a 74HC08, pull-up resistors, LED and a 9 V battery" style="width:100%;border-radius:10px"><figcaption class="small muted">A real breadboard with a 74HC08. Use a 5 V supply rather than the 9 V battery shown.</figcaption></figure></div></div>`},
        {title:'Pinout Diagrams',html:PINOUTS()},
      ]),run:(el,s)=>{s.done=true;breadboard(el,s);}},
    ]},
  ]
});
})();
</script>
