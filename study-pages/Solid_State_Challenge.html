function fixSpk(g){return g;}


/* ---------- TeX number helpers for worked solutions ---------- */
const tn=(x,n=4)=>fmt(x,n).replace(/,/g,'');
const tV=x=>tn(x)+'\\,\\text{V}';
const tmA=x=>tn(x*1e3)+'\\,\\text{mA}';            // x in amperes
const tuA=x=>tn(x*1e6)+'\\,\\mu\\text{A}';         // x in amperes
const tA=x=>tn(x)+'\\,\\text{A}';
const tO=r=>tn(r)+'\\,\\Omega';
const tR=r=>r>=1e6?tn(r/1e6)+'\\,\\text{M}\\Omega':r>=1000?tn(r/1000)+'\\,\\text{k}\\Omega':tn(r)+'\\,\\Omega';
const tW=p=>tn(p)+'\\,\\text{W}';
const gv=(id,tex,v)=>({id,k:m(tex),v});
const RE_TEX='{r\'}_e=\\frac{25\\,\\text{mV}}{I_E}';

/* ---------- shared help text ---------- */
const SCORE_WS=`<p><b>Scoring.</b> Type each answer in the units shown next to its box. An answer is graded correct when it is within <b>5%</b> of the expected value; an answer that should be 0 must be typed as exactly 0. Each item is worth 10 points (8 when there are twelve items, plus 4 free). A <b>✓ Check</b> that turns out wrong takes 2 points off that item, and every time you open <b>?</b> help it takes 3 points off that item; an item never drops below 0. A right check locks the item. <b>Grade</b> marks everything: right items keep the points they have left and wrong items score 0. The status bar shows the maximum score you can still reach. After grading, every item has a <b>worked solution</b>.</p><p>Carry at least three or four significant figures from step to step: later answers are built on earlier ones, so early rounding can push a later answer outside the 5% window. Each run uses new component values.</p>`;
const APPROX_CE=`<p><b>Approximations used in this exercise</b> (the answer key uses exactly these):</p><ul><li>Silicon transistor: ${m('V_{BE}=0.7\\,\\text{V}')}.</li><li>The base current is ignored, so ${m('V_B')} is the unloaded divider voltage. With a stiff divider that is very close to the truth; the answer key uses it even when the divider is not stiff, so do the same.</li><li>${m('I_C\\approx I_E')}.</li><li>AC emitter resistance ${m('{r\'}_e=\\frac{25\\,\\text{mV}}{I_E}')}.</li><li>Capacitors are short circuits for the signal; there is no load on the output and the signal source has zero resistance.</li></ul>`;
const NOTE_DIV=`Method: unloaded divider (base current ignored), ${m('V_{BE}=0.7\\,\\text{V}')}, ${m('I_C\\approx I_E')}, ${m('{r\'}_e=25\\,\\text{mV}/I_E')}. All voltages are measured from ground.`;

/* ---------- CE / CC / CB worksheets ---------- */
const BETAS=()=>pick([50,60,75,80,90,100,110,120,125,150,175,180,200,220,250]);
function baseBias(){ // original ranges: VCC 9 or 15 V, R1 300-390 kΩ, RC 820-1500 Ω, beta with one decimal
  let VCC,beta,RC,R1,IB,IC,VC;
  do{VCC=pick([9,15]);beta=Math.round(rnd(110,200)*10)/10;RC=pick([820,1000,1200,1500]);R1=pick([300e3,330e3,360e3,390e3]);
    IB=(VCC-0.7)/R1;IC=beta*IB;VC=VCC-IC*RC;}while(VC<1);
  const VR1=VCC-0.7,VRC=IC*RC,IE=IB+IC,re=0.025/IE,A=RC/re,Zb=beta*re,Zin=1/(1/R1+1/Zb);
  return {title:'Base bias common emitter amplifier',diagram:schCE('bb'),
    note:`Method: ${m('V_{BE}=0.7\\,\\text{V}')}, ${m('I_C=\\beta I_B')}, ${m('{r\'}_e=25\\,\\text{mV}/I_E')}. All voltages are measured from ground.`,
    givens:[gv('VCC','V_{CC}',VCC+' V'),gv('R1','R_1',fR(R1)),gv('RC','R_C',fR(RC)),gv('beta','\\beta',beta)],tol:0.05,
    items:[it('V_E','Emitter voltage','V',0,['The emitter is wired straight to ground, so it is the 0 V reference. Type 0.'],{work:['>The emitter is connected directly to ground.','V_E=0\\,\\text{V}']}),
      it('V_B','Base voltage','V',0.7,['A conducting silicon base-emitter junction drops about 0.7 V, and the emitter is at 0 V.','$V_B=V_E+V_{BE}'],{work:['V_B=V_E+V_{BE}=0\\,\\text{V}+0.7\\,\\text{V}=0.7\\,\\text{V}']}),
      it('V_C','Collector voltage','V',VC,['Find the base current from Ohm\'s law on R1, multiply by beta to get the collector current, then subtract the drop across RC from VCC.','$I_B=\\frac{V_{CC}-0.7\\,\\text{V}}{R_1}','$I_C=\\beta I_B','$V_C=V_{CC}-I_C R_C'],{work:[`I_B=\\frac{V_{CC}-0.7\\,\\text{V}}{R_1}=\\frac{${tV(VR1)}}{${tR(R1)}}=${tuA(IB)}`,`I_C=\\beta I_B=(${beta})(${tuA(IB)})=${tmA(IC)}`,`V_C=V_{CC}-I_C R_C=${tV(VCC)}-(${tmA(IC)})(${tR(RC)})=${tV(VC)}`]}),
      it('V_{R1}','Voltage across R1','V',VR1,['R1 runs from VCC down to the base. Its voltage is whatever is left of VCC after the base voltage (Kirchhoff\'s voltage law).','$V_{R1}=V_{CC}-V_B'],{work:[`V_{R1}=V_{CC}-V_B=${tV(VCC)}-0.7\\,\\text{V}=${tV(VR1)}`]}),
      it('V_{RC}','Voltage across RC','V',VRC,['The collector current flows through RC. Use Ohm\'s law, or subtract the collector voltage from VCC.','$V_{RC}=I_C R_C=V_{CC}-V_C','Common mistake: mixing mA and kΩ with A and Ω. mA × kΩ gives volts directly.'],{work:[`V_{RC}=I_C R_C=(${tmA(IC)})(${tR(RC)})=${tV(VRC)}`]}),
      it('I_E','Emitter current','mA',IE*1e3,['Both the base current and the collector current leave through the emitter (Kirchhoff\'s current law).','$I_E=I_B+I_C','Answer in milliamperes. Convert I<sub>B</sub> to mA before adding.'],{work:[`I_E=I_B+I_C=${tn(IB*1e3)}\\,\\text{mA}+${tmA(IC)}=${tmA(IE)}`]}),
      it('I_B','Base current','µA',IB*1e6,['All of the R1 current flows into the base, so find it with Ohm\'s law on R1.','$I_B=\\frac{V_{R1}}{R_1}','Answer in microamperes: multiply amperes by 1,000,000. Common mistake: forgetting that R1 is in kilohms.'],{work:[`I_B=\\frac{V_{R1}}{R_1}=\\frac{${tV(VR1)}}{${tR(R1)}}=${tuA(IB)}`]}),
      it('I_C','Collector current','mA',IC*1e3,['Collector current is beta times base current (the definition of beta).','$I_C=\\beta I_B','Answer in milliamperes.'],{work:[`I_C=\\beta I_B=(${beta})(${tuA(IB)})=${tmA(IC)}`]}),
      it('A','Voltage gain','',A,['First find the AC emitter resistance from the emitter current, then divide RC by it. The emitter is grounded, so r\'<sub>e</sub> is the only emitter resistance.','$'+RE_TEX,'$A=\\frac{R_C}{{r\'}_e}','Tip: 25 divided by I<sub>E</sub> in mA gives r\'<sub>e</sub> in ohms.'],{work:[`{r'}_e=\\frac{25\\,\\text{mV}}{${tmA(IE)}}=${tO(re)}`,`A=\\frac{R_C}{{r'}_e}=\\frac{${tR(RC)}}{${tO(re)}}=${tn(A)}`]}),
      it('Z_{in}','Input impedance','Ω',Zin,['The signal sees R1 (to VCC, which is AC ground) in parallel with the resistance looking into the base, which is beta times r\'<sub>e</sub>.','$Z_{in}=R_1\\parallel\\beta {r\'}_e=\\frac{1}{\\frac{1}{R_1}+\\frac{1}{\\beta {r\'}_e}}','Answer in ohms (not kilohms).'],{work:[`\\beta {r'}_e=(${beta})(${tO(re)})=${tO(Zb)}`,`Z_{in}=\\frac{1}{\\frac{1}{${tR(R1)}}+\\frac{1}{${tO(Zb)}}}=${tO(Zin)}`,'>R1 is so large that Z<sub>in</sub> is set almost entirely by the base.'] })]};
}
/* voltage divider bias: the answer key uses the unloaded divider voltage for VB (base current ignored), as the original does even when the divider is not stiff */
function divCalc(kind,VCC,R1,R2,RC,RE,beta,thev){
  let VB=VCC*R2/(R1+R2);let IE;
  if(thev){const RTH=R1*R2/(R1+R2);IE=(VB-0.7)/(RE+RTH/(beta+1));VB=IE*RE+0.7;} // loaded divider (Thevenin)
  else IE=(VB-0.7)/RE;
  const VE=IE*RE,VR1=VCC-VB,VRC=kind==='cc'?0:IE*RC,VC=VCC-VRC,VCE=VC-VE,re=0.025/IE;
  const A={div:RC/(re+RE),byp:RC/re,cc:RE/(re+RE),cb:RC/re}[kind];
  const Zin={div:1/(1/R1+1/R2+1/(beta*(re+RE))),byp:1/(1/R1+1/R2+1/(beta*re)),cc:1/(1/R1+1/R2+1/(beta*(re+RE))),cb:1/(1/re+1/RE)}[kind];
  return {VB,VE,IE,VR1,VRC,VC,VCE,re,A,Zin,Zout:1/(1/RE+1/re)};
}
function divider(kind){ // 'div','byp','cc','cb'
  let VCC,beta,RC=0,RE,R1,R2,S,ok=false;
  for(let n=0;n<4000&&!ok;n++){
    VCC=ri(10,20);beta=pick([100,120,125,150,175,180,200,220,250]);
    RE=eVal(470,2700);R2=eVal(4700,47000);R1=eVal(33e3,220e3);RC=kind==='cc'?0:eVal(1000,10000);
    S=divCalc(kind,VCC,R1,R2,RC,RE,beta,false);
    ok=S.VE>0.5&&S.VCE>1.5&&(kind==='cc'||S.VC<VCC-0.8&&RC>=1.5*RE)&&S.IE<0.02;
  }
  const {VB,VE,IE,VR1,VRC,VC,VCE,re,A,Zin}=S;
  const cc=kind==='cc',cb=kind==='cb',kOhm=!cb; // the original asks Zin in kΩ here, in Ω for common base
  const title={div:'Voltage divider biased amplifier without bypass',byp:'Voltage divider biased amplifier with bypass',cc:'Voltage divider biased common collector amplifier',cb:'Voltage divider biased common base amplifier'}[kind];
  const givens=[gv('VCC','V_{CC}',VCC+' V'),gv('R1','R_1',fR(R1)),gv('R2','R_2',fR(R2)),...(RC?[gv('RC','R_C',fR(RC))]:[]),gv('RE','R_E',fR(RE)),gv('beta','\\beta',beta)];
  const wre=`{r'}_e=\\frac{25\\,\\text{mV}}{I_E}=\\frac{25\\,\\text{mV}}{${tmA(IE)}}=${tO(re)}`;
  const tZ=z=>kOhm?tn(z/1000)+'\\,\\text{k}\\Omega':tO(z);
  const items=[
    it('V_{R1}','Voltage across R1','V',VR1,['R1 and R2 form a voltage divider across VCC. Ignore the base current (the answer key always does) and use the divider rule with R1 on top.','$V_{R1}=V_{CC}\\frac{R_1}{R_1+R_2}','Common mistake: putting R2 on top gives V<sub>R2</sub>, not V<sub>R1</sub>.'],{work:[`V_{R1}=V_{CC}\\frac{R_1}{R_1+R_2}=${tV(VCC)}\\left(\\frac{${tR(R1)}}{${tR(R1)}+${tR(R2)}}\\right)=${tV(VR1)}`]}),
    it('V_{R2}','Voltage across R2','V',VB,['The two divider voltages add up to VCC (Kirchhoff\'s voltage law).','$V_{R2}=V_{CC}-V_{R1}','You can also use the divider rule with R2 on top.'],{work:[`V_{R2}=V_{CC}-V_{R1}=${tV(VCC)}-${tV(VR1)}=${tV(VB)}`]}),
    it('V_B','Base voltage','V',VB,['R2 runs from the base to ground, so the base voltage equals the R2 voltage.','$V_B=V_{R2}'],{work:[`V_B=V_{R2}=${tV(VB)}`]}),
    it('V_E','Emitter voltage','V',VE,['The emitter sits one base-emitter drop below the base.','$V_E=V_B-0.7\\,\\text{V}'],{work:[`V_E=V_B-V_{BE}=${tV(VB)}-0.7\\,\\text{V}=${tV(VE)}`]}),
    ...(cc?[it('V_{RE}','Voltage across RE','V',VE,['RE runs from the emitter to ground.','$V_{RE}=V_E'],{work:[`V_{RE}=V_E=${tV(VE)}`]}),
        it('V_C','Collector voltage','V',VCC,['The collector is wired straight to VCC.','$V_C=V_{CC}'],{work:[`V_C=V_{CC}=${tV(VCC)}`]})]
      :[it('V_{RC}','Voltage across RC','V',VRC,['Find the emitter current from Ohm\'s law on RE. The collector current is almost exactly the same, so use Ohm\'s law on RC.','$I_C\\approx I_E=\\frac{V_E}{R_E}','$V_{RC}=I_C R_C'],{work:[`I_C\\approx I_E=\\frac{V_E}{R_E}=\\frac{${tV(VE)}}{${tR(RE)}}=${tmA(IE)}`,`V_{RC}=I_C R_C=(${tmA(IE)})(${tR(RC)})=${tV(VRC)}`]}),
        it('V_C','Collector voltage','V',VC,['Start at VCC and subtract the drop across RC.','$V_C=V_{CC}-V_{RC}'],{work:[`V_C=V_{CC}-V_{RC}=${tV(VCC)}-${tV(VRC)}=${tV(VC)}`]})]),
    it('V_{CE}','Collector to emitter voltage','V',VCE,['The voltage between collector and emitter is the difference of the two node voltages.','$V_{CE}=V_C-V_E'],{work:[`V_{CE}=V_C-V_E=${tV(VC)}-${tV(VE)}=${tV(VCE)}`]}),
    it('I_E','Emitter current','mA',IE*1e3,['Ohm\'s law on RE: the voltage across RE is the emitter voltage.','$I_E=\\frac{V_E}{R_E}','Answer in milliamperes.'],{work:[`I_E=\\frac{V_E}{R_E}=\\frac{${tV(VE)}}{${tR(RE)}}=${tmA(IE)}`]}),
  ];
  const Ait={
    div:it('A','Voltage gain','',A,['First find r\'<sub>e</sub>. With no bypass capacitor the signal current flows through RE as well, so RE is added to r\'<sub>e</sub>.','$'+RE_TEX,'$A=\\frac{R_C}{{r\'}_e+R_E}','Expect a small gain (often under 10) for this circuit.'],{work:[wre,`A=\\frac{R_C}{{r'}_e+R_E}=\\frac{${tR(RC)}}{${tO(re)}+${tR(RE)}}=${tn(A)}`]}),
    byp:it('A','Voltage gain','',A,['First find r\'<sub>e</sub>. The bypass capacitor shorts RE for the signal, so only r\'<sub>e</sub> is left in the emitter.','$'+RE_TEX,'$A=\\frac{R_C}{{r\'}_e}','Common mistake: including RE. That is the formula for the unbypassed amplifier.'],{work:[wre,`A=\\frac{R_C}{{r'}_e}=\\frac{${tR(RC)}}{${tO(re)}}=${tn(A)}`]}),
    cc:it('A','Voltage gain','',A,['The output is taken across RE. The signal divides between r\'<sub>e</sub> and RE, so the gain is just under 1.','$'+RE_TEX,'$A=\\frac{R_E}{{r\'}_e+R_E}'],{work:[wre,`A=\\frac{R_E}{{r'}_e+R_E}=\\frac{${tR(RE)}}{${tO(re)}+${tR(RE)}}=${tn(A)}`]}),
    cb:it('A','Voltage gain','',A,['The base is at AC ground and the signal drives the emitter, so the gain is RC divided by r\'<sub>e</sub> (the same size as a bypassed common emitter stage, but with no phase inversion).','$'+RE_TEX,'$A=\\frac{R_C}{{r\'}_e}'],{work:[wre,`A=\\frac{R_C}{{r'}_e}=\\frac{${tR(RC)}}{${tO(re)}}=${tn(A)}`]}),
  }[kind];
  const zb=kind==='byp'?beta*re:beta*(re+RE),zu=kOhm?'kΩ':'Ω',zv=kOhm?Zin/1000:Zin,zn=kOhm?'Answer in kilohms.':'Answer in ohms.';
  const Zit={
    div:it('Z_{in}','Input impedance',zu,zv,['The signal sees R1, R2 and the base in parallel (VCC is AC ground). Looking into the base you see beta times the total emitter resistance.','$Z_{in}=R_1\\parallel R_2\\parallel\\beta({r\'}_e+R_E)','$Z_{in}=\\frac{1}{\\frac{1}{R_1}+\\frac{1}{R_2}+\\frac{1}{\\beta({r\'}_e+R_E)}}',zn],{work:[`\\beta({r'}_e+R_E)=(${beta})(${tO(re)}+${tR(RE)})=${tR(zb)}`,`Z_{in}=\\frac{1}{\\frac{1}{${tR(R1)}}+\\frac{1}{${tR(R2)}}+\\frac{1}{${tR(zb)}}}=${tZ(Zin)}`]}),
    byp:it('Z_{in}','Input impedance',zu,zv,['The signal sees R1, R2 and the base in parallel. With RE bypassed, the base looks like beta times r\'<sub>e</sub> only, so Z<sub>in</sub> is much lower than without the bypass capacitor.','$Z_{in}=\\frac{1}{\\frac{1}{R_1}+\\frac{1}{R_2}+\\frac{1}{\\beta {r\'}_e}}',zn],{work:[`\\beta {r'}_e=(${beta})(${tO(re)})=${tR(zb)}`,`Z_{in}=\\frac{1}{\\frac{1}{${tR(R1)}}+\\frac{1}{${tR(R2)}}+\\frac{1}{${tR(zb)}}}=${tZ(Zin)}`]}),
    cc:it('Z_{in}','Input impedance',zu,zv,['The signal sees R1, R2 and the base in parallel. Looking into the base you see beta times (r\'<sub>e</sub> + RE), which is large, so the bias resistors usually set Z<sub>in</sub>.','$Z_{in}=\\frac{1}{\\frac{1}{R_1}+\\frac{1}{R_2}+\\frac{1}{\\beta({r\'}_e+R_E)}}',zn],{work:[`\\beta({r'}_e+R_E)=(${beta})(${tO(re)}+${tR(RE)})=${tR(zb)}`,`Z_{in}=\\frac{1}{\\frac{1}{${tR(R1)}}+\\frac{1}{${tR(R2)}}+\\frac{1}{${tR(zb)}}}=${tZ(Zin)}`]}),
    cb:it('Z_{in}','Input impedance',zu,zv,['The signal enters at the emitter. It sees r\'<sub>e</sub> (into the emitter) in parallel with RE, so the input impedance is very low.','$Z_{in}={r\'}_e\\parallel R_E=\\frac{1}{\\frac{1}{{r\'}_e}+\\frac{1}{R_E}}',zn],{work:[`Z_{in}=\\frac{1}{\\frac{1}{${tO(re)}}+\\frac{1}{${tR(RE)}}}=${tO(Zin)}`,'>RE is so much larger than r\'<sub>e</sub> that Z<sub>in</sub> is practically equal to r\'<sub>e</sub>.']}),
  }[kind];
  items.push(Ait,Zit);
  return {title,diagram:schCE(kind),givens,tol:0.05,note:NOTE_DIV,items};
}

/* ---------- class B push-pull power amplifiers ---------- */
const NOTE_B=`Method: ${m('V_{BE}=0.7\\,\\text{V}')} for every junction and for each diode, and the no-signal output sits midway between the supply rails. All voltages are measured from ground; type a minus sign for negative voltages.`;
const zOut=RL=>it('Z_{out}','Output impedance','Ω',RL,['This exercise takes Z<sub>out</sub> as the impedance the output stage drives: the speaker, R<sub>L</sub>.','$Z_{out}=R_L'],{work:[`Z_{out}=R_L=${tO(RL)}`,'>The emitter followers themselves have a very low output impedance; the value asked for here is the load they work into.']});
function classB(kind){ // as in the original: the DC voltages, the gain and Zout (= the speaker); no power or efficiency items
  const RL=pick([8,16]),beta=pick([40,50,60,75,80,100]),beta2=pick([10,15,20,25]),R=pick([680,820,1000,1200]);
  const Aitem=pg=>it('A','Voltage gain','',1,['Each transistor is an emitter follower: the output follows the input with a voltage gain of about 1. Type 1.','$A\\approx1',`The power gain is roughly equal to ${pg}.`],{work:['A\\approx1',`>The output is taken from the emitters, so the voltage gain is just under 1. The amplifier gives power gain through current gain: roughly ${pg}.`]});
  const gR=gv('R','R_1=R_2',fR(R)),gRL=gv('RL','R_L\;(\\text{speaker})',RL+' Ω');
  if(kind==='one'){const VCC=pick([12,15,18,20,24]),V2=VCC/2;
    return {title:'Single source push-pull power amplifier',diagram:schB('one',{cap:'C2'}),tol:0.05,note:NOTE_B,
      givens:[gv('VCC','V_{CC}',VCC+' V'),gR,gv('beta','\\beta_{Q1},\;\\beta_{Q2}',beta),gRL,gv('C','C_1,\;C_2','220 µF, 1000 µF')],
      items:[it('V_{EQ1}','Voltage, emitter Q1','V',V2,['With equal transistors and equal resistors R1 and R2, the circuit is symmetrical. With no signal the output (the two emitters) rests at half of VCC, and C2 charges to that voltage.','$V_{EQ1}=\\frac{V_{CC}}{2}'],{work:[`V_{EQ1}=\\frac{V_{CC}}{2}=\\frac{${tV(VCC)}}{2}=${tV(V2)}`]}),
        it('V_{BQ1}','Voltage, base Q1','V',V2+0.7,['Q1 is an NPN transistor, so its base is one junction drop above its emitter. D1 sets this bias.','$V_{BQ1}=V_{EQ1}+0.7\\,\\text{V}'],{work:[`V_{BQ1}=${tV(V2)}+0.7\\,\\text{V}=${tV(V2+0.7)}`]}),
        it('V_{CQ1}','Voltage, collector Q1','V',VCC,['The collector of Q1 is wired straight to VCC.','$V_{CQ1}=V_{CC}'],{work:[`V_{CQ1}=V_{CC}=${tV(VCC)}`]}),
        it('V_{EQ2}','Voltage, emitter Q2','V',V2,['The two emitters are tied together at the output.','$V_{EQ2}=V_{EQ1}'],{work:[`V_{EQ2}=V_{EQ1}=${tV(V2)}`]}),
        it('V_{BQ2}','Voltage, base Q2','V',V2-0.7,['Q2 is a PNP transistor, so its base is one junction drop below its emitter. D2 sets this bias.','$V_{BQ2}=V_{EQ2}-0.7\\,\\text{V}'],{work:[`V_{BQ2}=${tV(V2)}-0.7\\,\\text{V}=${tV(V2-0.7)}`]}),
        it('V_{CQ2}','Voltage, collector Q2','V',0,['The collector of Q2 is wired to ground. Type 0.','$V_{CQ2}=0\\,\\text{V}'],{work:['V_{CQ2}=0\\,\\text{V}']}),
        it('V_{R1}','Voltage across R1','V',V2-0.7,['R1 runs from VCC down to the base of Q1.','$V_{R1}=V_{CC}-V_{BQ1}'],{work:[`V_{R1}=V_{CC}-V_{BQ1}=${tV(VCC)}-${tV(V2+0.7)}=${tV(V2-0.7)}`]}),
        it('V_{R2}','Voltage across R2','V',V2-0.7,['R2 runs from the base of Q2 down to ground.','$V_{R2}=V_{BQ2}-0\\,\\text{V}'],{work:[`V_{R2}=V_{BQ2}=${tV(V2-0.7)}`,'>V<sub>R1</sub> and V<sub>R2</sub> are equal because the circuit is symmetrical.']}),
        Aitem('beta'),zOut(RL)]};}
  const VCC=pick([12,15,17,18,20]);
  const gS=[gv('VCCp','+V_{CC}',VCC+' V'),gv('VCCn','-V_{CC}','−'+VCC+' V')];
  if(kind==='two')return {title:'Dual source push-pull power amplifier',diagram:schB('two'),tol:0.05,note:NOTE_B,
      givens:[...gS,gR,gv('beta','\\beta_{Q1},\;\\beta_{Q2}',beta),gRL],
      items:[it('V_{EQ1}','Voltage, emitter Q1','V',0,['The circuit is symmetrical between +VCC and −VCC, so with no signal the output rests at 0 V. That is why no output capacitor is needed. Type 0.','$V_{EQ1}=0\\,\\text{V}'],{work:['V_{EQ1}=0\\,\\text{V}']}),
        it('V_{BQ1}','Voltage, base Q1','V',0.7,['NPN: base one junction drop above the emitter.','$V_{BQ1}=V_{EQ1}+0.7\\,\\text{V}'],{work:['V_{BQ1}=0\\,\\text{V}+0.7\\,\\text{V}=0.7\\,\\text{V}']}),
        it('V_{CQ1}','Voltage, collector Q1','V',VCC,['The collector of Q1 is wired to +VCC.','$V_{CQ1}=+V_{CC}'],{work:[`V_{CQ1}=+V_{CC}=${tV(VCC)}`]}),
        it('V_{EQ2}','Voltage, emitter Q2','V',0,['The emitters are tied together at the output. Type 0.','$V_{EQ2}=V_{EQ1}'],{work:['V_{EQ2}=V_{EQ1}=0\\,\\text{V}']}),
        it('V_{BQ2}','Voltage, base Q2','V',-0.7,['PNP: base one junction drop below the emitter. The answer is negative.','$V_{BQ2}=V_{EQ2}-0.7\\,\\text{V}'],{work:['V_{BQ2}=0\\,\\text{V}-0.7\\,\\text{V}=-0.7\\,\\text{V}']}),
        it('V_{CQ2}','Voltage, collector Q2','V',-VCC,['The collector of Q2 is wired to −VCC. The answer is negative.','$V_{CQ2}=-V_{CC}'],{work:[`V_{CQ2}=-V_{CC}=-${tV(VCC)}`]}),
        it('V_{R1}','Voltage across R1','V',VCC-0.7,['R1 runs from +VCC down to the base of Q1. Give the size of the voltage (a positive number).','$V_{R1}=V_{CC}-V_{BQ1}'],{work:[`V_{R1}=${tV(VCC)}-0.7\\,\\text{V}=${tV(VCC-0.7)}`]}),
        it('V_{R2}','Voltage across R2','V',VCC-0.7,['R2 runs from the base of Q2 (−0.7 V) to −VCC. Give the size of the voltage (a positive number).','$V_{R2}=V_{BQ2}-(-V_{CC})'],{work:[`V_{R2}=-0.7\\,\\text{V}-(-${tV(VCC)})=${tV(VCC-0.7)}`]}),
        Aitem('beta'),zOut(RL)]};
  return {title:'Push-pull power amplifier with darlington connections',diagram:schB('dar'),tol:0.05,note:NOTE_B,
    givens:[...gS,gR,gv('beta1','\\beta_{Q1},\;\\beta_{Q3}',beta),gv('beta2','\\beta_{Q2},\;\\beta_{Q4}',beta2),gRL],
    items:[it('V_{EQ1}','Voltage, emitter Q1','V',0.7,['With matched halves and two supplies, the output (the emitters of Q2 and Q4) rests at 0 V. The emitter of Q1 drives the base of Q2, one junction drop above the output.','$V_{EQ1}=V_{BQ2}=0\\,\\text{V}+0.7\\,\\text{V}'],{work:['V_{EQ1}=V_{BQ2}=0\\,\\text{V}+0.7\\,\\text{V}=0.7\\,\\text{V}']}),
      it('V_{BQ1}','Voltage, base Q1','V',1.4,['One more junction drop above the emitter of Q1: two drops above the output in all. That is why two diodes (D1, D2) are needed on each side.','$V_{BQ1}=V_{EQ1}+0.7\\,\\text{V}'],{work:['V_{BQ1}=0.7\\,\\text{V}+0.7\\,\\text{V}=1.4\\,\\text{V}']}),
      it('V_{CQ1}','Voltage, collector Q1','V',VCC,['The collectors of Q1 and Q2 are wired to +VCC.','$V_{CQ1}=+V_{CC}'],{work:[`V_{CQ1}=${tV(VCC)}`]}),
      it('V_{BQ2}','Voltage, base Q2','V',0.7,['Q2 is NPN: its base is one junction drop above its emitter, which is the 0 V output.','$V_{BQ2}=V_{EQ2}+0.7\\,\\text{V}'],{work:['V_{BQ2}=0\\,\\text{V}+0.7\\,\\text{V}=0.7\\,\\text{V}']}),
      it('V_{EQ2}','Voltage, emitter Q2','V',0,['The emitter of Q2 is the output, which rests at 0 V. Type 0.','$V_{EQ2}=0\\,\\text{V}'],{work:['V_{EQ2}=0\\,\\text{V}']}),
      it('V_{EQ3}','Voltage, emitter Q3','V',-0.7,['The emitter of Q3 drives the base of Q4 directly, one junction drop below the output. The answer is negative.','$V_{EQ3}=V_{BQ4}=0\\,\\text{V}-0.7\\,\\text{V}'],{work:['V_{EQ3}=V_{BQ4}=-0.7\\,\\text{V}']}),
      it('V_{BQ3}','Voltage, base Q3','V',-1.4,['One more junction drop below the emitter of Q3.','$V_{BQ3}=V_{EQ3}-0.7\\,\\text{V}'],{work:['V_{BQ3}=-0.7\\,\\text{V}-0.7\\,\\text{V}=-1.4\\,\\text{V}']}),
      it('V_{CQ3}','Voltage, collector Q3','V',-VCC,['The collectors of Q3 and Q4 are wired to −VCC. The answer is negative.','$V_{CQ3}=-V_{CC}'],{work:[`V_{CQ3}=-V_{CC}=-${tV(VCC)}`]}),
      it('V_{BQ4}','Voltage, base Q4','V',-0.7,['Q4 is PNP: its base is one junction drop below its emitter. The answer is negative.','$V_{BQ4}=V_{EQ4}-0.7\\,\\text{V}'],{work:['V_{BQ4}=0\\,\\text{V}-0.7\\,\\text{V}=-0.7\\,\\text{V}']}),
      it('V_{EQ4}','Voltage, emitter Q4','V',0,['The emitters of Q2 and Q4 are tied together at the output. Type 0.','$V_{EQ4}=V_{EQ2}'],{work:['V_{EQ4}=0\\,\\text{V}']}),
      Aitem('the product of the two betas'),zOut(RL)]};
}

/* ---------- intro texts ---------- */
const TXT={
  bb:`<p>Base bias is the simplest way to bias a transistor amplifier: one resistor, R1, feeds base current from ${m('V_{CC}')}. It is easy to analyze, which makes it a good place to start. Work through the circuit in this order:</p>
  <ol><li>The emitter is grounded, so ${m('V_E=0\\,\\text{V}')}.</li><li>The base is one silicon junction drop higher: ${m('V_B=0.7\\,\\text{V}')}.</li><li>R1 drops the rest of the supply: ${m('V_{R1}=V_{CC}-0.7\\,\\text{V}')}.</li><li>All of the R1 current is base current: ${m('I_B=V_{R1}/R_1')}.</li><li>Beta sets the collector current: ${m('I_C=\\beta I_B')}.</li><li>Ohm's law on RC gives ${m('V_{RC}')}, and ${m('V_C=V_{CC}-V_{RC}')}.</li><li>The emitter carries both currents: ${m('I_E=I_B+I_C')}.</li><li>The AC emitter resistance is ${m('{r\'}_e=25\\,\\text{mV}/I_E')}, and the gain is ${m('A=R_C/{r\'}_e')}.</li></ol>
  <p>Notice that the collector current depends directly on beta. Real transistors of the same part number can have betas that differ by 3:1 or more, so a base-biased amplifier built with a different transistor may end up close to saturation or cutoff. That is why base bias is rarely used in production circuits. The next exercise uses a bias method that is far less sensitive to beta.</p>`,
  div:`<p>Voltage divider bias sets the base voltage with two resistors, R1 and R2. As long as the divider current is much larger than the base current (a <b>stiff</b> divider), the base voltage hardly depends on the transistor at all, so changing to a transistor with a different beta has little effect. That makes the circuit easy to manufacture and to service.</p><p>The DC analysis is a chain: divider voltage, then base, then emitter (0.7 V lower), then emitter current from Ohm's law on RE, then the collector side. This version has <b>no emitter bypass capacitor</b>, so the signal current flows through RE too. The result is a low, very stable voltage gain and a fairly high input impedance.</p>`,
  byp:`<p>This amplifier is the same as the last one, plus an <b>emitter bypass capacitor</b> (C3) across RE. The DC analysis is unchanged, because a capacitor carries no DC current. For the signal, though, C3 shorts RE to ground, which changes the AC behavior a lot:</p><ul><li>The voltage gain rises to ${m('A=R_C/{r\'}_e')}, often a few hundred.</li><li>The input impedance drops, because the base now looks like only ${m('\\beta {r\'}_e')}.</li></ul><p>This is useful in troubleshooting: if a bypassed amplifier suddenly has a very low gain, suspect an open bypass capacitor.</p>`,
  cc:`<p>In a common collector amplifier (also called an <b>emitter follower</b>) the collector goes straight to ${m('V_{CC}')}. A DC supply has almost no AC voltage on it, so for the signal the collector is at ground. The input drives the base and the output is taken from the emitter.</p><ul><li>The voltage gain is slightly less than 1: the emitter simply follows the base.</li><li>The current gain, and therefore the power gain, can be large.</li><li>The input impedance is high and the output impedance is low (about ${m('{r\'}_e')} with a low-resistance source).</li></ul><p>Because of this, the circuit is used as a buffer: it lets a high-impedance source drive a low-impedance load.</p>`,
  cb:`<p>In a common base amplifier the base is held at AC ground (here by capacitor C2) and the signal drives the emitter. The circuit uses the same voltage divider bias as the common emitter amplifiers, so all the DC values are found the same way; only the signal connections differ. Many other common base designs need two supplies.</p><ul><li>The voltage gain is high: ${m('A=R_C/{r\'}_e')}, with no phase inversion.</li><li>The input impedance is extremely low, about ${m('{r\'}_e')}, because the signal goes straight into the emitter.</li><li>The base shields the output from the input, so common base stages are used at high frequencies.</li></ul>`,
  one:`<p>This is a class B <b>push-pull</b> power amplifier built from a complementary pair: NPN Q1 handles the positive half of the signal and PNP Q2 handles the negative half. Each transistor is an emitter follower, so the voltage gain is about 1 and the power gain is about beta.</p><p>Diodes D1 and D2 hold each base one junction drop away from the output. Without them, the signal would have to rise 0.7 V before either transistor turned on, causing <b>crossover distortion</b>. (A circuit biased just into conduction like this is often called class AB.)</p><p>With one supply, the output rests at half of ${m('V_{CC}')}, so it needs a large coupling capacitor, C2, to block that DC from the speaker. C2 and the speaker form a high-pass filter, which is why C2 is often thousands of microfarads.</p><p>An ideal class B stage converts at most ${m('\\pi/4\\approx78.5\\%')} of the DC input power into signal power.</p>`,
  two:`<p>This push-pull amplifier uses two supplies, ${m('+V_{CC}')} and ${m('-V_{CC}')}. Because the circuit is symmetrical, the output rests at 0 V and the speaker can be connected directly, with no output capacitor. That gives full bass response down to DC, at the cost of a second power supply.</p><p>As before, D1 and D2 bias the transistors just into conduction to prevent crossover distortion, the voltage gain is about 1, and the power gain is about beta. With two supplies the output can swing almost from ${m('-V_{CC}')} to ${m('+V_{CC}')}, so the same load gets four times the power that a single supply of the same voltage could give.</p>`,
  dar:`<p>This version uses <b>darlington pairs</b> for more power gain. Q1 and Q2 act as one high-beta NPN transistor, and Q3 and Q4 act as one high-beta PNP transistor. The beta of a darlington pair is the product of the two betas. Usually Q1 and Q3 are small drivers and Q2 and Q4 are power transistors.</p><p>Each darlington has two base-emitter junctions in series, so its input sits 1.4 V from the output. That is why there are four bias diodes instead of two. Work out the DC voltages by starting at the 0 V output and adding (NPN side) or subtracting (PNP side) 0.7 V per junction.</p><p>The voltage gain is still about 1. In a real circuit a darlington cannot saturate as fully as a single transistor (its saturation voltage is at least one junction drop), so its maximum output swing is a little smaller than a single transistor's.</p>`,
};
const two=(a,b)=>`<div class="cols2" style="align-items:center"><div>${a}</div><div class="diagram">${b}</div></div>`;
const FD=['V_{R1}=V_{CC}\\frac{R_1}{R_1+R_2}','V_B=V_{R2}=V_{CC}-V_{R1}','V_E=V_B-0.7\\,\\text{V}','I_E=\\frac{V_E}{R_E}','I_C\\approx I_E',RE_TEX];
const FORM={
  bb:['V_B=0.7\\,\\text{V}','I_B=\\frac{V_{CC}-0.7\\,\\text{V}}{R_1}','I_C=\\beta I_B','V_C=V_{CC}-I_C R_C','I_E=I_B+I_C',RE_TEX,'A=\\frac{R_C}{{r\'}_e}','Z_{in}=R_1\\parallel\\beta {r\'}_e'],
  div:[...FD,'V_C=V_{CC}-I_C R_C','V_{CE}=V_C-V_E','A=\\frac{R_C}{{r\'}_e+R_E}','Z_{in}=R_1\\parallel R_2\\parallel\\beta({r\'}_e+R_E)'],
  byp:[...FD,'V_C=V_{CC}-I_C R_C','V_{CE}=V_C-V_E','A=\\frac{R_C}{{r\'}_e}','Z_{in}=R_1\\parallel R_2\\parallel\\beta {r\'}_e'],
  cc:[...FD,'V_C=V_{CC}','A=\\frac{R_E}{{r\'}_e+R_E}','Z_{in}=R_1\\parallel R_2\\parallel\\beta({r\'}_e+R_E)'],
  cb:[...FD,'V_C=V_{CC}-I_C R_C','A=\\frac{R_C}{{r\'}_e}','Z_{in}={r\'}_e\\parallel R_E'],
  one:['V_{EQ1}=V_{EQ2}=\\frac{V_{CC}}{2}','V_{BQ1}=\\frac{V_{CC}}{2}+0.7\\,\\text{V}','V_{BQ2}=\\frac{V_{CC}}{2}-0.7\\,\\text{V}','V_{R1}=V_{R2}=\\frac{V_{CC}}{2}-0.7\\,\\text{V}','A\\approx1','Z_{out}=R_L'],
  two:['V_{EQ1}=V_{EQ2}=0\\,\\text{V}','V_{BQ1}=+0.7\\,\\text{V}','V_{BQ2}=-0.7\\,\\text{V}','V_{R1}=V_{R2}=V_{CC}-0.7\\,\\text{V}','A\\approx1','Z_{out}=R_L'],
  dar:['V_{EQ1}=V_{BQ2}=+0.7\\,\\text{V}','V_{BQ1}=+1.4\\,\\text{V}','V_{EQ3}=V_{BQ4}=-0.7\\,\\text{V}','V_{BQ3}=-1.4\\,\\text{V}','A\\approx1','Z_{out}=R_L'],
};
function ampIntro(key,diag){
  const approx=key==='bb'?`<p><b>Approximations used</b> (the answer key uses exactly these): ${m('V_{BE}=0.7\\,\\text{V}')}, ${m('I_C=\\beta I_B')}, ${m('{r\'}_e=25\\,\\text{mV}/I_E')}, capacitors are short circuits for the signal, and there is no load on the output.</p>`
    :['one','two','dar'].includes(key)?`<p><b>Approximations used</b> (the answer key uses exactly these): every base-emitter junction and every bias diode drops 0.7 V, and the no-signal output sits exactly midway between the supply rails.</p>`:APPROX_CE;
  return CC.introPage({text:two(TXT[key],diag),extra:`<h3>Key relationships</h3><div class="formulas">${FORM[key].map(t=>`<div class="formula">${M(t)}</div>`).join('')}</div>${approx}`,how:SCORE_WS});
}
function wsMod(id,title,icon,sub,key,gen,diag){return {id,title,icon,sub,intro:ampIntro(key,diag),run:(el,s)=>CC.worksheet(el,s,{...gen(),itemScore:true})};}

/* ---------- diode testing ---------- */
const DIODE_OPTS=['Defective diode, Low resistance in both directions','Defective diode, Open circuit','Good diode, The right lead is the cathode.','Good diode, The left lead is the cathode.'];
function diodeBuild(){
  const r=Math.random();const ans=r<0.15?0:r<0.3?1:r<0.65?2:3;
  const styles=[['#e88b2a','#c06010','glass'],['#222','#111','rect'],['#4a7fb5','#2b5a8a','rect'],['#3c8f5a','#286a40','rect'],['#7a4a9a','#55306d','rect'],['#b9b9b9','#888','glass'],['led','#d33','led'],['led','#2a2','led'],['led','#eb2','led']];
  const st=pick(styles);const led=st[2]==='led';
  // as in the original meter: every good junction (LEDs too) reads 343-436 Ω forward, over range shows 99999,
  // and a shorted diode reads about 0 Ω, or (some of them) a forward-like 350-370 Ω in both directions
  const fwd=rnd(343,436),both=Math.random()<0.3?rnd(350,370):null;
  const read=(red,black)=>{ // L / R pads; each call drifts a little in the last digit
    if(ans===0)return both?(both+rnd(-0.1,0.1)).toFixed(1)+' Ω':rnd(-0.004,0.06).toFixed(3)+' Ω';
    if(ans===1)return '99999';
    const cathode=ans===2?'R':'L';const anode=cathode==='R'?'L':'R';
    return red===anode&&black===cathode?(fwd+rnd(-0.1,0.1)).toFixed(1)+' Ω':'99999';};
  const svg=()=>{let body;
    if(led)body=`<path d="M150,30 a20,20 0 0 1 40,0 v34 h-40 z" fill="${st[1]}" opacity=".85" stroke="#333"/><rect x="146" y="62" width="48" height="6" fill="${st[1]}" stroke="#333"/><path d="M160,68 L160,95 Q160,110 90,140 L90,150" fill="none" stroke="#999" stroke-width="3"/><path d="M180,68 L180,95 Q180,110 250,140 L250,150" fill="none" stroke="#999" stroke-width="3"/>`;
    else body=`<path d="M128,60 Q90,62 90,150" fill="none" stroke="#999" stroke-width="3"/><path d="M212,60 Q250,62 250,150" fill="none" stroke="#999" stroke-width="3"/><rect x="128" y="${st[2]==='glass'?51:48}" width="84" height="${st[2]==='glass'?18:24}" rx="${st[2]==='glass'?9:5}" fill="${st[0]}" stroke="${st[1]}" stroke-width="2"/>${st[2]==='glass'?'<rect x="150" y="56" width="40" height="8" fill="#5b3a1a" opacity=".5"/>':''}`;
    return `<svg viewBox="0 0 340 210" width="340" height="210" role="img" aria-label="${led?'LED':'diode'} under test">${body}</svg>`;};
  const what=led?'This LED':'This diode';
  const explain=()=>[
    `${what} read low with the probes either way round${both?' (a few hundred ohms each way, like a forward junction)':' (about 0 Ω)'}. A junction that conducts in both directions is <b>shorted</b>.`,
    `${what} read 99999 (over range) with the probes either way round. A junction that conducts in neither direction is <b>open</b>.`,
    `${what} read low only with the red (+) probe on the <b>left</b> lead. In the low-resistance direction the positive probe is on the anode, so the left lead is the anode and the <b>right lead is the cathode</b>. The reverse reading was over range (99999), so the diode is good.`,
    `${what} read low only with the red (+) probe on the <b>right</b> lead. In the low-resistance direction the positive probe is on the anode, so the right lead is the anode and the <b>left lead is the cathode</b>. The reverse reading was over range (99999), so the diode is good.`][ans];
  return {svg,pads:[{id:'L',x:90,y:150,label:'Left'},{id:'R',x:250,y:150,label:'Right'}],read,options:DIODE_OPTS,answer:ans,explain};
}
/* ---------- transistor testing ---------- */
const TR_OPTS=['Good NPN Transistor - A is the base lead.','Good NPN Transistor - B is the base lead.','Good NPN Transistor - C is the base lead.','Good PNP Transistor - A is the base lead.','Good PNP Transistor - B is the base lead.','Good PNP Transistor - C is the base lead.','Bad Transistor - Open junction','Bad Transistor - Shorted junction'];
function transistorBuild(){
  const pnp=Math.random()<0.5,base=ri(0,2);const r=Math.random();const fault=r<0.15?'open':r<0.3?'short':null;
  const leads=['A','B','C'];const others=leads.filter((_,i)=>i!==base);if(Math.random()<0.5)others.reverse();
  const role={[leads[base]]:'B',[others[0]]:'E',[others[1]]:'C'};
  const fj=pick(['E','C']);
  const vbe=rnd(380,441),vbc=rnd(337,400),vs=rnd(-0.08,0.08); // forward 337-441 Ω; a shorted junction reads about 0 Ω
  const jr=(x,dirFromBase)=>{ // junction base<->x; dirFromBase: conventional current from base to x
    if(fault&&fj===x){if(fault==='open')return Infinity;return vs;}
    const fwd=pnp?!dirFromBase:dirFromBase;return fwd?(x==='E'?vbe:vbc):Infinity;};
  const R=(a,b)=>{const ra=role[a],rb=role[b];
    if(ra==='B')return jr(rb,true);if(rb==='B')return jr(ra,false);
    return jr(ra,false)+jr(rb,true);};
  const read=(red,black)=>{const v=R(red,black);if(!isFinite(v))return '999999';return (Math.abs(v)<1?(v+rnd(-0.004,0.004)).toFixed(3):(v+rnd(-0.1,0.1)).toFixed(1))+' Ω';};
  const ans=fault==='open'?6:fault==='short'?7:(pnp?3:0)+base;
  const pk=ri(0,2);
  const svg=()=>{let body;
    if(pk===0)body=`<path d="M130,40 h80 v60 h-80 z" fill="#222"/><path d="M130,40 a40,14 0 0 1 80,0" fill="#333"/><text x="170" y="75" fill="#bbb" font-size="10" text-anchor="middle">${ri(151,159)}-${ri(1000,9999)}</text>`;
    else if(pk===1)body=`<ellipse cx="170" cy="100" rx="42" ry="10" fill="#8d8d8d"/><rect x="128" y="45" width="84" height="55" fill="#b5b5b5"/><ellipse cx="170" cy="45" rx="42" ry="12" fill="#d4d4d4" stroke="#888"/><rect x="200" y="92" width="12" height="10" fill="#999"/>`;
    else body=`<rect x="135" y="10" width="70" height="40" rx="4" fill="#c0c0c0" stroke="#888"/><circle cx="170" cy="28" r="8" fill="var(--surface2)" stroke="#888"/><rect x="132" y="48" width="76" height="52" rx="3" fill="#1d1d1d"/><text x="170" y="80" fill="#aaa" font-size="10" text-anchor="middle">${ri(151,159)}-${ri(1000,9999)}</text>`;
    const lx=[110,170,230];
    body+=lx.map((x,i)=>`<path d="M${150+i*20},100 L${150+i*20},120 Q${150+i*20},140 ${x},160 L${x},170" fill="none" stroke="#999" stroke-width="3"/>`).join('');
    return `<svg viewBox="0 0 340 230" width="340" height="230" role="img" aria-label="transistor under test">${body}</svg>`;};
  const bl=leads[base],ol=leads.filter(x=>x!==bl);const lead=r=>Object.keys(role).find(k=>role[k]===r);
  const explain=()=>{
    if(fault==='open')return `The junction between leads ${lead('B')} and ${lead(fj)} read 999999 (over range) in both directions, so that junction is <b>open</b>. (Only one pair of leads gave a low reading in one direction.)`;
    if(fault==='short')return `Leads ${lead('B')} and ${lead(fj)} read about 0 Ω with the probes either way round, so that junction is <b>shorted</b>.`;
    return `Lead <b>${bl}</b> is the only lead that reads low to <i>both</i> other leads with the same probe on it: the ${pnp?'black (−)':'red (+)'} probe. ${pnp?'With the negative probe on it, current flows out of the base, so the base is N-type: a <b>PNP</b> transistor.':'With the positive probe on it, current flows into the base, so the base is P-type: an <b>NPN</b> transistor.'} With the probes reversed both junctions read 999999 (over range), and leads ${ol[0]} and ${ol[1]} read over range both ways, so the transistor is good. The slightly higher of the two low readings is usually the base-emitter junction.`;};
  return {svg,pads:[{id:'A',x:110,y:170,label:'A'},{id:'B',x:170,y:170,label:'B'},{id:'C',x:230,y:170,label:'C'}],read,options:TR_OPTS,answer:ans,explain,_role:role,_pnp:pnp,_fault:fault};
}

/* ---------- troubleshooting amplifiers ---------- */
function ampBoard(type,forceFault){ // 'bb' (base bias) or 'div' (voltage divider, bypassed). Parts, traces and faults follow the original boards.
  const div=type==='div';
  const VCC=Math.round(rnd(div?12.1:10.7,div?21.6:24.2)*100)/100,vin=ri(6,12)/1000; // the supply changes on every board
  const beta=div?ri(150,280):ri(93,111);
  const R1=div?68e3:1.2e6,R2=27e3,RE=5.6e3,RC=div?12e3:5.6e3;
  const faults=div?['R1 Open','C1 Open','C2 Open','C3 Open','Trace 2 Open','Trace 4 Open','Trace 5 Open','Open Junction in Q1','Shorted Junction in Q1','No Faults']
                  :['C1 Open','C2 Open','RC Open','Trace 1 Open','Trace 2 Open','Trace 3 Open','Trace 6 Open','Open Junctions in Q1','Shorted Junctions in Q1','No Faults'];
  const ans=forceFault!=null?forceFault:ri(0,faults.length-1);const f=faults[ans];
  // nodes: R1T R1 top, D R1 bottom (and R2 top on the divider board), Cin C1 right, B base, E emitter pad, F RE top / C2 top (divider),
  // C collector, K RC bottom, K2 output capacitor (collector side), OUT output, IN input
  const n={VCC,R1T:VCC,D:0,Cin:0,B:0,E:0,F:0,C:VCC,K:VCC,K2:VCC,OUT:0,IN:0,GND:0};
  const ac={VCC:0,R1T:0,D:0,Cin:0,B:0,E:0,F:0,C:0,K:0,K2:0,OUT:0,IN:vin,GND:0};
  const vth=div?VCC*R2/(R1+R2):VCC; // unloaded divider voltage
  let IE,IC,on=true;
  if(div){IE=(vth-0.7)/RE;IC=IE;n.D=n.B=n.Cin=vth;n.E=n.F=vth-0.7;}
  else{const IB=(VCC-0.7)/R1;IC=beta*IB;IE=IB+IC;n.D=n.B=n.Cin=0.7;}
  n.C=n.K=n.K2=Math.max(n.E+0.1,VCC-IC*RC);
  const gain=div&&f==='C2 Open'?RC/RE:RC/(0.025/IE);
  const off=()=>{on=false;n.E=n.F=0;n.C=n.K=n.K2=VCC;};
  switch(f){
    case 'R1 Open':n.D=n.B=n.Cin=0;off();break;
    case 'RC Open':n.C=n.K=n.K2=0;on=false;break;
    case 'Trace 1 Open':n.Cin=0;break;
    case 'Trace 2 Open':n.R1T=0;n.D=n.B=n.Cin=0;off();break;
    case 'Trace 3 Open':n.D=n.Cin=VCC;n.B=0;off();break;
    case 'Trace 4 Open':n.B=0;off();break;
    case 'Trace 5 Open':off();n.E=vth-0.6;break;
    case 'Trace 6 Open':n.K2=0;break;
    case 'Open Junction in Q1':off();break;
    case 'Open Junctions in Q1':n.D=n.B=n.Cin=VCC;off();break;
    case 'Shorted Junction in Q1':{const up=1/(1/R1+1/RC),dn=1/(1/R2+1/RE),v=VCC*dn/(up+dn);n.D=n.B=n.Cin=n.E=n.F=n.C=n.K=n.K2=v;on=false;break;} // base, emitter and collector all shorted together
    case 'Shorted Junctions in Q1':n.D=n.B=n.Cin=n.C=n.K=n.K2=0;on=false;break;
  }
  // signal path: C1 -> Cin -> (trace 1 on the simple board) -> D -> (trace 3 simple / trace 4 divider) -> base
  const short=/^Shorted/.test(f);
  ac.Cin=f==='C1 Open'||short?0:vin;
  ac.D=f==='Trace 1 Open'?0:ac.Cin;
  ac.B=f==='Trace 3 Open'||f==='Trace 4 Open'?0:ac.D;
  const vout=on?Math.min(ac.B*gain,Math.max(0.05,2*Math.min(n.C-n.E-0.2,VCC-n.C))):0;
  ac.C=ac.K=vout;ac.K2=f==='Trace 6 Open'?0:vout;ac.OUT=f===(div?'C3 Open':'C2 Open')?0:ac.K2;
  if(div){ac.E=on?(f==='C2 Open'?ac.B:ac.B*0.004):f==='Trace 5 Open'?ac.B:0;ac.F=f==='Trace 5 Open'?0:ac.E;}
  // pads
  const P=div?{
    VCC:[80,112,'VCC'],R1t:[110,140,'R1 top'],R1b:[110,200,'R1 bottom'],R2t:[110,230,'R2 top'],R2b:[110,295,'R2 bottom'],C1b:[175,200,'C1 right'],IN:[245,200,'Input (C1 left)'],
    QB:[265,250,'Q1 base'],QC:[322,226,'Q1 collector'],QE:[322,274,'Q1 emitter'],RCt:[390,140,'RC top'],RCb:[390,200,'RC bottom'],C3a:[440,200,'C3 left'],OUT:[510,200,'Output'],
    REt:[390,262,'RE top'],REb:[390,305,'RE bottom'],C2t:[460,262,'C2 top'],C2b:[460,305,'C2 bottom'],GND:[80,320,'GND']}
   :{VCC:[80,112,'VCC'],R1t:[110,140,'R1 top'],R1b:[110,200,'R1 bottom'],C1b:[175,200,'C1 right'],IN:[245,200,'Input (C1 left)'],QB:[265,250,'Q1 base'],QC:[322,226,'Q1 collector'],QE:[322,274,'Q1 emitter'],
    RCt:[390,140,'RC top'],RCb:[390,200,'RC bottom'],C2a:[440,200,'C2 left'],OUT:[510,200,'Output'],GND:[80,320,'GND']};
  const node={VCC:'VCC',R1t:'R1T',RCt:'VCC',R1b:'D',R2t:'D',R2b:'GND',IN:'IN',C1b:'Cin',QB:'B',QC:'C',QE:'E',RCb:'K',C3a:'K2',C2a:'K2',OUT:'OUT',REt:'F',REb:'GND',C2t:'F',C2b:'GND',GND:'GND'};
  const dc=id=>n[node[id]],acv=id=>ac[node[id]];
  const svg=()=>{
    let g=B.supply(20,8,160,64,'POWER SUPPLY',VCC.toFixed(2)+' V DC')+`<rect x="200" y="8" width="150" height="64" rx="8" fill="#4a3b33"/><rect x="208" y="16" width="134" height="48" rx="5" fill="#e9e4dc"/><text x="275" y="34" font-size="11" font-weight="800" text-anchor="middle" fill="#b3261e">SIGNAL GENERATOR</text><text x="275" y="54" font-size="12" font-weight="700" text-anchor="middle" fill="#333">${Math.round(vin*1000)} mVPP · 1 kHz</text>`;
    g+=B.pcb(20,100,520,235);
    g+=B.trace([[80,112],[390,112]])+B.trace([[390,112],[390,140]])+B.trace([[80,320],[480,320]]);
    g+=B.trace([[110,112],[110,140]],'TRACE 2',[143,130])+B.trace([[110,200],[175,200]],'TRACE 1',[142,193]);
    g+=B.part('R',[110,140],[110,200],'')+B.label(96,174,'R1',{size:12,anchor:'end'})+B.part('C',[175,200],[245,200],'C1')+B.part('R',[390,140],[390,200],'RC');
    if(div){
      g+=B.trace([[110,200],[110,230]],'TRACE 3',[78,219])+B.trace([[110,230],[265,230],[265,250]],'TRACE 4',[190,246]);
      g+=B.trace([[322,274],[350,274],[350,262],[390,262]],'TRACE 5',[350,292])+B.trace([[390,262],[460,262]]);
      g+=B.trace([[322,226],[390,226],[390,200]],'TRACE 6',[357,219])+B.trace([[390,200],[440,200]],'TRACE 7',[415,192]);
      g+=B.trace([[110,295],[110,320]])+B.trace([[390,305],[390,320]])+B.trace([[460,305],[460,320]]);
      g+=B.part('R',[110,230],[110,295],'')+B.label(96,266,'R2',{size:12,anchor:'end'})+B.part('R',[390,262],[390,305],'RE')+B.part('C',[460,262],[460,305],'C2')+B.part('C',[440,200],[510,200],'C3');}
    else{
      g+=B.trace([[110,200],[110,240],[265,240],[265,250]],'TRACE 3',[190,233]);
      g+=B.trace([[322,274],[322,320]],'TRACE 4',[350,300])+B.trace([[322,226],[390,226],[390,200]],'TRACE 5',[357,219])+B.trace([[390,200],[440,200]],'TRACE 6',[415,192]);
      g+=B.part('C',[440,200],[510,200],'C2');}
    g+=`<path d="M280,232 h26 a4,4 0 0 1 4,4 v28 a4,4 0 0 1-4,4 h-26 a14,18 0 0 1 0,-36z" fill="#1b1b1b"/><text x="292" y="254" font-size="9" fill="#bbb" text-anchor="middle">Q1</text>`+B.trace([[265,250],[280,250]])+B.trace([[310,240],[322,226]])+B.trace([[310,262],[322,274]]);
    g+=B.label(58,116,'VCC',{size:10,anchor:'end'})+B.label(80,338,'GND',{size:10})+B.label(510,190,'OUT',{size:10})+B.label(256,188,'IN',{size:10,anchor:'start'});
    g+=B.wire([[100,72],[100,90],[66,90],[66,112],[80,112]],'#c62828')+B.wire([[150,72],[150,94],[32,94],[32,320],[80,320]],'#222')+B.wire([[250,72],[250,100],[245,100],[245,200]],'#1f5fa8');
    return B.svg(560,345,g);
  };
  const pads=Object.keys(P).map(id=>({id,x:P[id][0],y:P[id][1],label:P[id][2]}));
  const EXPL=div?{
    'R1 Open':'R1 top reads VCC, but with no current from R1, R2 pulls the divider point and the base to 0 V. The transistor is cut off: emitter at 0 V, collector at VCC.',
    'C1 Open':'DC voltages are all normal, but there is signal on the input side of C1 and none on its right side or at the base. An open coupling capacitor blocks the signal.',
    'C2 Open':'DC voltages are normal, but the full input signal appears at the emitter and the output is only about RC/RE times the input. With the bypass capacitor open, RE is back in the gain formula.',
    'C3 Open':'Everything is normal up to the collector, which has a large signal, but there is no signal at the output side of C3.',
    'Trace 2 Open':'R1 top reads 0 V: the break is between the VCC rail and R1. With no divider current every bias voltage is 0, and the collector sits at VCC.',
    'Trace 4 Open':'The divider point (R1 bottom / R2 top) reads its unloaded divider voltage, but the base reads 0 V. The break is between the divider and the base, so the transistor is cut off.',
    'Trace 5 Open':'The emitter pad reads high (about one junction drop below the base) but RE top reads 0 V. The break is between the emitter and RE, so no current flows and the collector rises to VCC.',
    'Open Junction in Q1':'The base reads the unloaded divider voltage, the emitter (and RE top) read 0 V and the collector reads VCC. No transistor current flows although the emitter circuit is intact: an open junction.',
    'Shorted Junction in Q1':'Base, emitter and collector all read the same voltage. The shorted transistor ties all three together: R1 and RC pull the node up and R2 and RE pull it down.',
    'No Faults':'All DC voltages are close to the calculated values and the amplifier has a large output signal.'}
   :{
    'C1 Open':'DC voltages are all normal, but there is signal on the input side of C1 and none on its right side or at the base.',
    'C2 Open':'DC voltages are normal and the collector has a large signal, but there is no signal at the output side of C2.',
    'RC Open':'RC top reads VCC, but RC bottom and the collector read about 0 V while the base still reads 0.7 V. With RC open no collector current can flow.',
    'Trace 1 Open':'The right side of C1 has the signal but reads 0 V DC, while R1 bottom and the base have normal DC (about 0.7 V) and no signal. The break is between C1 and R1.',
    'Trace 2 Open':'R1 top reads 0 V: the break is between the VCC rail and R1. With no base current the base reads 0 V, the transistor is cut off and the collector sits at VCC.',
    'Trace 3 Open':'R1 bottom (and the right side of C1) read the full VCC, because R1 carries no current, but the base reads 0 V. The break is between R1 and the base.',
    'Trace 6 Open':'The collector and RC bottom are normal and have a large signal, but the collector side of C2 reads 0 V with no signal. The break is between RC and C2.',
    'Open Junctions in Q1':'The base reads the full VCC (R1 carries no current, so it drops no voltage) and the collector reads VCC. The transistor conducts nowhere: open junctions.',
    'Shorted Junctions in Q1':'Base, collector and emitter all read 0 V: the shorted transistor ties the collector and base to the grounded emitter.',
    'No Faults':'All DC voltages are close to the calculated values and the amplifier has a large output signal.'};
  const work=(div?(()=>{const vb=vth,ie=IE;return ['>Normal values for this board:',`V_B=V_{CC}\\frac{R_2}{R_1+R_2}=${tV(VCC)}\\frac{27\\,\\text{k}\\Omega}{68\\,\\text{k}\\Omega+27\\,\\text{k}\\Omega}=${tV(vb)}`,`V_E=V_B-0.7\\,\\text{V}=${tV(vb-0.7)}`,`I_E=\\frac{V_E}{R_E}=\\frac{${tV(vb-0.7)}}{5.6\\,\\text{k}\\Omega}=${tmA(ie)}`,`V_C=V_{CC}-I_E R_C=${tV(VCC)}-(${tmA(ie)})(12\\,\\text{k}\\Omega)=${tV(VCC-ie*12e3)}`,`A=\\frac{R_C}{{r'}_e}=\\frac{12\\,\\text{k}\\Omega}{${tO(0.025/ie)}}=${tn(12e3*ie/0.025,3)}`];})
    :(()=>{const ib=(VCC-0.7)/1.2e6,ic=beta*ib;return ['>Normal values for this board:',`I_B=\\frac{V_{CC}-0.7\\,\\text{V}}{R_1}=\\frac{${tV(VCC)}-0.7\\,\\text{V}}{1.2\\,\\text{M}\\Omega}=${tuA(ib)}`,`I_C=\\beta I_B=(${beta})(${tuA(ib)})=${tmA(ic)}`,`V_C=V_{CC}-I_C R_C=${tV(VCC)}-(${tmA(ic)})(5.6\\,\\text{k}\\Omega)=${tV(VCC-ic*5600)}`,`A=\\frac{R_C}{{r'}_e}=\\frac{5.6\\,\\text{k}\\Omega}{${tO(0.025/(ib+ic))}}=${tn(5600*(ib+ic)/0.025,3)}`];}));
  return {svg,pads,start:div?'R2b':'QE',faults,answer:ans,dc,ac:acv,vcc:VCC,vin,explain:()=>EXPL[f],work:()=>work().flatMap(splitEq),
    schematic:div?schCE('byp',{out:'C3',byp:'C2'}):schCE('bb'),
    info:()=>div?`Beta = ${beta}, R1 = 68 kΩ, R2 = 27 kΩ, RE = 5.6 kΩ, RC = 12 kΩ. C1 is the input capacitor, C2 the emitter bypass capacitor and C3 the output capacitor.`
                :`Beta = ${beta}, R1 = 1.2 MΩ, RC = 5.6 kΩ. C1 is the input capacitor and C2 the output capacitor.`};
}
SK._ampBoard=ampBoard; // exposed for automated fault sweeps
const TS_TEXT=(what,nf)=>`<p>Find the fault in a ${what} amplifier built on a PC board. The fault can be a failed part or a broken circuit trace, or the board may have no fault at all. There are ${nf} possible answers, and each run gives you ten boards.</p><p>The supply voltage, the signal level and the transistor's beta change from board to board, so read them before you start. The parts are at their marked values and the meter is accurate (its last digit wanders a little), so the normal readings match the calculated values closely. Before you start, work out roughly what the normal base, emitter and collector voltages should be (the worked solution after each item shows how).</p><p>A good strategy: check the DC voltages at the transistor first (they tell you whether it is cut off, saturated or normal), then follow the signal with the AC meter from the input toward the output. To find the voltage across a part, measure both ends and subtract.</p>`;
const TS_HOW='<p>The red (+) meter probe starts on a solder pad, and that first reading is free. Tap a pad to move the red probe there; the black (−) probe stays on ground. Switch between <b>DC volts</b> and <b>AC volts</b> with the meter buttons; the meter stays in the mode you leave it in for the next board. The signal generator feeds a small 1 kHz signal into the input. Open <b>Schematic</b> to see the circuit diagram.</p><p><b>Scoring.</b> Each board is worth up to 12 points. Moving the probe to a different pad costs 1 point; tapping the same pad again or switching between DC and AC is free, so plan your measurements. A wrong answer scores 0 for that board. After grading you can keep measuring to see what you missed; that does not change the score. Your score is your points out of the 120 possible.</p>';

/* ---------- home hero: live CE amplifier calculator ---------- */
function hero(slot){ // the original's Amp Calc: a voltage divider amplifier with RE bypassed
  const vals={R1:82,R2:33,RC:6.8,RE:2.7,VCC:12,beta:200};
  const card=CC.el(`<div class="card"><b>Amp Calc: voltage divider amplifier</b><p class="small muted" style="margin:.2em 0 .6em">Change any value and the results update immediately. You will see a warning if the design has a serious problem. Uses the unloaded divider, ${m('V_{BE}=0.7\\,\\text{V}')}, ${m('{r\'}_e=25\\,\\text{mV}/I_E')}, RE bypassed and no load.</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px"><div class="diagram" style="padding:4px">${schCE('byp')}</div>
    <div class="fields" style="grid-template-columns:1fr 1fr;gap:0 8px">${[['R1','R1 (kΩ)'],['R2','R2 (kΩ)'],['RC','RC (kΩ)'],['RE','RE (kΩ)'],['VCC','VCC (V)'],['beta','Beta Q1']].map(([k,l])=>`<div class="field" style="margin:3px 0"><label for="h${k}">${l}</label><input id="h${k}" inputmode="decimal" value="${vals[k]}" style="padding:6px 8px"></div>`).join('')}</div></div>
    <div class="givens" id="hout"></div><div class="small mt" id="hcom" style="color:var(--bad)"></div></div>`);
  slot.appendChild(card);
  const calc=()=>{
    const g=k=>CC.parse(CC.$('#h'+k,card).value,false);
    const R1=g('R1')*1e3,R2=g('R2')*1e3,RC=g('RC')*1e3,RE=g('RE')*1e3,VCC=g('VCC'),beta=g('beta');
    const out=CC.$('#hout',card),com=CC.$('#hcom',card);
    if([R1,R2,RC,RE,VCC,beta].some(x=>!(x>0&&isFinite(x)))){out.innerHTML='';com.textContent='Enter a positive number in every box.';return;}
    const VR1=VCC*R1/(R1+R2),VR2=VCC-VR1,VB=VR2;const c=[];let ok=true;
    let VE=VB-0.7,IE=VE/RE,VRC=IE*RC,VC=VCC-VRC;
    if(VB<0.7){ok=false;c.push('VB is too small to forward bias the B-E junction. Decrease R1 or increase R2 and/or VCC.');VE=0;IE=0;VRC=0;VC=VCC;}
    else if(VC<=VE){ok=false;c.push('The transistor is saturated. Increase R1 or decrease RC and/or decrease R2.');IE=VCC/(RC+RE);VE=IE*RE;VRC=IE*RC;VC=VE;}
    if(ok&&VCC/(R1+R2)<10*IE/beta)c.push('The voltage divider current is too small. Decrease both R1 and R2.');
    const VCE=VC-VE,re=ok?0.025/IE:Infinity,A=ok?RC/re:0,Zin=1/(1/R1+1/R2+(ok?1/(beta*re):0));
    const mW=x=>[x*1e3,'mW'];
    const show=[['V_{R1}',VR1,'V'],['V_{R2}',VR2,'V'],['V_{RE}',VE,'V'],['V_{RC}',VRC,'V'],['V_B',VB,'V'],['V_E',VE,'V'],['V_C',VC,'V'],['I_E',IE*1e3,'mA'],['A',A,''],['Z_{in}',Zin/1e3,'kΩ'],
      ['P_{R1}',...mW(VR1*VR1/R1)],['P_{R2}',...mW(VR2*VR2/R2)],['P_{RE}',...mW(VE*IE)],['P_{RC}',...mW(VRC*VRC/RC)],['P_{Q1}',...mW(VCE*IE)],['\\text{Max output}',ok?2*VCE:0,'VPP']];
    out.innerHTML=show.map(([s,v,u])=>`<div class="given"><div class="k">${m(s)}</div><div class="v">${fmt(v,4)} ${u}</div></div>`).join('');
    com.innerHTML=c.length?'<b>Warning:</b> '+c.join(' '):'';
  };
  CC.$$('input',card).forEach(i=>i.addEventListener('input',calc));calc();
}

CC.App.init({
  id:'solid',title:'Solid-State Challenge',tagline:'Diodes, transistors and amplifiers · offline edition',
  blurb:'Twelve hands-on exercises: test diodes and transistors with an ohmmeter, analyze base biased, voltage divider biased, common collector and common base amplifiers, work out three class B push-pull power amplifiers, and troubleshoot two virtual amplifier boards. Every run uses new values.',
  footer:'Based on Solid-State Challenge © ETCAI Products. Offline HTML edition.',pass:false,hero,
  manual:`<h2>About this program</h2><p>Solid-State Challenge is a set of practice exercises to use alongside your textbook and lab work. Each exercise gives you immediate feedback, has hints and formulas when you need them, and is graded automatically, so you and your instructor can see how you are doing.</p><p>There are twelve exercises: diode testing, transistor testing, base biased amplifiers, voltage divider biased common emitter amplifiers without and with an emitter bypass capacitor, common collector amplifiers, common base amplifiers, single-supply and dual-supply push-pull power amplifiers, a push-pull amplifier with darlington transistors, and two troubleshooting boards (a base biased amplifier and a voltage divider biased amplifier).</p><p>Every exercise starts with a short introduction to the topic and its key formulas; press <b>Begin</b> when you are ready. New values are chosen each time, so you can practice an exercise as often as you like. The program records the time you take, and you can print a certificate with your name, ID, date, score, time and a validity code.</p>
  <h2>Grading</h2><p>Calculated answers are correct when they are within 5% of the expected value; an answer that should be 0 must be exactly 0. On the amplifier worksheets each item is worth 10 points (8 on the twelve-item darlington sheet). A wrong check takes 2 points and each look at help takes 3 points off that item only, and a right check locks the item. Work to at least three or four significant figures, because later answers are built from earlier ones and early rounding can push a later answer outside the window. Each exercise's introduction states the approximations the answer key uses (for example ${m('V_{BE}=0.7\\,\\text{V}')} and ${m('{r\'}_e=25\\,\\text{mV}/I_E')}), and every graded item has a worked solution.</p>
  <h2>Troubleshooting scores</h2><p>Each troubleshooting run has ten boards worth up to 12 points each (120 points in all). Moving the meter probe to a new pad costs 1 point (switching between DC and AC is free), and a wrong answer scores 0 for that board. Because you always need at least a few readings, a perfect 120 is only possible by guessing. Your instructor sets the score and time that count as acceptable.</p>`,
  groups:[
    {title:'Component testing',items:[
      {id:'diode',title:'Basic Diode Testing',icon:'diode',sub:'ohmmeter tests on eleven diodes',
        intro:CC.introPage({text:two(`<p>A good diode conducts in one direction only, so an ohmmeter shows a <b>low</b> reading with the probes one way and a <b>high</b> reading (over range: this meter shows 99999) with them reversed. In a good diode the high reading is at least ten times the low one.</p><p>Most failed diodes are either <b>shorted</b> (low resistance both ways) or <b>open</b> (high resistance both ways).</p><p>For a good diode you can also find the leads: in the low-resistance direction, the <b>positive (red) probe is on the anode</b>. The other lead is the cathode, usually marked with a band.</p><p>The exact number of ohms does not matter. It depends on the voltage your meter applies, so different meters give very different readings for the same diode. Some meters apply too little voltage to turn a diode on at all, which can make a good diode look open; that is why most digital meters have a separate diode-test mode. The meter in this exercise applies enough voltage to forward bias silicon diodes and LEDs, and it reads every good junction at roughly 340 to 440 Ω in the forward direction, LEDs included. A shorted diode usually reads close to 0 Ω, but some shorted diodes read a few hundred ohms in <i>both</i> directions; what marks them as shorted is that the reading is low both ways.</p>`,SK.wrap(200,120,SK.diode([20,60],[180,60],'')+SK.t(30,95,'Anode',{a:'middle',w:600})+SK.t(170,95,'Cathode',{a:'middle',w:600}))),
          how:'<p>Test eleven diodes. The red (+) probe is on one lead and the black (−) probe on the other; tap a lead or press <b>Reverse the probes</b> to swap them. The probes stay the way you left them when the next diode comes up. Pick one of the four answers and press <b>Grade selected answer</b>.</p><p><b>Scoring.</b> Each diode is worth 100/11 = 9.09 points, and readings are free. Your score is the points for the diodes you identify correctly. If you are wrong, the right answer is highlighted with an explanation, and you can keep measuring before you press <b>Go to next problem</b>.</p>'}),
        run:(el,s)=>SK.ohmBench(el,s,{count:11,noun:'Diode',build:diodeBuild})},
      {id:'trans',title:'Basic Transistor Testing',icon:'trans',sub:'identify NPN/PNP, base lead, faults',
        intro:CC.introPage({text:two(`<p>You can find most failed bipolar transistors with an ohmmeter, because a transistor behaves like two diodes that share the base. In an NPN transistor the base is P-type and the emitter and collector are N-type; in a PNP transistor it is the other way round. A transistor is good when:</p><ol><li>The base-emitter junction tests like a good diode.</li><li>The base-collector junction tests like a good diode.</li><li>Emitter to collector reads high (over range: this meter shows 999999) with the probes either way round.</li></ol><p>Most failed transistors have a <b>shorted</b> junction (low both ways) or an <b>open</b> junction (high both ways).</p><p>To find the base, look for the one lead that reads low to <i>both</i> other leads with the same probe on it. If that probe is the <b>red (+)</b> one, current flows into a P-type base: the transistor is <b>NPN</b>. If it is the <b>black (−)</b> one, the base is N-type: the transistor is <b>PNP</b>. For example, with the black probe on lead A, touching the red probe to either other lead reads low. Then A is the base of a PNP transistor. It is good if both readings go over range when the probes are reversed and the other two leads read OL to each other.</p><p>A systematic order of measurements gets you there fastest.</p>`,SK.wrap(250,110,SK.bjt(60,55,{label:'NPN'}).svg+SK.bjt(180,55,{pnp:true,label:'PNP'}).svg)),
          how:'<p>Analyze twelve transistors. The two probes are always on two of the three leads. Tap a lead with a probe on it to move that probe to the free lead; tap the free lead to reverse the probes. Pick one of the eight answers and press <b>Grade selected answer</b>.</p><p><b>Scoring.</b> Each transistor is worth 100/12 = 8.33 points, and readings are free. Your score is the points for the transistors you identify correctly. If you are wrong, the right answer is highlighted with an explanation, and you can keep measuring before moving on.</p>'}),
        run:(el,s)=>SK.ohmBench(el,s,{count:12,noun:'Transistor',build:transistorBuild})},
    ]},
    {title:'Small-signal amplifiers',items:[
      wsMod('ce1','Common Emitter Amp One','trans','base bias','bb',baseBias,schCE('bb')),
      wsMod('ce2','Common Emitter Amp Two','trans','voltage divider bias','div',()=>divider('div'),schCE('div')),
      wsMod('ce3','Common Emitter Amp Three','trans','divider bias with emitter bypass','byp',()=>divider('byp'),schCE('byp')),
      wsMod('cc','Common Collector Amplifiers','trans','emitter follower','cc',()=>divider('cc'),schCE('cc')),
      wsMod('cb','Common Base Amplifiers','trans','low input impedance, high gain','cb',()=>divider('cb'),schCE('cb')),
    ]},
    {title:'Class B power amplifiers',items:[
      wsMod('pa1','Class B Power Amp One','amp','single source push-pull','one',()=>classB('one'),schB('one',{cap:'C2'})),
      wsMod('pa2','Class B Power Amp Two','amp','dual source push-pull','two',()=>classB('two'),schB('two')),
      wsMod('pa3','Class B Power Amp Three','amp','darlington push-pull','dar',()=>classB('dar'),schB('dar')),
    ]},
    {title:'Troubleshooting',items:[
      {id:'ts1',title:'Troubleshooting Simple Amplifiers',icon:'wrench',sub:'base biased CE amplifier',intro:CC.introPage({text:two(TS_TEXT('base biased common emitter',10),schCE('bb')),how:TS_HOW}),run:(el,s)=>SK.ampBench(el,s,{count:10,points:12,build:()=>ampBoard('bb')})},
      {id:'ts2',title:'Troubleshooting CE Amplifiers',icon:'wrench',sub:'voltage divider CE amplifier',intro:CC.introPage({text:two(TS_TEXT('voltage divider biased common emitter',10),schCE('byp',{out:'C3',byp:'C2'})),how:TS_HOW}),run:(el,s)=>SK.ampBench(el,s,{count:10,points:12,build:()=>ampBoard('div')})},
    ]}
