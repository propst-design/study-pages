const TXT={
ohmmeters:`<p>An <b>ohmmeter</b> measures resistance, in ohms (Ω). Resistance tells you how hard it is for current to flow: at the same voltage, an 8 Ω part passes half the current of a 4 Ω part.</p>
<p>Two kinds of reading do most of the work when you troubleshoot:</p>
<ul><li><b>About 0 Ω</b>: a good wire, a closed switch, a good fuse, or a <b>short circuit</b> (two conductors touching that should be kept apart).</li>
<li><b>Infinite resistance</b>: an <b>open circuit</b>, such as a broken wire, a blown fuse, an open switch or a burned-out part. Meters show this as <span class="kbd">OL</span>, <span class="kbd">∞</span> or a lone <span class="kbd">1</span>. The meter in this program shows <span class="kbd">∞</span>.</li></ul>
<p>The meter's own battery pushes a small test current through whatever is between the probes. The meter measures that current and works out the resistance. <b>So the circuit must be unpowered.</b> Any outside voltage, even a small battery or a charged capacitor, makes the reading meaningless and can damage the meter. Switch the power off, disconnect the battery and discharge capacitors before you measure.</p>
<p>The meter reads everything connected between its probes, not just the part you're looking at. If a part is still wired into a circuit, other parts in parallel or in series show up in the reading. In these activities you'll often measure a path through several parts and work out which one is bad.</p>
<p>Most of the time an ohmmeter is one function of a digital multimeter (DMM), picked with the range switch.</p>
<h3>Ohm's law</h3><p>One ohm is the resistance that lets 1 ampere flow when 1 volt is applied:</p>${M('R=\\frac{V}{I}')}
<p>where ${m('R')} is resistance in ohms, ${m('V')} is voltage in volts and ${m('I')} is current in amperes. For example, ${m('R=\\frac{0.5\\,\\text{V}}{0.05\\,\\text{A}}=10\\,\\Omega')}. The symbol Ω (capital omega) means ohms, so 4.5 Ω is 4.5 ohms.</p>`,
purpose:`<p>A digital ohmmeter's numbers are easy to read, but what do they tell you about the circuit? These activities let you practice reading resistance in context. Each one is a simulated lab bench: you move the probes, read the meter and decide what's wrong. Every activity picks new values and faults each time you run it, so you can practice as often as you like without memorizing answers. You get immediate feedback, and the correct answer is shown when you miss one.</p>
<p>These skills apply to electronics, electrical, automotive and HVAC work, and to any job that uses an ohmmeter.</p>
<h3>The activities</h3>
<p><b>Open Circuits One and Two</b>: find open (broken) wires in a conduit or wiring harness. Any combination of the three wires may be open.</p>
<p><b>Short Circuits One and Two</b>: find wires that are shorted together inside a conduit.</p>
<p><b>Wire Testing One and Two</b>: shorts and opens can both be present. Find the exact fault.</p>
<p><b>Circuit Tracing One and Two</b>: use resistance readings to work out the internal wiring of an unmarked module. Several wiring patterns look alike, so measure carefully.</p>
<p><b>Troubleshooting One and Two</b>: test a PC board with a switch, a lamp, a resistor and a fuse. Faults can also be open copper traces.</p>
<p><b>Troubleshooting Three and Four</b>: test a PC board with a switch, a relay, a diode, a resistor and an inductor. The parts can only be reached in series pairs, so you'll need to reason about which part is bad.</p>
<p>In each pair, the "Two" (or "Four") version is the same activity with stricter scoring: only a set number of probe moves are free, and each extra move costs a point.</p>`,
using:`<h3>How the program works</h3><p>Pick an activity from the main menu. Each one starts with a short introduction to the ideas you need. Choose <b>Begin</b> when you're ready.</p>
<p>In an activity, tap a test point to move a meter probe there (red = +, black = −). Like a real digital meter, the simulated meter has a small calibration error (up to about ±2%) and its last digit flickers a little. The program times each activity.</p>
<p>When you finish, you'll see your score. If you're signed in with a name and ID you can print a certificate with your name, ID, date, time on task, score and a validity code that lets an instructor check the certificate hasn't been altered.</p>`,
bench:`<p>Practice testing parts on a small PC board. It isn't graded, so it also works well as a classroom demonstration.</p>
<p>Tap a part to connect the ohmmeter probes across it. Compare each reading with the parameter list. Exactly one part on each board is defective: a resistor can be open or out of tolerance, the fuse can be blown, or the inductor can be open. Select the defect, then choose <b>Check selection</b>. Choose <b>Next PC board</b> for a new board.</p>
<p><b>Watch out:</b> each new board starts with its two D cells connected (power ON). Connecting an ohmmeter to a powered circuit destroys the meter. Choose <b>OFF</b> to disconnect the battery before you measure. If you forget, you'll have to buy a new meter. The program counts how many you buy.</p>
<p>With the battery disconnected, the series loop is broken, so each part reads its own resistance.</p>`,
open1:`<p>A circuit is a complete path for current. An <b>open circuit</b> has a break somewhere in that path. A switch makes an open on purpose: close it and the lamp lights; open it and current stops (figure 1). A broken wire makes an open by accident. A conductor can break inside its insulation and still look perfect from the outside, so you need a meter to find it.</p>
<h3>Finding an open with an ohmmeter</h3><p>Measure each wire from one end to the other. A good wire reads a fraction of an ohm, even a long one. The longest wires in a car measure well under 1 Ω. An open wire reads infinite resistance, shown as <span class="kbd">∞</span> on this meter (other meters show <span class="kbd">OL</span> or a lone <span class="kbd">1</span>).</p>`,
short1:`<p>A <b>short circuit</b> is a near-zero-resistance path between two conductors that should be separate. A short lets current bypass the load: the load gets no current while a very large current flows from the source. Shorts are dangerous because they cause overheating and fires, which is why circuits have fuses and circuit breakers.</p>
<h3>Finding a short with an ohmmeter</h3><p>Measure between two wires at the same end of the conduit. Wires that are properly insulated from each other read infinite resistance (<span class="kbd">∞</span>). Wires that are shorted together read near 0 Ω: the resistance of the two wire sections plus the short.</p>
<p><b>Tip:</b> three wires make three pairs (red–purple, red–green, purple–green). Check every pair. "All three wires shorted together" shows near 0 Ω on all three pairs.</p>`,
wire1:`<p><b>Opens:</b> measure each wire end to end. A good wire reads a fraction of an ohm; an open wire reads <span class="kbd">∞</span>.</p>
<p><b>Shorts:</b> measure between pairs of wires. Separate wires read <span class="kbd">∞</span>; shorted wires read near 0 Ω.</p>
<p>You need both kinds of test for every situation. Plan the order so each probe move gives you new information. For example, after measuring a wire end to end, leave one probe where it is and move the other to the next wire.</p>`,
trace:`<p>A batch of wiring modules was built without type labels. Each module has four wires entering on the left and four leaving on the right (figure 1). Your job is to use the ohmmeter to identify each module's type.</p>
<p>There are ten types, A through J, and each is wired a little differently. Some route a wire straight across, some swap wires, some leave a wire unconnected, and some add a jumper that ties two wires together inside the module. A connected route reads a fraction of an ohm. Wires with no connection read <span class="kbd">∞</span>.</p>
<p><b>Watch for jumpers.</b> When two left-side wires are jumpered, each of them connects to both of their right-side wires, and the two left wires read near 0 Ω to each other. Always check left-to-left as well as left-to-right.</p>
<p>Sketch the module and write down each reading as you go so you don't repeat measurements.</p>`,
ts1:`<p>The red probe goes on pad A, B or C; the black probe on pad D, E or F. That gives nine probe positions. Here's what each one tests.</p>
<table class="t small"><thead><tr><th>Probes</th><th>Path measured</th><th>Normal reading</th></tr></thead><tbody>
<tr><td>A–F</td><td>SW1, fuse</td><td>fuse resistance (fraction of an ohm) with SW1 ON; ∞ with SW1 OFF</td></tr>
<tr><td>A–E</td><td>SW1, trace 2</td><td>near 0 Ω with SW1 ON; ∞ with SW1 OFF</td></tr>
<tr><td>A–D</td><td>SW1, trace 2, lamp</td><td>lamp resistance (about 10 Ω) with SW1 ON; ∞ with SW1 OFF</td></tr>
<tr><td>B–F</td><td>trace 3, fuse</td><td>fuse resistance</td></tr>
<tr><td>B–E</td><td>trace 3, trace 2</td><td>near 0 Ω</td></tr>
<tr><td>B–D</td><td>trace 3, trace 2, lamp</td><td>lamp resistance</td></tr>
<tr><td>C–F</td><td>R1, fuse</td><td>R1 + fuse</td></tr>
<tr><td>C–E</td><td>R1, trace 2</td><td>R1 (traces are near 0 Ω)</td></tr>
<tr><td>C–D</td><td>R1, trace 2, lamp</td><td>R1 + lamp</td></tr></tbody></table>
<p><b>Reading the results.</b> Any open part in a series path makes the whole path read ∞, so one ∞ reading only tells you that <i>some</i> part of that path is open. Find a second path that shares just one of those parts. For example, if A–D reads ∞ but A–E is normal, the switch and trace 2 are fine, so the lamp is open.</p>
<p><b>The switch:</b> test it in both positions. A switch that reads ∞ when ON is stuck open. A switch that reads near 0 Ω when OFF is stuck closed.</p>
<p><b>The resistor:</b> use C–E, which adds only a near-zero trace to R1. R1 is good if it reads within ±10% of its marked value. Below 90% is "below tolerance"; above 110% is "above tolerance". Through C–D you'd have to subtract the lamp resistance first.</p>
<p><b>Common mistakes:</b> deciding too quickly from one ∞ reading, forgetting to try SW1 in both positions, and missing an out-of-tolerance resistor because the reading "looks about right". Work out the actual ±10% limits.</p>`,
ts3:`<p>This PC board has a switch, a relay, a diode, a resistor and an inductor. The ohmmeter has a <b>Diode Test</b> setting and a <b>polarity switch</b> that swaps which probe is positive.</p>
<h3>Testing each part</h3>
<p><b>Switch</b>: near 0 Ω when ON, ∞ when OFF.</p>
<p><b>Relay</b>: the coil and the contacts are tested separately. The coil should read close to its rated resistance. With the relay not energized (it can't be energized during an ohmmeter test), <b>normally open</b> contacts read ∞ and <b>normally closed</b> contacts read near 0 Ω. Contacts that read the opposite way are defective.</p>
<p><b>Diode</b>: a diode conducts in one direction only, from anode to cathode. The banded end is the cathode. A silicon diode conducts only when its anode is about 0.6 to 0.7 V more positive than its cathode. On the ordinary Ohms setting the meter's test voltage is too low to turn the diode on, so a good diode reads ∞ both ways. The <b>Diode Test</b> setting uses a higher test voltage. A good diode then conducts when the meter's <b>+</b> lead is on the anode and <b>−</b> is on the cathode, and reads ∞ the other way. A shorted diode reads near 0 Ω both ways. An open diode reads ∞ both ways.</p>
<p>The resistance of a conducting diode isn't a fixed value. It depends on the current: a few hundred ohms at a few milliamps, falling to a fraction of an ohm at several amps. This simulated meter shows that forward resistance in Diode Test mode. Many real meters show the forward voltage instead (about 0.5 to 0.7 V for a good silicon diode).</p>
<p><b>Resistor</b>: within ±10% of its marked value.</p>
<p><b>Inductor</b>: an inductor is a coil of insulated wire, and an ohmmeter reads the resistance of that wire. That can be a fraction of an ohm or thousands of ohms, depending on the number of turns and the wire size. Here it should be close to the listed value. ∞ means the winding is open.</p>
<h3>The nine probe positions</h3>
<p>Pads A, B and C each reach the center junction through one part (switch, diode, resistor). Pads D, E and F each reach it through one part (relay coil, relay contacts, inductor). So every reading is two parts in series.</p>
<table class="t small"><thead><tr><th>Probes</th><th>Path measured</th><th>Normal reading</th></tr></thead><tbody>
<tr><td>A–D</td><td>switch, relay coil</td><td>coil resistance with switch ON; ∞ with switch OFF</td></tr>
<tr><td>A–E</td><td>switch, contacts</td><td>NC: near 0 Ω with switch ON. NO: ∞. Always ∞ with switch OFF</td></tr>
<tr><td>A–F</td><td>switch, inductor</td><td>inductor resistance with switch ON; ∞ with switch OFF</td></tr>
<tr><td>B–D, B–E, B–F</td><td>diode + coil / contacts / inductor</td><td>∞ on Ohms. On Diode Test with <b>+</b> on black (the probe on the anode side): diode forward resistance plus the other part. ∞ with <b>+</b> on red</td></tr>
<tr><td>C–D</td><td>resistor, coil</td><td>resistor + coil</td></tr>
<tr><td>C–E</td><td>resistor, contacts</td><td>NC: resistor alone. NO: ∞</td></tr>
<tr><td>C–F</td><td>resistor, inductor</td><td>resistor + inductor</td></tr></tbody></table>
<p><b>Strategy:</b> the diode can only be tested in series with a good part, so check the coil or inductor first (through A or C). A diode-test reading that is "low" should still be clearly higher than the other part alone. If it equals the coil or inductor resistance, the diode is shorted. To check the resistor, subtract the coil or inductor resistance from C–D or C–F, or read C–E directly when the contacts are normally closed.</p>
<p><b>Common mistakes:</b> calling the diode open after testing it only on the Ohms setting, forgetting to try both polarities, and forgetting the switch in both positions.</p>`
};

  manual:`<h2>About this program</h2><p>Ohmmeter Challenge is a set of simulated lab activities for learning to troubleshoot with a digital ohmmeter. Students move the meter probes, interpret the readings and diagnose the fault. Every answer is graded right away, and the correct answer is shown after a miss. The activities also work for whole-class demonstrations on a projector or large screen.</p><p>New values and faults are chosen each time an activity runs, so students can repeat an activity without memorizing answers. Each activity opens with an introduction to the ideas it uses. Choose <b>Begin</b> to start. The program records the time on task. Signed-in students can print a certificate showing the activity, name, ID, date and time, score, time on task and a validity code. Use <b>Check validity</b> to confirm a certificate hasn't been altered.</p><p>To report progress, students can hand in certificates, or download or print the grade file. Instructors can also watch students work through an activity.</p>
  <h3>Scoring</h3><p>Every activity has 10 items worth 10 points each, and the score is the percentage of the 100 possible points. In the "One" and "Three" activities, measurements are free. In the stricter "Two" and "Four" activities, each item allows a set number of free probe moves (placing or moving either probe counts as a move). Each extra move costs one point, and a wrong answer earns 0 for that item. The free allowance is enough for a well-planned set of measurements, so an efficient technician can still score 100%. (The original program scored these activities as 14 or 20 points per item minus one point per move, reported as 0 to 140 or 0 to 200.)</p>`+TXT.purpose,
  groups:[
    {title:'Getting started',items:[
      {id:'intro',title:'Introduction',icon:'meter',sub:'ohmmeters · PC board testing practice',graded:false,

      {id:'short1',title:'Short Circuits One',icon:'wire',sub:'find shorted wires in a conduit',intro:intro(TXT.short1+condList(SHORT_OPTS.map(o=>o[0])),HOW.wire(false),`<span>${lcd('0.04 Ω')}<br><span class="small muted">shorted wires</span></span><span>${lcd('∞')}<br><span class="small muted">separate wires</span></span>`),run:wireAct(SHORT_OPTS,null)},
      {id:'short2',title:'Short Circuits Two',icon:'wire',sub:`${FREE.short2} free moves, then −1 per move`,intro:intro(twoNote('Short Circuits One','short2')+TXT.short1+condList(SHORT_OPTS.map(o=>o[0])),HOW.wire(true,FREE.short2)),run:wireAct(SHORT_OPTS,'short2')},
      {id:'wire1',title:'Wire Testing One',icon:'wire',sub:'shorts and opens',intro:intro(`<p>This time you need to find both shorts and opens. Each situation has one of 11 conditions, and some have no fault at all.</p>`+TXT.wire1+condList(WIRE_OPTS.map(o=>o[0])),HOW.wire(false)),run:wireAct(WIRE_OPTS,null)},
      {id:'wire2',title:'Wire Testing Two',icon:'wire',sub:`${FREE.wire2} free moves, then −1 per move`,intro:intro(twoNote('Wire Testing One','wire2')+TXT.wire1+condList(WIRE_OPTS.map(o=>o[0])),HOW.wire(true,FREE.wire2)),run:wireAct(WIRE_OPTS,'wire2')},
    ]},
    {title:'Circuit tracing',items:[
      {id:'trace1',title:'Circuit Tracing One',icon:'chip',sub:'identify module types A–J',intro:intro(TXT.trace,`<p>All ten module types look the same from outside. The possible wiring diagrams are shown with the answer choices. Tap the wire ends to move the probes, measure any route you like, then select the matching diagram and choose <b>Grade item</b>.</p>`+K.scoreHow({points:10}),moduleSvg()),run:traceAct(null)},
      {id:'trace2',title:'Circuit Tracing Two',icon:'chip',sub:`${FREE.trace2} free moves, then −1 per move`,intro:intro(twoNote('Circuit Tracing One','trace2')+TXT.trace,`<p>All ten module types look the same from outside. The possible wiring diagrams are shown with the answer choices.</p>`+K.scoreHow({points:10,free:FREE.trace2}),moduleSvg()),run:traceAct('trace2')},
    ]},
    {title:'PC board troubleshooting',items:[
      {id:'ts1',title:'Troubleshooting One',icon:'wrench',sub:'switch, lamp, resistor, fuse',intro:intro(`<p>An ohmmeter can find faults in many kinds of parts. In this activity you'll troubleshoot PC boards like the one shown. Each board is in one of the ten conditions listed below.</p>`+condList(TS1_OPTS)+TXT.ts1,HOW.board(1,null),board1Svg({sw:'ON'})),run:tsAct(board1Item,null)},
